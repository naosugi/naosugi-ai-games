<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>作ってみたゲームの発表会（仮）</title>
<meta name="description" content="令和の技術で令和の発想を平成初期風ゲームに。個人開発のHTMLゲーム置き場">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>作ってみたゲームの発表会（仮）</h1>
    <p class="catch">令和の技術で令和の発想を平成初期風ゲームに</p>
    <p class="lead">個人で作ったHTMLゲームの置き場です。どのゲームもHTMLファイル1つで動き、インストールは要りません。ファイルをダウンロードすれば、インターネットがなくても遊べます。</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer>記録やランキングは各ブラウザ内に保存されます。</footer>
</div>
<script>
(() => {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const grid = document.getElementById('grid');
  fetch('collections.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(list => {
      grid.innerHTML = list.filter(c => !c.hidden).map(c => `
        <a class="card coll" href="${esc(c.path)}">
          <div class="thumb" ${c.thumbnail ? `style="background-image:url('${esc(c.thumbnail)}')"` : ''}>${c.thumbnail ? '' : '<div class="ph">🎮</div>'}</div>
          <div class="body">
            <span class="kind">${c.kind === 'event' ? 'イベント' : 'サンプル'}</span>
            <h2>${esc(c.title)}</h2>
            ${c.date || c.place ? `<div class="evmeta">${c.date ? '<span>📅 ' + esc(c.date) + '</span>' : ''}${c.place ? '<span>📍 ' + esc(c.place) + '</span>' : ''}</div>` : ''}
            <p>${esc(c.lead)}</p>
            <span class="play" style="align-self:flex-start;margin-top:auto">一覧を見る ▶</span>
          </div>
        </a>`).join('');
    })
    .catch(() => { grid.innerHTML = '<div class="msg">一覧を読み込めませんでした。Web サーバー経由で開いてください。</div>'; });
})();
</script>
</body>
</html>
