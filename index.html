<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>naosugi AI games</title>
<meta name="description" content="ブラウザでそのまま遊べるHTMLゲーム集">
<style>
:root{color-scheme:dark;--bg:#060b1d;--card:#0f1b36;--line:#2a4670;--text:#e8f2ff;--sub:#9fb6d6;--cyan:#65f6ff;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans",sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#16306055,transparent),var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding:40px 16px 56px}
header{margin-bottom:24px}
h1{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:.03em;line-height:1.1}
h1 span{color:var(--cyan)}
.lead{color:var(--sub);margin:10px 0 0;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 18px}
.search{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0b1530;color:var(--text)}
.search:focus{outline:2px solid var(--cyan);outline-offset:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#0b1530;color:var(--sub);cursor:pointer}
.tag.on{border-color:var(--cyan);color:var(--cyan);background:#0f2a44}
.count{color:var(--sub);font-size:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 8px 30px #0a719244;outline:none}
.thumb{position:relative;aspect-ratio:16/9;background:#0a1228 center/cover no-repeat}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;opacity:.5}
.new{position:absolute;top:10px;left:10px;font-size:11px;font-weight:900;letter-spacing:.06em;background:var(--gold);color:#1a1200;border-radius:6px;padding:3px 7px}
.body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{margin:0;font-size:18px}
.body p{margin:0;font-size:13px;line-height:1.6;color:#cfe0f7}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px}
.chip{font-size:11px;border:1px solid #35557f;border-radius:6px;padding:2px 6px;color:#bcd3ef}
.play{margin-top:6px;align-self:flex-start;font-weight:900;font-size:14px;padding:9px 16px;border-radius:10px;color:#081020;background:linear-gradient(100deg,#6df5ff,#b5ffac)}
.msg{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--sub);text-align:center;line-height:1.7}
footer{margin-top:40px;color:#6f86a8;font-size:12px}
footer a{color:#8fb3d9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>naosugi <span>AI games</span></h1>
    <p class="lead">ブラウザでそのまま遊べるゲーム集。インストール不要。</p>
  </header>
  <div class="bar">
    <input class="search" id="q" type="search" placeholder="ゲームを検索" aria-label="ゲームを検索">
    <div class="tags" id="tags"></div>
  </div>
  <div class="count" id="count"></div>
  <main class="grid" id="grid"></main>
  <footer>記録やランキングは各ブラウザ内に保存されます。 ・ <a href="https://github.com/naosugi/naosugi-ai-games">GitHub</a></footer>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const NEW_DAYS = 14;
  let games = [], activeTag = '';

  function isNew(g) {
    const t = Date.parse(g.added); return !isNaN(t) && Date.now() - t < NEW_DAYS * 864e5;
  }
  function render() {
    const q = $('q').value.trim().toLowerCase();
    const list = games.filter(g => (!activeTag || (g.tags || []).includes(activeTag)) &&
      (!q || [g.title, g.description, ...(g.tags || [])].join(' ').toLowerCase().includes(q)));
    $('count').textContent = list.length + ' / ' + games.length + ' 本';
    $('grid').innerHTML = list.length ? list.map(g => `
      <a class="card" href="${esc(g.path)}">
        <div class="thumb" ${g.thumbnail ? `style="background-image:url('${esc(g.thumbnail)}')"` : ''}>
          ${g.thumbnail ? '' : '<div class="ph">🎮</div>'}${isNew(g) ? '<span class="new">NEW</span>' : ''}
        </div>
        <div class="body">
          <h2>${esc(g.title)}</h2>
          <p>${esc(g.description)}</p>
          <div class="meta">${g.playtime ? '<span>⏱ ' + esc(g.playtime) + '</span>' : ''}${g.controls ? '<span>🕹 ' + esc(g.controls) + '</span>' : ''}</div>
          <div class="chips">${(g.tags || []).map(t => '<span class="chip">' + esc(t) + '</span>').join('')}</div>
          <span class="play">遊ぶ ▶</span>
        </div>
      </a>`).join('') : '<div class="msg">該当するゲームがありません</div>';
  }
  function renderTags() {
    const all = [...new Set(games.flatMap(g => g.tags || []))];
    $('tags').innerHTML = ['', ...all].map(t => `<button class="tag${t === activeTag ? ' on' : ''}" data-t="${esc(t)}">${t ? esc(t) : 'すべて'}</button>`).join('');
  }
  $('tags').addEventListener('click', e => { const b = e.target.closest('.tag'); if (!b) return; activeTag = b.dataset.t; renderTags(); render(); });
  $('q').addEventListener('input', render);

  fetch('games.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      games = (Array.isArray(data) ? data : []).slice().sort((a, b) => String(b.added || '').localeCompare(String(a.added || '')));
      renderTags(); render();
    })
    .catch(() => {
      $('grid').innerHTML = '<div class="msg">ゲーム一覧を読み込めませんでした。<br>ファイルを直接開いた場合（file://）は読み込めません。GitHub Pages など Web サーバー経由で開いてください。</div>';
    });
})();
</script>
</body>
</html>
