<div class="hd"><p class="kick">なぜ、この講座を？　2/2</p><h2>でも、何が楽しいかを決めるのは人</h2></div>
<div class="panel v" style="flex:1">
<h3>この講座で練習すること</h3><ul><li>面白さは、<b>自分たちで考える</b></li><li>ぶらさない点を、<b>先に決める</b></li><li>行き詰まったら、<b>作り直す</b></li></ul></div>
<p class="ybox">ゲームは題材。<b>仕事や勉強でAIを使うときも同じ</b></p>
<aside class="note"><p>講座を開く理由のふたつめ。作れるようになっても、面白くなるとは限りません。同じゲームでも、楽しいと感じる人とそうでない人がいます。何が楽しいか、何が大事かは、使う人が決めることです。</p><p>この講座ではゲームを題材にしますが、「先に決めてから頼む」「確かめるのは人」「作り直しをこわがらない」は、生成AIとの付き合い方全般に使えます。</p></aside>
</section>
