<div class="hd"><p class="kick">中間講義　例</p><h2>設計図にすると、こうなる</h2></div>
<div class="panel" style="padding:8px 16px">
<table>
<tr><td>名前</td><td>つみきドカーン！</td></tr>
<tr><td>ひとことで</td><td>積み木をボールで倒す</td></tr>
<tr><td>遊ぶ端末</td><td>スマホ</td></tr>
<tr><td>面白い点 ★</td><td>子どもが喜ぶ、ドーパミンが出る感じ</td></tr>
<tr><td>操作 ★</td><td>上をタップで落とす、下はパチンコ</td></tr>
<tr><td>終わり方</td><td>おまかせ（AIと相談）</td></tr>
</table>
</div>
<aside class="note"><p>実演で見せた「つみきドカーン！」を作ったときに、講師がAIに最初に送った文を、設計図の形に並べ直したものです。</p><p>終わり方は最初の文には書いていませんでした。AIに質問されてから「面クリア型にしたい」と決めました。全部埋まっていなくても大丈夫です。</p><p>★は「これだけは変えない（ぶらさない点）」の印です。ワークシートの設計図と同じ書き方です。</p></aside>
