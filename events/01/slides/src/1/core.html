<div class="hd"><p class="kick">中間講義</p><h2>「ぶらさない点」と「最小版」を決める</h2></div>
<div class="cols">
<div class="panel"><h3>ぶらさない点</h3>
<p>これだけは変えない、というところ。</p><p>ここを変えたくなったら、<b>最初から考え直す</b>。</p>
<p class="s">例：ウォンバット☆レガシーRPGは「RPGがはじめての人でも最後まで遊べる」</p></div>
<div class="panel"><h3>最小版</h3>
<p>「これがあれば遊べる」だけのゲーム。</p><p><b>第2回の終わりまでは、最小版から出ない。</b></p></div>
</div>
<p class="ybox" style="font-size:30px">実例：名を持つ十二の兵は「シンプルな戦闘シミュレーション」から始めて、5日ほどで3つの物語を持つゲームに広がった。<b>広げるのは、遊べてから。</b></p>
</section>
