<div class="hd"><p class="kick">中間講義</p><h2>「ぶらさない点」と「最小版」</h2></div>
<div class="cols">
<div class="panel"><h3>ぶらさない点</h3><p>これだけは変えない。</p><p>変えたくなったら、<b>最初から考え直す</b>。</p></div>
<div class="panel"><h3>最小版</h3><p>「これがあれば遊べる」<br>だけのゲーム。</p><p><b>第2回は、最小版まで。</b></p></div>
</div>
<p class="ybox">広げるのは、<b>遊べてから</b></p>
<aside class="note"><p>ぶらさない点の例：実演で見せたウォンバット☆レガシーRPGは「RPGがはじめての人でも最後まで遊べる」。</p></aside>
