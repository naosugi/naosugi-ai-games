<section id="help" class="px">
<div class="hd"><p class="kick">開発中</p><h2>困ったときは</h2></div>
<div class="panel" style="padding:8px 16px">
<table>
<tr><td>止まった</td><td>手を挙げる</td></tr>
<tr><td>動かない</td><td>エラーを貼って「直して」</td></tr>
<tr><td>思っていたのと違う</td><td>設計図を見直す</td></tr>
<tr><td>意見が割れた</td><td>遊ぶ人が決める</td></tr>
</table>
</div>
<aside class="note"><ul><li>上限で止まった：手を挙げる。続ける方法を、講師といっしょに考えます。</li><li>真っ白・動かない：エラーの文を貼って「動かないので直して」。2回直らなければコツ8。</li><li>思っていたのと違う：設計図のどこが伝わっていないかを、親子で見直す。</li><li>スマホで開けない：AIの画面の中で遊ぶ。発表で使う端末で動くかは、最後に確かめる。</li><li>親子で意見が割れた：遊ぶ人が決める。設計図の「ぶらさない点」に戻る。</li></ul></aside>
</section>
