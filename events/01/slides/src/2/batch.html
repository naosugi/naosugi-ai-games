<div class="hd"><p class="kick">コツ4　送るとき</p><h2>何をまとめて送るか</h2></div>
<div class="cols3"><div class="panel center"><h3>設計を<br>変える話</h3><p><b>単独で</b></p></div><div class="panel center"><h3>追加・<br>変更</h3><p><b>まとめて<br>OK</b></p></div><div class="panel center"><h3>不具合・<br>数値</h3><p><b>まとめて<br>OK</b></p></div></div>
<p class="ybox">「<b>やらないこと</b>」も1行書く</p>
<aside class="note"><p>設計を変える話：ぶらさない点や面白さの中心が変わるなら、単独で送る。紙に戻って作り直す前提で。</p><p>追加・変更と、不具合・数値の直しは、まとめて送ってよい。ただし、設計を変える話と不具合の直しは混ぜない。</p><p>「やらないこと」の例：「難易度選択はいらない」。</p></aside>
</section>
