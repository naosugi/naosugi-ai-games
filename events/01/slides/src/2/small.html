<div class="hd"><p class="kick">コツ2　頼む前</p><h2>まず「最小版」を作る</h2></div>
<div class="cols">
<div class="panel"><h3>軽い（おすすめ）</h3>
<ul><li>ボタンや絵文字で作る画面</li><li>平面（2D）の動き</li><li>設計図の「これがあれば遊べる」だけ</li></ul>
<p class="s">例：講師のクレーンゲーム　約30KB<br>講師の子育てゲーム　約60KB</p></div>
<div class="panel"><h3>重い（無料プランでは避ける）</h3>
<ul><li>立体（3D）の表示</li><li>たくさんの絵や長い文章</li><li>最初から全部の機能</li></ul>
<p class="s">例：講師の3Dシューティング　約620KB<br>（子育てゲームの約10倍）</p></div>
</div>
<p class="ybox">ファイルが大きいほど、直すたびにたくさん使う。<b>追加は、最小版が動いてから。</b></p>
