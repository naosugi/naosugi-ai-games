<meta property="og:description" content="東京・多摩地域の30市町村をめぐるすごろく。観光スポットや施設を買って名物を集め、戦闘力を上げて駅を守る動物とバトル。乗っ取りや人気イベントで逆転も。最大4人・チーム戦と市町村図鑑つき。">

<style>
/* ===== ウォンバット☆たま旅すごろく：多摩の昼の配色 ===== */
:root{
  --paper:#F5F6EF;--surface:#FFFFFF;--ink:#23302A;--muted:#5F6D66;--line:#DCE3D8;
  --euca:#4F8A76;--euca-d:#3C6F5E;--wattle:#E3B23C;--wattle-l:#FFF3CF;
  --s0:#2F7DD1;--s1:#E0584F;--s2:#2E9E5B;--s3:#D69A12;
  --r-lg:18px;--r-md:13px;--r-sm:9px;
  --shadow:0 1px 2px rgba(30,43,47,.06),0 6px 18px rgba(30,43,47,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--wattle);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
header{position:sticky;top:0;z-index:5;background:rgba(245,246,239,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#top{display:flex;align-items:center;gap:8px;max-width:820px;margin:0 auto;padding:8px 12px}
#top .back{font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
#top .ttl{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top button{font-size:12px;border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
#top #menuBtn{background:var(--ink);border-color:var(--ink);color:#fff}
main{max-width:820px;margin:0 auto;padding:10px max(10px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.tab{display:none}.tab.on{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
button.b{font-size:15px;font-weight:700;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin:3px 4px 3px 0;cursor:pointer;touch-action:manipulation}
button.b:active{transform:scale(.97)}
button.b.pri{background:var(--euca);border-color:var(--euca);color:#fff}
button.b.warn{background:#C8553D;border-color:#C8553D;color:#fff}
button.b.gold{background:var(--wattle);border-color:var(--wattle);color:#3a2a00}
button.b:disabled{opacity:.38;transform:none;cursor:default}
button.b.small{font-size:12.5px;padding:6px 11px}
button.b.wide{display:block;width:100%;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.ghead{font-size:18px;font-weight:800;margin-bottom:4px}
.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle}
canvas{image-rendering:pixelated}
select,input[type=text]{font:inherit;font-size:15px;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink)}
input[type=text]{width:9.5em}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}

/* タイトル */
.hero{position:relative;text-align:center;padding:8px 0 4px}
.hero .logo{font-size:26px;font-weight:900;letter-spacing:.02em;line-height:1.25;margin:6px 0 2px}
.hero .logo small{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.hero svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.hero .wbs{display:flex;justify-content:center;gap:6px;margin-top:-26px;position:relative}
.hero .wbs canvas{width:72px;height:auto}
.menu{max-width:420px;margin:0 auto}

/* セットアップ */
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff;white-space:nowrap}

/* ゲーム画面 */
#players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:8px}
.pc{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:6px 8px;font-size:12.5px;line-height:1.35;position:relative}
.pc.now{box-shadow:0 0 0 3px var(--wattle);}
.pc .nm{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .nm canvas{width:28px;height:auto;flex:0 0 auto}
.pc .st{display:flex;flex-wrap:wrap;gap:2px 10px}
.pc .st b{font-size:13.5px}
.roundbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;margin:2px 2px 6px}
.roundbar .rd{font-weight:800}
.mapwrap{position:relative;background:#DCEBF2;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);touch-action:manipulation}
.mapwrap svg{display:block;width:100%;height:auto;aspect-ratio:1000/749}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.mapbtns button{font-size:12px;font-weight:700;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.92);padding:4px 10px;cursor:pointer}
.town{stroke:#fff;stroke-width:2;cursor:pointer}
.town:hover{filter:brightness(1.04)}
.route{fill:none;stroke:#7a6a52;stroke-width:4;stroke-dasharray:2 9;stroke-linecap:round;opacity:.75}
.mk circle.base{fill:#fff;stroke:#5a4a38;stroke-width:2.5}
.mk text.n{font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#5a4a38}
.mk text.lb{font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3.5px;fill:#2b2a26}
.mk.cur circle.base{stroke:var(--wattle);stroke-width:5}
.small-labels .mk text.lb{display:none}
.pulse{fill:none;stroke:var(--wattle);stroke-width:4;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{r:16;opacity:1}100%{r:34;opacity:0}}
.tok{transition:transform .22s ease}
#act{margin-top:8px}
.tname{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tname .n{font-size:20px;font-weight:900}
.prop{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.prop .ic{font-size:22px;width:34px;text-align:center}
.prop .pn{font-weight:800}
.prop .pd{font-size:12.5px;color:var(--muted)}
.prop .btns{grid-column:1/3;display:flex;flex-wrap:wrap;gap:2px}
.prop .ani{width:40px;height:40px}
.tri{background:var(--wattle-l);border-radius:var(--r-md);padding:8px 10px;font-size:13.5px;margin-top:6px}
.tri b{color:#8A6100}
#log{font-size:12.5px;color:var(--muted);margin-top:6px;max-height:7.5em;overflow:auto}
#log div{padding:1px 0;border-bottom:1px dotted var(--line)}
.waitcpu{font-size:13px;color:var(--muted);padding:6px 0}

/* モーダル */
#modal{position:fixed;inset:0;background:rgba(20,28,26,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
#modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:var(--r-lg);padding:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 8px;font-size:18px}
.die{width:96px;height:96px;margin:10px auto;border-radius:18px;background:#fff;border:3px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12px;gap:4px}
.die i{border-radius:50%;background:transparent}
.die i.on{background:var(--ink)}
.die.red i.on{background:#D23C3C}
.die.roll{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.battle{display:flex;align-items:flex-end;justify-content:space-around;gap:6px;margin:8px 0}
.battle .side{text-align:center;font-size:13px}
.battle .side canvas,.battle .side img{width:96px;height:auto}
.battle .pw{font-size:22px;font-weight:900}
.vs{font-size:22px;font-weight:900;color:#C8553D;align-self:center}
.hit{animation:hit .5s ease 2}
@keyframes hit{0%,100%{transform:translateX(0)}30%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.win{font-size:22px;font-weight:900;text-align:center;color:var(--euca-d);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.rep table{width:100%;border-collapse:collapse;font-size:13.5px}
.rep td{padding:4px;border-bottom:1px solid var(--line)}
.rep td:last-child{text-align:right;font-weight:800}
.evt{background:linear-gradient(135deg,#FFF3CF,#FFE1E8);border-radius:var(--r-md);padding:10px 12px;margin-top:10px}
.evt .big{font-size:17px;font-weight:900}

/* 結果 */
.rk{margin-bottom:10px}
.rk h4{margin:0 0 4px;font-size:15px}
.rk ol{margin:0;padding:0;list-style:none}
.rk li{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rk li .md{width:24px;text-align:center;font-weight:900}
.rk li .v{margin-left:auto;font-weight:800;text-align:right}
.rk li .sub{font-size:11.5px;color:var(--muted);font-weight:400;display:block}

/* スタッフロール */
#roll{position:fixed;inset:0;z-index:30;background:#0E1622;color:#F4F1E6;overflow:hidden}
#roll[hidden]{display:none}
#roll .inner{position:absolute;left:0;right:0;top:100%;text-align:center;padding:0 18px;animation:credits linear forwards}
@keyframes credits{from{transform:translateY(0)}to{transform:translateY(calc(-100% - 100vh))}}
#roll h2{font-size:24px;margin:40px 0 6px}
#roll h3{font-size:19px;margin:46px 0 4px;color:#FFD86B}
#roll .sec{margin:14px 0;font-size:14.5px;line-height:1.9}
#roll .sec .k{color:#9FB4C8;font-size:12.5px}
#roll .praise{font-size:16px;font-weight:800;color:#FFE9A8;margin:10px 0}
#roll canvas,#roll img{width:84px;height:auto}
#roll .skip{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:2;font-size:13px;border-radius:999px;border:1px solid #ffffff55;background:#ffffff18;color:#fff;padding:6px 14px;cursor:pointer}

/* 図鑑 */
.zlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.zc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px;cursor:pointer;display:flex;gap:6px;align-items:center;text-align:left;font-size:13.5px}
.zc img{width:36px;height:36px}
.zc b{display:block;font-size:14.5px}
.zd dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px;margin:8px 0}
.zd dt{color:var(--muted)}
.zd dd{margin:0}
.minimap svg{width:100%;height:auto;display:block;border-radius:var(--r-md);background:#DCEBF2}
.help p{margin:.45em 0}
.help h4{margin:14px 0 4px}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px}
</style>
</head>
<body>
<header><div id="top">
  <a class="back" href="../../samples/">← ゲーム一覧</a>
  <span class="ttl">ウォンバット☆たま旅すごろく</span>
  <button id="sndBtn" type="button">音 オフ</button>
  <button id="menuBtn" type="button">メニュー</button>
</div></header>
<main>
  <section class="tab on" id="tab-title"></section>
  <section class="tab" id="tab-setup"></section>
  <section class="tab" id="tab-game"></section>
  <section class="tab" id="tab-result"></section>
  <section class="tab" id="tab-zukan"></section>
  <section class="tab" id="tab-help"></section>
</main>
<div id="modal" hidden></div>
<div id="roll" hidden></div>

}
function toCanvas(R){const c=document.createElement('canvas');c.width=R.W;c.height=R.H;const x=c.getContext('2d');for(let y=0;y<R.H;y++)for(let i=0;i<R.W;i++){const k=R.img[y*R.W+i];if(!k)continue;x.fillStyle=PAL[k]||k;x.fillRect(i,y,1,1);}return c;}

  if(!OPT.snd) return;

}

const MAP_H=GEO.H;
function townFill(t){ // まちの規模で色を変える：山（緑）→ まち（ベージュ）
  const k=(t.e-1)/9;const a=[150,196,130],b=[241,228,200];
  return `rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*k)).join(',')})`;
}
function mapSVG(opt){
  opt=opt||{};
  let s=`<svg viewBox="0 0 1000 ${MAP_H}" xmlns="http://www.w3.org/2000/svg" ${opt.id?`id="${opt.id}"`:''}>`;
  s+=`<g class="towns">`;
  for(const t of TOWNS){
    s+=`<path class="town" data-i="${t.i}" d="${t.g.d}" fill="${opt.hl!=null?(opt.hl===t.i?'#F2B544':'#E6EADF'):townFill(t)}"/>`;
  }
  s+=`</g>`;
  if(opt.game){
    s+=`<g id="monos"></g>`;
    const pts=TOWNS.map(t=>t.g.c.join(',')).concat([TOWNS[0].g.c.join(',')]);
    s+=`<polyline class="route" points="${pts.join(' ')}"/>`;
    s+=`<g id="marks">`;
    for(const t of TOWNS){
      const [x,y]=t.g.c;
      s+=`<g class="mk" id="mk${t.i}" data-i="${t.i}" transform="translate(${x},${y})">
        <circle class="base" r="15"/><text class="n">${t.i+1}</text>
        <g class="own" transform="translate(-13,17)"></g>
        <text class="lb" y="-21">${esc(t.name.replace(/(市|町|村)$/,''))}</text></g>`;
    }
    s+=`</g><g id="toks"></g>`;
  } else if(opt.hl!=null){
    const [x,y]=TOWNS[opt.hl].g.c;
    s+=`<circle cx="${x}" cy="${y}" r="12" fill="#C8553D" stroke="#fff" stroke-width="4"/>`;
  }

}
// カメラ（viewBox）
const CAM={x:0,y:0,w:1000,h:MAP_H,near:false,anim:null};
function camTarget(){
  if(!CAM.near||!G) return {x:0,y:0,w:1000,h:MAP_H};
  const p=G.players[G.turn];const [cx,cy]=TOWNS[p.pos].g.c;
  const w=430,h=w*MAP_H/1000;
  return {x:Math.max(0,Math.min(1000-w,cx-w/2)),y:Math.max(0,Math.min(MAP_H-h,cy-h/2)),w,h};
}
function camApply(){
  const sv=$('#gmap');if(!sv)return;
  sv.setAttribute('viewBox',`${CAM.x.toFixed(1)} ${CAM.y.toFixed(1)} ${CAM.w.toFixed(1)} ${CAM.h.toFixed(1)}`);
  const px=sv.getBoundingClientRect().width||600;
  sv.classList.toggle('small-labels',px/CAM.w<0.5);
}
function camGo(instant){
  const T=camTarget();
  if(CAM.anim)cancelAnimationFrame(CAM.anim);
  if(instant){Object.assign(CAM,T);camApply();return;}
  const S={x:CAM.x,y:CAM.y,w:CAM.w,h:CAM.h},t0=performance.now(),D=380;
  const step=now=>{const k=Math.min(1,(now-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    for(const q of ['x','y','w','h'])CAM[q]=S[q]+(T[q]-S[q])*e;camApply();if(k<1)CAM.anim=requestAnimationFrame(step);};
  CAM.anim=requestAnimationFrame(step);
}
window.addEventListener('resize',()=>camApply());

function doBuy(k){
  const p=curP(),si=p.side,i=p.pos,t=TOWNS[i],v=propValue(i,k);
  if(G.P[i][k]!=null||G.sides[si].money<v)return;

  addLog(`${p.name}が「${t[k].name}」を${fmt(v)}ウォンで買った！ 名物「${t[k].item}」で戦闘力+${itemPower(t[k].f)}`);
  SFX.coin();save();drawAll();if(!p.cpu)renderAct(monoNote(i,si));
}
function monoNote(i,si){const q=G.P[i];return q.sta===si&&q.spot===si&&q.fac===si?`🎉 <b>${esc(TOWNS[i].name)}を独占！</b>`:'';}
function confirmTake(k,free){
  const p=curP(),i=p.pos,t=TOWNS[i],v=propValue(i,k),o=G.P[i][k];
  modal(`<h3>${free?'🎫 無料カードで乗っ取る':'乗っ取る'}</h3>
    <p>「${esc(t[k].name)}」を ${sideChip(o)} から乗っ取ります。</p>
    <p>${free?`あなたは払いません。${esc(G.sides[o].name)}には <b>${fmt(v*3)}</b>ウォンが入ります（カードを1枚使う）。`:`<b>${fmt(v*3)}</b>ウォンを ${esc(G.sides[o].name)} に払います。`}</p>
    <button class="b pri" id="y">乗っ取る</button><button class="b" id="n">やめる</button>`,closeModal);
  $('#y').onclick=()=>{closeModal();doTake(k,free);};$('#n').onclick=closeModal;
}
function doTake(k,free){
  const p=curP(),si=p.side,i=p.pos,t=TOWNS[i],v=propValue(i,k),o=G.P[i][k],cost=v*3;
  if(o==null||o===si)return;
  if(free){if(p.cards<1)return;p.cards--;G.stats.free++;}
  else{if(G.sides[si].money<cost)return;G.sides[si].money-=cost;}
  G.sides[o].money+=cost;G.P[i][k]=si;G.P[i][k==='spot'?'bs':'bf']=G.turn;G.stats.take++;
  addLog(`${p.name}が「${t[k].name}」を乗っ取った！${free?'（無料カード）':''} ${G.sides[o].name}に${fmt(cost)}ウォン`);
  SFX.coin();save();drawAll();if(!p.cpu)renderAct(monoNote(i,si));
}
function doBattle(cb){
  const p=curP(),si=p.side,i=p.pos,t=TOWNS[i],pw=sidePower(si);
  if(G.P[i].sta!=null||pw<=t.guard){if(cb)cb();return;}

function roundEnd(){
  const rep={round:G.round,inc:[],evt:null};
  G.sides.forEach((s,si)=>{const v=sideIncome(si);s.money+=v;s.earned+=v;rep.inc.push(v);});
  // 人気イベント：8割は持ち主のいる物件から
  const all=[],owned=[];
  TOWNS.forEach((t,i)=>{for(const k of ['spot','fac']){all.push([i,k]);if(G.P[i][k]!=null)owned.push([i,k]);}});
  const pool=owned.length&&Math.random()<0.8?owned:all;
  const [ei,ek]=pool[Math.floor(Math.random()*pool.length)];
  const before=propValue(ei,ek);
  if(ek==='spot')G.P[ei].ms*=2;else G.P[ei].mf*=2;
  rep.evt={i:ei,k:ek,txt:EVENT_TEXTS[Math.floor(Math.random()*EVENT_TEXTS.length)],before,after:propValue(ei,ek),o:G.P[ei][ek]};
  G.stats.evt.push({i:ei,k:ek});
  addLog(`【${G.round}ターン目おわり】「${TOWNS[ei][ek].name}」が${rep.evt.txt} 価値が2倍に！`);
  G.round++;
  if(G.round>MAX_ROUND)G.phase='over';else G.phase='roll';

function cpuAct(){
  if(!G||G.phase!=='act')return;
  const p=curP(),si=p.side,i=p.pos,t=TOWNS[i],q=G.P[i];
  const left=MAX_ROUND-G.round+1;
  const reserve=G.round<MAX_ROUND?250:0;
  const steps=[];
  if(q.sta==null&&sidePower(si)>t.guard) steps.push(cb=>doBattle(cb));
  for(const k of ['spot','fac']){
    steps.push(cb=>{
      const o=G.P[i][k],v=propValue(i,k),money=G.sides[si].money;
      const staMine=G.P[i].sta===si,inc=v*0.5*(staMine?3:1);
      if(o==null){ if(money-v>=reserve||(left<=1&&money>=v))doBuy(k); }
      else if(o!==si){
        const gain=inc*left;
        if(p.cards>0&&(v>=1200||left<=4||staMine||Math.random()<0.25))doTake(k,true);
        else if(money-v*3>=reserve*2&&gain>v*3*0.8)doTake(k,false);
      }
      cb();
    });
  }
  let n=0;
  const next=()=>{
    if(!G||G.phase!=='act')return;
    renderAct();
    if(n<steps.length){const f=steps[n++];later(()=>f(()=>later(next,500)),550);}
    else later(endTurn,700);
  };
  next();
}

      <dt>${t.sta.bus?'🚌 バスのりば':'🚉 主要駅'}</dt><dd>${esc(t.sta.name)}${t.sta.bus?'（鉄道の駅がない）':''}${own('sta')}</dd>
      <dt>駅を守る動物</dt><dd>${aniImg(t.ani[0],'',false).replace('class="spr','style="width:40px;height:40px" class="spr')} ${esc(t.ani[1])}（戦闘力 ${t.guard}）</dd>
      <dt>🏞️ 観光スポット</dt><dd>${esc(t.spot.name)}${own('spot')}<br><span class="muted">ねだん ${fmt(pv('spot'))}・名物「${esc(t.spot.item)}」⚔️+${itemPower(t.spot.f)}</span></dd>
      <dt>🏛️ 施設</dt><dd>${esc(t.fac.name)}${own('fac')}<br><span class="muted">ねだん ${fmt(pv('fac'))}・名物「${esc(t.fac.item)}」⚔️+${itemPower(t.fac.f)}</span></dd>
    </dl>
    ${t.tri.map(s=>`<div class="tri"><b>まめちしき</b>　${esc(s)}</div>`).join('')}
    <p class="muted" style="font-size:12px">ねだん・戦闘力は、人口や知名度などをもとにしたゲーム用のめやすです。</p>
    <div class="row"><button class="b" id="zPrev">← まえ</button><button class="b" id="zNext">つぎ →</button><button class="b pri" id="zClose" style="margin-left:auto">とじる</button></div></div>`,closeModal);
  $('#zPrev').onclick=()=>zukanDetail((i+N-1)%N);
  $('#zNext').onclick=()=>zukanDetail((i+1)%N);
  $('#zClose').onclick=closeModal;
}
