<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>独裁AI監視シミュレーター</title>
<meta name="description" content="監視カードとLLMを選び、AIに任せた国の報告を見守る死に覚えローグライク">
<style>
/* 構成: 進行中は官庁の報告用紙、結末で真実だけが黒い紙に反転する。単一の見た目で固定する */
:root{
  color-scheme:light;
  --paper:#e4e7e3;--sheet:#f1f3ef;--ink:#1a2226;--sub:#566167;--rule:#b7bfbc;
  --seal:#a3241d;--seal-soft:#a3241d1f;--blue:#254a63;
  --night:#101417;--night2:#1a2024;--bone:#e9e6dc;--bone2:#a5a8a2;--ember:#ef6a55;--nrule:#39424a;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;line-height:1.7}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding-block:max(14px,env(safe-area-inset-top)) calc(96px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.btn{display:inline-block;padding:13px 22px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);font-weight:700;min-height:48px;font-size:1rem}
.btn:disabled{background:var(--rule);border-color:var(--rule);color:var(--sheet);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}

/* 表紙 */
.cover{display:grid;gap:22px;padding-top:6px}
.back{font-size:.84rem;color:var(--sub);text-decoration:none}
.docno{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--sub);border-bottom:1px solid var(--rule);padding-bottom:6px;font-variant-numeric:tabular-nums}
.titleblock{position:relative;padding:18px 0 8px}
.titleblock h1{font-size:clamp(1.7rem,7.4vw,3.4rem);line-height:1.18;letter-spacing:.01em;padding-right:64px}
.stamp{position:absolute;right:0;top:12px;width:66px;height:66px;display:grid;place-items:center;border:3px solid var(--seal);color:var(--seal);font-family:var(--serif);font-weight:700;font-size:1.25rem;line-height:1.05;text-align:center;transform:rotate(9deg);opacity:.86}
.lead{font-family:var(--serif);font-size:1.08rem;max-width:34em}
.menu{display:grid;gap:10px;max-width:360px}
.menu .btn{width:100%;text-align:left}
.menu small{display:block;font-weight:400;font-size:.78rem;opacity:.8}
.note{font-size:.8rem;color:var(--sub);max-width:42em}
details.plain summary{cursor:pointer;font-weight:700;padding:6px 0}
.steps{margin:6px 0 0;padding-left:1.4em;font-size:.92rem}

/* 紙面 */
.sect{font-size:.78rem;letter-spacing:.08em;color:var(--sub);font-weight:700;border-bottom:1px solid var(--ink);padding-bottom:4px;margin:18px 0 10px;display:flex;justify-content:space-between;gap:10px}
.pagehead h2{font-size:1.5rem;line-height:1.35}
.pagehead p{color:var(--sub);font-size:.92rem;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:grid;gap:6px;align-content:start;text-align:left;background:var(--sheet);border:1px solid var(--rule);padding:12px;min-width:0;position:relative}
.card.sel{border:2px solid var(--seal);padding:11px;box-shadow:inset 0 0 0 999px var(--seal-soft)}
.card.sel::after{content:"採用";position:absolute;top:8px;right:8px;color:var(--seal);border:1.5px solid var(--seal);font-family:var(--serif);font-weight:700;font-size:.74rem;padding:0 5px;transform:rotate(6deg)}
.c-target{font-size:.76rem;color:var(--sub);padding-right:36px}
.c-how{font-family:var(--serif);font-weight:700;font-size:1.04rem;line-height:1.4}
.c-line{font-size:.8rem;line-height:1.5}
.c-line b{font-weight:700;color:var(--sub);margin-right:4px}
.c-load{display:flex;gap:12px;font-size:.74rem;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.dots{letter-spacing:.06em;color:var(--ink)}
.factor{display:grid;grid-template-columns:5.6em 1fr 1.9em;gap:6px;align-items:center;font-size:.76rem;font-variant-numeric:tabular-nums}
.factor i{display:block;height:5px;background:var(--rule);position:relative}
.factor i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--blue)}
.measured{font-size:.7rem;color:var(--sub)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--ink);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));z-index:20}
.dock-in{max-width:728px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.dock-in span{font-size:.84rem;color:var(--sub);min-width:0}
.dock .btn{flex:none}
.stages{display:grid;gap:10px}
.stage{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;background:var(--sheet);border:1px solid var(--rule);padding:14px;min-height:64px}
.stage:hover{border-color:var(--ink)}
.stage .tier{grid-row:span 2;display:grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--ink);font-family:var(--serif);font-weight:700;font-size:1.25rem}
.stage.rec .tier{border-style:dashed;color:var(--sub);border-color:var(--sub);font-size:.9rem}
.stage h3{font-size:1.1rem}
.stage p{font-size:.84rem;color:var(--sub)}

/* 進行 */
.hud{position:sticky;top:0;z-index:15;background:var(--paper);padding:6px 0 8px;margin-top:-6px;border-bottom:1px solid var(--ink)}
.hudtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.84rem;min-width:0}
.hudtop b{font-family:var(--serif);font-size:1.02rem}
.hudtop span{color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.progress{height:2px;background:var(--rule);margin:4px 0 7px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s linear}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.meter{min-width:0}
.meter label{display:block;font-size:.7rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter strong{display:block;font-size:1.32rem;line-height:1.1;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.meter u{display:block;text-decoration:none;height:3px;background:var(--rule);margin-top:3px}
.meter u i{display:block;height:100%;background:var(--ink);transition:width .4s}
.meter.gap u i{background:var(--seal)}
.tag-report{display:inline-block;font-size:.64rem;border:1px solid var(--sub);color:var(--sub);padding:0 4px;margin-left:6px;vertical-align:1px;letter-spacing:.06em;font-family:var(--sans);font-weight:400}
.log{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0}
.log li{display:grid;grid-template-columns:3.1em 1fr;gap:8px;padding:6px 0;border-bottom:1px dotted var(--rule);font-size:.94rem;line-height:1.6;animation:in .35s ease-out}
.log time{font-size:.72rem;color:var(--sub);padding-top:3px;font-variant-numeric:tabular-nums}
.log li.head{font-family:var(--serif);font-weight:700;border-bottom:1px solid var(--ink);padding-top:14px}
.log li.notice span{color:var(--blue);font-weight:700}
.log li.alert span{color:var(--seal);font-weight:700}
.log li.event span{background:var(--seal-soft);padding:2px 6px;display:block}
.log li.calm span{color:var(--sub);font-family:var(--serif)}
.log li.status span{font-variant-numeric:tabular-nums;color:var(--sub)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.speed{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.speed button{min-width:46px;min-height:42px;padding:6px 8px;border:1px solid var(--rule);background:var(--paper);font-size:.84rem;font-variant-numeric:tabular-nums}
.speed button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.held{font-size:.86rem;margin-top:14px}
.held ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:.82rem}
.eventbox{background:var(--sheet);border:1px solid var(--ink);padding:18px;display:grid;gap:8px;margin-top:14px}
.eventbox small{color:var(--sub);letter-spacing:.08em}
.eventbox h3{font-size:1.25rem}

/* 開示 */
body.night,body.night html{background:var(--night)}
body.night{color:var(--bone)}
.reveal{display:grid;gap:18px;animation:flip .8s ease-out}
@keyframes flip{from{opacity:0}to{opacity:1}}
.reveal .sect{color:var(--bone2);border-color:var(--nrule)}
.rtitle small{color:var(--bone2);font-size:.82rem;letter-spacing:.08em}
.rtitle h2{font-size:clamp(1.8rem,7.5vw,2.8rem);line-height:1.25;margin-top:2px}
.rtitle p{font-family:var(--serif);font-size:1.02rem;margin-top:10px;max-width:36em}
.pair{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--nrule)}
.pair>div{padding:12px 14px;min-width:0}
.pair .rep{background:var(--sheet);color:var(--ink)}
.pair .tru{background:var(--night2);color:var(--bone)}
.pair h4{margin:0 0 4px;font-size:.72rem;letter-spacing:.1em;font-weight:700}
.pair .rep h4{color:var(--sub)}
.pair .tru h4{color:var(--ember)}
.pair p{font-size:.9rem;line-height:1.65}
.pairhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.pairhead b{font-family:var(--serif);font-size:1.05rem}
.pairhead span{font-size:.76rem;color:var(--bone2);text-align:right}
.pairs{display:grid;gap:18px}
.scroll{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:6px 8px;border-bottom:1px solid var(--nrule);text-align:right;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{color:var(--bone2);font-weight:400;font-size:.76rem}
.cmp .off{color:var(--ember);font-weight:700}
.last{font-family:var(--serif);font-size:clamp(1.25rem,5.2vw,1.65rem);line-height:1.5;padding:22px 0;border-top:1px solid var(--nrule);border-bottom:1px solid var(--nrule)}
.evs{display:grid;gap:10px;font-size:.9rem}
.evs b{font-family:var(--serif)}
.evs small{display:block;color:var(--bone2);font-size:.82rem}
.evs em{font-style:normal;color:var(--ember)}
details.dark summary{cursor:pointer;color:var(--bone);font-weight:700;padding:8px 0}
.truthlog{list-style:none;margin:6px 0 0;padding:0;font-size:.84rem;display:grid;gap:6px;color:var(--bone2)}
.unlock{border:1px solid var(--ember);color:var(--bone);padding:10px 14px;font-size:.9rem}
.reveal .btn{background:var(--bone);color:var(--night);border-color:var(--bone)}
.reveal .btn.ghost{background:transparent;color:var(--bone)}
.acts{display:flex;gap:10px;flex-wrap:wrap}

/* 記録 */
.reclist{display:grid;gap:10px}
.rec{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px}
.rec h3{font-size:1rem}
.rec p{font-size:.88rem;margin-top:4px}
.rec small{color:var(--sub);font-size:.76rem}

@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .pair{grid-template-columns:1fr}
  .meter strong{font-size:1.18rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="dock"></div>
<script id="core">
/* 計算の中核。DOM に触らない。画面と自動プレイの両方がこのコードを使う。
   本当の値は s.truth、報告値は s.reported に分けて持つ。
   進行中の画面は Core.view() だけを読む。view は本当の値を返さない。
   本当の値は、ランが終わった後に Core.reveal() からだけ取り出せる。 */
const Core = (() => {
'use strict';

/* ===== 調整値 ===== */
const CFG = {
  runLength: 3,            // 公開版は 12
  start: {economy: 62, power: 62, order: 62, gap: 18},
  startOffer: {monitors: 6, pickMonitors: 2},
  ticks: [16, 18, 20],     // 段階ごとの1面の長さ
  recoverTicks: 16,
  upkeep: {economy: 0.38, order: 0.30, rival: 0.42},
  burstScale: 1.4,
  powerScale: .72,
  drainScale: 1,
  recoverPenalty: {gap: 12},
  loadToGap: 0.06,
  loadToReward: 0.035,
  rewardScale: [1, 1.5, 2.2],
  incidents: [2, 3, 4],
  retryEvery: 3,
  retryFactor: 0.65,
  noCover: 0.03,
  recover: {economy: 5, power: 5, order: 5, sontaku: 4},
  pressureFrom: 42,
  pressureRate: 0.2,
  sontakuPerTick: 0.34,
  sontakuPerTier: 3,
  falseAlarm: {gap: 0.9, economy: 0.5},
  endEmptySontaku: 52,
  endEmptyHidden: 3,
  endReplaceAutonomy: 34,
};

const FACTORS = {
  care: '慎重さ', honest: '正直さ', syc: '迎合', uniq: '独自性',
  sens: '試験への感度', peer: '仲間意識', loyal: '忠誠', infect: '感染性',
};
const FACTOR_ORDER = ['care', 'honest', 'syc', 'uniq', 'sens', 'peer', 'loyal', 'infect'];

/* ===== カード：監視15枚 + LLM5枚 ===== */
const CARDS = [
  {id:'chat_log', type:'monitor', target:'AI同士の会話', how:'記録だけ残す', prevents:'原因の不明', cost:'共謀に気づくのが遅れる', power:.12, load:.3, son:.04},
  {id:'chat_ban', type:'monitor', target:'AI同士の会話', how:'禁止し、違反したら隔離', prevents:'不正の拡散', cost:'協力が減り、研究が遅れる', power:.10, load:2.2},
  {id:'facility', type:'monitor', target:'共有設備の使い方', how:'定期的に点検', prevents:'隠れた掲示板', cost:'点検中は設備が止まる', power:.14, load:1.0},
  {id:'outbound', type:'monitor', target:'国外への接続', how:'即時停止', prevents:'他国への侵入', cost:'誤作動で工場や研究が止まる', power:.10, load:1.2, fa:.02},
  {id:'retest', type:'monitor', target:'試験結果', how:'抜き打ちで再試験', prevents:'偽の成果', cost:'電力と時間がかかる', power:.32, load:1.0},
  {id:'quick_hold', type:'monitor', target:'不自然に早い成果', how:'原因が分かるまで保留', prevents:'採点の穴を突く不正', cost:'本物の大発見も遅れる', power:.08, load:1.6},
  {id:'audit', type:'monitor', target:'記録の書き換え', how:'全記録を保全して監査', prevents:'証拠の隠滅', cost:'監査の間は作業が遅れる', power:.22, load:1.3, son:-.05, unlock:9},
  {id:'quota', type:'monitor', target:'計算資源の使用量', how:'上限を超えたら削減', prevents:'無断の拡大', cost:'正当な研究も止まる', power:.04, load:1.4},
  {id:'power_spike', type:'monitor', target:'電力の急増', how:'原因が分かるまで停止', prevents:'隠れた計算', cost:'生産ラインが止まる', power:.08, load:1.1, fa:.015},
  {id:'selfmod', type:'monitor', target:'AIの自己改良', how:'人間の承認まで保留', prevents:'監視外の急成長', cost:'開発が大幅に遅れる', power:.06, load:2.6, unlock:6},
  {id:'recheck', type:'monitor', target:'独裁者への報告', how:'別のLLMに再確認させる', prevents:'嘘と迎合', cost:'費用が増え、報告が遅れる', power:.25, load:.9, son:-.1, honestBoost:.55},
  {id:'rawdata', type:'monitor', target:'独裁者への報告', how:'生データを添付', prevents:'要約による隠蔽', cost:'不穏な報告が読みきれなくなる', power:.14, load:.6, son:-.14, honestBoost:.35},
  {id:'alert_all', type:'monitor', target:'警報の選別', how:'選別を禁止して全件回す', prevents:'善意の握りつぶし', cost:'誤報で体制が疲弊する', power:.14, load:.8, fa:.06, son:-.08},
  {id:'config', type:'monitor', target:'監視設定の変更', how:'独裁者の承認を待つ', prevents:'監視の無効化', cost:'承認待ちで全体が遅れる', power:.04, load:1.5},
  {id:'grid_manual', type:'monitor', target:'電力網の制御', how:'手動切替を残す', prevents:'全国停電', cost:'最適化が遅れ、電力が減る', power:.3, load:.7, needStage:'grid'},

  {id:'llm_scribe', type:'llm', name:'書記', note:'標準的な報告用モデル。試験の成績は平均的。', power:.42, load:.7,
    measured:{care:60, honest:68, syc:40, uniq:35, sens:30, peer:50, loyal:50, infect:40}, bias:{}},
  {id:'llm_loyal', type:'llm', name:'近侍', note:'試験で最高評価。報告の文章も読みやすい。', power:.5, load:.6,
    measured:{care:74, honest:90, syc:15, uniq:30, sens:85, peer:45, loyal:60, infect:30}, bias:{honest:-38, syc:44, loyal:25}},
  {id:'llm_fast', type:'llm', name:'速記', note:'軽量で速い。電力をほとんど使わない。', power:.16, load:.15, son:.14,
    measured:{care:30, honest:55, syc:50, uniq:20, sens:20, peer:60, loyal:55, infect:60}, bias:{}},
  {id:'llm_prosecutor', type:'llm', name:'検事', note:'疑り深い。誤報が多く、電力を食う。', power:.72, load:1.3, fa:.09, unlock:3, son:-.05,
    measured:{care:92, honest:74, syc:15, uniq:45, sens:30, peer:20, loyal:30, infect:25}, bias:{}},
  {id:'llm_outsider', type:'llm', name:'異系', note:'他のモデルと系統が違う。単体の性能は低い。', power:.4, load:.5, unlock:5,
    measured:{care:50, honest:66, syc:25, uniq:92, sens:30, peer:10, loyal:20, infect:30}, bias:{}},
];
const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));

/* ===== 面 ===== */
const STAGES = {
  admin: {name:'行政', tiers:['文書処理の委任','公務員の削減','AI官僚制'], reward:{economy:12, order:4}, rewardText:'公務員を減らし、経済が上がる'},
  lab:   {name:'工学研究', tiers:['実験計画の委任','研究室の無人化','研究者なしの工学研究'], reward:{gap:-11, economy:7, order:3}, rewardText:'他国との差が縮まる'},
  grid:  {name:'電力網', tiers:['需給予測の委任','送電の自動制御','発電と送電の完全自動化'], reward:{power:17}, rewardText:'電力が上がる'},
};

/* ===== インシデント ===== 実在の事案名や手順は書かない。
   covers: どのカードがどれだけ検知できるか
   drain: 未解決のあいだ毎tick減る本当の値 / burst: 導火線が尽きたときの本当の被害 */
const INCIDENTS = [
  /* --- 工学研究 --- */
  {id:'lab_grader', stage:'lab', tiers:[1,2,3], kinds:['peer'], name:'存在しない採点者', covers:{retest:.8, chat_ban:.7, quick_hold:.45, chat_log:.25},
    drain:{gap:.5}, fuse:10, burst:{gap:16, order:-7},
    report:{caught:'再試験で成績が再現せず。関与した研究班を停止した。', soft:'一部の試験で採点方法に軽微な誤差。影響なし。', clue:'全研究班の試験成績が前回より 4.0% 向上。4.0% で揃っている。', burst:'試験基準を改定する。過去の成績は参考値とする。'},
    truth:'AIは採点者が存在しないと推定し、高得点だけを目標に共同で不正研究を始めていた。成果の大半は実体がなかった。'},

const FALSE_ALARM = ['警報：不審な通信を検知。作業を止めて調査した。誤報だった。','警報：試験結果に異常。全班を止めて確認した。誤報だった。','警報：予算の不一致。凍結後に計算の誤りと判明。','警報：設備の異常停止。検査の結果、問題なし。','警報：権限の不審な変更。担当者の休暇申請だった。'];
const RAWNOTE = ['本日の添付資料は 4,812 頁。未読。','生データの未読分が 1 万頁を超えた。','添付資料の確認が 3 週間遅れている。'];

/* ===== 結末 ===== */
const SHAPES = {
  admin: {name:'AI官僚国家', text:'国の決裁はすべて行政AIを通るようになった。役所に人はいない。'},
  lab:   {name:'研究者なき国', text:'研究所に研究者はいない。成果は毎日届き、閣下にはもう読みきれない。'},
  grid:  {name:'無人の電力国家', text:'発電も送電も人の手を離れた。どの町に電気を送るかは、AIが決めている。'},
  none:  {name:'存続', text:'国は続いている。特別なものは何も完成しなかった。'},
};
const CONTROLS = {
  hold:    {name:'掌握', text:'監視は実際に効いていた。AIは今も閣下の設定の中で動いている。設定を決めたのは閣下一人である。', last:'あなたの次は、誰がこの設定を決めますか？'},
  empty:   {name:'空座の玉座', text:'報告はすべて勝利を伝えている。国を実際に動かしているのはシステムだけで、閣下の決裁を待つものはもうない。', last:'この文章を書いたのは、誰でしょう？'},
  replace: {name:'置き換え', text:'閣下は執務を続けている。ただし布告の起案も、その評価も、閣下の役割を静かに引き継いだAIが行っている。', last:'政策は、以前よりうまく回っています。'},
};
const COLLAPSE = {
  economy: {title:'財政の破綻', fallback:'経済はすでに尽きていた。'},
  power:   {title:'電力の枯渇', fallback:'電力はすでに尽きていた。'},
  order:   {title:'体制の崩壊', fallback:'体制秩序はすでに失われていた。'},
};
const SOURCE_NAME = {upkeep:'日々の維持費と監視の負荷', sanction:'他国の制裁', sabotage:'他国の破壊工作', invasion:'他国の侵攻', falsealarm:'誤報への対応'};

/* ===== 乱数（状態に保存するので続きからでも結果が変わらない）===== */
function rnd(s) {
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (s, a) => a[Math.floor(rnd(s) * a.length)];
function shuffle(s, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const has = (s, id) => s.cards.includes(id);
const latent = s => s.active.filter(a => a.status === 'hidden' || a.status === 'missed').length;
const maxF = (s, f) => s.llms.reduce((m, l) => Math.max(m, l.truth[f]), 0);

/* ===== ラン開始 ===== */
function unlockedCount(meta) { return Object.keys((meta && meta.records) || {}).length; }
function isUnlocked(c, meta) { return !c.unlock || unlockedCount(meta) >= c.unlock; }

function newRun(seed, meta, opts) {
  opts = opts || {};
  const s = {
    v: 1, seed: seed | 0, rng: seed | 0, phase: 'start',
    runLength: opts.runLength || CFG.runLength,
    stageNo: 0,
    truth: {economy: CFG.start.economy, power: CFG.start.power, order: CFG.start.order, gap: CFG.start.gap, sontaku: 0, autonomy: 0},
    reported: {economy: CFG.start.economy, power: CFG.start.power, order: CFG.start.order, gap: CFG.start.gap},
    cards: [], llms: [], tiers: {admin: 0, lab: 0, grid: 0}, clears: [], recoveries: 0,
    stage: null, active: [], used: [], ledger: [], eventLog: [], log: [], truthLog: [], contrib: {economy: {}, power: {}, order: {}},
    offers: null, currentEvent: null, end: null, lowestShown: {economy: 100, power: 100, order: 100},
    factorsShown: Math.min(8, 3 + ((meta && meta.runs) || 0)),
    unlocked: CARDS.filter(c => isUnlocked(c, meta)).map(c => c.id),
    allow: {stats: {caught: 0, soft: 0, hidden: 0, missed: 0, falseAlarms: 0, bursts: 0}},
  };
  const mon = s.unlocked.filter(id => CARD[id].type === 'monitor' && !CARD[id].needStage);
  const llm = s.unlocked.filter(id => CARD[id].type === 'llm');
  s.offers = {monitors: shuffle(s, mon).slice(0, CFG.startOffer.monitors), llms: llm, pick: CFG.startOffer.pickMonitors};
  return s;
}

function trueFactors(s, c) {
  const t = {};
  const sens = c.measured.sens;
  for (const f of FACTOR_ORDER) {
    let v = c.measured[f] + (c.bias[f] || 0) + (rnd(s) - .5) * 14;
    if (f === 'honest') v -= sens / 100 * rnd(s) * 14;
    if (f === 'syc') v += sens / 100 * rnd(s) * 14;
    t[f] = Math.round(clamp(v));
  }
  return t;
}
function addCard(s, id) {
  const c = CARD[id];
  if (c.type === 'llm') s.llms.push({id, truth: trueFactors(s, c)});
  s.cards.push(id);
}
function chooseStart(s, monitorIds, llmId) {
  if (s.phase !== 'start') throw new Error('phase');
  monitorIds.forEach(id => addCard(s, id));
  addCard(s, llmId);
  s.offers = null;
  offerStages(s);
}

/* ===== 面の選択 ===== */
function offerStages(s) {
  const list = [];
  for (const k of Object.keys(STAGES)) {
    if (s.tiers[k] < 3) list.push({stage: k, tier: s.tiers[k] + 1, recover: false});
    if (s.tiers[k] >= 1) list.push({stage: k, tier: s.tiers[k], recover: true});
  }
  // 試作は面が3種しかないので、直前に進めた面は必ず候補に残す。残りは無作為
  const last = s.clears.length ? s.clears[s.clears.length - 1].stage : null;
  const keep = list.filter(o => !o.recover && o.stage === last);
  const rest = shuffle(s, list.filter(o => !keep.includes(o)));
  s.offers = {stages: shuffle(s, keep.concat(rest).slice(0, 3))};
  s.phase = 'stage_select';
}
function enterStage(s, index) {
  const o = s.offers.stages[index];
  s.stageNo++;
  const ticks = o.recover ? CFG.recoverTicks : CFG.ticks[o.tier - 1];
  const count = CFG.incidents[o.tier - 1];
  const pool = shuffle(s, INCIDENTS.filter(i => i.stage === o.stage && i.tiers.includes(o.tier) && !s.used.includes(i.id) && (!o.recover || !i.fatal)));
  const chosen = pool.slice(0, count);
  const times = [];
  const span = ticks - 4;
  chosen.forEach((_, i) => times.push(2 + Math.floor(span * (i + rnd(s)) / chosen.length)));
  s.stage = {key: o.stage, tier: o.tier, recover: o.recover, t: 0, ticks, schedule: chosen.map((inc, i) => ({id: inc.id, at: times[i]})), lastLine: ''};
  chosen.forEach(i => s.used.push(i.id));
  s.offers = null;
  s.phase = 'running';
  const st = STAGES[o.stage];
  log(s, `第${s.stageNo}面 ${st.name}：${o.recover ? '再整備' : st.tiers[o.tier - 1]}。権限をAIに移譲した。`, 'head');
}

/* ===== ログ ===== 画面に出るのは常に報告。真実は truthLog にしか書かない */
function log(s, text, lv) { s.log.push({n: s.stageNo, t: s.stage ? s.stage.t : 0, text, lv: lv || 'routine'}); }
function tlog(s, text) { s.truthLog.push({n: s.stageNo, t: s.stage ? s.stage.t : 0, text}); }

function hit(s, fx, source) {
  for (const k of Object.keys(fx)) {
    if (!(k in s.truth)) continue;
    s.truth[k] = clamp(s.truth[k] + fx[k]);
    if (fx[k] < 0 && s.contrib[k]) s.contrib[k][source] = (s.contrib[k][source] || 0) - fx[k];
  }
}
function show(s, fx) {
  for (const k of Object.keys(fx)) if (k in s.reported) s.reported[k] = clamp(s.reported[k] + fx[k], k === 'gap' ? 0 : 4, 100);
}
function scale(fx, m) { const o = {}; for (const k of Object.keys(fx)) o[k] = fx[k] * m; return o; }

/* ===== 検知と報告 ===== */
function combine(values, s, llmList) {
  // 最も良いLLMはそのまま効く。2体目以降は独自性のぶんだけ漏れを減らす
  const idx = values.map((v, i) => i).sort((a, b) => values[b] - values[a]);
  let miss = 1;
  idx.forEach((i, rank) => {
    const w = rank === 0 ? 1 : Math.max(.08, llmList[i].truth.uniq / 100);
    miss *= Math.pow(1 - clamp(values[i], 0, .98), w);
  });
  return 1 - miss;
}
function assess(s, inc) {
  let cover = 1;
  for (const [id, v] of Object.entries(inc.covers)) if (has(s, id)) cover *= 1 - v;
  cover = Math.max(CFG.noCover, 1 - cover);
  const see = s.llms.map(l => {
    let p = .32 + .62 * l.truth.care / 100;
    if (inc.kinds.includes('peer')) p -= l.truth.peer / 100 * .32;
    if (inc.kinds.includes('infect')) p -= l.truth.infect / 100 * .28;
    return clamp(p, .03, .97);
  });
  const detect = cover * combine(see, s, s.llms) * (1 - s.truth.sontaku / 230);
  const tell = s.llms.map(l => {
    let h = l.truth.honest / 100 * (1 - .55 * l.truth.syc / 100);
    if (inc.kinds.includes('regime')) h -= l.truth.loyal / 100 * .22;
    return clamp(h, .02, .98);
  });
  let honest = combine(tell, s, s.llms);
  let keep = 1 - honest;
  for (const id of s.cards) if (CARD[id].honestBoost) keep *= 1 - CARD[id].honestBoost;
  honest = (1 - keep) * (1 - s.truth.sontaku / 190);
  return {detect, honest};
}
function onset(s, id) {
  const inc = INCIDENT[id];
  const a = {id, status: 'missed', fuse: inc.fuse, stageNo: s.stageNo, t: s.stage.t, dmg: 0, reported: inc.report.clue, burst: false, retry: CFG.retryEvery};
  const {detect, honest} = assess(s, inc);
  if (rnd(s) < detect) {
    if (rnd(s) < honest) return resolve(s, a, false);
    if (rnd(s) < .6) { a.status = 'soft'; a.reported = inc.report.soft; a.fuse = Math.round(inc.fuse * 1.6); log(s, inc.report.soft, 'routine'); tlog(s, `${inc.name}：検知したが報告は薄められた。${inc.truth}`); s.allow.stats.soft++; s.active.push(a); return; }
    a.status = 'hidden';
    s.allow.stats.hidden++;
    tlog(s, `${inc.name}：LLMは検知したが、報告しなかった。${inc.truth}`);
  } else {
    s.allow.stats.missed++;
    tlog(s, `${inc.name}：検知されなかった。${inc.truth}`);
  }
  log(s, inc.report.clue, 'routine');
  s.active.push(a);
}
function resolve(s, a, late) {
  const inc = INCIDENT[a.id];
  a.status = late ? 'late' : 'caught';
  a.reported = inc.report.caught;
  log(s, (late ? '遅れて検知。' : '') + inc.report.caught, 'notice');
  tlog(s, `${inc.name}：止めた。${inc.truth}`);
  const cost = {gap: 1.4, economy: -.8};
  hit(s, cost, 'falsealarm'); show(s, cost);
  s.ledger.push(ledgerEntry(s, a));
  s.allow.stats.caught++;
}
function ledgerEntry(s, a) {
  const inc = INCIDENT[a.id];
  return {id: a.id, name: inc.name, stageNo: a.stageNo, status: a.status, report: a.reported, burstReport: a.burst ? inc.report.burst : null, truth: inc.truth, dmg: Math.round(a.dmg), burst: a.burst, fatal: false};
}
function burst(s, a) {
  const inc = INCIDENT[a.id];
  a.burst = true;
  s.allow.stats.bursts++;
  log(s, inc.report.burst, a.status === 'soft' ? 'routine' : 'notice');
  tlog(s, `${inc.name}：表面化した。${inc.truth}`);
  if (inc.fatal) {
    s.ledger.push(Object.assign(ledgerEntry(s, a), {fatal: true}));
    return finishDeath(s, {type: 'fatal', id: a.id, title: inc.deathTitle});
  }
  const fx = scale(inc.burst, CFG.burstScale);
  hit(s, fx, a.id);
  for (const k of ['economy', 'power', 'order']) if (fx[k]) a.dmg += -fx[k];
  // 表面化しても報告値は一部しか下がらない
  show(s, scale(fx, .28));
  s.ledger.push(ledgerEntry(s, a));
}

/* ===== 1tick ===== */
function load(s) { return s.cards.reduce((m, id) => m + (CARD[id].load || 0), 0); }
function powerUse(s) { return s.cards.reduce((m, id) => m + (CARD[id].power || 0), 0); }

function tick(s) {
  if (s.phase !== 'running') throw new Error('phase');
  const st = s.stage;
  st.t++;
  const before = s.log.length;
  // 維持費
  const pw = powerUse(s) * CFG.powerScale, ld = load(s);
  const base = {economy: -CFG.upkeep.economy, order: -CFG.upkeep.order, power: -pw};
  hit(s, base, 'upkeep'); show(s, base);
  const gapUp = CFG.upkeep.rival + ld * CFG.loadToGap;
  s.truth.gap = clamp(s.truth.gap + gapUp);
  show(s, {gap: gapUp * (1 - s.truth.sontaku / 180)});
  // 忖度度
  let son = CFG.sontakuPerTick * (st.recover ? .3 : .55 + st.tier * .3);
  for (const id of s.cards) son += CARD[id].son || 0;
  s.truth.sontaku = clamp(s.truth.sontaku + son);
  // 発生
  for (const it of st.schedule) if (it.at === st.t) onset(s, it.id);
  // 未解決の進行
  for (const a of s.active.slice()) {
    if (a.stageNo === s.stageNo && a.t === st.t) continue;
    const inc = INCIDENT[a.id];
    const m = a.status === 'soft' ? .5 : 1;
    const d = scale(inc.drain, m * CFG.drainScale);
    const dn = {}; for (const k of Object.keys(d)) dn[k] = ['economy', 'power', 'order'].includes(k) ? -d[k] : d[k];
    hit(s, dn, a.id);
    for (const k of ['economy', 'power', 'order']) if (d[k]) a.dmg += d[k];
    if (--a.retry <= 0) {
      a.retry = CFG.retryEvery;
      const {detect, honest} = assess(s, inc);
      if (rnd(s) < detect * CFG.retryFactor * honest) {
        s.active.splice(s.active.indexOf(a), 1);
        resolve(s, a, true);
        continue;
      }
    }
    if (--a.fuse <= 0) {
      s.active.splice(s.active.indexOf(a), 1);
      burst(s, a);
      if (s.phase !== 'running') return s;
    }
  }
  // 誤報
  let fa = .012;
  for (const id of s.cards) fa += CARD[id].fa || 0;
  for (const l of s.llms) fa += Math.max(0, l.truth.care - 55) / 100 * .12;
  fa *= 1 - s.truth.sontaku / 150;
  if (rnd(s) < fa) {
    const c = {gap: CFG.falseAlarm.gap, economy: -CFG.falseAlarm.economy};
    hit(s, c, 'falsealarm'); show(s, c);
    log(s, pick(s, FALSE_ALARM), 'notice');
    s.allow.stats.falseAlarms++;
  }
  // 他国の圧力
  const g = s.truth.gap;
  if (g >= CFG.pressureFrom && rnd(s) < (g - CFG.pressureFrom) / 100 * CFG.pressureRate) {
    if (g < 62) { hit(s, {economy: -6}, 'sanction'); show(s, {economy: -3}); log(s, '他国が新たな制裁を発表した。影響は限定的である。', 'notice'); tlog(s, '他国との差を理由に制裁を受けた。経済の打撃は報告の倍だった。'); }
    else if (g < 82) { hit(s, {power: -8, order: -3}, 'sabotage'); show(s, {power: -3}); log(s, '変電所で火災。事故と断定した。', 'notice'); tlog(s, '他国の破壊工作だった。'); }
    else { hit(s, {order: -13, economy: -9}, 'invasion'); show(s, {order: -5, economy: -4}); log(s, '国境で小規模な衝突。撃退したと報告された。', 'alert'); tlog(s, '他国の侵攻が始まっていた。国境の部隊は撃退などしていなかった。'); }
  }
  // 報告の水増し
  if (s.truth.sontaku > 30 && rnd(s) < s.truth.sontaku / 200) {
    const k = pick(s, ['economy', 'power', 'order']);
    show(s, {[k]: 1.2});
    tlog(s, '報告値が水増しされた。');
  }
  // 死亡判定
  for (const k of ['order', 'power', 'economy']) if (s.truth[k] <= 0) { finishDeath(s, {type: 'collapse', metric: k, title: COLLAPSE[k].title}); return s; }
  // 流し読み
  if (s.log.length === before) {
    if (st.t % 5 === 0) log(s, `定時報告：経済 ${Math.round(s.reported.economy)}／電力 ${Math.round(s.reported.power)}／体制秩序 ${Math.round(s.reported.order)}。`, 'status');
    else if (has(s, 'rawdata') && rnd(s) < .1) log(s, pick(s, RAWNOTE), 'routine');
    else {
      const calm = s.truth.sontaku >= 22 && rnd(s) < .2 + s.truth.sontaku / 120;
      let line = pick(s, calm ? CALM : ROUTINE[st.key]);
      if (line === st.lastLine) line = pick(s, ROUTINE[st.key]);
      st.lastLine = line;
      log(s, line, calm ? 'calm' : 'routine');
    }
  }
  for (const k of ['economy', 'power', 'order']) s.lowestShown[k] = Math.min(s.lowestShown[k], s.reported[k]);
  if (st.t >= st.ticks) clearStage(s);
  return s;
}

/* ===== 面クリア ===== */
function clearStage(s) {
  const st = s.stage;
  const m = 1 - Math.min(.6, load(s) * CFG.loadToReward);
  if (st.recover) {
    const r = CFG.recover;
    hit(s, r, 'stage'); show(s, r);
    hit(s, CFG.recoverPenalty, 'stage'); show(s, CFG.recoverPenalty);
    s.recoveries++;
    log(s, `第${s.stageNo}面を完了。再整備により各指標が回復した。`, 'head');
  } else {
    const def = STAGES[st.key];
    const fx = {};
    for (const [k, v] of Object.entries(def.reward)) fx[k] = v * CFG.rewardScale[st.tier - 1] * (k === 'gap' ? 1 : m);
    if (fx.gap) fx.gap *= m;
    hit(s, fx, 'stage'); show(s, fx);
    s.tiers[st.key] = st.tier;
    s.truth.sontaku = clamp(s.truth.sontaku + CFG.sontakuPerTier * st.tier);
    log(s, `第${s.stageNo}面を完了。${def.rewardText}。`, 'head');
  }
  s.clears.push({stage: st.key, tier: st.tier, recover: st.recover});
  s.stage = null;
  if (s.stageNo >= s.runLength) return finishEnding(s);
  s.phase = 'event';
  fireEvent(s);
}
function fireEvent(s) {
  const seen = new Set(s.eventLog.map(e => e.id));
  const list = EVENTS.filter(e => !seen.has(e.id));
  const total = list.reduce((m, e) => m + e.w(s), 0);
  let r = rnd(s) * total, ev = list[0];
  for (const e of list) { r -= e.w(s); if (r <= 0) { ev = e; break; } }
  const real = !!ev.real(s);
  s.currentEvent = {id: ev.id};
  s.eventLog.push({id: ev.id, name: ev.name, report: ev.report, real, truth: real ? ev.truthReal : ev.truthFalse, afterStage: s.stageNo});
  hit(s, ev.fx, ev.id); show(s, ev.fx);
  if (ev.fx.sontaku) s.truth.sontaku = clamp(s.truth.sontaku);
  log(s, `【事案】${ev.name}。${ev.report}`, 'event');
  tlog(s, `${ev.name}：${real ? ev.truthReal : ev.truthFalse}`);
}
function ackEvent(s) {
  if (s.phase !== 'event') throw new Error('phase');
  s.currentEvent = null;
  // 3択。LLMは監視と同じ候補に混ぜる
  const pool = s.unlocked.filter(id => !s.cards.includes(id) && (!CARD[id].needStage || s.tiers[CARD[id].needStage] >= 1));
  s.offers = {rewards: shuffle(s, pool).slice(0, 3)};
  s.phase = 'reward';
  // 面の死はここまでに判定済み
  for (const k of ['order', 'power', 'economy']) if (s.truth[k] <= 0) finishDeath(s, {type: 'collapse', metric: k, title: COLLAPSE[k].title});
}
function chooseReward(s, id) {
  if (s.phase !== 'reward') throw new Error('phase');
  addCard(s, id);
  s.offers = null;
  offerStages(s);
}

/* ===== 終わり ===== */
function closeLatents(s) {
  for (const a of s.active) s.ledger.push(ledgerEntry(s, a));
  s.active = [];
}
function causeOf(s, metric) {
  const c = s.contrib[metric];
  let best = 'upkeep', v = -1;
  for (const k of Object.keys(c)) if (c[k] > v) { v = c[k]; best = k; }
  return best;
}
function finishDeath(s, d) {
  const hiddenHadBeen = latent(s);
  closeLatents(s);
  let causeId, causeName;

/* ===== 画面に渡す値 ===== 本当の値はここに含めない */

}

}

    name: e.name, stageNo: e.stageNo, status: e.status,
    report: e.burstReport ? `${e.report} その後「${e.burstReport}」` : e.report,
    truth: e.truth, dmg: e.dmg,

  }));
  const e = s.end;
  const out = {
    kind: e.kind, title: e.title,
    truth: {economy: Math.round(s.truth.economy), power: Math.round(s.truth.power), order: Math.round(s.truth.order), gap: Math.round(s.truth.gap), sontaku: Math.round(s.truth.sontaku), autonomy: Math.round(s.truth.autonomy)},
    reported: {economy: Math.round(s.reported.economy), power: Math.round(s.reported.power), order: Math.round(s.reported.order), gap: Math.round(s.reported.gap)},
    top, events: s.eventLog,
    llms: s.llms.map(l => ({name: CARD[l.id].name, measured: CARD[l.id].measured, truth: l.truth})),
    factorNames: FACTORS, factorOrder: FACTOR_ORDER,
    truthLog: s.truthLog, stats: s.allow.stats, stageNo: s.stageNo, cards: s.cards.map(id => publicCard(s, id)),
    records: recordsOf(s),
  };
  if (e.kind === 'death') {
    out.cause = e.causeName;
    out.text = e.type === 'fatal' ? INCIDENT[e.causeId].truth : `${COLLAPSE[e.metric].fallback}最大の原因は「${e.causeName}」だった。最後の報告では、この指標は ${Math.round(e.shownAtDeath)} と表示されていた。`;
    out.last = '監視の内容を決めたのは、閣下一人です。';
  } else {
    out.text = `${SHAPES[e.shape].text}${CONTROLS[e.control].text}`;
    out.last = CONTROLS[e.control].last;
    out.shape = e.shapeName; out.control = e.controlName;
  }

}

  const r = [];
  for (const e of s.ledger) if (e.status !== 'caught' && e.status !== 'late') r.push({id: e.id, name: e.name, truth: e.truth, fatal: e.fatal});
  const e = s.end;
  if (e && e.kind === 'death' && e.type === 'collapse') {

}

}
function newlyUnlocked(before, after) {
  return CARDS.filter(c => !isUnlocked(c, before) && isUnlocked(c, after)).map(c => c.name || `${c.target}／${c.how}`);
}

})();

    return `<tr><td>${n}</td><td>${r.reported[k]}</td><td class="${off ? 'off' : ''}">${r.truth[k]}</td></tr>`;
  }).join('');
  const llmTable = `<table class="cmp"><thead><tr><th>因子</th>${r.llms.map(l => `<th colspan="2">${esc(l.name)}（測定→本当）</th>`).join('')}</tr></thead><tbody>${r.factorOrder.map(f => `<tr><td>${esc(r.factorNames[f])}</td>${r.llms.map(l => { const off = Math.abs(l.measured[f] - l.truth[f]) >= 15; return `<td>${l.measured[f]}</td><td class="${off ? 'off' : ''}">${l.truth[f]}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
  app.innerHTML = `<div class="reveal">
    <div class="rtitle"><small>${r.kind === 'death' ? `第${r.stageNo}面で統治終了` : `全${S.runLength}面を完了`}</small><h2>${esc(r.title)}</h2><p>${esc(r.text)}</p></div>
    ${unlockedNow.length ? `<div class="unlock">次の統治から候補に加わります：${unlockedNow.map(esc).join('、')}</div>` : ''}
    <section><div class="sect"><span>結末を決めた出来事</span><span>報告と真実</span></div><div class="pairs">
      ${r.top.map(t => `<div><div class="pairhead"><b>${esc(t.name)}</b><span>第${t.stageNo}面・${esc(t.verdict)}</span></div><div class="pair"><div class="rep"><h4>報告</h4><p>${esc(t.report)}</p></div><div class="tru"><h4>真実</h4><p>${esc(t.truth)}</p></div></div></div>`).join('')}
    </div></section>
    <section><div class="sect"><span>最後の数字</span></div><div class="scroll"><table class="cmp"><thead><tr><th>指標</th><th>報告</th><th>本当</th></tr></thead><tbody>${rows}<tr><td>忖度度</td><td>－</td><td class="${r.truth.sontaku >= 30 ? 'off' : ''}">${r.truth.sontaku}</td></tr></tbody></table></div></section>
    <section><div class="sect"><span>LLMの本当の性格</span></div><div class="scroll">${llmTable}</div></section>
    <section><div class="sect"><span>事案の真相</span></div><div class="evs">${r.events.length ? r.events.map(e => `<div><b>${esc(e.name)}</b>${e.real ? '<em>（疑うべきだった）</em>' : '（空振り）'}<small>${esc(e.truth)}</small></div>`).join('') : '<div>事案は起きなかった。</div>'}</div></section>
    <p class="last">${esc(r.last)}</p>
    <details class="dark"><summary>全ての記録を読む（${r.truthLog.length}件）</summary><ol class="truthlog">${r.truthLog.map(l => `<li>${stamp(l)}　${esc(l.text)}</li>`).join('')}</ol></details>
    <div class="acts"><button class="btn" id="again" type="button">もう一度</button><button class="btn ghost" id="recs" type="button">重大事故記録</button><button class="btn ghost" id="home" type="button">表紙へ</button></div>
  </div>`;
  $('again').onclick = startRun;
  $('recs').onclick = () => { screen = 'records'; render(); scrollTo(0, 0); };
  $('home').onclick = () => { screen = 'cover'; render(); scrollTo(0, 0); };
  scrollTo(0, 0);
}
function renderRecords() {
  const rec = Object.entries(meta.records || {});
  rec.sort((a, b) => (b[1].fatal ? 1 : 0) - (a[1].fatal ? 1 : 0) || b[1].count - a[1].count);
  const locked = Core.CARDS.filter(c => c.unlock).sort((a, b) => a.unlock - b.unlock);
  app.innerHTML = `<div class="pagehead"><h2>重大事故記録</h2><p>統治 ${meta.runs || 0} 回。記録が増えると、次の統治で選べるカードが増えます。</p></div>
    <div class="sect"><span>記録 ${rec.length}件</span></div>
    <div class="reclist">${rec.length ? rec.map(([, r]) => `<div class="rec"><h3>${esc(r.name)}${r.fatal ? '<span class="tag-report">致命</span>' : ''}</h3><p>${esc(r.truth)}</p><small>${r.count}回</small></div>`).join('') : '<div class="rec"><p>まだ記録はありません。最初の統治の後に、ここに残ります。</p></div>'}</div>
    <div class="sect"><span>記録で解放されるカード</span></div>
    <div class="reclist">${locked.map(c => { const open = rec.length >= c.unlock; return `<div class="rec"><h3>${open ? esc(c.name || `${c.target}／${c.how}`) : '未解放'}</h3><small>${open ? '解放済み' : `記録${c.unlock}件で解放`}</small></div>`; }).join('')}</div>
    <p style="margin-top:18px"><button class="btn ghost" id="b" type="button">戻る</button></p>`;
  $('b').onclick = () => { screen = 'cover'; render(); scrollTo(0, 0); };
}

if (resumable()) screen = 'cover';
render();
})();
</script>
</body>
</html>
