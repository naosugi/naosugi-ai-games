<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>独裁AI監視シミュレーター</title>
<meta name="description" content="監視カードと報告AIを選び、AIに任せた国を監督する死に覚えローグライク">
<style>
/* 前作『独裁者AI国家シミュレーター』の配色と部品に合わせる */
:root{
  color-scheme:dark;
  --bg:#1a1a2e;--panel:#16213e;--deep:#0f3460;--accent:#e94560;--accent2:#d3405c;
  --text:#f0f0f0;--sub:#cccccc;--mute:#94a0b4;--good:#4caf50;--bad:#ff5252;--warn:#ffa726;--ai:#3498db;
  --in:#e67e22;--on:#f1c40f;--auto:#3498db;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
body{line-height:1.65}
button{cursor:pointer;font:inherit;background:var(--panel);color:var(--accent);border:2px solid var(--accent);padding:10px 20px;font-weight:bold;border-radius:6px;transition:background .2s,color .2s}
button:hover{background:var(--accent);color:var(--panel)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--panel)}
a{color:var(--accent)}
#app{max-width:1000px;margin:0 auto;padding-block:max(14px,env(safe-area-inset-top)) calc(100px + env(safe-area-inset-bottom));padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.fade{animation:fade .35s ease-in}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1,h2,h3,h4{line-height:1.3;text-wrap:balance}
.ptitle{color:var(--accent);font-size:1.45rem;text-align:center;margin:14px 0 6px}
.pdesc{color:var(--sub);text-align:center;margin:0 auto 14px;max-width:640px;font-size:.93rem}
.sect{color:var(--accent);font-weight:bold;font-size:.98rem;margin:18px 0 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sect small{color:var(--mute);font-weight:normal}

/* 表紙 */
.menu{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:10px}
.back{align-self:flex-start;color:var(--mute);font-size:13px;font-weight:bold;text-decoration:none}
.logo{font-size:clamp(1.6rem,6vw,2.5rem);color:var(--accent);text-shadow:0 2px 4px rgba(0,0,0,.5);margin-top:12px}
.subtitle{color:var(--sub);font-weight:bold;max-width:32em}
.menu-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:350px;margin-top:8px}
.menu-btns button{padding:14px 20px;font-size:1.08rem;border-radius:8px}
.menu-btns small{display:block;font-weight:normal;font-size:.78rem;opacity:.85}
.footer{color:var(--mute);font-size:.82rem;max-width:44em;margin-top:18px}

/* 世界観 */
.doc{background:var(--panel);border-radius:10px;padding:18px;display:grid;gap:12px;max-width:760px;margin:10px auto 0}
.doc h3{color:var(--accent);font-size:1.04rem}
.doc p,.doc dd{font-size:.93rem}
.doc dl{display:grid;gap:10px}
.doc dt{font-weight:bold;color:#ffd166}
.mode{display:inline-block;font-size:.72rem;font-weight:bold;border-radius:999px;padding:1px 9px;color:#111;white-space:nowrap}
.mode.in{background:var(--in)}.mode.on{background:var(--on)}.mode.auto{background:var(--auto)}

/* パラメータ（前作と同じ4枚のタイル） */
.hud{position:sticky;top:0;z-index:15;background:var(--bg);padding:6px 0 8px}
.hudtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:var(--panel);padding:8px 12px;border-radius:10px 10px 0 0}
.hudtop b{color:var(--accent);font-size:1.02rem;min-width:0}
.hudtop span{font-size:.8rem;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--bg)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s linear}
.params{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--panel);padding:8px;border-radius:0 0 10px 10px}
.param{display:flex;flex-direction:column;align-items:center;padding:7px 3px;border-radius:8px;background:var(--deep);border:1px solid var(--accent);min-width:0;position:relative}
.param.gap{background:#3a1626}
.param.danger{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.param h3{font-size:.76rem;color:var(--accent);white-space:nowrap}
.param .v{font-size:1.3rem;font-weight:bold;line-height:1.25;font-variant-numeric:tabular-nums}
.param .d{font-size:.72rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.param .act{font-size:.68rem;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)}.neg{color:var(--bad)}.zero{color:var(--sub)}
.bar{width:100%;height:5px;background:var(--bg);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .4s ease}
.float{position:absolute;right:4px;top:2px;font-size:.78rem;font-weight:bold;animation:floaty 1.2s ease-out forwards;font-variant-numeric:tabular-nums}
@keyframes floaty{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px)}}

/* カード */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px 14px;margin-top:6px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:2px solid var(--deep);border-radius:12px;padding:14px;color:var(--text);font-weight:normal;min-width:0}
button.card:hover{background:var(--panel);color:var(--text);border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card .kind{display:flex;justify-content:space-between;gap:6px;font-size:.74rem;color:var(--mute)}
.card .label{font-size:.72rem;color:var(--mute);display:block}
.card .main{display:block;background:none;padding:0;margin:0;border-radius:0;color:var(--accent);font-weight:bold;font-size:1rem;line-height:1.4}
.card .resp{font-size:.92rem;line-height:1.45}
.card .note{font-size:.8rem;color:var(--sub)}
.costs{background:var(--deep);border-radius:8px;padding:7px 10px;margin-top:auto;font-size:.78rem;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.costs div{display:flex;justify-content:space-between;gap:8px}
.costs span{color:var(--sub)}
.factor{display:grid;grid-template-columns:6em 1fr 2em;gap:6px;align-items:center;font-size:.76rem;font-variant-numeric:tabular-nums}
.factor i{display:block;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.factor i::after{content:"";display:block;height:100%;width:var(--v);background:var(--ai)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,52,96,.97);border-top:2px solid var(--accent);padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.dock-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dock-in>span{font-size:.84rem;color:#fff;min-width:0}
.dock button{flex:none;padding:10px 16px}

/* ステージの選択 */
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.stage{display:grid;gap:6px;text-align:left;background:var(--panel);border:2px solid var(--deep);border-radius:12px;padding:13px;color:var(--text);font-weight:normal;min-width:0}
.stage:hover{background:var(--panel);color:var(--text);border-color:var(--accent)}
.stage h3{color:var(--accent);font-size:1.03rem}
.stage p{font-size:.82rem;color:var(--sub)}
.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.plan div{background:var(--deep);border-radius:6px;padding:3px 2px;text-align:center;font-size:.78rem;font-variant-numeric:tabular-nums;min-width:0}
.plan em{display:block;font-style:normal;color:var(--mute);font-size:.66rem;white-space:nowrap}
.stage small{color:var(--mute);font-size:.72rem}

/* 進行 */
.main{background:var(--panel);border-radius:10px;padding:10px 12px;margin-top:8px}
.log{list-style:none;display:grid}
.log li{display:grid;grid-template-columns:2.9em 1fr;gap:6px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:.93rem;line-height:1.55;animation:in .3s ease-out}
.log time{font-size:.7rem;color:var(--mute);padding-top:3px;font-variant-numeric:tabular-nums}
.log li.head span{color:var(--accent);font-weight:bold}
.log li.notice span{color:#7fc4ff;font-weight:bold}
.log li.alert span{color:var(--bad);font-weight:bold}
.log li.event span{color:#ffd166}
.log li.calm span{color:var(--sub)}
.log li.status span{color:var(--mute);font-variant-numeric:tabular-nums}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.speed{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.speed button{min-width:46px;min-height:42px;padding:6px 8px;font-size:.84rem;border-width:1px}
.speed button.on{background:var(--accent);color:var(--panel)}
details.plain{margin-top:12px;background:var(--panel);border-radius:10px;padding:8px 12px}
details.plain summary{cursor:pointer;font-weight:bold;color:var(--accent);font-size:.9rem;min-height:30px}
.breakdown{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums;margin-top:6px}
.breakdown th,.breakdown td{padding:4px 5px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right}
.breakdown th:first-child,.breakdown td:first-child{text-align:left}
.breakdown th{color:var(--mute);font-weight:normal}

/* 判断 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.decide{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:18px;max-width:560px;width:100%;display:grid;gap:10px;animation:fade .2s}
.decide h3{color:var(--accent);font-size:1.15rem}
.decide .who{font-size:.8rem;color:var(--mute)}
.decide .quote{background:var(--deep);border-radius:8px;padding:10px 12px;font-size:.92rem}
.decide .conf{font-size:.84rem;color:var(--sub)}
.decide .conf b{color:#ffd166;font-size:1.05rem;font-variant-numeric:tabular-nums}
.choices{display:grid;gap:8px}
.choices button{text-align:left;padding:11px 14px;min-height:52px}
.choices small{display:block;font-weight:normal;font-size:.76rem;opacity:.85}

/* 結果 */
.rows{display:grid;gap:8px;max-width:560px;margin:0 auto}
.row{background:var(--deep);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:5.5em 1fr 1fr;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.row.head{background:none;padding:0 14px;font-size:.76rem;color:var(--mute)}
.row b{font-size:1.1rem}
.row span{text-align:right}
.delay{text-align:center;color:var(--warn);font-weight:bold;margin:12px 0 0}
.event{background:var(--deep);border:2px solid var(--accent);border-radius:12px;padding:20px;max-width:600px;margin:18px auto 0;text-align:center}
.event .tag{font-size:.78rem;background:var(--accent);color:var(--panel);font-weight:bold;border-radius:999px;padding:3px 12px}
.event h3{color:var(--accent);font-size:1.4rem;margin:10px 0}
.effs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.eff{background:var(--panel);border-radius:8px;padding:6px 12px;font-size:.88rem;display:flex;gap:8px}

/* 監視の発動 */
.log li.saved{grid-template-columns:2.9em 1fr;background:rgba(76,175,80,.14);border-left:4px solid var(--good);padding:9px 8px;margin:6px 0;border-radius:6px;border-bottom:0}
.log li.saved span{font-weight:bold;color:#c9f5cb}
.saves{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.save,.miss{background:var(--deep);border-radius:10px;padding:10px 12px;border-left:4px solid var(--good);display:grid;gap:3px;min-width:0}
.save.fatal{border-left-color:#ffd166;background:#3a3216}
.miss{border-left-color:var(--bad);background:#3a1626}
.savetop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.save b,.miss b{font-size:.95rem}
.save p,.miss p{font-size:.84rem}
.save small,.miss small{font-size:.78rem;color:var(--sub)}
.coverbox{background:rgba(255,255,255,.05);border-radius:8px;padding:7px 10px;font-size:.78rem;display:grid;gap:2px}
.coverbox div{display:flex;justify-content:space-between;gap:8px}
.coverbox .known{display:block}
.coverbox span{color:var(--sub)}
.coverbox .known b{display:block;font-weight:normal}
.st強{color:var(--good)}.st中{color:var(--warn)}.st弱{color:var(--bad)}
.irony{font-size:.84rem;color:#ffd166;font-weight:bold}
/* 開示 */
.reveal{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.reveal>section{min-width:0}
.endno{color:var(--sub);font-size:.85rem;text-align:center}
.endtitle{font-size:clamp(1.6rem,5.5vw,2.4rem);color:var(--accent);text-align:center;text-shadow:0 2px 8px rgba(233,69,96,.35)}
.endtitle.over{color:var(--bad)}
.enddesc{background:var(--deep);border-radius:10px;padding:18px;border-left:4px solid var(--accent);line-height:1.85}
.pair{display:grid;grid-template-columns:1fr 1fr;border-radius:8px;overflow:hidden}
.pair>div{padding:11px 13px;min-width:0}
.pair .rep{background:var(--deep)}.pair .tru{background:#3a1626}
.pair h4{font-size:.72rem;margin-bottom:3px;color:var(--mute)}
.pair .tru h4{color:var(--bad)}
.pair p{font-size:.88rem}
.pairhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:5px;flex-wrap:wrap}
.pairhead b{color:var(--accent)}
.pairhead span{font-size:.76rem;color:var(--mute)}
.pairs{display:grid;gap:14px}
.scroll{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.1);text-align:right;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{color:var(--mute);font-weight:normal;font-size:.76rem}
.cmp .off{color:var(--bad);font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--deep);border-radius:8px;padding:9px;text-align:center}
.stat span{display:block;font-size:.74rem;color:var(--sub)}
.stat b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.last{font-size:clamp(1.15rem,4.8vw,1.5rem);text-align:center;font-weight:bold;padding:14px 0;color:#ffd166}
.evs{display:grid;gap:8px;font-size:.88rem}
.evs small{display:block;color:var(--sub);font-size:.82rem}
.evs em{font-style:normal;color:var(--bad)}
.truthlog{list-style:none;font-size:.82rem;display:grid;gap:5px;color:var(--sub);margin-top:6px}
.unlock{text-align:center;color:#ffd166;font-weight:bold;background:linear-gradient(90deg,transparent,rgba(255,209,102,.18),transparent);padding:8px;font-size:.9rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* 記録 */
.reclist{display:grid;gap:10px}
.rec{background:var(--panel);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.rec h3{font-size:1rem;color:var(--accent)}
.rec p{font-size:.87rem}
.rec small{color:var(--mute);font-size:.76rem}
.rec b{font-size:.78rem;color:var(--sub)}
.gaps{font-size:.84rem;min-width:560px;border-collapse:collapse;width:100%}
.gaps th,.gaps td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.1);vertical-align:top}
.gaps th{font-size:.76rem;color:var(--mute)}

@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .stages{grid-template-columns:1fr}
  .pair{grid-template-columns:1fr}
  .param .v{font-size:1.08rem}
  .param h3{font-size:.7rem}
  .param .d{font-size:.66rem}
  .param .act{font-size:.62rem}
  .dock-in>span{font-size:.76rem}
  .speed button{min-width:40px;padding:6px 5px;font-size:.78rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.need{font-size:.82rem;color:var(--sub);line-height:1.6;margin-top:6px}.need b{color:var(--accent);margin-right:4px}
.delays{margin-top:8px;display:flex;flex-direction:column;gap:6px}.delays small{color:var(--sub)}.delay-row{display:grid;grid-template-columns:minmax(0,1fr) 70px 38px;gap:8px;align-items:center;font-size:.82rem}.delay-row i{display:block;height:8px;border-radius:4px;background:var(--accent);max-width:70px}.delay-row b{text-align:right}
.bridge{background:var(--panel);border-left:4px solid var(--accent);border-radius:10px;padding:18px;margin:22px 0;line-height:1.8}.bridge h3{color:var(--accent);margin-bottom:10px}.bridge p{margin-bottom:10px}.bridge ul,.bridge ol{padding-left:22px;margin-bottom:10px}.bridge-case b{color:var(--accent);margin-right:6px}
/* 折りたたみ、簡潔なカード、ドット絵 */
.pix{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;border-radius:8px;background:#000;border:2px solid var(--deep)}
.pixwrap{max-width:560px;width:100%;margin:0 auto}
.pixpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:760px;width:100%;margin:0 auto}
.fold{background:var(--panel);border-radius:10px;margin-top:10px;min-width:0}
.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:44px;padding:8px 12px 8px 30px;position:relative;font-weight:bold;color:var(--accent);font-size:.95rem}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▶";position:absolute;left:12px;top:13px;font-size:.66rem;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary small{font-weight:normal;color:var(--mute);font-size:.75rem}
.foldbody{padding:0 12px 12px;display:grid;gap:8px;min-width:0}
.cardwrap{display:flex;flex-direction:column;min-width:0;background:var(--deep);border-radius:12px}
.cardwrap .card{flex:1;padding:12px;border-radius:12px}
.cardwrap .fold{background:none;margin:0}
.cardwrap .fold>summary{min-height:36px;padding:5px 10px 5px 26px;font-size:.78rem;color:var(--sub);font-weight:normal}
.cardwrap .fold>summary::before{left:10px;top:11px}
.cardwrap .foldbody{font-size:.82rem;padding:0 10px 10px}
.foldbody .cards{margin-top:0;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.chips i{font-style:normal;font-size:.72rem;background:var(--deep);color:var(--sub);border-radius:5px;padding:1px 7px;font-variant-numeric:tabular-nums}
.card .resp{font-size:.82rem;color:var(--sub)}
.policybox{background:var(--deep);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin:8px 0}
.policybox p{font-size:.84rem;flex:1 1 220px}
.policy{display:flex;gap:5px;flex-wrap:wrap}
.pnote{font-size:.78rem;color:var(--mute);margin-top:8px}
.risk{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:.74rem;font-weight:bold;border-radius:5px;padding:2px 8px;background:var(--deep);color:var(--sub)}
.chip.guard厚い{color:var(--good)}.chip.guard普通{color:var(--warn)}.chip.guard薄い{color:var(--bad)}
.chip.deadly{background:var(--bad);color:#1a0508}
.chip.danger{background:#5a2030;color:#ffb3bf}
.knownrisk{display:flex;flex-direction:column;font-size:.76rem;gap:1px}
.stampwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.stamp{color:var(--accent);border:6px solid var(--accent);border-radius:12px;font-size:3rem;font-weight:bold;padding:6px 26px;background:rgba(26,26,46,.85);transform:rotate(-8deg);animation:stamp .22s ease-in both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.verdict{background:#3a3216;border-left:4px solid #ffd166;border-radius:10px;padding:12px 14px}
.verdict small{color:#ffd166;font-weight:bold}.verdict p{font-weight:bold;line-height:1.6}
.trail{list-style:none;display:grid;gap:3px;font-size:.84rem}

    ${fold('e_llm', '報告AIの本当の性格', `<div class="scroll">${llmTable}</div><div class="scroll">${biasTable}</div>`, false, '試験と本番の差')}
    ${fold('e_gap', '他国との差が開いた理由', `<div class="delays">${r.delays.map(d => `<div class="delay-row"><span>${esc(d.name)}</span><i style="width:${Math.max(4, d.value / maxD * 100)}%"></i><b>${d.pct}%</b></div>`).join('')}</div>`, false)}
    ${fold('e_saves', `防いだ事故 ${r.saves.length}件`, `<div class="saves">${r.saves.length ? savesHTML(r.saves) : '<p class="pdesc">監視は一度も事故を防げませんでした。</p>'}</div>`, false, r.saves.filter(x => x.fatal).length ? `うち致命 ${r.saves.filter(x => x.fatal).length}件` : '')}
    ${fold('e_miss', `防げなかった事故 ${r.missed.length}件`, `<div class="saves">${r.missed.length ? r.missed.map(m => `<div class="miss${m.fatal ? ' fatal' : ''}"><b>ステージ${m.stageNo} ${esc(m.name)}</b><small>${m.held ? '効くカードは持っていたが、止められなかった' : '効くカードを持っていなかった'}</small><p>効くカード：${m.cards.map(esc).join('／')}</p></div>`).join('') : '<p class="pdesc">防げなかった事故はありません。</p>'}</div>`, false)}
    ${fold('e_score', 'カードの戦績', `<div class="scroll"><table class="cmp"><thead><tr><th>カード</th><th>方式</th><th>発動</th><th>致命を阻止</th></tr></thead><tbody>${r.scoreboard.map(b => `<tr><td style="white-space:normal">${esc(b.detect)}</td><td>${MODE[b.mode][0]}</td><td>${b.fires}</td><td>${b.fatal}</td></tr>`).join('')}</tbody></table></div>`, false)}
    ${fold('e_num', '最後の数字', `<div class="stats">${stat('経済', v.metrics.economy)}${stat('電力', v.metrics.power)}${stat('体制秩序', v.metrics.order)}${stat('他国との差', v.metrics.gap)}${stat('忖度度', t.sontaku, t.sontaku >= 40)}${stat('AIの自律度', t.autonomy, t.autonomy >= 40)}${stat('他国の浸透度', t.foreign, t.foreign >= 40)}</div>`, false)}
    ${fold('e_ev', '事案の真相', `<div class="evs">${r.events.length ? r.events.map(e => `<div><b>${esc(e.name)}</b>${e.real ? '<em>（疑うべきだった）</em>' : '（空振り）'}<small>${esc(e.truth)}</small></div>`).join('') : '<div>事案は起きなかった。</div>'}</div>`, false)}
    ${fold('e_log', '真実の全記録', `<ol class="truthlog">${r.truthLog.map(l => `<li>${stamp(l)}　${esc(l.text)}</li>`).join('')}</ol>`, false)}
  </div>`;
  $('again').onclick = () => { for (const k of Object.keys(foldState)) if (k.startsWith('e_')) delete foldState[k]; startRun(); };
  $('recs').onclick = () => { backTo = 'cover'; screen = 'records'; render(); scrollTo(0, 0); };
  $('home').onclick = () => { screen = 'cover'; render(); scrollTo(0, 0); };
  scrollTo(0, 0);
}
function renderRecords() {
  const rec = Object.entries(meta.records || {});
  rec.sort((a, b) => (b[1].fatal ? 1 : 0) - (a[1].fatal ? 1 : 0) || b[1].count - a[1].count);
  const locked = Core.CARDS.filter(c => c.unlock && !c.base).sort((a, b) => a.unlock - b.unlock);
  app.innerHTML = `<div class="fade"><h2 class="ptitle">重大事故記録</h2><p class="pdesc">統治 ${meta.runs || 0} 回。記録が増えると、選べるカードが増えます。</p>
    ${fold('r_rec', `記録 ${rec.length}件`, `<div class="reclist">${rec.length ? rec.map(([id, r]) => `<div class="rec"><h3>${esc(r.name)}${r.fatal ? '（致命）' : ''}</h3><p>${esc(r.truth)}</p><small>${r.count}回</small>${realLine(Core.INCIDENT[id] && Core.INCIDENT[id].real)}${Core.INCIDENT[id] ? needHTML(Core.INCIDENT[id].need) : ''}</div>`).join('') : '<div class="rec"><p>まだ記録はありません。最初の統治の後に、ここに残ります。</p></div>'}</div>`, true)}
    ${fold('r_lock', '記録で解放されるカード', `<div class="reclist">${locked.map(c => { const open = rec.length >= c.unlock; return `<div class="rec"><h3>${open ? esc(c.name || c.detect) : '未解放'}</h3><small>${open ? '解放済み' : `記録${c.unlock}件で解放`}</small></div>`; }).join('')}</div>`, false)}
    ${rec.length ? `${fold('r_real', '現実との関連', `<div class="reclist">${Object.values(REAL).map(realHTML).join('')}</div>`, false, '実在の組織名はこの資料にだけ出ます')}
    ${fold('r_gaps', 'カードを作るために今足りないもの', `<div class="scroll"><table class="gaps"><thead><tr><th>カードの前提</th><th>現状</th><th>足りないもの</th></tr></thead><tbody>${Object.values(GAPS).map(g => `<tr><td>${esc(g[0])}</td><td>${esc(g[1])} <a href="${esc(g[3])}" target="_blank" rel="noopener">根拠</a></td><td>${esc(g[2])}</td></tr>`).join('')}</tbody></table></div>`, false, '2026年11月時点。足りないものは作者の判断です')}` : ''}
    <div class="acts" style="margin-top:18px"><button id="b" type="button">戻る</button></div></div>`;
  $('b').onclick = () => { screen = 'cover'; render(); scrollTo(0, 0); };
}

render();
})();
</script>
</body>
</html>
