<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0f2c">
<title>キーボード☆ドライバー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0f2c;--panel:#ffffff;--ink:#1d2340;--sub:#5f6788;--line:#e3e7f5;
  --accent:#ff8a2a;--accent2:#29c6ff;--star:#ffd23f;--ok:#2fbf71;--ng:#ff4d6d;
  --han:#2f7bff;--zen:#ff8a2a;--vh:100dvh;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input{font-family:inherit}
ruby rt{font-size:.45em;font-weight:700;letter-spacing:0}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.screen{position:fixed;left:0;right:0;top:0;height:var(--vh);display:none;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
.wrap{max-width:760px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}

/* ---------- 共通パーツ ---------- */
.card{background:var(--panel);border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.18);padding:14px}
.btn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;font-size:16px;background:#eef1fb;color:var(--ink);box-shadow:0 4px 0 #c9cfe6;transition:transform .06s}
.btn:active,.btn.pressed{transform:translateY(3px);box-shadow:0 1px 0 #c9cfe6}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 #c45f10}
.btn.primary:active,.btn.primary.pressed{box-shadow:0 1px 0 #c45f10}
.btn.blue{background:var(--accent2);color:#06233a;box-shadow:0 4px 0 #1b8fbd}
.btn.green{background:var(--ok);color:#fff;box-shadow:0 4px 0 #1f8a50}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--sub);font-size:13px}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffd23f 45%,#e0a100);box-shadow:inset 0 0 0 .08em #c98a00;vertical-align:-.12em;margin-right:.15em}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:13px;background:#eef1fb;color:var(--ink)}
.topbar{display:flex;align-items:center;gap:8px;color:#fff;margin-bottom:12px}
.topbar .title{font-weight:900;font-size:18px}
.back{color:#c9d3ff;font-weight:800;font-size:14px;text-decoration:none;padding:6px 2px}

/* ---------- タイトル ---------- */
#scr-title .wrap{display:flex;flex-direction:column;min-height:var(--vh);padding-top:max(16px,env(safe-area-inset-top))}
.logo{text-align:center;color:#fff;margin:22px 0 6px}
.logo .rocketsvg{width:96px;height:96px;filter:drop-shadow(0 6px 18px rgba(41,198,255,.45));animation:hover 2.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px) rotate(3deg)}}
.logo h1{font-size:clamp(28px,8.5vw,52px);font-weight:900;letter-spacing:.02em;line-height:1.15;text-shadow:0 4px 0 #1b2c80,0 0 24px rgba(41,198,255,.6)}
.logo h1 .st{color:var(--star);display:inline-block;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo p{margin-top:8px;color:#b8c4ff;font-weight:700;font-size:14px}
.slots{display:grid;gap:12px;margin:20px 0}
.slot{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.slot .no{width:42px;height:42px;border-radius:12px;background:#1b2c80;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.slot .info{flex:1;min-width:0}
.slot .nm{font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .st{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.5}
.slot.empty .nm{color:var(--sub)}
.foot{margin-top:auto;text-align:center;padding-top:10px}

/* ---------- ホーム ---------- */
.hud{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.hud .box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:6px 12px;color:#fff;min-width:0}
.hud .box small{display:block;font-size:11px;color:#b8c4ff;font-weight:700}
.hud .box b{font-size:17px;font-weight:900;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.1);color:#dfe5ff;font-weight:800;font-size:14px;border:2px solid transparent;position:relative}
.tab.on{background:#fff;color:var(--ink);border-color:var(--star)}
.tab .clr{color:var(--star);margin-left:2px}
.stagehead{color:#fff;margin:2px 2px 8px}
.stagehead h2{font-size:20px;font-weight:900;line-height:1.4}
.stagehead .muted{color:#b8c4ff}
.mapbox{position:relative;border-radius:18px;overflow:hidden;background:#071233;border:1px solid rgba(120,160,255,.35);box-shadow:inset 0 0 40px rgba(41,198,255,.15)}
#map{display:block;width:100%;height:300px;touch-action:manipulation}
.maplegend{position:absolute;left:10px;bottom:8px;color:#9fb3ff;font-size:11px;font-weight:700}
.progress{display:flex;align-items:center;gap:8px;margin:10px 2px;color:#fff;font-weight:800;font-size:14px}
.progress .bar{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--star),var(--accent));border-radius:99px}
.jobs{display:grid;gap:10px;margin-top:8px}
.job{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:3px solid transparent}
.job.sel{border-color:var(--accent)}
.job .ic{font-size:30px;width:44px;text-align:center;flex:none}
.job .route{font-weight:900;font-size:16px;line-height:1.45}
.job .route .arrow{color:var(--accent);margin:0 2px}
.job .meta{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.5}
.job .rw{text-align:right;flex:none;font-weight:900;font-size:16px}
.job .rw small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.job .far{color:var(--ng);font-weight:800}
.job .pick{color:#7a5cff;font-weight:800}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.resume{border:3px solid var(--accent2);margin-bottom:10px}

/* ---------- きょうか ---------- */
.rocketbox{display:flex;gap:14px;align-items:center}
.rocketbox svg{width:110px;height:110px;flex:none}
.speedbig{font-size:13px;color:var(--sub);font-weight:700}
.speedbig b{display:block;font-size:22px;color:var(--ink);font-weight:900;line-height:1.3}
.sec{color:#fff;font-weight:900;font-size:17px;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.fuel{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.fuel .badge{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;flex:none;color:#1d2340;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.fuel .nm{font-weight:900;font-size:15.5px;line-height:1.4}
.fuel .ds{font-size:12.5px;color:var(--sub);line-height:1.45}
.fuel.locked{background:#cdd3e4;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.fuel.locked .nm,.fuel.locked .ds{color:#6a7190}
.fuel.locked .badge{background:#d9ddea!important;color:#8a90a8}
.fuel .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--sub)}
.tog input{width:20px;height:20px;accent-color:var(--accent)}
.eng{display:flex;gap:4px;margin:8px 0}
.eng i{flex:1;height:12px;border-radius:4px;background:#e3e7f5}
.eng i.on{background:linear-gradient(90deg,var(--accent2),#7a5cff)}
.eng i.cap{background:repeating-linear-gradient(45deg,#e3e7f5,#e3e7f5 4px,#f4f6fc 4px,#f4f6fc 8px)}

/* ---------- ゲーム ---------- */
#scr-game{overflow:hidden}
#scr-game .gwrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 12px 8px;overflow-y:auto;max-width:860px;margin:0 auto}
.ghud{display:flex;align-items:center;gap:8px;color:#fff;background:rgba(6,12,40,.55);border-radius:16px;padding:4px}
.gmeter{background:rgba(6,12,40,.45);border-radius:14px;padding:4px 10px 4px;margin-top:6px}
.ghud .route{flex:1;min-width:0;font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.gbar{position:relative;height:16px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);border-radius:99px;margin:4px 8px 2px;overflow:visible}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent2),var(--star));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gbar .pickmark{position:absolute;top:-3px;bottom:-3px;width:3px;background:#c48bff;border-radius:2px}
.gbar .me{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(90deg);font-size:18px;transition:left .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px #fff)}
.gsub{display:flex;justify-content:space-between;color:#e2e8ff;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000}
.qcard{margin:10px auto 0;width:100%;max-width:640px;background:rgba(255,255,255,.96);border-radius:20px;padding:12px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.qtype{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--sub)}
.qtype .dot{width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#1d2340;font-size:13px}
.qtext{font-weight:900;text-align:center;line-height:1.9;margin:6px 0 2px;word-break:break-all;letter-spacing:.03em}
.qtext ruby rt{color:#7a5cff}
.qtext .han{border-bottom:4px solid var(--han);margin:0 1px}
.qtext .zen{border-bottom:4px solid var(--zen);margin:0 1px}
.legend{display:flex;justify-content:center;gap:12px;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:4px}
.legend .h{color:var(--han)}
.legend .z{color:var(--zen)}
.ansrow{display:flex;gap:8px;align-items:stretch;margin-top:6px}
#ans{flex:1;min-width:0;font-size:22px;font-weight:800;padding:10px 12px;border-radius:14px;border:3px solid #cfd6ef;outline:none;background:#fff;color:var(--ink)}
#ans:focus{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(41,198,255,.25)}
#ans.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#send{min-width:92px;font-size:18px}
.ansrow .btn{white-space:nowrap;flex:none}
.gbtns{display:flex;gap:8px;justify-content:space-between;margin-top:8px}
.fb{margin-top:8px;font-size:14px;font-weight:700;line-height:1.6;color:var(--ink)}
.fb .msg{background:#fff3f5;border-left:5px solid var(--ng);padding:6px 10px;border-radius:8px;margin-bottom:6px}
.fb .tip{background:#eef8ff;border-left:5px solid var(--accent2);padding:6px 10px;border-radius:8px;margin-bottom:6px}
.diff{font-size:18px;font-weight:800;letter-spacing:.04em;margin:4px 0;word-break:break-all}
.diff .lb{display:inline-block;font-size:11px;color:var(--sub);width:62px;letter-spacing:0}
.diff .x{background:#ffd6de;color:#c2002f;border-radius:4px;text-decoration:underline wavy #ff4d6d}
.diff .gap{display:inline-block;width:.8em;border-bottom:3px dashed #ff4d6d;margin:0 1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{min-width:44px;border-radius:12px;background:#f2f4fb;border:2px solid #e1e5f3;text-align:center;padding:4px 6px}
.chip .s{font-size:20px;font-weight:900;line-height:1.2}
.chip .k{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:15px;color:#1b2c80}
.chip .alt{font-size:11px;color:var(--sub);font-family:ui-monospace,Menlo,Consolas,monospace}
.chip .t{font-size:10.5px;font-weight:900;margin-top:1px}
.chip.kanji{background:#eaf8ff;border-color:#a8e4ff}
.chip.kanji .t{color:#0b84b8}
.chip.kata{background:#fff9e0;border-color:#ffe48a}
.chip.kata .t{color:#a07800}
.chip.han{border-color:var(--han)}.chip.han .t{color:var(--han)}
.chip.zen{border-color:var(--zen)}.chip.zen .t{color:var(--zen)}
.float{position:fixed;left:50%;top:calc(var(--vt,0px) + 118px);transform:translate(-50%,-50%);font-weight:900;font-size:24px;color:#fff;text-shadow:0 3px 0 #1b2c80,0 0 18px var(--accent2);pointer-events:none;z-index:30;animation:floatup 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10%) scale(.7)}15%{opacity:1;transform:translate(-50%,-30%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.toast{position:fixed;left:50%;bottom:calc(var(--kb,0px) + 20px);transform:translateX(-50%);background:#1b2c80;color:#fff;font-weight:800;padding:10px 16px;border-radius:14px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:92vw;text-align:center;font-size:14px;animation:toast 2.6s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ---------- モーダル ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,25,.72);display:none;align-items:flex-start;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 12px 14px;overflow-y:auto;height:var(--vh)}
.modal.on{display:flex}
.modal .card{width:100%;max-width:620px;margin:auto 0;padding:18px}
.modal h3{font-size:20px;font-weight:900;line-height:1.5;margin-bottom:8px}
.modal p{font-size:15.5px;line-height:1.85;font-weight:700;margin-bottom:8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.tut-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tut-top .badge{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#1d2340;flex:none}
.tut-top .ttl{font-size:12px;font-weight:900;color:var(--sub)}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.dots i{width:9px;height:9px;border-radius:50%;background:#d7dcee}
.dots i.on{background:var(--accent)}
.exs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.exs .chip .k{font-size:14px}
input.txt{width:100%;font-size:20px;font-weight:800;padding:10px 12px;border-radius:14px;border:3px solid #cfd6ef;outline:none}
input.txt:focus{border-color:var(--accent2)}
.practice .q{font-size:30px;font-weight:900;text-align:center;margin:6px 0;line-height:1.9}
.practice .q ruby rt{color:#7a5cff}
.okmark{color:var(--ok);font-weight:900}

/* キーボード図 */
.kb{background:#dfe4f2;border-radius:12px;padding:6px;margin:8px 0 10px;user-select:none}
.kb .r{display:flex;gap:3px;margin-bottom:3px}
.kb .k{flex:1 1 0;min-width:0;height:28px;border-radius:6px;background:#fff;box-shadow:0 2px 0 #b7bfd8;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#5f6788;white-space:nowrap;overflow:hidden}
.kb .k.w15{flex-grow:1.5}.kb .k.w2{flex-grow:2}.kb .k.w25{flex-grow:2.5}.kb .k.w6{flex-grow:6}
.kb .k.hl{background:var(--accent);color:#fff;box-shadow:0 2px 0 #c45f10;animation:blink 1s ease-in-out infinite}
.kb .k.sp{visibility:hidden}
@keyframes blink{50%{filter:brightness(1.25)}}
.kb .fr .k{height:20px;font-size:9.5px}

/* ローマ字ひょう */
.rtable{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rtable div{background:#f2f4fb;border-radius:8px;text-align:center;padding:3px 0}
.rtable b{display:block;font-size:18px;line-height:1.3}
.rtable span{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#1b2c80;font-weight:800}
.rtable .e{background:transparent}
.rt-h{font-weight:900;margin:12px 0 6px;font-size:14px;color:var(--sub)}

/* とうちゃく */
.arrive{text-align:center}
.arrive .big{font-size:34px;font-weight:900;color:var(--accent);line-height:1.3;margin:4px 0}
.arrive .place{font-size:24px;font-weight:900;line-height:1.7}
.arrive .rw{font-size:26px;font-weight:900;margin:10px 0}
.arrive .stamp{display:inline-block;margin:6px auto;padding:6px 14px;border:4px solid var(--ng);color:var(--ng);border-radius:12px;font-weight:900;transform:rotate(-6deg);font-size:18px;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.arrive .clear{margin-top:10px;padding:10px;border-radius:14px;background:linear-gradient(135deg,#fff6c8,#ffe1b8);font-weight:900;line-height:1.6}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stamps span{font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;background:#eef1fb;color:#9aa2bf}
.stamps span.got{background:#ffe8ee;color:var(--ng)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:800}
.set-row input{width:24px;height:24px;accent-color:var(--accent)}

@media (max-width:420px){
  .btn{font-size:15px;padding:9px 13px}
  #ans{font-size:20px}
  .job .route{font-size:15px}
  .kb .k{font-size:9px;height:24px}
}
@media (min-height:700px) and (min-width:700px){
  #map{height:360px}
}

.tab .rec{position:absolute;top:-8px;right:-4px;background:var(--ng);color:#fff;font-size:9.5px;font-weight:900;padding:1px 5px;border-radius:99px}
.tabs{padding-top:8px}
.hintbar{display:block;width:100%;text-align:left;background:rgba(255,210,63,.15);border:1px solid rgba(255,210,63,.5);color:#ffe9a3;font-weight:800;font-size:13.5px;border-radius:12px;padding:8px 12px;margin:-2px 0 10px;line-height:1.5}
.need{font-size:12px;color:#c45f10;font-weight:800;line-height:1.45;margin-top:3px}
.need.ok{color:var(--ok)}

</style>
</head>
<body>
<canvas id="bg"></canvas>
<section id="scr-title" class="screen"></section>
<section id="scr-home" class="screen"></section>
<section id="scr-up" class="screen"></section>
<section id="scr-game" class="screen"></section>
<div id="modal" class="modal"><div class="card" id="mbody"></div></div>
<script>
// ---- world.js ----
// ===== world.js : ばしょ と きょり =====
// 日本・世界は実際の緯度経度から大圏距離を計算。
// 宇宙は「おおよその位置」：惑星はJPLの近似ケプラー要素（J2000）から現在日時の位置を計算、
// 衛星は実際の軌道半径・周期で円運動（月以外の位相は仮）、恒星は赤経・赤緯・距離から計算。
var KDW = (function () {
  var AU = 149597870.7;          // km

  function hintChips(src) {

    var rd = reading(src);

    if (/[a-z]/i.test(inp) && !/[a-z]/i.test(nfkc(ans))) {

    }
    if (inp.indexOf('n') >= 0 && ans.indexOf('ん') >= 0 && !/[a-z]/i.test(nfkc(ans))) {
      msgs.push('「ん」は n を 2かい（nn）うつと きれいに でるよ。');
    }
    if (Array.from(inp).some(isHalfKata)) {
      msgs.push('はばの せまい カタカナ（はんかくカタカナ）に なっているよ。F7キーか へんかんで ふつうの カタカナに しよう。');
    }
    if (inp !== ans && toHira(inp) === toHira(ans)) {
      var needKata = ansC.some(function (c, i) { return isKata(c) && c !== 'ー' && inpC[i] !== c; });

        else if (isZenAlnum(c)) zenNeed.push(c);
        else if (isAscii(c)) hanNeed.push(c);
      });
      if (zenNeed.length) msgs.push('「' + zenNeed.join('') + '」は ぜんかく（はばが ひろい もじ）だよ。');
      if (hanNeed.length) msgs.push('「' + hanNeed.join('') + '」は はんかく（はばが せまい もじ）だよ。');
      if (symNeed.length) msgs.push('「' + symNeed.join('') + '」は ぜんかく だよ。ひらがなモードの まま うつと ぜんかくに なるよ。');
      if (zenNeed.length || hanNeed.length) msgs.push('へんかん（スペースキー）で えらぶか、F9キー（ぜんかく）・F10キー（はんかく）で かえられるよ。');
      if (!msgs.length) msgs.push('はばの ちがう もじが まざっているよ。あかい ところを よく みてね。');
    } else if (inp.toLowerCase() === ans.toLowerCase() || nfkc(inp).toLowerCase() === nfkc(ans).toLowerCase()) {
      msgs.push('おおもじ と こもじ が ちがうよ。おおもじは Shift キーを おしながら うとう。');
    } else if (hasKanji && (inp === rd || toHira(inp) === toHira(rd))) {

    var ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var w = r.width, h = r.height, st = stageState(stage.id), jd = W.jdNow();

    ctx.font = '700 11px ' + getComputedStyle(document.body).fontFamily;
    if (stage.kind === 'geo') {
      var lat0 = stage.id === 'japan' ? 36 : 20;
      var proj = function (p) {

      };

      var minx = Math.min.apply(0, xs), maxx = Math.max.apply(0, xs), miny = Math.min.apply(0, ys), maxy = Math.max.apply(0, ys);
      var sc = Math.min((w - pad * 2) / (maxx - minx), (h - pad * 2) / (maxy - miny));

      var step = stage.id === 'japan' ? 5 : 30;

      for (var lo = -180; lo <= 180; lo += step) { var xx = tp([lo * Math.cos(lat0 * Math.PI / 180), 0])[0]; if (xx < 0 || xx > w) continue; ctx.beginPath(); ctx.moveTo(xx, 0); ctx.lineTo(xx, h); ctx.stroke(); }

      ctx.strokeStyle = 'rgba(160,120,255,0.22)'; ctx.fillStyle = 'rgba(190,170,255,0.6)';

  // ================= チュートリアル =================
  function openTutorial(id, opts) {

  // ================= ゲーム =================
  var G = { src: null, type: null, tries: 0, enterTip: false, recent: {} };
  function startTrip(i) {
    var stage = stageById(S.cur), st = stageState(stage.id), job = st.jobs[i]; if (!job) return;
    var jd = W.jdNow(), legs = [];
    if (st.pos !== job.o) legs.push({ from: st.pos, to: job.o, dist: W.dist(stage, st.pos, job.o, jd) });
    legs.push({ from: job.o, to: job.d, dist: W.dist(stage, job.o, job.d, jd) });
    st.jobs.splice(i, 1);

    enterGame();
  }
  function enterGame() {
    G.busy = false; G.combo = 0;

    show('scr-game');

    renderGameHUD();
    nextProblem();
  }
  function renderGameHUD() {
    var tr = S.trip, stage = stageById(tr.stage), leg = tr.legs[tr.leg];
    var pickup = tr.legs.length > 1 && tr.leg === 0;
    var frac = Math.min(1, tr.prog / leg.dist);
    var left = Math.ceil(Math.max(0, leg.dist - tr.prog) / Math.min(speed(), leg.dist / 3) - 1e-9);
    for (var i = tr.leg + 1; i < tr.legs.length; i++) left += E.answersFor(tr.legs[i].dist, speed());
    $('#groute').innerHTML = tr.job.cargo + ' ' + (pickup ? '<span style="color:#e2c8ff">うけとりに いく：</span>' + ruby(W.place(stage, leg.to).name) : ruby(W.place(stage, tr.job.o).name) + ' → ' + ruby(W.place(stage, tr.job.d).name));
    $('#gfill').style.width = (frac * 100) + '%';
    $('#gme').style.left = (frac * 100) + '%';
    $('#gleft').innerHTML = (pickup ? 'うけとりまで ' : 'とうちゃくまで ') + fmtKm(Math.max(0, leg.dist - tr.prog));
    $('#gcount').innerHTML = 'あと やく ' + fmtNum(Math.max(1, left)) + 'かい';
    BG.setProg(frac);
  }
  function pickProblem() {
    var types = FUEL_IDS.slice(0, S.fuel).filter(function (id) { return !S.off[id]; });
    if (!types.length) types = ['hira'];
    var newest = FUEL_IDS[S.fuel - 1];
    var ws = types.map(function (id) { return id === newest && types.length > 1 ? 2.5 : 1; });
    var tot = ws.reduce(function (a, b) { return a + b; }, 0), r = Math.random() * tot, ti = 0;
    for (; ti < ws.length - 1; ti++) { r -= ws[ti]; if (r <= 0) break; }
    var type = types[ti], list = P[type];
    var rec = G.recent[type] = G.recent[type] || [];
    var idx, guard = 0;
    do { idx = rnd(list.length); } while (rec.indexOf(idx) >= 0 && guard++ < 50);
    rec.push(idx); if (rec.length > Math.min(40, Math.floor(list.length * 0.6))) rec.shift();
    return { type: type, src: list[idx] };
  }
  function nextProblem() {
    var p = pickProblem();
    G.src = p.src; G.type = p.type; G.tries = 0; G.enterTip = false;
    var t = T[p.type];
    $('#qtype').innerHTML = '<span class="dot" style="background:' + t.color + '">' + esc(t.icon) + '</span>' + ruby(t.name);
    var surf = K.surface(p.src), len = Array.from(surf).length;
    var fs = len <= 4 ? 44 : len <= 8 ? 36 : len <= 14 ? 28 : len <= 20 ? 23 : 20;
    var qt = $('#qtext'); qt.style.fontSize = 'min(' + fs + 'px,' + (fs / 4.2).toFixed(1) + 'vw)';
    if (window.innerWidth >= 500) qt.style.fontSize = Math.round(fs * 1.25) + 'px';

  // iPhone/iPad では pointerdown を止めても ボタンに フォーカスが うつり、キーボードが とじてしまう。
  // touchstart を止めて touchend で うごかすと、入力欄の フォーカスと キーボードが そのまま のこる。
  function keepFocusButton(el, fn, input) {
    var touchedAt = 0;
    el.addEventListener('touchstart', function (e) { e.preventDefault(); el.classList.add('pressed'); }, { passive: false });
    el.addEventListener('touchmove', function (e) {
      var t = e.changedTouches[0], r = el.getBoundingClientRect();
      if (t.clientX < r.left || t.clientX > r.right || t.clientY < r.top || t.clientY > r.bottom) el.classList.remove('pressed');
    }, { passive: true });
    el.addEventListener('touchend', function (e) {
      e.preventDefault();
      var on = el.classList.contains('pressed');
      el.classList.remove('pressed');
      touchedAt = Date.now();
      if (!on || el.disabled) return;
      fn();
      var inp = typeof input === 'function' ? input() : input;
      if (inp && document.activeElement !== inp) { try { inp.focus({ preventScroll: true }); } catch (err) { inp.focus(); } }
    }, { passive: false });
    el.addEventListener('touchcancel', function () { el.classList.remove('pressed'); });
    el.addEventListener('mousedown', function (e) { e.preventDefault(); });
    el.addEventListener('click', function () { if (Date.now() - touchedAt < 800) return; fn(); });
  }
  // へんかん中（したせんが ある あいだ）かどうか
  function trackComposing(inp) {
    inp._composing = false;
    inp.addEventListener('compositionstart', function () { inp._composing = true; });
    inp.addEventListener('compositionend', function () { inp._composing = false; });
    inp.addEventListener('blur', function () { inp._composing = false; });
  }

  function correct() {
    var tr = S.trip, stage = stageById(tr.stage), leg = tr.legs[tr.leg];
    var first = G.tries === 0;
    var step = speed() * (first ? 1.2 : 1);
    step = Math.min(step, leg.dist / 3 + 1e-6);
    var gained = Math.min(step, leg.dist - tr.prog);
    tr.prog += step; tr.cnt++;
    S.stats.correct++; if (first) S.stats.firstTry++;
    G.combo = first ? (G.combo || 0) + 1 : 1;
    snd('ok', G.combo); snd(stage.id === 'stars' ? 'warp' : 'boost');
    BG.kick(stage.id === 'stars' ? 1.6 : 1.1);
    floatText((G.combo >= 3 ? '<span style="color:#ff8a2a">' + G.combo + 'れんぞく！</span> ' : first ? '<span style="color:#ffd23f">いっぱつ！</span> ' : 'せいかい！ ') + '+' + fmtKm(gained).replace(/<ruby>光年<rt>こうねん<\/rt><\/ruby>/, '光年'));
    if (tr.prog >= leg.dist - 1e-6) {
      if (tr.leg < tr.legs.length - 1) {
        tr.leg++; tr.prog = 0;
        S.stages[tr.stage].pos = leg.to;
        save();
        toast('📦 ' + ruby(W.place(stage, leg.to).name) + ' で にもつを つんだ！ つぎは おとどけ！'); snd('pickup');
        BG.setScene('game', stage.id, tr.legs[tr.leg].to);
        renderGameHUD(); nextProblem();
        return;
      }
      save();
      renderGameHUD();
      G.busy = true;
      setTimeout(arrive, 450);
      return;
    }
    save();
    renderGameHUD();
    nextProblem();
  }
  function arrive() {
    G.busy = false;
    if (!S.trip) return;
    var tr = S.trip, stage = stageById(tr.stage), st = S.stages[tr.stage], job = tr.job;
    var isNew = !st.visited[job.d];
    st.visited[job.d] = true; st.deliveries++; st.pos = job.d;
    S.coins += job.reward; S.stats.trips++;
    var cleared = false, bonus = 0;
    if (!st.cleared && Object.keys(st.visited).length >= stage.clearN) {
      st.cleared = true; cleared = true; bonus = E.niceRound(job.reward * 3); S.coins += bonus;
    }

    var html = '<div class="arrive"><div class="big">とうちゃく！</div><div class="place">' + ruby(W.place(stage, job.d).name) + '</div>' +
      (W.place(stage, job.d).note ? '<div class="muted">' + ruby(W.place(stage, job.d).note) + '</div>' : '') +

      '<div class="rw">ほうしゅう ' + coins(job.reward) + '</div>' + (isNew ? '<div class="stamp">スタンプ ゲット！</div>' : '');
    if (cleared) html += '<div class="clear">🏆 ステージ' + stage.no + '「' + ruby(stage.title) + '」クリア！<br>クリアボーナス ' + coins(bonus) + (stage.no < 5 ? '<br><span class="muted">つぎの ステージにも ちょうせん してみよう！</span>' : '') + '</div>';
    if (all) html += '<div class="clear">👑 この ステージの スタンプを ぜんぶ あつめた！</div>';
    if (ending) html += '<div class="clear">🌌 250まん こうねん さきの アンドロメダぎんがに にもつを とどけた！<br>' + esc(S.name) + ' は でんせつの パイロットだ！</div>';
    html += '<div class="acts" style="justify-content:center"><button class="btn primary" data-m="ok">ホームへ</button></div></div>';

  }

  // ゲーム画面の くみたて
  $('#scr-game').innerHTML =
    '<div class="gwrap"><div class="ghud"><button class="btn ghost small" id="gpause">← やすむ</button><div class="route" id="groute"></div><button class="btn ghost small" id="grom">🔤</button></div>' +
    '<div class="gmeter"><div class="gbar"><i id="gfill"></i><span class="me" id="gme">' + miniRocket() + '</span></div>' +
    '<div class="gsub"><span id="gleft"></span><span id="gcount"></span></div></div>' +
    '<div class="qcard"><div class="qtype" id="qtype"></div><div class="qtext" id="qtext"></div><div id="qlegend"></div>' +
    '<div class="ansrow"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="enter" placeholder="ここに うってね"><button class="btn primary" id="send">おくる</button></div>' +
    '<div class="gbtns"><button class="btn small" id="ghint">💡 ヒント</button><button class="btn small" id="gpass">べつの もんだい</button></div>' +
    '<div class="fb" id="fb"></div></div></div>';
  var ansEl = $('#ans');
  trackComposing(ansEl);
  keepFocusButton($('#send'), function () { submit(); }, ansEl);
  // もんだいの カードや 背景を タップしたら 入力欄に もどる
  $('#scr-game').addEventListener('click', function (e) {
    if (e.target.closest('button,input,a') || $('#modal').classList.contains('on')) return;
    refocus();
  });
  var lastKey = 0;
  $('#ans').addEventListener('input', function () { if (Date.now() - lastKey > 60) snd('key'); });
  $('#ans').addEventListener('keydown', function (e) {
    if (!e.repeat && e.key !== 'Shift' && e.key !== 'Control' && e.key !== 'Alt' && e.key !== 'Meta') { lastKey = Date.now(); snd('key'); }
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      if ($('#ans').value && !G.enterTip) { G.enterTip = true; $('#fb').insertAdjacentHTML('afterbegin', '<div class="tip">かくてい できたら「おくる」ボタンを おしてね！</div>'); }
    }
  });
  keepFocusButton($('#ghint'), function () {
    var c = K.hintChips(G.src);
    var fb = $('#fb');
    if (fb.querySelector('.chips')) return;
    fb.insertAdjacentHTML('beforeend', '<div class="tip">うちかたの ヒント</div>' + chipsHTML(c)); refocus();
  }, ansEl);
  keepFocusButton($('#gpass'), function () { G.combo = 0; nextProblem(); toast('べつの もんだいに したよ'); }, ansEl);
  $('#grom').addEventListener('click', function () { openRomaji(true); });
  $('#gpause').addEventListener('click', function () {
    openModal('<h3>ひとやすみ</h3><p>ホームに もどっても、はいたつの つづきから とべるよ。</p><div class="acts"><button class="btn" data-m="home">ホームへ</button><button class="btn primary" data-m="go">つづける</button></div>', function (a) {
      closeModal(); if (a === 'home') { save(); goHome(); } else refocus();
    });
  });

  // ---------- スマホの キーボード たいおう ----------
  function onVV() {
    var vv = window.visualViewport;
    var hgt = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--vh', hgt + 'px');
    document.documentElement.style.setProperty('--kb', Math.max(0, window.innerHeight - hgt) + 'px');
    var top = vv ? vv.offsetTop : 0;
    document.querySelectorAll('.screen').forEach(function (s) { s.style.top = top + 'px'; });
    document.documentElement.style.setProperty('--vt', top + 'px');
    $('#modal').style.top = top + 'px';
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', onVV); visualViewport.addEventListener('scroll', onVV); }
  window.addEventListener('resize', function () { onVV(); if (curScreen === 'scr-home') drawMap(stageById(S.cur)); });
  onVV();

  // テスト用
  window.__kd = { get S() { return S; }, set S(v) { S = v; }, save: save, goHome: goHome, renderUp: renderUp, check: K.check, G: G, submit: submit, show: show };

  renderTitle();
})();

</script>
</body>
</html>
