<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14532D">
<title>アーッ！とゴルフ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7FAF8;--white:#fff;--ink:#17241C;--muted:#5F7368;--line:#DCE6DF;
  --green:#14532D;--green2:#2F7D4A;--greenSoft:#E6F1EA;
  --blue:#1E6FB8;--blueSoft:#E3EEF8;--warn:#C2453A;
  --font:'Zen Kaku Gothic New',system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  --num:'Barlow Condensed','Zen Kaku Gothic New',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ボタン */
.btn{font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;transition:background .15s,border-color .15s,transform .08s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn.toggle.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.light{background:#fff;border-color:#fff;color:var(--green);font-weight:700}
.btn.wide{width:100%}
.chipbtn{padding:6px 11px;font-size:13.5px;border-radius:999px}
.chipbtn.on{background:var(--green);border-color:var(--green);color:#fff}

/* タイトル〜キャラ作成 */
#screen{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hero{position:relative;height:46vh;min-height:260px;background:var(--blue);overflow:hidden}
.hero-text{position:absolute;left:24px;right:24px;top:calc(18% + env(safe-area-inset-top));color:#fff}
.hero h1{font-weight:700;font-size:54px;line-height:1.08;letter-spacing:.04em}
.hero p{margin-top:12px;font-size:18px;letter-spacing:.3em;opacity:.95}
.hills{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:42%}
.flag{position:absolute;right:20%;bottom:20%;width:34px;height:60px}
.pane{max-width:460px;margin:0 auto;padding:22px 20px calc(28px + env(safe-area-inset-bottom))}
.pane h2{font-size:21px;font-weight:700;line-height:1.4}
.pane .lead{margin-top:6px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.segbtn{padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:13px}
.segbtn .num{font-size:34px;font-weight:600;line-height:1;color:var(--green)}
.howto{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.howto summary{cursor:pointer;font-weight:700;color:var(--green);list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:"＋";float:right;color:var(--muted)}
.howto[open] summary::after{content:"－"}
.howto ol{margin:10px 0 0 20px;font-size:14px;line-height:1.75;color:#33463b}
.step{font-size:13px;color:var(--muted)}
.prog{height:4px;background:var(--line);border-radius:2px;margin:8px 0 20px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green2);transition:width .3s}
.field{margin-top:14px;font-size:16px;font:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);width:100%}
.field:focus{outline:2px solid var(--blue);outline-offset:1px}
.qopt{display:block;width:100%;text-align:left;margin-top:10px;padding:16px;line-height:1.55;font-size:15.5px}
.qopt:active{background:var(--greenSoft);border-color:var(--green2)}
.mt{margin-top:22px}
.typename{font-size:34px;font-weight:700;color:var(--green);line-height:1.25;margin-top:6px}
.tag{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:999px;background:var(--blueSoft);color:var(--blue);font-size:13.5px;font-weight:700}
.desc{margin-top:18px}
.desc p{padding:2px 0 2px 14px;border-left:3px solid var(--greenSoft);margin-top:12px;line-height:1.8}
.reveal .typename,.reveal .tag,.reveal .desc p{animation:rise .5s both}
.reveal .tag{animation-delay:.15s}
.reveal .desc p:nth-child(1){animation-delay:.3s}.reveal .desc p:nth-child(2){animation-delay:.42s}
.reveal .desc p:nth-child(3){animation-delay:.54s}.reveal .desc p:nth-child(4){animation-delay:.66s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.modes{display:grid;gap:10px;margin-top:14px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;text-align:left}
.mode b{font-size:19px;color:var(--green)}.mode span{font-size:13px;color:var(--muted)}
.label{margin-top:18px;font-size:13px;color:var(--muted);font-weight:700}
.seats{margin-top:6px}.seat{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.seat .opt{flex:1}.seat .rm{flex:0 0 auto}
.warnTxt{margin-top:10px;color:var(--warn);font-size:13px}
.lineup{margin-top:14px}.lu{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lu b{font-size:16px}.lu small{display:block;color:var(--muted);font-size:13px}
.cpuTag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--blueSoft);color:var(--blue);font-size:11.5px;font-weight:700;vertical-align:middle}
.scwrap{overflow-x:auto;margin-top:6px}
.totals{margin-top:10px;font-size:14px}.totals b{font-size:18px;margin-left:2px}
.finalHead{font-size:20px;font-weight:700;margin-top:10px}.finalHead .num{font-size:26px;color:var(--blue)}
.homeLink{position:absolute;left:max(16px,calc(50% - 230px));top:calc(12px + env(safe-area-inset-top));z-index:2;color:#fff;font-size:13px;font-weight:700;text-decoration:none;opacity:.9;padding:6px 2px}
.homeLink:focus-visible,.homeLink2:focus-visible{outline:2px solid #fff;outline-offset:2px}
.homeLink2{color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}
@media (min-width:700px){
  body{background:#E9F0EB}
  .hero-text{left:max(24px,calc(50% - 230px));right:auto;width:460px}
  #game{max-width:480px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 0 100vmax #E9F0EB}
  #overlay.full .handoff{max-width:480px}
}
/* ゲーム画面 */
#game{height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
#hud{background:#fff;border-bottom:1px solid var(--line);padding:calc(5px + env(safe-area-inset-top)) 8px 5px}
.hud-top{display:flex;align-items:center;gap:8px}
.holeNo{width:30px;height:30px;flex:0 0 auto;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:22px}
.holeMeta{display:flex;flex-direction:column;line-height:1.1}
.holeMeta{flex:0 0 auto}.holeMeta b{font-family:var(--num);font-size:15px;font-weight:600}
.holeMeta span{font-family:var(--num);font-size:13px;color:var(--muted)}
.wind{flex:0 0 auto;display:flex;align-items:center;gap:5px;color:var(--blue)}
.wind .spd{font-family:var(--num);font-size:20px;font-weight:600;line-height:1}
.wind .spd small{font-size:13px;margin-left:1px}
.wind .up{font-size:10px;color:var(--muted);line-height:1.15;white-space:nowrap}
#board{flex:1;min-width:0;display:flex;gap:4px}
.pl{flex:1;min-width:0;padding:1px 2px 2px;border-bottom:2px solid transparent}
.pl.cur{border-bottom-color:var(--green)}
.pl-top{display:flex;align-items:center;gap:3px;font-size:11.5px;white-space:nowrap}
.pl-top .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pl-top .sc{font-size:14px;font-weight:600}
.pl small{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.cur small{color:var(--green);font-weight:700}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto;vertical-align:middle}
#mapWrap{flex:1;position:relative;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#press{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(55,6,6,.78) 100%)}
#press.beat{animation:beat 1.05s ease-in-out infinite}
@keyframes beat{0%,100%{filter:none}12%{filter:brightness(1.35)}24%{filter:none}36%{filter:brightness(1.2)}}
.mapBtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapBtns .btn{width:38px;height:38px;padding:0;border-radius:50%;font-size:18px;font-weight:700;color:var(--green);border-color:rgba(255,255,255,.9);background:rgba(255,255,255,.92)}
.mapBtns .btn.small{font-size:11.5px}
.mapBtns .btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:4;opacity:0}
#banner b{display:inline-block;padding:6px 20px;font-size:30px;font-weight:700;color:#fff;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
#banner.show{animation:banner 1.6s ease-out both}
#banner.blue b{color:#fff;background:var(--blue);border-radius:10px;text-shadow:none}
#banner.white b{color:var(--green);background:#fff;border-radius:10px;text-shadow:none}
@keyframes banner{0%{opacity:0;transform:scale(.85)}12%{opacity:1;transform:scale(1.04)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}

/* パネル */
#panel{background:#fff;border-top:1px solid var(--line);border-radius:16px 16px 0 0;margin-top:-12px;position:relative;z-index:3;overflow:hidden;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.stedge{position:absolute;left:0;right:0;top:0;height:4px;background:var(--line)}.stedge i{display:block;height:100%}.stedge i.ok{background:var(--green2)}.stedge i.mid{background:var(--blue)}.stedge i.low{background:var(--warn)}
.stn{font-size:12px;color:var(--muted);white-space:nowrap}.stn b{font-family:var(--num);font-size:16px;font-weight:600;color:var(--ink);margin-left:2px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.who{display:flex;align-items:center;gap:7px;font-size:16px;min-width:0}
.who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .muted{font-size:13.5px;white-space:nowrap}
.yd{display:flex;align-items:baseline;gap:3px}
.yd .muted{font-size:12px;margin-right:3px}
.yd b{font-family:var(--num);font-size:30px;font-weight:600;line-height:.95;color:var(--green)}
.yd .u{font-family:var(--num);font-size:16px;color:var(--muted)}
.stam{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .9s ease,background-color .9s}
.bar i.ok{background:var(--green2)}.bar i.mid{background:var(--blue)}.bar i.low{background:var(--warn)}
.stam b{font-family:var(--num);font-size:17px;font-weight:600;color:var(--ink);min-width:24px;text-align:right}
.stam .dl{font-family:var(--num);font-size:15px;font-weight:600;min-width:28px}
.dl.up{color:var(--green2)}.dl.down{color:var(--warn)}
.curve{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.curve input{flex:1;accent-color:var(--green);height:30px}
.curve b{color:var(--ink);font-weight:500;min-width:96px;text-align:right;font-size:13px}
.sumline{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;margin-top:8px}
.actions .btn{flex:1;padding:11px 6px}
.actions .ghost{flex:0 0 auto;padding:12px 14px}
#bDet::after{content:" ▾";color:var(--muted)}
#bDet[aria-expanded="true"]::after{content:" ▴"}
#det{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);max-height:28vh;overflow-y:auto}
.lie{font-size:13px}
.opt{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.opt>span{font-size:12.5px;color:var(--muted);width:2.2em}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.carry{font-size:13px;margin-top:8px}
.carry .num{font-size:16px;font-weight:600}
.result{font-size:18px;font-weight:700;margin-top:6px}
.tnote{font-size:13px;color:var(--blue);margin-top:2px}
.news{margin-top:6px}
.news p{font-size:13.5px;color:#33463b;margin-top:3px;line-height:1.55}
.swingHint{flex:1;font-size:12.5px;color:var(--muted);line-height:1.45;align-self:center}
#swingCv{position:absolute;left:10px;right:10px;bottom:22px;height:56%;width:calc(100% - 20px);touch-action:none;display:block;background:rgba(255,255,255,.9);border-radius:16px;z-index:3}

/* オーバーレイ */
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,30,18,.55);overflow-y:auto}
#overlay.full{background:var(--green);padding:0;align-items:stretch}
.card{background:#fff;border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:92vh;overflow-y:auto}
.intro-head{display:flex;align-items:center;gap:12px}
.holeNo.big{width:52px;height:52px;font-size:34px;border-radius:12px}
.intro-head .holeMeta b{font-size:24px}.intro-head .holeMeta span{font-size:17px}
.intro-head .r{margin-left:auto;font-size:13px}
.thumb{display:block;width:100%;height:200px;border-radius:12px;margin-top:14px;background:#1B3A26}
.conds{margin-top:12px}
.conds div{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.conds dt{width:4.5em;color:var(--muted);font-size:13px}
.conds dd{display:flex;align-items:center;gap:6px;color:var(--ink)}
.card .news{margin-top:12px}
.card .btn.wide{margin-top:16px}
.card h2{font-size:20px}
.handoff{position:relative;width:100%;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(40px + env(safe-area-inset-top)) 28px calc(32px + env(safe-area-inset-bottom));color:#fff;max-width:520px;margin:0 auto}
.handoff::before{content:"";position:fixed;left:0;right:0;top:0;height:6px;background:var(--pc)}
.ho-label{font-size:14px;opacity:.75}
.ho-name{font-size:46px;font-weight:700;line-height:1.15;margin-top:4px;word-break:break-all}
.ho-meta{margin-top:10px;font-size:15px;opacity:.85}
.ho-meta .num{font-size:19px}
.ho-news{margin-top:34px;min-height:3em}
.ho-news p{font-size:16.5px;line-height:1.7;margin-top:8px;opacity:0;animation:rise .6s forwards}
.ho-pass{margin-top:auto;padding-top:36px;font-size:13.5px;opacity:.7}
.handoff .btn{margin-top:12px;padding:15px}
.sctable{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.sctable th,.sctable td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
.sctable th:first-child{text-align:left;font-weight:500;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.sctable thead th{font-family:var(--num);font-size:15px;color:var(--muted);font-weight:500}
.sctable thead th.now{color:var(--green);font-weight:700}
.sctable tr.par td{font-family:var(--num);color:var(--muted)}
.sctable td{font-family:var(--num);font-size:18px}
.sctable td.tot{font-weight:700;color:var(--green)}
.sc{display:inline-grid;place-items:center;width:25px;height:25px}
.sc.birdie{border:1.5px solid var(--ink);border-radius:50%}
.sc.eagle{border:1.5px solid var(--ink);border-radius:50%;box-shadow:0 0 0 2.5px #fff,0 0 0 4px var(--ink)}
.sc.bogey{border:1.5px solid var(--ink)}
.sc.dbl{border:1.5px solid var(--ink);box-shadow:0 0 0 2.5px #fff,0 0 0 4px var(--ink)}
.rank{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank .pos{font-family:var(--num);font-size:28px;font-weight:700;color:var(--green);width:1.2em}
.rank .nm{flex:1;min-width:0}
.rank .nm small{display:block;color:var(--muted);font-size:12.5px}
.rank .tot{font-family:var(--num);font-size:30px;font-weight:600}
.rank.first .pos,.rank.first .tot{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ho-news p{opacity:1}}
/* プレイ日誌 */
.dStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.dStats div{background:#f3f6f1;border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.dStats b{font-size:18px;color:var(--green)} .dStats span{font-size:11px;color:var(--muted);line-height:1.35}
.dEntry{background:#fffdf6;border:1px solid #eadfc4;border-radius:14px;padding:14px 16px;margin-top:12px;box-shadow:0 1px 0 #eadfc4}
.dEntry h3{font-size:16px;margin:4px 0 8px;line-height:1.5}
.dEntry p{font-size:14px;line-height:1.8;color:#3b3527}
.dMeta{font-size:12px !important;color:var(--muted) !important}
.dClose{margin-top:6px;font-style:italic;color:#6b5a32 !important}
.dScore{margin-top:8px;font-size:12px !important;color:var(--muted) !important;border-top:1px dashed #eadfc4;padding-top:6px}
</style>
</head>
<body>
<div id="screen"></div>
<div id="game" class="hidden">
  <div id="hud">
    <div class="hud-top">
      <div class="holeNo" id="holeNo">1</div>
      <div class="holeMeta"><b id="holePar"></b><span id="holeYd"></span></div>
      <div id="board"></div>
      <div class="wind" aria-label="風"><span id="windIcon"></span><div><div class="spd"><span id="windSpd"></span><small>m</small></div><div class="up" id="windUp"></div></div></div>
    </div>
  </div>
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="press"></div>
    <div id="banner"></div>
    <div class="mapBtns"><button class="btn" id="zIn" aria-label="拡大">＋</button><button class="btn" id="zOut" aria-label="縮小">－</button><button class="btn small" id="gRead" aria-pressed="false">高低</button><button class="btn small hidden" id="tPlace">置く</button></div>
  </div>
  <div id="panel"></div>
</div>
<div id="overlay" class="hidden"></div>

<script>
'use strict';
// ================= 定数 =================
const COLORS=['#1E6FB8','#E0A21B','#D9534F','#7E57C2'];
const G=10.7; // yd/s^2
const FRIC={green:.65,fringe:1.6,fairway:2.8,tee:2.8,rough:7,deep:14,bunker:30};
const SURF_NAME={tee:'ティー',fairway:'フェアウェイ',rough:'ラフ',deep:'深いラフ',bunker:'バンカー',green:'グリーン',fringe:'カラー',water:'池',ob:'OB'};
const LIE={tee:{mul:1,rand:1,diff:0},fairway:{mul:1,rand:1,diff:0},fringe:{mul:.95,rand:1,diff:.02},rough:{mul:.88,rand:1.3,diff:.08},deep:{mul:.65,rand:1.9,diff:.25},bunker:{mul:.6,rand:1.6,diff:.2},green:{mul:1,rand:1,diff:0}};
const MAXC={tee:{low:215,mid:245,high:225},other:{low:195,mid:220,high:190}};
const ROLLF={low:.22,mid:.12,high:.06};
const SPINM={stop:.35,normal:1,run:1.8};
const WINDH={low:.35,mid:1,high:1.3};
const HDIFF={low:-.03,mid:.04,high:.12};
const SDIFF={stop:.12,normal:0,run:-.06};

const v=(x,y)=>({x,y});
const add=(a,b)=>v(a.x+b.x,a.y+b.y),sub=(a,b)=>v(a.x-b.x,a.y-b.y),mul=(a,k)=>v(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const norm=a=>{const l=len(a)||1;return v(a.x/l,a.y/l)};
const dot=(a,b)=>a.x*b.x+a.y*b.y;
const leftP=a=>v(-a.y,a.x);
const rot=(a,deg)=>{const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return v(a.x*c-a.y*s,a.x*s+a.y*c)};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rnd=(a,b)=>a+Math.random()*(b-a);
function gauss(){let u=0,w=0;while(!u)u=Math.random();while(!w)w=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*w)}
function bez(a,c,b,t){const u=1-t;return v(u*u*a.x+2*u*t*c.x+t*t*b.x,u*u*a.y+2*u*t*c.y+t*t*b.y)}
function distSeg(p,a,b){const ab=sub(b,a),l2=dot(ab,ab);const t=l2?clamp(dot(sub(p,a),ab)/l2,0,1):0;return dist(p,add(a,mul(ab,t)))}
function distPoly(p,pts){let m=1e9;for(let i=0;i<pts.length-1;i++)m=Math.min(m,distSeg(p,pts[i],pts[i+1]));return m}
function ellR(p,e){return Math.sqrt(((p.x-e.x)/e.rx)**2+((p.y-e.y)/e.ry)**2)}
const inEll=(p,e)=>ellR(p,e)<=1;

function surfaceAt(h,p){
  for(const w of h.water)if(inEll(p,w))return'water';
  for(const b of h.bunkers)if(inEll(p,b))return'bunker';
  const r=ellR(p,h.green);
  if(r<=1)return'green';
  if(inEll(p,{x:h.green.x,y:h.green.y,rx:h.green.rx+2.5,ry:h.green.ry+2.5}))return'fringe';
  if(Math.abs(p.x-h.tee.x)<5&&Math.abs(p.y-h.tee.y)<6)return'tee';
  if(distPoly(p,h.center)>h.corridor)return'ob';
  const df=distPoly(p,h.fairway);
  if(df<h.fw/2)return'fairway';
  if(df<h.fw/2+10)return'rough';
  return'deep';
}
function heightAt(h,p){
  const g=h.green,r=ellR(p,g),s=h.seed;
  const a=clamp((r-1.5)/1.5,0,1);
  const gw=1-clamp((r-1.15)/.45,0,1);
  const course=.6*Math.sin(p.x/17+s)*Math.cos(p.y/23+s*1.7)+.8*Math.sin((p.x+p.y)/31+s*2.3);
  const green=h.gs.x*(p.x-g.x)+h.gs.y*(p.y-g.y)+.06*Math.sin(p.x/4+s)*Math.sin(p.y/5+s*2);
  return a*course+gw*green;
}
function gradAt(h,p){const e=.25;return v((heightAt(h,v(p.x+e,p.y))-heightAt(h,v(p.x-e,p.y)))/(2*e),(heightAt(h,v(p.x,p.y+e))-heightAt(h,v(p.x,p.y-e)))/(2*e))}

// ================= コース構成 =================
function mirrorHole(h,no){
  const mx=p=>({...p,x:-p.x});
  return{...h,no,_stakes:null,seed:h.seed+7,tee:mx(h.tee),center:h.center.map(mx),fairway:h.fairway.map(mx),green:mx(h.green),
    bunkers:h.bunkers.map(mx),water:h.water.map(mx),trees:h.trees.map(mx),pins:h.pins.map(mx),
    pinNames:h.pinNames.map(s=>s.replace('左','#').replace('右','左').replace('#','右')),gs:v(-h.gs.x,h.gs.y)};
}
function buildCourse(n){
  const base=HOLES.slice(0,Math.min(n,9)).map((h,i)=>({...h,no:i+1,_stakes:null}));
  if(n===18)HOLES.forEach((h,i)=>base.push(mirrorHole(h,i+10)));
  return base;
}

// ================= プレイ日誌 =================
// 対戦のラウンドごとに、出来事から日誌を1件書いて残す（最新60件）。累計の数字も数える
const DIARY_KEY='aattogolf_diary_v1';
function loadDiary(){try{const d=JSON.parse(localStorage.getItem(DIARY_KEY)||'null');if(d&&Array.isArray(d.entries))return d}catch(e){}return{entries:[],stats:{}}}
function saveDiary(d){try{localStorage.setItem(DIARY_KEY,JSON.stringify(d))}catch(e){}}
function dlog(p,t,x){if(!S.cfg||S.cfg.mode!=='versus')return;(S.dlog=S.dlog||[]).push(Object.assign({n:p.name,h:S.h.no,t},x||{}))}
const who=p=>p.cpu?`${p.name}（CPU${LEVEL_NAME[p.level]}）`:p.name;
function writeDiary(){
  const d=loadDiary(),st=d.stats,L=S.dlog||[],hs=S.players.filter(p=>!p.cpu),me=hs[0];
  const cnt=(t,n)=>L.filter(e=>e.t===t&&(!n||e.n===n)).length;
  // 結果
  let title,win=false,tie=false;
  if(S.cfg.format==='match'){
    const[a,b]=S.players,u=a.up||0;
    if(u===0){title=`${who(a)}と${who(b)}、引き分け`;tie=true}
    else{const w=u>0?a:b,l=u>0?b:a;title=`${who(w)}が${who(l)}にマッチで勝利（${Math.abs(u)}アップ）`;win=!w.cpu&&w===me}
  }else{
    const r=[...S.players].sort((a,b)=>a.total-b.total),top=r.filter(p=>p.total===r[0].total);
    if(top.length>1){title=`${top.map(who).join('と')}が${fmtRel(r[0].total)}で並んだ`;tie=top.includes(me)}
    else{title=`${who(r[0])}が${fmtRel(r[0].total)}で1位`;win=r[0]===me;const sec=r[1];if(sec)title+=`（${who(sec)}に${sec.total-r[0].total}打差）`}
  }
  // 出来事（目立つものから）
  const T={
    hio:e=>`${e.h}番、${e.n}さんがホールインワン。しばらく誰も声が出なかった。`,
    chip:e=>pick([`${e.h}番、${e.n}さんがグリーンの外から放り込んだ。チップイン。`,`${e.h}番、${e.n}さんのチップイン。本人がいちばん驚いていた。`]),
    long:e=>pick([`${e.h}番、${e.n}さんの長いパットが吸い込まれる。`,`${e.h}番、${e.n}さんの${e.d}yのパットが沈んだ。`]),
    ob:e=>e.c>1?`${e.h}番、${e.n}さんはOBを${e.c}回。アーッ！`:pick([`${e.h}番、${e.n}さんの球が林の向こうへ消えた。OB。`,`${e.h}番、${e.n}さんの一打は白い杭の外へ。アーッ！`]),
    water:e=>e.c>1?`${e.h}番、${e.n}さんは池に${e.c}回つかまった。水面の輪がしばらく残った。`:pick([`${e.h}番、${e.n}さんの球が池に消えた。アーッ！`,`${e.h}番、ポチャン。${e.n}さんは天を仰いだ。`]),
    miss:e=>pick([`${e.h}番、${e.n}さんが短いパットを外す。アーッ！`,`${e.h}番、${e.n}さんの${e.d}yのパットがカップの縁で止まった。`,`${e.h}番、${e.n}さん、入れれば終わりのパットに手が縮んだ。`]),
    bunker:e=>`${e.h}番、${e.n}さんはバンカーから${e.c}回打った。砂の音が耳に残る。`,
    tree:e=>pick([`${e.h}番、${e.n}さんの球が木に当たって跳ね返った。`,`${e.h}番、木が${e.n}さんの一打を止めた。`]),
    nice:e=>pick([`${e.h}番、${e.n}さんの狙いどおりの一打。小さくうなずいていた。`,`${e.h}番、${e.n}さん会心の一打。`]),
    ok:e=>`${e.h}番、${e.o}さんが${e.n}さんにOKを出した。`,
    nook:e=>`${e.h}番、${e.o}さんは${e.n}さんにOKを出さなかった。空気が少し冷えた。`,
    shaky:e=>`${e.h}番を終えたころ、${e.n}さんの手は小刻みに震えていた。`,
  };
  const prio=['hio','chip','long','water','ob','miss','nook','shaky','bunker','tree','ok','nice'];
  // 同じ人・同じホール・同じ種類はまとめて回数にする
  const grp=new Map();for(const e of L){const k=e.t+'|'+e.n+'|'+e.h;const g=grp.get(k);if(g)g.c++;else grp.set(k,Object.assign({c:1},e))}
  const ev=[...grp.values()].filter(e=>T[e.t]&&(e.t!=='bunker'||e.c>=3)).sort((a,b)=>prio.indexOf(a.t)-prio.indexOf(b.t));
  const lines=[];for(const e of ev){if(lines.length>=5)break;if(e.t==='nice'&&lines.length>=3)continue;lines.push({h:e.h,s:T[e.t](e)})}
  // 人それぞれの、いちばん良いホールと悪いホール
  for(const p of hs){
    let bi=-1,wi=-1;p.scores.forEach((s,i)=>{const r=s-S.course[i].par;if(bi<0||r<p.scores[bi]-S.course[bi].par)bi=i;if(wi<0||r>p.scores[wi]-S.course[wi].par)wi=i});
    if(bi>=0&&p.scores[bi]-S.course[bi].par<=-1&&!lines.some(l=>l.h===S.course[bi].no))lines.push({h:S.course[bi].no,s:`${S.course[bi].no}番は${p.name}さんの${scoreName(p.scores[bi],S.course[bi].par)}。`});
    if(wi>=0&&p.scores[wi]-S.course[wi].par>=3)lines.push({h:S.course[wi].no,s:pick([`${S.course[wi].no}番、${p.name}さんは${p.scores[wi]}打。思い出したくない。`,`${S.course[wi].no}番の${p.scores[wi]}打は、なかったことにしたい。`])});
  }
  lines.sort((a,b)=>a.h-b.h);
  if(!lines.length)lines.push({h:0,s:pick(['静かなラウンドだった。風の音だけが残っている。','大きな事件はなかった。それもまたゴルフ。'])});
  const close=hs.length?(tie?'決着はつかなかった。お互い、譲らなかった。':win?pick(['いい一日だった。帰り道、少しだけ遠回りした。','勝った。今夜はよく眠れそうだ。','心は最後まで折れなかった。']):pick(['次こそは。','悔しい。素振りを100回しよう。','心のスタミナが、あと少し足りなかった。','明日はきっと、手は震えない。'])):'';
  // 累計
  st.rounds=(st.rounds||0)+1;if(win)st.wins=(st.wins||0)+1;
  for(const k of['hio','chip','long','ob','water','miss'])st[k]=(st[k]||0)+L.filter(e=>e.t===k&&hs.some(p=>p.name===e.n)).length;
  for(const p of hs){const k='best'+S.course.length,b=st[k];if(S.cfg.format!=='match'&&(b==null||p.total<b))st[k]=p.total}
  const dt=new Date();
  d.entries.unshift({no:st.rounds,date:`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`,meta:`${S.course.length}ホール・${S.cfg.format==='match'?'マッチ':'ストローク'}`,title,lines:lines.map(l=>l.s),close,
    score:S.players.map(p=>`${p.name} ${S.cfg.format==='match'?upText(p.up||0):fmtRel(p.total)}`).join('　')});
  d.entries=d.entries.slice(0,60);saveDiary(d);
  return d.entries[0];
}
function diaryHtml(e){return`<div class="dEntry"><p class="dMeta">No.${e.no}　${esc(e.date)}　${esc(e.meta)}</p><h3>${esc(e.title)}</h3>${e.lines.map(l=>`<p>${esc(l)}</p>`).join('')}${e.close?`<p class="dClose">${esc(e.close)}</p>`:''}<p class="dScore">${esc(e.score)}</p></div>`}

function randomWind(lo,hi){const ws=rnd(lo,hi),wa=rnd(0,Math.PI*2);return v(Math.sin(wa)*ws,Math.cos(wa)*ws)}

  {const ga=rnd(0,Math.PI*2);h.grain=v(Math.sin(ga),Math.cos(ga))}

function matchDecided(){if(S.cfg.format!=='match')return false;return Math.abs(S.players[0].up||0)>S.course.length-(S.hole+1)}

const LV=[{r:.12,dx:.1,read:4.5,rd:.19,blunder:.1},{r:.045,dx:.035,read:1.3,rd:.06},{r:.026,dx:.02,read:.5,rd:.03}];
function cpuNoise(p,focus){
  const L=LV[p.level],s=p.st/100,F=focus?FOCUS[p.ax.C]:{jit:1},amp=(.012+.11*Math.pow(1-s,1.5))*F.jit,tw=tempoWindow(s);
  let tempo=(tw[0]+tw[1])/2;if(Math.random()<(1-s)*.35*(1.3-p.level*.3))tempo=Math.random()<.5?tw[0]*.7:tw[1]*1.25;
  // 初級：ときどき大きくミスする（ダフり・トップ・大きな引っかけ）
  if(L.blunder&&Math.random()<L.blunder)return{ratio:1+(Math.random()<.5?-1:1)*rnd(.25,.45),dx:(Math.random()<.5?-1:1)*rnd(.12,.25),tempo};
  return{ratio:1+gauss()*L.r+gauss()*amp/.8,dx:gauss()*L.dx+gauss()*amp*.7,tempo};
}
function windDrift(pl,info){
  const w=mul(S.wind,(1+.8*Math.min(1,info.apex/35))*WINDH[pl.height]);let dr=mul(w,(.5+info.apex*.17)*.4);
  const lp=leftP(info.dir),wl=dot(dr,lp),cf=pl.curveF||0;
  if(Math.abs(cf)>.05&&Math.abs(wl)>.01){const k=cf*wl<0?1-Math.min(.6,Math.abs(cf)*.6):1+Math.abs(cf)*.4;dr=add(dr,mul(lp,wl*(k-1)))}
  const head=dot(w,info.dir);if(head<0)dr=add(dr,mul(info.dir,head*(.5+info.apex*.17)*.12));return dr;
}
function expAt(pos,sf){
  const d=dist(pos,S.pin);
  if(sf==='green')return d<.8?1:Math.min(2.4,1.25+.075*d);
  const a={fringe:-.15,fairway:0,tee:0,rough:.25,deep:.6,bunker:d<40?.35:.6}[sf];
  let e=2.3+(a==null?.3:a)+Math.min(2.2,d*.0048)+(d<30?-.15:0);
  if(S.h.trees.some(t=>dist(pos,t)<t.r+1))e+=.6;
  return e;
}
function expLeft(sim,from,fromLie){
  if(sim.end==='holed')return 0;
  if(sim.end==='ob')return 1+expAt(from,fromLie==='tee'?'fairway':fromLie);
  if(sim.end==='water'){const d=dropFrom(sim.entry,from);return 1+expAt(d,surfaceAt(S.h,d))}
  return expAt(sim.rest,surfaceAt(S.h,sim.rest));
}
function pointAlongCenter(p,want){
  const h=S.h,dPin=dist(p.pos,S.pin);let best=null,bd=1e9;const c=h.center;
  for(let i=0;i<c.length-1;i++)for(let k=0;k<=40;k++){const q=add(c[i],mul(sub(c[i+1],c[i]),k/40));if(dist(q,S.pin)>=dPin)continue;const e=Math.abs(dist(q,p.pos)-want);if(e<bd){bd=e;best=q}}
  return best||add(p.pos,mul(norm(sub(S.pin,p.pos)),want));
}
function cpuPlan(p){
  const pl=S.plan,L=LV[p.level];
  if(p.lie==='green'){
    const from=p.pos,d=sub(S.pin,from),Ld=Math.max(len(d),.5);let best=null,bl=1e9,ba=0,bk=1;
    const tryAim=(a,k)=>{const t=add(from,mul(rot(d,a/Ld*57.3),k));pl.target=t;const info=planInfo(p,pl);const sim=simulate(p,pl,info,{ratio:1,dx:0,tempo:1},100);return sim.end==='holed'?0:(sim.rest?dist(sim.rest,S.pin):9)};
    for(let a=-1.4;a<=1.4;a+=.2)for(let k=.4;k<=2.2;k+=.1){const l=tryAim(a,k);if(l<bl){bl=l;ba=a;bk=k}}
    for(let a=ba-.2;a<=ba+.2;a+=.05)for(let k=bk-.1;k<=bk+.1;k+=.025){const l=tryAim(a,k);if(l<bl){bl=l;best=[a,k]}}
    const[a,k]=best||[ba,bk];
    pl.target=add(from,mul(rot(d,a/Ld*57.3+gauss()*L.read),k*(1+gauss()*L.rd)));
    clampTarget();
    pl.focus=p.level>=1&&p.st>=FOCUS[p.ax.C].cost+20&&Ld<2.5&&Ld>.9&&Math.random()<.5;
    return;
  }
  const heights=p.level===0?['mid']:lowOnly(p)?['low']:['low','mid','high'];
  const spins=p.level===2?['stop','normal','run']:['normal'];
  const curves=p.level===2?[0,1]:[0];
  const windComp=p.level>=1;
  let bestPl=null,bestV=1e9;const cands=[];
  for(const hgt of heights)for(const sp of spins)for(const cv of curves){
    const max=maxCarry(p,hgt),dPin=dist(p.pos,S.pin);
    const goals=dPin<=max?[S.pin,v(S.h.green.x,S.h.green.y)]:[pointAlongCenter(p,max*.92),pointAlongCenter(p,max*.75)];
    for(const G of goals){
      const c={target:{...G},curve:0,curveF:0,height:hgt,spin:sp,focus:false};S.plan=c;
      if(cv){const wl=dot(S.wind,leftP(norm(sub(G,p.pos))));if(Math.abs(wl)<1)continue;c.curveF=wl>0?-.6:.6}

        c.target=t}
      clampTarget();const info=planInfo(p,c);
      let tot=0;const K=5;for(let k=0;k<K;k++){const sim=simulate(p,c,info,cpuNoise(p,false),p.st);tot+=expLeft(sim,p.pos,p.lie)}
      cands.push({c:{...c,target:{...c.target}},v:tot/K});
    }
  }
  cands.sort((a,b)=>a.v-b.v);
  for(const cd of cands.slice(0,3)){S.plan=cd.c;const info=planInfo(p,cd.c);let tot=0;const K=14;for(let k=0;k<K;k++){const sim=simulate(p,cd.c,info,cpuNoise(p,false),p.st);tot+=expLeft(sim,p.pos,p.lie)}
    const val=(cd.v*5+tot)/(5+K);if(val<bestV){bestV=val;bestPl=cd.c}}
  S.plan=bestPl||pl;clampTarget();
  const info=planInfo(p,S.plan);
  S.plan.focus=p.level>=1&&p.st>=FOCUS[p.ax.C].cost+25&&info.diff>=.65&&Math.random()<.6;
}
function cpuTurn(p){
  S.mode='cputhink';
  const nw=takeNews();
  $('#panel').innerHTML=`${planHead(p,false)}<p class="tnote">${esc(p.name)}さん（CPU ${LEVEL_NAME[p.level]}）が狙いを考えている</p>${nw.length?`<div class="news">${nw.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:''}`;

function startTrain(){

// ================= 計画 =================
function lieOf(p){const L=LIE[p.lie]||LIE.fairway,M=p.mod&&MOD[p.mod];if(!M)return L;return{mul:L.mul*M.mul,rand:L.rand*M.rand,diff:L.diff+M.diff}}
function canSpin(p){return!(p.lie==='rough'||p.lie==='deep')&&!(p.mod&&MOD[p.mod].noSpin)}
function lowOnly(p){return!!(p.mod&&MOD[p.mod].lowOnly)}
function maxCarry(p,height){return MAXC[p.lie==='tee'?'tee':'other'][height]*lieOf(p).mul}
function puttLine(from){const d=sub(S.pin,from),L=len(d),dir=norm(d);let g=v(0,0);
  for(let i=0;i<5;i++)g=add(g,gradAt(S.h,add(from,mul(d,(i+.5)/5))));g=mul(g,1/5);
  const al=dot(g,dir);return{up:Math.max(0,al),down:Math.max(0,-al),side:Math.abs(dot(g,leftP(dir))),grain:dot(S.h.grain,dir),L}}
function puttLineText(pl){const a=pl.up>.006?'上り':pl.down>.006?'下り':'ほぼ平ら',b=pl.side>.008?'・横傾斜':'';return a+b}
function grainText(p,dir){const g=S.h.grain,c=dot(g,dir);return c>.5?'順目（速い）':c<-.5?'逆目（重い）':(dot(g,leftP(dir))>0?'横目（左へ流れる）':'横目（右へ流れる）')}
function decideMod(p,sim){
  const h=S.h,pos=p.pos;
  if(h.trees.some(t=>dist(pos,t)<t.r+1))return'tree';
  if(p.lie==='bunker'&&sim.landSurf==='bunker'&&!sim.treeHit&&Math.random()<.1+sim.apex/60)return'egg';
  if(p.lie==='fairway'&&Math.random()<.08)return'divot';
  if(p.lie==='rough'){const r=Math.random();return r<.3?'up':r<.5?'down':null}
  if(p.lie==='deep'&&Math.random()<.4)return'down';
  return null;
}
function defaultTarget(p){
  const h=S.h,max=maxCarry(p,'mid'),dPin=dist(p.pos,S.pin);
  if(dPin<=max*.98)return{...S.pin};
  const want=max*.92;let best=null,bd=1e9;const c=h.center;
  for(let i=0;i<c.length-1;i++)for(let k=0;k<=40;k++){
    const q=add(c[i],mul(sub(c[i+1],c[i]),k/40));
    if(dist(q,S.pin)>=dPin)continue;
    const e=Math.abs(dist(q,p.pos)-want);if(e<bd){bd=e;best=q}
  }
  return best||add(p.pos,mul(norm(sub(S.pin,p.pos)),want));
}
function clampTarget(){
  const p=S.cur,pl=S.plan;if(lowOnly(p))pl.height='low';let d=sub(pl.target,p.pos),l=len(d);
  if(l<.3){d=sub(S.pin,p.pos);l=.3}
  const max=p.lie==='green'?40:maxCarry(p,pl.height);
  const nl=clamp(l,p.lie==='green'?.3:1,max);
  pl.target=add(p.pos,mul(norm(d),nl));
  const mc=p.lie==='green'?0:Math.min(35,nl*.2);pl.curve=(pl.curveF||0)*mc;
}
function planInfo(p,pl){
  const h=S.h,tgt=pl.target,d=sub(tgt,p.pos),dist0=len(d),dir=norm(d);
  if(p.lie==='green'){const ln=puttLine(p.pos);
    const diff=clamp(.1+dist0/40+12*ln.down+6*ln.side+.1*Math.max(0,ln.grain)-5*ln.up,.05,1);
    return{putt:true,line:ln,dist:dist0,dir,diff,club:'パター',max:40,along:0,side:0,curveBias:0,apex:0,rollEst:0,endDir:dir,lieText:`グリーン・ピンまで${puttLineText(ln)}・芝目は${grainText(p,dir)}・速さ ${S.cond.speed.n}${S.cond.speed.h?'（'+S.cond.speed.h+'）':''}`}}
  const isTee=p.lie==='tee',L=lieOf(p);
  const g=isTee?v(0,0):gradAt(h,p.pos);
  const along=dot(g,dir),side=dot(g,leftP(dir));
  const max=maxCarry(p,pl.height),dd=Math.min(dist0,max),mc=Math.max(1,Math.min(35,dd*.2));
  let apex={low:Math.min(16,3+dd*.06),mid:Math.min(30,4+dd*.12),high:Math.min(40,6+dd*.17)}[pl.height];
  apex*=clamp(1+along*4,.6,1.4)*((p.mod&&MOD[p.mod].apex)||1);
  const curveBias=-side*dd*1.5;
  let diff=.08+.35*Math.pow(dd/max,2)+.45*Math.min(1,Math.abs(pl.curve)/mc)+HDIFF[pl.height]+SDIFF[pl.spin]+L.diff+Math.min(.2,(Math.abs(along)+Math.abs(side))*3);
  if(p.lie==='bunker'&&dd>60)diff+=.15;
  diff=Math.min(1.2,diff);
  const Cp=add(mul(add(p.pos,tgt),.5),mul(leftP(dir),2*pl.curve));
  const endDir=norm(sub(tgt,Cp));
  const ls=surfaceAt(h,tgt);
  let sm=SPINM[pl.spin];if(!canSpin(p)&&pl.spin==='stop')sm=SPINM.normal;if(p.lie==='rough'||p.mod==='up')sm*=1.4;if(p.mod==='egg')sm*=2;
  const cm=(ls==='green'||ls==='fringe')?S.cond.firm.m:S.cond.ground.m;
  const rollEst=dd*ROLLF[pl.height]*sm*(SURFM[ls]||0)*(along<-.02?1.3:1)*cm;
  const t=[SURF_NAME[p.lie]];if(p.mod)t.push(MOD[p.mod].name);
  if(p.lie==='rough'&&!p.mod)t.push('スピンがかかりにくい');
  if(p.lie==='deep')t.push('飛ばずブレやすい');
  if(p.lie==='bunker')t.push('飛ばずブレやすい');
  if(!isTee){
    if(along>.02)t.push('左足上がり（上がりやすく飛ばない）');else if(along<-.02)t.push('左足下がり（低く出て転がる）');
    if(side>.02)t.push('つま先下がり（右に曲がりやすい）');else if(side<-.02)t.push('つま先上がり（左に曲がりやすい）');
  }
  let club;
  if(isTee&&dd>200)club='ドライバー';else if(dd>195)club='ウッド';else if(dd>170)club='ユーティリティ';else if(dd>135)club='ミドルアイアン';else if(dd>95)club='ショートアイアン';else if(dd>40)club='ウェッジ';else club='アプローチ';
  return{putt:false,dist:dd,dir,diff,club,max,along,side,curveBias,apex,rollEst,endDir,Cp,lieText:t.join('・')};
}
function prepPlan(p){
  S.cur=p;

function optNote(pl){

// ================= スイング =================
function tempoWindow(s){return[.6-.25*s,1.1+.7*s]}
function jit(t){const a=S.sw.amp,ph=S.sw.ph,u=t/1000;return{y:a*(.6*Math.sin(2*Math.PI*3.1*u+ph[0])+.4*Math.sin(2*Math.PI*5.3*u+ph[1])),x:a*.7*(.6*Math.sin(2*Math.PI*2.7*u+ph[2])+.4*Math.sin(2*Math.PI*4.6*u+ph[3]))}}

function enterSwing(){
  S.mode='swing';
  const p=S.cur,info=S.info,s=p.st/100,F=S.plan.focus?FOCUS[p.ax.C]:{jit:1};
  S.sw={sPre:p.st,amp:(.012+.11*Math.pow(1-s,1.5))*F.jit,ph:[rnd(0,6.3),rnd(0,6.3),rnd(0,6.3),rnd(0,6.3)],start:null,pull:0,dx:0,T:.8,band:.04*(1-.4*Math.min(1,info.diff))};
  $('#panel').innerHTML=`${planHead(p)}
  <div class="actions"><button class="btn ghost" id="bBack">戻る</button><p class="swingHint">${info.club}${S.plan.focus?'　<b style="color:var(--blue)">集中</b>':''}<br>白い枠の中を真下に引き、青い線が緑の線に重なった瞬間に離す</p></div>`;
  $('#bBack').onclick=()=>{removeSwing();S.mode='plan';renderPlanPanel()};
  removeSwing();const sc=document.createElement('canvas');sc.id='swingCv';sc.setAttribute('aria-label','スイング');$('#mapWrap').appendChild(sc);
  const gl=()=>sc.clientHeight-48;
  sc.onpointerdown=e=>{sc.setPointerCapture(e.pointerId);S.sw.start={x:e.clientX,y:e.clientY,t:performance.now()};S.sw.pull=0;S.sw.dx=0};
  sc.onpointermove=e=>{if(!S.sw.start)return;S.sw.pull=clamp((e.clientY-S.sw.start.y)/gl(),0,1);S.sw.dx=(e.clientX-S.sw.start.x)/gl()};
  sc.onpointerup=()=>{
    if(!S.sw.start)return;const now=performance.now(),j=jit(now),s0=S.sw.start;S.sw.start=null;
    if(S.sw.pull<.08){S.sw.pull=0;return}

  };

function removeSwing(){const e=$('#swingCv');if(e)e.remove()}
function drawSwing(t){
  const sc=$('#swingCv');if(!sc||!S.sw)return;
  const[W,H]=fitCanvas(sc),x=sc.getContext('2d');
  x.clearRect(0,0,W,H);
  const top=24,gl=H-48,cx=W/2,sw=S.sw;
  x.fillStyle='#EEF3F0';x.beginPath();x.roundRect?x.roundRect(cx-30,top,60,gl,10):x.rect(cx-30,top,60,gl);x.fill();
  x.strokeStyle='rgba(20,83,45,.18)';x.setLineDash([3,5]);x.lineWidth=1;x.beginPath();x.moveTo(cx,top);x.lineTo(cx,top+gl);x.stroke();x.setLineDash([]);
  const ty=top+sw.T*gl,bh=sw.band*gl;
  x.fillStyle='rgba(47,125,74,.2)';x.fillRect(cx-64,ty-bh,128,bh*2);
  x.strokeStyle='#14532D';x.lineWidth=2.5;x.beginPath();x.moveTo(cx-64,ty);x.lineTo(cx+64,ty);x.stroke();
  x.fillStyle='#14532D';x.font='500 12px "Zen Kaku Gothic New",sans-serif';x.fillText('目標',cx+70,ty+4);
  x.fillStyle='#5F7368';x.fillText('ここから引く',cx+38,top+4);
  const j=jit(t),pull=(sw.start?sw.pull:0)+j.y,iy=top+pull*gl,ix=cx+((sw.start?sw.dx:0)+j.x)*gl;
  x.strokeStyle='#1E6FB8';x.lineWidth=3.5;x.lineCap='round';x.beginPath();x.moveTo(ix-30,iy);x.lineTo(ix+30,iy);x.stroke();
  x.fillStyle='#1E6FB8';x.beginPath();x.arc(ix,iy,5.5,0,7);x.fill();
  x.fillStyle='#17241C';x.font='600 30px "Barlow Condensed",sans-serif';x.fillText(Math.round(pull/sw.T*100)+'%',16,H-16);
  if(sw.start){x.fillStyle='#5F7368';x.font='600 18px "Barlow Condensed",sans-serif';x.fillText(((t-sw.start.t)/1000).toFixed(1)+'s',W-46,H-16)}
}

// ================= 物理 =================
function rollSim(h,p0,vel,frames){
  let pos={...p0},vv={...vel},lipped=false;const pin=S.pin,dt=1/120;
  for(let i=0;i<120*25;i++){
    const sf=surfaceAt(h,pos);
    if(sf==='water')return{end:'water',entry:pos};
    if(sf==='ob')return{end:'ob'};
    const sp=len(vv);let sa=mul(gradAt(h,pos),-G),fr=FRIC[sf];
    if(sf==='green'){fr*=S.cond.speed.f;if(sp>0){fr*=1-.15*dot(norm(vv),h.grain);sa=add(sa,mul(h.grain,.05*Math.min(1,sp)))}}
    if(sp<.05&&len(sa)<fr*.8){frames.push({x:pos.x,y:pos.y,z:0});return{end:'rest',rest:pos}}
    const dp=dist(pos,pin);
    if(dp<.075){if(sp<clamp(1.6+40*dot(mul(sa,-1/G),norm(vv)),1,2.4)){frames.push({x:pin.x,y:pin.y,z:0});return{end:'holed',rest:{...pin}}}
      else if(!lipped){vv=mul(rot(vv,rnd(-25,25)),.7);lipped=true}}
    else if(dp>.2)lipped=false;
    let acc=sa;if(sp>0)acc=add(acc,mul(vv,-fr/sp));
    const nv=add(vv,mul(acc,dt));
    if(sp>0&&dot(nv,vv)<0&&len(sa)<fr*.8){frames.push({x:pos.x,y:pos.y,z:0});return{end:'rest',rest:pos}}
    vv=nv;pos=add(pos,mul(vv,dt));

function simulate(p,pl,info,ex,sPre){
  const h=S.h,S0=p.pos,s=sPre/100,F=pl.focus?FOCUS[p.ax.C]:{rand:1},L=lieOf(p);
  const randK=(.35+1.0*(1-s))*F.rand*L.rand;
  const tw=tempoWindow(s);let tp=0;
  if(ex.tempo<tw[0])tp=(tw[0]-ex.tempo)/tw[0];else if(ex.tempo>tw[1])tp=(ex.tempo-tw[1])/tw[1];
  tp=Math.min(1,tp);
  const tnote=tp>0?(ex.tempo<tw[0]?'テンポ：振り急いだ':'テンポ：間が長すぎた'):'';
  const frames=[];
  if(info.putt){
    const ln=info.line,k=clamp(1+60*ln.down+.5*Math.max(0,ln.grain)-15*ln.up,.6,3); // 下り・順目はタッチが繊細
    const raw=ex.ratio*(1+gauss()*randK*.03+gauss()*.06*tp);
    const ratio=Math.max(.05,1+(raw-1)*k*clamp(ln.L/Math.max(info.dist,.3),.5,3)); // 誤差は実際に転がる距離に効く
    const ang=(ex.dx*8+gauss()*randK*.7+gauss()*2*tp)*(1+20*ln.side);
    const v0=Math.sqrt(2*FRIC.green*info.dist*ratio);
    const r=rollSim(h,S0,mul(rot(info.dir,ang),v0),frames);
    return{...r,frames,flightN:0,tnote,plannedRest:pl.target};
  }
  let carry=info.dist*ex.ratio*(1+gauss()*randK*(.01+.08*info.diff)+gauss()*.08*tp);
  carry*=(1-1.2*info.along);
  carry=clamp(carry,1,info.max*1.12);
  const ang=ex.dx*18+gauss()*randK*(.4+4.5*info.diff)+gauss()*4*tp;
  const dir=rot(info.dir,ang),lp=leftP(dir);
  const head0=dot(S.wind,info.dir);
  if(pl.spin==='stop'&&head0<0&&canSpin(p))carry*=1-.03*(-head0); // 向かい風で吹き上がる
  if(p.mod==='up')carry*=1+Math.random()*.07; // フライヤー
  if(p.lie==='deep')carry*=1-Math.random()*.12; // 芝に食われる
  const curveAct=pl.curve*(1+gauss()*randK*.35*info.diff)+info.curveBias+gauss()*randK*carry*.012;
  const L0=add(add(S0,mul(dir,carry)),mul(lp,(curveAct-pl.curve)*1.6));
  const apex=info.apex,hang=.5+apex*.17;
  const gw=S.cond.gust.g?mul(rot(S.wind,gauss()*15),1+gauss()*.25):S.wind; // 突風
  const w=mul(gw,(1+.8*Math.min(1,apex/35))*WINDH[pl.height]);
  let drift=mul(w,hang*.4);
  // 曲げと横風：風にぶつければ流されにくく、風に乗せれば大きく流れる
  const wl=dot(drift,lp),cf=pl.curveF||0;
  if(Math.abs(cf)>.05&&Math.abs(wl)>.01){
    const k=cf*wl<0?1-Math.min(.6,Math.abs(cf)*.6):1+Math.abs(cf)*.4;
    drift=add(drift,mul(lp,wl*(k-1)));
  }
  const head=dot(w,dir);if(head<0)drift=add(drift,mul(dir,head*hang*.12));
  const C=add(mul(add(S0,L0),.5),mul(leftP(norm(sub(L0,S0))),2*curveAct));
  const N=Math.round(clamp(40+carry*.3,40,110));
  let land=add(L0,drift),treeHit=false;
  for(let i=0;i<=N;i++){
    const t=i/N,pos=add(bez(S0,C,L0,t),mul(drift,Math.pow(t,1.6))),z=4*apex*t*(1-t);
    frames.push({x:pos.x,y:pos.y,z});
    if(i>2&&i<N&&h.trees.some(tr=>z<tr.h&&dist(pos,tr)<tr.r)){
      treeHit=true;land=add(pos,v(rnd(-2,2),rnd(-2,2)));
      for(let k=1;k<=10;k++)frames.push({x:pos.x+(land.x-pos.x)*k/10,y:pos.y+(land.y-pos.y)*k/10,z:z*(1-k/10)});
      break;
    }
  }
  const flightN=frames.length;
  const plannedRest=add(pl.target,mul(info.endDir,info.rollEst));
  const ls=surfaceAt(h,land);
  if(ls==='water')return{end:'water',entry:land,frames,flightN,treeHit,plannedRest,tnote,landSurf:ls,apex};
  if(ls==='ob')return{end:'ob',frames,flightN,treeHit,plannedRest,tnote,landSurf:ls,apex};
  let rollDist;
  if(treeHit)rollDist=rnd(0,3);
  else{let sm=SPINM[pl.spin];if(!canSpin(p)&&pl.spin==='stop')sm=SPINM.normal;if(p.lie==='rough'||p.mod==='up')sm*=1.4;if(p.mod==='egg')sm*=2;
    const cm=(ls==='green'||ls==='fringe')?S.cond.firm.m*(pl.spin==='stop'&&S.cond.firm.m<1?.7:1):S.cond.ground.m;
    rollDist=carry*ROLLF[pl.height]*sm*(SURFM[ls]||1)*(info.along<-.02?1.3:1)*cm;
    const spinOK=pl.spin==='stop'&&canSpin(p);
    if(spinOK&&(ls==='green'||ls==='fringe'))rollDist*=1+gauss()*1.2; // 止める球：効きすぎて戻ることもある
    else if(pl.height==='low'||pl.spin==='run')rollDist*=Math.max(0,1+gauss()*.25);}
  let endDir=treeHit?norm(v(rnd(-1,1),rnd(-1,1))):norm(sub(L0,C));
  if(rollDist<0){endDir=mul(endDir,-1);rollDist=-rollDist}
  const r=rollSim(h,land,mul(endDir,Math.sqrt(2*FRIC[ls]*rollDist)),frames);
  return{...r,frames,flightN,treeHit,plannedRest,tnote,landSurf:ls,apex};
}
function dropFrom(entry,from){
  const h=S.h,dir=norm(sub(from,entry));let q={...entry};
  for(let i=0;i<300;i++){const sf=surfaceAt(h,q);if(sf!=='water'&&sf!=='ob')break;q=add(q,dir)}
  return add(q,mul(dir,2));
}


// ================= ショット実行と結果 =================
function doShot(ex){
  const p=S.cur,pl=S.plan,info=S.info,sPre=S.sw?S.sw.sPre:p.st;
  p.stBefore=p.st;S.prevBall={pos:{...p.pos},lie:p.lie,mod:p.mod,strokes:p.strokes};
  if(pl.focus)st(p,-FOCUS[p.ax.C].cost);
  p.strokes++;p.reactedLast=false;
  const sim=simulate(p,pl,info,ex,sPre);
  removeSwing();S.mode='anim';S.trail=[];S.landed=false;
  $('#panel').innerHTML=`${planHead(p,false)}<p class="tnote">${sim.tnote||'　'}</p>`;
  const pts=[p.pos];for(let i=0;i<sim.frames.length;i+=8)pts.push(sim.frames[i]);pts.push(sim.frames[sim.frames.length-1]);
  S.camPts=pts;S.camMin=info.putt?8:45;
  if(S.cpuFast){afterShot(p,pl,info,sim);return}
  S.anim={frames:sim.frames,i:0,flightN:sim.flightN,end:sim.end,onDone:()=>afterShot(p,pl,info,sim)};
}
function react(p){
  p.reactedLast=true;
  const k=1/Math.sqrt(Math.max(1,S.players.length-1)); // 大人数ほど1人あたりの影響は薄まる
  S.players.forEach(o=>{if(o===p)return;
    if(o.ax.D===-1){st(o,-6*k);news(`${o.name}さんの表情が一瞬こわばった。`)}
    else if(o.ax.D===1){st(o,3*k);news(`${o.name}さんの目つきが変わった。`)}
    else st(o,-2*k);
  });
}

function afterShot(p,pl,info,sim){
  const h=S.h,n=p.name,ax=p.ax,before={pos:p.pos,lie:p.lie};let msg,penalty=false,banner=null;
  if(sim.end==='ob'){dlog(p,'ob');p.strokes++;msg='OB。1打罰で打ち直し';penalty=true;banner=['OB','white']}
  else if(sim.end==='water'){dlog(p,'water');p.strokes++;addFx('splash',sim.entry);p.pos=dropFrom(sim.entry,before.pos);p.lie=surfaceAt(h,p.pos);p.mod=null;msg='池につかまった。1打罰';penalty=true;banner=['池','blue']}
  else if(sim.end==='holed'){p.pos={...S.pin};p.done=true;p.mod=null;addFx('cup',S.pin);msg=p.strokes===1?'ホールインワン':info.putt?'カップイン':'チップイン';banner=[msg,'white']}
  else{
    p.pos=sim.rest;p.lie=surfaceAt(h,p.pos);p.mod=decideMod(p,sim);const dp=dist(p.pos,S.pin);
    msg=(sim.treeHit?'木に当たった。':'')+
      (p.lie==='green'?(before.lie==='green'?`あと ${fmtD(dp)}`:`グリーンオン。ピンまで ${fmtD(dp)}`):`${SURF_NAME[p.lie]}${p.mod?'（'+MOD[p.mod].name.split('（')[0]+'）':''}。ピンまで ${fmtD(dp)}`);
    if(p.lie==='bunker')dlog(p,'bunker');if(sim.treeHit)dlog(p,'tree');
    if(p.lie==='green'&&before.lie!=='green')banner=[dp<3?'ナイスオン':'グリーンオン','white'];
    else if(p.lie==='bunker')banner=['バンカー',''];
    else if(sim.treeHit)banner=['木に当たった',''];
  }
  if(penalty){st(p,-14*MISSM[ax.B]);news(ax.B===-1?`${n}さんは、しばらくその場を動けなかった。`:`${n}さんは天を仰いだ。`);if(ax.B===-1)p.drag=1}
  else{
    if(p.drag){st(p,-4);p.drag=0}
    if(sim.end==='holed'){
      const d0=dist(before.pos,S.pin);
      if(p.strokes===1)dlog(p,'hio');else if(!info.putt)dlog(p,'chip');else if(d0>5)dlog(p,'long',{d:Math.round(d0)});
      if(!info.putt){st(p,12*GOODM[ax.B]);news(`${n}さんが拳を握った。`);react(p)}
      else if(d0>5){st(p,10*GOODM[ax.B]);news(`${n}さんの長いパットが沈んだ。`);react(p)}
    }else if(info.putt){
      if(dist(before.pos,S.pin)<2.5){dlog(p,'miss',{d:dist(before.pos,S.pin).toFixed(1)});const dn=info.line&&info.line.down>.006;st(p,-(dn?14:10)*MISSM[ax.B]);news(dn?`${n}さん、下りの短いパットに手が縮んだ。`:`${n}さん、短いパットを外して唇をかんだ。`)}
    }else{
      const ok=dist(p.pos,sim.plannedRest)<Math.max(4,info.dist*.07);
      if(ok&&info.diff>=.5){dlog(p,'nice');st(p,8*GOODM[ax.B]);news(`${n}さん、狙いどおりの難しい一打。小さくうなずいた。`);react(p);if(!banner)banner=['狙いどおり','white']}
      else if(ok&&info.diff<.3)st(p,ax.C===-1?4:2);
      else if(!ok&&(p.lie==='deep'||p.lie==='bunker')&&surfaceAt(h,pl.target)!==p.lie){st(p,-6*MISSM[ax.B]);news(`${n}さんは首をかしげている。`)}
    }
  }
  const train=S.cfg.mode==='train';
  if(!train&&!p.done&&p.strokes>=h.par+5){p.done=true;p.gaveUp=true;msg+='（上限打数でギブアップ）'}
  if(banner&&!S.cpuFast)showBanner(banner[0],banner[1]);
  S.camPts=[p.pos,S.pin];S.camMin=p.lie==='green'?10:60;
  S.mode='result';
  if(train){p.st=S.train.st;NEWS.length=0;renderHud();trainResultPanel(p,msg,info,sim);return}
  renderHud();
  if(S.cpuFast){NEWS.length=0;return nextTurn()}
  const nw=takeNews();
  $('#panel').innerHTML=`<div class="ph"><div class="who">${pdot(p)}<b>${esc(p.name)}</b><span class="muted">${p.strokes}打終了</span></div></div>
   <p class="result">${esc(msg)}</p>${sim.tnote&&!p.cpu?`<p class="tnote">${sim.tnote}</p>`:''}
   ${nw.length?`<div class="news">${nw.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:''}
   ${p.cpu?'':stamBar(p,p.stBefore)}
   <div class="actions"><button class="btn primary" id="bNext">次へ</button></div>`;
  if(!p.cpu)animateStam();
  $('#bNext').onclick=()=>nextTurn();
}

}
let _elev=null;function elevCanvas(){if(!_elev)_elev=document.createElement('canvas');if(_elev.width!==Math.ceil(V.W)||_elev.height!==Math.ceil(V.H)){_elev.width=Math.ceil(V.W);_elev.height=Math.ceil(V.H)}return _elev}
function elevColor(t){const A=[30,111,184],M=[240,244,240],B=[226,122,58];const k=t<.5?t*2:(t-.5)*2,P=t<.5?A:M,Q=t<.5?M:B;
  return`rgb(${P.map((x,i)=>Math.round(x+(Q[i]-x)*k)).join(',')})`}
function drawThumb(c,h){
  if(!c)return;const[W,H]=fitCanvas(c);const save={C,W:V.W,H:V.H,cam:V.cam};
  C=c.getContext('2d');V.W=W;V.H=H;V.cam=camFit([...h.center,v(h.green.x,h.green.y+h.green.ry)],80,W,H);
  drawCourse(h,{thumb:true});
  C.fillStyle='#fff';C.font='600 13px "Barlow Condensed",sans-serif';const t=W2S(h.tee);C.fillText('TEE',t.x+8,t.y+4);
  C=save.C;V.W=save.W;V.H=save.H;V.cam=save.cam;
}
function addFx(type,pos){(S.fx=S.fx||[]).push({type,pos:{...pos},t0:performance.now()})}
function drawFx(now){
  S.fx=(S.fx||[]).filter(f=>now-f.t0<1100);
  S.fx.forEach(f=>{const k=(now-f.t0)/1100,c=W2S(f.pos);
    const rings=f.type==='land'?1:f.type==='cup'?2:3,col=f.type==='splash'?'30,111,184':'255,255,255';
    for(let i=0;i<rings;i++){const kk=clamp(k*1.3-i*.18,0,1);if(kk<=0)continue;C.strokeStyle=`rgba(${col},${(1-kk)*.9})`;C.lineWidth=2;C.beginPath();C.arc(c.x,c.y,4+kk*(f.type==='land'?14:22),0,7);C.stroke()}});
}
function drawMap(now){
  const h=S.h,s=V.cam.s;
  drawCourse(h);
  if((S.mode==='plan'||S.mode==='swing'||S.mode==='cpuplan')&&S.info&&S.cur&&S.plan){
    const info=S.info,P=S.cur.pos,T=S.plan.target,Pc=W2S(P),Tc=W2S(T);
    C.lineWidth=2;
    if(!info.putt){
      C.strokeStyle='rgba(255,255,255,.18)';C.setLineDash([3,6]);C.beginPath();C.arc(Pc.x,Pc.y,info.max*s,0,7);C.stroke();
      C.strokeStyle='rgba(255,255,255,.95)';C.setLineDash([8,6]);C.lineDashOffset=-now/60;C.beginPath();
      for(let i=0;i<=30;i++){const q=W2S(bez(P,info.Cp,T,i/30));i?C.lineTo(q.x,q.y):C.moveTo(q.x,q.y)}C.stroke();C.lineDashOffset=0;
      if(info.rollEst>.5){const R=W2S(add(T,mul(info.endDir,info.rollEst)));C.setLineDash([2,4]);C.strokeStyle='rgba(255,255,255,.7)';C.beginPath();C.moveTo(Tc.x,Tc.y);C.lineTo(R.x,R.y);C.stroke()}
    }else{C.strokeStyle='rgba(255,255,255,.9)';C.setLineDash([5,5]);C.beginPath();C.moveTo(Pc.x,Pc.y);C.lineTo(Tc.x,Tc.y);C.stroke()}
    C.setLineDash([]);
    if(!info.putt&&S.mode==='plan'){const m=W2S(bez(P,info.Cp,T,.5));
      C.fillStyle='rgba(255,255,255,.95)';C.beginPath();C.arc(m.x,m.y,11,0,7);C.fill();C.strokeStyle='#1E6FB8';C.lineWidth=2;C.stroke();
      C.fillStyle='#1E6FB8';const dd=norm(sub(Tc,Pc)),pp=v(-dd.y,dd.x);
      [1,-1].forEach(sg=>{const tip=v(m.x+pp.x*7*sg,m.y+pp.y*7*sg),b1=v(m.x+pp.x*2*sg+dd.x*4,m.y+pp.y*2*sg+dd.y*4),b2=v(m.x+pp.x*2*sg-dd.x*4,m.y+pp.y*2*sg-dd.y*4);C.beginPath();C.moveTo(tip.x,tip.y);C.lineTo(b1.x,b1.y);C.lineTo(b2.x,b2.y);C.fill()})}
    C.strokeStyle='#fff';C.lineWidth=2;C.beginPath();C.arc(Tc.x,Tc.y,8,0,7);C.stroke();
    C.fillStyle='#1E6FB8';C.beginPath();C.arc(Tc.x,Tc.y,3,0,7);C.fill();
    const lbl=fmtD(info.dist);C.font='600 15px "Barlow Condensed",sans-serif';const tw=C.measureText(lbl).width;
    C.fillStyle='rgba(255,255,255,.95)';C.beginPath();C.roundRect?C.roundRect(Tc.x+11,Tc.y-24,tw+10,19,5):C.rect(Tc.x+11,Tc.y-24,tw+10,19);C.fill();
    C.fillStyle='#14532D';C.fillText(lbl,Tc.x+16,Tc.y-9);
  }
  if(S.trail&&S.trail.length>1){for(let i=1;i<S.trail.length;i++){const a=S.trail[i-1],b=S.trail[i],A=W2S(a),B=W2S(b),oa=Math.min(a.z*s*.5,90),ob=Math.min(b.z*s*.5,90);
    C.strokeStyle=`rgba(255,255,255,${i/S.trail.length*.7})`;C.lineWidth=2;C.beginPath();C.moveTo(A.x,A.y-oa);C.lineTo(B.x,B.y-ob);C.stroke()}}
  drawFx(now);
  S.players.forEach(p=>{
    if(p.done)return;let pos=p.pos,z=0;
    if(S.anim&&p===S.cur&&S.animBall){pos=S.animBall;z=S.animBall.z||0}
    const c=W2S(pos),r=Math.max(3.8,.047*s)*(1+z/40),off=Math.min(z*s*.5,90);
    C.fillStyle='rgba(0,0,0,.3)';C.beginPath();C.arc(c.x+1,c.y+1,r*.95,0,7);C.fill();
    C.fillStyle='#fff';C.beginPath();C.arc(c.x,c.y-off,r,0,7);C.fill();
    C.strokeStyle=p.color;C.lineWidth=2;C.stroke();
    if(p===S.cur&&S.mode==='plan'){C.strokeStyle='rgba(255,255,255,'+(.4+.4*Math.sin(now/220))+')';C.lineWidth=1.5;C.beginPath();C.arc(c.x,c.y,r+6,0,7);C.stroke()}
  });
  if((S.mode==='plan'||S.mode==='swing')&&S.info&&S.cur&&!S.info.putt){
    const x0=8,y0=8,w=108,hh=48,gy=y0+hh-10,ap=S.info.apex;
    C.fillStyle='rgba(255,255,255,.92)';C.beginPath();C.roundRect?C.roundRect(x0,y0,w,hh,10):C.rect(x0,y0,w,hh);C.fill();
    C.strokeStyle='#2F7D4A';C.lineWidth=2;C.beginPath();C.moveTo(x0+10,gy);C.lineTo(x0+w-10,gy);C.stroke();
    C.strokeStyle='#1E6FB8';C.lineWidth=2;C.beginPath();
    for(let i=0;i<=20;i++){const t=i/20,X=x0+10+t*(w-20),Y=gy-4*t*(1-t)*(ap/40)*(hh-22);i?C.lineTo(X,Y):C.moveTo(X,Y)}C.stroke();
    C.fillStyle='#5F7368';C.font='500 10px "Zen Kaku Gothic New",sans-serif';C.fillText('最高点',x0+8,y0+13);
    C.fillStyle='#17241C';C.font='600 13px "Barlow Condensed",sans-serif';C.fillText(`${Math.round(ap)}y`,x0+40,y0+14);
  }
}
function updatePressure(){
  const el=$('#press');const p=S.cur;
  if(!p||p.cpu||!(S.mode==='plan'||S.mode==='swing'||S.mode==='anim')){el.style.opacity=0;el.classList.remove('beat');return}
  const lv=clamp((55-p.st)/55,0,1)*(S.mode==='swing'?1:.75);
  el.style.opacity=lv.toFixed(2);el.classList.toggle('beat',p.st<30&&S.mode==='swing');
}
function loop(t){
  requestAnimationFrame(loop);
  if($('#game').classList.contains('hidden')||!S.h)return;
  const[W,H]=fitCanvas(cv);S.W=W;S.H=H;V.W=W;V.H=H;V.cam=S.cam;C=cv.getContext('2d');
  if(!W||!H)return;
  if(S.camPts&&!S.dragging){const ct=camFit(S.camPts,S.camMin),c=S.cam;
    if((S.mode==='plan'||S.mode==='swing')&&S.zoom>1&&S.plan){ct.s*=S.zoom;const f=1-1/S.zoom;ct.x+=(S.plan.target.x-ct.x)*f;ct.y+=(S.plan.target.y-ct.y)*f}
    if(S.camSnap||!c.s||!isFinite(c.s)){Object.assign(c,ct);S.camSnap=false}
    else{c.x+=(ct.x-c.x)*.12;c.y+=(ct.y-c.y)*.12;c.s*=Math.pow(ct.s/c.s,.12)}}
  if(S.anim){const a=S.anim;a.i+=a.i<a.flightN?1:1.6;
    if(a.i>=a.frames.length-1){S.animBall=a.frames[a.frames.length-1];S.anim=null;a.onDone()}
    else{S.animBall=a.frames[Math.floor(a.i)];
      if(a.i<a.flightN){S.trail.push(S.animBall);if(S.trail.length>26)S.trail.shift()}
      else{if(!S.landed&&a.flightN>0){S.landed=true;addFx('land',a.frames[a.flightN-1])}if(S.trail.length)S.trail.shift()}}}
  drawMap(t);
  updatePressure();
  if(S.mode==='swing')drawSwing(t);
}
// マップ入力
function evPt(e){const r=cv.getBoundingClientRect();return v(e.clientX-r.left,e.clientY-r.top)}
function setTargetFromEvent(e){const q=evPt(e);S.plan.target=S2W(q.x,q.y);clampTarget();updatePlan()}
function setCurveFromEvent(e){const p=S.cur,P=p.pos,T=S.plan.target,q=evPt(e),w=S2W(q.x,q.y),mid=mul(add(P,T),.5),lp=leftP(norm(sub(T,P)));
  const mc=Math.max(.01,Math.min(35,dist(P,T)*.2));S.plan.curveF=clamp(dot(sub(w,mid),lp)/mc,-1,1);if(Math.abs(S.plan.curveF)<.08)S.plan.curveF=0;clampTarget();updatePlan()}
function onHandle(e){if(!S.info||!S.cur||!S.plan||S.info.putt)return false;const m=W2S(bez(S.cur.pos,S.info.Cp,S.plan.target,.5)),q=evPt(e);return Math.hypot(q.x-m.x,q.y-m.y)<26}
cv.addEventListener('pointerdown',e=>{if(S.mode!=='plan')return;
  if(S.placing){const q=evPt(e),w=S2W(q.x,q.y),sf=surfaceAt(S.h,w);if(sf==='ob'||sf==='water'){showBanner('そこには置けない','white');return}
    const p=S.cur;p.pos=w;p.lie=sf;p.mod=null;S.placing=false;$('#tPlace').classList.remove('on');beginPlan();return}cv.setPointerCapture(e.pointerId);S.dragging=onHandle(e)?'curve':'target';if(S.dragging==='target')setTargetFromEvent(e)});
cv.addEventListener('pointermove',e=>{if(S.mode!=='plan'||!S.dragging)return;S.dragging==='curve'?setCurveFromEvent(e):setTargetFromEvent(e)});
cv.addEventListener('pointerup',()=>{S.dragging=false});
cv.addEventListener('pointercancel',()=>{S.dragging=false});
$('#zIn').onclick=()=>{S.zoom=Math.min(4,(S.zoom||1)*1.6)};
$('#zOut').onclick=()=>{S.zoom=Math.max(1,(S.zoom||1)/1.6)};
$('#tPlace').onclick=()=>{if(S.mode!=='plan')return;S.placing=!S.placing;$('#tPlace').classList.toggle('on',S.placing);if(S.placing)showBanner('置く場所をタップ','white')};
$('#gRead').onclick=()=>{S.greenRead=!S.greenRead;const b=$('#gRead');b.classList.toggle('on',S.greenRead);b.setAttribute('aria-pressed',S.greenRead)};

renderTitle();
requestAnimationFrame(loop);
</script>
