<style>

header{position:relative}

body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

#goalbar{display:flex;align-items:center;gap:8px;background:#33291f;border-top:1px solid #3a2f28}#goalbar #goal{flex:1;border:none}
#goal-restart{display:none;flex:0 0 auto;margin-right:10px;font-size:11px;padding:5px 9px;border-radius:12px;border:1px solid #c99a5b;background:#6e5241;color:#fff;font-family:inherit}
body.done #goal-restart{display:block}
body.done .tabs .act button[data-t="miracle"],body.done .tabs .act button[data-t="bless"]{display:none}

<script>
'use strict';
// ===== 神に愛されたヒメウォンバット: core (data + simulation) =====

const BASE_PIETY = 1 / 710000; // 最初は「一頭だけが祈っている」
const P0 = 0.02;               // 奇跡を授かった直後の保有率
const SEL = 0.6;               // 奇跡の形質の選択有利（1世代あたり）

// need: 適合度の内訳（形質id: 重み）。prev: 先に住んでいる必要のある生息地
const HABITATS = [
  {id:'tas',   name:'タスマニア島',     area:64500,     dens:11,  bg:'meadow', food:'grass', need:{}, prev:null},
  {id:'aus',   name:'オーストラリア本土', area:7690000,   dens:3,   bg:'desert', food:'termite', sea:true,
   need:{numbat:.25, landiguana:.25, thorny:.25, hopping:.25}, prev:'tas'},
  {id:'coast', name:'近海',             area:3000000,   dens:2,   bg:'coast',  food:'kelp',
   need:{marine:.6, seaotter:.4}, prev:'aus'},
  {id:'micro', name:'ミクロネシア諸島',   area:3200,      dens:40,  bg:'island', food:'coconut', sea:true,
   need:{coconutcrab:.6, elephant:.4}, prev:'coast'},
  {id:'seasia',name:'東南アジア',        area:4500000,   dens:4,   bg:'jungle', food:'fig', sea:true,
   need:{elephant:.6, armadillo:.4}, prev:'micro'},
  {id:'easia', name:'東アジア',          area:5000000,   dens:4,   bg:'forest', food:'bamboo',
   need:{vole:.6, armadillo:.4}, prev:'seasia'},
  {id:'tibet', name:'ヒマラヤ・チベット高原', area:2500000, dens:1.5, bg:'mountain', food:'grass',
   need:{bargoose:.7, muskox:.3}, prev:'easia'},
  {id:'casia', name:'中央アジア',        area:4000000,   dens:2,   bg:'steppe', food:'grass',
   need:{hopping:.35, thorny:.35, muskox:.3}, prev:'easia'},
  {id:'siberia',name:'シベリア',         area:13100000,  dens:1.5, bg:'taiga',  food:'lichen',
   need:{muskox:.5, woodfrog:.5}, prev:'casia'},
  {id:'europe',name:'ヨーロッパ',        area:10000000,  dens:4,   bg:'europe', food:'grass',
   need:{vole:.6, armadillo:.4}, prev:'casia'},
  {id:'polar', name:'極地',             area:14000000,  dens:1,   bg:'ice',    food:'lichen',
   need:{woodfrog:.4, muskox:.3, reindeer:.3}, prev:'siberia'},
  {id:'ocean', name:'遠海',             area:300000000, dens:0.4, bg:'ocean',  food:'krill',
   need:{baleen:.4, seaotter:.3, marine:.3}, prev:'coast'},
  {id:'deep',  name:'深海',             area:300000000, dens:0.4, bg:'deep',   food:'snow',
   need:{snailfish:.6, riftia:.4}, prev:'ocean'},
  {id:'mars',  name:'火星',             area:144800000, dens:0.8, bg:'mars',   food:'moss',
   need:{tardigrade:.5, deinococcus:.3, human:.2}, prev:'tas', space:true},
];
const HAB = Object.fromEntries(HABITATS.map(h=>[h.id,h]));

// show: この生息地に住んでいれば奇跡の候補に出る（'*'は最初から）
const TRAITS = [
  {id:'devil', name:'急速進化の奇跡', src:'タスマニアデビル', cost:45, show:'*', v:'',
   eff:'病気に強くなる（全生息地の密度＋40%、疥癬の流行を抑える）', fx:{dens:.4, mange:true},
   trivia:'タスマニアデビルは、かみ合いでうつる「がん」の流行で8割以上も数を減らした。ところが2016年の研究で、わずか4〜8世代のうちに、免疫やがんに関わる遺伝子の領域に変化が起きていることがわかった。ウォンバットの最大の病気は、ダニが起こす皮膚病「疥癬」だ。',
   flavor:'ダニに噛まれても、かゆがらない子が生まれた。'},
  {id:'armadillo', name:'装甲の奇跡', src:'アルマジロ', cost:230, show:'*', v:'armor',
   eff:'毛皮の下の皮膚が鎧になる（全生息地の密度＋25%。トラやオオカミのいる大陸で有利）', fx:{dens:.25},
   trivia:'アルマジロの甲羅は、皮膚の中にできた骨の板でできている。ウォンバットはもともとお尻に硬い軟骨の板を持ち、巣穴に逃げこむとお尻で入口をふさいで身を守る。',
   flavor:'毛皮の下が、こつこつと硬い子が生まれた。'},
  {id:'kangaroo', name:'胚休眠の奇跡', src:'アカカンガルー', cost:690, show:'*', v:'joey',
   eff:'出産の間隔が2年→約1.3年。干ばつからの回復が速くなる', fx:{interval:2/1.5, drought:true},
   trivia:'アカカンガルーのメスは、足元に1頭、袋に1頭、子宮に休眠中の胚を1つと、同時に3頭の子を抱えられる。胚は100個ほどの細胞の段階で成長を止め、袋が空くのを待つ。干ばつの後に数をすばやく戻すための仕組みと考えられている。',
   flavor:'袋の奥で、次の子が順番を待つ母が生まれた。'},
  {id:'numbat', name:'シロアリ食の奇跡', src:'フクロアリクイ（ナンバット）', cost:3600, show:'tas', v:'tongue',
   eff:'シロアリを食べ、水も食べ物からとる（乾いた大地への適合）', fx:{},
   trivia:'フクロアリクイはシロアリだけを食べる有袋類で、1日に最大2万匹を長い舌でなめとる。水分もシロアリからとるので、水を飲む必要がない。',
   flavor:'舌の長い子が、蟻塚に顔をうずめていた。'},
  {id:'landiguana', name:'サボテン食の奇跡', src:'ガラパゴスリクイグアナ', cost:5000, show:'tas', v:'cactus',
   eff:'サボテンをトゲごと食べ、水分もそこからとる（乾いた大地への適合）', fx:{},
   trivia:'ガラパゴスリクイグアナは、食べ物の8割がウチワサボテン。実も花もトゲまで食べ、水分もほとんどそこからとる。オーストラリアにサボテンは自生しないが、持ちこまれたウチワサボテンが4万km²の農地を覆い、1925年に導入されたガの幼虫がほぼ食べ尽くした。クイーンズランドには、そのガの記念碑が建っている。',
   flavor:'トゲを前菜のように食べる子が生まれた。'},
  {id:'thorny', name:'吸水皮膚の奇跡', src:'モロクトカゲ', cost:6900, show:'tas', v:'spikes',
   eff:'皮膚の溝で水を集めて口まで運ぶ（乾いた大地への適合）', fx:{},
   trivia:'モロクトカゲは、うろこの間の細い溝で露や湿った砂の水を集め、毛細管現象で口まで運んで飲む。主な水源は、湿った砂から吸い上げる水だという。',
   flavor:'湿った砂に座るだけで喉をうるおす子が生まれた。お尻で。'},
  {id:'hopping', name:'濃縮腎臓の奇跡', src:'スピニフェックスホッピングマウス', cost:9700, show:'tas', v:'',
   eff:'水をほとんど捨てない腎臓（乾いた大地への適合）', fx:{},
   trivia:'スピニフェックスホッピングマウスは、哺乳類で最も濃い尿を出すと報告されている。水を一滴も飲まずに暮らせる。',
   flavor:'一滴の水も無駄にしない子が生まれた。四角いフンは、さらに乾いた。'},
  {id:'tenrec', name:'多産の奇跡', src:'テンレック（タイリクテンレック）', cost:460000, show:'aus', v:'joeys',
   eff:'一度に産む子が1頭→平均18頭', fx:{litter:18},
   trivia:'タイリクテンレックは、乳首の数も、一度に産む子の数の平均（約18頭）も最大（32頭）も、哺乳類でいちばん。ウォンバットの乳首は2つしかない。',
   flavor:'後ろ向きの袋から、子どもたちがあふれ出した。袋の容積について、考えてはいけない。'},
  {id:'marine', name:'海藻食の奇跡', src:'ウミイグアナ', cost:19000, show:'aus', v:'salt',
   eff:'海に潜って海藻を食べ、塩をくしゃみで捨てる（近海・遠海への適合）', fx:{},
   trivia:'ウミイグアナは、海に潜って海藻を食べる唯一のトカゲ。海藻と一緒にとりこんだ余分な塩分は、頭の塩類腺に集めて、鼻からくしゃみで吹き飛ばす。',
   flavor:'波打ち際で、くしゃみをする子が生まれた。塩の結晶が、朝日にきらめいた。'},
  {id:'seaotter', name:'密毛の奇跡', src:'ラッコ', cost:57000, show:'aus', v:'plush',

const pv=(S,id)=>S.prev[id]||0;

function stats(S){
  const pT=pv(S,'tenrec'),pV=pv(S,'vole'),pK=pv(S,'kangaroo');
  const litter=1+17*pT, interval=2-(2-2/1.5)*pK, maturity=2-(2-38/365)*pV;

  const piety=(1+S.bl.pray)*Math.pow(1.3,n)*(1+3*pv(S,'human'));
  const b=0.5*litter/interval, T=maturity+1;

}
function capOf(S,id,st){const h=HAB[id];const s=suit(S,h);return h.area*h.dens*st.dens*(1+.06*(S.grass[id]||0))*s*(S.adapted[id]&&id!=='tas'?1.3:1);}

function wonPerYear(S,st){return totalPop(S)*BASE_PIETY*st.piety;}
function tapValue(S,st){return 2*st.click+0.01*wonPerYear(S,st);}

// ----- space programs -----
// rk: ロケット（火星）  st: 恒星間船（深宇宙）
const FAIL_RK=[0.45,0.27,0.12,0.06]; // 新型ロケットの打ち上げ失敗率のめやす（初号機ほど高い）
const FAIL_ST=[0.15,0.08,0.04];
function prog(S){if(!S.rk)S.rk={phase:'none',p:0,n:0,t:0};if(!S.sp)S.sp={phase:'none',p:0,n:0,t:0};return S;}
function isWindow(S){return Math.floor(S.year*12/26)!==Math.floor((S.year-1)*12/26);} // 26か月ごとの打ち上げ窓
function devRate(S,which){return which==='rk'?pv(S,'human')/60:(0.5+0.5*pv(S,'deinococcus'))/50;}
function investCost(S,st){return Math.max(1e6,Math.ceil(wonPerYear(S,st)*3));}
function canInvest(S,which){prog(S);const P=S[which];return P.phase==='dev';}
function invest(S,which){prog(S);const st=stats(S),c=investCost(S,st),P=S[which];if(P.phase!=='dev'||S.won<c)return false;S.won-=c;P.p=Math.min(1,P.p+0.06);return true;}

function stepPrograms(S,rng,ev){
  prog(S);const R=S.rk,P=S.sp;
  // ロケット
  if(R.phase==='none'&&pv(S,'curiosity')>=.5){R.phase='dev';ev&&ev('rk_start',{});}
  else if(R.phase==='dev'){R.p=Math.min(1,R.p+devRate(S,'rk'));if(R.p>=1){R.phase='ready';ev&&ev('rk_ready',{});}}
  else if(R.phase==='ready'&&isWindow(S)){
    const f=FAIL_RK[Math.min(R.n,FAIL_RK.length-1)];R.n++;
    if(rng()<f){R.phase='dev';R.p=0.75;ev&&ev('rk_fail',{n:R.n});}
    else{R.phase='cruise';R.t=0;ev&&ev('rk_launch',{n:R.n});}
  }
  else if(R.phase==='cruise'){R.t++;if(R.t>=1){ // 約7か月の航行
    if(suit(S,HAB.mars)>=.2){R.phase='done';S.col.mars=true;S.pop.mars=200;ev&&ev('mars_arrive',HAB.mars);}
    else{R.phase='ready';ev&&ev('mars_noroot',HAB.mars);}}}
  // 恒星間船
  if(P.phase==='none'&&S.col.mars&&pv(S,'spore')>=.5){P.phase='dev';ev&&ev('sp_start',{});}
  else if(P.phase==='dev'){P.p=Math.min(1,P.p+devRate(S,'sp'));if(P.p>=1){P.phase='ready';}}
  else if(P.phase==='ready'){const f=FAIL_ST[Math.min(P.n,FAIL_ST.length-1)];P.n++;
    if(rng()<f){P.phase='dev';P.p=0.8;ev&&ev('sp_fail',{n:P.n});}else{P.phase='cruise';P.t=0;ev&&ev('sp_launch',{});}}
  else if(P.phase==='cruise'){P.t++;if(P.t>=20){P.phase='out';ev&&ev('heliopause',{});}}
}

// one year. ev(kind, data) を呼ぶ。カード化するかどうかはUI側で判断
function stepYear(S,rng,ev){
  const st=stats(S);
  S.year++;
  // 形質の保有率：世代ごとに広がる
  const k=SEL/st.T;
  for(const id in S.owned){let p=S.prev[id];p=p+k*p*(1-p);S.prev[id]=Math.min(1,p>0.999?1:p);}
  // 生息数
  for(const h of HABITATS){
    if(!S.col[h.id])continue;
    const K=Math.max(1,capOf(S,h.id,st));let N=S.pop[h.id]||0;
    N=K/(1+((K-N)/Math.max(N,1e-9))*Math.exp(-st.r));
    S.pop[h.id]=N;
  }
  // 漂流：嵐で流された一群が、海の向こうに流れ着くか
  for(const h of HABITATS){
    if(!h.sea||S.col[h.id]||!S.col[h.prev]||S.year<40)continue;
    if((S.pop[h.prev]||0)<0.3*capOf(S,h.prev,st))continue;
    if(rng()<0.08){
      const surv=driftSurv(S);
      if(rng()<surv){ if(suit(S,h)>=.2){S.col[h.id]=true;S.pop[h.id]=200;ev&&ev('drift_ok',h);} else ev&&ev('drift_noroot',h); }
      else ev&&ev('drift_lost',h);
    }
  }
  // 進出・適応
  for(const h of HABITATS){
    if(canColonize(S,h)){S.col[h.id]=true;S.pop[h.id]=200;ev&&ev('colonize',h);}
    else if(readyToAdapt(S,h)){S.adapted[h.id]=true;ev&&ev('adapt',h);}
  }
  // 災い
  const pd=pv(S,'devil');
  if(S.year>25&&rng()<0.03*(1-pd)){S.pop.tas*=0.6;ev&&ev('mange',{});}
  if(S.col.aus&&rng()<0.06){const kk=.45+.4*pv(S,'kangaroo');S.pop.aus*=kk;ev&&ev('drought',{resist:pv(S,'kangaroo')>.5});}
  stepPrograms(S,rng,ev);
  if(readyToDepart(S)){S.done=true;ev&&ev('ending',{});}
  const w=wonPerYear(S,st);S.won+=w;S.totalWon+=w;
  return st;
}
function buyTrait(S,id){const t=TR[id];if(!traitAvailable(S,t)||S.won<t.cost)return false;S.won-=t.cost;S.owned[id]=true;S.prev[id]=P0;return true;}
function buyBlessing(S,id,hab){
  const b=BLESSINGS.find(x=>x.id===id);const lv=b.perHab?(S.grass[hab]||0):S.bl[id];const c=blCost(b,lv);
  if(S.won<c)return false;S.won-=c;if(b.perHab)S.grass[hab]=lv+1;else S.bl[id]++;return true;
}
function blLevel(S,b,hab){return b.perHab?(S.grass[hab]||0):S.bl[b.id];}

function mkGrid(W,H){
  const g=new Array(W*H).fill(0),pt=new Uint8Array(W*H);
  const S=(x,y,c,p=9)=>{x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;g[y*W+x]=c;pt[y*W+x]=p;};
  const SE=(cx,cy,rx,ry,n,p,fn)=>{
    for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
      const dx=Math.abs((x+.5-cx)/rx),dy=(y+.5-cy)/ry;if(Math.pow(dx,n)+Math.pow(Math.abs(dy),n)<=1)S(x,y,fn(x,y,dy),p);}
  };
  const E=(cx,cy,rx,ry,p,fn)=>SE(cx,cy,rx,ry,2,p,fn);
  return {W,H,g,pt,S,SE,E};
}
// fluffy silhouette: little tufts on upper edges of fur parts
function fuzz(G,pids,maxY){

}
// grizzled frosting on fur: light tips scattered on the upper part
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;};
const frost=(x,y,r)=>r<.6&&hash(x,y)<(r<.3?.11:.05);

// ---------- side view ----------

function renderWombat(o){

  const K=1.28;

  // head

  fuzz(G,[2,3],bcy+2);
  // near ear: small, pale rim
  const ey0=hcy-5.7*K-(o.ear>0?1:0)+(o.ear<0?1.4:0);
  E(hcx-3.4*K,ey0,1.6*K,2.1*K,4,(x,y,dy)=>dy<-.3?'p':'d');S(hcx-3.4*K-.6,ey0-2.1*K,'p',4);
  // nose: big bare matte nose
  const ncx=hcx+6.6*K,ncy=hcy+.4*K;
  SE(ncx,ncy,2.4*K,2.8*K,3,5,()=>'n');
  S(ncx-1.6,ncy-2.4,'nh',5);S(ncx-.6,ncy-2.4,'nh',5);S(ncx-1.6,ncy-1.4,'nh',5);
  S(ncx+1.5,ncy+.8,'e',5);S(ncx+.5,ncy+.8,'e',5);
  // eye: small round beady
  const ex=Math.floor(hcx+.8*K),ey=Math.floor(hcy-2.6*K);
  if(o.eye==='closed'){S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
  else if(o.eye==='half'){S(ex-1,ey,'e');S(ex,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
  else if(o.eye==='happy'){S(ex-1,ey+1,'e');S(ex,ey,'e');S(ex+1,ey+1,'e');}
  else if(o.eye==='strain'){S(ex-1,ey,'e');S(ex,ey+1,'e');S(ex-1,ey+2,'e');}
  else {S(ex,ey,'w');S(ex+1,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');}

// ---------- front view ----------
const FW=40,FH=32,FAX=20;
function renderFront(o){
  const G=mkGrid(FW,FH),{g,pt,S,SE,E}=G;
  const sq=o.sq||0,cx=20,ty=o.bob||0;
  const bry=10.6+(o.br||0)-sq*8,brx=14*(1+sq);
  const bcy=27.5-bry;

  const pawY=26;
  // body
  const fsh=(x,y)=>{const r=(y+.5-(bcy-bry))/(2*bry);return r<.18?(frost(x,y,r)?'f':'l'):r>.82?'d':(frost(x,y,r)?'f':'b');};

  // head merges with body (no neck)
  const hcy=bcy-3.2+ty+(o.hy||0),hrx=10.4*(1+sq*.5),hry=8.6;
  E(cx,hcy,hrx,hry,3,(x,y,dy)=>dy<-.55?(frost(x,y,0)?'f':'l'):'b');
  // ears: small, wide-set, pale rims
  const eo=o.ear>0?1:0;
  for(const s of [-1,1]){
    const ex=cx+s*7.6,ey=hcy-7.4-eo;
    E(ex,ey,2.2,2.6,4,(x,y,dy)=>dy<-.25||Math.abs(x+.5-ex)>1.4?'p':'d');
  }
  fuzz(G,[2,3],bcy);
  // face: slightly lighter muzzle
  E(cx,hcy+3.8,6,3.6,5,()=>'l');
  // eyes: small, round, beady, wide-set
  for(const s of [-1,1]){
    const ex=Math.floor(cx+s*4.6-(s<0?1:0)),ey=Math.floor(hcy-1);
    if(o.eye==='closed'){S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
    else if(o.eye==='half'){S(ex,ey,'d');S(ex+1,ey,'d');S(ex,ey+1,'e');S(ex+1,ey+1,'e');S(ex+(s<0?0:1),ey+1,'e');}
    else if(o.eye==='happy'){S(ex,ey+1,'e');S(ex+1,ey,'e');S(ex+2,ey+1,'e');}
    else {S(ex,ey,'e');S(ex+1,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');S(ex+(s<0?0:0),ey,'w');}
  }
  if(o.blush){S(cx-7,hcy+2,'c');S(cx-6,hcy+2,'c');S(cx+6,hcy+2,'c');S(cx+7,hcy+2,'c');}
  // big bare nose
  // big bare nose: wide top, rounded bottom (shield shape), nostrils at the lower sides
  const ny=hcy+3.4+(o.nw||0);
  for(let y=Math.floor(ny-2.9);y<=ny+2.9;y++){const t=(y+.5-(ny-2.9))/5.8;let hw=4.7-2.4*t*t;if(t<.22)hw-=(.22-t)*6;

  S(cx-.5,ny+2.2,'o',6);
  // mouth
  S(cx-.5,ny+3.3,'o');S(cx-1.5,ny+4,'o');S(cx+.5,ny+4,'o');
  if(o.chew){S(cx-.5,ny+4.2,'o');}
  G.g=g;
  const fin=outline(G);
  const P=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<FW&&y<FH)fin[y*FW+x]=c;};
  // front paws with long pale claws, turned slightly inward
  for(const s of [-1,1]){
    const px=cx+s*5.5;
    for(let y=pawY;y<=27;y++)for(let x=Math.floor(px-2);x<=Math.floor(px+1);x++)P(x,y,'d');
    P(px-2,28,'o');P(px+1,28,'o');
    const c0=s<0?px:px-2;P(c0-1,28,'k');P(c0,28,'k');P(c0+1,28,'k');

  }

  for(const s of [-1,1]){

    P(cx+s*6.5+b,hcy+3.6,'v');P(cx+s*7.5+b,hcy+3.1,'v');P(cx+s*8.5+b,hcy+2.8,'v');
    P(cx+s*6.5+b,hcy+5,'v');P(cx+s*7.5+b,hcy+5.4,'v');P(cx+s*8.5+b,hcy+6,'v');

    case 'forest':

      hills(46,2,.08,1.5,.19,2,'#9a9a6a');ground('#a8a06a',['#b8b07a','#8a8450']);

      for(let i=0;i<16;i++){const tx=Math.floor(r()*SW),th=12+Math.floor(r()*10);for(let y=0;y<th;y++){const w=Math.floor(y/3);for(let x=-w;x<=w;x++)px(tx+x,GY-th-2+y,(y+x)%4?'#2f5a46':'#3d6e56');}px(tx,GY-th-3,'#ffffff');}
      ground('#dfe8ec',['#c8d6de','#ffffff']);break;
    case 'europe':
      bands(['#a8cfe8','#b4d5ea','#c0dbec','#cce1ee','#d8e7f0','#d8e7f0','#d8e7f0','#d8e7f0'],8);sun(90,10,'#fff6d0',3);
      hills(42,3,.05,1.5,.16,0,'#9cc07a');for(let x=0;x<SW;x+=10)for(let y=44;y<GY;y++)if((x+y)%2)px(x,y,'#b8c86a');
      tree(24,14,'#6a5a40','#5f8f4a','#4a7a3a');b.fillStyle='#c8b8a0';b.fillRect(72,36,10,8);b.fillStyle='#a04a3a';for(let k=0;k<6;k++)b.fillRect(71+k,35-k,12-2*k,1);
      ground('#6fa04a',['#82b35a','#5a8a3a']);break;

  }
  BG[kind]=c;return c;
}

// ---------- scene state ----------
let view='tas'; // displayed habitat
function latestHab(){let l='tas';for(const h of HABITATS)if(S.col[h.id])l=h.id;return l;}
function curFood(h){if(!HAB[h])return 'grass';if(h==='aus')return S.owned.numbat?'termite':S.owned.landiguana?'cactus':'grass';return HAB[h].food;}
const W={x:56,dir:1,state:'idle',t:0,dur:3,target:56,blink:0,blinkCD:2,ear:0,earCD:3,emit:0,pooped:false,food:null};
let parts=[],poops=[],food=null,crowd=[],gold=null,goldCD=40;
function addP(o){parts.push(Object.assign({t:0},o));}
function setState(s){
  W.state=s;W.t=0;W.pooped=false;W.emit=0;
  if(s==='idle')W.dur=2.5+R()*2.5;
  else if(s==='walk'){W.target=24+R()*(SW-48);if(Math.abs(W.target-W.x)<8)W.target=W.x<SW/2?W.x+25:W.x-25;W.dir=W.target>W.x?1:-1;W.dur=99;}
  else if(s==='zoom'){W.target=W.x<SW/2?SW-24:24;W.dir=W.target>W.x?1:-1;W.dur=99;}
  else if(s==='eat'){food={type:curFood(view),x:W.x,left:1};W.dur=5;}
  else if(s==='dig')W.dur=3;else if(s==='poop')W.dur=2;else if(s==='joey')W.dur=3.6;else if(s==='sleep')W.dur=7;else if(s==='pet')W.dur=1.2;
  if(s!=='eat')food=null;
}
function nextAuto(){const r=R();setState(r<.22?'walk':r<.45?'eat':r<.56?'idle':r<.65?'dig':r<.73?'poop':r<.81?'joey':r<.88?'zoom':'sleep');}
function pose(){
  const o={eye:W.blink>0?'closed':'open',ear:W.ear>0?1:0},t=W.t;
  switch(W.state){
    case 'idle':o.br=.5*Math.sin(t*2.6);if(t%5>3.4&&o.eye==='open')o.eye='half';o.nw=(Math.floor(t*4)%7===0)?-1:0;break;
    case 'walk':o.walk=1;o.wp=Math.floor(t*7)%2;o.bob=o.wp?-1:0;break;
    case 'zoom':o.walk=1;o.wp=Math.floor(t*14)%2;o.bob=o.wp?-1:0;o.ear=-1;o.hx=1;break;
    case 'eat':o.hy=3.5;o.chew=Math.floor(t*5)%2;o.hy+=o.chew;o.nw=o.chew?1:0;o.eye=W.blink>0?'closed':t%2>1?'half':'open';o.br=.3*Math.sin(t*2);break;
    case 'dig':o.hx=1;o.hy=3;o.walk=1;o.dig=1;o.wp=Math.floor(t*12)%2;o.eye='closed';break;
    case 'poop':if(t>.4&&t<.9){o.eye='strain';o.sq=-.03;}else if(t>=.9)o.eye='half';break;
    case 'joey':{const k=t<.5?t/.5:t>3?Math.max(0,(3.6-t)/.5):1;o.joey=Math.round(k*2+(k>.99?Math.floor(t*2)%2:0));o.eye=t%2.4>1.6?'half':'open';o.br=.4*Math.sin(t*2.6);break;}
    case 'sleep':o.low=2;o.noLegs=1;o.eye='closed';o.br=.7*Math.sin(t*1.3);o.hy=1;break;
    case 'pet':o.eye='half';o.blush=1;o.sq=.06*Math.sin(t*16)*Math.max(0,1-t/1.2);o.ear=Math.floor(t*6)%2;break;
  }
  return o;
}
function updateScene(dt){
  W.t+=dt;
  W.blinkCD-=dt;if(W.blinkCD<=0){W.blink=.14;W.blinkCD=2+R()*3;}if(W.blink>0)W.blink-=dt;
  W.earCD-=dt;if(W.earCD<=0){W.ear=.25;W.earCD=2+R()*4;}if(W.ear>0)W.ear-=dt;
  const s=W.state;
  if(s==='walk'||s==='zoom'){const sp=s==='zoom'?42:9;W.x+=W.dir*sp*dt;
    if(s==='zoom'){W.emit+=dt;if(W.emit>.05){W.emit=0;addP({k:'dust',x:W.x-W.dir*12,y:GY-1,vx:-W.dir*8,vy:-6,life:.5});}}
    if((W.dir>0&&W.x>=W.target)||(W.dir<0&&W.x<=W.target)){W.x=W.target;nextAuto();}}
  if(s==='eat'&&food){food.left=Math.max(0,1-W.t/4.4);W.emit+=dt;if(W.emit>.2&&food.left>0){W.emit=0;const F=FOODS[food.type],cs=Object.keys(F.pal);addP({k:'crumb',c:F.pal[cs[Math.floor(R()*cs.length)]],x:W.x+(R()-.5)*4,y:GY-6,vx:(R()-.5)*14,vy:-10,life:.6});}}
  if(s==='dig'){W.emit+=dt;if(W.emit>.07){W.emit=0;addP({k:'dirt',x:W.x+W.dir*8,y:GY-2,vx:-W.dir*(18+R()*20),vy:-18-R()*14,life:.9});}}
  if(s==='poop'&&!W.pooped&&W.t>=.9){W.pooped=true;poops.push({x:W.x-W.dir*19,y:GY-14,vy:0,t:0});}
  if(s==='sleep'){W.emit+=dt;if(W.emit>1.1){W.emit=0;addP({k:'z',x:W.x+W.dir*12,y:GY-26,vx:3*W.dir,vy:-5,life:2});}}
  if(s==='pet'){W.emit+=dt;if(W.emit>.3){W.emit=0;addP({k:'heart',x:W.x+(R()-.5)*20-2,y:GY-28,vx:(R()-.5)*6,vy:-12,life:1.1});}}
  if(W.t>=W.dur)nextAuto();
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='dirt'||p.k==='crumb')p.vy+=70*dt;}
  parts=parts.filter(p=>p.t<p.life&&!((p.k==='dirt'||p.k==='crumb')&&p.y>GY+1));
  for(const q of poops){q.t+=dt;if(q.y<GY-3){q.vy+=60*dt;q.y=Math.min(GY-3,q.y+q.vy*dt);}}
  poops=poops.filter(q=>q.t<10);
  for(const c of crowd){c.t+=dt;if(c.wait>0){c.wait-=dt;}else{c.x+=c.v*dt;if(R()<dt*.15){c.wait=1+R()*3;}}if(c.x<-6)c.x=SW+5;if(c.x>SW+6)c.x=-5;}
  if(gold){gold.t+=dt;if(R()<dt*6)addP({k:'spark',x:gold.x+(R()-.5)*6,y:gold.y-2+(R()-.5)*6,vx:0,vy:-6,life:.5});if(gold.t>12)gold=null;}
  else if(!S.done&&typeof paused==='function'&&!paused()&&S.year>5){goldCD-=dt;if(goldCD<=0){goldCD=45+R()*45;gold={x:10+R()*(SW-20),y:GY+5+R()*6,t:0};}}
  ambT+=dt;
}
let ambT=0;
const MINI=['......o..','.oooooboo','obllllbbn','obbbbbbbo','.obbbbbo.','..d...d..'];
const MINI_PAL={o:'#2a1a12',b:'#86613f',l:'#a17a53',n:'#3f3230',d:'#5e4128'};
const PAT={heart:['.x.x.','xxxxx','xxxxx','.xxx.','..x..'],z:['xxxx','..x.','.x..','xxxx']};
function pat(p,x,y,col,hl){x=Math.round(x);y=Math.round(y);ctx.fillStyle=col;p.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='x')ctx.fillRect(x+i,y+j,1,1);});if(hl){ctx.fillStyle=hl;ctx.fillRect(x+1,y+1,1,1);}}
function drawFood(f){const F=FOODS[f.type],P=F.pat,h=P.length,w=Math.max(...P.map(r=>r.length));const cols=Math.ceil(w*f.left),x0=Math.round(f.x-w/2),y0=GY-h+3;
  for(let j=0;j<h;j++)for(let i=0;i<cols;i++){const c=P[j][i];if(c&&c!=='.'){ctx.fillStyle=F.pal[c];ctx.fillRect(x0+i,y0+j,1,1);}}}
function rebuildCrowd(){
  const n=Math.min(14,Math.max(0,Math.round(Math.log10(Math.max(1,S.pop[view]||0))*2-8)));
  crowd=[];for(let i=0;i<n;i++){const v=(R()<.5?-1:1)*(1.5+R()*2);crowd.push({x:R()*SW,y:GY+3+Math.floor(R()*8),v,t:R()*9,wait:R()*2});}crowd.sort((a,b)=>a.y-b.y);
}
function draw(){
  const SP=view==='space';const bgk=SP?'space':HAB[view].bg;
  ctx.drawImage(bgCanvas(bgk),0,0);
  // ambient
  if(bgk==='coast'||bgk==='island'||bgk==='ocean'){ctx.fillStyle='#bfe2f2';for(let i=0;i<6;i++){const x=Math.floor((i*23+ambT*6)%SW);ctx.fillRect(x,(bgk==='ocean'?36:42)+(i%3)*4,3,1);}}
  if(bgk==='deep'){for(let i=0;i<24;i++){const x=(i*37)%SW,y=Math.floor((i*13+ambT*3)%GY);ctx.fillStyle='rgba(220,235,245,.55)';ctx.fillRect(x,y,1,1);}
    if(S.owned.snailfish){for(let i=0;i<5;i++){const a=.5+.5*Math.sin(ambT*2+i);ctx.fillStyle=`rgba(120,255,230,${a})`;ctx.fillRect((i*29+7)%SW,20+(i*11)%25,1,1);}}}
  // crowd (distant wombats): tiny side-view wombats
  if(!SP)for(const c of crowd){const x0=Math.round(c.x)-4,bob=c.wait>0?0:(Math.floor(c.t*6)%2),y0=c.y-6-bob,d=c.v>0;
    MINI.forEach((row,j)=>{for(let i=0;i<9;i++){const ch=row[d?i:8-i];if(ch==='.')continue;if(j===5&&bob&&ch==='d')continue;ctx.fillStyle=MINI_PAL[ch];ctx.fillRect(x0+i,y0+j+(j===5?bob:0),1,1);}});}
  for(const q of poops){const x=Math.round(q.x)-1,y=Math.round(q.y);ctx.fillStyle=PAL.o;ctx.fillRect(x-1,y-2,6,6);ctx.fillStyle='#6a4d36';ctx.fillRect(x,y-1,4,4);ctx.fillStyle='#8a684d';ctx.fillRect(x,y-1,3,1);ctx.fillRect(x,y,1,1);}
  if(!SP){ctx.fillStyle='rgba(30,30,20,.3)';const sw=W.state==='sleep'?30:26;ctx.fillRect(Math.round(W.x-sw/2+W.dir*2),GY,sw,2);
  const o=pose();const front=W.state==='idle'||W.state==='pet'||W.state==='eat';
  blitWombat(front?renderFront(o):renderWombat(o),Math.round(W.x),!front&&W.dir<0);
  if(food&&food.left>0)drawFood(food);}
  if(SP){for(let i=0;i<22;i++){const sp=3+i%3,x=Math.floor((i*31+ambT*(2+i%4))%(SW+10))-5,y=Math.floor((i*17+Math.sin(ambT*.7+i)*4+ambT*(1+i%2))%(SH+8))-4,s=2+(i%3);
    ctx.fillStyle='#2a1a12';ctx.fillRect(x-1,y-1,s+2,s+2);ctx.fillStyle='#a17a53';ctx.fillRect(x,y,s,s);ctx.fillStyle='#c9a46a';ctx.fillRect(x,y,s,1);if(s>3){ctx.fillStyle='#0d0806';ctx.fillRect(x+1,y+2,1,1);ctx.fillRect(x+s-2,y+2,1,1);}}}
  // day/night (wombats are nocturnal): outdoor scenes only
  if(!SP&&bgk!=='deep'){const k=Math.max(0,Math.sin(ambT*Math.PI*2/60-1));if(k>0){ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${255-k*150|0},${255-k*135|0},${255-k*70|0})`;ctx.fillRect(0,0,SW,SH);ctx.globalCompositeOperation='source-over';
    if(bgk!=='ocean'&&bgk!=='coast'&&bgk!=='island'||true){for(let i=0;i<14;i++){const tw=.5+.5*Math.sin(ambT*3+i*2);ctx.fillStyle=`rgba(255,250,220,${(k*tw*.9).toFixed(3)})`;ctx.fillRect((i*37+11)%SW,(i*13)%26,1,1);}}}}
  if(gold){const x=Math.round(gold.x)-2,y=Math.round(gold.y)-4+Math.round(Math.sin(gold.t*4));const fl=gold.t>9&&Math.floor(gold.t*8)%2;
    if(!fl){ctx.fillStyle='#5a3a10';ctx.fillRect(x-1,y-1,7,7);ctx.fillStyle='#e8b53a';ctx.fillRect(x,y,5,5);ctx.fillStyle='#ffe58a';ctx.fillRect(x,y,4,1);ctx.fillRect(x,y,1,3);ctx.fillStyle='#fff8d0';ctx.fillRect(x+1,y+1,1,1);}}
  for(const p of parts){
    if(p.k==='heart')pat(PAT.heart,p.x,p.y,'#ff7f9b','#ffd0da');
    else if(p.k==='z')pat(PAT.z,p.x,p.y,'#ffffff');
    else if(p.k==='dust'){ctx.fillStyle='rgba(200,185,160,'+(1-p.t/p.life)+')';ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2);}
    else if(p.k==='crumb'){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
    else if(p.k==='spark'){ctx.fillStyle=`rgba(255,240,170,${1-p.t/p.life})`;ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
    else if(p.k==='dirt'){ctx.fillStyle='#6b4b30';ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
  }
}


// ===== event card art: habitat + (mutant) wombat =====
const TINTS={
  frozen:{b:'#8fa9bd',l:'#b9cfdd',d:'#5f7a90',f:'#e6f4ff',m:'#7a93a8',n:'#4a5a6a',nh:'#8aa0b4',o:'#1e2a36',c:'#a9c4d8'},
  abyss:{b:'#c9a3a8',l:'#e4c6c8',d:'#9a7880',f:'#f4e0e2',m:'#b48e94',n:'#6a4a56',nh:'#a07a86',o:'#3a2430',c:'#f0b0c0',e:'#2af0d0'},
  mange:{b:'#9a7458',l:'#b48a6a',f:'#d9a0a0',m:'#c08870'},
};
function blitTo(c,R,left,top,tint){
  const {W,H,img}=R;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=img[y*W+x];if(!k)continue;c.fillStyle=(tint&&tint[k])||PAL[k];c.fillRect(left+x,top+y,1,1);}
}
function maskOf(R){const {W,H,img}=R;return (x,y)=>x>=0&&y>=0&&x<W&&y<H&&!!img[y*W+x];}
// variant overlays, drawn in sprite-local coordinates of the FRONT view
function drawVariants(c,R,left,top,vs,t){
  const M=maskOf(R),P=(x,y,col)=>{c.fillStyle=col;c.fillRect(left+Math.round(x),top+Math.round(y),1,1);};
  const topY=x=>{for(let y=0;y<R.H;y++)if(M(x,y))return y;return null;};

const VAR_TINT={frozen:'frozen',abyss:'abyss',mange:'mange'};
let ART_OFF=null;
function cardArt(cv2,o){
  if(!ART_OFF){ART_OFF=document.createElement('canvas');ART_OFF.width=SW;ART_OFF.height=SH;}
  const c=ART_OFF.getContext('2d');c.clearRect(0,0,SW,SH);
  c.drawImage(bgCanvas(o.bg),0,0);
  if(o.cracks){c.fillStyle='#7a3e1c';const r=rng(9);for(let i=0;i<14;i++){let x=Math.floor(r()*SW),y=GY+1+Math.floor(r()*12);for(let k=0;k<6;k++){c.fillRect(x,y,1,1);x+=r()<.5?1:-1;y+=r()<.6?0:(r()<.5?1:-1);}}}
  if(o.crowd){const r=rng(o.crowd);for(let i=0;i<o.crowd;i++){const x=Math.floor(r()*SW),y=GY+2+Math.floor(r()*9);c.fillStyle='#5e4128';c.fillRect(x,y,3,2);c.fillStyle='#86613f';c.fillRect(x,y,2,1);}}
  if(o.spores){const r=rng(5);for(let i=0;i<o.spores;i++){const x=Math.floor(r()*(SW-6)),y=Math.floor(r()*(SH-6)),s=2+Math.floor(r()*3);c.fillStyle='#3a2a22';c.fillRect(x-1,y-1,s+2,s+2);c.fillStyle='#a17a53';c.fillRect(x,y,s,s);c.fillStyle='#c9a46a';c.fillRect(x,y,s,1);if(s>3){c.fillStyle='#0d0806';c.fillRect(x+1,y+2,1,1);c.fillRect(x+s-2,y+2,1,1);}}}
  if(o.rocket)drawRocket(c,o.rocket);
  if(o.noWombat){finishArt(cv2,o);return;}
  const vs=o.v||[];let tint=null;for(const k in VAR_TINT)if(vs.includes(k))tint=TINTS[VAR_TINT[k]];
  const R2=renderFront(Object.assign({eye:'open'},o.pose||{}));
  const left=56-FAX,top=GY-28+(o.dy||0);
  // behind-layer variants
  drawVariants(c,R2,left,top,vs.filter(v=>v==='aura'||v==='plush'||v==='shaggy'||v==='raft'));
  blitTo(c,R2,left,top,tint);
  drawVariants(c,R2,left,top,vs.filter(v=>!['aura','plush','shaggy','raft'].includes(v)));
  if(vs.includes('mange')){for(let i=0;i<10;i++){const x=Math.floor(hash(i,11)*30)+5,y=Math.floor(hash(i,5)*18)+8;if(R2.img[y*R2.W+x]&&R2.img[y*R2.W+x]!=='o'){c.fillStyle='#d99a9a';c.fillRect(left+x,top+y,2,1);}}}
  finishArt(cv2,o);
}

function finishArt(cv2,o){
  const d=cv2.getContext('2d');d.imageSmoothingEnabled=false;d.clearRect(0,0,cv2.width,cv2.height);
  if(o.noWombat||o.wide)d.drawImage(ART_OFF,0,0,SW,SH,0,0,cv2.width,cv2.height);
  else d.drawImage(ART_OFF,28,26,56,36,0,0,cv2.width,cv2.height);
}

// 四角いフンの形をしたロケット（窓からウォンバットがのぞく）
function drawRocket(c,r){
  const P=(x,y,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),1,1);};
  const box=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h);};
  const cx=r.x||56,by=r.y==null?GY:r.y,sc=r.small?0.5:1;
  if(r.state==='boom'){const R2=rng(3);for(let i=0;i<70;i++){const a=R2()*6.28,d=R2()*20;P(cx+Math.cos(a)*d,by-24+Math.sin(a)*d*.8,['#ffd25a','#ff8a3a','#e8452a','#5a4a40','#8a7a70'][Math.floor(R2()*5)]);}
    for(let i=0;i<8;i++)box(cx-10+i*3,by-6-(i%3)*3,2,2,'#6a4d36');return;}
  const w=Math.round(14*sc),h=Math.round(22*sc),x0=cx-Math.floor(w/2),y0=by-h-(r.state==='launch'?14:0)-(r.small?0:2);
  // flame
  if(r.state==='launch'||r.state==='space'){const fl=r.state==='space'?6:16;for(let k=0;k<fl;k++){const ww=Math.max(1,Math.round((w-4)*(1-k/fl)));box(cx-Math.floor(ww/2),y0+h+k,ww,1,k<3?'#fff6c8':k<7?'#ffd25a':'#ff8a3a');}
    if(r.state==='launch'){const R2=rng(7);for(let i=0;i<40;i++){P(cx+(R2()-.5)*44,by-1-R2()*6,R2()<.5?'#e8e2d8':'#c8c0b4');}}}
  // fins
  for(const sx of [-1,1]){for(let k=0;k<Math.round(6*sc);k++){box(sx<0?x0-1-Math.floor(k/2):x0+w+Math.floor(k/2)-0,y0+h-Math.round(6*sc)+k,1,1,'#3a2a22');}}
  // body (square poop)
  box(x0-1,y0-1,w+2,h+2,'#2a1a12');box(x0,y0,w,h,'#7a5838');box(x0,y0,w,Math.round(3*sc),'#a17a53');box(x0,y0,1,h,'#a17a53');
  for(let y=y0+4;y<y0+h;y+=5)box(x0+1,y,w-2,1,'#6a4a30');
  // nose cone
  const cn=Math.round(6*sc);for(let k=0;k<cn;k++){const ww=Math.max(1,Math.round(w*(k+1)/cn));box(cx-Math.floor(ww/2),y0-cn+k,ww,1,k===0?'#2a1a12':'#c99a5b');}
  // window with wombat
  const wx=cx,wy=y0+Math.round(8*sc),wr=Math.max(2,Math.round(4*sc));
  for(let y=-wr;y<=wr;y++)for(let x=-wr;x<=wr;x++){const d=x*x+y*y;if(d<=wr*wr+1)P(wx+x,wy+y,d>(wr-1)*(wr-1)+1?'#d8e4ec':'#86613f');}
  if(!r.small){P(wx-2,wy-1,'#0d0806');P(wx+1,wy-1,'#0d0806');P(wx-1,wy+1,'#3f3230');P(wx,wy+1,'#3f3230');P(wx-3,wy-4,'#a17a53');P(wx+3,wy-4,'#a17a53');}
}

const SND={on:(()=>{try{return localStorage.getItem('kamiwombat_snd')!=='0';}catch(e){return true;}})(),a:null};
function tone(f0,f1,dur,type,vol,delay){const a=SND.a,t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.06,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);}
function snd(k){if(!SND.on)return;try{if(!SND.a)SND.a=new (window.AudioContext||window.webkitAudioContext)();if(SND.a.state==='suspended')SND.a.resume();
  if(k==='tap')tone(480+Math.random()*160,240,.12,'sine',.05);
  else if(k==='buy'){tone(523,0,.18,'triangle',.06);tone(659,0,.18,'triangle',.06,.09);tone(784,0,.3,'triangle',.06,.18);}
  else if(k==='card')tone(392,523,.25,'sine',.04);
  else if(k==='good'){[523,659,784,1047].forEach((f,i)=>tone(f,0,.25,'triangle',.05,i*.08));}
  else if(k==='bad'){tone(220,110,.5,'triangle',.06);tone(233,116,.5,'sine',.03,.05);}
  else if(k==='gold'){[784,988,1175,1568].forEach((f,i)=>tone(f,0,.18,'square',.025,i*.06));}
}catch(e){}}
function setSnd(on){SND.on=on;try{localStorage.setItem('kamiwombat_snd',on?'1':'0');}catch(e){}$('snd').textContent=on?'♪ ON':'♪ OFF';$('snd').classList.toggle('off',!on);if(on)snd('tap');}

function needOwned(h){return Object.keys(h.need).filter(k=>S.owned[k]).sort((a,b)=>pv(S,b)-pv(S,a));}
function buildCard(q){
  if(q.type==='intro')return {mk:'はじまり',title:'神に愛されたヒメウォンバット',art:{bg:'meadow',pose:{eye:'half'}},
    body:'<p>タスマニアの草原で、一頭のヒメウォンバットが、草を食みながら空を見上げた。</p><p>祈っている……のかもしれない。</p><p>あなたは、その祈りを聞いた。ウォンバットの神として奇跡のアニマルパワーを授け、彼らの繁栄を見守ろう。授けた形質は、はじめは一部の子が持つだけ。世代を重ね、生き残った子たちを通して群れに広がっていく。</p><p class="hint">ウォンバットをなでると祈り（ウォン）が集まります。1秒で1年が過ぎます。</p>',btn:'祈りに応える'};
  if(q.type==='trait'){const t=TR[q.id];return {mk:'奇跡',title:t.name,art:{bg:t.v==='swim'?'coast':t.v==='raft'?'ocean':HAB[view].bg,v:vOf([t.id]),crowd:t.v==='swim'||t.v==='raft'?0:4},
    body:`<div class="src">元ネタ：${t.src}</div><p class="eff">${t.eff}</p><p class="flavor">${t.flavor}</p><p>${t.trivia}</p><p class="hint">この形質を持つのは、まだ群れの${Math.round(P0*100)}%だけ。世代を重ねて広がっていく。</p>`};}
  if(q.type==='colonize'){const h=HAB[q.id];return {mk:'進出',title:h.name+'へ',art:{bg:h.bg,v:vOf(needOwned(h).slice(0,2)),crowd:2},
    body:`<p>${COL_TEXT[h.id]}</p><p class="hint">いまの適合度 ${pct(suit(S,h))}。関係する形質が群れに広がるほど、住める数が増えていく。</p>`};}
  if(q.type==='adapt'){const h=HAB[q.id];const extra=(h.id==='deep'||h.id==='mars')?['eyes']:[];return {mk:'適応',title:h.name+'に適応した',art:{bg:h.bg,v:vOf(Object.keys(h.need)).concat(extra),crowd:10},
    body:`<p>${ADAPT_TEXT[h.id]}</p><p class="hint">${h.name}の上限が30%増えた。</p>`};}
  if(q.type==='drift_ok'){const h=HAB[q.id];return {mk:'漂流',title:h.name+'に流れ着いた',art:{bg:'ocean',v:['raft','swim']},
    body:`<p>嵐の夜、海辺の巣穴ごと沖へ流された一群がいた。彼らは泳ぎ、流木にしがみつき、何日も耐えた。</p><p>そしてある朝、${h.name}の浜に、ずぶぬれのウォンバットが打ち上げられた。</p>${DRIFT_NOTE[h.id]||''}<p class="hint">いまの適合度 ${pct(suit(S,h))}。関係する形質が群れに広がるほど、住める数が増えていく。</p>`};}
  if(q.type==='drift_lost')return {mk:'漂流',title:'戻らなかった者たち',bad:true,art:{bg:'ocean',noWombat:true,wide:true},
    body:'<p>嵐の夜、海辺のウォンバットたちが巣穴ごと沖へ流された。誰も、どこにも、たどり着かなかった。</p><p class="hint">何日も泳ぎ続ける力や、流木にしがみついて耐える力が群れに広がれば、いつか誰かが海の向こうにたどり着くかもしれない。</p>'};
  if(q.type==='drift_noroot'){const h=HAB[q.id];return {mk:'漂流',title:'根付かなかった者たち',bad:true,art:{bg:h.bg,pose:{eye:'closed'}},
    body:`<p>流された数頭が、${h.name}の浜にたどり着いた。けれど彼らは、その土地で生きる術を持たなかった。</p><p class="hint">${h.name}の適合度が20%に届いていない。その土地に合う形質を授けよう。</p>`};}
  if(q.type==='rk_start')return {mk:'計画',title:'ロケット開発のはじまり',art:{bg:'steppe',wide:true,rocket:{x:86,state:'build'},crowd:5},
    body:'<p>好奇心が群れの半数に広がった夜、何頭かのウォンバットが、四角いフンを積み上げて空を指した。やがてそれは、本物のロケットの設計図になった。</p><p class="hint">開発は年ごとに進みます。「奇跡」タブの計画欄から祈りを捧げると早められます。地球と火星の位置関係で、火星へ向かうのに適した打ち上げの時期は、約26か月ごとにしか巡ってきません。</p>'};
  if(q.type==='rk_fail')return {mk:'計画',title:'打ち上げ失敗',bad:true,art:{bg:'steppe',noWombat:true,wide:true,rocket:{state:'boom'}},
    body:'<p>轟音、そして閃光。ロケットは空へ届く前に砕け散った。乗っていたウォンバットたちは、脱出用の巣穴で無事だった。</p><p class="hint">新しく作られたロケットの初打ち上げは、現実でもおよそ半分が失敗しています。2回目、3回目と重ねるほど成功しやすくなります。</p>'};
  if(q.type==='rk_launch')return {mk:'計画',title:'打ち上げ成功',art:{bg:'steppe',noWombat:true,wide:true,rocket:{state:'launch'}},
    body:`<p>${q.n}度目の挑戦。四角いフンの形をした船体が、轟音とともに空へ昇っていった。小さな窓から、ウォンバットが遠ざかる草原を見下ろしている。</p><p class="hint">火星までは、およそ7か月の旅になります。</p>`};
  if(q.type==='mars_arrive')return {mk:'到着',title:'火星へ',art:{bg:'mars',wide:true,rocket:{x:88,state:'land'},pose:{eye:'half'}},
    body:`<p>${COL_TEXT.mars}</p><p class="hint">いまの適合度 ${pct(suit(S,HAB.mars))}。乾きや放射線に耐える形質が群れに広がるほど、住める数が増えていきます。</p>`};
  if(q.type==='mars_noroot')return {mk:'到着',title:'赤い砂の上で',bad:true,art:{bg:'mars',wide:true,rocket:{x:88,state:'land'},pose:{eye:'closed'}},
    body:'<p>船は火星に降りた。けれど、薄い空気と乾きと放射線の中で、ウォンバットたちは目を覚まさなかった。</p><p class="hint">火星の適合度が20%に届いていません。干からびても戻る力や、放射線に耐える力を授けましょう。船は次の打ち上げの窓で、また飛び立ちます。</p>'};
  if(q.type==='sp_start')return {mk:'計画',title:'恒星間計画のはじまり',art:{bg:'mars',wide:true,rocket:{x:88,state:'build'},crowd:4},
    body:'<p>眠ると四角く固まる子が群れに広がると、火星の群れは、もっと遠くへ行く船を作りはじめた。</p><p class="hint">隣の恒星までは、いまの探査機の速さでは何万年もかかります。だから、芽胞のまま眠って行くのです。開発は「奇跡」タブの計画欄から祈りを捧げると早められます。</p>'};
  if(q.type==='sp_fail')return {mk:'計画',title:'恒星間船の打ち上げ失敗',bad:true,art:{bg:'mars',noWombat:true,wide:true,rocket:{state:'boom'}},
    body:'<p>恒星間船は、火星の薄い空で砕けた。積み込まれていた芽胞は、赤い砂の上に降りそそいだ。眠ったままなので、たぶん無事だ。</p>'};
  if(q.type==='sp_launch')return {mk:'計画',title:'星々へ',art:{bg:'space',noWombat:true,wide:true,rocket:{state:'space'}},
    body:'<p>芽胞となって眠るウォンバットを満載した船が、火星の空から旅立った。目覚めるのは、ずっと先のことだ。</p>'};
  if(q.type==='heliopause')return {mk:'航行',title:'太陽圏の外へ',art:{bg:'space',noWombat:true,wide:true,rocket:{x:84,y:30,state:'space',small:true}},
    body:'<p>旅立ちから20年。船は、太陽から吹き出す風が届く境界を越え、星と星のあいだの空間へ出た。</p><p class="hint">現実には、1977年に打ち上げられた探査機ボイジャー1号が、35年後の2012年に初めて太陽圏の外へ出ました。ある恒星に1.6光年まで近づくのは、約4万年後とされています。</p>'};
  if(q.type==='mange')return {mk:'災い',title:'疥癬の流行',bad:true,art:{bg:'meadow',v:['mange'],pose:{eye:'closed'}},
    body:'<p>タスマニア中部で疥癬が流行した。ダニがもたらす皮膚病で、毛が抜け、多くのウォンバットが倒れた。</p><p class="hint">実際に、この病気である地域の個体群が8割以上減った例がある。病気に強い形質が広まれば、流行は起きにくくなる。</p>'};
  if(q.type==='drought')return {mk:'災い',title:'大干ばつ',bad:true,art:{bg:'desert',cracks:true,pose:{eye:'closed',br:-.6}},
    body:'<p>オーストラリアを干ばつが襲い、本土の群れが大きく数を減らした。</p>'+(S.owned.kangaroo?'<p class="hint">袋の奥で待つ胚が、群れの回復を早めるだろう。</p>':'<p class="hint">干ばつのあとに数をすばやく戻せる仕組みがあれば……。</p>')};
  if(q.type==='ending')return {mk:'エンディング',title:'深宇宙へ',art:{bg:'space',spores:28,noWombat:true},
    body:`<p>知性と好奇心と、芽胞の眠りを授かったウォンバットたちは、四角い芽胞となって、星々の海へ散っていった。</p><p>どこかの惑星に落ちたひと粒が、いつか目を覚まし、草を探すだろう。そして空を見上げ、祈るのだろう。</p><p class="score">祈りの年 ${q.year}年で星々へ</p><table class="sum"><tr><td>最終生息数</td><td>${fmt(q.pop)}頭</td></tr><tr><td>授けた奇跡</td><td>${TRAITS.filter(t=>S.owned[t.id]).length} / ${TRAITS.length}</td></tr><tr><td>住んだ土地</td><td>${HABITATS.filter(h=>S.col[h.id]).length} / ${HABITATS.length}</td></tr><tr><td>なでた回数</td><td>${fmt(S.taps)}回</td></tr><tr><td>集めた祈り</td><td>${fmt(S.totalWon)}ウォン</td></tr></table><p class="hint">「図鑑モード」では、ウォンバットたちが暮らした土地を眺めたり、図鑑や年代記を読み返したりできます。</p>`,btn:'図鑑モードで見る'};
}
let cardOpen=false;
function pushCard(q){S.queue.push(q);}
function showNextCard(){
  if(cardOpen||!S.queue.length)return;
  const q=S.queue[0],c=buildCard(q);cardOpen=true;
  $('card-mk').textContent=c.mk;$('card-title').textContent=c.title;$('card-body').innerHTML=c.body;
  $('card').classList.toggle('bad',!!c.bad);
  cardArt($('card-art'),c.art);
  $('card-btn').textContent=c.btn||'確認した';
  const btn=$('card-btn');btn.disabled=true;setTimeout(()=>{btn.disabled=false;},650);
  $('card-restart').style.display=q.type==='ending'?'block':'none';
  $('modal').classList.remove('on');void $('modal').offsetWidth;$('modal').classList.add('on');$('modal').scrollTop=0;
  snd(c.bad?'bad':(q.type==='adapt'||q.type==='drift_ok'||q.type==='colonize'||q.type==='ending')?'good':q.type==='trait'?'buy':'card');
  $('card-btn').onclick=()=>{if($('card-btn').disabled)return;const wasEnd=S.queue[0]&&S.queue[0].type==='ending';S.queue.shift();if(wasEnd)setTimeout(enterDexMode,0);$('modal').classList.remove('on');cardOpen=false;save();renderPanels();setTimeout(showNextCard,120);};
}
const paused=()=>cardOpen||S.queue.length>0;

// ---------- events from simulation ----------
function onEvent(k,a){
  if(k==='colonize'){addLog(COL_TEXT[a.id],'story');pushCard({type:'colonize',id:a.id});view=a.id;rebuildCrowd();renderChips();}
  else if(k==='drift_ok'){addLog(a.name+'の浜に、ずぶぬれのウォンバットが流れ着いた。','story');pushCard({type:'drift_ok',id:a.id});view=a.id;rebuildCrowd();renderChips();}
  else if(k==='drift_lost'){S.events.lost=(S.events.lost||0)+1;if(S.events.lost===1)pushCard({type:'drift_lost'});if(S.events.lost<=3||S.events.lost%5===0)addLog('嵐の夜、沖へ流されたウォンバットたちがいた。誰も戻らなかった。','bad');}
  else if(k==='drift_noroot'){S.events.noroot=(S.events.noroot||0)+1;if(S.events.noroot===1)pushCard({type:'drift_noroot',id:a.id});if(S.events.noroot<=3||S.events.noroot%5===0)addLog(a.name+'に流れ着いた数頭は、根付けなかった。','bad');}
  else if(k==='adapt'){addLog(ADAPT_TEXT[a.id],'story');pushCard({type:'adapt',id:a.id});}
  else if(k==='mange'){S.events.mange=(S.events.mange||0)+1;if(S.events.mange===1)pushCard({type:'mange'});addLog('タスマニアで疥癬が流行し、多くのウォンバットが倒れた。','bad');}
  else if(k==='drought'){S.events.drought=(S.events.drought||0)+1;if(S.events.drought===1)pushCard({type:'drought'});
    if(S.events.drought<=3||S.events.drought%10===0)addLog(a.resist?'干ばつ。だが袋の奥の胚が待っていた。群れはすぐに数を取り戻すだろう。':'オーストラリアを干ばつが襲い、本土の群れが大きく減った。','bad');}
  else if(k==='rk_start'){addLog('好奇心に駆られた群れが、ロケットを作りはじめた。','story');pushCard({type:'rk_start'});}
  else if(k==='rk_ready'){addLog('ロケットが完成した。次の打ち上げの窓を待つ。','story');}
  else if(k==='rk_fail'){S.events.rkf=(S.events.rkf||0)+1;if(S.events.rkf===1)pushCard({type:'rk_fail'});addLog(`${a.n}度目の打ち上げは失敗した。作り直しだ。`,'bad');}
  else if(k==='rk_launch'){addLog(`${a.n}度目の打ち上げで、ロケットは空へ昇った。火星まで、約7か月。`,'story');pushCard({type:'rk_launch',n:a.n});}
  else if(k==='mars_arrive'){addLog(COL_TEXT.mars,'story');pushCard({type:'mars_arrive'});view='mars';rebuildCrowd();renderChips();}
  else if(k==='mars_noroot'){S.events.mnr=(S.events.mnr||0)+1;if(S.events.mnr===1)pushCard({type:'mars_noroot'});addLog('火星に降りたウォンバットたちは、目を覚まさなかった。','bad');}
  else if(k==='sp_start'){addLog('火星の群れが、恒星間船を作りはじめた。','story');pushCard({type:'sp_start'});}
  else if(k==='sp_fail'){S.events.spf=(S.events.spf||0)+1;if(S.events.spf===1)pushCard({type:'sp_fail'});addLog('恒星間船の打ち上げは失敗した。','bad');}
  else if(k==='sp_launch'){addLog('芽胞を満載した恒星間船が、星々へ旅立った。','story');pushCard({type:'sp_launch'});}
  else if(k==='heliopause'){addLog('恒星間船が、太陽圏の外へ出た。','story');pushCard({type:'heliopause'});}
  else if(k==='ending'){addLog(`祈りの年${S.year}、ウォンバットは深宇宙へ旅立った。`,'story');pushCard({type:'ending',year:S.year,pop:totalPop(S)});}
}

// ---------- goal guidance ----------
function nextWin(){for(let k=1;k<5;k++){const y=S.year+k;if(Math.floor(y*12/26)!==Math.floor((y-1)*12/26))return k;}return 3;}
function goalText(){
  if(S.done)return '図鑑モード：土地を選んで、ウォンバットたちの暮らしを眺められます。';
  if(!Object.keys(S.owned).length)return 'ウォンバットをなでて祈りを集め、最初の奇跡を授けよう。';
  const front=HABITATS.filter(h=>!S.col[h.id]&&!h.space&&(!h.prev||S.col[h.prev]));
  prog(S);const rk=S.rk,sp=S.sp;
  if(sp.phase==='out')return `深宇宙へ：芽胞 ${pct(pv(S,'spore'))}・知性 ${pct(pv(S,'human'))}・放射線耐性 ${pct(pv(S,'deinococcus'))} を群れに広げる（90%）`;
  if(sp.phase==='cruise')return `恒星間船、航行中（太陽圏の外まで あと${20-sp.t}年）`;
  if(sp.phase==='ready')return '恒星間船が完成した。まもなく打ち上げ';
  if(sp.phase==='dev')return `恒星間船を開発中 ${pct(sp.p)}（祈りを捧げると早まる）`;
  if(S.col.mars)return S.owned.spore?`芽胞を群れの半数に広げて恒星間計画を始める（今 ${pct(pv(S,'spore'))}）`:'次の目標：深宇宙へ　芽胞の奇跡を授けよう';
  if(rk.phase==='cruise')return 'ロケット、火星へ航行中';
  if(rk.phase==='ready'){const w=nextWin();return `ロケット完成。次の打ち上げの窓まで あと${w}年`;}
  if(rk.phase==='dev')return `ロケットを開発中 ${pct(rk.p)}（祈りを捧げると早まる）`;
  if(S.owned.curiosity)return `好奇心を群れの半数に広げてロケット作りを始める（今 ${pct(pv(S,'curiosity'))}）`;
  if(front.length){front.sort((a,b)=>suit(S,b)-suit(S,a));const h=front.find(x=>!x.gate||pv(S,x.gate)>=.5)||front[0];
    if(h.sea)return `次の目標：${h.name}へ（海の向こう）　漂流で生き残る力 ${pct(driftSurv(S))}・適合度 ${pct(suit(S,h))}`;
    if(h.gate&&pv(S,h.gate)<.5)return `次の目標：${h.name}へ　まず「${TR[h.gate].name}」を群れの半数に広げる`;
    return `次の目標：${h.name}へ　適合度 ${pct(suit(S,h))} / 20%`;}
  const ad=HABITATS.find(h=>S.col[h.id]&&!S.adapted[h.id]);
  if(ad)return `次の目標：${ad.name}への適応　関係する形質をすべて群れに広げる`;
  return '群れは繁栄している。';
}
// ---------- UI ----------
let tab='miracle';
function setTab(t){if(S.done&&(t==='miracle'||t==='bless'))t='dex';tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));renderPanels();}
function renderPanels(){({miracle:renderMiracles,bless:renderBlessings,hab:renderHabitats,dex:renderDex,log:renderLog})[tab]();updateButtons();}
const bar=(p,cls)=>`<div class="bar ${cls||''}"><i style="width:${Math.min(100,p*100).toFixed(1)}%"></i></div>`;
function traitHabs(id){return HABITATS.filter(h=>h.need[id]).map(h=>h.name).join('・');}
function renderMiracles(){
  const el=$('p-miracle');let h='';
  prog(S);const st0=stats(S);
  const progBox=(which,label)=>{const P=S[which];if(P.phase==='none'||P.phase==='done'||P.phase==='out')return '';
    let inner='';const ic=investCost(S,st0);
    if(P.phase==='dev')inner=`<div class="row"><span>開発度</span><span class="p">${pct(P.p)}</span></div>${bar(P.p,'g')}<button class="item invest" data-inv="${which}"><div class="row"><b>祈りを捧げる</b><span class="cost">${fmt(ic)} ウォン</span></div><div class="eff">開発を6%進める</div></button>`;
    else if(P.phase==='ready')inner=which==='rk'?`<div class="eff">完成。次の打ち上げの窓まで あと${nextWin()}年（約26か月ごと）</div>`:'<div class="eff">完成。まもなく打ち上げ</div>';
    else if(P.phase==='cruise')inner=which==='rk'?'<div class="eff">火星へ航行中（約7か月）</div>':`<div class="eff">航行中。太陽圏の外まで あと${20-P.t}年</div>`;
    return `<div class="prog"><h3>${label}</h3>${inner}</div>`;};
  h+=progBox('rk','ロケット計画（火星）')+progBox('sp','恒星間計画（深宇宙）');
  const avail=TRAITS.filter(t=>traitAvailable(S,t)).sort((a,b)=>a.cost-b.cost);
  if(!avail.length)h+='<p class="hint">いまは授けられる奇跡がありません。</p>';
  for(const t of avail){const hb=traitHabs(t.id);
    h+=`<button class="item" data-buy="${t.id}"><div class="row"><b>${t.name}</b><span class="cost">${fmt(t.cost)} ウォン</span></div><div class="src">元ネタ：${t.src}</div><div class="eff">${t.eff}</div>${hb?`<span class="tag">適合：${hb}</span>`:''}</button>`;}
  const owned=TRAITS.filter(t=>S.owned[t.id]);
  if(owned.length){h+=`<h3>授けた形質（群れでの保有率）</h3>`;
    for(const t of owned)h+=`<div class="own"><div class="row"><span>${t.name}<small>（${t.src}）</small></span><span class="p">${pct(pv(S,t.id))}</span></div>${bar(pv(S,t.id),'g')}</div>`;}
  el.innerHTML=h;el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>doBuyTrait(b.dataset.buy));
  el.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{if(invest(S,b.dataset.inv)){snd('buy');renderMiracles();updateHeader();save();}});
}
function renderBlessings(){
  const el=$('p-bless');let h='';
  for(const b of BLESSINGS){const lv=blLevel(S,b,view);
    h+=`<button class="item" data-bl="${b.id}"><div class="row"><b>${b.name} <small>Lv.${lv}${b.perHab?'（'+HAB[view].name+'）':''}</small></b><span class="cost">${fmt(blCost(b,lv))} ウォン</span></div><div class="eff">${b.desc}</div></button>`;}
  h+='<p class="hint">草の恵みは、いま表示している生息地にだけ効きます。表示は「生息地」タブで切り替えられます。</p>';
  el.innerHTML=h;el.querySelectorAll('[data-bl]').forEach(b=>b.onclick=()=>{if(buyBlessing(S,b.dataset.bl,view)){renderBlessings();updateHeader();save();}});
}
function renderHabitats(){
  const el=$('p-hab');const st=stats(S);let h='';let shownLocked=false;
  for(const hb of HABITATS){
    const known=S.col[hb.id]||(hb.prev&&S.col[hb.prev]);
    if(!known){if(!shownLocked){h+=`<div class="item locked"><b>？？？</b><div class="eff">まだ誰も知らない土地</div></div>`;shownLocked=true;}continue;}
    const s=suit(S,hb);
    const needs=Object.keys(hb.need).map(k=>`<div class="need"><span>${S.owned[k]?TR[k].src:'？？？'}</span>${bar(pv(S,k),'g')}</div>`).join('');
    if(S.col[hb.id]){const N=S.pop[hb.id]||0,K=capOf(S,hb.id,st);
      h+=`<button class="item ${view===hb.id?'sel':''}" data-view="${hb.id}"><div class="row"><b>${hb.name}${view===hb.id?' <small>表示中</small>':''}</b><span class="cost">${fmt(N)} 頭</span></div>${bar(N/Math.max(1,K))}<div class="eff">${S.adapted[hb.id]?'<span class="ok">適応済み</span>':'進出中'} ／ 適合度 ${pct(s)} ／ 上限 ${fmt(K)} 頭 ／ 面積のめやす 約${fmt(hb.area)} km²</div>${needs}</button>`;}
    else h+=`<div class="item pending"><div class="row"><b>${hb.name}</b><span class="cost">未進出${hb.sea?'・海の向こう':''}</span></div><div class="eff">${hb.space?'ロケットで渡る。ヒトの知性と好奇心が群れに広がると、ロケット作りが始まる。<br>適合度 '+pct(s):hb.sea?`嵐で流された群れが生きてたどり着き、適合度が20%以上あれば住みつく。<br>漂流で生き残る力 ${pct(driftSurv(S))} ／ 適合度 ${pct(s)}`:`適合度 ${pct(s)}（20%で数頭が歩いて渡りはじめる${hb.gate?'。ヒトの知性が群れの半数に広がることも必要':''}）`}</div>${needs}</div>`;
  }
  h+=`<div class="statbox">一度に産む子 ${st.litter.toFixed(1)}頭 ／ 出産間隔 ${st.interval.toFixed(2)}年 ／ 成熟 ${st.maturity<1?Math.round(st.maturity*365)+'日':st.maturity.toFixed(2)+'年'}<br>世代の長さ 約${st.T.toFixed(1)}年 ／ 年あたり増加率 ${(st.r*100).toFixed(1)}%</div>`;
  el.innerHTML=h;el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;rebuildCrowd();renderHabitats();renderChips();});
}
function renderDex(){
  const el=$('p-dex');const n=TRAITS.filter(t=>S.owned[t.id]).length;let h=`<p class="hint">奇跡形質図鑑 ${n} / ${TRAITS.length}</p>`;
  for(const t of TRAITS){
    if(S.owned[t.id])h+=`<details class="dex"><summary><b>${t.name}</b> <span class="src">${t.src}</span></summary><p>${t.trivia}</p><p class="flavor">${t.flavor}</p></details>`;
    else h+=`<div class="dex locked">？？？</div>`;}
  el.innerHTML=h;
}
function renderLog(){
  const el=$('p-log');
  let h=S.log.slice(0,80).map(l=>`<div class="log ${l.k}"><span class="yr">${l.y}年</span>${l.t}</div>`).join('');
  h+=`<button class="reset" id="reset">最初からやり直す</button>`;
  el.innerHTML=h;$('reset').onclick=()=>{if(confirmReset())restartGame();};
}
let resetArm=0;function confirmReset(){const now=Date.now();if(now-resetArm<3000)return true;resetArm=now;$('reset').textContent='もう一度押すとリセット';return false;}
let dispWon=null,dispPop=null;
function updateHeader(){const st=stats(S);$('yr').textContent=S.year;if(dispWon===null){dispWon=S.won;dispPop=totalPop(S);}
  const w=wonPerYear(S,st);$('wps').textContent=w<10?w.toFixed(1):fmt(w);$('paused').style.display=paused()?'inline':'none';}
function renderChips(){
  const el=$('chips');let h=S.done?`<button class="${view==='space'?'on':''}" data-chip="space">旅立ち（深宇宙）</button>`:'';for(const hb of HABITATS)if(S.col[hb.id])h+=`<button class="${view===hb.id?'on':''}" data-chip="${hb.id}">${hb.name}</button>`;
  el.innerHTML=h;el.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{view=b.dataset.chip;rebuildCrowd();setState('idle');renderChips();if(tab==='bless'||tab==='hab')renderPanels();});
  const on=el.querySelector('.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
}
let seenLog=0,seenDex=0;
function updateBadges(){
  const afford=TRAITS.some(t=>traitAvailable(S,t)&&S.won>=t.cost);
  document.querySelector('[data-t="miracle"]').classList.toggle('dot',afford&&tab!=='miracle');
  const affordBl=BLESSINGS.some(b=>S.won>=blCost(b,blLevel(S,b,view)));
  document.querySelector('[data-t="bless"]').classList.toggle('dot',affordBl&&tab!=='bless');
  if(tab==='log')seenLog=S.log.length?S.log[0].y+':'+S.log[0].t:0;
  document.querySelector('[data-t="log"]').classList.toggle('dot',tab!=='log'&&S.log.length&&(S.log[0].y+':'+S.log[0].t)!==seenLog);
  const nd=TRAITS.filter(t=>S.owned[t.id]).length;if(tab==='dex')seenDex=nd;
  document.querySelector('[data-t="dex"]').classList.toggle('dot',tab!=='dex'&&nd>seenDex);
  $('goal').textContent=goalText();
}
function updateButtons(){
  document.querySelectorAll('[data-buy]').forEach(b=>{const ok=S.won>=TR[b.dataset.buy].cost;b.disabled=!ok;b.classList.toggle('ready',ok);});
  document.querySelectorAll('[data-inv]').forEach(b=>{b.disabled=S.won<investCost(S,stats(S));});
  document.querySelectorAll('[data-bl]').forEach(b=>{const bl=BLESSINGS.find(x=>x.id===b.dataset.bl);b.disabled=S.won<blCost(bl,blLevel(S,bl,view));});
}
function doBuyTrait(id){if(!buyTrait(S,id))return;addLog(TR[id].flavor,'miracle');pushCard({type:'trait',id});renderPanels();updateHeader();save();showNextCard();}

// ---------- ending: dex mode / restart ----------
function updateDoneUI(){document.body.classList.toggle('done',!!S.done);}
function enterDexMode(){view='space';rebuildCrowd();setState('idle');updateDoneUI();setTab('dex');renderChips();updateBadges();}
function restartGame(){S=newState();view='tas';dispWon=null;rebuildCrowd();$('modal').classList.remove('on');cardOpen=false;updateDoneUI();pushCard({type:'intro'});addLog('タスマニアの草原で、一頭のヒメウォンバットが草を食みながら空を見上げた。','story');setTab('miracle');renderChips();updateHeader();save();setTimeout(showNextCard,150);}
// ---------- tap / pray ----------
function floatText(e,txt,cls){const f=document.createElement('div');f.className='float '+(cls||'');f.textContent=txt;
  const wr=$('stage').getBoundingClientRect();f.style.left=(e.clientX-wr.left)+'px';f.style.top=(e.clientY-wr.top-10)+'px';$('stage').appendChild(f);setTimeout(()=>f.remove(),1200);}
const GOLD_LINES=['空から、金色に輝く四角いフンが降ってきた。','黄金のフン。神の御業か、ただの光の加減か。','草むらで、四角いものが金色に光っている。拾うと、祈りが満ちた。'];
function tap(e){
  if(paused())return;
  if(S.done){if(view!=='space'){if(W.state!=='pet')setState('pet');else W.t=Math.min(W.t,.3);snd('tap');}return;}
  const r=cv.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width*SW,ly=(e.clientY-r.top)/r.height*SH;
  if(gold&&Math.abs(lx-gold.x)<8&&Math.abs(ly-gold.y+3)<9){const st=stats(S);const v=Math.max(80,wonPerYear(S,st)*6+tapValue(S,st)*20);S.won+=v;S.totalWon+=v;gold=null;
    for(let i=0;i<14;i++)addP({k:'spark',x:lx+(R()-.5)*10,y:ly+(R()-.5)*8,vx:(R()-.5)*20,vy:-10-R()*10,life:.8});
    floatText(e,'黄金のフン！ +'+fmt(v),'gold');snd('gold');S.events.gold=(S.events.gold||0)+1;if(S.events.gold<=3||S.events.gold%5===0)addLog(GOLD_LINES[Math.floor(R()*GOLD_LINES.length)],'miracle');updateHeader();updateButtons();return;}
  const st=stats(S);const v=tapValue(S,st);snd('tap');S.won+=v;S.totalWon+=v;S.taps++;
  if(W.state!=='pet')setState('pet');else W.t=Math.min(W.t,.3);
  floatText(e,'+'+fmt(v));updateHeader();updateButtons();
}
cv.addEventListener('pointerdown',tap);

// ---------- main loop ----------
let acc=0,last=performance.now(),uiAcc=0;
function yearTick(){
  const before=totalPop(S);const pb={...S.prev};
  stepYear(S,R,onEvent);
  for(const id in S.prev){const t=TR[id];if(pb[id]<.5&&S.prev[id]>=.5)addLog(`「${t.name}」の子が、群れの半数を超えた。`,'miracle');else if(pb[id]<.95&&S.prev[id]>=.95)addLog(`「${t.name}」は、ほぼすべてのウォンバットに受け継がれた。`,'miracle');}
  const after=totalPop(S);
  for(const [m,t] of POP_MILESTONES)if(before<m&&after>=m)addLog(t,'story');
  if(S.year%5===0)save();
  updateHeader();
  if(tab==='hab'||tab==='miracle')renderPanels();
  showNextCard();
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused()&&!S.done&&!document.hidden){acc+=dt;while(acc>=1&&!paused()){acc-=1;yearTick();}}else acc=0;
  updateScene(dt);draw();
  if(dispWon!==null){dispWon+=(S.won-dispWon)*Math.min(1,dt*8);if(Math.abs(S.won-dispWon)<1)dispWon=S.won;dispPop+=(totalPop(S)-dispPop)*Math.min(1,dt*5);$('won').textContent=fmt(dispWon);$('pop').textContent=fmt(dispPop);}
  uiAcc+=dt;if(uiAcc>.25){uiAcc=0;updateButtons();updateHeader();updateBadges();}
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();last=performance.now();});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

// boot
view=latestHab();rebuildCrowd();setState('idle');
if(S.year===0&&!S.log.length){addLog('タスマニアの草原で、一頭のヒメウォンバットが草を食みながら空を見上げた。','story');pushCard({type:'intro'});}
else if(S.log.length)$('msg').textContent=S.log[0].t;
setTab('miracle');updateHeader();renderChips();updateBadges();showNextCard();
$('snd').onclick=()=>setSnd(!SND.on);setSnd(SND.on);
$('card-restart').onclick=restartGame;$('goal-restart').onclick=restartGame;updateDoneUI();if(S.done&&!S.queue.length&&tab!=='dex'&&tab!=='log'){setTab('dex');}
requestAnimationFrame(loop);

</script>
</body>
</html>
