<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7fd3ff">
<title>つみきドカーン！</title>
<!-- OGP: tools/build.py が書き出します -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="作ってみたゲームの発表会（仮）">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="つみきドカーン！">
<meta property="og:description" content="ボールで積み木をたおす、こども向けの面クリアゲーム。上をタップしてボールを落とし、下ではパチンコを引っぱって発射する。ばくだんの連鎖や風船、ボールがふえる虹色の積み木など、いろいろな積み木が登場する。ステージごとのランキングつき。">
<meta property="og:url" content="https://naosugi.github.io/naosugi-ai-games/games/tsumiki-dokaan/">
<meta property="og:image" content="https://naosugi.github.io/naosugi-ai-games/games/tsumiki-dokaan/thumb.jpg">
<meta property="og:image:width" content="960">
<meta property="og:image:height" content="540">
<meta name="twitter:card" content="summary_large_image">
<!-- /OGP -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Rounded Mplus 1c","Noto Sans JP",system-ui,sans-serif;}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:7px 14px;font-weight:900;color:#3b3b72;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.13);white-space:nowrap}
#left{display:flex;gap:6px}
#remain{transition:transform .12s}
#remain.bump{transform:scale(1.25)}
.ib{pointer-events:auto;border:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);font-size:20px;font-weight:900;color:#3b3b72;box-shadow:0 3px 0 rgba(0,0,0,.13);touch-action:manipulation;font-family:inherit}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.13)}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;background:rgba(40,60,130,.45);touch-action:manipulation}
.overlay.show{display:flex}
.card{background:#fff;border-radius:30px;padding:26px 22px 22px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18);width:min(84vw,340px);animation:cardIn .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes cardIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
h1{margin:0 0 6px;font-size:40px;line-height:1.1;color:#ff5f7e;text-shadow:0 4px 0 #ffd0da;letter-spacing:1px}
h2{margin:0 0 10px;font-size:30px;color:#ff7a3d;text-shadow:0 3px 0 #ffe0c8}
.sub{color:#6a6a9a;font-weight:700;margin:6px 0 14px;font-size:15px}
.big{display:block;width:100%;border:none;border-radius:20px;padding:15px 0;margin-top:10px;font-size:22px;font-weight:900;color:#fff;background:#ff6b8b;box-shadow:0 6px 0 #d94a6c;font-family:inherit;touch-action:manipulation}
.big.blue{background:#4dabf7;box-shadow:0 6px 0 #2f86cf}
.big.gray{background:#b8bfd6;box-shadow:0 6px 0 #8e96b2;font-size:18px;padding:12px 0}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.stars{margin:4px 0 6px;height:64px}
.star{display:inline-block;font-size:56px;color:#e3e6f0;transform:scale(.6);transition:transform .2s}
.star.on{color:#ffc928;text-shadow:0 3px 0 #e09a00;animation:starPop .45s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.demo{display:flex;justify-content:center;gap:6px;margin:10px 0 4px;height:56px;align-items:flex-end}
.demo i{display:block;width:30px;height:30px;border-radius:8px;animation:hop 1s ease-in-out infinite}
.demo i:nth-child(2){animation-delay:.15s}.demo i:nth-child(3){animation-delay:.3s}.demo i:nth-child(4){animation-delay:.45s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px) rotate(12deg)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%);background:#fff;border-radius:20px;padding:10px 18px;font-weight:900;color:#3b3b72;box-shadow:0 5px 0 rgba(0,0,0,.15);z-index:6;pointer-events:none;text-align:center;opacity:0;white-space:nowrap}
#toast.show{animation:toast 3.6s ease forwards}
#toast b{display:block;color:#ff5f7e;font-size:14px}
#toast span{display:block;font-size:21px}
#toast em{display:block;font-style:normal;font-size:14px;color:#6a6a9a}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px) scale(.7)}8%{opacity:1;transform:translate(-50%,0) scale(1.08)}12%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0}}
#mid{display:flex;flex-direction:column;align-items:center;gap:4px}
#score{font-size:14px;padding:4px 12px;color:#e8590c}
.card{max-height:calc(100vh - 30px);overflow-y:auto}
.scoreNum{font-size:44px;font-weight:900;color:#ff7a3d;line-height:1.1;text-shadow:0 3px 0 #ffe0c8}
.scoreNum small{font-size:20px}
.bonus{font-size:14px;font-weight:800;color:#8a8ab0;min-height:18px}
.rankin{font-size:22px;font-weight:900;color:#ff4f8b;margin:10px 0 6px;animation:starPop .5s cubic-bezier(.3,1.8,.5,1)}
#chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
.chip{border:none;border-radius:999px;padding:7px 14px;font-family:inherit;font-weight:800;font-size:16px;background:#fff0c2;color:#7a5a00;box-shadow:0 3px 0 #e6c96a;touch-action:manipulation}
.nameRow{display:flex;gap:6px}
.nameRow input{flex:1;min-width:0;font-size:18px;font-weight:800;font-family:inherit;padding:10px 12px;border-radius:14px;border:3px solid #ffd0da;outline:none;-webkit-user-select:text;user-select:text;color:#3b3b72}
.nameRow button{border:none;border-radius:14px;padding:0 14px;font-family:inherit;font-weight:900;font-size:16px;color:#fff;background:#ff6b8b;box-shadow:0 4px 0 #d94a6c;touch-action:manipulation}
.rank{list-style:none;padding:0;margin:10px 0 4px;text-align:left}
.rank li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;font-weight:800;color:#3b3b72;font-size:16px}
.rank li:nth-child(odd){background:#f3f6ff}
.rank li.me{background:#fff3c4;animation:starPop .5s cubic-bezier(.3,1.8,.5,1)}
.rank .no{width:30px;text-align:center;font-size:18px}
.rank .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{color:#e8590c}
.rank .empty{justify-content:center;color:#9a9ac0;background:none}
.rankNav{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;color:#3b3b72;font-size:20px}
.rankNav button{border:none;width:44px;height:44px;border-radius:50%;background:#e7ecff;font-size:18px;color:#3b3b72;font-family:inherit;touch-action:manipulation}
.back{display:inline-block;margin-top:14px;color:#6a6a9a;font-weight:800;text-decoration:none;font-size:15px;padding:6px 10px;touch-action:manipulation}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0 6px}
.sbtn{border:none;border-radius:14px;padding:8px 0 5px;font-family:inherit;font-weight:900;font-size:19px;color:#fff;background:#69c35a;box-shadow:0 5px 0 #4a9a3e;touch-action:manipulation}
.sbtn small{display:block;font-size:9px;color:#fff6c2;letter-spacing:0;min-height:12px}
.sbtn:disabled{background:#cfd4e3;box-shadow:0 5px 0 #aab0c4;color:#fff}
.sbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #4a9a3e}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="left"><div class="pill" id="stage">ステージ 1</div></div>
  <div id="mid"><div class="pill" id="remain">のこり 0</div><div class="pill" id="score">0 てん</div></div>
  <div style="display:flex;gap:6px"><button class="ib" id="btnReset" aria-label="やりなおし">↻</button><button class="ib" id="btnMenu" aria-label="メニュー">☰</button></div>
</div>

<div id="toast"></div>

<div class="overlay show" id="title">
  <div class="card">
    <div class="demo"><i style="background:#ff6b6b"></i><i style="background:#ffd43b"></i><i style="background:#69db7c"></i><i style="background:#4dabf7"></i></div>
    <h1>つみき<br>ドカーン！</h1>
    <div class="sub">うえを タップで ボールを おとす<br>したで ひっぱって はっしゃ！</div>
    <button class="big" id="btnPlay">▶ あそぶ</button>
    <button class="big blue" id="btnSelect">ステージを えらぶ</button>
    <button class="big gray" id="btnRankT">🏆 ランキング</button>
    <a class="back" href="../../samples/">← ゲーム一覧</a>
  </div>
</div>

<div class="overlay" id="select">
  <div class="card">
    <h2>ステージ</h2>
    <div id="grid"></div>
    <button class="big blue" id="btnRankS">🏆 ランキング</button>
    <button class="big gray" id="btnBack">もどる</button>
    <a class="back" href="../../samples/">← ゲーム一覧</a>
  </div>
</div>

<div class="overlay" id="ranking">
  <div class="card">
    <h2>🏆 ランキング</h2>
    <div class="rankNav"><button id="rkPrev">◀</button><span id="rkTitle">ステージ 1</span><button id="rkNext">▶</button></div>
    <ol class="rank" id="rkList"></ol>
    <button class="big gray" id="btnRkBack">もどる</button>
  </div>
</div>

<div class="overlay" id="clear">
  <div class="card">
    <h2 id="clearTitle">ステージクリア！</h2>
    <div class="stars"><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
    <div class="scoreNum" id="scoreNum">0</div>
    <div class="bonus" id="bonus"></div>
    <div class="sub" id="clearSub" style="margin:4px 0 0"></div>
    <div id="rankIn" style="display:none">
      <div class="rankin">🎉 ランクイン！ <span id="rankPos"></span></div>
      <div id="chips"></div>
      <div class="nameRow"><input id="nameIn" maxlength="8" placeholder="なまえを いれてね" autocomplete="off"><button id="btnReg">とうろく</button></div>
    </div>
    <ol class="rank" id="clearRank"></ol>
    <button class="big" id="btnNext">つぎへ ▶</button>
    <button class="big gray" id="btnRetry">もういちど</button>
  </div>
</div>

<script>
(() => {
'use strict';
const { Engine, Bodies, Body, Composite, Events } = Matter;

// ---------- 定数 ----------
const STEP = 1000 / 60;
const G = 0.001 * STEP * STEP;          // 1ステップあたりの重力加速度(px/step^2)
const W = 400;
const MAXPULL = 100, K = 0.215, BS = 32, PH = 14;
const CAT_BALL = 1, CAT_BLOCK = 2, CAT_PLAT = 4, CAT_WALL = 8;
const PALETTE = ['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#9775fa','#f783ac'];
const PENTA = [523,587,659,784,880,1047,1175,1319,1568,1760,2093];
const KEY = 'tsumiki_dokaan_v1';

let H = 760, scale = 1, offX = 0, offY = 0, dpr = 1;
let SPLIT, KILLY, AX, AY;

const engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
const world = engine.world;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let blocks = [], balls = [], plats = [], particles = [], texts = [];
let stageIdx = 0, used = 0, par = 3, cleared = false, clearTimer = 0;
let combo = 0, comboTimer = 0, comboText = null, shake = 0, lastDrop = -99, lastHit = -99, steps = 0, bandVib = 0;
let pull = null, playing = false, stageScore = 0, stageT = 0;
const kicks = [];
let hintDrop = true, hintSling = true;
const clouds = Array.from({length: 4}, (_, i) => ({ x: Math.random() * W, y: 60 + i * 45 + Math.random() * 20, s: 0.7 + Math.random() * 0.6, v: 0.08 + Math.random() * 0.12 }));

// ---------- 保存 ----------
let save = { unlocked: 1, stars: [] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
if (save.stars && save.stars[9] && save.unlocked < 11) save.unlocked = 11; // 10ステージ版で全クリアしていた人は11へ
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

// ---------- 画面サイズ ----------
function layout() { SPLIT = H * 0.5; KILLY = H * 0.545; AX = W / 2; AY = H * 0.765; }
function fit() {
  const cw = innerWidth, ch = innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2; offY = (ch - H * scale) / 2;
}
function chooseH() {
  const cw = innerWidth, ch = innerHeight;
  H = Math.max(640, Math.min(900, ch / (cw / W)));
  layout(); fit();
}
addEventListener('resize', fit);
chooseH();

// ---------- サウンド (Web Audio で合成) ----------
let ac = null, master = null;
function initAudio() {
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function tone(f, d, type = 'sine', v = 0.2, f2 = 0, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
let noiseBuf = null;
function noise(d, v, freq) {
  if (!ac) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  const g = ac.createGain();
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.02);
}
const sfx = {
  shoot(p) { tone(160, 0.28, 'triangle', 0.28, 520 + p * 4); noise(0.08, 0.15, 2500); },
  drop() { tone(1100, 0.32, 'sine', 0.12, 380); },
  stretch() { tone(260, 0.12, 'sine', 0.06, 380); },
  hit(rv) { noise(0.07, Math.min(0.4, rv * 0.03), 900 + Math.random() * 900); tone(200 + Math.random() * 90, 0.09, 'triangle', Math.min(0.22, rv * 0.02)); },
  thud() { tone(130, 0.12, 'sine', 0.16, 60); },
  pop(c) { const f = PENTA[Math.min(c - 1, PENTA.length - 1)]; tone(f, 0.14, 'square', 0.06); tone(f * 2, 0.16, 'sine', 0.12, 0, 0.03); },
  gold() { [1319, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.18, 'sine', 0.12, 0, i * 0.06)); },
  fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.25, 0, i * 0.11));
    [1047, 1319, 1568].forEach(f => tone(f, 0.7, 'triangle', 0.14, 0, 0.5));
  },
  boom() { noise(0.6, 0.7, 160); noise(0.25, 0.4, 900); tone(110, 0.5, 'sine', 0.45, 35); },
  balloon() { noise(0.07, 0.5, 3200); tone(950, 0.08, 'square', 0.05, 300); },
  glass() { for (let i = 0; i < 4; i++) tone(2000 + Math.random() * 2500, 0.2, 'sine', 0.07, 0, i * 0.03); noise(0.15, 0.25, 5000); },
  boing() { tone(170, 0.35, 'sine', 0.25, 540); },
  magic() { [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.2, 'triangle', 0.1, 0, i * 0.05)); },
  star(i) { const f = [880, 1109, 1319][i]; tone(f, 0.35, 'sine', 0.22); tone(f * 2, 0.25, 'sine', 0.08, 0, 0.02); },
};
function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ---------- ステージ定義 ----------
const plat = (x, s, w, move) => ({ x, s, w, move });
function pyr(L, cx, s, n, kf) {
  for (let r = 0; r < n; r++) { const c = n - r;
    for (let k = 0; k < c; k++) L.push({ x: cx + (k - (c - 1) / 2) * BS, y: s - BS / 2 - r * BS, w: BS, h: BS, kind: kf ? kf(r, n) : 'n' }); }
}
function tow(L, cx, s, cols, rows, kf) {
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    L.push({ x: cx + (c - (cols - 1) / 2) * BS, y: s - BS / 2 - r * BS, w: BS, h: BS, kind: kf ? kf(r, rows) : 'n' });
}
function hut(L, cx, s, floors, span) {
  let y = s; const ph = 46;
  for (let f = 0; f < floors; f++) {
    L.push({ x: cx - span / 2 + 7, y: y - ph / 2, w: 14, h: ph, kind: 'plank' });
    L.push({ x: cx + span / 2 - 7, y: y - ph / 2, w: 14, h: ph, kind: 'plank' });
    y -= ph;
    L.push({ x: cx, y: y - PH / 2, w: span + 12, h: PH, kind: 'plank' });
    y -= PH;
  }
  return y;
}
function circ(L, x, y, kind) { L.push({ x, y, w: 32, h: 32, r: 16, kind, shape: 'circle' }); }
function tri(L, cx, s, w, h) { w = w || 64; h = h || 34; L.push({ x: cx, y: s - h / 3, w, h, kind: 'tri', shape: 'tri' }); }
function big(L, cx, s) { L.push({ x: cx, y: s - 32, w: 64, h: 64, kind: 'big' }); }
function setK(L, from, kind) { L[from].kind = kind; }
const RAW_LEVELS = [
  H => { const s = H * .46, L = []; pyr(L, 200, s, 3); return { plats: [plat(200, s, 112)], blocks: L, par: 2 }; },
  H => { const s = H * .46, L = []; tow(L, 200, s, 2, 5); return { plats: [plat(200, s, 80)], blocks: L, par: 3 }; },
  H => { const s = H * .44, L = []; pyr(L, 100, s, 3); pyr(L, 300, s, 3); return { plats: [plat(100, s, 110), plat(300, s, 110)], blocks: L, par: 4 }; },
  H => { const s = H * .46, L = []; const top = hut(L, 200, s, 3, 92); L.push({ x: 200, y: top - BS / 2, w: BS, h: BS, kind: 'gold' }); return { plats: [plat(200, s, 124)], blocks: L, par: 3 }; },
  H => { const a = H * .40, b = H * .46, c = H * .34, L = []; tow(L, 75, a, 1, 4); tow(L, 200, b, 2, 3); tow(L, 325, c, 1, 4);
         return { plats: [plat(75, a, 54), plat(200, b, 84), plat(325, c, 54)], blocks: L, par: 5 }; },
  H => { const s = H * .46, L = []; pyr(L, 200, s, 6, (r, n) => r === n - 1 ? 'gold' : 'n'); return { plats: [plat(200, s, 210)], blocks: L, par: 4 }; },
  H => { const s = H * .46, L = []; tow(L, 200, s, 3, 1, () => 'stone'); tow(L, 200, s - BS, 2, 5, () => 'ice'); return { plats: [plat(200, s, 112)], blocks: L, par: 4 }; },
  H => { const s = H * .46, L = []; tow(L, 110, s, 1, 3, () => 'stone'); tow(L, 290, s, 1, 3, () => 'stone'); tow(L, 200, s, 3, 2);
         const py = s - 3 * BS; L.push({ x: 200, y: py - PH / 2, w: 216, h: PH, kind: 'plank' });
         const ps = py - PH; L.push({ x: 200, y: ps - BS / 2, w: BS, h: BS, kind: 'gold' });
         tow(L, 118, ps, 1, 1); tow(L, 282, ps, 1, 1);
         return { plats: [plat(200, s, 226)], blocks: L, par: 5 }; },
  H => { const a = H * .28, b = H * .46, L = []; pyr(L, 200, a, 3); tow(L, 85, b, 2, 3); tow(L, 315, b, 2, 3);
         return { plats: [plat(200, a, 112), plat(85, b, 84), plat(315, b, 84)], blocks: L, par: 5 }; },
  H => { const s = H * .46, L = []; pyr(L, 200, s, 6, (r, n) => r === n - 1 ? 'gold' : r < 1 ? 'stone' : r >= 3 ? 'ice' : 'n');
         return { plats: [plat(200, s, 210)], blocks: L, par: 6 }; },

function loadStage(i) {
  Composite.clear(world, false);
  blocks = []; balls = []; plats = []; particles = []; texts = []; comboText = null; pull = null;
  chooseH();
  stageIdx = i;
  const def = LEVELS[i % LEVELS.length](H);
  const wallOpt = { isStatic: true, restitution: 0.6, collisionFilter: { category: CAT_WALL, mask: CAT_BALL } };
  const wl = Bodies.rectangle(-15, H / 2 - 700, 30, H + 1400, wallOpt), wr = Bodies.rectangle(W + 15, H / 2 - 700, 30, H + 1400, wallOpt);
  wl.isWall = wr.isWall = true;
  Composite.add(world, [wl, wr]);
  for (const p of def.plats) {
    const b = Bodies.rectangle(p.x, p.s + 9, p.w, 18, { isStatic: true, friction: 0.9, collisionFilter: { category: CAT_PLAT, mask: CAT_BLOCK } });
    b.pw = p.w; b.isPlat = true; b.move = p.move; b.baseX = p.x; plats.push(b);
  }
  Composite.add(world, plats);
  for (const d of def.blocks) {
    const k = KIND[d.kind];
    const opt = Object.assign({ collisionFilter: { category: CAT_BLOCK, mask: CAT_BALL | CAT_BLOCK | CAT_PLAT } }, k);
    let b;
    if (d.shape === 'circle') b = Bodies.circle(d.x, d.y, d.r, opt);
    else if (d.shape === 'tri') b = Body.create(Object.assign({ position: { x: d.x, y: d.y }, vertices: Matter.Vertices.clockwiseSort([{ x: -d.w / 2, y: 0 }, { x: d.w / 2, y: 0 }, { x: 0, y: -d.h }]) }, opt));
    else b = Bodies.rectangle(d.x, d.y, d.w, d.h, opt);
    b.shape = d.shape || 'rect'; b.r = d.r; b.homeY = d.y; b.phase = Math.random() * 6; b.fuse = 0; b.trigger = false;
    b.kind = d.kind; b.bw = d.w; b.bh = d.h; b.alive = true; b.hitFlash = 0; b.isBlock = true;
    b.color = KCOLOR[d.kind] || PALETTE[(Math.random() * PALETTE.length) | 0];
    blocks.push(b);
  }
  Composite.add(world, blocks);
  used = 0; stageScore = 0; stageT = 0; kicks.length = 0; par = def.par; cleared = false; clearTimer = 0; combo = 0; comboTimer = 0; shake = 0;
  updateHUD();
  document.getElementById('toast').classList.remove('show');
  if (def.intro) setTimeout(() => { if (stageIdx === i) showToast(def.intro); }, 250);
}

// ---------- ボール ----------
function makeBall(x, y, r, den) {
  const b = Bodies.circle(x, y, r, { density: den, restitution: 0.45, friction: 0.05, frictionAir: 0,
    collisionFilter: { category: CAT_BALL, mask: CAT_BLOCK | CAT_WALL } });
  b.isBall = true; b.r = r; b.age = 0; b.trail = [];
  Composite.add(world, b); balls.push(b);
  if (balls.length > 14) { const o = balls.shift(); Composite.remove(world, o); }
  return b;
}
function dropBall(x) {
  if (steps - lastDrop < 8) return;
  lastDrop = steps;
  x = Math.max(22, Math.min(W - 22, x));
  const b = makeBall(x, 24, 18, 0.02);
  b.isDrop = true;
  Body.setVelocity(b, { x: 0, y: 10 });
  used++; hintDrop = false;
  sfx.drop();
  for (let i = 0; i < 8; i++) particles.push({ x, y: 24, vx: (Math.random() - .5) * 4, vy: -Math.random() * 2, life: 22, max: 22, color: '#fff', size: 3 + Math.random() * 3, type: 'dot' });
}
function shoot() {
  const px = AX + pull.dx, py = AY + pull.dy, len = Math.hypot(pull.dx, pull.dy);
  const b = makeBall(px, py, 13, 0.008);
  Body.setVelocity(b, { x: -pull.dx * K, y: -pull.dy * K });
  used++; hintSling = false; bandVib = 14;
  sfx.shoot(len); vib(12);
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5.5;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.5, life: 40 + Math.random() * 25, max: 65,
      color: Math.random() < 0.3 ? '#ffffff' : color, size: 3 + Math.random() * 5, type: Math.random() < 0.4 ? 'star' : 'dot',
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4 });
  }
}
function sparks(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 14 + Math.random() * 10, max: 24, color: '#fff3a0', size: 2 + Math.random() * 2.5, type: 'dot' });

function confetti(n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x: Math.random() * W, y: -20 - Math.random() * 200, vx: (Math.random() - .5) * 2, vy: 1 + Math.random() * 2,
      life: 200 + Math.random() * 80, max: 280, color: PALETTE[(Math.random() * PALETTE.length) | 0], size: 6 + Math.random() * 5,

function explode(x, y) {
  kicks.push({ x, y, rv: 22, boom: true });
  burst(x, y, '#ff9d2e', 26); burst(x, y, '#ffe066', 18);
  particles.push({ x, y, vx: 0, vy: 0, life: 22, max: 22, color: '#fff2b0', size: 150, type: 'ring' });
  particles.push({ x, y, vx: 0, vy: 0, life: 14, max: 14, color: '#ff9d2e', size: 90, type: 'ring' });
  texts.push({ x, y: y - 20, s: 'ドカーン！', life: 50, max: 50, color: '#ff8a1e', size: 30 });
  sfx.boom(); vib(60); shake = Math.max(shake, 18);
}
function popBlock(b) {
  b.alive = false; Composite.remove(world, b);
  combo = comboTimer > 0 ? combo + 1 : 1; comboTimer = 80;
  const x = Math.max(20, Math.min(W - 20, b.position.x)), y = Math.min(b.position.y, KILLY - 10);
  const gold = b.kind === 'gold';
  if (b.kind === 'glass') { burst(x, y, '#e6fbff', 22); sfx.glass(); }
  else if (b.kind === 'balloon') { burst(x, y, b.color, 18); sfx.balloon(); }
  else if (b.kind === 'rainbow') { for (let i = 0; i < 4; i++) burst(x, y, PALETTE[(Math.random() * PALETTE.length) | 0], 8); }
  else if (b.kind !== 'bomb') burst(x, y, b.color, gold ? 30 : 16);
  if (b.kind === 'bomb') explode(x, Math.min(b.position.y, KILLY));
  if (b.kind === 'rainbow') {
    sfx.magic();
    for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * 0.55, nb = makeBall(b.position.x, b.position.y, 11, 0.008); nb.bonus = true; Body.setVelocity(nb, { x: Math.cos(a) * 9, y: Math.sin(a) * 9 }); }
    texts.push({ x, y: y - 36, s: 'ボールが ふえた！', life: 60, max: 60, color: '#ff8fd0', size: 22 });
  }
  const pts = ({ gold: 500, bomb: 200, rainbow: 300, balloon: 150, glass: 150, big: 200 }[b.kind] || 100) * combo;
  stageScore += pts;
  texts.push({ x, y: y - 12, s: '+' + pts, life: 55, max: 55, color: gold ? '#ffb000' : '#ffffff', size: gold ? 26 : 20 });
  if (combo >= 2) comboText = { s: combo + ' コンボ！', life: 70, max: 70 };
  sfx.pop(combo); if (gold) sfx.gold();
  vib(15); shake = Math.max(shake, gold ? 8 : 4);
  updateHUD(true);
}

Events.on(engine, 'collisionStart', ev => {
  for (const pr of ev.pairs) {
    let a = pr.bodyA.parent, b = pr.bodyB.parent;
    if (!a.isBall && b.isBall) [a, b] = [b, a];
    if (!a.isBall) continue;
    const rv = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
    if (b.isBlock) {
      if (b.kind === 'balloon' && rv > 0.5) b.trigger = true;
      if (rv > 3) {
        if (b.kind === 'bomb' || b.kind === 'rainbow') b.trigger = true;
        if (b.kind === 'glass' && rv > 5) b.trigger = true;
        if (b.kind === 'jelly' && steps - lastHit > 3) { sfx.boing(); lastHit = steps - 1; }
        if (steps - lastHit > 3) { sfx.hit(rv); lastHit = steps; }
        sparks((a.position.x + b.position.x) / 2, (a.position.y + b.position.y) / 2, Math.min(12, rv | 0));
        b.hitFlash = 8;
        kicks.push({ x: a.position.x, y: a.position.y, rv: Math.min(rv, 22), drop: !!a.isDrop, ball: a, first: a.isDrop && !a.boomed });
        if (a.isDrop && !a.boomed) { a.boomed = true; shake = Math.max(shake, 12); vib(25); burst(a.position.x, a.position.y + 10, '#ffe066', 14); }
        if (rv > 9) { shake = Math.max(shake, rv * 0.6); vib(10); }
      }
    } else if (b.isWall && rv > 4 && steps - lastHit > 3) { sfx.thud(); lastHit = steps; }
  }
});

// ---------- 入力 ----------
function toWorld(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (!playing || cleared) return;
  const p = toWorld(e);
  if (p.y < SPLIT) dropBall(p.x);
  else if (!pull) {
    pull = { id: e.pointerId, sx: p.x, sy: p.y, dx: 0, dy: 0 };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    sfx.stretch();
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pull || e.pointerId !== pull.id) return;
  const p = toWorld(e);
  let dx = p.x - pull.sx, dy = p.y - pull.sy;
  const l = Math.hypot(dx, dy);
  if (l > MAXPULL) { dx *= MAXPULL / l; dy *= MAXPULL / l; }
  pull.dx = dx; pull.dy = dy;
});
function endPull(e, fire) {
  if (!pull || e.pointerId !== pull.id) return;
  if (fire && Math.hypot(pull.dx, pull.dy) > 14 && playing && !cleared) shoot();
  pull = null;
}
canvas.addEventListener('pointerup', e => endPull(e, true));
canvas.addEventListener('pointercancel', e => endPull(e, false));
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// ---------- 更新 ----------
function stepGame() {
  steps++; stageT++;
  for (const p of plats) if (p.move) Body.setPosition(p, { x: p.baseX + Math.sin(stageT * p.move.sp + (p.move.ph || 0)) * p.move.ax, y: p.position.y }, true);
  for (const b of blocks) if (b.alive && b.kind === 'balloon') // ふうせんは ふわふわ うかぶ
    Body.applyForce(b, b.position, { x: Math.sin(stageT * 0.03 + b.phase) * b.mass * 0.00004, y: -b.mass * 0.001 + (b.homeY - b.position.y) * b.mass * 0.000004 });
  Engine.update(engine, STEP);
  // ボールが当たった周りの積み木をはじき飛ばす(ドカーン効果)
  for (const k of kicks) {
    const R = k.boom ? 150 : k.drop ? 120 : 90, P = k.boom ? 0.75 : k.drop ? 0.5 : 0.4;
    for (const b of blocks) {
      if (!b.alive) continue;
      const dx = b.position.x - k.x, dy = b.position.y - k.y, d = Math.hypot(dx, dy);
      if (d > R || d < 0.01) continue;
      const dv = (1 - d / R) * k.rv * P / (b.kind === 'stone' || b.kind === 'big' ? (k.drop ? 1.15 : k.boom ? 1.4 : 1.8) : 1);
      if ((b.kind === 'glass' || b.kind === 'balloon') && dv > (k.boom ? 2 : 3.5)) b.trigger = true;
      if (k.boom && b.kind === 'bomb' && !b.fuse) b.fuse = 10; // となりの ばくだんも れんさ
      if (k.boom) {
        Body.setVelocity(b, { x: b.velocity.x + dx / d * dv, y: b.velocity.y + dy / d * dv - dv * 0.45 });
      } else if (k.drop) {
        // 上から: 真下に押しつぶさず、左右にはじき上げる
        const sx = Math.abs(dx) > 4 ? Math.sign(dx) : (Math.random() < 0.5 ? -1 : 1);

function renderRank(el, i, hiT) {
  el.innerHTML = '';
  const list = rankOf(i);
  if (!list.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'まだ きろくが ないよ'; el.appendChild(li); return; }
  list.forEach((e, k) => {
    const li = document.createElement('li'); if (hiT && e.t === hiT) li.className = 'me';
    const no = document.createElement('span'); no.className = 'no'; no.textContent = MEDAL[k];
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.n;
    const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = e.s.toLocaleString() + ' てん';
    li.append(no, nm, sc); el.appendChild(li);
  });
}
function register() {
  if (!pendingScore) return;
  const name = ($('nameIn').value || '').trim().slice(0, 8) || 'なまえなし';
  const e = { n: name, s: pendingScore.s, t: Date.now() };
  const list = rankOf(pendingScore.i).concat(e).sort((a, b) => b.s - a.s || a.t - b.t).slice(0, 5);
  save.rank[pendingScore.i] = list;
  if (name !== 'なまえなし') save.names = [name].concat(save.names.filter(n => n !== name)).slice(0, 4);
  persist();
  $('rankIn').style.display = 'none';
  renderRank($('clearRank'), pendingScore.i, e.t);
  pendingScore = null;
  sfx.gold();
}
function showClear() {
  const st = used <= par ? 3 : used <= Math.ceil(par * 1.8) ? 2 : 1;
  const bonus = Math.max(0, par * 2 - used) * 200;
  const total = stageScore + bonus;
  save.stars[stageIdx] = Math.max(save.stars[stageIdx] || 0, st);
  save.lastStage = stageIdx;
  save.unlocked = Math.min(LEVELS.length, Math.max(save.unlocked, stageIdx + 2));
  persist();
  const last = stageIdx >= LEVELS.length - 1;
  $('clearTitle').textContent = last ? 'ぜんぶ クリア！' : 'ステージクリア！';
  $('clearSub').textContent = `ボール ${used}こ で クリア！`;
  $('bonus').textContent = bonus ? `つみき ${stageScore.toLocaleString()} ＋ ボールボーナス ${bonus.toLocaleString()}` : '';
  $('btnNext').textContent = last ? 'さいしょから ▶' : 'つぎへ ▶';
  const stars = document.querySelectorAll('#clear .star');
  stars.forEach(s => s.classList.remove('on'));
  // ランクイン判定
  const list = rankOf(stageIdx);
  const pos = list.filter(e => e.s >= total).length;
  pendingScore = pos < 5 ? { i: stageIdx, s: total } : null;
  $('rankIn').style.display = 'none';
  renderRank($('clearRank'), stageIdx);
  $('nameIn').value = save.names[0] || '';
  const chips = $('chips'); chips.innerHTML = '';
  save.names.forEach(n => { const c = document.createElement('button'); c.className = 'chip'; c.textContent = n; c.onclick = () => { $('nameIn').value = n; register(); }; chips.appendChild(c); });
  show('clear');
  // 点数カウントアップ
  const el = $('scoreNum'), t0 = performance.now(), dur = 900;
  (function tick(now) {
    const k = Math.min(1, (now - t0) / dur), v = Math.round(total * (1 - Math.pow(1 - k, 3)));
    el.innerHTML = v.toLocaleString() + '<small> てん</small>';
    if (k < 1) { if (Math.random() < 0.5) tone(900 + k * 900, 0.04, 'square', 0.03); requestAnimationFrame(tick); }
    else if (pendingScore) { $('rankPos').textContent = (pos + 1) + 'い'; $('rankIn').style.display = 'block'; sfx.fanfare(); }
  })(t0);
  for (let i = 0; i < st; i++) setTimeout(() => { stars[i].classList.add('on'); sfx.star(i); vib(20); }, 350 + i * 380);
}
function openRanking(back, i) {
  rankBack = back; rkStage = Math.max(0, Math.min(LEVELS.length - 1, i));
  $('rkTitle').textContent = 'ステージ ' + (rkStage + 1);
  renderRank($('rkList'), rkStage);
  show('ranking');
}
function buildGrid() {
  const g = $('grid'); g.innerHTML = '';
  LEVELS.forEach((_, i) => {
    const b = document.createElement('button'); b.className = 'sbtn';
    const locked = i + 1 > save.unlocked;
    b.disabled = locked;
    const s = save.stars[i] || 0;
    b.innerHTML = (locked ? '🔒' : (i + 1)) + '<small>' + (locked ? '' : '★'.repeat(s) + '☆'.repeat(3 - s)) + '</small>';
    b.onclick = () => startStage(i);
    g.appendChild(b);
  });
}
$('btnPlay').onclick = () => startStage(Math.min(save.unlocked, LEVELS.length) - 1);
$('btnSelect').onclick = () => { initAudio(); buildGrid(); show('select'); };
$('btnBack').onclick = () => show(playing ? null : 'title');
$('btnMenu').onclick = () => { initAudio(); buildGrid(); show('select'); };
$('btnReset').onclick = () => { initAudio(); if (playing) loadStage(stageIdx); };
$('btnReg').onclick = register;
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
$('btnRankT').onclick = () => { initAudio(); openRanking('title', typeof save.lastStage === 'number' ? save.lastStage : 0); };
$('btnRankS').onclick = () => openRanking('select', stageIdx);
$('rkPrev').onclick = () => openRanking(rankBack, (rkStage + LEVELS.length - 1) % LEVELS.length);
$('rkNext').onclick = () => openRanking(rankBack, (rkStage + 1) % LEVELS.length);
$('btnRkBack').onclick = () => { if (rankBack === 'select') { buildGrid(); show('select'); } else show('title'); };
$('btnNext').onclick = () => register() || startStage(stageIdx >= LEVELS.length - 1 ? 0 : stageIdx + 1);
$('btnRetry').onclick = () => register() || startStage(stageIdx);

// ---------- ループ ----------
loadStage(Math.min(save.unlocked, LEVELS.length) - 1);
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(now - last, 100); last = now;
  if (playing) { acc += dt; let n = 0; while (acc >= STEP && n < 6) { stepGame(); acc -= STEP; n++; } if (n >= 6) acc = 0; }
  else { for (const c of clouds) { c.x += c.v; if (c.x > W + 80) c.x = -80; } }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { shootV(dx,dy){ pull={id:0,sx:0,sy:0,dx,dy}; shoot(); pull=null; }, get used(){return used;}, finish(){ blocks.forEach(b=>{ if(b.alive) popBlock(b); }); }, get blocks() { return blocks; }, get balls() { return balls; }, get H() { return H; }, startStage, stepGame, dropBall, get cleared() { return cleared; } };
})();
