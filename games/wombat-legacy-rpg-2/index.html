<style>
:root{--bg:#14101c;--win:#0d0a16;--line:#efe6d2;--txt:#f7f1e3;--dim:#a79db5;--acc:#ffd36b;--hp:#6fdc7c;--mp:#6fb8ff;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;min-height:100%}
body{display:flex;justify-content:center;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{width:100%;max-width:500px;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 8px)}
#top{flex:none;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);min-height:22px;gap:8px}
#top .back{color:var(--dim);text-decoration:none;white-space:nowrap;font-size:12px;border:1px solid #4a4258;border-radius:6px;padding:2px 7px}
#where{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .r{display:flex;gap:6px;align-items:center}
#top button{font:inherit;font-size:12px;color:var(--dim);background:none;border:1px solid #4a4258;border-radius:6px;padding:3px 8px;cursor:pointer}
#gold{color:var(--acc);font-weight:bold}
#screen{position:relative;flex:none;align-self:center;height:clamp(165px,min(calc((min(100vw,500px) - 16px)*.75),calc(100dvh - 448px)),375px);width:auto;max-width:100%;aspect-ratio:4/3;background:#000;border:3px solid var(--line);border-radius:8px;overflow:hidden}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9%;pointer-events:none;text-align:center}
#overlay h1{margin:0;line-height:1.15;font-size:clamp(24px,7.4vw,36px);letter-spacing:.02em;color:#fff3c4;text-shadow:3px 3px 0 #5a2d1a,-1px -1px 0 #5a2d1a,1px -1px 0 #5a2d1a,-1px 1px 0 #5a2d1a}
#overlay h1 span{color:#ffd36b}
#overlay p{margin:6px 0 0;font-size:clamp(12px,3.4vw,15px);color:#e8dcc0;text-shadow:1px 1px 0 #000}
.win{background:var(--win);border:3px solid var(--line);border-radius:8px;padding:9px 12px}
#msg{flex:none;height:calc(6em + 20px);overflow-y:auto;font-size:14px;line-height:1.5;padding:7px 11px;white-space:pre-wrap;position:relative;cursor:pointer}
#msg.more::after{content:"▼";position:absolute;right:10px;bottom:4px;animation:blink 1s infinite;color:var(--acc);font-size:13px}
@keyframes blink{50%{opacity:0}}
#party{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pc{min-width:0;background:var(--win);border:2px solid var(--line);border-radius:7px;padding:3px 6px 4px;font-size:11px;line-height:1.25;transition:transform .08s}
.pc .nm{display:flex;justify-content:space-between;align-items:baseline}
.pc b{font-size:13px}
.pc .cl{color:var(--dim);font-size:11px}
.pc .jb{color:var(--acc);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.dead{border-color:var(--bad)}
.pc.dead b{color:var(--bad)}
.pc.act{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.pc.hurt{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bar{height:5px;background:#2c2638;border-radius:3px;overflow:hidden;margin:1px 0 2px}
.bar i{display:block;height:100%;transition:width .25s}
.lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.lbl span:last-child{color:var(--txt)}
#cmd{flex:1 1 auto;min-height:0;overflow-y:auto;align-content:start;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:6px;padding:1px 1px 4px}
#cmd button{font:inherit;font-size:15px;color:var(--txt);background:var(--win);border:2px solid var(--line);border-radius:8px;padding:6px 9px;text-align:left;cursor:pointer;min-height:42px;line-height:1.3;touch-action:manipulation}
#cmd button:active{background:#2a2440}
#cmd button:disabled{opacity:.35;cursor:default}
#cmd button.wide{grid-column:1/-1}
.acard{width:100%;margin-top:6%;padding:9px 0 10px;background:linear-gradient(90deg,transparent,rgba(8,6,16,.9) 12%,rgba(8,6,16,.9) 88%,transparent);border-top:2px solid var(--c);border-bottom:2px solid var(--c);animation:acard 1.1s ease both}
.acard small{display:block;color:#d8cfb8;font-size:12px;letter-spacing:.2em}
.acard b{display:block;font-size:clamp(22px,7vw,32px);color:var(--c);letter-spacing:.12em;text-shadow:2px 2px 0 #000,0 0 14px var(--c)}
.acard span{display:block;font-size:clamp(12px,3.4vw,14px);color:#fff;margin-top:3px;text-shadow:1px 1px 0 #000}
@keyframes acard{0%{opacity:0;transform:scaleX(.2)}35%{opacity:1;transform:scaleX(1.03)}50%{transform:scaleX(1)}100%{opacity:1}}
.tablet{margin:5% 9% 0;padding:9px 12px 11px;background:linear-gradient(#9a9486,#6a665a);border:3px solid #3a3630;border-radius:14px 14px 5px 5px;box-shadow:inset 0 0 0 2px #b4ae9e,0 5px 0 #2a2620;color:#1e1c18;text-align:center;animation:acard .8s ease both}
.tablet small{display:block;font-size:11px;color:#34302a;letter-spacing:.25em}
.tablet b{display:block;font-size:clamp(14px,4.4vw,17px);margin:2px 0 5px}
.tablet p{margin:0;font-size:clamp(12px,3.6vw,14px);line-height:1.55;text-shadow:0 1px 0 #b4ae9e}
.jgrid{position:absolute;inset:4px;background:rgba(10,8,20,.93);border:2px solid var(--line);border-radius:6px;padding:4px 6px;text-align:left;overflow:hidden}
.jt{font-size:13px;color:#fff}.jh{font-size:10px;color:var(--acc);margin:3px 0 1px}
.jg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.jc{font-style:normal;display:flex;justify-content:space-between;gap:2px;font-size:clamp(10px,2.9vw,12px);padding:1px 4px;border-radius:3px;background:#2a2440;color:#ddd}
.jc b{font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:clip}.jc em{font-style:normal;white-space:nowrap}
.jc.ms{background:#5c4a16;color:#ffe9a8}.jc.un{color:#c4e8ff}.jc.lk{opacity:.45}.jc.cur{box-shadow:inset 0 0 0 1px var(--acc)}
.spanel{position:absolute;left:6%;right:6%;top:8%;background:rgba(10,8,20,.93);border:2px solid var(--line);border-radius:8px;padding:6px 10px 8px;text-align:left;animation:acard .5s ease both}
.sp1{font-size:clamp(12px,3.4vw,14px);color:#ddd;margin-bottom:4px}.sp1 b{color:var(--acc)}
.spg{display:grid;grid-template-columns:auto auto auto auto auto auto auto auto;gap:1px 6px;font-size:clamp(11px,3.2vw,13px);color:#eee;justify-content:start}
.spg .up{color:#8ef08a}.spg .dn{color:#ff9a8a}
.sp2{font-size:clamp(10px,2.9vw,12px);color:#c4e8ff;margin-top:5px;line-height:1.35}
#cmd .nmrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--win);border:2px solid var(--line);border-radius:8px;padding:5px 8px}
#cmd .nmrow span{flex:none;width:7.5em;font-size:13px;color:var(--dim)}
#cmd .nmrow input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--txt);background:#0d0a16;border:1px solid #5a5068;border-radius:6px;padding:6px 8px}
#cmd .nmrow input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
#overlay p.clr{color:#ffd36b;font-weight:bold}
#cmd button.sec{grid-column:1/-1;min-height:20px;padding:2px 6px;font-size:12px;opacity:.85;border:none;background:none;box-shadow:none;color:var(--acc)}
#cmd.five{grid-template-columns:repeat(5,1fr);gap:4px}
#cmd.five button.flr{min-height:34px;padding:4px 2px;text-align:center;font-size:14px}
#cmd.five button.sec{min-height:22px;padding:2px 6px;font-size:12px;opacity:.8;border:none;background:none;box-shadow:none}
#cmd button.a1{border-color:#5e7040}#cmd button.a2{border-color:#3c6474}#cmd button.a3{border-color:#a090ba}#cmd button.a4{border-color:#c0aa7e}
#cmd button.hi{border-color:var(--acc);color:var(--acc)}
#cmd button.sub{border-color:#5a5068;color:var(--dim);font-size:14px;min-height:42px}
#cmd button small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
#cmd .head{grid-column:1/-1;font-size:13px;color:var(--acc);padding:0 2px}
#pad{display:none;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
#pad.on{display:grid;flex:1 1 auto;min-height:0}
#dpad{display:grid;grid-template-columns:repeat(3,min(64px,17vw));grid-template-rows:repeat(3,min(54px,7.2dvh));gap:4px}
#dpad button,#padside button{font:inherit;font-size:22px;color:var(--txt);background:var(--win);border:2px solid var(--line);border-radius:10px;cursor:pointer;touch-action:none}
#dpad button:active,#dpad button.on{background:#3a3252}
#padside{display:flex;flex-direction:column;gap:8px}
#padside button{font-size:15px;padding:12px 10px;min-width:96px}
#padhint{font-size:12px;color:var(--dim);line-height:1.5;white-space:nowrap}


/* ---- 演出 ---- */
.win,#cmd button,.pc,#dpad button,#padside button{box-shadow:inset 0 0 0 2px #0d0a16,inset 0 0 0 3px #3e3652}
#screen{box-shadow:0 0 0 2px #0d0a16,0 6px 18px rgba(0,0,0,.45)}

#cmd button:not(:disabled):focus-visible::before{width:15px}

@keyframes cin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pc.low{animation:lowp 1s infinite}
@keyframes lowp{50%{border-color:var(--bad);box-shadow:inset 0 0 0 2px #0d0a16,inset 0 0 0 3px #6a2a2a,0 0 8px rgba(255,107,107,.35)}}
.pc.act{box-shadow:inset 0 0 0 2px #0d0a16,inset 0 0 0 3px var(--acc),0 0 10px rgba(255,211,107,.35)}
#fx{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.bn{width:100%;text-align:center;padding:9px 0 10px;background:linear-gradient(90deg,transparent,rgba(12,8,24,.9) 14%,rgba(12,8,24,.9) 86%,transparent);border-top:2px solid var(--c);border-bottom:2px solid var(--c);animation:bn 1.9s ease both;margin-top:-18%}
.bn b{display:block;font-size:clamp(20px,6.4vw,30px);color:var(--c);letter-spacing:.1em;text-shadow:2px 2px 0 #000,0 0 12px var(--c)}
.bn span{display:block;font-size:clamp(12px,3.4vw,15px);color:#fff;margin-top:2px;text-shadow:1px 1px 0 #000}
@keyframes bn{0%{transform:scaleY(0);opacity:0}9%{transform:scaleY(1.15);opacity:1}14%{transform:scaleY(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#padside button#fmap{font-size:13px;padding:8px 6px}
#msg{transition:border-color .2s}
.st{height:15px;display:flex;gap:3px;overflow:hidden;white-space:nowrap;margin-top:2px}
.st i{font-style:normal;font-size:10px;padding:0 4px;border-radius:4px;line-height:15px}
.s-poi{background:#5a2a7a;color:#ecd2ff}.s-bad{background:#6a2a2a;color:#ffd2d2}.s-buf{background:#1d4b6c;color:#c4e8ff}.s-tmp{background:#5c4a16;color:#ffe9a8}
.pc.sel{cursor:pointer;border-color:var(--acc);animation:selp .9s infinite}
.pc.nosel{opacity:.35}
@keyframes selp{50%{box-shadow:inset 0 0 0 2px #0d0a16,inset 0 0 0 3px var(--acc),0 0 12px rgba(255,211,107,.55)}}
</style>

<script>
// ---- sim/core.js ----
// ===== ウォンバット☆レガシーRPG 2: data & rules (DOMを使わない) =====
// 画面を作るときは、このファイルの中身を index.html の <script> にそのまま入れる（前作と同じ形）。
// Node.js からは require('./core.js') で読める。シミュレーター（sim.js）とテスト（test.js）が使う。
//
// 数字はすべて仮。シミュレーションで調整する前提で、調整しやすい値は CONFIG にまとめている。

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- 調整用の値 ----------
const CONFIG={
  // 職業に関係なく共通の伸び方 [Lv1の値, 1レベルごとの増え方]。これに職業の倍率をかける
  base:{hp:[30,8],mp:[8,2.4],atk:[8,2.2],def:[6,1.7],mag:[8,2.2],spd:[6,1.3]},
  expBase:[5,5],            // 必要経験値 = 職業の係数 × (a×lv² + b×lv)
  poisonDot:.08,            // 仲間の毒：最大HPに対する毎ターンのダメージ
  poisonDefDown:.75,        // 毒のあいだ、ぼうぎょ×この値
  enemyPoisonDot:.06,       // 敵の毒：最大HPに対する毎ターンのダメージ
  // ボスへの からめて（2026-11-22 見直し）
  //  デバフ（こうげき↓・ぼうぎょ↓・のろい・めつぶし）は、ボスにも わざの確率のまま きく。どくは ×0.9。かけ直しても 下がらない
  //  うごきを止める状態異常（ねむり・まひ・こんらん）は ボスに ×bossStatusRate、かかるたびに ×bossStatusRepeat。ボスの ねむり・まひは 1ターン
  bossDebuffRate:1, bossPoisonRate:.9,
  bossStatusRate:.6,
  bossStatusRepeat:.7,
  bossPoisonDot:.6,         // ボスへの毒ダメージ×この値
  buff:{atk:1.3,def:1.5,spd:1.3,eva:1,turns:3},
  debuff:{atk:.7,def:.6,turns:3},
  kiaiMax:3, kiaiPow:.2,    // きあい1段ごとに物理ダメージ+20%
  counterRate:.25, evadeBase:.03,
  guardCut:.5,
  // 敵の強さ：この階での値を決め、あいだはなめらかにつなぐ（ふつうの敵の値）
  enemyCurve:{
    floor:[1, 10, 20, 30, 40, 50],
    // B40〜50は、ほかの区間より急に伸ばす（決定）
    hp:   [16,55, 150,340,460,1000],
    atk:  [10,29, 64, 110,135,220],
    def:  [3, 8,  18, 36, 50, 80],
    spd:  [6, 9,  13, 17, 21, 25],
    exp:  [8, 29, 78, 168,311,930],
    gold: [5, 14, 31, 60, 95, 230],
  },
  // 表から計算せず、個別に決めるボス。B50は、表どおりだと超上級職Lv40でも勝てないため。上級職Lv30では勝ちにくい強さにする
  bossOverride:{50:{hp:7500,atk:320,def:90}},
  // ボスは強め（人間は自動プレイより上手に戦うため）。めやす：上限レベル・満タンで勝率6〜8割
  boss:{mid:{hp:10,atk:2.2,def:1.2,exp:12,gold:15},big:{hp:9,atk:1.55,def:1.3,exp:25,gold:30}},
};
function floorScale(f){return 1+.11*(f-1)+.0035*(f-1)*(f-1);}
// 階 f での敵の値（決めた点のあいだを、比で補間する）
function curve(k,f){const F=CONFIG.enemyCurve.floor,V=CONFIG.enemyCurve[k];
  if(f<=F[0])return V[0];for(let i=1;i<F.length;i++)if(f<=F[i]){const t=(f-F[i-1])/(F[i]-F[i-1]);return V[i-1]*Math.pow(V[i]/V[i-1],t);}
  return V[V.length-1]*Math.pow(V[V.length-1]/V[V.length-2],(f-F[F.length-1])/(F[F.length-1]-F[F.length-2]));}

// ---------- 職業 ----------
// mult: ステータスの倍率 / expK: 必要経験値の係数 / cap: レベル上限 / req: 解放条件（1匹ずつ数える）
// expK は、強いスキルを持つ職業ほど重く、それ以外は軽くする（決定。値は仮）
const JOBS={
  // ぼうぎょは職業で変えない（決定）。かたさの差はHPの倍率でつける
  war:{name:'戦士',     tier:1,cap:20,expK:0.6,mult:{hp:1.45,mp:.4, atk:1.15,mag:.3, spd:.8}},
  kar:{name:'空手家',   tier:1,cap:20,expK:1.1,mult:{hp:.95, mp:.4, atk:1.1, mag:.3, spd:1.2}},
  mag:{name:'魔法使い', tier:1,cap:20,expK:1.2,mult:{hp:.6,  mp:1.4,atk:.5,  mag:1.3,spd:1.0}},
  pri:{name:'僧侶',     tier:1,cap:20,expK:1.3,mult:{hp:.8,  mp:1.2,atk:.7,  mag:1.1,spd:.9}},
  poi:{name:'毒使い',   tier:1,cap:20,expK:0.6,mult:{hp:.8,  mp:1.0,atk:.85, mag:1.0,spd:1.1}},
  sin:{name:'歌い手',   tier:1,cap:20,expK:0.6,mult:{hp:.8,  mp:1.1,atk:.7,  mag:1.0,spd:1.05}},
  // 上級職（基本職2つを極めると解放）
  hwar:{name:'上級戦士',tier:2,cap:30,expK:2.0,req:['war','kar']},
  ber: {name:'狂戦士',  tier:2,cap:30,expK:2.0,req:['war','poi']},
  pal: {name:'聖騎士',  tier:2,cap:30,expK:2.0,req:['war','pri']},
  mfi: {name:'魔拳士',  tier:2,cap:30,expK:2.0,req:['kar','mag']},
  dan: {name:'舞闘家',  tier:2,cap:30,expK:2.0,req:['kar','sin']},
  ill: {name:'幻術師',  tier:2,cap:30,expK:2.0,req:['mag','sin']},

// 上級職・超上級職の倍率は仮に「条件の職業の平均×係数」で作る（あとで1つずつ決める）
(function(){
  const keys=['hp','mp','atk','mag','spd'];
  const mk=(id,k)=>{const J=JOBS[id];if(J.mult)return;
    J.req.forEach(r=>mk(r,k));
    J.mult={};for(const s of keys){let sum=0,mx=0;for(const r of J.req){sum+=JOBS[r].mult[s];mx=Math.max(mx,JOBS[r].mult[s]);}
      J.mult[s]=+((sum/J.req.length*.5+mx*.5)*(J.tier===2?1.12:1.12)).toFixed(3);}};
  for(const id in JOBS)mk(id);
})();

const SLOT_MAX=6;

// 今の職業で使えるスキル
function jobSkills(m){return Object.keys(SKILLS).filter(k=>{const S=SKILLS[k];return S.job===m.job&&(S.master?!!m.mastered[m.job]||m.lv>=JOBS[m.job].cap:S.lv<=m.lv);});}
// 引き継ぎ枠に入れられるスキル（覚えたことがあり、今の職業のものではない）
function slotCandidates(m){return Object.keys(m.learned).filter(k=>SKILLS[k].job!==m.job);}
function skillsOf(m){const s=new Set(jobSkills(m));for(const k of m.slots)if(SKILLS[k].job!==m.job)s.add(k);return [...s];}
function setSlots(m,list){
  const c=new Set(slotCandidates(m));const out=[];
  for(const k of list){if(out.length>=SLOT_MAX)break;if(c.has(k)&&!out.includes(k))out.push(k);}
  m.slots=out;return out;
}
// パッシブの効果を足し合わせる
function passives(m){
  const e={};for(const k of skillsOf(m)){const S=SKILLS[k];if(S.kind!=='passive')continue;
    for(const x in S.eff){if(x==='guardCut')e[x]=Math.min(e[x]??1,S.eff[x]);else e[x]=(e[x]||0)+S.eff[x];}}
  return e;
}

function baseStat(m,k){const b=CONFIG.base[k];return (b[0]+b[1]*(m.lv-1))*(JOBS[m.job].mult[k]??1);}
function derived(m){
  const p=passives(m),w=WEAPON_POW[m.w],L=WEAPON_LINES[m.wl||'claw'],a=ARMORS[m.a][1];
  const st=k=>Math.floor(baseStat(m,k)*(1+(p[k]||0)));
  const d={maxhp:st('hp'),maxmp:st('mp'),atk:st('atk')+Math.floor(w*L.atk),def:st('def')+a,mag:st('mag')+Math.floor(w*L.mag),spd:st('spd')};
  d.p=p;return d;
}
function newMember(job,name){
  const m={name,job,lv:1,exp:0,wl:bestLine(job),w:0,a:0,own:{claw:0,staff:0,flute:0},hp:1,mp:0,poison:false,mastered:{},jobLv:{},learned:{},slots:[],totalExp:0};
  learnUpTo(m);const d=derived(m);m.hp=d.maxhp;m.mp=d.maxmp;return m;
}
function learnUpTo(m){const got=[];for(const k of jobSkills(m))if(!m.learned[k]){m.learned[k]=1;got.push(k);}return got;}
// 1匹ずつ数える解放条件
function jobUnlocked(m,job,G){
  const J=JOBS[job];if(J.tier===1)return true;
  return J.req.every(r=>m.mastered[r]);
}
function canChangeJob(G){return !!(G&&G.flags&&G.flags.jobChange);}
// 転職したとき、その職業で何レベルから始まるか
function jobStartLv(m,job){if(m.mastered[job])return JOBS[job].cap;const p=(m.jobLv||{})[job];return p?Math.min(p.lv,JOBS[job].cap):1;}
function changeJob(m,job){
  if(!jobUnlocked(m,job))return false;
  // 職業ごとのレベルを覚えておく。戻ったときは前回のレベルから（極めた職業はレベル上限のまま）
  m.jobLv=m.jobLv||{};
  if(m.job)m.jobLv[m.job]={lv:m.lv,exp:m.exp};
  const prev=m.jobLv[job];
  m.job=job;
  if(m.mastered[job]){m.lv=JOBS[job].cap;m.exp=0;}
  else if(prev){m.lv=Math.min(prev.lv,JOBS[job].cap);m.exp=prev.exp||0;}
  else{m.lv=1;m.exp=0;}
  learnUpTo(m);
  // 今の職業のスキルが枠にあったら外す
  m.slots=m.slots.filter(k=>SKILLS[k].job!==job);
  const d=derived(m);m.hp=d.maxhp;m.mp=d.maxmp;m.poison=false;return true;
}
// 経験値。返り値はメッセージ
// 経験者ボーナス：上級職を 1つでも 極めた仲間は、基本職の 経験値が 3倍（2回目以降の 基本職育成を 短くする）
const VET_MUL=3;
function vetBonus(m){return JOBS[m.job].tier===1&&Object.keys(m.mastered||{}).some(j=>m.mastered[j]&&JOBS[j]&&JOBS[j].tier>=2);}
function gainExp(m,amt){
  const out=[],J=JOBS[m.job];if(m.hp<=0)return out;
  if(vetBonus(m))amt*=VET_MUL;
  m.totalExp+=amt;
  if(m.lv>=J.cap)return out;
  m.exp+=amt;
  while(m.lv<J.cap&&m.exp>=expNext(m.job,m.lv)){
    m.exp-=expNext(m.job,m.lv);const before=derived(m);m.lv++;const after=derived(m);
    out.push(`${m.name}は レベル${m.lv}に あがった！`);
    m.hp=after.maxhp;m.mp=after.maxmp; // 前作と同じく、レベルアップで全回復（テンポのため）
    if(m.lv>=J.cap){const before=Object.keys(JOBS).filter(j=>jobUnlocked(m,j));m.mastered[m.job]=true;m.exp=0;out.push(`${m.name}は ${J.name}を きわめた！`);
      for(const j of Object.keys(JOBS))if(!before.includes(j)&&jobUnlocked(m,j))out.push(`${m.name}は ${JOBS[j].name}に 転職できるように なった！`);}
    for(const k of learnUpTo(m))out.push(`${m.name}は「${SKILLS[k].name}」を おぼえた！`);
  }
  return out;
}

function mkEnemy(f,arch,opt){

  else e={hp:Math.round(v('hp')*A.hp),atk:Math.round(v('atk')*A.atk),def:Math.round(v('def')*A.def),spd:Math.round(v('spd')*A.spd),
    exp:Math.round(v('exp')*Math.max(1,A.hp)),gold:Math.round(v('gold')*Math.max(1,A.hp)),acts:A.acts||1,moves:A.moves,
    counter:A.counter,reflect:A.reflect,evade:A.evade,prio:A.prio,mag:Math.round(v('atk')*.55*(A.mag||0))};
  if(opt.boss){const B=CONFIG.boss[opt.boss];e.hp=Math.round(v('hp')*B.hp);e.atk=Math.round(v('atk')*B.atk);e.def=Math.round(v('def')*B.def);e.spd=Math.round(v('spd')*1.1);
    e.exp=Math.round(v('exp')*B.exp);e.gold=Math.round(v('gold')*B.gold);e.boss=true;e.acts=opt.boss==='big'&&f>=20?2:1;
    e.moves=[{n:'こうげき',k:'atk',w:3},{n:'つよいこうげき',k:'atk',pow:1.6,w:2},{n:'あばれまわる',k:'all',pow:.7,w:2},{n:'どくのいき',k:'all',pow:.4,poison:.35,w:f>=10?1:0}];
    // エリアが深いほど、ボスの技が増える
    if(f>=15)e.moves.push({n:'ねむりのうた',k:'sleepAll',rate:.25,w:1});
    if(f>=25)e.moves.push({n:'かきけす',k:'dispel',w:1});

    if(f>=40)e.moves.push({n:'ねらいうち',k:'snipe',pow:1.5,w:1});
    // 魔法とデバフも深いほど増える
    e.mag=Math.round(v('atk')*.55*1.2);
    if(f>=25)e.moves.push({n:'まほうの あらし',k:'magicAll',pow:.7,w:1});
    if(f>=30)e.moves.push({n:'よわらせる',k:'debuffAll',st:'atk',w:1});

  return e;
}

  stunner:'octo',jammer:'devil',bomber:'toad',medic:'honey',sniper:'eagle',counter:'crab',mirror:'lyre',charger:'croc',evasive:'ffox',mage:'ray',

// 色違いの名前（エリアごと）。B21〜 で前作などの動物が色違いで出る。技を1つ足す（STAGE3.md）
const AREA_COLOR=['','','あお','きん','くろ'];
const COLOR_MOVE={'あお':{n:'みずを はく',k:'magic',pow:.8,w:1},'きん':{n:'まぶしい ひかり',k:'debuffAll',st:'atk',w:1},'くろ':{n:'やみの いき',k:'magicAll',pow:.5,w:1}};
const areaIdx=f=>Math.min(4,Math.floor((f-1)/10));
function floorGroups(f){
  return {pool:POOL20.filter(([a,b])=>f>=a&&f<=b).map(x=>x[2]),metalRate:.04};
}
// 動物か種類から、敵を1体つくる。'c:動物' は色違い。どれでもなければ種類（ARCH）に動物を当てる
function mkMob(f,key){
  let id=key,arch,A,color='';
  if(key.startsWith('c:')){id=key.slice(2);A=ANIMALS[id];color=AREA_COLOR[areaIdx(f)];}
  else A=ANIMALS[key];
  if(A)arch=typeof A.arch==='function'?A.arch(f):A.arch;
  else{arch=key;id=ARCH_ANIMAL[key]||'dingo';A=ANIMALS[id];color=AREA_COLOR[areaIdx(f)];}
  const e=mkEnemy(f,arch,{name:color+A.name,weak:A.weak||[]});
  e.id=id;e.color=color;e.look={spr:A.spr,pal:A.pal,s:A.s||1,tint:color};
  if(A.moves&&!ARCH[arch].metal)e.moves=A.moves;
  if(color&&COLOR_MOVE[color]&&e.moves){e.moves=e.moves.concat([COLOR_MOVE[color]]);if(!e.mag)e.mag=Math.round(curve('atk',f)*.55*.8);}
  if(f>=31&&f<=40)e.gold=Math.round(e.gold*1.5); // オパールの層はお金が多い
  return e;
}
function rollGroup(f,r,lure){
  const G=floorGroups(f),mul=lure?LURE_MUL:1;
  if(f>=31&&r()<METAL_RATE.goldEchidna*mul)return [mkMob(f,'goldEchidna')];
  if(f>=21&&r()<METAL_RATE.opalEchidna*mul)return [mkMob(f,'opalEchidna')];
  if(r()<G.metalRate*mul){const n=f>=11&&r()<.3?2+(r()<.4?1:0):1;return Array.from({length:n},()=>mkMob(f,'echidna'));}
  const g=G.pool[Math.floor(r()*G.pool.length)];
  return g.map(a=>mkMob(f,a));
}

// ---------- 戦闘 ----------
function aliveParty(B){return B.party.map((m,i)=>i).filter(i=>B.party[i].hp>0);}
function aliveEnemies(B){return B.enemies.map((e,i)=>i).filter(i=>B.enemies[i].hp>0);}
function newBattle(G,enemies){
  const cnt={};enemies.forEach(e=>cnt[e.name]=(cnt[e.name]||0)+1);const used={};
  enemies.forEach(e=>{if(cnt[e.name]>1){used[e.name]=(used[e.name]||0)+1;e.name+=' '+'ABCD'[used[e.name]-1];}});
  G.party.forEach(m=>{m.kiai=0;m.bst={};m.cheer=0;});
  const B={party:G.party,inv:G.inv,enemies,buff:{},pdebuff:{},over:null,turn:0,boss:enemies.some(e=>e.boss),revived:{},marks:{},stance:{},kamae:{},shelter:0,taunt:null,eguard:null};
  const ps=G.party.filter(m=>m.hp>0).map(m=>derived(m).p);
  G.party.forEach(m=>{if(derived(m).p.startKiai)m.kiai=kiaiCap(m);});
  if(ps.some(p=>p.startCure))G.party.forEach(m=>{m.poison=false;});
  return B;
}
function elemMult(e,el){if(!el)return 1;return e.weak.includes(el)?1.5:1;}
// 物理ダメージ：前作と同じ「こうげき − ぼうぎょ÷2」（決定）。足りないときは1〜2
function rawDmg(atk,def){return atk-def/2;}
// 1ダメージ（1〜2）になった攻撃の数を数える（シミュレーター用）。side: 'p'=仲間が受けた, 'e'=敵が受けた
const DMG_STATS={p:[0,0],e:[0,0]};
function physDmg(atk,def,pow,r,side){let b=rawDmg(atk,def);if(side){DMG_STATS[side][1]++;if(b<2)DMG_STATS[side][0]++;}if(b<2)b=1+r()*1.5;return Math.max(1,Math.round(b*(.85+r()*.3)*(pow||1)));}
function buffPow(B,k,party){const t=B.buff[k];if(!t||t.turns<=0)return 1;return 1+(CONFIG.buff[k]-1)*(1+t.pow);}
function buffEva(B){const t=B.buff.eva;return t&&t.turns>0?.25*(1+t.pow):0;}
function bstOf(m){return m.bst||(m.bst={});}
function pinchMul(m,d){return d.p.pinch&&m.hp>0&&m.hp<d.maxhp*.3?1+d.p.pinch:1;}
function memberAtk(B,m){const d=derived(m),b=bstOf(m);
  return d.atk*buffPow(B,'atk')*(B.pdebuff&&B.pdebuff.atk>0?CONFIG.debuff.atk:1)*(1+CONFIG.kiaiPow*(m.kiai||0))*(b.rage>0?1.4:1)*(b.berserk>0?1.6:1)*(m.poison&&d.p.poisonAtk?1+d.p.poisonAtk:1)*(1+(d.p.killAtk||0)*(b.kills||0))*pinchMul(m,d);}
function memberDef(B,m){const d=derived(m),b=bstOf(m);
  return d.def*buffPow(B,'def')*(B.pdebuff&&B.pdebuff.def>0?CONFIG.debuff.def:1)*(m.poison?CONFIG.poisonDefDown:1)*(1+(d.p.kiaiDef||0)*(m.kiai||0))*(b.berserk>0?.5:1)*pinchMul(m,d);}
function memberSpd(B,m){const d=derived(m);return d.spd*buffPow(B,'spd')*pinchMul(m,d);}
function memberMag(B,m,e){const d=derived(m);
  return d.mag*(1+(d.p.kiaiMag||0)*(m.kiai||0))*pinchMul(m,d)*(e&&d.p.statusMagPow&&Object.keys(e.st).some(k=>e.st[k]>0)?1+d.p.statusMagPow:1);}
function kiaiCap(m){return CONFIG.kiaiMax+(derived(m).p.kiaiMax||0);}
function bestEl(e){return e.weak[0]||null;}
function enemyDef(e){return e.def*(e.st.defdn>0?CONFIG.debuff.def-(e.dpow||0):1)*(e.st.poison>0?CONFIG.poisonDefDown:1);}
function enemyAtk(e){return e.atk*(e.st.atkdn>0?CONFIG.debuff.atk-(e.dpow||0):1)*(e.ebuff>0?1.3:1);}
function enemyMag(e){return (e.mag||0)*(e.st.atkdn>0?CONFIG.debuff.atk:1)*(e.ebuff>0?1.3:1);}
// 状態異常がかかる確率（画面にも出す予定）
const DEBUFF_ST={atkdn:1,defdn:1,curse:1,blind:1};
function statusChance(B,m,S,e){
  if(e.metal)return 0;
  const p=m?passives(m):{};
  let c=S.rate*(1+(p.statusRate||0));
  if(e.boss||e.statusMul){
    if(DEBUFF_ST[S.st])c*=CONFIG.bossDebuffRate*(e.debuffRes||1);
    else if(S.st==='poison')c*=CONFIG.bossPoisonRate*(e.debuffRes||1);
    else c*=(e.boss?CONFIG.bossStatusRate:e.statusMul)*Math.pow(CONFIG.bossStatusRepeat,e.res[S.st]||0);
  }
  return Math.min(.95,c);
}
function skillDmgEstimate(B,m,S,e){
  const d=derived(m);
  if(S.kind==='mag'){if(e.metal||e.reflect)return 0;const el=S.el==='best'?bestEl(e):S.el;return (S.base+memberMag(B,m,e)*S.k)*elemMult(e,el);}
  if(S.kind==='phys'||S.kind==='finisher'){if(e.metal)return 1;
    const pow=S.kind==='finisher'?(S.hitsPerKiai?S.pow*(1+(m.kiai||0)):S.pow+S.perKiai*(m.kiai||0)):S.pow*(S.hits||1);
    const def=S.ignoreDef?0:enemyDef(e);
    return Math.max(1,rawDmg(memberAtk(B,m),def))*pow*elemMult(e,S.el)*(1-(e.evade||0))*(e.counter?.7:1);}
  return 0;
}

// おまかせ（どの職業・引き継ぎスキルの組み合わせでも動くよう、スキルの種類で判断する）
function autoCmd(B,i){
  const m=B.party[i],d=derived(m),en=aliveEnemies(B),sk=skillsOf(m);
  const P=B.party;
  const low=j=>P[j].hp/derived(P[j]).maxhp;
  const silenced=m.bst&&m.bst.silence>0;
  const can=k=>sk.includes(k)&&m.mp>=(SKILLS[k].mp||0)&&SKILLS[k].kind!=='passive'&&!(silenced&&(SKILLS[k].mp||0)>0);
  const ofKind=(kind,f)=>sk.filter(k=>SKILLS[k].kind===kind&&can(k)&&(!f||f(SKILLS[k])));
  const E=j=>B.enemies[j];
  const metal=en.find(j=>E(j).metal);
  const saveMp=!B.boss&&m.mp<d.maxmp*.3;
  // ふつうの攻撃の相手：回復役などを先に。反撃・よける敵は後回し
  const weakest=()=>en.slice().sort((a,b)=>{const pa=(E(a).prio?-1e6:0)+(E(a).counter||E(a).evade?1e6:0),pb=(E(b).prio?-1e6:0)+(E(b).counter||E(b).evade?1e6:0);return pa+E(a).hp-(pb+E(b).hp);})[0];
  const strongest=()=>en.slice().sort((a,b)=>E(b).hp-E(a).hp)[0];
  // 1. たおれた仲間
  const dead=P.map((x,j)=>j).filter(j=>P[j].hp<=0);
  if(dead.length){const rv=ofKind('revive');if(rv.length)return {k:'skill',s:rv[0],t:dead[0]};if(B.inv.leaf>0&&aliveParty(B).length<=2)return {k:'item',item:'leaf',t:dead[0]};}
  // 2. 回復
  const hurt=aliveParty(B).filter(j=>low(j)<.5).sort((a,b)=>low(a)-low(b));
  const heals=ofKind('heal');
  if(hurt.length>=2){const h=heals.filter(k=>SKILLS[k].tgt==='allies').sort((a,b)=>SKILLS[b].base-SKILLS[a].base);if(h.length)return {k:'skill',s:h[0]};}
  if(hurt.length){const h=heals.filter(k=>SKILLS[k].tgt==='ally');if(h.length)return {k:'skill',s:h[0],t:hurt[0]};
    const ha=heals.filter(k=>SKILLS[k].tgt==='allies');if(ha.length)return {k:'skill',s:ha[0]};
    if(low(hurt[0])<.3){for(const it of ['herb3','herb2','herb'])if(B.inv[it]>0&&(hurt[0]===i||!heals.length))return {k:'item',item:it,t:hurt[0]};}}
  // 3. ねむり・まひ・毒をなおす
  const bs=j=>P[j].bst||{};
  const stuck=aliveParty(B).filter(j=>j!==i&&(bs(j).sleep>0||bs(j).stun>0||(bs(j).silence>0&&skillsOf(P[j]).some(k=>SKILLS[k].kind==='heal'))));
  const cures=ofKind('cure'),cureAlls=ofKind('cureAll');
  const poi=aliveParty(B).filter(j=>P[j].poison&&!(bs(j).rage>0)&&!derived(P[j]).p.poisonAtk);
  if(cureAlls.length&&stuck.length+poi.length>=2)return {k:'skill',s:cureAlls[0]};
  if(stuck.length&&(cures.length||cureAlls.length))return cures.length?{k:'skill',s:cures[0],t:stuck[0]}:{k:'skill',s:cureAlls[0]};
  if(poi.length&&(cures.length||cureAlls.length)&&(B.boss||poi.length>=2||low(poi[0])<.6))return cures.length?{k:'skill',s:cures[0],t:poi[0]}:{k:'skill',s:cureAlls[0]};
  // 3b. ふっかつのいのり：ボス戦や敵が多いとき、HPがいちばん少ない仲間に
  const marks=ofKind('mark');
  if(marks.length&&(B.boss||en.length>=3)&&!aliveParty(B).some(j=>B.marks[j])){
    const t=aliveParty(B).sort((a,b)=>derived(P[a]).maxhp-derived(P[b]).maxhp)[0];return {k:'skill',s:marks[0],t};}
  // 3c. 回復役のMP
  const mph=ofKind('mpheal');
  if(mph.length&&aliveParty(B).some(j=>j!==i&&((skillsOf(P[j]).some(k=>SKILLS[k].kind==='heal')&&P[j].mp<derived(P[j]).maxmp*.35)||P[j].mp<derived(P[j]).maxmp*.2)))return {k:'skill',s:mph[0]};
  // 3d. いのちすい：自分が弱っているとき
  const drains=ofKind('mag',S=>S.drain);if(drains.length&&low(i)<.55&&en.length)return {k:'skill',s:drains[0],t:B.boss?en[0]:strongest()};
  // 4. メタル
  if(metal!==undefined)return {k:'attack',t:metal};
  // 5. 自分を強くする・歌・応援（ボス戦、または敵が多いとき）
  const tough0=B.boss||en.some(j=>E(j).hp>d.atk*3);
  if(ofKind('rage').length&&!m.poison&&!(bs(i).rage>0)&&tough0&&low(i)>.5)return {k:'skill',s:ofKind('rage')[0]};
  if(ofKind('berserk').length&&B.boss&&!(bs(i).berserk>0)&&low(i)>.6)return {k:'skill',s:ofKind('berserk')[0]};
  if(B.boss||en.length>=3){
    const songs=ofKind('buff');
    const need=b=>!(B.buff[b]&&B.buff[b].turns>1);
    const allS=songs.find(k=>SKILLS[k].buff==='all');
    if(allS&&['atk','def','spd'].filter(need).length>=2)return {k:'skill',s:allS};
    for(const b of ['atk','def','spd','eva']){const s=songs.find(k=>SKILLS[k].buff===b);if(s&&need(b)&&(!saveMp||B.boss))return {k:'skill',s};}
    const ext=ofKind('extend').filter(k=>!SKILLS[k].kiai||(m.kiai||0)>=2);
    if(ext.length&&!P.some(x=>x.hp>0&&derived(x).p.buffForever)&&Object.values(B.buff).some(b=>b.turns>0&&b.turns<=1)&&Object.values(B.buff).filter(b=>b.turns>0).length>=(B.boss?1:2))return {k:'skill',s:ext[0]};
    const ch=ofKind('cheer');
    if(ch.length&&B.boss&&!P.some(x=>x.cheer)){const t=aliveParty(B).filter(j=>j!==i).sort((a,b)=>Math.max(derived(P[b]).atk,derived(P[b]).mag)-Math.max(derived(P[a]).atk,derived(P[a]).mag))[0];if(t!==undefined)return {k:'skill',s:ch[0],t};}
  }
  // 6. かばう・みをまもる（力をためた敵がいるときも）
  const charged=en.some(j=>E(j).charged);
  const guards=ofKind('guard').sort((a,b)=>(SKILLS[a].cut??1)-(SKILLS[b].cut??1));
  const hasGuard=x=>skillsOf(x).some(k=>SKILLS[k].kind==='guard');
  if(guards.length&&low(i)>.5&&(charged||(aliveParty(B).some(j=>j!==i&&low(j)<.35)&&(en.length>=2||B.boss))||(B.boss&&(SKILLS[guards[0]].cut??1)<=.4&&low(i)>.7&&B.turn%3===2)))return {k:'skill',s:guards[0]};
  if(charged&&!guards.length&&low(i)<.6&&!aliveParty(B).some(j=>j!==i&&hasGuard(P[j])))return {k:'defend'};
  // あなぐら：大わざの 予告・ためている敵・ボス戦で みんな 弱っているとき
  const sh=ofKind('shelter');
  if(sh.length){const tele=en.some(j=>{const e=B.enemies[j];return e.plan&&e.plan[(e.pi||0)%e.plan.length].tele;});const avg=aliveParty(B).reduce((a,j)=>a+low(j),0)/aliveParty(B).length;
    if(tele||charged||(B.boss&&avg<.5&&B.turn>1))return {k:'skill',s:sh[0]};}
  // 構え：かまえ（ボス戦）
  const st=ofKind('stance');
  const hide=st.find(k=>SKILLS[k].stance==='hide');if(hide&&low(i)<.25&&!heals.length)return {k:'skill',s:hide};
  const kam=st.find(k=>SKILLS[k].stance==='counter');if(kam&&!(B.kamae[i]>0)&&low(i)>.6&&B.boss&&B.turn>1)return {k:'skill',s:kam};
  // ひきつける：かたい仲間が、弱った仲間を守る
  const tn=ofKind('taunt');if(tn.length&&low(i)>.6&&!(B.taunt&&B.taunt.turns>0)&&(aliveParty(B).some(j=>j!==i&&low(j)<.35)||(charged&&B.boss)))return {k:'skill',s:tn[0]};
  // 7. 状態異常・デバフ（ボスや強い敵に）
  const sts=ofKind('status');
  if(sts.length&&!saveMp){
    const tough=B.boss?en:en.filter(j=>E(j).hp>d.atk*2.5);
    let best=null,bs=0;
    for(const k of sts){const S=SKILLS[k];
      const ts=S.tgt==='enemies'?en:tough;
      let sc=0;for(const j of ts){const e=E(j);if(e.st[S.st]>0)continue;const c=statusChance(B,m,S,e);
        const val={poison:B.boss?3:1.6,defdn:B.boss?2.2:1,atkdn:B.boss?2:1,stun:B.boss?2.5:1.4,sleep:B.boss?1.5:1.6,curse:B.boss?3.5:1.6,confuse:B.boss?1.5:1.3,blind:B.boss?2.5:1.2}[S.st]||1;sc+=c*val;}
      if(S.tgt==='enemies'&&en.length<2&&!B.boss)sc*=.5;
      if(sc>bs){bs=sc;best=k;}}
    if(best&&bs>=(B.boss?.5:.9)){const S=SKILLS[best];const t=S.tgt==='enemies'?null:(B.boss?en[0]:tough.find(j=>!(E(j).st[S.st]>0)));if(S.tgt==='enemies'||t!==undefined)return {k:'skill',s:best,t};}
  }
  // 8. 攻撃スキル
  if(!saveMp||B.boss){
    let best=null,bs=0,bt=null;
    const atkLike=sk.filter(k=>['phys','mag','finisher'].includes(SKILLS[k].kind)&&can(k));
    const plain=en.reduce((s,j)=>Math.max(s,Math.max(1,rawDmg(memberAtk(B,m),enemyDef(E(j))))),0);
    for(const k of atkLike){const S=SKILLS[k];
      if(S.kind==='finisher'&&(m.kiai||0)<Math.min(3,kiaiCap(m)))continue;
      if(S.kiaiCost&&(m.kiai||0)<S.kiaiCost)continue;
      if(S.tgt==='enemies'){let sc=0;for(const j of en)sc+=Math.min(E(j).hp,skillDmgEstimate(B,m,S,E(j)));if(sc>bs){bs=sc;best=k;bt=null;}}
      else{const t=B.boss?en[0]:strongest();const sc=Math.min(E(t).hp,skillDmgEstimate(B,m,S,E(t)));if(sc>bs){bs=sc;best=k;bt=t;}}}
    if(best&&bs>plain*1.25)return {k:'skill',s:best,t:bt};
  }
  return {k:'attack',t:weakest()};
}

// 画面用：その時点の、仲間カードに出す状態（バフ・デバフ・ねむりなど）。B.track のときだけ記録する
function visState(B){return {pd:{atk:B.pdebuff.atk||0,def:B.pdebuff.def||0},bf:Object.fromEntries(Object.keys(B.buff).map(k=>[k,B.buff[k].turns||0])),mk:Object.assign({},B.marks),
  m:B.party.map((m,i)=>({kamae:(B.kamae&&B.kamae[i])||0,sleep:(m.bst&&m.bst.sleep)||0,stun:(m.bst&&m.bst.stun)||0,silence:(m.bst&&m.bst.silence)||0,rage:(m.bst&&m.bst.rage)||0,kiai:m.kiai||0}))};}
const STAT_JP={atk:'こうげき',def:'ぼうぎょ',spd:'すばやさ'};
// かまえ（5ターン）：うける 物理ダメージ×cut、はんげき×pow
const KAMAE={cut:.7,pow:2};
function battleTurn(B,cmds,r){

  const acts=[];
  B.stance={};B.shelter=0;
  P.forEach((m,i)=>{if(m.hp>0&&cmds[i]){const c=cmds[i];const S=c.k==='skill'?SKILLS[c.s]:null;
    const pri=(S&&['guard','stance','shelter'].includes(S.kind))||c.k==='defend'?100:0;acts.push({side:'p',i,c,o:pri+memberSpd(B,m)*(.75+r()*.5)});
    const xa=derived(m).p.extraAct;if(xa&&r()<xa)acts.push({side:'p',i,c:{k:'attack',t:c.t},o:memberSpd(B,m)*(.5+r()*.3),extra:true});}});
  EN.forEach((e,i)=>{if(e.hp>0){const n=e.secret&&EN.some(z=>z!==e&&z.hp>0)?1:e.acts||1; // ドロップベアは コアラが いる あいだ 1回（指示を 出している）。最後は 3回
    for(let k=0;k<n;k++)acts.push({side:'e',i,o:e.spd*(.75+r()*.5)-k*30});}});
  acts.sort((a,b)=>b.o-a.o);
  const guard={},defend={},partyP=()=>P.filter(x=>x.hp>0).map(x=>derived(x).p);
  const resist=()=>partyP().some(p=>p.statusResist)?.5:1;
  // 状態異常が かかるか。おまもりで ふせいだときは 知らせる
  const tryStatus=(m,st,rate)=>{const x=r();if(x<rate*charmMul(m,st))return true;if(x<rate&&charmMul(m,st)<1)ev.push({t:'msg',text:`${m.name}の ${CHARMS[m.charm].name}が ${ST_JP2[st]}を ふせいだ！`});return false;};
  for(const a of acts)if(a.side==='p'&&a.c.k==='defend')defend[a.i]=1;
  const checkEnd=()=>{
    {const sb=EN.find(z=>z.secret);if(sb&&sb.hp>0&&!sb.final&&sb.callN>=SECRET_CALLS.length&&!EN.some(z=>z!==sb&&z.hp>0)){
      sb.final=true;sb.acts=SECRET_FINAL.acts;const amt=Math.min(sb.max-sb.hp,Math.round(sb.max*SECRET_FINAL.heal));sb.hp+=amt;
      ev.push({t:'msg',text:`コアラたちが みんな たおれた…\n${sb.name}は きあいで 立ちあがった！`,dbFinal:true});ev.push({t:'heal',side:'e',i:EN.indexOf(sb),amt});
      ev.push({t:'msg',text:`${sb.name}の いかりが ばくはつした！ ${SECRET_FINAL.acts}回 行動するように なった！`});}}
    if(!aliveEnemies(B).length){B.over=EN.every(e=>e.fled)?'fled':'win';return true;}
    if(!aliveParty(B).length){B.over='lose';return true;}return false;};
  const metalDmg=(e,dmg,crit)=>e.metal?(crit?3:1):dmg;
  const addKiai=(m,n)=>{const p=derived(m).p;if(p.kiai||n)m.kiai=Math.min(kiaiCap(m),(m.kiai||0)+(n||p.kiai));};
  const hitEnemy=(i,dmg,extra)=>{const e=EN[i];if(e.hp<=0)return;if(e.secret&&!e.final&&dmg>=e.hp){dmg=e.hp-1;if(!B.dbHoldMsg){B.dbHoldMsg=1;ev.push({t:'msg',text:`${e.name}は こらえた！ コアラたちが ささえている！`});}}if(e.hidden){ev.push({t:'msg',text:`${e.name}は あなに かくれている！`});return;}if(B.eshelter>0&&!e.metal)dmg=Math.max(1,Math.round(dmg*.5));e.hp=Math.max(0,e.hp-dmg);ev.push(Object.assign({t:'hit',side:'e',i,dmg,hp:e.hp},extra||{}));
    if(e.st.sleep>0&&e.hp>0&&r()<.5){e.st.sleep=0;ev.push({t:'msg',text:`${e.name}は めをさました！`});}
    if(e.hp<=0){ev.push({t:'die',side:'e',i});
      if(extra&&extra.by){bstOf(extra.by).kills=(bstOf(extra.by).kills||0)+1;}
      if(e.st.poison>0){const ph=partyP().reduce((a,p)=>Math.max(a,p.poisonKillHeal||0),0);if(ph)for(const x of P)if(x.hp>0)x.hp=Math.min(derived(x).maxhp,x.hp+Math.ceil(derived(x).maxhp*ph));}}};
  const applyStatus=(m,S,i)=>{const e=EN[i];if(e.hp<=0)return;
    if(S.st2&&!(e.st[S.st2]>0)&&r()<statusChance(B,m,{rate:S.rate2,st:S.st2},e)){e.st[S.st2]=e.boss?1:2;if(e.boss)e.res[S.st2]=(e.res[S.st2]||0)+1;ev.push({t:'status',side:'e',i,st:S.st2,text:`${e.name}は ${ST_NAME[S.st2]}に なった！`});}
    if(e.st[S.st]>0){ev.push({t:'msg',text:`${e.name}は すでに ${ST_NAME[S.st]}だ。`});return;}
    const c=statusChance(B,m,S,e);
    // 敵の こうげきアップと こうげきダウンは 打ち消しあう
    if(S.st==='atkdn'&&e.ebuff>0){if(r()<c){e.ebuff=0;ev.push({t:'status',side:'e',i,st:'atkdn',text:`${e.name}の こうげきアップが 打ち消された！`});}else ev.push({t:'msg',text:`${e.name}には きかなかった。`});return;}
    if(r()<c){const turns=S.st==='poison'?99:S.st==='sleep'?(e.boss?1:2+Math.floor(r()*2)):S.st==='stun'?(e.boss?1:2):CONFIG.debuff.turns+(DEBUFF_ST[S.st]&&m?passives(m).debuffTurns||0:0);
      e.st[S.st]=turns;if(e.boss||e.statusMul)e.res[S.st]=(e.res[S.st]||0)+1;
      if(S.st==='curse'){if(e.ebuff>0)e.ebuff=0;else e.st.atkdn=turns;e.st.defdn=turns;}
      if(S.st==='poison')e.poisonPow=1+(m?passives(m).poisonPow||0:0);
      if(DEBUFF_ST[S.st]&&m)e.dpow=Math.max(e.dpow||0,passives(m).debuffPow||0);
      ev.push({t:'status',side:'e',i,st:S.st,text:`${e.name}は ${ST_NAME[S.st]}に なった！`});}
    else ev.push({t:'msg',text:`${e.name}には きかなかった。`});};
  const autoRevive=()=>{ // ふっかつのいのり（とくぎ）、えいえんのいのり（パッシブ）
    for(let j=0;j<P.length;j++){const x=P[j];if(x.hp>0||!B.marks[j])continue;
      delete B.marks[j];x.hp=Math.ceil(derived(x).maxhp/2);ev.push({t:'revive',i:j,hp:x.hp,text:`いのりが とどき、${x.name}は おきあがった！`});}
    for(let j=0;j<P.length;j++){const x=P[j];if(x.hp>0||B.revived[j])continue;
      const holder=P.find(y=>y.hp>0&&derived(y).p.autoRevive);if(!holder)return;
      B.revived[j]=1;x.hp=Math.ceil(derived(x).maxhp/2);ev.push({t:'revive',i:j,hp:x.hp,text:`いのりが とどき、${x.name}は おきあがった！`});}};
  // 必ず はんげき（かまえ・ふどうのかまえ）：単体でも 全体でも、かわしても。ねむり・まひの あいだは しない。同じ敵の 1回の行動には 1度だけ
  const ctrDone=new Set();
  const sureCounter=(tgt,ei,guarded,dp)=>{const m=P[tgt];if(ei===undefined||ctrDone.has(tgt+':'+ei))return false;if(m.bst&&(m.bst.sleep>0||m.bst.stun>0))return false;
    return B.stance[tgt]==='counter'||B.kamae[tgt]>0||(guarded&&!!dp.guardCounter);};
  const doCounter=(tgt,ei)=>{ctrDone.add(tgt+':'+ei);counter(tgt,ei);};
  const hitParty=(i,dmg,extra,poison,phys,ei,stun,allPhys)=>{
    let tgt=i;
    if(phys&&ei!==undefined&&EN[ei]&&EN[ei].st.blind>0&&r()<.5){ev.push({t:'msg',text:`${EN[ei].name}の こうげきは はずれた！`});return;}
    let guarded=false;
    if(guard.who!==undefined&&guard.who!==i&&P[guard.who].hp>0){tgt=guard.who;guarded=true;const gp=derived(P[tgt]).p;
      const cut=Math.min(guard.cut??1,gp.guardCut??CONFIG.guardCut);dmg=Math.max(1,Math.round(dmg*cut));ev.push({t:'msg',text:`${P[tgt].name}が おしりで かばった！`});
      if(gp.guardHeal&&P[i].hp>0){const x=P[i];x.hp=Math.min(derived(x).maxhp,x.hp+Math.ceil(derived(x).maxhp*gp.guardHeal));}}
    else if(defend[i])dmg=Math.max(1,Math.round(dmg*.5));
    const m=P[tgt],dp=derived(m).p;
    if(B.stance[tgt]==='hide'){ev.push({t:'msg',text:`${m.name}は あなに かくれている！`});return;}
    if(B.kamae[tgt]>0&&(phys||allPhys))dmg=Math.max(1,Math.round(dmg*KAMAE.cut));
    if(B.shelter)dmg=Math.max(1,Math.round(dmg*B.shelter));
    if(phys&&r()<CONFIG.evadeBase+(dp.evade||0)+buffEva(B)){ev.push({t:'msg',text:`${m.name}は ひらりと かわした！`});
      if(sureCounter(tgt,ei,guarded,dp))doCounter(tgt,ei);else if(dp.counter&&ei!==undefined&&r()<dp.counter)counter(tgt,ei);return;}
    m.hp=Math.max(0,m.hp-dmg);ev.push(Object.assign({t:'hit',side:'p',i:tgt,dmg,hp:m.hp},extra||{}));
    if(m.hp<=0){m.poison=false;m.kiai=0;ev.push({t:'die',side:'p',i:tgt});autoRevive();return;}
    if(dp.hurtKiai)addKiai(m,dp.hurtKiai);
    poison=poison?poison*resist():0;stun=stun?stun*resist():0;
    if(poison&&!m.poison&&tryStatus(m,'poison',poison)){m.poison=true;ev.push({t:'status',side:'p',i:tgt,st:'poison',text:`${m.name}は どくに おかされた！`});}
    m.bst=m.bst||{};
    if(m.bst.sleep>0&&r()<.5){m.bst.sleep=0;ev.push({t:'msg',text:`${m.name}は めをさました！`});}
    if(stun&&tryStatus(m,'stun',stun)){m.bst.stun=1;ev.push({t:'status',side:'p',i:tgt,st:'stun',text:`${m.name}は しびれた！`});}
    if((phys||allPhys)&&sureCounter(tgt,ei,guarded,dp))doCounter(tgt,ei);
    else if(phys&&ei!==undefined&&dp.counter&&r()<dp.counter)counter(tgt,ei);};
  const counter=(pi,ei)=>{const m=P[pi],e=EN[ei];if(!e||e.hp<=0||m.hp<=0)return;
    ev.push({t:'act',side:'p',i:pi,text:`${m.name}の カウンター！`});
    const dmg=metalDmg(e,physDmg(memberAtk(B,m),enemyDef(e),B.kamae[pi]>0?KAMAE.pow:1,r,'e'));hitEnemy(ei,dmg,{by:m,text:`${e.name}に ${dmg}の ダメージ！`});addKiai(m);};
  const pickEnemy=t=>{const al=aliveEnemies(B);
    if(B.eguard!=null&&EN[B.eguard]&&EN[B.eguard].hp>0&&B.eguard!==t&&al.includes(t)){ev.push({t:'msg',text:`${EN[B.eguard].name}が なかまを かばった！`});return B.eguard;}
    if(al.includes(t))return t;return al[Math.floor(r()*al.length)];};
  const physHit=(m,t,pow,o)=>{const e=EN[t];o=o||{};if(!e||e.hp<=0)return;

    const dmg=metalDmg(e,crit?Math.round(atk*(1.4+r()*.2)*pow):physDmg(atk,o.ignoreDef?0:enemyDef(e),pow,r,'e'),crit);
    hitEnemy(t,dmg,{crit,by:m,weak:elemMult(e,o.el)>1,text:`${e.name}に ${dmg}の ダメージ！`});
    const p=derived(m).p;if(p.atkPoison&&e.hp>0&&!e.st.poison&&r()<statusChance(B,m,{rate:p.atkPoison,st:'poison'},e)){e.st.poison=99;if(e.boss)e.res.poison=(e.res.poison||0)+1;e.poisonPow=1+(p.poisonPow||0);ev.push({t:'status',side:'e',i:t,st:'poison',text:`${e.name}は どくに なった！`});}
    if(e.counter&&e.hp>0&&!(e.st.sleep>0)&&!(e.st.stun>0)&&r()<e.counter){ev.push({t:'act',side:'e',i:t,text:`${e.name}の はんげき！`});
      const pi=P.indexOf(m);hitParty(pi,physDmg(enemyAtk(e),memberDef(B,m),1,r,'p'),null,0,false);}};
  // 画面用：直前の行動で 変わった HP・MP・どくを 仲間カードに 反映させる（回復の出来事が ない変化も ふくむ）
  const sync=()=>{if(B.track)ev.push({t:'sync',p:P.map(x=>({hp:x.hp,mp:x.mp,poison:!!x.poison}))});};
  for(const a of acts){
    sync();ctrDone.clear();
    if(B.over)break;

    for(const i of aliveParty(B)){const m=P[i];if(!m.poison)continue;const dm=Math.min(m.hp-1,Math.max(1,Math.floor(derived(m).maxhp*CONFIG.poisonDot)));if(dm>0){m.hp-=dm;ev.push({t:'hit',side:'p',i,dmg:dm,hp:m.hp,poison:true});}}
    for(const i of aliveEnemies(B)){const e=EN[i];if(!(e.st.poison>0))continue;
      const dm=Math.max(1,Math.floor(e.max*CONFIG.enemyPoisonDot*(e.boss?CONFIG.bossPoisonDot:1)*(e.poisonPow||1)));hitEnemy(i,dm,{poison:true});}
    for(const e of EN)for(const k of ['atkdn','defdn','curse','confuse','blind'])if(e.st[k]>0)e.st[k]--;
    const forever=partyP().some(p=>p.buffForever);
    if(!forever)for(const k in B.buff)if(B.buff[k].turns>0)B.buff[k].turns--;
    if(B.taunt&&B.taunt.turns>0)B.taunt.turns--;
    for(const k in B.pdebuff)if(B.pdebuff[k]>0)B.pdebuff[k]--;
    for(const k in B.kamae)if(B.kamae[k]>0)B.kamae[k]--;
    for(const e of EN)if(e.ebuff>0)e.ebuff--;
    // 予告：つぎに 大きな連携を する敵を 知らせる
    for(const j of aliveEnemies(B)){const e=EN[j];if(!e.plan||e.st.sleep>0||e.st.stun>0)continue;const nx=e.plan[(e.pi||0)%e.plan.length];if(nx.tele)ev.push({t:'msg',text:`${e.name}は ${nx.tele}`,tele:true});}
    if(B.eguard!=null&&--B.eguardT<=0)B.eguard=null;
    for(const x of P)if(x.bst&&x.bst.silence>0)x.bst.silence--;
    for(const i of aliveParty(B)){const m=P[i],b=bstOf(m),dd=derived(m);
      for(const k of ['rage','berserk'])if(b[k]>0)b[k]--;
      if(m.poison&&dd.p.poisonRegen)m.hp=Math.min(dd.maxhp,m.hp+Math.ceil(dd.maxhp*(dd.p.poisonRegen+CONFIG.poisonDot)));
      if(dd.p.pinchRegen&&m.hp<dd.maxhp*.3)m.hp=Math.min(dd.maxhp,m.hp+Math.ceil(dd.maxhp*dd.p.pinchRegen));}
    // だいちの めぐみ：持っている仲間が 立っていれば、仲間みんなの HP・MP が 毎ターン 回復（何人 持っていても 1回）
    {const rg=Math.max(0,...aliveParty(B).map(i=>passives(P[i]).partyRegen||0));
     if(rg>0){for(const i of aliveParty(B)){const m=P[i],dd=derived(m);m.hp=Math.min(dd.maxhp,m.hp+Math.ceil(dd.maxhp*rg));m.mp=Math.min(dd.maxmp,m.mp+Math.ceil(dd.maxmp*rg));}ev.push({t:'msg',text:'だいちの めぐみで みんなが すこし 回復した。'});}}
    // コアラの だいちの めぐみ・あなぐら
    {const kd=aliveEnemies(B).map(j=>EN[j]).find(e=>e.eregen);if(kd){for(const j of aliveEnemies(B)){const e=EN[j];e.hp=Math.min(e.max,e.hp+Math.ceil(e.max*kd.eregen));}ev.push({t:'msg',text:`${kd.name}の だいちの めぐみで コアラたちが 回復した。`});}}
    if(B.eshelter>0)B.eshelter--;
    checkEnd();
  }
  sync();
  return ev;
}
// 深い層ほど 経験値を ふやす（育成のテンポのため。オパールの層 1.5倍、B41〜 2倍）
const expFloorMul=f=>f>=41?2:f>=31?1.5:1;
function battleRewards(B){let exp=0,gold=0;for(const e of B.enemies){if(e.fled||e.hp>0)continue;exp+=Math.round(e.exp*expFloorMul(e.f||0));gold+=e.gold;}return {exp,gold};}

const streakOn=G=>!!(G.flags&&G.flags.streakTold);
const streakMul=n=>Math.min(STREAK.max,Math.round((1+STREAK.step*(n||0))*10)/10);
function giveRewards(G,B,mul=1){let {exp,gold}=battleRewards(B);exp=Math.round(exp*mul);G.gold+=gold;const msgs=[];for(const m of G.party)if(m.hp>0)msgs.push(...gainExp(m,exp));return {exp,gold,msgs};}

const PAL={o:'#2a1a12',b:'#86613f',l:'#a17a53',d:'#5e4128',f:'#a9845d',n:'#3f3230',nh:'#64544f',e:'#0d0806',w:'#ffffff',p:'#d1b796',c:'#c98a7a',k:'#e2d9ca',m:'#6e4f34',v:'#b89c7c'};

// ---------- shared pixel helpers ----------
function mkGrid(W,H){
  const g=new Array(W*H).fill(0),pt=new Uint8Array(W*H);
  const S=(x,y,c,p=9)=>{x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;g[y*W+x]=c;pt[y*W+x]=p;};
  const SE=(cx,cy,rx,ry,n,p,fn)=>{
    for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
      const dx=Math.abs((x+.5-cx)/rx),dy=(y+.5-cy)/ry;if(Math.pow(dx,n)+Math.pow(Math.abs(dy),n)<=1)S(x,y,fn(x,y,dy),p);}
  };
  const E=(cx,cy,rx,ry,p,fn)=>SE(cx,cy,rx,ry,2,p,fn);
  return {W,H,g,pt,S,SE,E};
}
// fluffy silhouette: little tufts on upper edges of fur parts
function fuzz(G,pids,maxY){
  const {W,H,g,pt}=G,add=[];
  for(let y=1;y<Math.min(H,maxY);y++)for(let x=1;x<W-1;x++){
    const i=y*W+x;if(!pids.includes(pt[i]))continue;
    if(!g[i-W]&&((x*5+y*3)%7===0))add.push([i-W,g[i]==='f'?'l':g[i],pt[i]]);
    else if(!g[i-1]&&((y*5+x)%6===0))add.push([i-1,g[i],pt[i]]);
    else if(!g[i+1]&&((y*7+x)%6===0))add.push([i+1,g[i],pt[i]]);
  }
  for(const [i,c,p] of add){g[i]=c;pt[i]=p;}
}
function outline(G){
  const {W,H}=G,out=G.g,fin=out.slice();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x;if(out[i])continue;
    if((x>0&&out[i-1])||(x<W-1&&out[i+1])||(y>0&&out[i-W])||(y<H-1&&out[i+W]))fin[i]='o';
  }
  return fin;
}
// grizzled frosting on fur: light tips scattered on the upper part
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;};
const frost=(x,y,r)=>r<.6&&hash(x,y)<(r<.3?.11:.05);

// ---------- side view ----------
const WW=48,WH=32,AX=20;
function renderWombat(o){
  const G=mkGrid(WW,WH),{g,pt,S,SE,E}=G;
  const sq=o.sq||0,low=o.low||0,bob=o.bob||0;
  const bcx=19,bcy=18+bob+low,brx=14.5*(1+sq),bry=7.6+(o.br||0)-sq*6;
  const hcx=29.5+(o.hx||0),hcy=bcy-.5+(o.hy||0);
  const claws=[];
  if(!o.noLegs){
    const legs=[[7,'d',0,0],[23,'d',1,1],[11,'b',1,0],[27,'b',0,1]];
    for(const [lx,c,ph,fr] of legs){
      let lift=0,sx=0;
      if(o.walk&&(!o.dig||fr)){ if(ph===o.wp){lift=1;sx=1;} }
      for(let y=Math.floor(bcy+5);y<=27-lift;y++)for(let x=lx+sx;x<lx+sx+3;x++)S(x,y,y>=26-lift?'d':c,1);
      if(fr)claws.push([lx+sx+3,27-lift],[lx+sx+3,26-lift]); else claws.push([lx+sx+3,27-lift]);
    }
  }
  const bsh=(x,y)=>{const r=(y+.5-(bcy-8))/16;return r<.22?(frost(x,y,r)?'f':'l'):r>.78?'d':(frost(x,y,r)?'f':'b');};
  const rearX=bcx-brx+1.2;
  E(bcx,bcy,brx,bry,2,(x,y)=>bsh(x,y));
  SE(bcx-6.5,bcy-.8,8.6,bry+1.1,2.25,2,(x,y)=>bsh(x,y));
  for(let y=0;y<WH;y++)for(let x=0;x<Math.floor(rearX);x++)if(pt[y*WW+x]===2){g[y*WW+x]=0;pt[y*WW+x]=0;}
  const K=1.28;
  // far ear
  E(hcx-5.6*K,hcy-5.6*K+(o.ear||0)*.6,1.5*K,2*K,4,()=>'d');
  // head
  const hsh=(x,y)=>{const r=(y+.5-(hcy-6*K))/(12*K);return r<.25?(frost(x,y,r)?'f':'l'):r>.8?'d':(frost(x,y,r)&&x<hcx+2?'f':'b');};
  E(hcx-1.5*K,hcy,6.3*K,5.7*K,3,hsh);
  SE(hcx+3.6*K,hcy+1.3*K,4.4*K,4*K,3.2,3,hsh);
  fuzz(G,[2,3],bcy+2);
  // near ear: small, pale rim
  const ey0=hcy-5.7*K-(o.ear>0?1:0)+(o.ear<0?1.4:0);
  E(hcx-3.4*K,ey0,1.6*K,2.1*K,4,(x,y,dy)=>dy<-.3?'p':'d');S(hcx-3.4*K-.6,ey0-2.1*K,'p',4);
  // nose: big bare matte nose
  const ncx=hcx+6.6*K,ncy=hcy+.4*K;
  SE(ncx,ncy,2.4*K,2.8*K,3,5,()=>'n');
  S(ncx-1.6,ncy-2.4,'nh',5);S(ncx-.6,ncy-2.4,'nh',5);S(ncx-1.6,ncy-1.4,'nh',5);
  S(ncx+1.5,ncy+.8,'e',5);S(ncx+.5,ncy+.8,'e',5);
  // eye: small round beady
  const ex=Math.floor(hcx+.8*K),ey=Math.floor(hcy-2.6*K);
  if(o.eye==='closed'){S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
  else if(o.eye==='half'){S(ex-1,ey,'e');S(ex,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
  else if(o.eye==='happy'){S(ex-1,ey+1,'e');S(ex,ey,'e');S(ex+1,ey+1,'e');}
  else if(o.eye==='strain'){S(ex-1,ey,'e');S(ex,ey+1,'e');S(ex-1,ey+2,'e');}
  else {S(ex,ey,'w');S(ex+1,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
  if(o.blush){S(hcx+1.4*K,hcy+2*K,'c');S(hcx+1.4*K+1,hcy+2*K,'c');}
  // mouth
  S(ncx-2.5,ncy+3.8,'o');S(ncx-1.5,ncy+3.8,'o');if(o.chew){S(ncx-2.5,ncy+4.8,'o');S(ncx-1.5,ncy+4.8,'o');}
  // joey
  if(o.joey>0){
    const jx=bcx+.5,jy=bcy+bry+2.5-o.joey;
    E(jx,jy,3.4,2.9,6,(x,y,dy)=>dy>.6?'b':'l');
    S(jx-2,jy-3,'p',6);S(jx-1,jy-3,'l',6);
    S(jx+1,jy-1,'e',6);S(jx+3,jy+.2,'n',6);S(jx+2,jy+.2,'n',6);
  }
  // inner edges
  const out=g.slice();
  for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){
    const i=y*WW+x,p=pt[i];if(!p)continue;
    for(const [qx,qy] of [[x-1,y],[x+1,y],[x,y+1],[x,y-1]]){
      if(qx<0||qy<0||qx>=WW||qy>=WH)continue;const q=pt[qy*WW+qx];
      if(p===3&&q===2&&(qx<x||qy>y)){out[i]='d';break;}
      if(p===6&&(q===2||q===1)){out[i]='o';break;}
      if(p===2&&q===1&&qy>y){out[i]='d';break;}
    }
  }
  G.g=out;
  const fin=outline(G);
  // claws & whiskers drawn over the outline
  const P=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<WW&&y<WH)fin[y*WW+x]=c;};
  for(const [x,y] of claws)P(x,y,'k');
  P(ncx-2.5,ncy+2.4,'v');P(ncx-1.5,ncy+3,'v');
  P(ncx-3,ncy+1.6,'v');P(ncx-4,ncy+1.8,'v');
  return {W:WW,H:WH,ax:AX,img:fin};
}

function renderFront(o){

  const fsh=(x,y)=>{const r=(y+.5-(bcy-bry))/(2*bry);return r<.18?(frost(x,y,r)?'f':'l'):r>.82?'d':(frost(x,y,r)?'f':'b');};

    const ex=cx+s*7.6,ey=hcy-7.4-eo;

  E(cx,hcy+3.8,6,3.6,5,()=>'l');
  // eyes: small, round, beady, wide-set
  for(const s of [-1,1]){
    const ex=Math.floor(cx+s*4.6-(s<0?1:0)),ey=Math.floor(hcy-1);
    if(o.eye==='closed'){S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
    else if(o.eye==='half'){S(ex,ey,'d');S(ex+1,ey,'d');S(ex,ey+1,'e');S(ex+1,ey+1,'e');S(ex+(s<0?0:1),ey+1,'e');}
    else if(o.eye==='happy'){S(ex,ey+1,'e');S(ex+1,ey,'e');S(ex+2,ey+1,'e');}
    else {S(ex,ey,'e');S(ex+1,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');S(ex+(s<0?0:0),ey,'w');}
  }
  if(o.blush){S(cx-7,hcy+2,'c');S(cx-6,hcy+2,'c');S(cx+6,hcy+2,'c');S(cx+7,hcy+2,'c');}
  // big bare nose
  // big bare nose: wide top, rounded bottom (shield shape), nostrils at the lower sides
  const ny=hcy+3.4+(o.nw||0);
  for(let y=Math.floor(ny-2.9);y<=ny+2.9;y++){const t=(y+.5-(ny-2.9))/5.8;let hw=4.7-2.4*t*t;if(t<.22)hw-=(.22-t)*6;
    for(let x=Math.floor(cx-hw);x<cx+hw;x++)S(x,y,t<.25?'nh':'n',6);}
  S(cx-3,ny+.6,'e',6);S(cx-2,ny+1.4,'e',6);S(cx+2,ny+.6,'e',6);S(cx+1,ny+1.4,'e',6);
  S(cx-.5,ny+2.2,'o',6);
  // mouth
  S(cx-.5,ny+3.3,'o');S(cx-1.5,ny+4,'o');S(cx+.5,ny+4,'o');
  if(o.chew){S(cx-.5,ny+4.2,'o');}
  G.g=g;
  const fin=outline(G);
  const P=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<FW&&y<FH)fin[y*FW+x]=c;};
  // front paws with long pale claws, turned slightly inward
  for(const s of [-1,1]){
    const px=cx+s*5.5;
    for(let y=pawY;y<=27;y++)for(let x=Math.floor(px-2);x<=Math.floor(px+1);x++)P(x,y,'d');
    P(px-2,28,'o');P(px+1,28,'o');
    const c0=s<0?px:px-2;P(c0-1,28,'k');P(c0,28,'k');P(c0+1,28,'k');

    P(cx+s*6.5+b,hcy+5,'v');P(cx+s*7.5+b,hcy+5.4,'v');P(cx+s*8.5+b,hcy+6,'v');

const NOTE_N={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function noteFreq(s){const m=/^([A-G]#?)(\d)$/.exec(s);if(!m)return 0;return 440*Math.pow(2,(NOTE_N[m[1]]+(+m[2]+1)*12-69)/12);}
const MUS={name:null,timer:null,i:0,t:0,gain:null,toks:null};
function ensureAudio(){try{if(!SND.a)SND.a=new (window.AudioContext||window.webkitAudioContext)();if(SND.a.state==='suspended')SND.a.resume();if(!MUS.gain){MUS.gain=SND.a.createGain();MUS.gain.gain.value=1;MUS.gain.connect(SND.a.destination);}return true;}catch(e){return false;}}
function playMusic(name){if(MUS.name===name&&MUS.timer)return;MUS.name=name;startMusic();}
function stopMusic(){clearInterval(MUS.timer);MUS.timer=null;if(MUS.gain&&SND.a){const g=MUS.gain;const t=SND.a.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.15);const ng=SND.a.createGain();ng.gain.value=1;ng.connect(SND.a.destination);setTimeout(()=>{try{g.disconnect();}catch(e){}},400);MUS.gain=ng;}}
function startMusic(){
  stopMusic();if(!SND.on||!MUS.name||!SND.a||SND.a.state!=='running'||!TRACKS[MUS.name])return;
  if(!MUS.gain&&!ensureAudio())return; // 効果音が先に AudioContext を作ったときは、音楽用の音量ノードがまだない
  const T=TRACKS[MUS.name],step=60/T.bpm/2,toks=[T.mel.split(/\s+/),T.bass.split(/\s+/)];
  MUS.i=0;MUS.t=SND.a.currentTime+.08;const gain=MUS.gain;
  MUS.timer=setInterval(()=>{const a=SND.a;if(!a||MUS.gain!==gain)return;
    while(MUS.t<a.currentTime+.3){
      for(let v=0;v<2;v++){const arr=toks[v],tok=arr[MUS.i%arr.length];if(!tok||tok==='-'||tok==='.')continue;
        let len=1;while(arr[(MUS.i+len)%arr.length]==='-'&&len<16)len++;
        const f=noteFreq(tok);if(!f)continue;
        const o=a.createOscillator(),g=a.createGain(),d=step*len*.9,vol=v?(T.bv||.04):(T.mv||.02),t=MUS.t;
        o.type=v?'triangle':(T.mw||'square');o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.setValueAtTime(vol,t+Math.max(.02,d-.06));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
        o.connect(g);g.connect(gain);o.start(t);o.stop(t+d+.03);}
      MUS.i++;MUS.t+=step;}
  },70);
}
function jingle(notes,step){if(!SND.on||!ensureAudio())return;const a=SND.a;let t=a.currentTime+.03;for(const n of notes.split(/\s+/)){if(n!=='-'&&n!=='.'){const f=noteFreq(n);const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+step*1.8);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+step*2);}t+=step;}}
const unlockAudio=()=>{if(!SND.on)return;if(ensureAudio()&&!MUS.timer&&MUS.name){if(SND.a.state==='running')startMusic();else SND.a.resume().then(()=>startMusic()).catch(()=>{});}};

      if(kind==='ayashi'){x.fillStyle='#ffe27a';x.fillRect(7,7,2,2);x.fillRect(4,11,1,1);x.fillRect(12,5,1,1);}
      return c;}
    if(kind==='wall'){x.fillStyle=T.top;x.fillRect(0,0,16,16);for(let k=0;k<6;k++)px(Math.floor(r()*16),Math.floor(r()*16),T.top2);return c;}
    if(kind==='face'){x.fillStyle=T.face;x.fillRect(0,0,16,16);x.fillStyle=T.face2;x.fillRect(0,0,16,2);
      x.fillStyle=T.top;for(const [yy,off] of [[5,0],[10,4],[15,0]]){x.fillRect(0,yy,16,1);for(let xx=off;xx<16;xx+=8)x.fillRect(xx,yy-4,1,4);}
      if(T.beam){x.fillStyle=T.beam;x.fillRect(2,2,2,14);x.fillRect(12,2,2,14);x.fillRect(2,2,12,2);}
      if(T.gold){x.fillStyle=T.gold;x.fillRect(7,7,2,2);}
      return c;}
    floor();
    if(kind==='floor')return c;
    if(kind==='crack'){x.fillStyle='#120c0a';for(const [a,b,w] of [[3,5,4],[6,7,3],[8,8,4],[10,10,2],[7,10,1],[6,11,2],[11,6,2]])x.fillRect(a,b,w,1);x.fillStyle=T.f2;x.fillRect(4,4,2,1);x.fillRect(10,11,2,1);return c;}
    if(kind==='down'){x.fillStyle='#120c0a';x.fillRect(3,3,10,10);x.fillStyle=T.f2;for(let i=0;i<4;i++)x.fillRect(3+i,4+i*2,10-i*2,1);return c;}
    if(kind==='up'){x.fillStyle=T.f2;for(let i=0;i<4;i++){x.fillRect(3,3+i*3,10,2);}x.fillStyle=T.f3;for(let i=0;i<4;i++)x.fillRect(3,5+i*3,10,1);return c;}
    if(kind==='exit'){const g=x.createRadialGradient(8,8,1,8,8,8);g.addColorStop(0,'rgba(255,240,180,.95)');g.addColorStop(1,'rgba(255,240,180,0)');x.fillStyle=g;x.fillRect(0,0,16,16);
      x.fillStyle='#3b2a1a';x.fillRect(6,5,4,1);x.fillRect(5,6,6,1);x.fillRect(7,7,2,5);return c;}
    if(kind==='chest'||kind==='open'||kind==='qchest'||kind==='hchest'){
      const H=kind==='hchest',body=H?'#6a3aa8':kind==='qchest'?'#e8b830':'#a8642c',lid=H?'#9a6ae0':kind==='qchest'?'#ffd860':'#c9803c',band=H?'#ffd36b':kind==='qchest'?'#a8642c':'#e8c050';
      if(H){const g=x.createRadialGradient(8,10,1,8,10,9);g.addColorStop(0,'rgba(200,150,255,.8)');g.addColorStop(1,'rgba(200,150,255,0)');x.fillStyle=g;x.fillRect(0,0,16,16);}
      x.fillStyle='#2a1810';x.fillRect(2,5,12,10);
      if(kind==='open'){x.fillStyle='#1a0e08';x.fillRect(3,8,10,3);x.fillStyle=body;x.fillRect(3,11,10,3);x.fillStyle=lid;x.fillRect(3,3,10,3);x.fillStyle='#2a1810';x.fillRect(2,2,12,1);x.fillRect(2,6,12,1);}
      else{x.fillStyle=lid;x.fillRect(3,6,10,4);x.fillStyle=body;x.fillRect(3,10,10,4);x.fillStyle=band;x.fillRect(3,9,10,1);x.fillRect(7,8,2,4);x.fillStyle='#fff8d0';x.fillRect(4,7,2,1);}
      return c;}
    return c;});
}

const shopMax=tier=>Math.min(SHOP_TOP,tier*2-1);
const DEFAULT_NAMES=['ガッチ','ユカリ','モフル'];

// ---------- アイテムの説明（ITEMS は core.js） ----------
const ITEM_DESC={herb:'HPを 30 回復',herb2:'HPを 90 回復',herb3:'HPを 300 回復',antidote:'どくを なおす',water:'MPを 20 回復',water2:'MPを 80 回復',leaf:'たおれた仲間を おこす（HP半分）',lure:'ダンジョンで使う。しばらく ハリモグラが よく出る（戦闘15回）'};
const SHOP_ITEMS=[['herb',1],['antidote',1],['water',1],['herb2',2],['leaf',2],['lure',3],['herb3',3],['water2',4]]; // [道具, 並ぶ店の段階]

// ---------- 迷路 ----------
// '#'壁 '%'やわらかい壁 'z'あやしい壁 '.'通路 'S'地上へのロープ 'D'下への階段 'B'ボス 'H'光る宝箱 'T'宝箱
function floorSize(f){return {cw:Math.min(12,7+Math.floor((f+2)/4)),ch:Math.min(9,5+Math.floor(f/6))};}
function genFloor(f){
  const {cw,ch}=floorSize(f),r=rng(f*7919+421),W=cw*2+1,H=ch*2+1;
  const m=Array.from({length:H},()=>Array(W).fill('#'));
  const vis=new Set(['0,0']),st=[[0,0]];m[1][1]='.';
  while(st.length){
    const [cx,cy]=st[st.length-1];
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[cx+dx,cy+dy,dx,dy]).filter(([x,y])=>x>=0&&y>=0&&x<cw&&y<ch&&!vis.has(x+','+y));
    if(!nb.length){st.pop();continue;}
    const [nx,ny,dx,dy]=nb[Math.floor(r()*nb.length)];
    m[cy*2+1+dy][cx*2+1+dx]='.';m[ny*2+1][nx*2+1]='.';vis.add(nx+','+ny);st.push([nx,ny]);
  }
  const nbOpen=(xx,yy)=>[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>m[yy+b]&&m[yy+b][xx+a]!=='#'&&m[yy+b][xx+a]!=='%').length;
  const between=(x,y)=>(x%2===0&&y%2===1&&m[y][x-1]==='.'&&m[y][x+1]==='.')||(x%2===1&&y%2===0&&m[y-1][x]==='.'&&m[y+1][x]==='.');
  // 少しだけ壁を抜いて、ぐるっと回れる道をつくる（行き止まりはこわさない）
  const loops=Math.floor(cw*ch/10);
  for(let k=0,tries=0;k<loops&&tries<500;tries++){
    const x=1+Math.floor(r()*(W-2)),y=1+Math.floor(r()*(H-2));
    if(m[y][x]!=='#'||!between(x,y))continue;
    const h=x%2===0;if(h?(nbOpen(x-1,y)===1||nbOpen(x+1,y)===1):(nbOpen(x,y-1)===1||nbOpen(x,y+1)===1))continue;
    m[y][x]='.';k++;
  }
  const dist=floorDistM(m,W,H);
  const dead=[];
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(m[y][x]==='#'||(x===1&&y===1))continue;if(nbOpen(x,y)===1)dead.push([x,y,dist[y][x]]);}
  dead.sort((a,b)=>b[2]-a[2]);
  const goal=dead.shift();
  const boss=f%5===0;
  m[goal[1]][goal[0]]=boss?'B':'D';
  let guard=null;
  if(GUARDIANS[f]&&dead.length){const g=dead.shift();m[g[1]][g[0]]='H';guard=[g[0],g[1]];}
  for(const [x,y] of dead)m[y][x]='T';
  m[1][1]='S';
  // ひびわれた床（下へ掘る近道）：B21〜49 のボスのいない階に1か所（STAGE3.md）
  let crack=null;
  if(f>=21&&f<STAGE_MAX&&!boss){const cand=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(m[y][x]==='.'&&nbOpen(x,y)>=2&&dist[y][x]>=8)cand.push([x,y]);
    if(cand.length){crack=cand[Math.floor(r()*cand.length)];m[crack[1]][crack[0]]='V';}}
  // やわらかい壁：2つの通路にはさまれた内側の壁の一部。ボスのまわりは硬いまま
  const near=(x,y,p)=>Math.abs(x-p[0])+Math.abs(y-p[1])<=2;
  const soft=[];
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    if(m[y][x]!=='#'||!between(x,y))continue;
    if(boss&&near(x,y,goal))continue;if(guard&&near(x,y,guard)&&r()<.5)continue;
    if(r()<.42){m[y][x]='%';soft.push([x,y]);}
  }
  // あやしい壁：やわらかい壁のうち2〜3か所
  const nz=2+Math.floor(r()*2);
  for(let k=0;k<nz&&soft.length;k++){const i=Math.floor(r()*soft.length);const [x,y]=soft.splice(i,1)[0];m[y][x]='z';}
  return {W,H,m,goal,boss,guard,crack};
}
function floorDistM(m,W,H){const dist=Array.from({length:H},()=>Array(W).fill(-1));const q=[[1,1]];dist[1][1]=0;
  while(q.length){const [x,y]=q.shift();for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const X=x+a,Y=y+b;const t=m[Y]&&m[Y][X];if(t&&t!=='#'&&t!=='%'&&t!=='z'&&dist[Y][X]<0){dist[Y][X]=dist[y][x]+1;q.push([X,Y]);}}}return dist;}

// ---------- 宝箱・掘ったときの中身 ----------
function chestLoot(f,x,y){
  const r=rng(f*131+x*17+y*29+7),k=r();
  const g=Math.round(curve('gold',f)*(2.5+r()*1.5));
  if(f%5===4&&k<.18){const lines=['claw','staff','flute'];return {eq:lines[Math.floor(r()*3)],tier:Math.min(SHOP_TOP,shopMax(1+areaOf(f))+(f>=10?1:0))};}
  if(k<.45)return {gold:g};
  const it=f<8?['herb','herb','antidote','water']:f<30?['herb2','herb2','water','leaf','antidote']:['herb3','herb2','water2','leaf'];
  return {item:it[Math.floor(r()*it.length)],n:1+(r()<.3?1:0)};
}
// あなほり王の素材（空想）。持ち帰ると、その系統の最強装備（番号11）が店に並ぶ
const MATS={claw:{name:'いにしえの キバ'},staff:{name:'かせきの えだ'},flute:{name:'にじいろの ふえいし'},armor:{name:'いにしえの こうら'}};
function partyHas(k){return G.party.some(m=>m.hp>0&&passives(m)[k]);}
function digLoot(f,ayashi,R){ // R: 遊んでいるときの乱数
  const luck=partyHas('digLuck'),find=luck||partyHas('itemFind');
  if(luck&&f>=31){const left=Object.keys(MATS).filter(k=>!G.mats[k]);if(left.length&&R()<(ayashi?.12:.02))return {mat:left[Math.floor(R()*left.length)]};}
  if(!ayashi){if(R()<(find?.3:.12))return R()<.6?{gold:Math.round(curve('gold',f)*(.8+R()*.6))}:{item:f<8?'herb':f<30?'herb2':'herb3',n:1};return null;}
  if(f>=5&&f<=10&&!questDoneG(0,1)&&(G.qcount.seed||0)<3&&R()<.6)return {seed:1};
  if(f>=31&&f<=40&&questOpen(3)&&!questDoneG(3,1)&&(G.qcount.opal||0)<5&&R()<.5)return {opal:1};
  const k=R();if(k<(find?.25:.35))return {gold:Math.round(curve('gold',f)*(3+R()*2))};
  const it=f<10?['herb2','water','leaf']:f<30?['herb2','water','leaf','herb3']:['herb3','water2','leaf'];
  return {item:it[Math.floor(R()*it.length)],n:1+(R()<(find?.6:.4)?1:0)};
}

function questDoneG(a,i){const q=QUESTS[a].list[i];
  if(q.k==='boss')return !!G.bossDown[q.f];
  if(q.k==='seed')return (G.qcount.seed||0)>=q.n;

const ST_JP={poison:'どく',sleep:'ねむり',stun:'まひ',atkdn:'こうげき↓',defdn:'ぼうぎょ↓',curse:'のろい（こうげき↓・ぼうぎょ↓）',confuse:'こんらん',blind:'めつぶし'};

const pc=v=>Math.round(v*100);
const EFF_JP={hp:v=>`最大HP+${pc(v)}%`,def:v=>`ぼうぎょ+${pc(v)}%`,mag:v=>`まりょく+${pc(v)}%`,mp:v=>`最大MP+${pc(v)}%`,spd:v=>`すばやさ+${pc(v)}%`,

  healPow:v=>`回復の とくぎ+${pc(v)}%`,autoRevive:()=>'戦闘中 1度だけ、たおれた仲間が HP半分で 自動で おきる',atkPoison:v=>`ふつうの こうげきで ${pc(v)}%の確率で どく`,poisonPow:v=>`自分が かけた どくの ダメージ+${pc(v)}%`,
  statusRate:v=>`自分が かける 状態異常・デバフの 確率×${(1+v).toFixed(2).replace(/0$/,'')}`,debuffTurns:v=>`自分が かける デバフ（こうげき↓・ぼうぎょ↓・のろい・めつぶし）が ${v}ターン 長い`,
  debuffPow:v=>`自分が かける こうげき↓・ぼうぎょ↓が 強い（${pc(1-CONFIG.debuff.atk)}%→${pc(1-CONFIG.debuff.atk+v)}%、${pc(1-CONFIG.debuff.def)}%→${pc(1-CONFIG.debuff.def+v)}%）`,
  buffTurns:v=>`自分の 歌が ${v}ターン 長く つづく`,buffPow:v=>`自分の 歌の 上がりかた+${pc(v)}%（こうげき↑なら ${pc(CONFIG.buff.atk-1)}%→${pc((CONFIG.buff.atk-1)*(1+v))}%）`,kiaiMax:v=>`きあいの 上限+${v}`,
  kiaiDef:v=>`きあい1段ごとに ぼうぎょ+${pc(v)}%`,kiaiMag:v=>`きあい1段ごとに まりょく+${pc(v)}%`,hurtKiai:()=>'ダメージを うけると きあいが たまる',singKiai:()=>'歌うと きあいが たまる',
  poisonAtk:v=>`どくの あいだ こうげき+${pc(v)}%`,poisonRegen:v=>`どくの あいだ、どくダメージの かわりに 毎ターン 最大HPの${pc(v)}% 回復`,guardCounter:()=>'かばって 物理こうげきを うけると 必ず はんげき（全体こうげき・かわしたときも。ねむり・まひの あいだは しない）',guardHeal:v=>`かばった仲間の HPを 最大HPの${pc(v)}% 回復`,
  fistAll:()=>'属性の こぶしが 敵ぜんたいに',danceKiai:()=>'行動すると、仲間みんなに きあいが1段',magEcho:v=>`まほうが ${pc(v)}%で もう1回`,statusMagPow:v=>`状態異常・デバフの 敵に まほう+${pc(v)}%`,
  statusResist:()=>'仲間みんな 状態異常に かかりにくい（確率半分。何人 持っていても 同じ）',songHeal:v=>`歌うと 仲間みんなの HPを 最大HPの${pc(v)}% 回復`,itemPow:v=>`戦闘中の どうぐの 回復量+${pc(v)}%`,
  poisonKillHeal:v=>`どくの敵を たおすと 仲間みんなの HPを 最大HPの${pc(v)}% 回復`,startCure:()=>'戦闘の はじめに 仲間みんなの どくを なおす',
  extraAct:v=>`${pc(v)}%で もう1回 こうげき`,pinch:v=>`HPが 3割より少ないとき こうげき・ぼうぎょ・まりょく・すばやさ+${pc(v)}%`,pinchRegen:v=>`HPが 3割より少ないとき 毎ターン 最大HPの${pc(v)}% 回復`,startKiai:()=>'戦闘の はじめから きあい最大',
  killAtk:v=>`この戦闘で 敵を たおすたび こうげき+${pc(v)}%`,buffForever:()=>'歌の効果が 戦闘中ずっと つづく（敵に さげられると 消える）',itemFind:()=>'掘ったときと 戦闘のあとに どうぐが 見つかりやすい',digLuck:()=>'B31より 深くで 掘ると、最強装備の 素材が 見つかる',partyRegen:v=>`持っている仲間が 立っていれば、仲間みんなの HP・MPが 毎ターン 最大の${pc(v)}% 回復`};
function skillDesc(S){
  const T=S.tgt==='enemies'?'敵ぜんたい':S.tgt==='enemy'?'敵1体':S.tgt==='allies'?'仲間みんな':S.tgt==='ally'?'仲間1匹':S.tgt==='dead'?'たおれた仲間':'自分';
  switch(S.kind){
    case 'passive':return '（持っているだけで きく）'+Object.keys(S.eff).map(k=>EFF_JP[k]?EFF_JP[k](S.eff[k]):k).join('、');
    case 'phys':return `${T}に 物理こうげき（威力×${S.pow}${S.hits?'×'+S.hits+'回':''}）`+(S.el?`・${EL_NAME[S.el]}`:'')+(S.kiaiCost?`・きあいを${S.kiaiCost}段 使う`:'')+(S.ignoreDef?'・ぼうぎょを むし':'')+(S.selfDmg?'・自分も 少し きずつく':'');
    case 'finisher':return `${T}に、きあいを ぜんぶ使う 大わざ（たまっているほど 強い）`;
    case 'mag':return `${T}に まほう`+(S.el==='best'?'（弱点を つく）':S.el?`（${EL_NAME[S.el]}）`:'（むぞくせい）')+(S.drain?'・与えたダメージの半分 回復':'');
    case 'heal':return `${T}の HPを 回復`;
    case 'cure':return '仲間1匹の どく・ねむり・まひ・ふういんを なおす';
    case 'cureAll':return '仲間みんなの どく・ねむり・まひ・ふういんを なおす';
    case 'mpheal':return `ほかの仲間みんなの MPを ${S.amt} 回復`;
    case 'revive':return 'たおれた仲間を おこす（HP半分）';
    case 'mark':return 'えらんだ仲間が この戦闘で たおれたとき、1度だけ HP半分で おきる';
    case 'guard':return `仲間を かばう（うけるダメージ ${Math.round((S.cut||.5)*100)}%）`;
    case 'shelter':return `このターン、仲間みんなの うける ダメージが ${Math.round(S.cut*100)}%に なる（先に 動く）`;
    case 'stance':return S.stance==='counter'?(S.turns?`${S.turns}ターン、うける 物理ダメージ${Math.round((1-KAMAE.cut)*100)}%カット。物理こうげきを うけると 必ず ${KAMAE.pow}倍の はんげき（全体こうげき・かわしたときも）`:'このターン、うけた こうげきに 必ず はんげき'):'このターン、こうげきを うけない';
    case 'status':return `${T}を ${ST_JP[S.st]}に（${Math.round(S.rate*100)}%）`+(S.pow?'＋こうげき':'')+(S.st2?`・${ST_JP[S.st2]}も`:'');
    case 'buff':return `3ターン、仲間みんなの ${BUFF_JP[S.buff]}↑`;
    case 'extend':return S.kiai?'きあいを ぜんぶ使って、その段数だけ 歌の効果を のばす':`歌の効果を ${S.turns}ターン のばす`;
    case 'cheer':return '仲間1匹の 次の こうげきが 強くなる';
    case 'taunt':return '2ターン、敵の こうげきを ひきつける';
    case 'rage':return '自分を どくにして、3ターン こうげき↑';
    case 'berserk':return '3ターン、まもりを すてて こうげき大↑';
  }
  return '';
}

// ---------- sound ----------
const SND={on:true,a:null};try{SND.on=localStorage.getItem(SND_KEY)!=='0';}catch(e){}
function tone(f0,f1,dur,type,vol,delay){const a=SND.a,t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.05,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);}
function snd(k){if(!SND.on)return;try{if(!SND.a)SND.a=new (window.AudioContext||window.webkitAudioContext)();if(SND.a.state==='suspended')SND.a.resume();
  switch(k){
    case 'tap':tone(700,0,.04,'square',.025);break;
    case 'hit':tone(260,90,.12,'square',.05);break;
    case 'phit':tone(150,60,.18,'sawtooth',.05);break;
    case 'magic':tone(380,1300,.28,'triangle',.06);break;
    case 'heal':tone(520,0,.12,'sine',.06);tone(780,0,.2,'sine',.06,.1);break;
    case 'lvl':[523,659,784,1046].forEach((f,i)=>tone(f,0,.15,'square',.045,i*.09));break;
    case 'chest':tone(660,0,.08,'square',.045);tone(990,0,.22,'square',.045,.09);break;
    case 'enc':tone(220,880,.35,'sawtooth',.045);break;
    case 'bump':tone(90,0,.06,'square',.035);break;
    case 'dig':tone(140,80,.09,'square',.05);tone(200,90,.09,'square',.04,.1);break;
    case 'die':tone(420,60,.45,'sawtooth',.045);break;
    case 'stairs':tone(500,250,.25,'triangle',.05);break;
    case 'quest':[659,784,988,1318].forEach((f,i)=>tone(f,0,.18,'triangle',.06,i*.11));break;
  }}catch(e){}}
function setSnd(on,init){SND.on=on;try{localStorage.setItem(SND_KEY,on?'1':'0');}catch(e){}$('snd').textContent=on?'♪ ON':'♪ OFF';if(init)return;if(!on)stopMusic();else unlockAudio();}
$('snd').onclick=()=>{setSnd(!SND.on);snd('tap');};setSnd(SND.on,true);

// ---------- save ----------
// セーブデータは 複数。1番は 前からの キー（そのまま 読める）、2番からは キーの 後ろに _2, _3…
// 番号の 一覧は SLOTS_KEY に 持つ。新しく はじめると いちばん大きい番号＋1
const SLOTS_KEY='wombatlegacy2_slots',SAVE_MAX=9;let curSlot=1;
const slotKey=n=>n===1?SAVE_KEY:SAVE_KEY+'_'+n;
function slotList(){let a=null;try{a=JSON.parse(localStorage.getItem(SLOTS_KEY)||'null');}catch(e){}
  if(!Array.isArray(a)){a=[];try{if(localStorage.getItem(SAVE_KEY))a=[1];}catch(e){}}
  return a.filter(n=>Number.isInteger(n)&&n>0).sort((x,y)=>x-y);}
function setSlotList(a){try{localStorage.setItem(SLOTS_KEY,JSON.stringify(a));}catch(e){}}
function save(){if(!G)return;G.savedAt=Date.now();try{localStorage.setItem(slotKey(curSlot),JSON.stringify(G));}catch(e){}
  const a=slotList();if(!a.includes(curSlot)){a.push(curSlot);setSlotList(a.sort((x,y)=>x-y));}}
function load(n=curSlot){try{const t=localStorage.getItem(slotKey(n));if(!t)return null;const s=JSON.parse(t);if(s&&s.v===2&&s.party)return fixSave(s);return null;}catch(e){return null;}}
function deleteSlot(n){try{localStorage.removeItem(slotKey(n));}catch(e){}setSlotList(slotList().filter(x=>x!==n));}
// 読めるデータだけ（こわれたものは のぞく）
function saves(){return slotList().map(n=>({n,g:load(n)})).filter(x=>x.g);}
function slotSummary(x){const g=x.g,d=g.savedAt?new Date(g.savedAt):null,p=v=>String(v).padStart(2,'0');
  return {label:`セーブ${x.n}　${g.party.map(m=>m.name).join('・')}`,sub:`いちばん深い B${g.reached||0}`+(g.secretDown?'  ★★完全クリア':g.cleared?'  ★クリア':'')+(d?`  ${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`:'')};}
function fixSave(s){if(s&&s.party)for(const m of s.party)if(Array.isArray(m.slots))m.slots=[...new Set(m.slots.map(k=>k==='horiate'?'digLuck':k))]; // ほりあては おたからさがしに まとめた（2026-11-25）
  for(const k of ['seen','opened','bossDown','guardDown','dug','az','maps','flags','qdone','qcount','qflag','earned','hints','mats','raids','raidNews'])s[k]=s[k]||{};s.inv=s.inv||{};return s;}
function prevLevel(){try{const t=localStorage.getItem(PREV_SAVE_KEY);if(!t)return 0;const s=JSON.parse(t);if(s&&s.party)return Math.max(...s.party.map(m=>+m.lv||0));}catch(e){}return 0;}

function fxKindOf(S){if(!S)return null;
  if(S.kind==='mag')return S.el==='best'?'light':S.el||'boom';
  if(['heal','cure','cureAll','revive','mark','mpheal'].includes(S.kind))return 'heal';
  if(['buff','extend','cheer'].includes(S.kind))return 'buff';
  if(S.kind==='status')return S.st==='sleep'?'sleep':'bad';
  if(['phys','finisher'].includes(S.kind))return S.el||'slash';
  return null;}
async function playEvents(ev){

        // 技の演出：つぎの「act」までに当たった相手に

        if(kind){const pts=[];for(let j=n+1;j<ev.length&&ev[j].t!=='act';j++){const x=ev[j];if((x.t==='hit'||x.t==='heal'||x.t==='status'||x.t==='revive')&&x.i!=null){const side=x.side||'p';pts.push(side==='e'?enemyCenter(x.i):partyCenter(x.i));}}
          if(!pts.length&&S&&S.kind==='buff')G.party.forEach((m,j)=>{if(m.hp>0)pts.push(partyCenter(j));});

        await bwait(400);if(e.side==='p')BA.p[e.i].step=0;applyVs();break;}
      case 'msg':if(e.dbFinal){shakeT=now;flashT=performance.now();banner('さいごの たたかい','ドロップベアが きあいで 立ちあがった','#ff5a4a',2200);jingle('C4 C4 G4 C5',.1);}say(e.text);await bwait(e.dbFinal?900:420);break;
      case 'hit':
        if(e.side==='e'){if(BA.e[e.i]){BA.e[e.i].flash=now;BA.e[e.i].hp=e.hp;}pop(enemyCenter(e.i),e.dmg,e.weak?'#ffe060':'#ffffff',e.weak||e.crit);snd('hit');if(e.weak||e.crit)shakeT=now;}
        else{disp[e.i].hp=e.hp;BA.p[e.i].shake=now;shakeT=now;pop(partyCenter(e.i),e.dmg,e.poison?'#c98bff':e.magic?'#9ad0ff':'#ff8a8a');snd('phit');renderParty(undefined,e.i);}
        if(e.text)say(e.text);await bwait(e.poison?300:460);break;
      case 'heal':
        if(e.side==='p'){disp[e.i].hp=e.hp;renderParty();pop(partyCenter(e.i),e.amt,'#8aff9a');}else{if(BA.e[e.i])BA.e[e.i].hp=B.enemies[e.i].hp;pop(enemyCenter(e.i),e.amt,'#8aff9a');}
        if(e.text)say(e.text);await bwait(420);break;
      case 'status':if(e.side==='p'&&e.st==='poison')disp[e.i].poison=true;say(e.text);renderParty();await bwait(420);break;
      case 'buff':renderParty();break;
      case 'sync':{let ch=false;e.p.forEach((x,i)=>{const o=disp[i];if(!o)return;
          if(x.mp>o.mp&&x.hp>0)pop(partyCenter(i),'MP+'+(x.mp-o.mp),'#8ac8ff');

    }
  }
  BA.vs=null;disp=G.party.map(m=>({hp:m.hp,mp:m.mp,poison:m.poison}));renderParty();
}

const KEYDIR={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};

    if(advance)advance();else if(skipFn)skipFn();else if(cmdList.length===1){snd('tap');cmdList[0].fn();}return;}
  if((e.key==='Escape'||e.key==='x'||e.key==='X')&&mode==='field'&&!busy&&!F.moving){openFieldMenu();return;}

  else if(ts===2){for(let i=0;i<7;i++){const per=1.4+hash(i,5)*1.6,ph=wrap(t+hash(i,6)*per,per)/per,x=wrap(hash(i,7)*SW-cx*.5,SW),y0=hash(i,11)*30,y1=60+hash(i,12)*70;
      if(ph<.7){const y=y0+(y1-y0)*(ph/.7)**2;rect(x,y-cy*.0,1,2,'rgba(170,220,255,.8)');}else{const k=(ph-.7)/.3;ctx.strokeStyle=`rgba(170,220,255,${.6*(1-k)})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,y1,1+k*6,.5+k*2,0,0,7);ctx.stroke();}}
    ctx.fillStyle='rgba(120,200,255,.05)';for(let i=0;i<3;i++){const y=wrap(t*6+i*50,SH);ctx.fillRect(0,y,SW,6);}}

function epilogueLine(m){

  const pick=sup.includes(m.job)?m.job:sup[0];
  if(pick)return `${m.name}は ${JOBS[pick].name}として、${SUP[pick]}`;
  if(Object.keys(m.mastered).some(j=>m.mastered[j]&&JOBS[j].tier===2))return `${m.name}は ${JOBS[m.job].name}の わざを みがきながら、まだ 見ぬ 職業を さがして 穴に もぐりつづけている。`;

}
