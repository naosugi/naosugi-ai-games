<style>
:root{--bg:#eaf1ec;--card:#ffffff;--ink:#1e2b2f;--sub:#5b6b6f;--pri:#3f8a57;--pri2:#2f6d43;--acc:#f2c230;--warn:#c8553d;--line:#d5e0d8;--soft:#f5f8f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo","Yu Gothic",system-ui,sans-serif;line-height:1.55}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:560px;margin:0 auto;padding:10px 12px 40px}
a{color:var(--pri2)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.top a{text-decoration:none}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.02em}
h2{font-size:17px;margin:14px 0 8px}
h3{font-size:15px;margin:12px 0 6px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 0 rgba(30,43,47,.06),0 2px 8px rgba(30,43,47,.05)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 12px;font:inherit;font-size:16px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;margin:8px 0;box-shadow:0 3px 0 var(--pri2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pri2)}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line);border:1px solid var(--line)}
.btn.acc{background:var(--acc);color:#3a2c00;box-shadow:0 3px 0 #c99c14}
.btn.warn{background:var(--warn);box-shadow:0 3px 0 #9c3f2b}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:4px 4px 4px 0}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--sub);font-size:13px}
.small{font-size:12px;color:var(--sub)}
.bar{height:10px;background:#e4ebe6;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5bb174,#3f8a57)}
.coach{display:flex;align-items:flex-end;gap:8px;margin:6px 0}
.coach canvas{width:96px;image-rendering:pixelated;flex:none}
.bubble{position:relative;background:#fff;border-radius:14px;padding:9px 12px;font-size:14px;flex:1;box-shadow:0 1px 4px rgba(30,43,47,.08)}
.bubble:before{content:"";position:absolute;left:-7px;bottom:14px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.stamps{display:flex;gap:5px;justify-content:space-between;margin-top:6px}
.stamp{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.stamp b{display:block;margin:2px auto 0;width:30px;height:30px;border-radius:50%;background:#eef2ef;border:2px dashed #cdd8d0;line-height:26px;font-size:15px}
.stamp b.on{background:#ffe9a8;border:2px solid #e2b52a}
.stamp b.today{outline:2px solid var(--pri);outline-offset:1px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef2ef;font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.menu-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #eef2ef}
.menu-item canvas{width:72px;image-rendering:pixelated;background:var(--soft);border-radius:8px;flex:none}
.menu-item .nm{font-weight:700}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#e8f2ea;color:var(--pri2);margin-right:4px}
.tag.y{background:#fff3c9;color:#7a5a00}
.tag.r{background:#fde4dd;color:#9c3f2b}
/* セッション */
#sess{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#sess .in{max-width:560px;margin:0 auto;padding:10px 12px 20px}
.prog{display:flex;gap:3px;margin:4px 0 8px}
.prog i{flex:1;height:7px;border-radius:4px;background:#d7e2da}
.prog i.done{background:#5bb174}.prog i.cur{background:var(--acc)}
.stage{background:#fff;border-radius:16px;padding:6px;position:relative}
.stage canvas{display:block;width:100%;image-rendering:pixelated}
.phase{position:absolute;right:10px;top:8px;font-size:20px;font-weight:800;padding:2px 10px;border-radius:10px;background:#fff8}
.phase.down{color:#2d5f92}.phase.up{color:#c8553d}
.big{font-size:64px;font-weight:800;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--sub);font-weight:700}
.blk{font-size:20px;font-weight:800;text-align:center;margin:6px 0 0}
.tips{margin:6px 0;padding-left:18px;font-size:15px}
.tips li{margin:3px 0}
.sline{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.sline canvas{width:56px;image-rendering:pixelated}
/* 図鑑 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.dx{background:#fff;border-radius:10px;padding:4px 2px 3px;text-align:center;font-size:10px;cursor:pointer;position:relative}
.dx img{width:48px;height:48px;image-rendering:pixelated;display:block;margin:0 auto}
.dx.no img{filter:brightness(0) opacity(.18)}
.dx .st{position:absolute;right:3px;top:2px;font-size:9px;color:#c99c14}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* モーダル */
#modal{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:14px 16px}
.found{text-align:center}
.found img{width:144px;height:144px;image-rendering:pixelated}
.newb{display:inline-block;background:var(--acc);color:#3a2c00;font-weight:800;border-radius:8px;padding:0 8px;font-size:13px}
.skill{border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0;cursor:pointer;background:#fff}
.skill.pick:hover,.skill.pick:active{border-color:var(--pri);background:#f2f8f3}
.lv{font-weight:800;color:var(--pri2)}
.dots{letter-spacing:2px;color:#c99c14}
.fact{border-left:4px solid var(--acc);background:#fffaf0;border-radius:8px;padding:9px 11px;margin:8px 0;font-size:14px}
.fact .src{font-size:11px;color:var(--sub);margin-top:4px}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs .chip{flex:1;text-align:center}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:1px solid var(--line);padding-top:6px}
.chart div{flex:1;background:#8cc79c;border-radius:4px 4px 0 0;position:relative;min-height:1px}
.chart div span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--sub)}
.chart div.g{background:#5bb174}
.goalline{position:relative}
input[type=number],select{font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;width:110px;background:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2ef;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e2b2f;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:60}
@media (min-width:700px){.coach canvas{width:120px}}
/* ===== スマホ向け強化 ===== */
html,body{touch-action:manipulation;overscroll-behavior-y:none}
button,.chip,.dx,.skill,.tab{user-select:none;-webkit-user-select:none}
#app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#app.fx{animation:pageIn .28s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{transition:transform .08s}
.btn:active{transform:scale(.97) translateY(2px)}
/* 下のタブ */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom));display:flex;justify-content:center}
#tabbar .in{display:flex;max-width:560px;width:100%}
.tab{flex:1;border:0;background:none;font:inherit;font-size:11px;color:var(--sub);padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
.tab .ic{font-size:21px;line-height:1.2;transition:transform .15s}
.tab.on{color:var(--pri2);font-weight:800}
.tab.on .ic{transform:translateY(-2px) scale(1.12)}
.tab .badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--warn);color:#fff;border-radius:9px;font-size:10px;min-width:16px;padding:0 4px;line-height:16px}
/* 下に固定する大きなボタン */
.cta{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:14;padding:8px 12px;background:linear-gradient(rgba(234,241,236,0),var(--bg) 35%)}
.cta .btn{max-width:536px;margin:0 auto;font-size:18px;padding:15px}
.cta .btn.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--pri2),0 0 0 0 rgba(63,138,87,.45)}50%{box-shadow:0 3px 0 var(--pri2),0 0 0 10px rgba(63,138,87,0)}}
/* コーチ（正面） */
.wbc{image-rendering:pixelated;display:block}
.hero{display:flex;flex-direction:column;align-items:center;margin:4px 0 2px}
.hero .bub{position:relative;background:#fff;border-radius:16px;padding:10px 14px;font-size:15px;max-width:100%;min-height:46px;box-shadow:0 2px 8px rgba(30,43,47,.08);margin-bottom:10px}
.hero .bub:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.hero .wbc{width:150px}
.coach .wbc{width:72px;flex:none}
.hop{animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:none}80%{transform:translateY(-10%) scaleY(1.04)}90%{transform:translateY(0) scaleY(.94)}}
.jump{animation:jump .5s ease-in-out infinite}
@keyframes jump{0%,100%{transform:none}50%{transform:translateY(-14%)}}
.breath{animation:breath 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breath{0%,100%{transform:none}50%{transform:scaleY(1.03)}}
.shadow{width:60%;height:8px;border-radius:50%;background:rgba(30,43,47,.12);margin:-4px auto 0}
/* ステータス */
.stat{display:flex;gap:8px}
.stat>div{flex:1;background:var(--soft);border-radius:10px;padding:6px 8px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:11px;color:var(--sub)}
.bar>i{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.stamp b.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
/* ボトムシート */
#modal{align-items:flex-end;padding:0}
.mbox{border-radius:20px 20px 0 0;max-height:90vh;padding:10px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.mbox:before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#d5dcd7;margin:0 auto 8px}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@media (min-width:700px){#modal{align-items:center;padding:14px}.mbox{border-radius:18px}}
/* セッション（全画面） */
#sess{background:#f4f8f5;transition:background .25s}
#sess.down{background:#e3eef9}#sess.up{background:#fdeee6}#sess.hold{background:#fff7dc}#sess.rest{background:#eaf1ec}
#sess .in{display:flex;flex-direction:column;min-height:100%;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.ringwrap{position:relative;width:min(56vw,220px);margin:6px auto 0}
.ringwrap svg{display:block;width:100%;transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .num b{font-size:min(17vw,68px);line-height:1;font-variant-numeric:tabular-nums}
.ringwrap .num small{font-size:15px;color:var(--sub);font-weight:700}
.ring-bg{fill:none;stroke:#dfe7e1;stroke-width:9}
.ring-fg{fill:none;stroke:var(--pri);stroke-width:9;stroke-linecap:round;transition:stroke .2s}
#sess.down .ring-fg{stroke:#3f86c8}#sess.up .ring-fg{stroke:#e2753f}#sess.hold .ring-fg{stroke:#e2b52a}
.numpop{animation:numpop .25s ease-out}
@keyframes numpop{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.phase{font-size:22px;top:10px;right:12px;transition:transform .15s}
.phase.flash{transform:scale(1.25)}
.ctrl{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:22px;background:linear-gradient(rgba(244,248,245,0),rgba(244,248,245,.95) 30%);z-index:21}
.cbtn{border:0;border-radius:50%;width:56px;height:56px;font-size:13px;font-weight:800;background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(30,43,47,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer}
.cbtn .ic{font-size:20px}
.cbtn.main{width:76px;height:76px;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri2)}
.cbtn:active{transform:scale(.94)}
.nextcard{animation:slideIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.pausecover{position:absolute;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;border-radius:16px}
/* 演出 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.feel button .e{display:block;font-size:30px}
.feel button.on{border-color:var(--pri);background:#eef7f0;transform:scale(1.04)}
.lvup{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,236,160,.97) 0,rgba(242,194,48,.95) 45%,rgba(200,140,20,.96) 100%);animation:fadeIn .25s}
.lvup .rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 8deg,transparent 8deg 22deg);animation:spin 12s linear infinite}
.lvup h2{position:relative;font-size:44px;color:#fff;text-shadow:0 3px 0 #b07a00,0 0 12px rgba(0,0,0,.15);margin:8px 0 0;animation:zoomIn .5s cubic-bezier(.2,1.6,.4,1)}
.lvup p{position:relative;font-size:22px;font-weight:800;color:#5a3d00;margin:4px 0 18px}
.lvup .wbc{position:relative;width:150px}
.lvup .btn{position:relative;width:auto;padding:12px 40px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
/* 探検シーン */
.scene{position:relative;height:150px;border-radius:16px;overflow:hidden;margin:6px 0}
.scene .deco{position:absolute;bottom:24px;white-space:nowrap;font-size:34px;animation:scroll 2.4s linear infinite}
.scene .deco2{bottom:70px;font-size:24px;opacity:.7;animation-duration:4s}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.scene .walker{position:absolute;left:50%;bottom:14px;width:96px;margin-left:-48px;image-rendering:pixelated;animation:walkbob .35s steps(2) infinite}
@keyframes walkbob{50%{transform:translateY(-3px)}}
.scene .bang{position:absolute;left:50%;top:10px;font-size:40px;font-weight:900;color:#c8553d;margin-left:20px;animation:zoomIn .3s cubic-bezier(.2,1.6,.4,1)}
.reveal{position:relative;display:inline-block}
.reveal img{width:150px;height:150px;image-rendering:pixelated;transition:filter .6s ease}
.reveal.hide img{filter:brightness(0) opacity(.25)}
.reveal .glow{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,120,.8),rgba(255,226,120,0) 65%);animation:glow 1.2s ease-out}
@keyframes glow{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.reveal.show img{animation:bounceIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bounceIn{from{transform:scale(.5)}to{transform:scale(1)}}
.newb.big{font-size:18px;padding:2px 12px;animation:zoomIn .4s cubic-bezier(.2,1.6,.4,1)}
.fact{animation:slideUp .4s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.toast{bottom:auto;top:calc(12px + env(safe-area-inset-top));animation:slideDown .25s ease-out}
@keyframes slideDown{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.dx{transition:transform .1s}.dx:active{transform:scale(.94)}
.dx.newin{animation:pop .5s ease-out}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.cta[hidden],#tabbar[hidden]{display:none}
.notab .cta{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.notab #app{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.pausecover[hidden]{display:none}
/* ===== 縦画面に収める（v3） ===== */
#sess{overflow:hidden;height:100vh;height:100dvh}
#sess .in{height:100%;min-height:0;display:flex;flex-direction:column;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#sess .blk{font-size:18px;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sess .stage{flex:1 1 0;min-height:150px;position:relative;padding:0;overflow:hidden;touch-action:none}
#sess .stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.stage .hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11px;color:#9aa7a1;pointer-events:none}
.stage .side{position:absolute;left:10px;top:10px;font-size:18px;font-weight:800;padding:2px 10px;border-radius:10px;display:none}
.stage .side.r{display:block;background:#fde7da;color:#c45a22}.stage .side.l{display:block;background:#dfeaf8;color:#2d68a8}
.info{flex:none;display:flex;gap:10px;align-items:center;margin:8px 0 4px;min-height:0}
.info .ringwrap{width:min(34vw,22vh,160px);flex:none;margin:0}
.info .ringwrap .num b{font-size:min(11vw,7vh,52px)}
.info .ringwrap .num small{font-size:12px}
#sSub{flex:1;min-width:0;font-size:14px}
#sSub .sline{margin:0}
#sSub .tips{margin:4px 0 0;padding-left:16px;font-size:13px;line-height:1.4}
#sSub .tips li{margin:1px 0}
#sSub .small{font-size:12px}
#sess .ctrl{position:static;flex:none;background:none;padding:2px 0 0;gap:26px}
#sess .cbtn{width:52px;height:52px}#sess .cbtn.main{width:68px;height:68px}
/* メニュー一覧（2列） */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mi{background:#fff;border-radius:10px;padding:4px 6px 4px 4px;display:flex;gap:6px;align-items:center;min-width:0}

function loadSave(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(s&&s.v===1) return Object.assign(defSave(),s); }catch(e){} return defSave(); }

// ================= 日付 =================
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(new Date());
function weekStart(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
const addDays=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
function slotOfNow(){ const h=new Date().getHours(); return (h>=4&&h<12)?'朝':(h>=12&&h<16)?'昼':'夜'; }
const rewarded=s=>s.reward;
function sessionsIn(from,to){ const a=dkey(from), b=dkey(to); return SV.sessions.filter(s=>s.date>=a&&s.date<b); }
function weekSessions(ws){ return sessionsIn(ws,addDays(ws,7)); }
const daysWith=list=>new Set(list.map(s=>s.date)).size;

// 乱数（日付で決まるメニュー用）
function seeded(seed){ let h=2166136261; for(const c of seed){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }

// ================= メニュー =================
const dInt=()=>Math.max(0,Math.floor(SV.d));
function repsFor(){ return Math.min(20,12+dInt()); }
function holdFor(){ return Math.min(60,30+5*dInt()); }
function buildMenu(){
  const r=seeded(today()+'|'+SV.sessions.filter(s=>s.date===today()).length);
  const used=new Set(), d=dInt();
  return SLOTS.map(pool=>{
    let cand=pool.filter(id=>!(EX[id].minD>d)&&!used.has(id));
    if(pool.includes('kneeplank')) cand=[d>=2?'plank':'kneeplank'];
    if(!cand.length) cand=pool.filter(id=>!(EX[id].minD>d));
    const id=cand[Math.floor(r()*cand.length)]; used.add(id);
    const e=EX[id]; return e.type==='rep'?{id,reps:repsFor()}:{id,hold:holdFor()};
  });
}
function blockSec(m){ const e=EX[m.id]; return e.type==='rep'?m.reps*(e.tempo[0]+e.tempo[1]):m.hold; }
function buildTimeline(menu){
  const T=[{kind:'warm',dur:WARM.sec}];
  menu.forEach((m,i)=>{ T.push({kind:'rest',dur:REST_SEC,next:m,idx:i}); T.push({kind:'ex',dur:blockSec(m),m,idx:i}); });
  T.push({kind:'cool',dur:COOL.sec});
  return T;
}

// ================= 音 =================
const AU={ctx:null,master:null,bgmG:null,seG:null,voiceJa:null,voiceOK:null,speaking:0};
function ac(){ try{ if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AU.ctx=new C();
  AU.master=AU.ctx.createGain(); AU.master.gain.value=0.9; AU.master.connect(AU.ctx.destination);
  AU.bgmG=AU.ctx.createGain(); AU.bgmG.gain.value=0.11; AU.bgmG.connect(AU.master);
  AU.seG=AU.ctx.createGain(); AU.seG.gain.value=0.5; AU.seG.connect(AU.master); }
  if(AU.ctx.state==='suspended') AU.ctx.resume(); return AU.ctx; }catch(e){ return null; } }
function tone(f,dur,type,vol,dest,at,f2){ const a=ac(); if(!a) return; const t0=at||a.currentTime; const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.3,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(dest||AU.seG); o.start(t0); o.stop(t0+dur+0.02); }
const SE={
  down:()=>{ tone(330,0.22,'square',0.35); },
  up:()=>{ tone(784,0.22,'square',0.35); },
  tick:()=>tone(880,0.08,'square',0.25),
  go:()=>{ tone(660,0.12,'square',0.3); setTimeout(()=>tone(990,0.25,'square',0.3),120); },
  end:()=>{ tone(784,0.12,'triangle',0.4); setTimeout(()=>tone(659,0.12,'triangle',0.4),130); setTimeout(()=>tone(523,0.3,'triangle',0.4),260); },
  pip:()=>tone(1200,0.06,'square',0.22),
  ok:()=>{ tone(523,0.1,'square',0.25); setTimeout(()=>tone(784,0.18,'square',0.25),100); },
  fanfare:()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'square',0.28),i*110)); },
  find:()=>{ [784,988,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.35),i*80)); }
};
function se(k){ if(!SV.se) return; try{ SE[k](); }catch(e){} }
// 音声読み上げ
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); AU.voiceJa=vs.find(v=>/^ja/i.test(v.lang))||null; }catch(e){ AU.voiceJa=null; } return AU.voiceJa; }
try{ if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; } }catch(e){}
const voiceOn=()=>SV.voice!=='off'&&('speechSynthesis' in window)&&!!(AU.voiceJa||pickVoice());
function duck(on){ if(!AU.bgmG||!AU.ctx) return; const t=AU.ctx.currentTime; AU.bgmG.gain.cancelScheduledValues(t); AU.bgmG.gain.setTargetAtTime(SV.bgm?(on?0.03:0.11):0,t,0.05); }
function say(text,{cancel=true}={}){
  if(!voiceOn()) return false;
  try{ if(cancel) speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; if(AU.voiceJa) u.voice=AU.voiceJa; u.rate=1.08; u.volume=1;
    AU.speaking++; duck(true); talk(Math.min(4000,text.length*130)); u.onend=u.onerror=()=>{ AU.speaking=Math.max(0,AU.speaking-1); if(!AU.speaking) duck(false); };
    speechSynthesis.speak(u); setTimeout(()=>{ if(AU.speaking&&!speechSynthesis.speaking){ AU.speaking=0; duck(false);} },6000); return true; }catch(e){ return false; }
}
function shutUp(){ try{ speechSynthesis.cancel(); }catch(e){} AU.speaking=0; duck(false); }

// BGM（ファミコン風。WebAudio でその場で鳴らす）
const midi=n=>440*Math.pow(2,(n-69)/12);
const SONGS={
  home:{step:0.2,mel:[72,0,76,0,79,0,76,0,74,0,77,0,81,0,77,0,72,0,76,0,79,0,84,0,83,0,79,0,74,0,0,0],bass:[48,0,0,0,55,0,0,0,50,0,0,0,53,0,0,0,48,0,0,0,55,0,0,0,55,0,0,0,50,0,0,0]},
  rest:{step:0.3,mel:[76,0,0,74,72,0,0,0,74,0,0,72,69,0,0,0,72,0,0,74,76,0,79,0,77,0,76,0,74,0,0,0],bass:[45,0,52,0,45,0,52,0,41,0,48,0,41,0,48,0,43,0,50,0,43,0,50,0,48,0,55,0,48,0,55,0]},
  // 運動中：1小節＝1回（下げる2拍＋上げる2拍）。step は種目のテンポに合わせて決める
  rep:{mel:[69,72,76,72,69,72,76,72,74,77,81,77,74,77,81,77],bass:[45,0,45,0,45,0,45,0,50,0,50,0,50,0,50,0]},
  hold:{step:0.25,mel:[81,0,76,0,79,0,76,0,81,0,76,0,83,0,79,0],bass:[45,0,0,0,45,0,0,0,43,0,0,0,43,0,0,0]},
  done:{step:0.15,mel:[72,76,79,84,0,79,84,0,88,0,0,0,0,0,0,0],bass:[48,0,0,0,55,0,0,0,60,0,0,0,0,0,0,0],once:true}
};
const BGM={name:null,step:0,next:0,timer:null,song:null,stepDur:0.25};
function bgmPlay(name,stepDur){
  bgmStop(); if(!SV.bgm) return; const a=ac(); if(!a) return;
  BGM.name=name; BGM.song=SONGS[name]; BGM.stepDur=stepDur||BGM.song.step; BGM.step=0; BGM.next=a.currentTime+0.05;
  duck(AU.speaking>0); BGM.timer=setInterval(bgmTick,40); bgmTick();
}
function bgmStop(){ if(BGM.timer) clearInterval(BGM.timer); BGM.timer=null; BGM.name=null; }
function bgmTick(){ const a=AU.ctx; if(!a||!BGM.song) return; const S=BGM.song, n=S.mel.length;
  while(BGM.next<a.currentTime+0.15){ const i=BGM.step%n;
    if(S.once&&BGM.step>=n){ bgmStop(); return; }
    const m=S.mel[i], b=S.bass[i%S.bass.length];
    if(m) tone(midi(m),BGM.stepDur*0.85,'square',0.5,AU.bgmG,BGM.next);
    if(b) tone(midi(b),BGM.stepDur*1.6,'triangle',0.8,AU.bgmG,BGM.next);
    BGM.next+=BGM.stepDur; BGM.step++; } }

function wbFrame(o){ const k=JSON.stringify(o); if(!WBF[k]){ try{ WBF[k]=toCanvas(renderFront(o)); }catch(e){ WBF[k]=document.createElement('canvas'); } } return WBF[k]; }

const COACHES=new Set();
const MOOD_CLS={cheer:'jump',happy:'hop','':'breath',worry:'breath'};
function mountWB(root){ (root||document).querySelectorAll('span.wb').forEach(s=>{ const c=document.createElement('canvas'); c.width=FW; c.height=FH;
  c._mood=s.dataset.mood||''; c._seed=Math.random()*3000; c._talk=0; c.className='wbc '+(s.dataset.cls||MOOD_CLS[c._mood]||'');
  COACHES.add(c); drawCoach(c,performance.now()); s.replaceWith(c); }); }
function drawCoach(c,now){ const m=c._mood; let o={};
  if(m==='happy'||m==='cheer') o={eye:'happy',blush:true}; else if(m==='worry') o={eye:'half'};
  if(!o.eye&&(now+c._seed)%3400<140) o.eye='closed';
  if(c._talk>now){ const p=Math.floor(now/170)%2; o.chew=!!p; if(p) o.bob=0.6; }
  const f=wbFrame(o), x=c.getContext('2d'); x.clearRect(0,0,c.width,c.height); x.drawImage(f,0,0); }
setInterval(()=>{ const now=performance.now(); COACHES.forEach(c=>{ if(!c.isConnected){ COACHES.delete(c); return; } drawCoach(c,now); }); },90);
function talk(ms){ const until=performance.now()+ms; COACHES.forEach(c=>{ if(c.isConnected) c._talk=until; }); }
function setMood(root,mood){ (root||document).querySelectorAll('canvas.wbc').forEach(c=>{ c._mood=mood; c.className='wbc '+(MOOD_CLS[mood]||''); }); }
const wb=(mood,cls)=>`<span class="wb" data-mood="${mood||''}" data-cls="${cls||''}"></span>`;
// 吹き出しの文字を1文字ずつ出す（タップで全部出る）
function typeAll(root){ (root||document).querySelectorAll('[data-type]').forEach(el=>{ el.removeAttribute('data-type'); const html=el.innerHTML;
  const toks=html.split(/(<[^>]+>|&[a-z]+;)/).flatMap(p=>(p.startsWith('<')||p.startsWith('&'))?[p]:[...p]).filter(Boolean);
  const n=toks.length; if(REDUCE||!n) return; let i=0; el.innerHTML=''; talk(n*30+150);
  const step=()=>{ if(!el.isConnected||i>=n) return; i++; el.innerHTML=toks.slice(0,i).join(''); setTimeout(step,28); };
  el.addEventListener('click',()=>{ i=n; el.innerHTML=html; },{once:true}); step(); }); }

function confetti(n){ if(REDUCE) return; const fx=$('#fx'); const c=document.createElement('canvas'); c.width=innerWidth; c.height=innerHeight; c.style.cssText='position:absolute;inset:0;width:100%;height:100%'; fx.appendChild(c);
  const x=c.getContext('2d'), cols=['#f2c230','#3f8a57','#e2753f','#3f86c8','#e889a8','#fff'];
  const P=[...Array(n||90)].map(()=>({x:c.width/2+(Math.random()-.5)*60,y:c.height*0.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:4+Math.random()*5,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  const t0=performance.now(); (function f(now){ const t=now-t0; x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.vy+=0.32; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66); x.restore(); });
    if(t<2200) requestAnimationFrame(f); else c.remove(); })(t0); }
const spr=(id,cls)=>`<img class="${cls||''}" src="${animalDataURL(id,4)}" alt="">`;
function mountPoses(root){ (root||document).querySelectorAll('span.pz').forEach(s=>{ const c=document.createElement('canvas'); c.className='pzc'; s.replaceWith(c); drawPose(c,s.dataset.p,+s.dataset.t||0,0,0,{labels:false}); }); }

  if(b.kind==='ready'){ id='march'; p=0; }
  else if(b.kind==='warm'){ id='march'; const k=Math.floor(t/0.5); const x=(t%0.5)/0.5; p=ease(x<.5?x*2:2-x*2); side=k%2; }

      p=x<e.tempo[0]?ease(x/e.tempo[0]):1-ease((x-e.tempo[0])/e.tempo[1]); if(b.kind==='rest'&&t<7) p=0;
      side=b.kind==='rest'?(e.alt?i%2:0):sideOf(e,Math.min(i,m.reps-1),m.reps);
      if(e.sides) lab=e.sides[side]; }
    else p=(Math.sin(t*Math.PI)+1)/2; }

const findRate=lv=>Math.min(0.9,0.6+0.06*lv);

function weightOf(a,slot){ const lv=SV.skills[a.hab]||0; let w=RARW[a.rank]*(1+0.6*(lv-reqOf(a)));
  if(slot==='朝') w*=a.time==='d'?1.8:a.time==='n'?0.5:1; else if(slot==='夜') w*=a.time==='n'?1.8:a.time==='d'?0.5:1;
  if(!SV.dex[a.id]) w*=2.5; return w; }
function wpick(list,wf){ const ws=list.map(wf), s=ws.reduce((a,b)=>a+b,0); let r=Math.random()*s; for(let i=0;i<list.length;i++){ r-=ws[i]; if(r<=0) return list[i]; } return list[list.length-1]; }
function explore(tries,slot){
  const res=[]; let gotNew=false;
  for(let k=0;k<tries;k++){
    const el=eligible(); if(!el.length){ res.push({id:null,why:'none'}); continue; }
    const unf=el.filter(a=>!SV.dex[a.id]);
    const pity=SV.miss>=3&&unf.length&&!gotNew;
    if(!pity&&Math.random()>findRate(SV.skills.obs||0)){ res.push({id:null,why:'miss',hab:wpick(el,a=>weightOf(a,slot)).hab}); continue; }
    const a=pity?wpick(unf,x=>weightOf(x,slot)):wpick(el,x=>weightOf(x,slot));
    const isNew=!SV.dex[a.id]; SV.dex[a.id]=SV.dex[a.id]||{n:0,first:today()}; SV.dex[a.id].n++; if(isNew) gotNew=true;
    res.push({id:a.id,isNew,n:SV.dex[a.id].n,pity});
  }
  SV.miss=gotNew?0:SV.miss+1;
  if(!SV.hime&&dexCount()>=TOTAL_DEX){ SV.hime=true; SV.dex.himewombat={n:4,first:today()}; res.push({id:'himewombat',isNew:true,n:4,hime:true}); }

}

}

    extra+=aggHTML(aggregate(list),{goalMin:30});
  } else if(REP.tab==='month'){ const m0=new Date(now.getFullYear(),now.getMonth()+REP.off,1), m1=new Date(m0.getFullYear(),m0.getMonth()+1,1); list=sessionsIn(m0,m1); title=`${m0.getFullYear()}年${m0.getMonth()+1}月`;
    const weeks=[]; for(let w=weekStart(m0); w<m1; w=addDays(w,7)){ const l=weekSessions(w); weeks.push({lab:`${w.getMonth()+1}/${w.getDate()}`,v:l.reduce((a,b)=>a+b.active,0)}); }
    const mx=Math.max(1800,...weeks.map(w=>w.v));
    extra=`<div class="card"><h3 style="margin-top:0">週ごとの筋トレ時間</h3><div class="chart">${weeks.map(w=>`<div class="${w.v>=1800?'g':''}" style="height:${Math.round(w.v/mx*100)}%"><span>${w.lab}</span></div>`).join('')}</div><div style="height:14px"></div><p class="small">濃い緑は週30分に届いた週（週は月曜はじまり。月をまたぐ週は全体を表示）</p></div>`;
    extra+=aggHTML(aggregate(list));
  } else { list=SV.sessions; title='累計';
    const first=list.length?list[0].date:'—';
    extra=`<div class="card"><div class="kv"><span>はじめた日</span><b>${first}</b></div><div class="kv"><span>レベル</span><b>Lv.${SV.level}</b></div><div class="kv"><span>図鑑</span><b>${dexCount()} / ${TOTAL_DEX}種</b></div></div>`+aggHTML(aggregate(list));
    const fs=FACTS_CARD.filter(f=>SV.facts[f.id]);
    extra+=`<h3>解除したファクト（${fs.length}/${FACTS_CARD.length}）</h3>${fs.map(factHTML).join('')||'<p class="small">まだありません。</p>'}`;
    const lock=FACTS_CARD.filter(f=>!SV.facts[f.id]); if(lock.length) extra+=`<div class="card small">${lock.map(f=>`🔒 ${f.cond}`).join('<br>')}</div>`;
  }
  render(`<h1>レポート</h1>
  <div class="tabs" id="rt"><span class="chip ${REP.tab==='week'?'on':''}" data-t="week">週刊</span><span class="chip ${REP.tab==='month'?'on':''}" data-t="month">月刊</span><span class="chip ${REP.tab==='all'?'on':''}" data-t="all">累計</span></div>
  ${REP.tab!=='all'?`<div class="row" style="justify-content:space-between"><button class="btn sm sub" id="rp">◀</button><b>${title}</b><button class="btn sm sub" id="rn" ${REP.off>=0?'disabled':''}>▶</button></div>`:`<h2>${title}</h2>`}
  ${extra}`,{tab:'report'});
  $('#rt').onclick=e=>{ const c=e.target.closest('[data-t]'); if(!c) return; REP={tab:c.dataset.t,off:0}; reportScreen(); };
  if($('#rp')){ $('#rp').onclick=()=>{ REP.off--; reportScreen(); }; $('#rn').onclick=()=>{ if(REP.off<0){ REP.off++; reportScreen(); } }; }
}

// ================= 設定 =================
function settingsScreen(){
  render(`<h1>設定</h1>
  <div class="card">
  <div class="sw"><span>週の目標回数</span><select id="sG">${[2,3,4,5,6,7].map(n=>`<option ${n===SV.goal?'selected':''}>${n}</option>`).join('')}</select></div>
  <div class="sw"><span>体重（kg・任意）<br><span class="small">消費エネルギーのめやすに使う。この端末の中だけに保存</span></span><input type="number" id="sW" min="20" max="250" step="0.1" value="${SV.weight||''}" placeholder="未設定"></div>
  <div class="sw"><span>声の読み上げ</span><button class="btn sm ${SV.voice==='off'?'sub':''}" id="sV">${SV.voice==='off'?'OFF（音だけ）':'ON'}</button></div>
  <div class="sw"><span>BGM</span><button class="btn sm ${SV.bgm?'':'sub'}" id="sB">${SV.bgm?'ON':'OFF'}</button></div>
  <div class="sw"><span>振動<br><span class="small">対応している端末だけ</span></span><button class="btn sm ${SV.vib!==false?'':'sub'}" id="sVb">${SV.vib!==false?'ON':'OFF'}</button></div>
  <div class="sw"><span>効果音</span><button class="btn sm ${SV.se?'':'sub'}" id="sS">${SV.se?'ON':'OFF'}</button></div>
  <div class="sw"><span>運動の強さ（自動調整）<br><span class="small">いま：回数${repsFor()}回・キープ${holdFor()}秒</span></span><button class="btn sm sub" id="sD">最初にもどす</button></div>
  </div>
  <button class="btn sub" data-go="sound">音のチェックをやり直す</button>
  <div class="card"><h3 style="margin-top:0">バックアップ</h3><p class="small">記録はこのブラウザの中に保存されています。ブラウザのデータを消すと記録も消えるので、ときどき書き出しておくと安心です。</p>
  <button class="btn sub" id="bE">記録を書き出す（ファイル）</button>
  <label class="btn sub" style="text-align:center">記録を読み込む<input type="file" id="bI" accept="application/json,.json" hidden></label></div>
  <button class="btn warn" id="bR">すべての記録を消す</button>`,{tab:'settings'});
  $('#sG').onchange=e=>{ SV.goal=+e.target.value; save(); };
  $('#sW').onchange=e=>{ const v=parseFloat(e.target.value); SV.weight=(v>=20&&v<=250)?v:null; save(); toast(SV.weight?'体重を保存しました':'体重を未設定にしました'); };
  $('#sV').onclick=()=>{ SV.voice=SV.voice==='off'?'auto':'off'; save(); settingsScreen(); };
  $('#sB').onclick=()=>{ SV.bgm=!SV.bgm; save(); if(SV.bgm) bgmPlay('home'); else bgmStop(); settingsScreen(); };
  $('#sS').onclick=()=>{ SV.se=!SV.se; save(); settingsScreen(); };
  $('#sVb').onclick=()=>{ SV.vib=SV.vib===false; save(); if(SV.vib) buzz(60); settingsScreen(); };
  $('#sD').onclick=()=>{ SV.d=0; save(); settingsScreen(); toast('運動の強さを最初にもどしました'); };
  $('#bE').onclick=()=>{ const blob=new Blob([JSON.stringify(SV,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`wombat-kintore-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); };
  $('#bI').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s||s.v!==1||!Array.isArray(s.sessions)) throw 0;
      modal(`<p>読み込んだ記録（トレーニング${s.sessions.length}回・Lv.${s.level}）で、いまの記録を置きかえますか？</p><div class="row"><button class="btn sub" id="iN">やめる</button><button class="btn" id="iY">置きかえる</button></div>`);
      $('#iN').onclick=closeModal; $('#iY').onclick=()=>{ SV=Object.assign(defSave(),s); save(); closeModal(); toast('記録を読み込みました'); home(); };
    }catch(err){ toast('このファイルは読み込めませんでした'); } }; r.readAsText(f); };
  $('#bR').onclick=()=>{ modal(`<p><b>すべての記録を消しますか？</b><br>レベル・図鑑・レポートがすべて消え、元にもどせません。</p><div class="row"><button class="btn sub" id="rN">やめる</button><button class="btn warn" id="rY">消す</button></div>`);
    $('#rN').onclick=closeModal; $('#rY').onclick=()=>{ SV=defSave(); save(); closeModal(); home(); }; };
}

// ================= 起動 =================
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(RUN&&!RUN.paused){ /* 画面が隠れたら一時停止 */ togglePause(); } else bgmStop(); }
  else { if(RUN&&WAKE===null) wakeOn(); } });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal'&&!e.target.querySelector('#nx')&&!e.target.querySelector('[data-sk]')) closeModal(); });
home();

</script>
</body>
</html>
