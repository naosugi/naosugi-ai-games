<style>
:root {
    --font: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Kosugi Maru", sans-serif;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background-color: #f0f8ff;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    font-family: var(--font);
}
#game-container { position: fixed; inset: 0; background: #87CEEB; }
#game-container canvas { display: block; }
#safe-probe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: var(--sat) var(--sar) var(--sab) var(--sal);
}
button { font: inherit; color: inherit; touch-action: manipulation; }

/* ---------- start ---------- */
#start-overlay {
    position: fixed; inset: 0;
    background-color: rgba(255, 255, 255, 0.9);
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px;
    z-index: 100;
}
#start-button {
    font-size: 2rem;
    padding: 1rem 2.4rem;
    background-color: #ff6b6b;
    color: white;
    border: none;
    border-radius: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.1s;
}
#start-button:active { transform: scale(0.95); }
#start-overlay .back {
    position: absolute; left: calc(14px + var(--sal)); bottom: calc(14px + var(--sab));
    color: #8899aa; font-size: 14px; text-decoration: none; padding: 10px 6px;
}

/* ---------- HUD (home) ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
#hud[hidden] { display: none; }
#mode-btn {
    position: absolute;
    left: calc(8px + var(--sal)); top: calc(10px + var(--sat));
    min-width: 128px; height: 50px; padding: 0 16px;
    background: rgba(34,34,34,0.88);
    border: 2px solid #888; border-radius: 6px;
    color: #fff; font-size: 22px; font-weight: bold;
    pointer-events: auto; cursor: pointer;
}
#book-btn {
    position: absolute;
    right: calc(4px + var(--sar)); top: calc(2px + var(--sat));
    width: 72px; height: 72px; padding: 0;
    background: none; border: none;
    font-size: 54px; line-height: 72px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
    pointer-events: auto; cursor: pointer;
}
#mode-btn:active, #book-btn:active { transform: scale(0.93); }

/* ---------- modal ---------- */
#modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.85);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-y; overscroll-behavior: contain;
    padding: calc(12px + var(--sat)) calc(10px + var(--sar)) calc(20px + var(--sab)) calc(10px + var(--sal));
}
#modal[hidden] { display: none; }
.m-inner { max-width: 680px; margin: 0 auto; }
.m-head { position: relative; height: 58px; display: flex; align-items: center; justify-content: center; }
.m-title {
    color: #FFD700; font-size: 27px; letter-spacing: 1px;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
}
.m-close {
    position: absolute; right: -4px; top: 3px;
    width: 52px; height: 52px; border: none; background: none;
    color: #fff; font-size: 30px; cursor: pointer;
}
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-top: 8px; }
.mode-cell {
    height: 84px; border-radius: 4px; cursor: pointer;
    background: #333; border: 2px solid #666; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.mode-cell .lb { font-size: 24px; }
.mode-cell .pg { font-size: 18px; color: #999; }
.mode-cell.on { background: #FFD700; border-color: #FFAA00; color: #333; }
.mode-cell.on .lb { font-weight: bold; }
.mode-cell.on .pg { color: #555; }
.mode-cell:active { transform: scale(0.97); }
.tabs { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.tab {
    flex: 1 0 calc(20% - 3px); height: 44px;
    background: #333; border: 1px solid #555; color: #ccc;
    font-size: 22px; cursor: pointer; border-radius: 2px;
}
.tab.on { background: #FFD700; border-color: #FFAA00; color: #333; font-weight: bold; }
.chars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 40px; }
.ch { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: none; background: none; }
.ch .c {
    font-size: clamp(44px, 14vw, 90px); line-height: 1.15; color: #555;
    text-shadow: -3px -3px 0 #333, 3px -3px 0 #333, -3px 3px 0 #333, 3px 3px 0 #333, 0 3px 0 #333, 0 -3px 0 #333, 3px 0 0 #333, -3px 0 0 #333;
    transition: transform .1s;
}
.ch .w { font-size: clamp(13px, 3.4vw, 18px); color: #444; white-space: nowrap; }
.ch.done { cursor: pointer; }
.ch.done .c {
    color: #fff;
    text-shadow: -3px -3px 0 #FFA500, 3px -3px 0 #FFA500, -3px 3px 0 #FFA500, 3px 3px 0 #FFA500, 0 3px 0 #FFA500, 0 -3px 0 #FFA500, 3px 0 0 #FFA500, -3px 0 0 #FFA500;
}
.ch.done .w { color: #ddd; }
.ch.pop .c { transform: scale(1.4); }

/* ---------- debug ---------- */
#debug {
    position: fixed; z-index: 40; right: calc(10px + var(--sar)); bottom: calc(10px + var(--sab));
    display: flex; flex-direction: column; gap: 8px;
}
#debug[hidden] { display: none; }
#debug button { width: 150px; height: 52px; background: rgba(0,0,0,.7); border: none; font-size: 20px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="safe-probe"></div>

<div id="hud" hidden>
    <button id="mode-btn" type="button">あ行 ▼</button>
    <button id="book-btn" type="button" aria-label="ずかん">📖</button>
</div>
<div id="modal" hidden></div>
<div id="debug" hidden></div>

<div id="start-overlay">
    <button id="start-button" type="button">はじめる</button>
    <a class="back" href="../../">← ゲーム一覧</a>
</div>

// 描画解像度（高DPI端末でにじまないように。負荷を考えて最大2倍）
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const FONT = '"Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Kosugi Maru", sans-serif';

function safeInsets() {
    const cs = getComputedStyle(document.getElementById('safe-probe'));
    return {
        top: parseFloat(cs.paddingTop) || 0,
        right: parseFloat(cs.paddingRight) || 0,
        bottom: parseFloat(cs.paddingBottom) || 0,
        left: parseFloat(cs.paddingLeft) || 0
    };
}

// メモリのみ（リロードでリセット＝元の仕様どおり）
window.gameState = JSON.parse(JSON.stringify(INITIAL_STATE));

const Utils = {
    resetData: () => {
        window.gameState = JSON.parse(JSON.stringify(INITIAL_STATE));
    },

    speak: (text) => {
        if (!window.speechSynthesis) return;
        const synth = window.speechSynthesis;
        synth.cancel();
        if (window.audioController) window.audioController.duck();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 1.0;
        utterance.volume = 1.0;

        // onend が来ない端末でも BGM が小さいままにならないように保険をかける
        clearTimeout(Utils._unduckTimer);
        const done = () => {
            clearTimeout(Utils._unduckTimer);
            if (window.audioController) window.audioController.unduck();
        };
        utterance.onend = done;
        utterance.onerror = done;
        Utils._unduckTimer = setTimeout(done, 1500 + text.length * 250);

        setTimeout(() => {
            if (synth.paused) synth.resume();
            synth.speak(utterance);
        }, 50);
    },

    saveData: (key, value) => {
        window.gameState[key] = value;
    },

    getData: () => {
        return window.gameState;
    }
};

//  audio.js
// =========================================================
class AudioController {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgmOscillators = [];
        this.isMuted = false;
        this.masterGain = this.ctx.createGain();
        this.masterGain.connect(this.ctx.destination);
        this.masterGain.gain.value = 0.4;
        this.defaultVolume = 0.4;
    }

    duck() {
        this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.masterGain.gain.setTargetAtTime(0.005, this.ctx.currentTime, 0.15);
    }

    unduck() {
        this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.masterGain.gain.setTargetAtTime(this.defaultVolume, this.ctx.currentTime, 0.5);
    }

    resume() {
        if (this.ctx.state !== 'running') {
            this.ctx.resume();
        }
    }

    playBGM(mode) {
        if (this.isPlayingBGM) return;
        this.isPlayingBGM = true;
        this.stopBGMFlag = false;

        let notes, melody;
        if (mode && MODE_CONFIG[mode]) {
            notes = MODE_CONFIG[mode].bgmNotes;
            melody = MODE_CONFIG[mode].bgmMelody;
        } else {
            notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];
            melody = [
                { note: 0, dur: 0.5 }, { note: 2, dur: 0.5 }, { note: 4, dur: 1.0 },
                { note: 2, dur: 0.5 }, { note: 4, dur: 0.5 }, { note: 5, dur: 1.0 },
                { note: 4, dur: 0.5 }, { note: 2, dur: 0.5 }, { note: 0, dur: 1.0 },
                { note: 2, dur: 0.5 }, { note: -1, dur: 0.5 }
            ];
        }

        let noteIndex = 0;
        const playNextNote = () => {
            if (this.stopBGMFlag) return;

            const n = melody[noteIndex];
            noteIndex = (noteIndex + 1) % melody.length;

            if (n.note !== -1 && this.ctx.state === 'running') {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.value = notes[n.note];

                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + n.dur);

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.start();
                osc.stop(this.ctx.currentTime + n.dur);
            }

            this.bgmTimeout = setTimeout(playNextNote, n.dur * 1000);
        };

        playNextNote();
    }

    stopBGM() {
        this.stopBGMFlag = true;
        this.isPlayingBGM = false;
        if (this.bgmTimeout) clearTimeout(this.bgmTimeout);
    }

    playSE(type) {
        this.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        const now = this.ctx.currentTime;

        switch (type) {
            case 'pop':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                break;

            case 'correct':
                osc.start(now);
                osc.stop(now);
                this.playTone(523.25, 0.1, 0, 'sine');
                this.playTone(659.25, 0.1, 0.1, 'sine');
                this.playTone(783.99, 0.3, 0.2, 'sine');
                break;

            case 'incorrect':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
                break;

            case 'jump':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
                break;

            case 'shake':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                break;

            case 'sparkle':
                osc.start(now);
                osc.stop(now);
                this.playTone(880, 0.05, 0, 'sine');
                this.playTone(1108.73, 0.05, 0.05, 'sine');
                this.playTone(1318.51, 0.05, 0.1, 'sine');
                this.playTone(1760, 0.1, 0.15, 'sine');
                break;

            case 'pollen':
                osc.start(now);
                osc.stop(now);
                this.playTone(2000 + Math.random() * 1000, 0.05, 0, 'sine');
                break;

            case 'eat':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(380, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.13);
                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
                osc.start(now);
                osc.stop(now + 0.13);
                this.playTone(280, 0.08, 0.15, 'triangle');
                break;
        }
    }

    playTone(freq, duration, delay, type = 'sine') {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(this.masterGain);

        const now = this.ctx.currentTime + delay;
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.start(now);
        osc.stop(now + duration);
    }
}

// =========================================================
//  DOM UI（ボタン・図鑑・行えらび）
//  キャンバス内UIだと高DPI端末で文字がにじみ、ヒット判定も小さかったので DOM に置き換え
// =========================================================
const UI = {
    hud: document.getElementById('hud'),
    modal: document.getElementById('modal'),
    modeBtn: document.getElementById('mode-btn'),
    bookBtn: document.getElementById('book-btn'),
    scene: null,
    activeCollectionTab: null,

    bindHome(scene) {
        this.scene = scene;
        const mode = Utils.getData().gameMode || 'あ';
        this.modeBtn.textContent = MODE_CONFIG[mode].label + ' ▼';
        this.hud.hidden = false;
    },
    unbindHome() {
        this.scene = null;
        this.hud.hidden = true;
        this.closeModal();
    },
    isOpen() { return !this.modal.hidden; },
    closeModal() {
        this.modal.hidden = true;
        this.modal.innerHTML = '';
        if (this.scene && !this.scene.transitioning) this.hud.hidden = false;
    },
    open(title, bodyEl) {
        const m = this.modal;
        m.innerHTML = '';
        const inner = document.createElement('div');
        inner.className = 'm-inner';
        const head = document.createElement('div');
        head.className = 'm-head';
        head.innerHTML = '<div class="m-title"></div><button class="m-close" type="button" aria-label="とじる">✕</button>';
        head.querySelector('.m-title').textContent = title;
        head.querySelector('.m-close').addEventListener('click', () => this.closeModal());
        inner.appendChild(head);
        inner.appendChild(bodyEl);
        m.appendChild(inner);
        m.hidden = false;
        m.scrollTop = 0;
        this.hud.hidden = true;
    },

    openModeModal() {
        if (!this.scene) return;
        const data = Utils.getData();
        const collected = data.collectedHiragana || [];
        const grid = document.createElement('div');
        grid.className = 'mode-grid';
        Object.keys(MODE_CONFIG).forEach((m) => {
            const cfg = MODE_CONFIG[m];
            const chars = (HIRAGANA_DATA[m] || []).map(h => h.char);
            const done = chars.filter(c => collected.includes(c)).length;
            const isActive = data.gameMode === m;
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'mode-cell' + (isActive ? ' on' : '');
            b.innerHTML = `<span class="lb">${cfg.label}</span><span class="pg">${done} / ${chars.length}</span>`;
            b.addEventListener('click', () => {
                if (isActive) { this.closeModal(); return; }
                Utils.saveData('gameMode', m);
                this.closeModal();
                if (this.scene) this.scene.changeMode();
            });
            grid.appendChild(b);
        });
        this.open('もじをえらんでね', grid);
    },

    openCollection() {
        if (!this.scene) return;
        if (!this.activeCollectionTab) {
            this.activeCollectionTab = Utils.getData().gameMode || Object.keys(MODE_CONFIG)[0];
        }
        const wrap = document.createElement('div');
        const tabs = document.createElement('div');
        tabs.className = 'tabs';
        const chars = document.createElement('div');
        chars.className = 'chars';
        wrap.appendChild(tabs);
        wrap.appendChild(chars);

        const render = () => {
            const collected = Utils.getData().collectedHiragana || [];
            tabs.innerHTML = '';
            Object.keys(MODE_CONFIG).forEach((m) => {
                const t = document.createElement('button');
                t.type = 'button';
                t.className = 'tab' + (m === this.activeCollectionTab ? ' on' : '');
                t.textContent = m;
                t.addEventListener('click', () => {
                    if (m === this.activeCollectionTab) return;
                    this.activeCollectionTab = m;
                    render();
                });
                tabs.appendChild(t);
            });
            chars.innerHTML = '';
            (HIRAGANA_DATA[this.activeCollectionTab] || []).forEach((item) => {
                const isDone = collected.includes(item.char);
                const el = document.createElement(isDone ? 'button' : 'div');
                if (isDone) el.type = 'button';
                el.className = 'ch' + (isDone ? ' done' : '');
                el.innerHTML = '<span class="c"></span><span class="w"></span>';
                el.querySelector('.c').textContent = isDone ? item.char : '？';
                el.querySelector('.w').textContent = isDone ? item.word : '・・・';
                if (isDone) {
                    el.addEventListener('click', () => {
                        Utils.speak(item.word);
                        window.audioController.playSE('pop');
                        el.classList.add('pop');
                        setTimeout(() => el.classList.remove('pop'), 110);
                    });
                }
                chars.appendChild(el);
            });
        };
        render();
        this.open('あつめたひらがな', wrap);
    }
};
UI.modeBtn.addEventListener('click', () => UI.openModeModal());
UI.bookBtn.addEventListener('click', () => UI.openCollection());

UI.modal.addEventListener('click', (e) => { if (e.target === UI.modal) UI.closeModal(); });

class BootScene extends Phaser.Scene {
    constructor() {
        super('BootScene');
    }

    create() {
        const keys = Object.keys(ASSET_DATA);
        let left = keys.length;
        const next = () => { if (--left <= 0) this.scene.start('HomeScene'); };
        if (!left) { this.scene.start('HomeScene'); return; }
        keys.forEach((k) => {
            const img = new Image();
            img.onload = () => { this.textures.addImage(k, img); next(); };
            img.onerror = next;
            img.src = ASSET_DATA[k];
        });
    }
}

// =========================================================
//  HomeScene
// =========================================================
const WORLD = 2000;
const CASTLE_X = 1000, CASTLE_Y = 1580;
const TAP_SLOP = 12; // css px。これ以上動いたらタップではなくドラッグ扱い

class HomeScene extends Phaser.Scene {
    constructor() {
        super('HomeScene');
    }

    create(params) {
        const data = Utils.getData();
        const mode = data.gameMode || 'あ';
        const modeCfg = MODE_CONFIG[mode] || MODE_CONFIG['あ'];
        this.transitioning = false;
        this.pinch = null;

        if (window.audioController) {
            window.audioController.stopBGM();
            window.audioController.playBGM(mode);
        }

        // --- 0. Day/Night Cycle ---
        let isNight = Math.random() < 0.2;
        if (params && params.forceNight !== undefined) {
            isNight = params.forceNight;
        }
        this.currentIsNight = isNight;

        // --- 1. Sky ---
        const sky = this.add.graphics();
        if (isNight) {
            sky.fillGradientStyle(0x000033, 0x000033, 0x191970, 0x191970, 1);
        } else {
            sky.fillGradientStyle(modeCfg.skyTop, modeCfg.skyTop, modeCfg.skyBot, modeCfg.skyBot, 1);
        }
        sky.fillRect(0, 0, 2000, 1500);

        const mountains = this.add.graphics();
        mountains.fillStyle(isNight ? 0x2E7D32 : modeCfg.mountainColor, 1);
        mountains.fillTriangle(0, 1800, 500, 1400, 1000, 1800);
        mountains.fillTriangle(600, 1800, 1200, 1300, 1800, 1800);
        mountains.fillTriangle(1400, 1800, 1800, 1500, 2200, 1800);

        if (isNight) {
            const moonGlow = this.add.circle(1800, 200, 100, 0xFFFFCC, 0.3);
            this.tweens.add({ targets: moonGlow, scale: 1.2, alpha: 0.1, duration: 2000, yoyo: true, repeat: -1 });
            this.add.text(1800, 200, '🌙', { fontSize: '120px' }).setOrigin(0.5);
            for (let i = 0; i < 50; i++) {
                const star = this.add.text(Math.random() * 2000, Math.random() * 1000, '⭐', { fontSize: (10 + Math.random() * 20) + 'px' }).setAlpha(0.7);
                this.tweens.add({ targets: star, alpha: 0.2, duration: 1000 + Math.random() * 2000, yoyo: true, repeat: -1 });
            }
        } else {
            const sunGlow = this.add.circle(1800, 200, 120, 0xFFD700, 0.4);
            this.tweens.add({ targets: sunGlow, scale: 1.3, alpha: 0.2, duration: 3000, yoyo: true, repeat: -1 });
            const sun = this.add.text(1800, 200, '🌞', { fontSize: '150px' }).setOrigin(0.5);
            this.tweens.add({ targets: sun, angle: 360, duration: 20000, repeat: -1 });
        }

        this.physics.world.setBounds(0, 0, WORLD, WORLD);
        this.cameras.main.setBounds(0, 0, WORLD, WORLD);

        const ground = this.add.graphics();
        ground.fillStyle(isNight ? 0x4CAF50 : modeCfg.groundColor, 1);
        ground.fillEllipse(1000, 1850, 3000, 700);
        ground.fillEllipse(300, 1800, 1200, 400);
        ground.fillEllipse(1700, 1800, 1200, 400);

        // --- 2. Clouds & Rainbow & Egg ---
        this.createMysteryEgg();
        this.createSkyObjects();
        if (data.winCount >= 3) this.createRainbow();
        this.createClouds();

        // --- 3. Nature ---
        this.createNature();
        this.createFoods();

        // --- 4. Castle ---
        this.createCastle(CASTLE_X, CASTLE_Y, data.castleLevel, isNight);

        // --- 5. Particles ---
        this.createAtmosphereParticles(isNight);

        // --- 6. Animals ---
        this.animals = this.physics.add.group();
        (data.animals || []).forEach((animalType) => {
            this.createAnimal(1000 + (Math.random() - 0.5) * 1200, 1680 + (Math.random() - 0.5) * 100, animalType, isNight);
        });

        // --- Camera: 画面サイズに合わせてお城全体が見えるズームに ---
        this.fitCamera();

        // --- Input: タップとドラッグ（スクロール）・ピンチを区別 ---
        this.setupGestures();

        // --- Castle → さがすゲームへ ---
        this.onTap(this.castleContainer, () => this.goSearch());

        // --- 「ここをタッチ」ヒント ---
        this.setupHint(data);

        // --- HUD (DOM) ---
        UI.bindHome(this);
        this.events.once('shutdown', () => {
            UI.unbindHome();
            this.scale.off('resize', this.onResize, this);
        });
        this.scale.on('resize', this.onResize, this);

        // --- DEBUG (?debug=true) ---
        if (new URLSearchParams(window.location.search).get('debug') === 'true') {
            this.createDebugUI();
        }
    }

    // ---------------- camera / gestures ----------------

    // お城の前に物が重なってお城をタッチできない、を防ぐ
    clearOfCastle(x, y) {
        const ext = this.castleExtent();
        return !(Math.abs(x - CASTLE_X) < ext.half + 40 && y < CASTLE_Y + 90);
    }

    castleExtent() {
        const level = Utils.getData().castleLevel;
        const s = Math.min(1 + (level - 1) * 0.04, 2.0);
        let half = level >= 12 ? 310 : level >= 7 ? 240 : level >= 2 ? 150 : 75;
        let top = level >= 14 ? 330 : level >= 5 ? 320 : 210;
        return { half: half * s, top: top * s };
    }

    fitCamera() {
        const cam = this.cameras.main;
        const wCss = this.scale.width / DPR, hCss = this.scale.height / DPR;
        const ext = this.castleExtent();
        const viewW = Math.max(ext.half * 2 * 1.2, 540);
        const viewTop = CASTLE_Y - ext.top - 60;
        const viewBottom = CASTLE_Y + 260;
        const viewH = viewBottom - viewTop;
        const z = Phaser.Math.Clamp(Math.min(wCss / viewW, hCss / viewH), this.minZoomCss(), 1);
        cam.setZoom(z * DPR);
        cam.centerOn(CASTLE_X, (viewTop + viewBottom) / 2);
    }

    minZoomCss() {
        return Math.max(this.scale.width / DPR / WORLD, this.scale.height / DPR / WORLD, 0.25);
    }

    zoomAt(newZoom, sx, sy) {
        const cam = this.cameras.main;
        const z = Phaser.Math.Clamp(newZoom, this.minZoomCss() * DPR, 1.6 * DPR);
        const w2 = cam.width / 2, h2 = cam.height / 2;
        const wx = cam.scrollX + w2 + (sx - w2) / cam.zoom;
        const wy = cam.scrollY + h2 + (sy - h2) / cam.zoom;
        cam.setZoom(z);
        cam.scrollX = wx - w2 - (sx - w2) / z;
        cam.scrollY = wy - h2 - (sy - h2) / z;
    }

    onResize() {
        if (!this.cameras || !this.cameras.main) return;
        this.fitCamera();
    }

    setupGestures() {
        this.input.addPointer(1);
        const slop = TAP_SLOP * DPR;

        this.input.on('pointerdown', (p) => {
            p.__drag = false;
            window.audioController.resume();
        });

        this.input.on('pointermove', (p) => {
            if (!p.isDown || UI.isOpen()) return;
            if (!p.__drag && Math.hypot(p.x - p.downX, p.y - p.downY) > slop) p.__drag = true;
            if (this.pinch) return;
            if (!p.__drag) return;
            const cam = this.cameras.main;
            cam.scrollX -= (p.x - p.prevPosition.x) / cam.zoom;
            cam.scrollY -= (p.y - p.prevPosition.y) / cam.zoom;
        });

        // 何もない所をタップしたらキラキラ
        this.input.on('pointerup', (p, over) => {
            if (p.__drag || UI.isOpen() || this.transitioning) return;
            if (over && over.length) return;
            this.createTapSparkle(p.worldX, p.worldY);
        });

        // PC: ホイールでズーム
        this.input.on('wheel', (p, over, dx, dy) => {
            this.zoomAt(this.cameras.main.zoom * (dy > 0 ? 0.9 : 1.1), p.x, p.y);
        });
    }

    // タップ（指をほとんど動かさずに離した）ときだけ反応させる
    onTap(obj, fn) {
        obj.on('pointerup', (p) => {
            if (p.__drag || UI.isOpen() || this.transitioning) return;
            fn(p);
        });
    }

    update() {
        // ピンチズーム
        const p1 = this.input.pointer1, p2 = this.input.pointer2;
        if (p1 && p2 && p1.isDown && p2.isDown && !UI.isOpen()) {
            const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
            const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
            p1.__drag = p2.__drag = true;
            if (!this.pinch) {
                this.pinch = { d0: Math.max(d, 1), z0: this.cameras.main.zoom, mx, my };
            } else {
                const cam = this.cameras.main;
                cam.scrollX -= (mx - this.pinch.mx) / cam.zoom;
                cam.scrollY -= (my - this.pinch.my) / cam.zoom;
                this.pinch.mx = mx; this.pinch.my = my;
                this.zoomAt(this.pinch.z0 * d / this.pinch.d0, mx, my);
            }
        } else if (this.pinch && !(p1 && p1.isDown) && !(p2 && p2.isDown)) {
            this.pinch = null;
        }

        // 動物が地面から歩いて出ていかないように
        if (this.animals) {
            this.animals.getChildren().forEach((a) => {
                const b = a.body;
                if (!b || (b.velocity.x === 0 && b.velocity.y === 0)) return;
                if (a.x < 80 && b.velocity.x < 0) { b.velocity.x *= -1; a.setFlipX(false); }
                if (a.x > WORLD - 80 && b.velocity.x > 0) { b.velocity.x *= -1; a.setFlipX(true); }
                if (a.y < 1600 && b.velocity.y < 0) b.velocity.y *= -1;
                if (a.y > 1830 && b.velocity.y > 0) b.velocity.y *= -1;
            });
        }
    }

    setupHint(data) {
        if (data.winCount >= 3) return;
        const ext = this.castleExtent();
        this.hintTimer = this.time.delayedCall(data.winCount === 0 ? 2500 : 6000, () => {
            if (this.transitioning) return;
            const hand = this.add.text(CASTLE_X + 30, CASTLE_Y - ext.top * 0.35, '👆', { fontSize: '64px' })
                .setOrigin(0.5, 0).setDepth(4000).setAlpha(0);
            this.hint = hand;
            this.tweens.add({ targets: hand, alpha: 1, duration: 400 });
            this.tweens.add({ targets: hand, y: hand.y + 26, duration: 520, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        });
    }

    goSearch() {
        if (this.transitioning) return;
        this.transitioning = true;
        if (this.hint) this.hint.destroy();
        if (this.hintTimer) this.hintTimer.remove();
        UI.hud.hidden = true;
        UI.closeModal();
        window.audioController.playSE('sparkle');
        this.cameras.main.fadeOut(800, 255, 255, 255);
        this.cameras.main.once(Phaser.Cameras.Scene2D.Events.FADE_OUT_COMPLETE, () => {
            this.scene.start('SearchScene');
        });
    }

    changeMode() {
        if (this.transitioning) return;
        this.transitioning = true;
        UI.hud.hidden = true;
        this.cameras.main.fadeOut(400, 255, 255, 255);
        this.cameras.main.once(Phaser.Cameras.Scene2D.Events.FADE_OUT_COMPLETE, () => {
            this.scene.restart();
        });
    }

    createDebugUI() {
        const el = document.getElementById('debug');
        el.innerHTML = '';
        el.hidden = false;
        const buttons = [
            { text: 'RESET', color: '#ff0000', action: () => { Utils.resetData(); location.reload(); } },
            { text: 'WIN++', color: '#00ff00', action: () => {
                const d = Utils.getData();
                d.winCount = d.winCount + 1;
                this.scene.restart();
            } },
            { text: 'HATCH', color: '#ffff00', action: () => {
                const d = Utils.getData();
                d.winCount = d.eggsHatched * 5 + 4;
                this.scene.restart();
            } },
            { text: 'DAY/NIGHT', color: '#6688ff', action: () => {
                this.scene.restart({ forceNight: !(this.currentIsNight || false) });
            } },
            { text: 'ZUKAN', color: '#ff00ff', action: () => {
                const d = Utils.getData();
                d.collectedHiragana = Object.values(HIRAGANA_DATA).flat().map(h => h.char);
                Utils.speak('全部覚えたよ');
            } },
            { text: 'CLOSEUI', color: '#888888', action: () => { el.hidden = true; } }
        ];
        buttons.forEach((btn) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = btn.text;
            b.style.color = btn.color;
            b.addEventListener('click', btn.action);
            el.appendChild(b);
        });
        this.events.once('shutdown', () => { el.hidden = true; });
    }

    createRainbow() {
        const data = Utils.getData();
        const colors = [0xFF0000, 0xFF7F00, 0xFFFF00, 0x00FF00, 0x0000FF, 0x4B0082, 0x9400D3];
        const alpha = Math.min(0.1 + (data.winCount - 3) * 0.1, 0.6);
        const rb = this.add.graphics();
        rb.setAlpha(alpha);
        for (let i = 0; i < colors.length; i++) {
            rb.lineStyle(20, colors[i], 1);
            rb.beginPath();
            rb.arc(600, 1500, 800 + i * 20, Phaser.Math.DegToRad(200), Phaser.Math.DegToRad(340), false);
            rb.strokePath();
        }
    }

    createTapSparkle(x, y) {
        window.audioController.playSE('pollen');
        const k = 1 / (this.cameras.main.zoom / DPR); // 引いた画面でも同じ見た目の大きさに
        for (let i = 0; i < 5; i++) {
            const sparkle = this.add.text(x, y, '✨', { fontSize: '24px' }).setOrigin(0.5).setScale(k).setDepth(3000);
            this.physics.add.existing(sparkle);
            const angle = Math.random() * Math.PI * 2;
            const speed = (100 + Math.random() * 100) * k;
            sparkle.body.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed);
            this.tweens.add({
                targets: sparkle, alpha: 0, scale: 0.5 * k, duration: 600,
                onComplete: () => sparkle.destroy()
            });
        }
    }

    createClouds() {
        for (let i = 0; i < 10; i++) {
            const x = Math.random() * 2000;
            const y = 100 + Math.random() * 500;
            const cloud = this.add.text(x, y, '☁️', { fontSize: (80 + Math.random() * 80) + 'px' }).setAlpha(0.6);
            this.tweens.add({
                targets: cloud,
                x: x + (Math.random() > 0.5 ? 100 : -100),
                duration: 8000 + Math.random() * 8000,
                yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });
        }
    }

    createMysteryEgg() {
        const data = Utils.getData();
        let progress = Math.max(0, data.winCount - (data.eggsHatched * 5));

        const egg = this.add.text(1300, 1600, '🥚', { fontSize: '100px' }).setOrigin(0.5, 1);
        egg.setDepth(1590); // 大きくなったお城の後ろに隠れないように
        let scale = 1.0;
        egg.setInteractive();

        if (progress === 4) {
            scale = 1.3;
            egg.setScale(scale);
            this.tweens.add({ targets: egg, angle: { from: -10, to: 10 }, duration: 120, yoyo: true, repeat: -1 });
        }
        if (progress >= 1 && progress < 4) {
            this.tweens.add({ targets: egg, angle: { from: -5, to: 5 }, duration: 200 - (progress * 30), yoyo: true, repeat: -1 });
        }

        if (progress >= 5) {
            scale = 1.4;
            egg.setScale(scale);
            egg.setText('🥚✨');
            this.onTap(egg, () => {
                if (egg.hatching) return;
                egg.hatching = true;
                this.hatchEgg(egg);
            });
        } else {
            this.onTap(egg, () => {
                window.audioController.playSE('shake');
                this.tweens.add({
                    targets: egg, scaleX: scale * 1.2, scaleY: scale * 0.8, duration: 100, yoyo: true,
                    onComplete: () => {
                        Utils.speak(progress === 4 ? 'もうすぐうまれるよ！' : 'なにがうまれるかな？');
                    }
                });
            });
        }
    }

    hatchEgg(egg) {
        window.audioController.playSE('correct');
        Utils.speak('やったー！うまれたよ！');
        this.tweens.add({
            targets: egg, scale: 2.0, alpha: 0, duration: 1000,
            onComplete: () => {
                egg.destroy();
                this.spawnRareCreature(1300, 1600);
            }
        });
    }

    spawnRareCreature(x, y) {
        const rares = ['unicorn', 'dragon', 'trex', 'peacock'];
        const creatureKey = Phaser.Math.RND.pick(rares);

        const creature = this.add.image(x, y + 50, creatureKey).setOrigin(0.5);
        creature.setDisplaySize(150, 150);
        creature.setDepth(1700);
        this.physics.add.existing(creature);
        creature.body.setVelocity(0, -600);
        creature.body.gravity.y = 800;
        creature.body.setBounce(0.4);
        creature.body.setCollideWorldBounds(true);
        // 地面の上に着地させる（元は画面外の最下端まで落ちていた）
        creature.body.setBoundsRectangle(new Phaser.Geom.Rectangle(0, 0, WORLD, 1720));
        creature.setInteractive();

        const data = Utils.getData();
        data.animals.push(creatureKey);
        data.eggsHatched = data.eggsHatched + 1;

        this.onTap(creature, () => {
            window.audioController.playSE('jump');
            creature.body.setVelocityY(-450);
            Utils.speak('こんにちは！');
            const sx = creature.scaleX, sy = creature.scaleY;
            this.tweens.add({ targets: creature, scaleX: sx * 1.2, scaleY: sy * 0.8, duration: 100, yoyo: true });
        });
    }

    createNature() {
        const data = Utils.getData();
        const modeCfg = MODE_CONFIG[data.gameMode] || MODE_CONFIG['あ'];
        const totalToSpawn = 2 + data.floraCount;
        const items = modeCfg.floraItems;

        for (let i = 0; i < totalToSpawn; i++) {
            let x, y, tries = 0;
            do { x = Math.random() * 2000; y = 1580 + Math.random() * 250; } while (!this.clearOfCastle(x, y) && ++tries < 20);
            const item = this.add.text(x, y, Phaser.Math.RND.pick(items), { fontSize: '56px' }).setOrigin(0.5, 1);
            item.setInteractive();
            item.setDepth(y);
            this.onTap(item, () => {
                window.audioController.playSE('shake');
                this.tweens.add({
                    targets: item, scaleY: 0.8, scaleX: 1.2, duration: 100, yoyo: true,
                    onComplete: () => {
                        this.tweens.add({ targets: item, angle: { from: -15, to: 15 }, duration: 80, yoyo: true, repeat: 2 });
                    }
                });
            });
        }
    }

    createFoods() {
        const data = Utils.getData();
        const modeCfg = MODE_CONFIG[data.gameMode] || MODE_CONFIG['あ'];
        const foods = modeCfg.foodItems;
        const reactionEmoji = ['❤️', '😋', '✨', '🌟', '💫'];
        const count = 4 + Math.floor(Math.random() * 3);

        for (let i = 0; i < count; i++) {
            let x, y, tries = 0;
            do { x = 150 + Math.random() * 1700; y = 1570 + Math.random() * 220; } while (!this.clearOfCastle(x, y) && ++tries < 20);
            const emoji = Phaser.Math.RND.pick(foods);

            const food = this.add.text(x, y, emoji, { fontSize: '54px' }).setOrigin(0.5, 1);
            food.setInteractive();
            food.setDepth(y + 2);

            this.tweens.add({
                targets: food, y: food.y - 14,
                duration: 1100 + Math.random() * 900, yoyo: true, repeat: -1,
                ease: 'Sine.easeInOut', delay: Math.random() * 1200
            });

            this.onTap(food, () => {
                if (food.isEaten) return;
                food.isEaten = true;
                Utils.speak(FOOD_REACTIONS[emoji] || 'おいしい！');
                window.audioController.playSE('eat');

                for (let j = 0; j < 5; j++) {
                    const rx = food.x + (Math.random() - 0.5) * 90;
                    const ry = food.y - food.height * 0.5;
                    const r = this.add.text(rx, ry, Phaser.Math.RND.pick(reactionEmoji), { fontSize: '30px' }).setOrigin(0.5).setDepth(2000);
                    this.tweens.add({
                        targets: r,
                        y: ry - 90 - Math.random() * 70,
                        x: rx + (Math.random() - 0.5) * 70,
                        alpha: 0, scale: 1.5,
                        duration: 850 + Math.random() * 450,
                        ease: 'Sine.easeOut', delay: j * 60,
                        onComplete: () => r.destroy()
                    });
                }
                this.tweens.killTweensOf(food);
                this.tweens.add({
                    targets: food, scaleX: 1.5, scaleY: 1.5, alpha: 0, y: food.y - 70, angle: 20,
                    duration: 650, ease: 'Back.easeIn',
                    onComplete: () => food.destroy()
                });
            });
        }
    }

    createAtmosphereParticles(isNight = false) {
        const color = isNight ? 0xFFFF00 : 0xffffff;
        const alpha = isNight ? 1 : 0.3;
        for (let i = 0; i < 30; i++) {
            const p = this.add.circle(Math.random() * 2000, Math.random() * 1800, isNight ? 4 : 3, color, alpha);
            this.tweens.add({
                targets: p, y: '-=100', x: '+=30', alpha: 0,
                duration: 4000 + Math.random() * 4000, repeat: -1, delay: Math.random() * 5000
            });
        }
    }

    createCastle(x, y, level, isNight = false) {
        this.castleContainer = this.add.container(x, y);

        const modeCfg = MODE_CONFIG[Utils.getData().gameMode] || MODE_CONFIG['あ'];
        const wallColor = isNight ? 0xB8B8B8 : modeCfg.wallColor;
        const wallColorDark = isNight ? 0xA8A8A8 : modeCfg.wallColorDark;
        const roofColor = isNight ? 0xCC3333 : modeCfg.roofColor;
        const roofColorLight = isNight ? 0xFF6666 : modeCfg.roofColorLight;

        const graphics = this.add.graphics();
        graphics.fillStyle(0x000000, 0.15);
        graphics.fillEllipse(0, -5, 220, 50);

        graphics.fillStyle(wallColor, 1);
        graphics.fillRect(-60, -120, 120, 120);
        graphics.lineStyle(4, 0x333333, 1);
        graphics.strokeRect(-60, -120, 120, 120);
        graphics.fillStyle(roofColor, 1);
        graphics.fillTriangle(-75, -120, 75, -120, 0, -210);
        graphics.strokeTriangle(-75, -120, 75, -120, 0, -210);
        graphics.fillStyle(0x795548, 1);
        graphics.fillRect(-22, -45, 44, 45);
        graphics.strokeRect(-22, -45, 44, 45);

        if (level >= 2) {
            graphics.fillStyle(wallColorDark, 1);
            graphics.fillRect(-140, -80, 80, 80);
            graphics.strokeRect(-140, -80, 80, 80);
            graphics.fillStyle(roofColorLight, 1);
            graphics.fillTriangle(-150, -80, -50, -80, -100, -140);
            graphics.strokeTriangle(-150, -80, -50, -80, -100, -140);
        }
        if (level >= 3) {
            graphics.fillStyle(wallColorDark, 1);
            graphics.fillRect(60, -80, 80, 80);
            graphics.strokeRect(60, -80, 80, 80);
            graphics.fillStyle(roofColorLight, 1);
            graphics.fillTriangle(50, -80, 150, -80, 100, -140);
            graphics.strokeTriangle(50, -80, 150, -80, 100, -140);
        }
        if (level >= 4) {
            const roof = this.add.image(0, -180, 'castle_roof').setOrigin(0.5);
            roof.setDisplaySize(180, 150);
            this.castleContainer.add(roof);
        }
        if (level >= 5) {
            const flag = this.add.image(25, -280, 'castle_flag').setOrigin(0.5);
            flag.setDisplaySize(100, 80);
            this.castleContainer.add(flag);
            const fs = flag.scaleX;
            this.tweens.add({ targets: flag, scaleX: fs * 0.9, angle: 5, duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        }

        if (isNight || level >= 4) {
            const lightL = this.add.circle(-22, -80, 8, isNight ? 0xFF9800 : 0xFFFF00, 0.8);
            const lightR = this.add.circle(22, -80, 8, isNight ? 0xFF9800 : 0xFFFF00, 0.8);
            this.castleContainer.add(lightL);
            this.castleContainer.add(lightR);
            this.tweens.add({ targets: [lightL, lightR], alpha: 0.4, duration: 1000 + Math.random() * 500, yoyo: true, repeat: -1 });
        }

        this.castleContainer.add(graphics);
        const text = this.add.text(0, 40, '👑', { fontSize: '56px' }).setOrigin(0.5);
        this.castleContainer.add(text);

        this.createCastleExtensions(level, isNight, wallColor, wallColorDark, roofColor, roofColorLight);

        const castleScale = Math.min(1 + (level - 1) * 0.04, 2.0);
        this.castleContainer.setScale(castleScale);

        this.tweens.add({
            targets: this.castleContainer,
            scaleX: castleScale + 0.03, scaleY: castleScale + 0.03,
            yoyo: true, repeat: -1, duration: 1800, ease: 'Sine.easeInOut'
        });

        // タップ判定：お城の形全体（成長にあわせて広げる）
        const half = level >= 12 ? 310 : level >= 7 ? 240 : level >= 2 ? 150 : 90;
        const top = level >= 14 ? 330 : level >= 5 ? 310 : 215;
        this.castleContainer.setInteractive(new Phaser.Geom.Rectangle(-half, -top, half * 2, top + 75), Phaser.Geom.Rectangle.Contains);
    }

    createCastleExtensions(level, isNight, wallColor, wallColorDark, roofColor, roofColorLight) {
        const container = this.castleContainer;
        const flagColors = [0xFF0000, 0xFFFF00, 0x00FF00, 0x0000FF, 0xFF00FF, 0xFF6600, 0x00FFFF];

        if (level >= 6) {
            const g6 = this.add.graphics();
            g6.fillStyle(wallColor, 1);
            g6.lineStyle(2, 0x333333, 1);
            for (let i = 0; i < 3; i++) {
                g6.fillRect(-138 + i * 26, -98, 18, 20);
                g6.strokeRect(-138 + i * 26, -98, 18, 20);
            }
            for (let i = 0; i < 3; i++) {
                g6.fillRect(62 + i * 26, -98, 18, 20);
                g6.strokeRect(62 + i * 26, -98, 18, 20);
            }
            const winColor = isNight ? 0xFF9800 : 0x87CEEB;
            g6.fillStyle(winColor, 0.9);
            g6.fillRect(-118, -70, 18, 22);
            g6.fillRect(100, -70, 18, 22);
            container.add(g6);
        }

        if (level >= 7) {
            const g7 = this.add.graphics();
            g7.fillStyle(wallColor, 1);
            g7.lineStyle(3, 0x333333, 1);
            g7.fillRect(-230, -100, 70, 100);
            g7.strokeRect(-230, -100, 70, 100);
            g7.fillStyle(roofColor, 1);
            g7.fillTriangle(-240, -100, -150, -100, -195, -170);
            g7.strokeTriangle(-240, -100, -150, -100, -195, -170);
            for (let i = 0; i < 3; i++) {
                g7.fillStyle(wallColor, 1);
                g7.fillRect(-228 + i * 24, -118, 16, 20);
                g7.strokeRect(-228 + i * 24, -118, 16, 20);
            }
            container.add(g7);
        }

        if (level >= 8) {
            const g8 = this.add.graphics();
            g8.fillStyle(wallColor, 1);
            g8.lineStyle(3, 0x333333, 1);
            g8.fillRect(160, -100, 70, 100);
            g8.strokeRect(160, -100, 70, 100);
            g8.fillStyle(roofColor, 1);
            g8.fillTriangle(150, -100, 240, -100, 195, -170);
            g8.strokeTriangle(150, -100, 240, -100, 195, -170);
            for (let i = 0; i < 3; i++) {
                g8.fillStyle(wallColor, 1);
                g8.fillRect(162 + i * 24, -118, 16, 20);
                g8.strokeRect(162 + i * 24, -118, 16, 20);
            }
            container.add(g8);
        }

        if (level >= 9) {
            const g9 = this.add.graphics();
            g9.fillStyle(0x4FC3F7, 0.7);
            g9.fillEllipse(0, 30, 380, 55);
            g9.lineStyle(3, 0x0288D1, 0.9);
            g9.strokeEllipse(0, 30, 380, 55);
            const fish = this.add.text(Phaser.Math.Between(-60, 60), 30, '🐟', { fontSize: '24px' }).setOrigin(0.5);
            this.tweens.add({
                targets: fish, x: fish.x + (Math.random() > 0.5 ? 80 : -80),
                duration: 3000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });
            container.addAt(g9, 0);
            container.addAt(fish, 1);
        }

        if (level >= 10) {
            const g10 = this.add.graphics();
            g10.fillStyle(wallColorDark, 1);
            g10.lineStyle(3, 0x333333, 1);
            g10.fillRect(-230, -45, 90, 45);
            g10.strokeRect(-230, -45, 90, 45);
            g10.fillRect(140, -45, 90, 45);
            g10.strokeRect(140, -45, 90, 45);
            container.add(g10);
        }

        if (level >= 11) {
            const g11 = this.add.graphics();
            const polePositions = [[0, -215], [-100, -148], [100, -148], [-195, -175], [195, -175]];
            polePositions.forEach(([px, py]) => {
                const col = Phaser.Math.RND.pick(flagColors);
                g11.fillStyle(col, 1);
                g11.fillTriangle(px, py, px + 28, py - 10, px, py - 25);
                g11.lineStyle(2, 0x5D4037, 1);
                g11.beginPath();
                g11.moveTo(px, py);
                g11.lineTo(px, py + 35);
                g11.strokePath();
            });
            container.add(g11);
        }

        if (level >= 12) {
            const g12 = this.add.graphics();
            g12.fillStyle(wallColor, 1);
            g12.lineStyle(3, 0x333333, 1);
            g12.fillRect(-300, -90, 60, 90);
            g12.strokeRect(-300, -90, 60, 90);
            g12.fillRect(240, -90, 60, 90);
            g12.strokeRect(240, -90, 60, 90);
            g12.fillStyle(roofColor, 1);
            g12.fillTriangle(-310, -90, -230, -90, -270, -165);
            g12.strokeTriangle(-310, -90, -230, -90, -270, -165);
            g12.fillTriangle(230, -90, 310, -90, 270, -165);
            g12.strokeTriangle(230, -90, 310, -90, 270, -165);
            g12.fillStyle(wallColorDark, 0.8);
            g12.fillRect(-240, -50, 480, 50);
            g12.lineStyle(2, 0x333333, 0.8);
            g12.strokeRect(-240, -50, 480, 50);
            container.addAt(g12, 0);
        }

        if (level >= 13) {
            const gemEmoji = ['💎', '⭐', '🌟', '✨'];
            const gemPos = [[0, -230], [-100, -158], [100, -158], [-195, -180], [195, -180], [-50, -145], [50, -145]];
            gemPos.forEach(([gx, gy]) => {
                const gem = this.add.text(gx, gy, Phaser.Math.RND.pick(gemEmoji), { fontSize: '22px' }).setOrigin(0.5);
                container.add(gem);
                this.tweens.add({
                    targets: gem, y: gy - 10, alpha: { from: 0.6, to: 1 },
                    duration: 500 + Math.random() * 700, yoyo: true, repeat: -1
                });
            });
        }

        if (level >= 14) {
            const g14 = this.add.graphics();
            g14.fillStyle(roofColor, 1);
            g14.lineStyle(2, 0x333333, 1);
            g14.fillTriangle(-20, -210, 20, -210, 0, -330);
            g14.strokeTriangle(-20, -210, 20, -210, 0, -330);
            g14.fillTriangle(-108, -140, -92, -140, -100, -220);
            g14.fillTriangle(92, -140, 108, -140, 100, -220);
            container.add(g14);
        }

        if (level >= 15) {
            const sparkEmoji = ['🌟', '✨', '💫', '⭐'];
            for (let i = 0; i < 6; i++) {
                const angle0 = (i / 6) * Math.PI * 2;
                const r = 180;
                const sp = this.add.text(Math.cos(angle0) * r, Math.sin(angle0) * r - 110, Phaser.Math.RND.pick(sparkEmoji), { fontSize: '28px' }).setOrigin(0.5).setAlpha(0.85);
                container.add(sp);
                const angle1 = ((i + 1) / 6) * Math.PI * 2;
                this.tweens.add({
                    targets: sp, x: Math.cos(angle1) * r, y: Math.sin(angle1) * r - 110,
                    duration: 3000 + i * 300, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
                });
            }
        }

        if (level >= 6 && Math.random() < 0.4) {
            const bonusEmojis = ['🌈', '🎆', '🎇', '🏳️', '🪄'];
            const bonus = this.add.text((Math.random() - 0.5) * 200, -250 - Math.random() * 80,
                Phaser.Math.RND.pick(bonusEmojis), { fontSize: '32px' }).setOrigin(0.5).setAlpha(0.8);
            container.add(bonus);
            this.tweens.add({
                targets: bonus, y: bonus.y - 20, alpha: { from: 0.5, to: 1 },
                duration: 2000 + Math.random() * 1000, yoyo: true, repeat: -1
            });
        }
    }

    createSkyObjects() {
        const plane = this.add.text(-200, 300, '✈️', { fontSize: '80px' }).setOrigin(0.5);
        this.tweens.add({ targets: plane, x: 2200, duration: 15000, repeat: -1, delay: 5000 });
        const balloon = this.add.text(2200, 500, '🎈', { fontSize: '80px' }).setOrigin(0.5);
        this.tweens.add({ targets: balloon, x: -200, y: 400, duration: 25000, repeat: -1, delay: 0 });
    }

    createAnimal(x, y, type, isNight = false) {
        let animal;
        const isSprite = ['unicorn', 'dragon', 'trex', 'peacock'].includes(type);
        if (isSprite) {
            animal = this.add.image(x, y, type).setOrigin(0.5);
            animal.setDisplaySize(120, 120);
        } else {
            animal = this.add.text(x, y, type, { fontSize: '72px' }).setOrigin(0.5);
        }
        this.physics.add.existing(animal);
        animal.setInteractive();
        animal.setDepth(y);
        const baseSX = animal.scaleX, baseSY = animal.scaleY;

        if (isNight && (type === 'dragon' || type === 'unicorn' || type === 'peacock')) {
            animal.body.allowGravity = false;
            this.tweens.add({ targets: animal, y: y - 300, x: x + 200, duration: 4000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        } else {
            this.time.addEvent({
                delay: 4000 + Math.random() * 3000,
                callback: () => {
                    if (!animal.body) return;
                    const speed = 45;
                    const angle = Math.random() * Math.PI * 2;
                    animal.body.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed);
                    animal.setFlipX(Math.cos(angle) < 0);
                    animal.setDepth(animal.y);
                },
                loop: true
            });
        }

        this.onTap(animal, () => {
            if (animal.jumping) return;
            animal.jumping = true;
            window.audioController.playSE('jump');
            this.tweens.add({
                targets: animal,
                y: animal.y - 120,
                scaleX: baseSX * 1.3, scaleY: baseSY * 0.7,
                duration: 250, yoyo: true,
                onComplete: () => {
                    animal.jumping = false;
                    const bubbleItems = ['❤️', '🍭', '🍓', '🌟', '🥕', '🍦'];
                    const heart = this.add.text(animal.x, animal.y - 100, Phaser.Math.RND.pick(bubbleItems), { fontSize: '40px' }).setOrigin(0.5).setDepth(2500);
                    this.tweens.add({
                        targets: heart, y: heart.y - 80, alpha: 0, scale: 1.5, duration: 1000,
                        onComplete: () => heart.destroy()
                    });
                }
            });
        });
        this.animals.add(animal);
    }
}

// =========================================================
//  SearchScene
// =========================================================
const MODE_BLOCK_TINT = {
    'あ': [0, 0, 25], 'か': [25, 10, 0], 'さ': [0, 25, 0], 'た': [15, 0, 30], 'な': [0, 20, 30],
    'は': [30, 15, 0], 'ま': [25, 10, -10], 'や': [10, 10, 30], 'ら': [30, 0, 20]
};

class SearchScene extends Phaser.Scene {
    constructor() {
        super('SearchScene');
    }

    create() {
        if (window.audioController) window.audioController.stopBGM();
        this.cameras.main.fadeIn(500, 0, 0, 0);
        this.cameras.main.setBackgroundColor('#333');

        this.targetHiragana = this.getRandomHiragana();
        this.isGameActive = true;
        this.found = null;

        // ヘッダー（タップでもういちど読み上げ）
        this.headerBg = this.add.rectangle(0, 0, 10, 10, 0x000000, 0.5).setDepth(100).setOrigin(0.5);
        this.headerBg.setInteractive();
        this.headerBg.on('pointerdown', () => this.repeatQuestion());

        this.questionText = this.add.text(0, 0, `「${this.targetHiragana.char}」をさがしてね`, {
            fontSize: '40px', color: '#ffffff', fontFamily: FONT,
            stroke: '#000000', strokeThickness: 4
        }).setOrigin(0.5).setAlpha(0).setDepth(101);

        this.speakerIcon = this.add.text(0, 0, '🔊', { fontSize: '28px' }).setOrigin(0.5).setAlpha(0).setDepth(101);

        this.time.delayedCall(500, () => {
            Utils.speak(`${this.targetHiragana.word}の、${this.targetHiragana.char}、をさがしてね`);
            this.tweens.add({ targets: this.questionText, alpha: 1, duration: 800 });
            this.tweens.add({ targets: this.speakerIcon, alpha: 0.75, duration: 800 });
        });

        this.createBlocks();
        this.layout();

        this.scale.on('resize', this.layout, this);
        this.events.once('shutdown', () => this.scale.off('resize', this.layout, this));
    }

    repeatQuestion() {
        if (!this.isGameActive) return;
        Utils.speak(`${this.targetHiragana.word}の、${this.targetHiragana.char}、をさがしてね`);
        this.tweens.add({ targets: this.speakerIcon, scale: 1.3, duration: 120, yoyo: true });
    }

    getRandomHiragana() {
        const mode = Utils.getData().gameMode || 'あ';
        const list = HIRAGANA_DATA[mode] || HIRAGANA_DATA['あ'];
        return Phaser.Math.RND.pick(list);
    }

    createBlocks() {
        const rows = 4, cols = 4;
        this.rows = rows; this.cols = cols;
        this.cells = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) this.cells.push({ r, c, content: null, block: null, brokenAt: 0 });
        }

        const order = Phaser.Utils.Array.Shuffle(this.cells.slice());
        // 正解
        this.createContent(order.pop(), this.targetHiragana.char, true);
        // おなじ行のちがう文字を3つ
        const mode = Utils.getData().gameMode || 'あ';
        const modeList = HIRAGANA_DATA[mode] || HIRAGANA_DATA['あ'];
        const decoys = modeList.map(h => h.char).filter(c => c !== this.targetHiragana.char);
        for (let i = 0; i < 3; i++) {
            if (order.length === 0) break;
            this.createContent(order.pop(), Phaser.Math.RND.pick(decoys), false);
        }
        // 全部をブロックで隠す
        this.cells.forEach(cell => this.createBlock(cell));
    }

    createContent(cell, char, isTarget) {
        const text = this.add.text(0, 0, char, {
            fontSize: '100px', color: '#ffffff', fontFamily: FONT,
            stroke: '#000000', strokeThickness: 8,
            shadow: { offsetX: 4, offsetY: 4, color: '#000', blur: 4, stroke: true, fill: true }
        }).setOrigin(0.5).setDepth(10);
        // マス全体をタップ判定にする（文字の形だけだと小さくて押しにくい）
        const zone = this.add.zone(0, 0, 10, 10).setDepth(11).setInteractive();
        zone.on('pointerdown', () => {
            if (!this.isGameActive) return;
            // ブロックを割った指でそのまま連打して誤答しないように少し待つ
            if (this.time.now - cell.brokenAt < 280) return;
            if (isTarget) this.handleCorrect(text);
            else this.handleIncorrect(char);
        });
        cell.content = { text, zone, char, isTarget };
    }

    createBlock(cell) {
        const mode = Utils.getData().gameMode || 'あ';
        const v = 50 + Math.random() * 40;
        const t = MODE_BLOCK_TINT[mode] || MODE_BLOCK_TINT['あ'];
        const color = Phaser.Display.Color.GetColor(v + t[0], v + t[1], v + t[2]);
        const block = this.add.rectangle(0, 0, 10, 10, color).setDepth(20).setInteractive();
        block.on('pointerdown', () => {
            if (!this.isGameActive) return;
            this.createExplosion(block.x, block.y);
            window.audioController.playSE('pop');
            cell.brokenAt = this.time.now;
            cell.block = null;
            block.destroy();
        });
        cell.block = block;
    }

    layout() {
        const W = this.scale.width, H = this.scale.height, u = DPR;
        const ins = safeInsets();
        const top = ins.top * u, bottom = ins.bottom * u;

        // ヘッダー
        const headerH = Math.round(Math.min(100 * u, Math.max(70 * u, H * 0.13)));
        const hy = top + 10 * u + headerH / 2;
        this.headerBg.setPosition(W / 2, hy).setSize(W, headerH);
        this.headerBg.input.hitArea.setTo(0, 0, W, headerH);
        const qSize = Math.min(40 * u, (W - 120 * u) / 9.4, headerH * 0.45);
        this.questionText.setFontSize(Math.round(qSize) + 'px').setStroke('#000000', Math.max(2, qSize / 10));
        this.questionText.setPosition(W / 2 - 16 * u, hy);
        this.speakerIcon.setFontSize(Math.round(Math.min(28 * u, headerH * 0.32)) + 'px');
        this.speakerIcon.setPosition(W - 28 * u - ins.right * u, hy);
        this.uiScale = qSize / 40;

        // グリッド（画面幅にあわせて伸び縮み）
        const gTop = hy + headerH / 2 + 12 * u;
        const gBottom = H - bottom - 12 * u;
        const cell = Math.floor(Math.min(150 * u, (W - 16 * u) / this.cols, (gBottom - gTop) / this.rows));
        this.cellSize = cell;
        const startX = (W - this.cols * cell) / 2 + cell / 2;
        const startY = gTop + Math.max(0, (gBottom - gTop) - this.rows * cell) / 2 + cell / 2;
        const k = cell / 150;
        this.gridK = k;

        this.cells.forEach((c) => {
            const x = startX + c.c * cell, y = startY + c.r * cell;
            c.x = x; c.y = y;
            if (c.block) c.block.setPosition(x, y).setSize(140 * k, 140 * k);
            if (c.block && c.block.input) c.block.input.hitArea.setTo(0, 0, 140 * k, 140 * k);
            if (c.content) {
                const t = c.content.text;
                if (t !== this.found) {
                    t.setFontSize(Math.round(100 * k) + 'px');
                    t.setStroke('#000000', 8 * k);
                    t.setShadow(4 * k, 4 * k, '#000', 4 * k, true, true);
                    t.setPosition(x, y);
                }
                c.content.zone.setPosition(x, y).setSize(cell, cell);
                c.content.zone.input.hitArea.setTo(0, 0, cell, cell);
            }
        });

        if (this.found) {
            this.tweens.killTweensOf(this.found);
            this.found.setPosition(W / 2, H / 2).setScale(this.foundScale());
        }
    }

    foundScale() {
        const W = this.scale.width, H = this.scale.height;
        const fs = 100 * this.gridK;
        return Math.min(4, (Math.min(W, H) * 0.6) / fs);
    }

    createExplosion(x, y) {
        const k = this.gridK || 1;
        for (let i = 0; i < 8; i++) {
            const circle = this.add.circle(x, y, (Math.random() * 10 + 5) * k, 0xffffff);
            circle.setDepth(3);
            this.physics.add.existing(circle);
            const angle = Math.random() * Math.PI * 2;
            const speed = (150 + Math.random() * 100) * k;
            circle.body.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed);
            this.tweens.add({
                targets: circle, alpha: 0, scale: 0, duration: 600,
                onComplete: () => circle.destroy()
            });
        }
    }

    handleCorrect(targetObj) {
        this.isGameActive = false;
        this.found = targetObj;

        window.audioController.playSE('correct');
        Utils.speak(`おめでとう！${this.targetHiragana.word}の、${this.targetHiragana.char}、をみつけたよ`);

        targetObj.setDepth(200);
        targetObj.setResolution(Math.min(3, Math.ceil(this.foundScale())));
        this.tweens.add({
            targets: targetObj,
            x: this.scale.width / 2,
            y: this.scale.height / 2,
            scale: this.foundScale(),
            duration: 1200,
            ease: 'Back.easeOut',
            onComplete: () => {
                this.cameras.main.flash(500, 255, 255, 255);
            }
        });

        // ごほうび（元のロジックそのまま）
        const currentData = Utils.getData();
        currentData.winCount = currentData.winCount + 1;
        if (!currentData.collectedHiragana.includes(this.targetHiragana.char)) {
            currentData.collectedHiragana.push(this.targetHiragana.char);
        }

        let message = '';
        const mode = currentData.gameMode || 'あ';
        const modeCfg = MODE_CONFIG[mode] || MODE_CONFIG['あ'];
        const rewardType = (currentData.castleLevel + currentData.animals.length + (currentData.floraCount / 5)) % 3;

        if (rewardType < 1) {
            currentData.castleLevel = currentData.castleLevel + 1;
            message = modeCfg.winCastleMsg;
        } else if (rewardType < 2) {
            currentData.animals.push(Phaser.Math.RND.pick(modeCfg.animalPool));
            message = modeCfg.winAnimalMsg;
        } else {
            currentData.floraCount = currentData.floraCount + 5;
            message = modeCfg.winFloraMsg;
        }

        this.time.delayedCall(4000, () => {
            Utils.speak(message);
            this.cameras.main.fadeOut(1000, 0, 0, 0);
            this.cameras.main.once(Phaser.Cameras.Scene2D.Events.FADE_OUT_COMPLETE, () => {
                this.scene.start('HomeScene');
            });
        });
    }

    handleIncorrect(char) {
        Utils.speak(`これは、${char}、だよ`);
        this.cameras.main.shake(200, 0.01);
    }
}

// =========================================================
//  game.js
// =========================================================
let game = null;

function viewportSize() {
    const c = document.getElementById('game-container');
    return { w: Math.max(1, c.clientWidth), h: Math.max(1, c.clientHeight) };
}

function startGame() {
    const { w, h } = viewportSize();
    game = new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game-container',
        backgroundColor: '#87CEEB',
        // キャンバスは端末の解像度で描き、CSS上は画面ぴったりに縮める
        scale: {
            mode: Phaser.Scale.NONE,
            width: Math.round(w * DPR),
            height: Math.round(h * DPR),
            zoom: 1 / DPR
        },
        input: { activePointers: 3 },
        physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
        scene: [BootScene, HomeScene, SearchScene]
    });

    let rt = null;
    const onResize = () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
            const s = viewportSize();
            game.scale.resize(Math.round(s.w * DPR), Math.round(s.h * DPR));
        }, 80);
    };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
}

document.getElementById('start-button').addEventListener('click', () => {
    document.getElementById('start-overlay').style.display = 'none';

    // iOS: ユーザー操作の中で音声と AudioContext を有効にする
    Utils.speak('はじまるよ！');
    window.audioController.resume();
    window.audioController.playBGM();

    // 文字をキャンバスに描く前にフォントを読み込む（最大1.2秒待つ）
    const chars = 'はじまるよをさがしてね「」' + Object.values(HIRAGANA_DATA).flat().map(h => h.char).join('');
    const fontReady = (document.fonts && document.fonts.load)
        ? Promise.race([
            document.fonts.load('40px "Kosugi Maru"', chars).catch(() => null),
            new Promise(r => setTimeout(r, 1200))
        ])
        : Promise.resolve();
    fontReady.then(startGame);
});

// アプリを裏に回したら音を止め、戻ったら再開
document.addEventListener('visibilitychange', () => {
    const ac = window.audioController;
    if (document.hidden) {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (ac.ctx.state === 'running') ac.ctx.suspend();
    } else if (game) {
        ac.resume();
        ac.unduck();
    }
});

// iOS Safari のピンチ拡大・ダブルタップ拡大を抑止（ゲーム内のピンチは独自処理）
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd < 320 && !e.target.closest('button, a')) e.preventDefault();
    lastTouchEnd = now;
}, { passive: false });
</script>
