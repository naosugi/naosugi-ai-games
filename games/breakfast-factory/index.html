*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

a.back{display:inline-block;color:var(--muted);font-size:14px;font-weight:bold;text-decoration:none;margin:2px 0 4px}

h1{font-size:30px;margin:.2em 0;letter-spacing:.05em}
h2{font-size:21px;margin:.2em 0 .4em}
h3{font-size:17px;margin:.6em 0 .3em}
p{line-height:1.7;margin:.4em 0}
ul{line-height:1.7;padding-left:1.3em;margin:.4em 0}
rt{font-size:.5em}
.center{text-align:center}
.note{font-size:13px;color:var(--muted)}
.btn{font:inherit;font-weight:bold;font-size:16px;padding:10px 16px;border:3px solid var(--ink);background:var(--yellow);box-shadow:3px 3px 0 var(--ink);border-radius:4px;cursor:pointer;margin:4px;color:var(--ink);touch-action:manipulation}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.blue{background:#9cc3ff}.btn.green{background:#a6e3a1}.btn.gray{background:#e6e0d6}.btn.red{background:#ffb3a8}
.btn.sel{background:var(--accent);color:#fff}
.btn.small{font-size:14px;padding:6px 10px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}
.logo{display:flex;justify-content:center;gap:8px;margin-top:6px}
.hud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-weight:bold;padding:8px 12px}
.hud .big{font-size:22px}
.tip{background:#fff1c9;border:2px dashed var(--ink);padding:8px 10px;border-radius:4px;margin:8px 0}
.good{color:var(--good)}.bad{color:var(--bad)}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{border:2px solid var(--ink);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#f6e3c3}
table.t.ref tr>*:first-child{white-space:nowrap;font-size:13px}
table.t td.num{text-align:right;white-space:nowrap}
table.t tr.total td{font-weight:bold;background:#fff1c9}
.gauge{display:inline-block;width:110px;height:14px;border:2px solid var(--ink);background:#fff;vertical-align:middle;position:relative}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--good)}
/* stage1 */
.orderrow{display:flex;gap:8px;min-height:74px;flex-wrap:wrap}
.order{border:2px solid var(--ink);background:#fff;border-radius:4px;padding:4px 6px;width:96px;text-align:center;font-size:12px}
.order .ic{display:flex;justify-content:center;gap:1px}
.bar{height:8px;border:2px solid var(--ink);background:#fff;margin-top:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--good)}
.bar.warn i{background:var(--bad)}
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.station{font:inherit;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);border-radius:6px;padding:8px 4px;cursor:pointer;text-align:center;color:var(--ink);touch-action:manipulation;position:relative}
.station:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.station .nm{font-weight:bold;font-size:15px}
.station .devs{position:relative;height:72px;display:flex;justify-content:center;align-items:center}
.station .devs .item{position:absolute;left:50%;top:0;transform:translateX(-50%)}
.station .st{font-size:13px;font-weight:bold;min-height:20px;margin-top:2px}
.station.ready{background:#e3f7dc;animation:pulse .6s infinite alternate}
.station.burnt{background:#ffd9d4}
@keyframes pulse{from{box-shadow:3px 3px 0 var(--ink)}to{box-shadow:3px 3px 0 var(--ink),0 0 0 4px #7fd36f}}
.cookbar{height:12px;border:2px solid var(--ink);position:relative;margin:4px 6px 0;background:linear-gradient(90deg,#ffe48a 0 var(--a),#8fdc7f var(--a) var(--b),#f39a8e var(--b) 100%)}
.cookbar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink)}
.trayrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:bold}
#float{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:50;pointer-events:none}
.flash{background:var(--ink);color:#fff;padding:8px 14px;border-radius:4px;font-weight:bold;margin:4px;animation:fade 1.4s forwards;text-align:center}
@keyframes fade{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

.cust .bub{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px 2px;position:relative;min-height:46px}
.cust .bub:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.cust .wants{display:flex;justify-content:center;gap:1px;flex-wrap:wrap}
.cust .pr{font-size:12px;font-weight:bold}
.cust .bar{margin:2px 8px 0}
.cust.ok .bub{background:#e3f7dc;border-color:var(--good)}
.cust.leave{transform:translateY(-14px);opacity:0}
.cust.shake{animation:shake .3s}

.counterline{height:14px;background:#c8843c;border:3px solid var(--ink);border-radius:3px;margin-top:-4px}
.pop{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-weight:bold;color:#b8860b;background:#fff8d6;border:2px solid var(--ink);border-radius:4px;padding:1px 5px;white-space:nowrap;animation:up 1s forwards;pointer-events:none;z-index:3}

.plate{display:flex;justify-content:center;gap:12px;background:#e9b872;border:3px solid var(--ink);border-radius:40px;padding:8px 18px;margin:4px auto;width:fit-content}
.slot{width:64px;height:64px;background:#fff;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.slot.empty img{opacity:.18;filter:grayscale(1)}
.slot .n{position:absolute;right:-6px;bottom:-6px;background:var(--ink);color:#fff;border-radius:10px;font-size:13px;font-weight:bold;padding:0 6px}
.queue{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;min-height:64px}
.qc{text-align:center;width:44px}
.qc .w{display:flex;justify-content:center}
.scene{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;margin:6px 0}

.st2 .que{font-size:13px;font-weight:bold}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:14px}

.staff.away{opacity:.35}

.phase{background:#fff1c9;border:3px solid var(--ink);border-radius:4px;padding:6px 10px;margin:8px 0;font-size:14px}
.phase b{font-size:16px}
.consult.urgent{background:#ffe0dc;border-color:var(--bad)}
.consult.teach{background:#e3f0ff}
.st2.broken{background:#ffe9e6}

const _cache={};
function spriteURL(name,over){
  const key=name+'|'+JSON.stringify(over||{});
  if(_cache[key])return _cache[key];
  const rows=SPR[name];const w=16,h=rows.length;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x];if(!ch||ch==='.')continue;
    cx.fillStyle=(over&&over[ch])||PAL[ch]||'#f0f';cx.fillRect(x,y,1,1);
  }
  return _cache[key]=cv.toDataURL();
}

/* ふりがな：小学5年生までに習わない漢字に、自動でふりがなを付ける */
const FURI={'卵':'たまご','捨':'す','値':'ね','段':'だん','賃':'ちん','忙':'いそが','契':'けい','済':'さい','担':'たん','憩':'けい','勤':'きん',
  '払':'はら','認':'みと','装':'そう','署':'しょ','閉':'へい','舗':'ぽ','宣':'せん','割':'わり','視':'し','紹':'しょう','影':'えい','響':'きょう',
  '姿':'すがた','収':'しゅう','預':'あず','魅':'み','込':'こ','看':'かん','藤':'とう','論':'ろん','耐':'たい','誰':'だれ'};
const FURI_RE=new RegExp('['+Object.keys(FURI).join('')+']','g');
function fr(html){
  let inRuby=0;
  return String(html).split(/(<[^>]+>)/).map(part=>{
    if(part.startsWith('<')){if(/^<ruby/i.test(part))inRuby++;else if(/^<\/ruby/i.test(part))inRuby=Math.max(0,inRuby-1);return part;}
    return inRuby?part:part.replace(FURI_RE,k=>`<ruby>${k}<rt>${FURI[k]}</rt></ruby>`);
  }).join('');
}
function setH(el,text){if(el&&el.dataset.raw!==text){el.dataset.raw=text;el.innerHTML=fr(text);}}
function show(html){stopLoop();app.innerHTML=fr(html);window.scrollTo(0,0);}
function flash(text){const f=document.getElementById('float');const d=document.createElement('div');d.className='flash';d.innerHTML=fr(text);
  f.appendChild(d);setTimeout(()=>d.remove(),1400);while(f.children.length>3)f.firstChild.remove();}

function s1Wage(xp){let w=CONFIG.s1.wageSteps[0].w;for(const s of CONFIG.s1.wageSteps)if(xp>=s.xp)w=s.w;return w;}
function s1Tap(k){
  const C=CONFIG.s1,s=S1.st[k],ct=C.cook[k];
  if(s.s==='idle'){
    if(S1.tray[k]>=C.trayCap){flash(`お皿の${NAME[k]}はもういっぱい`);return;}
    s.s='cook';s.t=0;
  }else if(s.s==='cook'){
    if(s.t<ct){flash('まだはやい！');return;}
    S1.tray[k]++;S1.xp++;s.s='idle';
  }else if(s.s==='burnt'){
    S1.waste++;S1.xp=Math.max(0,S1.xp-2);s.s='idle';flash('捨てた…材料がもったいない');
  }
  s1Render(true);
}

  const el=document.createElement('button');el.className='cust';el.id='cu-'+c.id;
  el.innerHTML=`<div class="bub"><div class="wants">${wantIcons(c,c.want.length===3?20:24)}</div><div class="pr">${yen(c.price)}</div></div>
    <img class="px face" src="${custURL(c,'happy')}" width="56" height="56" alt=""><div class="bar"><i></i></div>`;
  el.onclick=()=>s1Serve(c.id);
  document.getElementById('seats').appendChild(el);c.face='happy';
}
function s1Serve(id){
  const c=S1.cust.find(x=>x.id===id);if(!c||c.leaving)return;
  const el=document.getElementById('cu-'+id);
  const lack=c.want.filter(k=>S1.tray[k]<1);
  if(lack.length){flash(`${lack.map(k=>NAME[k]).join('と')}がお皿にない！`);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');return;}
  for(const k of c.want)S1.tray[k]--;
  S1.made++;S1.sales+=c.price;c.leaving=true;
  el.querySelector('.face').src=custURL(c,'happy');
  popAt(el,'+'+yen(c.price));
  setTimeout(()=>el.classList.add('leave'),350);
  setTimeout(()=>{el.remove();S1.cust=S1.cust.filter(x=>x!==c);},1000);
  s1Render(true);
}
function s1Update(dt){
  const C=CONFIG.s1,total=C.hourSec*C.hours;
  S1.t+=dt;
  for(const k in S1.st){const s=S1.st[k];if(s.s==='cook'){s.t+=dt;if(s.t>C.cook[k]*C.goodMul)s.s='burnt';}}
  for(const c of S1.cust){if(c.leaving)continue;c.t+=dt;
    if(c.t>=C.patience){c.leaving=true;S1.left++;flash('お客さんが待ちきれずに帰った');
      const el=document.getElementById('cu-'+c.id);if(el){el.classList.add('leave');setTimeout(()=>{el.remove();S1.cust=S1.cust.filter(x=>x!==c);},700);}}}
  S1.next-=dt;
  if(S1.next<=0){if(S1.cust.length<C.maxOrders){const c=newCustomer(++S1.oid);S1.cust.push(c);s1AddCust(c);}S1.next=rand(C.orderMin,C.orderMax);}
  if(S1.t>=total){s1Result();return false;}
  s1Render(false,dt);
}
function s1Render(force,dt){
  const C=CONFIG.s1;S1.rt+=(dt||0);
  for(const k in S1.st){
    const s=S1.st[k],ct=C.cook[k],burn=ct*C.goodMul,max=burn*1.25;
    const el=document.getElementById('st-'+k);if(!el)return;
    const pos=s.s==='cook'?s.t:(s.s==='burnt'?max:0);
    document.getElementById('cb-'+k).style.left=Math.min(100,pos/max*100)+'%';
    const ready=s.s==='cook'&&s.t>=ct;
    el.className='station'+(ready?' ready':'')+(s.s==='burnt'?' burnt':'');
    const txt=s.s==='idle'?'タップで開始':(s.s==='burnt'?'こげた！タップで捨てる':(ready?'いまだ！タップ':'調理中…'));
    setH(document.getElementById('ss-'+k),txt);
    const it=document.getElementById('it-'+k);const want=s.s==='idle'?'':(s.s==='burnt'?'b':'c');
    if(it.dataset.v!==want){it.dataset.v=want;
      it.innerHTML=want===''?'':sp(k,40,want==='b'?(k==='egg'?OVER.burntEgg:k==='toast'?OVER.burntToast:OVER.spiltCoffee):null);}
  }
  for(const k of ['egg','toast','coffee']){document.getElementById('tr-'+k).textContent=S1.tray[k];

  for(const c of S1.cust){const el=document.getElementById('cu-'+c.id);if(!el||c.leaving)continue;
    const rest=1-c.t/C.patience,f=faceOf(rest);
    if(f!==c.face){c.face=f;el.querySelector('.face').src=custURL(c,f);}
    const ok=c.want.every(k=>S1.tray[k]>0);el.classList.toggle('ok',ok);
    const b=el.querySelector('.bar');b.firstElementChild.style.width=(rest*100)+'%';b.className='bar'+(rest<0.35?' warn':'');}
  if(!force&&S1.rt<0.12)return;S1.rt=0;
  const h=Math.floor(S1.t/C.hourSec);
  document.getElementById('h-clock').textContent=clock(C.startHour+h,(S1.t%C.hourSec)/C.hourSec);
  const top=C.wageSteps[C.wageSteps.length-1].xp;

  document.getElementById('h-next').textContent=`次のシフトの時給：${yen(s1Wage(S1.xp))}`;
  document.getElementById('c-sales').textContent=yen(S1.sales);
  document.getElementById('c-made').textContent=S1.made;
  document.getElementById('c-waste').textContent=S1.waste;
  document.getElementById('c-left').textContent=S1.left;
}

function demoInit(){
  const C=CONFIG.s2.cook;

function demoStart(){
  if(DEMO&&DEMO.running)return;

  document.getElementById('d-exp').innerHTML='';
  startLoop(dt=>{
    let g=dt*LAB.speed;
    while(g>0){const st=Math.min(g,0.05);demoStep(st);g-=st;if(DEMO.t>=LAB.len)break;}
    demoDraw();
    if(DEMO.t>=LAB.len){DEMO.running=false;DEMO.done=true;b.disabled=false;b.textContent='もう一度';demoExplain();return false;}
  });

function demoStep(dt){
  const D=DEMO,A=D.A,B=D.B;D.t+=dt;
  for(const w of A.w){w.t+=dt;if(w.stage%2===1)A.move+=dt;
    if(w.t>=A.dur[w.stage]){w.t-=A.dur[w.stage];if(w.stage===4)A.sets++;w.stage=(w.stage+1)%6;}}
  for(const w of B.w){
    if(w.busy){w.t+=dt;if(w.t>=B.dur[w.k]){w.busy=false;w.t=0;B.buf[w.k]++;}}
    if(!w.busy){const inprog=B.w.filter(x=>x.k===w.k&&x.busy).length;
      if(B.buf[w.k]+inprog<LAB.cap){w.busy=true;w.t=0;}else{w.wait+=dt;B.wait+=dt;}}
  }
  while(B.buf.egg&&B.buf.toast&&B.buf.coffee){B.buf.egg--;B.buf.toast--;B.buf.coffee--;B.sets++;}
}
function demoDraw(){

  document.getElementById('n-a').textContent=A.sets;
  document.getElementById('m-a').textContent=Math.round(A.move);
  document.getElementById('n-b').textContent=B.sets;
  document.getElementById('w-b').textContent=Math.round(B.wait);

}

function s2Inspectors(){return S2.staff.filter(s=>s.st==='inspect'&&s.away<=0);}
function s2Busy(){return S2.lock>0||S2.self;}
function s2ClearSel(){S2.sel=null;for(const x of S2.staff)document.getElementById('sf-'+x.id).classList.remove('sel');
  for(const kk of ['egg','toast','coffee','inspect'])document.getElementById('s2-'+kk).classList.remove('target');}
function s2Select(id){

  for(const k of ['egg','toast','coffee','inspect'])document.getElementById('s2-'+k).classList.add('target');
}
function s2Assign(k){
  if(!S2.sel)return;
  if(s2Busy()){flash('いまは手がはなせない');return;}
  const s=S2.staff.find(x=>x.id===S2.sel);
  if(s.st!==k){s2DropTask(s);s.st=k;document.getElementById('cr-'+k).appendChild(document.getElementById('sf-'+s.id));}
  s2ClearSel();
}
function s2DropTask(s){
  if(s.task&&s.task.item){if(s.task.kind==='egg')S2.buf.egg.push(s.task.item);else S2.setQ.unshift(s.task.item);}
  s.task=null;
}
function s2Toggle(w){
  if(w==='insp'){S2.inspectAt=S2.inspectAt==='final'?'egg':'final';for(const s of S2.staff)if(s.st==='inspect')s2DropTask(s);}
  if(w==='pre')S2.prebuild=!S2.prebuild;
  if(w==='self'){if(!S2.self&&S2.lock>0){flash('相談中で手がはなせない');return;}S2.self=!S2.self;S2.selfTask=null;if(S2.self)s2ClearSel();}
  s2Buttons();
}
function s2Buttons(){
  const b=(id,txt,on)=>{const e=document.getElementById(id);setH(e,txt);e.className='btn'+(on?' sel':'');};
  b('b-insp',`検品の場所：${S2.inspectAt==='final'?'完成品':'卵の段階'}`,S2.inspectAt==='egg');
  b('b-pre',`作り置き：${S2.prebuild?'する':'しない'}`,S2.prebuild);
  b('b-self',S2.self?'自分で卵を焼く：やめる':'自分で卵を焼く',S2.self);
}
function s2AddConsult(s,kind,text){S2.consults.push({id:++S2.cid,s,kind,text,t:0});S2.consultVer++;}
function s2Answer(cid){
  if(s2Busy()){flash(S2.self?'卵を焼いていて手がはなせない':'相談中…');return;}
  const c=S2.consults.find(x=>x.id===cid);if(!c)return;
  S2.consults=S2.consults.filter(x=>x.id!==cid);S2.consultVer++;
  const C=CONFIG.s2;
  if(c.kind==='teach'){S2.lock=C.consultLock+1;c.s.spd=Math.min(1,c.s.spd+C.teachGain);S2.taught++;
    c.s.note=c.s.spd>=.9?'なれてきた':'新人';flash(`${c.s.name}に教えた。少し速くなった！`);}
  else if(c.kind==='urgent'){S2.lock=C.consultLock+1;S2.broken=false;flash('トースターを直した！');}
  else{S2.lock=C.consultLock;c.s.mor=Math.min(1,c.s.mor+0.05);}
  S2.lockSum+=S2.lock;
}
function s2Eff(s){const C=CONFIG.s2;if(s.away>0)return 0;
  return s.spd*(0.6+0.4*s.mor)*(S2.self?C.selfPenalty:1)*(s.st==='toast'&&S2.broken?C.brokenMul:1);}
function s2Serve(set){
  const i=S2.orders.indexOf(set.order);if(i>=0)S2.orders.splice(i,1);
  S2.made++;S2.sales+=set.order.price;if(set.bad){S2.claims++;flash('クレーム：まちがった料理が出てしまった');}
}
function s2Update(dt){
  const C=CONFIG.s2,P=S2;
  P.t+=dt;P.lock=Math.max(0,P.lock-dt);if(P.self)P.selfTime+=dt;if(P.broken)P.brokenTime+=dt;
  // 時間帯
  let ph=0;for(let i=0;i<C.phases.length;i++)if(P.t>=C.phases[i].at)ph=i;
  if(ph!==P.phase){P.phase=ph;const x=C.phases[ph];if(ph>0)flash(x.name+'！');
    const el=document.getElementById('phase');if(el)el.innerHTML=fr(`<b>${clock(C.startHour,x.at/C.duration)}〜　${x.name}</b><br>${x.text}`);}
  const PH=C.phases[P.phase];
  // できごと
  for(const at of C.teachAt)if(P.t>=at&&!P.teachDone[at]){P.teachDone[at]=true;const y=P.staff.find(s=>s.id==='yui');
    if(y.spd<1)s2AddConsult(y,'teach','やり方を教えてください（教えると速くなる）');}
  if(P.t>=C.breakAt&&!P.breakDone){P.breakDone=true;const m=P.staff.find(s=>s.id===C.breakStaff);m.away=C.breakLen;s2DropTask(m);flash(`${m.name}が休憩に入った（${C.breakLen}秒）`);}
  for(const s of P.staff)if(s.away>0){s.away-=dt;if(s.away<=0){s.away=0;flash(`${s.name}が休憩からもどった`);}}
  if(P.t>=C.brokenAt&&!P.brokenDone){P.brokenDone=true;P.broken=true;
    const w=P.staff.find(s=>s.st==='toast'&&s.away<=0)||P.staff[0];s2AddConsult(w,'urgent','トースターの調子が悪いです！見てください（直すまでトーストがおそい）');flash('トースターの調子が悪い！');}
  // 注文
  P.next-=dt;
  if(P.next<=0){P.orders.push(newCustomer(++P.oid,PH.menu));P.next=rand(PH.min,PH.max);}
  for(const o of P.orders)o.t+=dt;
  const nb=P.orders.length;P.orders=P.orders.filter(o=>o.assigned||o.t<C.patience);
  if(P.orders.length<nb){P.left+=nb-P.orders.length;P.leftBy[P.phase]+=nb-P.orders.length;}
  const insp=s2Inspectors();
  // 調理
  const stock=k=>P.buf[k].length+(k==='egg'?P.eggQ.length:0);
  const inprog=k=>P.staff.filter(s=>s.st===k&&s.task).length+(k==='egg'&&P.self&&P.selfTask?1:0);
  const need=k=>{const un=Math.min(C.orderCap,P.orders.filter(o=>!o.assigned&&o.want.includes(k)).length);return (P.prebuild?Math.max(C.prebuildCap,un):un)-stock(k)-inprog(k);};
  const finish=(k,acc)=>{const errMul=k==='egg'?1:0.5;const item={bad:Math.random()<(1-acc)*errMul,age:0};
    if(k==='egg'&&P.inspectAt==='egg'&&insp.length)P.eggQ.push(item);else P.buf[k].push(item);};
  for(const s of P.staff){
    if(s.st==='inspect'||s.away>0)continue;
    if(s.task){s.task.p+=dt*s2Eff(s);if(s.task.p>=C.cook[s.st]){finish(s.st,s.acc);s.task=null;}}
    if(!s.task&&need(s.st)>0)s.task={p:0};
  }
  if(P.self){
    if(P.selfTask){P.selfTask.p+=dt*C.selfSpeed;if(P.selfTask.p>=C.cook.egg){finish('egg',.95);P.selfTask=null;}}
    if(!P.selfTask&&need('egg')>0)P.selfTask={p:0};
  }
  if(P.inspectAt!=='egg'||!insp.length){while(P.eggQ.length)P.buf.egg.push(P.eggQ.shift());}
  for(;;){
    const o=P.orders.find(x=>!x.assigned&&x.want.every(k=>P.buf[k].length));if(!o)break;
    const items=o.want.map(k=>P.buf[k].shift());
    const set={order:o,bad:items.some(i=>i.bad),cost:o.want.reduce((a,k)=>a+(k==='egg'?C.eggWaste:C.otherWaste),0)};o.assigned=true;
    if(P.inspectAt==='final'&&insp.length)P.setQ.push(set);else s2Serve(set);
  }
  if(P.inspectAt!=='final'||!insp.length){while(P.setQ.length)s2Serve(P.setQ.shift());}
  for(const s of insp){
    if(!s.task){
      if(P.inspectAt==='egg'&&P.eggQ.length)s.task={p:0,kind:'egg',item:P.eggQ.shift()};
      else if(P.inspectAt==='final'&&P.setQ.length)s.task={p:0,kind:'set',item:P.setQ.shift()};
    }
    if(s.task){s.task.p+=dt*s2Eff(s);
      if(s.task.p>=C.inspectTime){const it=s.task.item;
        if(s.task.kind==='egg'){if(it.bad){P.waste++;P.wasteCost+=C.eggWaste;}else P.buf.egg.push(it);}
        else{if(it.bad){P.waste+=it.order.want.length;P.wasteCost+=it.cost;it.order.assigned=false;flash('検品で失敗作を発見。注文ごと作り直し');}else s2Serve(it);}
        s.task=null;}}
  }
  for(const k of ['egg','toast','coffee']){
    for(const it of P.buf[k])it.age+=dt;
    const n=P.buf[k].length;P.buf[k]=P.buf[k].filter(it=>it.age<C.spoil);
    const d=n-P.buf[k].length;if(d){P.waste+=d;P.wasteCost+=d*(k==='egg'?C.eggWaste:C.otherWaste);flash(`${NAME[k]}が冷めて捨てた`);}
  }
  // ふつうの相談
  P.nextRoutine-=dt;
  if(P.nextRoutine<=0){P.nextRoutine=rand(C.routineMin,C.routineMax);
    const free=P.staff.filter(s=>s.away<=0&&!P.consults.some(c=>c.s===s));
    if(free.length){const s=free[Math.floor(Math.random()*free.length)];s2AddConsult(s,'routine',ROUTINE[Math.floor(Math.random()*ROUTINE.length)]);}}
  for(const c of P.consults)c.t+=dt;
  const exp=P.consults.filter(c=>(c.kind==='routine'&&c.t>=C.routineExpire)||(c.kind==='teach'&&c.t>=C.teachExpire));
  if(exp.length){for(const c of exp){if(c.kind==='routine'){c.s.mor=Math.max(.3,c.s.mor-.2);P.consultMissed++;flash(`${c.s.name}のやる気が下がった…`);}
      else flash(`${c.s.name}に教えるチャンスをのがした`);}
    P.consults=P.consults.filter(c=>!exp.includes(c));P.consultVer++;}
  if(P.t>=C.duration){s2Result();return false;}
  s2Render(dt);
}

function s3Compute(P,ev,rnd){
  const C=CONFIG.s3;rnd=rnd||Math.random;
  const r=(a,b)=>a+rnd()*(b-a);
  const d=P.depts,overload=P.shops>=2&&!d.unei;
  let unit,short=false;
  if(P.buy==='market'){
    const mkt=r(C.marketMin,C.marketMax)*(ev.egg||1);
    unit=C.unitCost*mkt*(d.shiire==='tanaka'?0.85:1)*(overload&&!d.shiire?1.1:1);
    const risk=d.shiire==='sato'?0:C.shortageRisk*(overload&&!d.shiire?2:1);
    short=rnd()<risk;
  }else unit=C.unitCost*(d.shiire==='sato'?1.0:C.contractMul);
  let demand=0,cap=0,sold=0;
  for(let i=0;i<P.shops;i++){
    const dm=C.baseDemand*C.priceF[P.price]*(d.senden?1.2:1)*r(.9,1.1)*(ev.demand||1);
    const cp=C.capacity*(d.jinji?1.15:1)*(i===1&&!d.unei?0.6:1);
    demand+=dm;cap+=cp;sold+=Math.min(dm,cp)*(short?0.8:1);
  }
  sold=Math.round(sold);
  const sales=sold*P.price,material=Math.round(sold*unit*(1+C.lossRate));
  const labor=C.labor*P.shops,rent=C.rent*P.shops;
  const dept=(d.shiire?C.dept.shiire:0)+(d.unei?C.dept.unei:0)+(d.senden?C.dept.senden:0)+(d.jinji?C.dept.jinji:0);
  const principal=Math.min(P.loan,P.principal),interest=Math.round(P.loan*C.interest);
  const profit=sales-material-labor-rent-dept-principal-interest;
  return {ev,unit,short,overload,demand,cap,sold,sales,material,labor,rent,dept,principal,interest,repay:principal+interest,profit,costRate:sales?material/sales:0};
}
function s3Forecast(){
  const C=CONFIG.s3,P=S3;
  const Q=Object.assign({},P,{depts:Object.assign({},P.depts)});
  if(P.plan2){Q.shops=2;Q.loan=P.loan+C.shop2Cost;Q.principal=Q.loan/C.loanMonths;}
  const seq=(mk,dm)=>{const a=Q.buy==='market'?[mk,0.99,dm,dm]:[dm,dm];let i=0;return ()=>a[Math.min(i++,a.length-1)];};
  const mid=s3Compute(Q,{},seq(.5,.5)),lo=s3Compute(Q,{},seq(1,0)),hi=s3Compute(Q,{},seq(0,1));
  return {mid,lo,hi,risk:Q.buy==='market'&&Q.depts.shiire!=='sato'};
}
function s3FcHtml(){
  const f=s3Forecast(),m=f.mid;const mx=Math.max(m.demand,m.cap);
  const bar=(v,col)=>`<span class="hb"><i style="width:${v/mx*100}%;background:${col}"></i></span>`;
  return `<div class="panel fc"><h3>この月の見込み</h3>
    <p class="note">選んだ内容を変えると、見込みがすぐ変わります。いろいろ試してみよう。</p>
    <div class="row"><span>来るお客さん</span>${bar(m.demand,'#9cc3ff')}<b>約${Math.round(m.demand).toLocaleString()}人</b></div>
    <div class="row"><span>作れる数</span>${bar(m.cap,'#a6e3a1')}<b>約${Math.round(m.cap).toLocaleString()}人分</b></div>
    <p class="msg">${m.demand>m.cap*1.03?'<b class="bad">作れる数が足りない</b>：お客さんの一部が帰ってしまう見込み。':m.cap>m.demand*1.15?'作れる数に、よゆうがある（お客さんが少なめ）。':'お客さんと作れる数が、ちょうどつりあっている。'}</p>
    <table class="t" style="margin-top:4px">
      <tr><th>原価率の見込み</th><td class="num">約${Math.round(m.costRate*100)}%</td></tr>
      <tr><th>売上の見込み</th><td class="num">${yen(m.sales)}</td></tr>
      <tr><th>出ていくお金の見込み</th><td class="num">−${yen(m.sales-m.profit)}</td></tr>
      <tr class="total"><td>社長の取り分の見込み</td><td class="num ${m.profit>=0?'good':'bad'}">${yen(m.profit)}</td></tr>
    </table>
    <p class="note">うまくいけば ${yen(f.hi.profit)}、うまくいかないと ${yen(f.lo.profit)} くらい。${f.risk?'市場で買うと、品切れになることもある。':''}できごと（天気・ライバル店・値上がりなど）でも変わります。</p></div>`;
}
function s3Next(){S3.month++;S3.pending=false;saveGame();s3Month();}
function s3Run(){
  const C=CONFIG.s3,P=S3;
  if(P.plan2){P.shops=2;P.loan+=C.shop2Cost;P.principal=P.loan/C.loanMonths;P.plan2=false;}
  const fc=s3Forecast().mid.profit;
  const ev=pickEvent();if(ev.egg)P.eggDone=true;
  const m=s3Compute(P,ev);m.fc=fc;
  P.loan-=m.principal;P.cash+=m.profit;P.total+=m.profit;
  m.month=P.month;m.price=P.price;m.buy=P.buy;P.hist.push(m);P.last=m;P.pending=true;
  if(P.cash<0)P.closed=true;
  saveGame();
  const msgs=[];
  if(m.demand>m.cap*1.03)msgs.push('お客さんが多すぎて、作りきれなかった。（作れる数をふやすか、値段を上げてもいいかも）');
  if(m.cap>m.demand*1.15)msgs.push('作れる数にくらべて、お客さんが少なかった。');
  if(m.short)msgs.push('<b class="bad">材料が品切れ！</b> いつもより2割少なくしか売れなかった。');
  if(m.overload)msgs.push('<b class="bad">社長が2つのお店を見きれなかった。</b> 店舗運営部があると楽になる。');
  if(m.buy==='market'&&ev.egg)msgs.push('市場で買っていたので、卵の値上がりの影響をそのまま受けた。');
  if(m.buy==='contract'&&ev.egg)msgs.push('<b class="good">契約していたので、卵が値上がりしても材料費は変わらなかった！</b>');
  if(m.price===300&&m.costRate>0.45)msgs.push('<b class="bad">値段が安すぎて、材料費と人件費をまかなえていない。</b>たくさん売れても、もうけが出ない。');
  else if(m.costRate>0.4)msgs.push(`原価率が${Math.round(m.costRate*100)}%と高め。売上のうち材料費の割合が大きい。`);
  const row=(a,b,c)=>`<tr><th>${a}</th><td>${b}</td><td class="num">${c}</td></tr>`;
  show(`<div class="panel"><h2>${m.month}か月目の結果</h2>
    <div class="event">${ev.egg?sp('egg',48):ev.demand&&ev.demand>1?sp('shop',48):sp('coin',48)}<div><b>${ev.name}</b><br>${ev.text}</div></div></div>
    <div class="panel"><b>見込みと結果</b>
      <table class="t"><tr><th>見込みの取り分</th><td class="num">${yen(m.fc)}</td></tr><tr class="total"><td>実際の取り分</td><td class="num ${m.profit>=0?'good':'bad'}">${yen(m.profit)}</td></tr></table>
      <p class="msg">${s3Why(m)}</p></div>
    <div class="panel"><b>今月のお客さん</b>${s3Scene(m)}</div>
    <div class="panel"><table class="t">
      ${row('売上',`${m.sold.toLocaleString()}人 × ${m.price}円`,yen(m.sales))}
      ${row('材料費',`お客さん1人分 約${Math.round(m.unit)}円（${m.buy==='market'?'市場':'契約'}）`,'−'+yen(m.material))}
      ${row('人件費',`お店${P.shops}つ分`,'−'+yen(m.labor))}
      ${row('家賃',`お店${P.shops}つ分`,'−'+yen(m.rent))}
      ${row('部署の費用','責任者の給料','−'+yen(m.dept))}
      ${row('借金の返済','返す分＋利息','−'+yen(m.repay))}
      <tr class="total"><td>社長の取り分</td><td></td><td class="num ${m.profit>=0?'good':'bad'}">${yen(m.profit)}</td></tr>
    </table>
    <p><b>原価率 ${Math.round(m.costRate*100)}%</b>（売上100円のうち、材料に${Math.round(m.costRate*100)}円）</p>
    ${msgs.map(t=>`<p class="msg">・${t}</p>`).join('')}</div>
    <div class="panel"><b>毎月の取り分</b>${s3Chart(P.hist)}<p style="margin-top:26px">お店のお金：<b class="${P.cash>=0?'':'bad'}">${yen(P.cash)}</b>　借金の残り：${yen(P.loan)}</p>
    ${P.closed?`<div class="tip"><b class="bad">お店のお金がなくなって、閉店することになった…</b><br>経営者は、うまくいけば大きくかせげるけど、失敗すると自分が損をする。これも経営のひとつの姿。</div>
      <button class="btn" onclick="s3Result()">結果を見る</button>`:
      P.month>=C.months?`<button class="btn" onclick="s3Result()">6か月の結果を見る</button>`:`<button class="btn" onclick="s3Next()">次の月へ</button>`}</div>`);
}
function s3Why(m){
  const C=CONFIG.s3,d=m.profit-m.fc;const r=[];
  if(m.ev.demand&&m.ev.demand<1)r.push(`「${m.ev.name}」でお客さんがへった`);
  if(m.ev.demand&&m.ev.demand>1)r.push(`「${m.ev.name}」でお客さんがふえた`);
  if(m.buy==='market'){const mid=C.unitCost*(C.marketMin+C.marketMax)/2;
    if(m.unit>mid*1.08)r.push(m.ev.egg?'卵の値上がりで、材料費が高くなった':'市場の値段が、いつもより高かった');
    else if(m.unit<mid*0.92)r.push('市場の値段が、いつもより安かった');}
  if(m.short)r.push('材料が品切れして、売れる数がへった');
  if(!r.length)return Math.abs(d)<30000?'ほぼ見込みどおり！':'お客さんの数が少し上下した。';
  return (d>=0?'見込みより<b class="good">多かった</b>。':'見込みより<b class="bad">少なかった</b>。')+'理由：'+r.join('、')+'。';
}
function s3Scene(m){
  const unit=300,served=Math.round(m.sold/unit),lost=Math.max(0,Math.round(m.demand/unit)-served);
  const look=i=>({look:{h:HAIRS[i%HAIRS.length],u:SHIRTS[(i*3)%SHIRTS.length]}});
  let h='';for(let i=0;i<served;i++)h+=custImg(look(i),'happy',30);
  let a='';for(let i=0;i<lost;i++)a+=custImg(look(i+5),'angry',30);
  return `<div class="scene">${sp('shop',44)}${h}</div>
    <p class="note">1人の絵＝お客さん約${unit}人。来たお客さん約${Math.round(m.demand).toLocaleString()}人のうち、${m.sold.toLocaleString()}人に出せた。</p>
    ${lost?`<div class="scene">${a}</div><p class="note bad">作りきれなかったり、材料がなかったりして、約${(Math.round(m.demand)-m.sold).toLocaleString()}人が帰ってしまった。</p>`:''}`;
}
function s3Chart(hist){
  const C=CONFIG.s3;const vals=hist.map(h=>h.profit);
  const mx=Math.max(100000,...vals.map(v=>Math.abs(v)));
  const hasNeg=vals.some(v=>v<0);const zeroPct=hasNeg?50:100;
  const cols=[];for(let i=0;i<C.months;i++){const v=vals[i];
    let bar='';if(v!==undefined){const hpct=Math.abs(v)/mx*(hasNeg?50:96);
      bar=v>=0?`<div class="b" style="bottom:${100-zeroPct}%;height:${hpct}%;background:#8fdc7f"></div><div class="v" style="bottom:${100-zeroPct+hpct}%">${Math.round(v/10000)}万</div>`
        :`<div class="b" style="top:${zeroPct}%;height:${hpct}%;background:#f39a8e"></div><div class="v" style="top:${zeroPct+hpct}%">${Math.round(v/10000)}万</div>`;}
    cols.push(`<div class="col">${bar}<div class="lbl">${i+1}か月</div></div>`);}
  return `<div class="chart">${hasNeg?`<div class="zero" style="top:${zeroPct}%"></div>`:''}${cols.join('')}</div>`;
}
function s3Result(){
  const P=S3;const vals=P.hist.map(h=>h.profit);
  const avg=P.total/P.hist.length,best=Math.max(...vals),worst=Math.min(...vals);
  const avgRate=P.hist.reduce((a,h)=>a+h.costRate,0)/P.hist.length;
  G.s3={total:P.total,avg,best,worst,closed:P.closed,months:P.hist.length,avgRate};P.finished=true;saveGame();
  show(`<div class="panel"><h2>経営者としての${P.hist.length}か月</h2>
    ${s3Chart(P.hist)}
    <table class="t" style="margin-top:30px">
      <tr><th>取り分の合計</th><td class="num ${P.total>=0?'good':'bad'}">${yen(P.total)}</td></tr>
      <tr><th>1か月あたり</th><td class="num">${yen(avg)}</td></tr>
      <tr><th>いちばん良かった月</th><td class="num">${yen(best)}</td></tr>
      <tr><th>いちばん悪かった月</th><td class="num">${yen(worst)}</td></tr>
      <tr><th>平均の原価率</th><td class="num">${Math.round(avgRate*100)}%</td></tr>
    </table></div>
    <div class="panel"><h3>経営者のポイント</h3><ul>
      <li>自分で作るのでも、配置するのでもなく、<b>しくみ（部署と責任者）</b>をつくる</li>
      <li>値段と${R('原価率','げんかりつ')}、仕入れの安定をいつも気にしている</li>
      <li><b>安定した仕入れにはお金がかかる</b>。これは、はたらく人の時給が安定していて、経営者の取り分が安定しないのと同じ形</li>
      <li>うまくいけば大きくかせげる。でも失敗すると、自分が損をする</li>
      <li>始めたばかりのころは、店長の給料より少ないことも。お店が育てば、取り分も大きくなるかもしれない</li></ul>
    <button class="btn" onclick="reflection()">ふりかえりへ</button>
    <button class="btn gray" onclick="stage3Intro()">もう一度</button></div>`);
}

/* =========================================================
   ふりかえり
   ========================================================= */
function reflection(){
  const s1=G.s1,s2=G.s2,s3=G.s3;
  const v1=s1?yen(s1.monthly):'—',v2=s2?yen(s2.monthly):'—';
  const v3=s3?`${yen(s3.avg)}<br><span class="note">（${yen(s3.worst)}〜${yen(s3.best)}）</span>`:'—';
  show(`<div class="panel"><h2>ふりかえり　3つの${R('立場','たちば')}</h2>
    <div class="logo">${sp('person',44,{u:'#3d7bd9'})}${sp('person',44,{u:'#3fa34d',h:'#7a4a1e'})}${sp('person',44,{u:'#8a5cc7',h:'#555'})}</div>
    <div style="overflow-x:auto"><table class="t ref">
      <tr><th></th><th>はたらく人</th><th>まとめる人</th><th>お店をつくる人</th></tr>
      <tr><th>かせぎ方</th><td>時給</td><td>月給＋ボーナス</td><td>利益の残り全部</td></tr>
      <tr><th>決めること</th><td>どう作るか</td><td>どう作ってもらうか</td><td>何を、いくらで、どこまで広げるか</td></tr>
      <tr><th>いそがしさ</th><td>手がいそがしい</td><td>こまぎれにいそがしい</td><td>頭がいそがしい</td></tr>
      <tr><th>時間の単位</th><td>分</td><td>日〜週</td><td>月〜年</td></tr>
      <tr><th>収入の安定</th><td>高い</td><td>まあまあ</td><td>低い（赤字もある）</td></tr>
      <tr><th>気にする数字</th><td>時給・捨てた数</td><td>完成数・人件費・捨てた率</td><td>原価率・仕入れ値・利益</td></tr>
      <tr class="total"><td>あなたの結果<br><span class="note">1か月あたり</span></td><td>${v1}</td><td>${v2}</td><td>${v3}</td></tr>
    </table></div>
    <p class="note">はたらく人は、1日8時間・月20日で計算しています。</p></div>
  <div class="panel"><h3>お金はどう流れている？</h3>
    <div class="flow">
      <div class="box">お客さんが払うお金</div><div class="arrow">↓</div>
      <div class="box">お店の売上</div><div class="arrow">↓</div>
      <div class="split">
        <div class="box">材料費<br><span class="note">→ 農家さん・市場の人へ</span></div>
        <div class="box">家賃<br><span class="note">→ 大家さんへ</span></div>
        <div class="box">はたらく人の時給</div>
        <div class="box">まとめる人の給料</div>
        <div class="box">借金の返済<br><span class="note">→ 銀行へ</span></div>
      </div><div class="arrow">↓</div>
      <div class="box me">残りが、お店をつくる人（経営者）の取り分</div>
    </div>
    <div class="tip">ステージ1でもらった時給は、お客さんが払ったお金から来ていた。<br>お金の向こうには、いつも<b>はたらいている人</b>がいる。</div></div>
  <div class="panel"><h3>もうひとつの立場</h3>
    <p>お金のかせぎ方には、もうひとつ、お店や会社にお金を出して、利益の一部（<b>${R('配当','はいとう')}</b>）を受け取る「<b>投資家（資本家）</b>」という立場もあります。</p>
    <p>ステージ3で銀行から借りたお金も、もとはだれかが銀行に預けたお金。お金を出す人がいるから、新しいお店が開けるのです。</p></div>
  <div class="panel center"><h3>あなたは、どの立場がいちばん楽しかった？</h3>
    <button class="btn" onclick="funPick(1)">はたらく人</button><button class="btn" onclick="funPick(2)">まとめる人</button><button class="btn" onclick="funPick(3)">お店をつくる人</button>
    <div id="fun"></div>
    <p><button class="btn gray" onclick="goTitle()">タイトルへ</button></p>
    <a class="back" href="../../samples/">← ゲーム一覧</a></div>`);
}
function funPick(n){
  const t={1:'目の前の仕事に集中して、上手になっていくのが楽しいタイプかも。安定した収入も魅力だね。',
    2:'チームを動かして、全体がうまく回るのが楽しいタイプかも。人の力を引き出すのが店長の仕事。',
    3:'自分で決めて、結果を引き受けるのが楽しいタイプかも。大きな決断にはドキドキがつきもの。'};
  document.getElementById('fun').innerHTML=`<div class="tip">${t[n]}<br>どの立場がえらい、ということはありません。どれもお店に必要な仕事です。</div>`;
}

loadGame();
goTitle();
</script>
