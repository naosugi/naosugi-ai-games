<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   ENGLISH ROAD ─ 留学生からAIエンジニアへ
   聞く → まねる → 書き取る → とっさに言う、を場面ごとにくり返す英語練習ゲーム
   ========================================================= */

/* ---------- 教材 ---------- */
// r: written=書き言葉 / formal=改まった話し言葉 / casual=くだけた話し言葉
const REG = {
  written: { label: '書き言葉', cls: 'rw' },
  formal:  { label: '改まった話し言葉', cls: 'rf' },
  casual:  { label: 'くだけた話し言葉', cls: 'rc' },
};
// acc: 使いたい英語音声の地域（端末にあれば使う）
const CHARS = {
  me:     { name: 'あなた', acc: [], pitch: 1 },
  priya:  { name: 'Priya（先輩）', acc: ['en-IN', 'en-GB'], pitch: 1.15 },
  miller: { name: 'Miller 先生', acc: ['en-US'], pitch: 0.85 },
  tom:    { name: 'Tom（同期）', acc: ['en-AU', 'en-GB'], pitch: 0.95 },
  wei:    { name: 'Wei（研究者）', acc: ['en-SG', 'en-GB', 'en-AU'], pitch: 1.05 },
  slide:  { name: 'スライド', acc: ['en-US'], pitch: 1 },
  dana:   { name: 'Dana（メンター）', acc: ['en-US'], pitch: 1.1 },
  raj:    { name: 'Raj（マネージャー）', acc: ['en-IN', 'en-GB'], pitch: 0.9 },
  lena:   { name: 'Lena（PM）', acc: ['en-GB'], pitch: 1.2 },
  sam:    { name: 'Sam（新人）', acc: ['en-AU', 'en-NZ'], pitch: 1.25 },
  alex:   { name: 'Alex（候補者）', acc: ['en-CA', 'en-US'], pitch: 1.0 },
  staff:  { name: 'まちの人', acc: ['en-US'], pitch: 1.1 },
};
const SOURCES = {
  wpOverfit: { title: 'Wikipedia「Overfitting」', url: 'https://en.wikipedia.org/wiki/Overfitting', lic: 'CC BY-SA 4.0' },
};

const CHAPTERS = [
  {"id": 1, "title": "第1章 留学生編", "rank": "留学生", "scenes": [{"id": "c1s1", "title": "研究室の初日", "place": "大学・研究室", "intro": "9月。あなたは東京からアメリカの大学院に留学してきた。今日は研究室の初日。ドアを開けると、先輩らしき人が手を振っている。", "outro": "研究室の場所もサーバーの使い方も分かった。なんとかやっていけそうだ。", "lines": [{"w": "priya", "r": "casual", "en": "Hey, you must be the new student. I'm Priya, a third-year PhD student here.", "ja": "やあ、新しく来た学生さんだよね。私はプリヤ、ここの博士課程3年生。"}, {"w": "me", "r": "casual", "en": "Hi, nice to meet you. I just got here from Tokyo last week.", "ja": "こんにちは、はじめまして。先週東京から来たばかりです。"}, {"w": "priya", "r": "casual", "en": "Welcome! How are you settling in so far?", "ja": "ようこそ！ こっちの生活にはもう慣れてきた？"}, {"w": "me", "r": "casual", "en": "Pretty well, thanks. Still getting over the jet lag, though.", "ja": "おかげさまで順調です。時差ボケはまだ抜けないですけど。"}, {"w": "priya", "r": "casual", "en": "That's totally normal. Let me show you around. This is your desk, and the GPU server is in the next room.", "ja": "誰でもそうだよ。案内するね。ここがあなたの机で、GPUサーバーは隣の部屋。"}, {"w": "me", "r": "casual", "en": "Great. How do I get access to the server?", "ja": "いいですね。サーバーを使うにはどうすればいいですか？"}, {"w": "priya", "r": "casual", "en": "Just send your username to Tom. He takes care of the accounts.", "ja": "トムにユーザー名を送ればいいよ。アカウントは彼が管理してるから。"}, {"w": "me", "r": "casual", "en": "Got it. Thanks for showing me around.", "ja": "わかりました。案内してくれてありがとうございます。"}]}, {"id": "c1s2", "title": "講義：過学習", "place": "大学・講義室", "intro": "最初の授業は機械学習の講義。スライドの英文（書き言葉）と、先生の説明（話し言葉）で、文の作りがどう違うかに注目しよう。", "outro": "手を挙げて答えられた。スライドの硬い英語も、先生が言い換えると分かりやすい。", "lines": [{"w": "miller", "r": "formal", "en": "Today, we're going to talk about one of the most common problems in machine learning: overfitting.", "ja": "今日は、機械学習でとてもよくある問題の一つ、過学習について話します。"}, {"w": "slide", "r": "written", "en": "An overfitted model is a mathematical model that contains more parameters than can be justified by the data.", "ja": "過学習したモデルとは、データから正当化できる以上のパラメータを含む数理モデルである。", "src": "wpOverfit"}, {"w": "miller", "r": "formal", "en": "In other words, the model memorizes the training data instead of learning the general pattern.", "ja": "言い換えると、モデルが一般的なパターンを学ぶ代わりに、訓練データを丸暗記してしまうのです。"}, {"w": "miller", "r": "formal", "en": "That's why it performs well on the training set but poorly on new data.", "ja": "だから訓練データではよい成績なのに、新しいデータではうまくいかないのです。"}, {"w": "slide", "r": "written", "en": "Underfitting occurs when a mathematical model cannot adequately capture the underlying structure of the data.", "ja": "過少適合は、数理モデルがデータの根底にある構造を十分に捉えられないときに起こる。", "src": "wpOverfit"}, {"w": "miller", "r": "formal", "en": "So how do we know if our model is overfitting? Can anyone tell me?", "ja": "では、モデルが過学習しているかどうかは、どうすれば分かるでしょう？ 誰か答えられますか？"}, {"w": "me", "r": "formal", "en": "We can compare the training loss with the validation loss.", "ja": "訓練損失と検証損失を比べれば分かると思います。"}, {"w": "miller", "r": "formal", "en": "Exactly. If the gap keeps growing, that's a clear warning sign.", "ja": "その通り。その差が広がり続けるなら、はっきりした危険信号です。"}]}, {"id": "c1s6", "bg": "library", "title": "グループ課題の分担", "place": "大学・図書館のグループ学習室", "intro": "授業のグループ課題が出た。同じ授業をとっている Tom と組むことになった。締め切りから逆算して、作業を分けよう。", "outro": "誰が・何を・いつまでに。3つ決めたら、あとは進めるだけ。", "lines": [{"w": "tom", "r": "casual", "en": "Okay, the project is due in two weeks. How should we split the work?", "ja": "よし、課題の締め切りは2週間後。作業をどう分ける？"}, {"w": "me", "r": "casual", "en": "I can handle the data preprocessing, since I did something similar last year.", "ja": "データの前処理は私がやれるよ。去年、似たことをやったから。"}, {"w": "tom", "r": "casual", "en": "Great. Then I'll set up the training code.", "ja": "いいね。じゃあ僕は訓練のコードを用意するよ。"}, {"w": "me", "r": "casual", "en": "Who's going to write the report?", "ja": "レポートは誰が書く？"}, {"w": "tom", "r": "casual", "en": "How about we each write our own section and put them together at the end?", "ja": "それぞれ自分の担当部分を書いて、最後にまとめるのはどう？"}, {"w": "me", "r": "casual", "en": "Sounds good. Let's set a deadline for the first draft. Maybe next Friday?", "ja": "いいね。最初の下書きの締め切りを決めよう。来週の金曜はどう？"}, {"w": "tom", "r": "casual", "en": "Works for me. Let's also meet on Wednesday to check our progress.", "ja": "いいよ。水曜にも集まって、進み具合を確認しよう。"}, {"w": "me", "r": "casual", "en": "Perfect. I'll create a shared doc and send you the link.", "ja": "ばっちり。共有ドキュメントを作って、リンクを送るね。"}, {"w": "me", "r": "written", "en": "Task split: data preprocessing (me), training code (Tom). First draft due next Friday.", "ja": "（共有ドキュメント）分担：データ前処理（私）、訓練コード（トム）。下書きの締め切りは来週金曜。"}, {"w": "tom", "r": "casual", "en": "Nice. You're really organized.", "ja": "いいね。本当にしっかりしてるね。"}]}, {"id": "c1s3", "title": "オフィスアワー", "place": "大学・教授室", "intro": "講義の「正則化」の話が、いまいち腑に落ちない。まずはメールで面談をお願いして、先生のオフィスアワーに行ってみよう。", "outro": "質問してよかった。分からないことを英語で聞けると、留学生活がぐっと楽になる。", "lines": [{"w": "me", "r": "written", "en": "Dear Professor Miller, would it be possible to meet during your office hours this week?", "ja": "（メール）ミラー先生、今週のオフィスアワーにお時間をいただくことは可能でしょうか。"}, {"w": "me", "r": "formal", "en": "Excuse me, Professor Miller. Do you have a few minutes?", "ja": "すみません、ミラー先生。少しお時間よろしいですか？"}, {"w": "miller", "r": "casual", "en": "Sure, come on in. What can I do for you?", "ja": "ええ、どうぞ入って。どうしました？"}, {"w": "me", "r": "formal", "en": "I had a question about the lecture on overfitting. I wasn't sure I understood regularization.", "ja": "過学習の講義について質問があります。正則化を理解できたか自信がなくて。"}, {"w": "miller", "r": "casual", "en": "Okay. Which part was unclear?", "ja": "なるほど。どの部分が分かりにくかった？"}, {"w": "me", "r": "formal", "en": "Why does adding a penalty term help the model generalize?", "ja": "なぜペナルティ項を加えると、モデルの汎化に役立つのでしょうか？"}, {"w": "miller", "r": "formal", "en": "Good question. The penalty discourages large weights, so the model can't fit every bit of noise.", "ja": "良い質問です。ペナルティは大きな重みを抑えるので、モデルはノイズの細部にまで合わせられなくなるんです。"}, {"w": "me", "r": "formal", "en": "I see. So it's a trade-off between fitting the data and keeping the model simple.", "ja": "なるほど。データへの当てはまりと、モデルの単純さのトレードオフなんですね。"}, {"w": "miller", "r": "casual", "en": "That's exactly right. Try a few penalty strengths in your homework and see what happens.", "ja": "まさにその通り。宿題でペナルティの強さをいくつか試して、どうなるか見てごらん。"}, {"w": "me", "r": "formal", "en": "I will. Thank you for your time.", "ja": "そうします。お時間をいただきありがとうございました。"}]}, {"id": "c1s7", "bg": "lab", "title": "ペアで実装する", "place": "大学・研究室", "intro": "Tom と2人で、1台のパソコンを使ってコードを書く。打つ人と見る人に分かれる「ペアプログラミング」だ。気づいたことは、その場で言葉にしよう。", "outro": "思ったことを口に出しながら書くと、間違いが早く見つかる。英語の練習にもなる。", "lines": [{"w": "tom", "r": "casual", "en": "Do you want to type, or should I?", "ja": "キーボードを打つ役、やる？ それとも僕がやろうか？"}, {"w": "me", "r": "casual", "en": "I'll type. Could you keep an eye out for mistakes?", "ja": "私が打つよ。間違いがないか見ていてくれる？"}, {"w": "tom", "r": "casual", "en": "Sure. Let's start with the data loader.", "ja": "いいよ。データローダーから始めよう。"}, {"w": "me", "r": "casual", "en": "I'm going to shuffle the data before splitting it into batches.", "ja": "データをバッチに分ける前に、シャッフルするね。"}, {"w": "tom", "r": "casual", "en": "Wait, shouldn't we set the random seed first?", "ja": "待って、先に乱数シードを固定したほうがよくない？"}, {"w": "me", "r": "casual", "en": "Good catch. Otherwise, we can't reproduce our results.", "ja": "いい指摘。そうしないと、結果を再現できないもんね。"}, {"w": "tom", "r": "casual", "en": "Also, that variable name is a bit confusing. Maybe rename it?", "ja": "それと、その変数名、ちょっと分かりにくいかも。名前を変える？"}, {"w": "me", "r": "casual", "en": "You're right. I'll give it a clearer name.", "ja": "その通り。もっと分かりやすい名前にするね。"}, {"w": "tom", "r": "casual", "en": "Let's run it and see if it works.", "ja": "動かして、ちゃんと動くか見てみよう。"}, {"w": "me", "r": "casual", "en": "It runs! Let's switch. It's your turn to type.", "ja": "動いた！ 交代しよう。次はあなたが打つ番。"}]}, {"id": "c1s8", "bg": "lab", "title": "論文の輪読会", "place": "大学・研究室", "intro": "週に一度の論文の輪読会。今日はあなたが、読んできた論文を紹介する番だ。「何をした論文か → 主なアイデア → 弱いところ」の順に話そう。", "outro": "論文を紹介するときは、良いところだけでなく、弱いところも言えると議論が深まる。", "lines": [{"w": "priya", "r": "casual", "en": "Okay, it's your turn. Which paper did you pick?", "ja": "じゃあ、あなたの番。どの論文を選んだの？"}, {"w": "me", "r": "formal", "en": "I chose a paper about making small models almost as accurate as large ones.", "ja": "小さなモデルを、大きなモデルとほぼ同じくらい正確にする、という論文を選びました。"}, {"w": "slide", "r": "written", "en": "Knowledge distillation: a smaller student model is trained to match the outputs of a larger teacher model.", "ja": "（スライド）知識蒸留：小さな生徒モデルを、大きな教師モデルの出力に合わせるように訓練する。"}, {"w": "me", "r": "formal", "en": "The main idea is to train the small model to copy the large model's outputs.", "ja": "主なアイデアは、小さいモデルに、大きいモデルの出力をまねさせるように訓練することです。"}, {"w": "tom", "r": "casual", "en": "So the small model learns from the big one, like a student and a teacher?", "ja": "つまり、小さいモデルが大きいモデルから学ぶってこと？ 生徒と先生みたいに？"}, {"w": "me", "r": "formal", "en": "Exactly. And surprisingly, the student often does better than the same small model trained on its own.", "ja": "その通りです。しかも驚いたことに、同じ小さなモデルを単独で訓練するより、性能がよくなることが多いんです。"}, {"w": "priya", "r": "casual", "en": "What do you think are the weaknesses of the paper?", "ja": "この論文の弱点は何だと思う？"}, {"w": "me", "r": "formal", "en": "They only tested it on image tasks, so I'm not sure it works for text.", "ja": "画像のタスクでしか試していないので、テキストでも通用するかは分かりません。"}, {"w": "priya", "r": "casual", "en": "Good point. That's a fair criticism.", "ja": "いい指摘ね。もっともな批判だと思う。"}, {"w": "me", "r": "formal", "en": "If I have time, I'd like to try it on our text data myself.", "ja": "時間があれば、自分たちのテキストデータで試してみたいです。"}]}, {"id": "c1s4", "title": "研究室ミーティング", "place": "大学・会議室", "intro": "毎週の研究室ミーティング。今日はあなたが進捗を報告する番だ。指摘を受けたら、受け止めて次の行動を言おう。", "outro": "指摘をもらって、次にやることがはっきりした。報告の型が少し身についてきた。", "lines": [{"w": "miller", "r": "formal", "en": "Let's get started. Could you give us a quick update on your project?", "ja": "始めましょう。プロジェクトの進捗を手短に報告してもらえますか？"}, {"w": "me", "r": "formal", "en": "Sure. This week, I reproduced the baseline results from the paper.", "ja": "はい。今週は、論文のベースラインの結果を再現しました。"}, {"w": "me", "r": "formal", "en": "The accuracy was about two points lower than reported, so I'm looking into why.", "ja": "精度が報告値より2ポイントほど低かったので、原因を調べています。"}, {"w": "tom", "r": "casual", "en": "Did you use the same data split as the authors?", "ja": "著者と同じデータ分割を使った？"}, {"w": "me", "r": "formal", "en": "Good point. I'm not sure, actually. I'll double-check that.", "ja": "いい指摘ですね。実ははっきりしません。確認してみます。"}, {"w": "priya", "r": "casual", "en": "Also, the random seed can make a big difference on small datasets.", "ja": "それに、小さいデータセットだと、乱数シードで結果がかなり変わることもあるよ。"}, {"w": "me", "r": "formal", "en": "That makes sense. I'll run it with five different seeds and report the average.", "ja": "なるほど。5種類のシードで実行して、平均を報告します。"}, {"w": "miller", "r": "formal", "en": "Sounds like a plan. Let's check back next week.", "ja": "それでいきましょう。また来週確認しましょう。"}]}, {"id": "c1s9", "bg": "online", "title": "ビデオ会議で共同研究", "place": "研究室・ビデオ会議", "intro": "ミラー先生の紹介で、AI スタートアップのエンジニア Dana とビデオ会議をすることになった。映像が止まったり、音が途切れたり。オンライン会議でよく使う言い回しを覚えよう。", "outro": "「聞こえますか」「もう一度お願いします」。オンライン会議の決まり文句は、言えるだけで落ち着ける。", "lines": [{"w": "dana", "r": "casual", "en": "Hi! Can you hear me okay?", "ja": "こんにちは！ 声、ちゃんと聞こえる？"}, {"w": "me", "r": "casual", "en": "Yes, I can hear you. But your video is frozen.", "ja": "はい、聞こえます。でも映像が止まっています。"}, {"w": "dana", "r": "casual", "en": "Oh, let me turn my camera off and on again. Is that better?", "ja": "あ、カメラを一度切って、つけ直すね。これでどう？"}, {"w": "me", "r": "casual", "en": "Much better. Thanks for making time for this call.", "ja": "だいぶよくなりました。この打ち合わせのために時間をつくってくれて、ありがとうございます。"}, {"w": "dana", "r": "formal", "en": "Of course. Professor Miller told me you're working on model evaluation.", "ja": "もちろん。ミラー先生から、モデルの評価を研究していると聞いたよ。"}, {"w": "me", "r": "formal", "en": "That's right. If possible, I'd love to test our method on your company's data.", "ja": "そうなんです。もし可能なら、御社のデータで私たちの手法を試してみたいです。"}, {"w": "dana", "r": "casual", "en": "Sorry, you're breaking up a little. Could you say that last part again?", "ja": "ごめん、少し音が途切れてる。最後のところ、もう一度言ってもらえる？"}, {"w": "me", "r": "formal", "en": "Sure. I said I'd like to test our method on your data.", "ja": "はい。御社のデータで、私たちの手法を試したい、と言いました。"}, {"w": "dana", "r": "casual", "en": "Got it. That could work. Let me check with my team and get back to you by email.", "ja": "了解。それならできるかも。チームに確認して、メールで返事するね。"}, {"w": "me", "r": "written", "en": "Thank you for your time today. As discussed, I've attached a short summary of our method.", "ja": "（メール）本日はお時間をいただきありがとうございました。お話ししたとおり、私たちの手法の簡単な概要を添付します。"}]}, {"id": "c1s5", "title": "初めての学会・懇親会", "place": "国際学会・レセプション会場", "intro": "初めての国際学会。昼の発表が終わり、夜は懇親会。グラスを片手に、ひとりで立っている研究者がいる。話しかけて、話を広げて、感じよく切り上げよう。", "outro": "話しかけるのも、切り上げるのも、思ったより自然にできた。", "boss": {"title": "30秒自己紹介", "prompt": "懇親会で初めて会った人に、30秒で自己紹介してみよう。名前・所属・研究内容に加えて、最後に相手へ質問を返すと会話が続きます。", "hints": ["Hi, I'm ___. I'm a master's student at ___.", "I work on ___, especially ___.", "Basically, I'm trying to figure out ___.", "What brings you to this conference?", "What are you working on these days?"], "sec": 30}, "lines": [{"w": "me", "r": "casual", "en": "Hi, mind if I join you?", "ja": "こんにちは、ご一緒してもいいですか？"}, {"w": "wei", "r": "casual", "en": "Not at all. I'm Wei, from a robotics lab in Singapore.", "ja": "もちろん。ウェイです。シンガポールのロボティクスの研究室から来ました。"}, {"w": "me", "r": "casual", "en": "Nice to meet you. I'm a master's student, and I work on model evaluation.", "ja": "はじめまして。修士の学生で、モデルの評価を研究しています。"}, {"w": "wei", "r": "casual", "en": "Oh, interesting. What kind of evaluation?", "ja": "へえ、面白いですね。どんな評価ですか？"}, {"w": "me", "r": "casual", "en": "Mainly how to tell if a model will still work on real-world data.", "ja": "主に、モデルが実世界のデータでもちゃんと動くかを見分ける方法です。"}, {"w": "wei", "r": "casual", "en": "That's a big problem in robotics too. Simulation results often don't transfer.", "ja": "それはロボティクスでも大問題なんです。シミュレーションの結果が、そのまま通用しないことが多くて。"}, {"w": "me", "r": "casual", "en": "Really? How do you usually deal with that?", "ja": "本当ですか？ 普段はどう対処しているんですか？"}, {"w": "wei", "r": "casual", "en": "We add a lot of randomness during training. It's not perfect, but it helps.", "ja": "訓練中にランダム性をたくさん加えるんです。完璧ではないけど、効果はあります。"}, {"w": "me", "r": "casual", "en": "That sounds similar to data augmentation. Are you presenting a poster?", "ja": "データ拡張に似ていますね。ポスター発表はされるんですか？"}, {"w": "wei", "r": "casual", "en": "Yes, tomorrow morning. It's number forty-two, near the entrance. Feel free to stop by.", "ja": "ええ、明日の午前に。入口近くの42番です。気軽に寄ってください。"}, {"w": "me", "r": "casual", "en": "I'd love to. Could I connect with you on LinkedIn?", "ja": "ぜひ。LinkedInでつながってもいいですか？"}, {"w": "wei", "r": "casual", "en": "Of course. Here's my QR code.", "ja": "もちろん。これが私のQRコードです。"}, {"w": "me", "r": "casual", "en": "Thanks. I'll let you mingle, but it was great talking to you.", "ja": "ありがとうございます。ほかの方ともお話ししたいでしょうから、このへんで。お話しできてよかったです。"}, {"w": "wei", "r": "casual", "en": "Likewise. Enjoy the rest of the conference!", "ja": "こちらこそ。学会の残りも楽しんでください！"}]}, {"id": "c1t1", "kind": "talk", "bg": "lecture", "title": "講義：勾配降下法", "place": "大学・講義室", "intro": "ミラー先生の2回目の講義。今日はモデルがどうやって学習するのか、たとえ話で説明してくれるらしい。まずはテキストを見ずに、話の流れをつかもう。", "outro": "霧の中で丘を下りる話。たとえ話ごと覚えると、専門用語も忘れにくい。", "quiz": [{"q": "霧の中の丘のたとえで、「足もとの傾き」は何にあたる？", "c": ["損失", "勾配", "学習率", "データの量"], "a": 1}, {"q": "歩幅（学習率）が大きすぎると、どうなると言っていた？", "c": ["下りるのにいつまでもかかる", "谷を飛び越えてしまうことがある", "霧が晴れる", "必ずいちばん低い地点に着く"], "a": 1}, {"q": "宿題は何？", "c": ["勾配降下法の説明を書く", "3種類の学習率で損失の曲線を描く", "近くの丘に登る", "論文を1本読む"], "a": 1}], "lines": [{"w": "miller", "r": "formal", "en": "Last time, we talked about overfitting. Today, let's look at how models actually learn.", "ja": "前回は過学習の話をしました。今日は、モデルが実際にどうやって学習するのかを見ていきましょう。"}, {"w": "miller", "r": "formal", "en": "Imagine you're standing on a hill in thick fog, and you want to reach the bottom.", "ja": "濃い霧の中、丘の上に立っていて、ふもとまで下りたいと想像してください。"}, {"w": "miller", "r": "formal", "en": "You can't see the whole landscape, but you can feel the slope under your feet.", "ja": "景色全体は見えませんが、足もとの傾きは感じられます。"}, {"w": "miller", "r": "formal", "en": "So you take a small step in the direction that goes downhill most steeply.", "ja": "そこで、いちばん下りになっている方向に、小さく一歩進みます。"}, {"w": "miller", "r": "formal", "en": "Then you check the slope again, and take another step.", "ja": "それからまた傾きを確かめて、もう一歩進みます。"}, {"w": "miller", "r": "formal", "en": "That's basically what gradient descent does.", "ja": "勾配降下法がやっていることは、基本的にこれです。"}, {"w": "miller", "r": "formal", "en": "Your height on the hill is the loss, and the slope is the gradient.", "ja": "丘の高さが損失で、傾きが勾配です。"}, {"w": "miller", "r": "formal", "en": "The size of each step is called the learning rate.", "ja": "一歩の大きさは、学習率と呼ばれます。"}, {"w": "miller", "r": "formal", "en": "If your steps are too small, it takes forever to get down.", "ja": "歩幅が小さすぎると、下りるのにいつまでもかかります。"}, {"w": "miller", "r": "formal", "en": "But if they're too big, you might jump right over the valley.", "ja": "でも大きすぎると、谷を飛び越えてしまうかもしれません。"}, {"w": "miller", "r": "formal", "en": "In practice, we often start with larger steps and make them smaller over time.", "ja": "実際には、最初は大きめの歩幅で始めて、だんだん小さくしていくことがよくあります。"}, {"w": "miller", "r": "formal", "en": "One more thing: because of the fog, you might end up in a small dip instead of the lowest point.", "ja": "もう一つ。霧のせいで、いちばん低い地点ではなく、小さなくぼみにたどり着いてしまうこともあります。"}, {"w": "miller", "r": "formal", "en": "Surprisingly, for large neural networks, that's often good enough.", "ja": "意外なことに、大きなニューラルネットワークでは、それで十分なことが多いのです。"}, {"w": "miller", "r": "formal", "en": "For homework, try three different learning rates and plot the loss curves.", "ja": "宿題として、3種類の学習率を試して、損失の曲線をグラフにしてみてください。"}]}, {"id": "c1t2", "kind": "talk", "bg": "lab", "title": "研究室のガイダンス", "place": "大学・研究室", "intro": "研究室に来て2日目。先輩の Priya が、研究室のルールをまとめて説明してくれる。早口のくだけた説明を、テキストなしでどこまで聞き取れるか試そう。", "outro": "ルールの説明は、数字・曜日・「〜してね」の部分を聞き逃さないのがコツ。", "quiz": [{"q": "GPU サーバーを使う前にすることは？", "c": ["先生にメールする", "カレンダーで時間を予約する", "チャットで抽選する", "特にない"], "a": 1}, {"q": "研究室ミーティングはいつ？", "c": ["毎週月曜の10時", "毎週火曜の2時", "毎週金曜の2時", "月に1回"], "a": 1}, {"q": "コーヒー豆のルールは？", "c": ["毎週当番が買う", "先生が買う", "使い切った人が次の袋を買う", "持ち込み禁止"], "a": 2}], "lines": [{"w": "priya", "r": "casual", "en": "Okay, let me quickly go over how things work in our lab.", "ja": "じゃあ、この研究室でのやり方を手短に説明するね。"}, {"w": "priya", "r": "casual", "en": "First, the GPU server. Everyone shares it, so please book time on the calendar before you use it.", "ja": "まず GPU サーバー。みんなで共有しているから、使う前にカレンダーで時間を予約してね。"}, {"w": "priya", "r": "casual", "en": "If you need it for more than a day, just give everyone a heads-up in the chat.", "ja": "1日以上使うときは、チャットでみんなにひと声かけておいて。"}, {"w": "priya", "r": "casual", "en": "Second, lab meetings are every Tuesday at two.", "ja": "次に、研究室ミーティングは毎週火曜の2時から。"}, {"w": "priya", "r": "casual", "en": "Each week, two people give updates, and the schedule is on the shared drive.", "ja": "毎週2人が進捗を報告して、その順番表は共有ドライブにあるよ。"}, {"w": "priya", "r": "casual", "en": "Don't worry about making your slides perfect. Professor Miller cares more about your thinking.", "ja": "スライドを完璧にしようとしなくて大丈夫。ミラー先生が大事にしているのは、あなたの考え方だから。"}, {"w": "priya", "r": "casual", "en": "Third, please back up your code. We once lost a month of work, and it wasn't fun.", "ja": "3つ目、コードはバックアップしてね。前に1か月分の作業が消えたことがあって、あれは本当につらかった。"}, {"w": "priya", "r": "casual", "en": "Oh, and the coffee machine is free, but whoever finishes the beans buys the next bag.", "ja": "あ、それとコーヒーマシンは無料だけど、豆を使い切った人が次の袋を買う決まりね。"}, {"w": "priya", "r": "casual", "en": "We take that rule very seriously, by the way.", "ja": "ちなみに、そのルールはかなり本気で守られてるから。"}, {"w": "priya", "r": "casual", "en": "Finally, if you're stuck, just ask. Nobody here expects you to know everything on day one.", "ja": "最後に、困ったら遠慮なく聞いて。初日から全部分かっているなんて、ここでは誰も思ってないから。"}, {"w": "priya", "r": "casual", "en": "Any questions so far?", "ja": "ここまでで質問はある？"}]}, {"id": "c1x1", "kind": "side", "bg": "bank", "title": "銀行口座をつくる", "place": "大学近くの銀行", "intro": "留学生活の最初の関門、銀行口座づくり。窓口で必要なものを聞かれても、落ち着いて答えよう。", "outro": "口座ができた。これで家賃も払える。", "lines": [{"w": "staff", "r": "formal", "en": "Hi, how can I help you today?", "ja": "こんにちは。本日はどのようなご用件でしょうか？"}, {"w": "me", "r": "formal", "en": "Hi, I'd like to open a checking account. I'm an international student.", "ja": "こんにちは。普段使い用の口座を開きたいです。留学生です。"}, {"w": "staff", "r": "formal", "en": "Sure. Could I see your passport and your student ID?", "ja": "かしこまりました。パスポートと学生証を見せていただけますか？"}, {"w": "me", "r": "formal", "en": "Here you go. I also have a letter from the university.", "ja": "どうぞ。大学からの書類もあります。"}, {"w": "staff", "r": "formal", "en": "Perfect. Do you have a local address and phone number?", "ja": "ありがとうございます。こちらの住所と電話番号はお持ちですか？"}, {"w": "me", "r": "formal", "en": "Yes, I just moved into an apartment near campus.", "ja": "はい、キャンパスの近くのアパートに引っ越したばかりです。"}, {"w": "staff", "r": "formal", "en": "Great. Would you like a debit card with the account?", "ja": "かしこまりました。口座と一緒に、デビットカードもお作りしますか？"}, {"w": "me", "r": "casual", "en": "Yes, please. How long does it take to arrive?", "ja": "はい、お願いします。届くまで、どのくらいかかりますか？"}, {"w": "staff", "r": "formal", "en": "About five to seven business days. It'll be mailed to your address.", "ja": "5〜7営業日ほどです。ご住所に郵送されます。"}, {"w": "me", "r": "casual", "en": "Got it. Thank you for your help!", "ja": "わかりました。ありがとうございました！"}]}, {"id": "c1x2", "kind": "side", "bg": "cafe", "title": "カフェで注文する", "place": "キャンパスのカフェ", "intro": "授業の前にカフェでコーヒーを買う。サイズ、ホットかアイスか、ミルクの種類、名前……聞かれることが多い。テンポよく答えよう。", "outro": "注文の流れは毎回ほぼ同じ。一度覚えれば、朝のカフェがこわくなくなる。", "lines": [{"w": "staff", "r": "casual", "en": "Hi there! What can I get for you?", "ja": "いらっしゃいませ！ ご注文は？"}, {"w": "me", "r": "casual", "en": "Can I get a medium latte, please?", "ja": "M サイズのラテをください。"}, {"w": "staff", "r": "casual", "en": "Sure. Hot or iced?", "ja": "かしこまりました。ホットとアイス、どちらにしますか？"}, {"w": "me", "r": "casual", "en": "Iced, please. And could I get it with oat milk?", "ja": "アイスでお願いします。それと、オーツミルクにできますか？"}, {"w": "staff", "r": "casual", "en": "No problem. Anything else?", "ja": "大丈夫ですよ。ほかにご注文は？"}, {"w": "me", "r": "casual", "en": "That's it, thanks.", "ja": "以上です、ありがとう。"}, {"w": "staff", "r": "casual", "en": "Can I get a name for the order?", "ja": "ご注文用に、お名前をいただけますか？"}, {"w": "me", "r": "casual", "en": "It's Yu. Y, U.", "ja": "ユウです。Y、U です。"}, {"w": "staff", "r": "casual", "en": "Thanks, Yu. That'll be five seventy-five.", "ja": "ありがとう、ユウさん。5ドル75セントです。"}, {"w": "me", "r": "casual", "en": "Can I pay by card?", "ja": "カードで払えますか？"}, {"w": "staff", "r": "casual", "en": "Of course. Just tap it here.", "ja": "もちろん。ここにタッチしてください。"}]}, {"id": "c1x3", "kind": "side", "bg": "lab", "title": "週末の予定の雑談", "place": "大学・研究室", "intro": "金曜の夕方、研究室で Priya に週末の予定を聞かれた。雑談は、質問を返すと続く。誘われたら、気持ちよく乗ってみよう。", "outro": "雑談の誘いに乗るのも、留学の大事な勉強。", "lines": [{"w": "priya", "r": "casual", "en": "Any plans for the weekend?", "ja": "週末は何か予定ある？"}, {"w": "me", "r": "casual", "en": "Not really. I was thinking of just catching up on sleep.", "ja": "特にないです。たまった睡眠を取り戻そうかなと思ってて。"}, {"w": "priya", "r": "casual", "en": "Ha, fair enough. A few of us are going hiking on Saturday, if you want to join.", "ja": "はは、それもいいね。土曜に何人かでハイキングに行くんだけど、よかったら来る？"}, {"w": "me", "r": "casual", "en": "Oh, that sounds fun! Where are you going?", "ja": "わあ、楽しそう！ どこに行くんですか？"}, {"w": "priya", "r": "casual", "en": "There's a trail about an hour north of here. The view from the top is amazing.", "ja": "ここから北に1時間くらいのところに山道があるの。頂上からの景色が最高なんだ。"}, {"w": "me", "r": "casual", "en": "I'm in. Is it a hard hike? I haven't exercised in a while.", "ja": "行きます。きついコースですか？ しばらく運動してなくて。"}, {"w": "priya", "r": "casual", "en": "It's pretty easy. Just bring water and comfortable shoes.", "ja": "けっこう楽だよ。水と、歩きやすい靴だけ持ってきて。"}, {"w": "me", "r": "casual", "en": "Got it. Should I bring anything else, like snacks?", "ja": "わかりました。おやつとか、ほかに持っていくものはありますか？"}, {"w": "priya", "r": "casual", "en": "Snacks are always welcome. We'll pick you up at eight.", "ja": "おやつはいつでも大歓迎。8時に迎えに行くね。"}, {"w": "me", "r": "casual", "en": "Thanks for inviting me. See you on Saturday!", "ja": "誘ってくれてありがとうございます。では土曜に！"}]}]},
  {"id": 2, "title": "第2章 インターン編", "rank": "インターン", "scenes": [{"id": "c2s1", "bg": "office", "title": "朝会（スタンドアップ）", "place": "AIスタートアップ・オフィス", "intro": "夏。研究室の紹介で、AIスタートアップのインターンに参加することになった。毎朝10時は、立ったまま話す「朝会」。昨日やったこと・今日やること・困っていることを、短く話そう。", "outro": "3点セットで話せば、朝会はこわくない。しかもトムまでいた。", "lines": [{"w": "dana", "r": "casual", "en": "Morning, everyone. Let's do a quick round. Who wants to go first?", "ja": "おはよう、みんな。手短に一周しよう。誰から行く？"}, {"w": "me", "r": "formal", "en": "I'll go. Yesterday, I finished cleaning the training data.", "ja": "私から行きます。昨日は訓練データのクリーニングを終えました。"}, {"w": "me", "r": "formal", "en": "Today, I'm going to start writing the evaluation script.", "ja": "今日は評価用のスクリプトを書き始めます。"}, {"w": "me", "r": "formal", "en": "One blocker: I don't have write access to the shared bucket yet.", "ja": "困っていることが一つあって、共有ストレージへの書き込み権限がまだありません。"}, {"w": "dana", "r": "casual", "en": "Ah, I can fix that right after this. Ping me if I forget.", "ja": "ああ、これが終わったらすぐ直すよ。忘れてたら声かけて。"}, {"w": "me", "r": "casual", "en": "Thanks, I will.", "ja": "ありがとうございます、そうします。"}, {"w": "tom", "r": "casual", "en": "Hey, aren't you from Professor Miller's lab?", "ja": "ねえ、ミラー先生の研究室の人だよね？"}, {"w": "me", "r": "casual", "en": "Tom? No way! You're interning here too?", "ja": "トム？ うそでしょ！ トムもここでインターンしてるの？"}, {"w": "tom", "r": "casual", "en": "Yep, on the data team. Let's grab lunch later.", "ja": "うん、データチームで。あとでお昼行こうよ。"}, {"w": "dana", "r": "casual", "en": "Okay, you two can catch up later. Next!", "ja": "はいはい、話の続きはあとでね。次！"}]}, {"id": "c2s2", "bg": "office", "title": "わからないことを聞く", "place": "AIスタートアップ・オフィス", "intro": "評価スクリプトを動かしたら、エラーで止まった。30分調べても分からない。メンターの Dana に、状況を整理して聞いてみよう。「何が起きたか」「何を試したか」を先に言うのがコツ。", "outro": "聞いたら5分で解決した。悩んだ30分は、少しもったいなかったかもしれない。", "lines": [{"w": "me", "r": "formal", "en": "Hi Dana, do you have a minute? I'm stuck on something.", "ja": "Dana さん、ちょっといいですか？ 行き詰まっていることがあって。"}, {"w": "dana", "r": "casual", "en": "Sure. What's going on?", "ja": "いいよ。どうしたの？"}, {"w": "me", "r": "formal", "en": "The evaluation script crashes when it loads the model checkpoint.", "ja": "評価スクリプトが、モデルのチェックポイントを読み込むところで落ちるんです。"}, {"w": "me", "r": "formal", "en": "I've already checked the file path and the library version.", "ja": "ファイルのパスとライブラリのバージョンは、もう確認しました。"}, {"w": "dana", "r": "casual", "en": "Can you show me the error message?", "ja": "エラーメッセージを見せてくれる？"}, {"w": "me", "r": "casual", "en": "Here. It says the tensor shapes don't match.", "ja": "これです。テンソルの形が合わないと出ています。"}, {"w": "dana", "r": "casual", "en": "Oh, I bet you're using the old config file. We changed the hidden size last week.", "ja": "ああ、たぶん古い設定ファイルを使ってるね。先週、隠れ層のサイズを変えたんだ。"}, {"w": "me", "r": "formal", "en": "That explains it. Where can I find the latest one?", "ja": "それで分かりました。最新のものはどこにありますか？"}, {"w": "dana", "r": "casual", "en": "It's on the main branch. And next time, don't hesitate to ask sooner.", "ja": "main ブランチにあるよ。それと、次はもっと早めに遠慮なく聞いてね。"}, {"w": "me", "r": "casual", "en": "Got it. I'll ask earlier next time.", "ja": "わかりました。次はもっと早く聞きます。"}]}, {"id": "c2s3", "bg": "office", "title": "コードレビューを受ける", "place": "AIスタートアップ・オフィス", "intro": "初めてのプルリクエスト。説明文は書き言葉、レビューのやりとりは話し言葉。指摘を受け止めて、自分がそうした理由も短く説明しよう。", "outro": "指摘は攻撃ではなく、コードを良くするための材料。そう思えると、レビューが少し楽しみになった。", "lines": [{"w": "me", "r": "written", "en": "This PR adds a script that evaluates the model on the validation set.", "ja": "（説明文）このプルリクエストは、検証セットでモデルを評価するスクリプトを追加します。"}, {"w": "me", "r": "written", "en": "It reports accuracy and F1 score, and saves the results as a JSON file.", "ja": "（説明文）正解率と F1 スコアを出力し、結果を JSON ファイルとして保存します。"}, {"w": "dana", "r": "casual", "en": "Nice work overall. I left a few comments.", "ja": "全体的にいいね。いくつかコメントを残しておいたよ。"}, {"w": "dana", "r": "casual", "en": "Could you split this function into smaller pieces? It's doing too much.", "ja": "この関数を小さく分けてもらえる？ やることが多すぎるから。"}, {"w": "me", "r": "formal", "en": "Sure, that makes sense. I'll separate the loading and the scoring.", "ja": "はい、そうですね。読み込みと採点を分けます。"}, {"w": "dana", "r": "casual", "en": "Also, why did you hard-code the batch size here?", "ja": "あと、ここでバッチサイズを直接書き込んだのはなぜ？"}, {"w": "me", "r": "formal", "en": "I wanted to avoid running out of memory, but I should make it configurable.", "ja": "メモリ不足を避けたかったんですが、設定で変えられるようにすべきですね。"}, {"w": "dana", "r": "casual", "en": "Exactly. And please add a test for empty input.", "ja": "その通り。それと、入力が空の場合のテストも追加してね。"}, {"w": "me", "r": "formal", "en": "Will do. I'll push the changes this afternoon.", "ja": "了解です。午後に修正をプッシュします。"}, {"w": "dana", "r": "casual", "en": "Great. Ping me when it's ready for another look.", "ja": "いいね。もう一度見られるようになったら声かけて。"}]}, {"id": "c2s4", "bg": "office", "title": "チャットで相談する", "place": "自宅（リモート勤務）", "intro": "リモート勤務の日。チャットで進捗を共有し、チームに意見を聞こう。チャットは文字なので「書き言葉」だけれど、くだけた言い方もよく使われる。", "outro": "気づいたことを早めに書いておくと、誰かが手がかりをくれる。チャットも立派な会議だ。", "lines": [{"w": "me", "r": "written", "en": "Quick update: the new evaluation script is merged and running every night.", "ja": "（チャット）簡単な報告です。新しい評価スクリプトがマージされ、毎晩動いています。"}, {"w": "me", "r": "written", "en": "I noticed that accuracy drops a lot on short sentences. Has anyone seen this before?", "ja": "（チャット）短い文で精度が大きく下がることに気づきました。前に見たことがある方はいますか？"}, {"w": "tom", "r": "written", "en": "Yeah, our tokenizer splits short texts weirdly. Might be related.", "ja": "（チャット）うん、うちのトークナイザーは短い文を変に分割するんだ。関係あるかも。"}, {"w": "me", "r": "written", "en": "Interesting. Do you have an example I could look at?", "ja": "（チャット）へえ、面白い。見られる例ある？"}, {"w": "tom", "r": "written", "en": "Sure, I'll send you a notebook in a sec.", "ja": "（チャット）もちろん、すぐノートブックを送るよ。"}, {"w": "dana", "r": "written", "en": "Good catch! Can you write up what you find by Friday?", "ja": "（チャット）よく気づいたね！ 分かったことを金曜までにまとめてくれる？"}, {"w": "me", "r": "written", "en": "Sounds good. I'll share a short doc with the analysis and some examples.", "ja": "（チャット）了解です。分析といくつかの例をまとめた短い文書を共有します。"}, {"w": "me", "r": "written", "en": "Thanks for the pointer, Tom. That notebook saved me a lot of time.", "ja": "（チャット）トム、手がかりをありがとう。あのノートブックでかなり時間が節約できました。"}]}, {"id": "c2s6", "bg": "office", "title": "ラベル付けの方針を決める", "place": "AIスタートアップ・オフィス", "intro": "データチームの Tom と、学習データのラベル付けのルールを決める。あいまいな例をどう扱うか、具体例を出しながら話そう。", "outro": "迷う例こそ、先にルールにしておく。あとで全員が助かる。", "lines": [{"w": "tom", "r": "casual", "en": "We need clear labeling rules before we send the data to the annotators.", "ja": "ラベル付けの担当者にデータを送る前に、はっきりしたルールが必要なんだ。"}, {"w": "me", "r": "formal", "en": "Agreed. What should we do with reviews that are both positive and negative?", "ja": "賛成です。良い点と悪い点の両方が書かれたレビューは、どうしましょう？"}, {"w": "tom", "r": "casual", "en": "Good question. Maybe we add a third label for mixed opinions?", "ja": "いい質問。意見が混ざっているもの用に、3つ目のラベルを足すとか？"}, {"w": "me", "r": "formal", "en": "That makes sense, but it might make the task harder for the annotators.", "ja": "それは分かりますが、担当者にとって作業が難しくなるかもしれません。"}, {"w": "tom", "r": "casual", "en": "True. Then how about we label them by overall sentiment instead?", "ja": "確かに。じゃあ、全体の印象でラベルを付けるのはどう？"}, {"w": "me", "r": "formal", "en": "I like that. Let's write a few examples for each label, including the tricky ones.", "ja": "いいですね。迷いやすいものも含めて、ラベルごとにいくつか例を書きましょう。"}, {"w": "tom", "r": "casual", "en": "And let's have two people label the same hundred samples first.", "ja": "それと、最初に同じ100件を2人にラベル付けしてもらおう。"}, {"w": "me", "r": "formal", "en": "Good idea. If they disagree a lot, we'll know the rules aren't clear enough.", "ja": "いい考えですね。意見が大きく分かれたら、ルールが十分にはっきりしていないと分かります。"}, {"w": "me", "r": "written", "en": "Rule 3: if a review contains both praise and complaints, label it by its overall tone.", "ja": "（ルール文書）ルール3：レビューに称賛と不満の両方が含まれる場合は、全体の調子でラベルを付ける。"}, {"w": "tom", "r": "casual", "en": "Perfect. I'll send this to the annotators tomorrow.", "ja": "完璧。明日、担当者にこれを送るよ。"}]}, {"id": "c2s7", "bg": "meeting", "title": "実験結果を報告する", "place": "AIスタートアップ・会議室", "intro": "週1回の実験報告。数字を伝えるときは、「何と比べて」「どのくらい」「どこまで確かか」をセットで話そう。チームリードの Raj も聞いている。", "outro": "良い結果ほど、言いすぎない。確かさの度合いも一緒に伝えるのが、信頼される報告だ。", "lines": [{"w": "raj", "r": "formal", "en": "Let's hear the results from this week's experiment.", "ja": "今週の実験の結果を聞かせてください。"}, {"w": "me", "r": "formal", "en": "Compared to the baseline, the new model improved accuracy by about three points.", "ja": "ベースラインと比べて、新しいモデルは精度が約3ポイント上がりました。"}, {"w": "me", "r": "formal", "en": "However, I only ran it once, so I'm not sure the difference is meaningful yet.", "ja": "ただ、1回しか実行していないので、その差に意味があるかはまだ分かりません。"}, {"w": "raj", "r": "formal", "en": "I'm glad you pointed that out. What would make you more confident?", "ja": "そこに触れてくれてよかった。何があれば、もっと自信を持てますか？"}, {"w": "me", "r": "formal", "en": "I'd like to run both models five times with different seeds and compare the averages.", "ja": "両方のモデルをシードを変えて5回ずつ実行し、平均を比べたいと思います。"}, {"w": "dana", "r": "casual", "en": "Also, check where it improved. Is it better on everything, or just on easy examples?", "ja": "それと、どこで良くなったかも見てね。全部で良くなったのか、簡単な例だけなのか。"}, {"w": "me", "r": "formal", "en": "That's a good point. I'll break the results down by difficulty.", "ja": "大事な点ですね。難しさごとに結果を分けて見てみます。"}, {"w": "raj", "r": "formal", "en": "Sounds good. Can you share the updated numbers by Thursday?", "ja": "いいですね。木曜までに更新した数字を共有できますか？"}, {"w": "me", "r": "formal", "en": "Yes. I'll post them in the team channel with a short summary.", "ja": "はい。短いまとめと一緒に、チームのチャンネルに投稿します。"}]}, {"id": "c2s8", "bg": "office", "title": "締め切りに間に合わない", "place": "AIスタートアップ・オフィス", "intro": "このままでは金曜の締め切りに間に合いそうにない。黙って遅れるより、早めに伝えて相談しよう。「現状 → 理由 → 提案」の順が伝わりやすい。", "outro": "悪い知らせほど早く。言ってしまえば、一緒に解決策を考えてもらえる。", "lines": [{"w": "me", "r": "formal", "en": "Dana, can I talk to you about the deadline for the analysis?", "ja": "Dana さん、分析の締め切りについて相談してもいいですか？"}, {"w": "dana", "r": "casual", "en": "Sure. Is something wrong?", "ja": "いいよ。何か問題がある？"}, {"w": "me", "r": "formal", "en": "I don't think I can finish everything by Friday.", "ja": "金曜までに全部を終えるのは、難しそうです。"}, {"w": "me", "r": "formal", "en": "Cleaning the data took longer than I expected, because many labels were missing.", "ja": "ラベルが欠けているものが多くて、データの整理に思ったより時間がかかってしまいました。"}, {"w": "dana", "r": "casual", "en": "Thanks for telling me early. What can you realistically get done by Friday?", "ja": "早めに言ってくれてありがとう。どこまでなら終わりそう？"}, {"w": "me", "r": "formal", "en": "I can finish the main analysis by Friday, and the extra charts by next Tuesday.", "ja": "主な分析は金曜までに、追加のグラフは来週の火曜までに終えられます。"}, {"w": "dana", "r": "casual", "en": "That works. The main analysis is what the team really needs.", "ja": "それで大丈夫。チームに本当に必要なのは主な分析だから。"}, {"w": "me", "r": "formal", "en": "Thank you. I'll let you know right away if anything else comes up.", "ja": "ありがとうございます。ほかに何かあれば、すぐに知らせます。"}, {"w": "dana", "r": "casual", "en": "Perfect. And don't stay up all night, okay?", "ja": "よろしくね。それと、徹夜はしないようにね。"}]}, {"id": "c2s9", "bg": "meeting", "title": "発表のリハーサル", "place": "AIスタートアップ・会議室", "intro": "インターン最終発表の前に、Dana と Raj にリハーサルを見てもらう。もらったアドバイスを、その場で言い直してみよう。", "outro": "「まず」「次に」「最後に」。道しるべの言葉があるだけで、聞き手は迷わない。", "lines": [{"w": "me", "r": "formal", "en": "Today, I'll talk about why our model struggles with short inputs.", "ja": "今日は、私たちのモデルが短い入力を苦手とする理由についてお話しします。"}, {"w": "dana", "r": "casual", "en": "Okay, stop for a sec. You're speaking a bit too fast.", "ja": "はい、ちょっと止めて。少し話すのが速すぎるかな。"}, {"w": "me", "r": "casual", "en": "Sorry, I get nervous and speed up.", "ja": "すみません、緊張すると速くなってしまって。"}, {"w": "raj", "r": "formal", "en": "That's very common. Try pausing after each main point.", "ja": "それはよくあることです。大事な点を言うたびに、一呼吸おいてみてください。"}, {"w": "raj", "r": "formal", "en": "Also, give us an outline at the beginning. It helps people follow along.", "ja": "それと、最初に話の構成を伝えてください。聞き手がついていきやすくなります。"}, {"w": "me", "r": "formal", "en": "Got it. I'll cover three things: the problem, the cause, and our fix.", "ja": "わかりました。3つのことをお話しします。問題、原因、そして私たちの解決策です。"}, {"w": "dana", "r": "casual", "en": "Much better! And slow down when you show the numbers.", "ja": "ずっといいね！ それと、数字を見せるときはゆっくりね。"}, {"w": "me", "r": "formal", "en": "Accuracy on short inputs went up from seventy to seventy-eight percent.", "ja": "短い入力での精度は、70%から78%に上がりました。"}, {"w": "raj", "r": "formal", "en": "Perfect. If you present like that, you'll be fine.", "ja": "完璧です。その調子で発表すれば大丈夫ですよ。"}]}, {"id": "c2s5", "bg": "poster", "title": "学会のポスター発表", "place": "国際学会・ポスター会場", "intro": "インターンの成果を、学会のポスターで発表することになった。通りがかる人に短く説明して、質問に答えよう。見覚えのある名札が近づいてくる……。", "outro": "「何の問題か → 何をしたか → 結果」。この順番なら、短くても伝わる。", "boss": {"title": "ポスターを30秒で説明", "prompt": "ポスターの前で立ち止まった人に、自分の研究（またはインターンでやったこと）を30秒で説明しよう。「何の問題か → 何をしたか → 結果どうなったか」の順にすると伝わりやすい。", "hints": ["In short, we looked at ___.", "The problem is that ___.", "So we tried ___.", "As a result, ___ improved by ___.", "Happy to answer any questions."], "sec": 30}, "lines": [{"w": "wei", "r": "casual", "en": "Hey, I remember you! The model evaluation person, right?", "ja": "あ、覚えてます！ モデル評価の人ですよね？"}, {"w": "me", "r": "casual", "en": "Wei! Great to see you again. Thanks for stopping by.", "ja": "ウェイさん！ また会えてうれしいです。寄ってくれてありがとうございます。"}, {"w": "wei", "r": "casual", "en": "So, what's this poster about?", "ja": "それで、このポスターは何についてですか？"}, {"w": "me", "r": "formal", "en": "In short, we found that our model struggles with very short inputs.", "ja": "簡単に言うと、私たちのモデルがとても短い入力を苦手とすることが分かりました。"}, {"w": "me", "r": "formal", "en": "The main cause was how the tokenizer splits rare words.", "ja": "主な原因は、トークナイザーが珍しい単語を分割するやり方でした。"}, {"w": "me", "r": "formal", "en": "After we fixed it, accuracy on short inputs went up by eight points.", "ja": "それを直したら、短い入力での精度が8ポイント上がりました。"}, {"w": "wei", "r": "casual", "en": "Nice. Did it hurt performance on longer inputs?", "ja": "いいですね。長い入力での性能は落ちませんでしたか？"}, {"w": "me", "r": "formal", "en": "Good question. It stayed about the same, within one point.", "ja": "いい質問ですね。ほぼ同じで、差は1ポイント以内でした。"}, {"w": "wei", "r": "casual", "en": "Cool. Do you have a paper or a preprint I can read?", "ja": "いいですね。読める論文かプレプリントはありますか？"}, {"w": "me", "r": "casual", "en": "Not yet, but I can send you the slides. Here's my contact info.", "ja": "まだですが、スライドなら送れます。これが私の連絡先です。"}, {"w": "wei", "r": "casual", "en": "Perfect. Good luck with the rest of the session!", "ja": "助かります。セッションの残りも頑張ってください！"}]}, {"id": "c2t1", "kind": "talk", "bg": "meeting", "title": "全社ミーティング：会社の方針", "place": "AIスタートアップ・全社ミーティング", "intro": "月に一度の全社ミーティング。チームリードの Raj が、会社の今後の方針を話す。数字と「なぜ」に注意して聞こう。", "outro": "方針の話は「何を・なぜ・いつまでに」。この3つが聞き取れれば十分。", "quiz": [{"q": "この四半期で新しく増えた顧客は？", "c": ["約12社", "約20社", "約50社", "約200社"], "a": 1}, {"q": "来年の一番の目標は？", "c": ["社員を2倍にする", "新しい国に進出する", "検索の応答速度を半分にする", "オフィスを移転する"], "a": 2}, {"q": "Raj が最後にお願いしたことは？", "c": ["残業を減らすこと", "顧客の声を共有チャンネルに書くこと", "毎日朝会に出ること", "新しいツールを試すこと"], "a": 1}], "lines": [{"w": "raj", "r": "formal", "en": "Good morning, everyone. Thanks for joining this month's all-hands meeting.", "ja": "皆さん、おはようございます。今月の全社ミーティングに参加してくれてありがとう。"}, {"w": "raj", "r": "formal", "en": "First, some good news. We added about twenty new customers this quarter.", "ja": "まず良い知らせです。この四半期で、新しい顧客が約20社増えました。"}, {"w": "raj", "r": "formal", "en": "Most of them told us they chose us because our search results are more accurate.", "ja": "そのほとんどが、私たちの検索結果のほうが正確だから選んだ、と言ってくれました。"}, {"w": "raj", "r": "formal", "en": "That's a direct result of the work many of you did on the ranking model.", "ja": "これは、皆さんの多くがランキングモデルに取り組んでくれた直接の成果です。"}, {"w": "raj", "r": "formal", "en": "Now, let's talk about next year.", "ja": "では、来年の話をしましょう。"}, {"w": "raj", "r": "formal", "en": "Our biggest goal is to make search twice as fast, without losing accuracy.", "ja": "一番の目標は、精度を落とさずに、検索を2倍速くすることです。"}, {"w": "raj", "r": "formal", "en": "Customers love our quality, but some of them say we're too slow.", "ja": "お客様は品質を気に入ってくれていますが、遅すぎるという声もあります。"}, {"w": "raj", "r": "formal", "en": "To get there, we'll invest in smaller, more efficient models.", "ja": "そのために、より小さく効率のよいモデルに投資します。"}, {"w": "raj", "r": "formal", "en": "We'll also hire about five more engineers over the next six months.", "ja": "また、今後6か月で、エンジニアをあと5人ほど採用します。"}, {"w": "raj", "r": "formal", "en": "If you know someone great, please refer them.", "ja": "素晴らしい人を知っていたら、ぜひ紹介してください。"}, {"w": "raj", "r": "formal", "en": "Finally, one request. When you hear feedback from customers, please post it in the shared channel.", "ja": "最後に一つお願いです。お客様からの声を聞いたら、共有チャンネルに書き込んでください。"}, {"w": "raj", "r": "formal", "en": "Even small comments help us decide what to build next. Thanks, everyone.", "ja": "小さなコメントでも、次に何を作るかを決める助けになります。ありがとうございました。"}]}, {"id": "c2t2", "kind": "talk", "bg": "online", "title": "ポッドキャスト：検索と生成", "place": "通勤中のイヤホン", "intro": "通勤中に、技術系ポッドキャストを聞いている。話しているのは、学会で会った Wei だ。言語モデルに検索を組み合わせる仕組みを、分かりやすく説明している。", "outro": "ポッドキャストは、くだけた話し言葉の宝庫。毎日の通勤で少しずつ聞くと耳が慣れる。", "quiz": [{"q": "言語モデルの弱点として挙げていたのは？", "c": ["計算が遅いこと", "知らないことでも自信ありげに答えること", "日本語が苦手なこと", "画像を扱えないこと"], "a": 1}, {"q": "紹介していた仕組みでは、答える前に何をする？", "c": ["人間に確認する", "関係のある文書を探して渡す", "モデルを再学習する", "答えを3回生成する"], "a": 1}, {"q": "Wei が一番大事だと言っていたのは？", "c": ["モデルの大きさ", "検索の部分の質", "GPU の数", "プロンプトの長さ"], "a": 1}], "lines": [{"w": "wei", "r": "casual", "en": "Hey everyone, welcome back to the show. Today's topic is something a lot of you asked about.", "ja": "みなさん、番組へおかえりなさい。今日のテーマは、たくさんの人から質問をもらったことです。"}, {"w": "wei", "r": "casual", "en": "Language models are amazing, but they have one big weakness.", "ja": "言語モデルはすごいんですが、大きな弱点が一つあります。"}, {"w": "wei", "r": "casual", "en": "When they don't know something, they often answer anyway, and they sound very confident.", "ja": "知らないことでも、とりあえず答えてしまうことが多くて、しかもすごく自信ありげなんです。"}, {"w": "wei", "r": "casual", "en": "So how do we deal with that? One popular idea is to let the model look things up first.", "ja": "じゃあ、どう対処するか。よく使われる考え方の一つが、まずモデルに調べものをさせることです。"}, {"w": "wei", "r": "casual", "en": "Before answering, the system searches for documents that are related to the question.", "ja": "答える前に、システムが質問に関係のある文書を探します。"}, {"w": "wei", "r": "casual", "en": "Then it gives those documents to the model and says, basically, answer using these.", "ja": "そして、その文書をモデルに渡して、要するに「これを使って答えて」と伝えるんです。"}, {"w": "wei", "r": "casual", "en": "It's kind of like an open-book exam instead of a closed-book one.", "ja": "教科書を見ちゃだめな試験じゃなくて、見てもいい試験にする感じですね。"}, {"w": "wei", "r": "casual", "en": "The nice thing is, you can update the documents without retraining the model.", "ja": "いいところは、モデルを学習し直さなくても、文書を更新できることです。"}, {"w": "wei", "r": "casual", "en": "But here's the catch. If the search part finds the wrong documents, the answer will be wrong too.", "ja": "ただし、落とし穴があります。検索の部分が間違った文書を見つけてきたら、答えも間違うんです。"}, {"w": "wei", "r": "casual", "en": "So in my experience, the quality of the search matters more than the size of the model.", "ja": "なので、私の経験では、モデルの大きさよりも、検索の質のほうが大事です。"}, {"w": "wei", "r": "casual", "en": "Next week, we'll talk about how to measure that. See you then!", "ja": "来週は、それをどう測るかについて話します。ではまた！"}]}, {"id": "c2x1", "kind": "side", "bg": "bank", "title": "水漏れを管理会社に電話", "place": "アパート（電話）", "intro": "朝起きたら、キッチンの流しの下が水浸し。アパートの管理会社に電話して、状況を説明しよう。", "outro": "「いつから」「どこで」「どのくらい」。トラブルの電話は、この3つを言えば通じる。", "lines": [{"w": "staff", "r": "formal", "en": "Good morning, Parkside Apartments. How can I help you?", "ja": "おはようございます、パークサイド・アパートメンツです。どうされましたか？"}, {"w": "me", "r": "formal", "en": "Hi, I live in unit three-oh-four. There's water leaking under my kitchen sink.", "ja": "もしもし、304号室の者です。キッチンの流しの下から水が漏れています。"}, {"w": "staff", "r": "formal", "en": "I'm sorry to hear that. When did you notice it?", "ja": "それは大変でしたね。いつ気づかれましたか？"}, {"w": "me", "r": "formal", "en": "This morning. The floor was wet when I woke up.", "ja": "今朝です。起きたら床が濡れていました。"}, {"w": "staff", "r": "formal", "en": "Is it still leaking now?", "ja": "今も漏れていますか？"}, {"w": "me", "r": "casual", "en": "Yes, slowly. I put a bucket under it for now.", "ja": "はい、少しずつ。とりあえずバケツを置いています。"}, {"w": "staff", "r": "formal", "en": "Okay. I can send a plumber this afternoon. Will you be home?", "ja": "わかりました。今日の午後に配管工を向かわせます。ご在宅ですか？"}, {"w": "me", "r": "formal", "en": "I'll be at work, but you can use the spare key. Is that okay?", "ja": "仕事に出ていますが、合鍵を使ってもらって大丈夫です。それでいいですか？"}, {"w": "staff", "r": "formal", "en": "That's fine. We'll leave a note after the repair.", "ja": "大丈夫です。修理のあと、メモを残しておきます。"}, {"w": "me", "r": "casual", "en": "Thank you so much. That's a big relief.", "ja": "本当にありがとうございます。とても安心しました。"}]}, {"id": "c2x2", "kind": "side", "bg": "cafe", "title": "同期とランチ", "place": "オフィス近くのフードトラック", "intro": "Tom とお昼ごはん。仕事の話はひと休みして、食べ物や故郷の話で盛り上がろう。", "outro": "食べ物の話は、どの国の人とでも盛り上がる最強の話題。", "lines": [{"w": "tom", "r": "casual", "en": "So, what are you in the mood for? Tacos or noodles?", "ja": "で、何の気分？ タコスか、麺か。"}, {"w": "me", "r": "casual", "en": "Tacos sound good. I've never tried this truck before.", "ja": "タコスがいいな。このキッチンカーは初めてなんだ。"}, {"w": "tom", "r": "casual", "en": "Oh, you'll love it. The fish tacos are the best in town.", "ja": "ああ、絶対気に入るよ。ここのフィッシュタコスは町で一番だから。"}, {"w": "me", "r": "casual", "en": "Are they spicy? I'm not great with really spicy food.", "ja": "辛い？ すごく辛いのはちょっと苦手で。"}, {"w": "tom", "r": "casual", "en": "Just ask for the sauce on the side. Then you can add as much as you want.", "ja": "ソースを別にしてもらえばいいよ。そうすれば好きなだけかけられる。"}, {"w": "me", "r": "casual", "en": "Good tip. By the way, do you miss food from home?", "ja": "いいこと聞いた。ところで、地元の料理が恋しくなる？"}, {"w": "tom", "r": "casual", "en": "All the time. My mom makes the best apple pie. What about you?", "ja": "しょっちゅう。母のアップルパイが最高なんだ。そっちは？"}, {"w": "me", "r": "casual", "en": "I really miss Japanese curry. It's totally different from Indian curry.", "ja": "日本のカレーがすごく恋しい。インドのカレーとは全然違うんだよ。"}, {"w": "tom", "r": "casual", "en": "Really? Now I want to try it. Maybe you could make it for us someday?", "ja": "本当？ 食べてみたくなった。いつか作ってくれない？"}, {"w": "me", "r": "casual", "en": "Sure! Let's have a curry party at my place.", "ja": "いいよ！ うちでカレーパーティーをしよう。"}]}, {"id": "c2x3", "kind": "side", "bg": "bank", "title": "スーパーのレジで", "place": "近所のスーパー", "intro": "スーパーのレジでは、短い質問が次々に飛んでくる。会員カード、袋、支払い方法。テンポよく答えよう。", "outro": "レジの質問は、だいたい決まっている。一度通じれば、もうこわくない。", "lines": [{"w": "staff", "r": "casual", "en": "Hi! Did you find everything you were looking for?", "ja": "こんにちは！ お探しのものは全部見つかりましたか？"}, {"w": "me", "r": "casual", "en": "Yes, thanks. Oh, actually, where can I find the rice?", "ja": "はい、ありがとう。あ、そういえば、お米はどこにありますか？"}, {"w": "staff", "r": "casual", "en": "It's in aisle seven, next to the pasta.", "ja": "7番の通路の、パスタの隣です。"}, {"w": "me", "r": "casual", "en": "Thanks. I'll grab it next time.", "ja": "ありがとう。次に買います。"}, {"w": "staff", "r": "casual", "en": "Do you have a rewards card with us?", "ja": "当店のポイントカードはお持ちですか？"}, {"w": "me", "r": "casual", "en": "No, I don't. Is it free to sign up?", "ja": "いいえ、持っていません。登録は無料ですか？"}, {"w": "staff", "r": "casual", "en": "Yep, you just need your phone number. Want to sign up today?", "ja": "はい、電話番号だけで大丈夫です。今日登録しますか？"}, {"w": "me", "r": "casual", "en": "Maybe next time. I'm in a bit of a hurry.", "ja": "また今度にします。ちょっと急いでいるので。"}, {"w": "staff", "r": "casual", "en": "No problem. Do you need a bag?", "ja": "大丈夫ですよ。袋はいりますか？"}, {"w": "me", "r": "casual", "en": "No, I brought my own. Can I pay with my phone?", "ja": "いいえ、自分のを持ってきました。スマホで払えますか？"}, {"w": "staff", "r": "casual", "en": "Of course. Have a great day!", "ja": "もちろんです。よい一日を！"}]}]},
  {"id": 3, "title": "第3章 ジュニアエンジニア編", "rank": "ジュニアエンジニア", "scenes": [{"id": "c3s1", "bg": "meeting", "title": "チームに自己紹介", "place": "会社・ミーティングルーム", "intro": "春。インターン先から内定をもらい、正社員として入社した。チームの全体ミーティングで自己紹介をしよう。進行役はマネージャーの Raj だ。", "outro": "仕事の話に、少しだけ自分の話を足す。それだけで、ラーメン部に入部できた。", "lines": [{"w": "raj", "r": "formal", "en": "Everyone, please welcome our new machine learning engineer.", "ja": "皆さん、新しい機械学習エンジニアを歓迎しましょう。"}, {"w": "me", "r": "formal", "en": "Thank you. Some of you may remember me from my internship last summer.", "ja": "ありがとうございます。去年の夏のインターンで、覚えている方もいるかもしれません。"}, {"w": "me", "r": "formal", "en": "I'll be working on the search ranking model with Dana.", "ja": "Dana さんと一緒に、検索ランキングのモデルを担当します。"}, {"w": "me", "r": "formal", "en": "Outside of work, I like hiking and trying new ramen places.", "ja": "仕事以外では、ハイキングと、新しいラーメン屋めぐりが好きです。"}, {"w": "tom", "r": "casual", "en": "Ramen? Then you're coming with us on Friday.", "ja": "ラーメン？ じゃあ金曜は一緒に来てもらうよ。"}, {"w": "raj", "r": "casual", "en": "Ha, the ramen club has a new member. Okay, any questions for our new teammate?", "ja": "はは、ラーメン部に新メンバーだね。さて、新しい仲間に質問はある？"}, {"w": "dana", "r": "casual", "en": "What are you most excited to work on?", "ja": "一番楽しみにしている仕事は何？"}, {"w": "me", "r": "formal", "en": "Honestly, I'm excited to see my work used by real users.", "ja": "正直なところ、自分の仕事が実際のユーザーに使われるのが楽しみです。"}, {"w": "raj", "r": "formal", "en": "Great answer. Welcome aboard!", "ja": "いい答えですね。ようこそ！"}]}, {"id": "c3s2", "bg": "meeting", "title": "担当部分を説明する", "place": "会社・ミーティングルーム", "intro": "設計レビュー。チーム全員の前で、自分が担当した部分の設計を説明する。「まず・次に・理由は」と順番を示しながら話そう。", "outro": "分からないことを「まだ分かりません。調べて共有します」と言えたのも、立派な答えだった。", "lines": [{"w": "raj", "r": "formal", "en": "Next up is the feature pipeline. Go ahead whenever you're ready.", "ja": "次は特徴量パイプラインです。準備ができたらどうぞ。"}, {"w": "slide", "r": "written", "en": "Goal: finish the daily pipeline within one hour, for under fifty dollars per run.", "ja": "（スライド）目標：日次パイプラインを1時間以内、1回50ドル未満で完了させる。"}, {"w": "me", "r": "formal", "en": "Thanks. I'll walk you through the part I'm responsible for.", "ja": "ありがとうございます。私が担当している部分を順に説明します。"}, {"w": "me", "r": "formal", "en": "First, we collect user clicks and store them in a daily table.", "ja": "まず、ユーザーのクリックを集めて、日ごとのテーブルに保存します。"}, {"w": "me", "r": "formal", "en": "Then, a batch job computes features for each query every night.", "ja": "次に、バッチ処理が毎晩、クエリごとに特徴量を計算します。"}, {"w": "me", "r": "formal", "en": "The main reason for using batch processing is to keep the cost low.", "ja": "バッチ処理を使う主な理由は、コストを低く抑えるためです。"}, {"w": "dana", "r": "formal", "en": "What happens if the batch job fails overnight?", "ja": "夜中にバッチ処理が失敗したらどうなるの？"}, {"w": "me", "r": "formal", "en": "In that case, the model falls back to yesterday's features, and we get an alert.", "ja": "その場合は、モデルは前日の特徴量で動き、私たちにアラートが届きます。"}, {"w": "raj", "r": "formal", "en": "Have you estimated how fresh the features need to be?", "ja": "特徴量をどのくらい新しく保つ必要があるか、見積もりましたか？"}, {"w": "me", "r": "formal", "en": "Not precisely yet. I'll run an experiment and share the numbers next week.", "ja": "まだ正確には出していません。実験して、来週数字を共有します。"}]}, {"id": "c3s3", "bg": "night", "title": "障害対応", "place": "会社・夜のオフィス", "intro": "木曜の夜、「検索結果がおかしい」という報告が入った。慌てずに、分かっていること・分からないこと・次にやることを報告しよう。", "outro": "まず元に戻す、原因はそのあと。落ち着いて報告できた夜だった。", "lines": [{"w": "raj", "r": "formal", "en": "We're getting reports that search results look strange. What do we know so far?", "ja": "検索結果がおかしいという報告が来ています。今わかっていることは？"}, {"w": "me", "r": "formal", "en": "The problem started around eight p.m., right after the new model was deployed.", "ja": "問題は夜8時ごろ、新しいモデルがデプロイされた直後に始まりました。"}, {"w": "me", "r": "formal", "en": "Latency is normal, but the click rate has dropped by about forty percent.", "ja": "レイテンシは正常ですが、クリック率が約40%下がっています。"}, {"w": "raj", "r": "formal", "en": "Do we know the cause?", "ja": "原因は分かっていますか？"}, {"w": "me", "r": "formal", "en": "Not yet. My best guess is that a feature is missing in production.", "ja": "まだです。一番可能性が高いのは、本番環境である特徴量が欠けていることだと思います。"}, {"w": "dana", "r": "casual", "en": "Should we roll back first and investigate after?", "ja": "先にロールバックして、調査はそのあとにする？"}, {"w": "me", "r": "formal", "en": "I agree. Rolling back is safe, and it should take about ten minutes.", "ja": "賛成です。ロールバックは安全で、10分ほどで済むはずです。"}, {"w": "raj", "r": "formal", "en": "Okay, go ahead. Please post an update in the incident channel every thirty minutes.", "ja": "わかりました、進めてください。障害対応チャンネルに30分ごとに状況を投稿してください。"}, {"w": "me", "r": "written", "en": "Update: rollback completed at eight fifty. Click rate is back to normal. Investigating the root cause.", "ja": "（チャット）状況報告：8時50分にロールバック完了。クリック率は正常に戻りました。根本原因を調査中です。"}, {"w": "raj", "r": "casual", "en": "Nice work staying calm. Go get some rest.", "ja": "落ち着いて対応できてたね。ゆっくり休んで。"}]}, {"id": "c3s4", "bg": "meeting", "title": "振り返り会", "place": "会社・ミーティングルーム", "intro": "障害の翌週。誰かを責めるためではなく、仕組みを良くするための振り返り会。報告書の英語（書き言葉）と、会議での言い換え（話し言葉）を比べてみよう。", "outro": "「人ではなく仕組みの問題」。その一言で、会議の空気がやわらかくなった。", "lines": [{"w": "me", "r": "written", "en": "Summary: a missing feature caused a forty percent drop in clicks for fifty minutes.", "ja": "（報告書）概要：特徴量の欠落により、50分間クリック数が40%減少した。"}, {"w": "me", "r": "written", "en": "Root cause: the feature name was changed in training but not in production.", "ja": "（報告書）根本原因：特徴量の名前が、訓練環境では変更されたが、本番環境では変更されていなかった。"}, {"w": "me", "r": "formal", "en": "To put it simply, the two systems were using different names for the same thing.", "ja": "簡単に言うと、2つのシステムが同じものに別々の名前を使っていたんです。"}, {"w": "raj", "r": "formal", "en": "How can we make sure this doesn't happen again?", "ja": "これが二度と起きないようにするには、どうすればいいでしょう？"}, {"w": "me", "r": "formal", "en": "I'd suggest adding a check that compares training and production features before each deployment.", "ja": "デプロイの前に毎回、訓練環境と本番環境の特徴量を比較するチェックを追加することを提案します。"}, {"w": "dana", "r": "casual", "en": "Love that. Could we also add an alert on the click rate?", "ja": "それいいね。クリック率にもアラートを付けられる？"}, {"w": "me", "r": "formal", "en": "Good idea. I'll take the deployment check, if someone can own the alert.", "ja": "いい考えですね。デプロイ前のチェックは私がやるので、アラートは誰かに担当してもらえますか。"}, {"w": "tom", "r": "casual", "en": "I'll take the alert. I've set one up before.", "ja": "アラートは僕がやるよ。前に設定したことがあるから。"}, {"w": "raj", "r": "formal", "en": "Thank you both. And to be clear, this was a process problem, not a people problem.", "ja": "二人ともありがとう。それと、はっきりさせておくと、これは人ではなく仕組みの問題です。"}]}, {"id": "c3s6", "bg": "office", "title": "当番の引き継ぎ", "place": "会社・オフィス", "intro": "今週はあなたが障害対応の当番（オンコール）。前の当番の Tom から引き継ぎを受ける。気になる点は、その場で確認しておこう。", "outro": "引き継ぎでは「気になっていること」と「困ったときの連絡先」を必ず聞く。", "lines": [{"w": "tom", "r": "casual", "en": "Okay, I'm handing off on-call to you. It was a pretty quiet week.", "ja": "じゃあ、当番を引き継ぐね。けっこう静かな1週間だったよ。"}, {"w": "me", "r": "formal", "en": "Good to hear. Were there any alerts I should know about?", "ja": "よかったです。知っておくべきアラートはありましたか？"}, {"w": "tom", "r": "casual", "en": "Just one. The disk on the training server almost filled up on Tuesday.", "ja": "一つだけ。火曜に、訓練サーバーのディスクがほぼいっぱいになった。"}, {"w": "me", "r": "formal", "en": "What did you do about it?", "ja": "それにはどう対応しましたか？"}, {"w": "tom", "r": "casual", "en": "I deleted some old checkpoints, but it'll probably fill up again in a few weeks.", "ja": "古いチェックポイントをいくつか消したけど、たぶん数週間でまたいっぱいになる。"}, {"w": "me", "r": "formal", "en": "Got it. Should I open a ticket so we can fix it properly?", "ja": "わかりました。きちんと直すために、チケットを作っておきましょうか？"}, {"w": "tom", "r": "casual", "en": "That'd be great. Also, the nightly job sometimes runs late on Mondays.", "ja": "それは助かる。あと、夜間の処理が月曜はときどき遅れるんだ。"}, {"w": "me", "r": "formal", "en": "Is that expected, or should I investigate if it happens?", "ja": "それは想定内ですか？ それとも、起きたら調べたほうがいいですか？"}, {"w": "tom", "r": "casual", "en": "It's expected. Only worry if it's more than two hours late.", "ja": "想定内。2時間以上遅れたときだけ気にして。"}, {"w": "me", "r": "formal", "en": "Okay. And who should I call if something serious happens at night?", "ja": "わかりました。夜に深刻なことが起きたら、誰に連絡すればいいですか？"}, {"w": "tom", "r": "casual", "en": "Call Dana first. Her number's in the on-call doc. Good luck!", "ja": "まず Dana に電話して。番号は当番用の文書にあるよ。がんばって！"}]}, {"id": "c3s7", "bg": "meeting", "title": "あいまいな依頼を確認する", "place": "会社・ミーティングルーム", "intro": "PM の Lena から「検索をもっと賢くしてほしい」という依頼が来た。そのままでは作れない。目的・対象・成功の基準を質問して、はっきりさせよう。", "outro": "あいまいな依頼は、質問で形にする。作り始める前の10分が、何週間も節約してくれる。", "lines": [{"w": "lena", "r": "formal", "en": "We'd like the search to be smarter. Can your team work on that?", "ja": "検索をもっと賢くしたいんです。あなたのチームで取り組めますか？"}, {"w": "me", "r": "formal", "en": "Sure. Before we start, could I ask a few questions to make sure I understand?", "ja": "はい。始める前に、理解を確かめるためにいくつか質問してもいいですか？"}, {"w": "lena", "r": "casual", "en": "Of course, go ahead.", "ja": "もちろん、どうぞ。"}, {"w": "me", "r": "formal", "en": "When you say smarter, what problem are users running into right now?", "ja": "「賢く」というのは、今ユーザーがどんな問題にぶつかっているということですか？"}, {"w": "lena", "r": "formal", "en": "They often type questions, like how to reset a password, and get unrelated results.", "ja": "パスワードの再設定方法のような質問文を入力すると、関係のない結果が出ることが多いんです。"}, {"w": "me", "r": "formal", "en": "I see. So the main issue is with questions, not short keywords?", "ja": "なるほど。では、主な問題は短いキーワードではなく、質問文のほうなんですね？"}, {"w": "lena", "r": "formal", "en": "Exactly. Keyword search works fine.", "ja": "その通りです。キーワード検索は問題ありません。"}, {"w": "me", "r": "formal", "en": "How will we know if it's better? Is there a number you'd like to improve?", "ja": "良くなったかどうかは、どうやって判断しますか？ 改善したい数字はありますか？"}, {"w": "lena", "r": "formal", "en": "We'd like fewer people to contact support after searching.", "ja": "検索したあとにサポートへ問い合わせる人を減らしたいです。"}, {"w": "me", "r": "written", "en": "Goal: improve results for question-style searches. Success metric: fewer support contacts after search.", "ja": "（メモ）目標：質問文の検索結果を改善する。成功の指標：検索後のサポートへの問い合わせ数の減少。"}, {"w": "lena", "r": "casual", "en": "That's exactly it. Thanks for clarifying!", "ja": "まさにそれです。はっきりさせてくれてありがとう！"}]}, {"id": "c3s8", "bg": "meeting", "title": "A/Bテストの結果を読む", "place": "会社・ミーティングルーム", "intro": "新しいランキングの A/B テストが終わった。数字は少し良くなっているけれど、本当に意味のある差だろうか。言いすぎず、正確に伝えよう。", "outro": "「良くなったように見える」と「良くなった」は違う。その違いを言葉で伝えられるのが、エンジニアの強み。", "lines": [{"w": "dana", "r": "casual", "en": "So, how did the A/B test go?", "ja": "で、A/B テストはどうだった？"}, {"w": "me", "r": "formal", "en": "The new version had a slightly higher click rate, about one percent higher.", "ja": "新しい版のほうが、クリック率がわずかに高く、約1%の上昇でした。"}, {"w": "dana", "r": "casual", "en": "Nice! Is that statistically significant?", "ja": "いいね！ それは統計的に有意？"}, {"w": "me", "r": "formal", "en": "Not quite. With the current sample size, the difference could just be noise.", "ja": "まだです。今のサンプル数だと、その差はただのばらつきかもしれません。"}, {"w": "dana", "r": "casual", "en": "Hmm. How long would we need to run it to get a reliable answer?", "ja": "うーん。確かめるには、どのくらい続ける必要がある？"}, {"w": "me", "r": "formal", "en": "About two more weeks, based on my calculation.", "ja": "私の計算では、あと2週間ほどです。"}, {"w": "raj", "r": "formal", "en": "Did anything get worse in the new version?", "ja": "新しい版で、悪くなったものはありますか？"}, {"w": "me", "r": "formal", "en": "Page load time went up a little, but it's still within our target.", "ja": "ページの読み込み時間が少し増えましたが、まだ目標の範囲内です。"}, {"w": "raj", "r": "formal", "en": "Okay. Let's keep the test running and decide in two weeks.", "ja": "わかりました。テストは続けて、2週間後に判断しましょう。"}, {"w": "me", "r": "written", "en": "A/B test update: click rate up about one percent, not yet significant. Extending the test by two weeks.", "ja": "（チャット）A/B テストの状況：クリック率は1%増、まだ有意ではない。テストを2週間延長します。"}]}, {"id": "c3s9", "bg": "office", "title": "コードレビューをする側", "place": "会社・オフィス", "intro": "今度はあなたが Tom のコードをレビューする。気になる点は、命令ではなく質問や提案の形で伝えると、角が立たない。", "outro": "「なぜ？」と聞くより「〜はどうかな？」と提案する。それだけで、レビューは会話になる。", "lines": [{"w": "tom", "r": "casual", "en": "Hey, could you review my PR when you have a moment?", "ja": "ねえ、時間があるときに僕のプルリクエストを見てもらえる？"}, {"w": "me", "r": "casual", "en": "Sure, I'll take a look this afternoon.", "ja": "いいよ、今日の午後に見るね。"}, {"w": "me", "r": "written", "en": "Looks great overall! I left a few small suggestions.", "ja": "（コメント）全体的にとてもいいです！ 小さな提案をいくつか残しました。"}, {"w": "me", "r": "written", "en": "Nit: this variable could have a more descriptive name.", "ja": "（コメント）細かい点：この変数は、もっと内容が分かる名前にできそうです。"}, {"w": "me", "r": "written", "en": "Question: what happens if the input list is empty here?", "ja": "（コメント）質問：ここで入力のリストが空だったら、どうなりますか？"}, {"w": "tom", "r": "casual", "en": "Oh, good catch. It would crash. I'll add a check.", "ja": "あ、いい指摘。落ちるね。チェックを足すよ。"}, {"w": "me", "r": "casual", "en": "Also, I wonder if we could reuse the function Dana wrote last month.", "ja": "それと、Dana が先月書いた関数を使い回せないかなと思って。"}, {"w": "tom", "r": "casual", "en": "I didn't know about that. Where is it?", "ja": "それ知らなかった。どこにある？"}, {"w": "me", "r": "casual", "en": "It's in the utils folder. It does almost the same thing.", "ja": "utils フォルダにあるよ。ほとんど同じことをしてくれる。"}, {"w": "tom", "r": "casual", "en": "Awesome, that'll save a lot of code. Thanks for the review!", "ja": "すごい、コードがかなり減らせる。レビューありがとう！"}]}, {"id": "c3s5", "bg": "party", "title": "社外の勉強会・懇親会", "place": "AI勉強会・懇親会場", "intro": "社外の AI 勉強会に参加した。発表のあとは軽食つきの懇親会。初対面の人にも、自分の仕事を分かりやすく説明しよう。会場には、見覚えのある紫のめがねが……。", "outro": "「要するに」と一言で言い換えると、専門外の人にも仕事が伝わる。", "boss": {"title": "45秒で自分の仕事を説明", "prompt": "エンジニアではない人にも分かるように、自分の仕事（または目指している仕事）を45秒で説明してみよう。専門用語を一つ使ったら、すぐ言い換えるのがコツ。", "hints": ["I work on ___. Basically, ___.", "In other words, ___.", "For example, when you ___, we ___.", "The hard part is ___.", "What about you? What do you do?"], "sec": 45}, "lines": [{"w": "priya", "r": "casual", "en": "Wait, is that you? It's been ages!", "ja": "あれ、もしかして？ すごく久しぶり！"}, {"w": "me", "r": "casual", "en": "Priya! I didn't know you'd be here. How have you been?", "ja": "プリヤさん！ 来てるとは知らなかったです。お元気でしたか？"}, {"w": "priya", "r": "casual", "en": "Busy, but good. I finished my PhD and joined a medical AI startup.", "ja": "忙しいけど元気。博士号を取って、医療 AI のスタートアップに入ったの。"}, {"w": "me", "r": "casual", "en": "Congratulations! That sounds exciting.", "ja": "おめでとうございます！ わくわくする仕事ですね。"}, {"w": "priya", "r": "casual", "en": "Thanks! So, what are you working on these days?", "ja": "ありがとう！ それで、最近は何をしているの？"}, {"w": "me", "r": "casual", "en": "I work on search ranking. Basically, I decide which results show up first.", "ja": "検索ランキングをやっています。要するに、どの結果を上に出すかを決める仕事です。"}, {"w": "priya", "r": "casual", "en": "Oh, nice. How do you know if a change actually helps?", "ja": "へえ、いいね。変更が本当に役に立ったかは、どうやって分かるの？"}, {"w": "me", "r": "casual", "en": "We run A/B tests. Half the users see the new version, and we compare clicks.", "ja": "A/B テストをします。半分のユーザーに新しい版を見せて、クリック数を比べるんです。"}, {"w": "priya", "r": "casual", "en": "Makes sense. Hey, let me introduce you to my coworker. She's into search too.", "ja": "なるほど。ねえ、同僚を紹介させて。彼女も検索に興味があるの。"}, {"w": "me", "r": "casual", "en": "I'd love that. Thanks, Priya.", "ja": "ぜひお願いします。ありがとう、プリヤさん。"}]}, {"id": "c3t1", "kind": "talk", "bg": "office", "title": "入社オリエンテーション", "place": "会社・オフィス", "intro": "入社初日の午後。メンターの Dana が、社内のシステムとルールを一気に説明してくれる。全部覚えなくていい。大事な点を聞き取ろう。", "outro": "社内ルールの説明は、「絶対にしてはいけないこと」を聞き逃さないのが一番大事。", "quiz": [{"q": "本番環境のデータベースについてのルールは？", "c": ["誰でも自由に書き換えてよい", "直接変更してはいけない", "金曜だけ変更してよい", "Dana に毎回電話する"], "a": 1}, {"q": "デプロイしてはいけないのは？", "c": ["月曜の朝", "金曜の午後", "毎日の昼休み", "雨の日"], "a": 1}, {"q": "最初の1週間の目標は？", "c": ["大きな機能を1つ作る", "小さな修正を1つ出す", "全部のコードを読む", "資格試験に受かる"], "a": 1}], "lines": [{"w": "dana", "r": "casual", "en": "Welcome to the team! Let me give you a quick tour of how we work.", "ja": "チームへようこそ！ 私たちの仕事の進め方を、ざっと案内するね。"}, {"w": "dana", "r": "casual", "en": "All our code lives in one big repository, and every change goes through code review.", "ja": "コードは全部一つの大きなリポジトリにあって、どの変更もコードレビューを通すの。"}, {"w": "dana", "r": "casual", "en": "Even small changes. Even mine. No exceptions.", "ja": "小さな変更でも。私の変更でも。例外なし。"}, {"w": "dana", "r": "casual", "en": "For experiments, use the shared GPU cluster. Just tag your jobs with your team name.", "ja": "実験には共有の GPU クラスターを使ってね。ジョブにはチーム名のタグを付けて。"}, {"w": "dana", "r": "casual", "en": "Now, the most important rule. Never change the production database directly.", "ja": "さて、一番大事なルール。本番のデータベースは、絶対に直接変更しないこと。"}, {"w": "dana", "r": "casual", "en": "If you need to fix data, write a script, get it reviewed, and run it with someone watching.", "ja": "データを直す必要があるときは、スクリプトを書いて、レビューを受けて、誰かに見てもらいながら実行して。"}, {"w": "dana", "r": "casual", "en": "Also, we don't deploy on Friday afternoons. Nobody wants to fix things over the weekend.", "ja": "それと、金曜の午後はデプロイしないの。週末に障害対応したい人はいないからね。"}, {"w": "dana", "r": "casual", "en": "For questions, the team channel is the best place. Please ask in public, not in private messages.", "ja": "質問はチームのチャンネルが一番。個人宛てのメッセージじゃなくて、みんなの前で聞いてね。"}, {"w": "dana", "r": "casual", "en": "That way, the next new person can find the answer too.", "ja": "そうすれば、次に入ってくる人も答えを見つけられるから。"}, {"w": "dana", "r": "casual", "en": "Your goal for the first week is simple: ship one small fix.", "ja": "最初の1週間の目標はシンプル。小さな修正を一つ出すこと。"}, {"w": "dana", "r": "casual", "en": "It doesn't matter how small. It's about learning the process. Any questions?", "ja": "どんなに小さくてもいいの。流れを覚えるのが目的だから。質問はある？"}]}, {"id": "c3t2", "kind": "talk", "bg": "hall", "title": "勉強会の発表：評価指標の選び方", "place": "AI勉強会・会場", "intro": "社外の勉強会で、Priya が「評価指標の選び方」について発表している。具体例に注目しながら聞こう。", "outro": "正解率だけを見ていると、大事なものを見落とす。何を間違えると困るのかから、指標を選ぼう。", "quiz": [{"q": "病気の検査の例で、正解率99%のモデルは何をしていた？", "c": ["全員を「病気あり」と判定していた", "全員を「病気なし」と判定していた", "半分を当てずっぽうにしていた", "医師に確認していた"], "a": 1}, {"q": "見逃しが一番困る場面で重視するのは？", "c": ["速さ", "再現率（見逃しの少なさ）", "モデルの大きさ", "正解率だけ"], "a": 1}, {"q": "Priya の一番のアドバイスは？", "c": ["必ず正解率を使う", "指標を決める前に、どんな間違いが一番困るかを考える", "指標はたくさん使うほどよい", "指標は上司に決めてもらう"], "a": 1}], "lines": [{"w": "priya", "r": "formal", "en": "Hi everyone. Today I want to talk about a simple question: how do you know your model is good?", "ja": "皆さん、こんにちは。今日は、シンプルな問いについて話したいと思います。モデルが良いかどうかは、どうやって分かるのでしょう？"}, {"w": "priya", "r": "formal", "en": "Most people start with accuracy, and that's fine for many tasks.", "ja": "多くの人は正解率から見始めますし、多くのタスクではそれで問題ありません。"}, {"w": "priya", "r": "formal", "en": "But let me give you an example from my work in medical AI.", "ja": "でも、私の医療 AI の仕事から、一つ例を挙げさせてください。"}, {"w": "priya", "r": "formal", "en": "Imagine a test for a rare disease that only one in a hundred people has.", "ja": "百人に一人しかかからない、珍しい病気の検査を想像してください。"}, {"w": "priya", "r": "formal", "en": "A model that says nobody has the disease will be ninety-nine percent accurate.", "ja": "「誰も病気ではない」と答えるだけのモデルでも、正解率は99%になります。"}, {"w": "priya", "r": "formal", "en": "And it's completely useless, because it misses every single patient.", "ja": "そして、まったく役に立ちません。患者を一人残らず見逃しているからです。"}, {"w": "priya", "r": "formal", "en": "In cases like this, we care much more about recall, which means what share of the real cases we catch.", "ja": "こういう場合には、再現率、つまり本当の患者のうちどれだけの割合を見つけられるかのほうが、ずっと大事です。"}, {"w": "priya", "r": "formal", "en": "On the other hand, for a spam filter, you don't want to block important emails by mistake.", "ja": "一方で、迷惑メールのフィルターなら、大事なメールを間違えてブロックしたくはありません。"}, {"w": "priya", "r": "formal", "en": "So there, precision matters more.", "ja": "なので、そこでは適合率のほうが大事になります。"}, {"w": "priya", "r": "formal", "en": "My main advice is this: before you choose a metric, ask which mistake would hurt the most.", "ja": "私の一番のアドバイスはこれです。指標を選ぶ前に、どの間違いが一番困るのかを考えてください。"}, {"w": "priya", "r": "formal", "en": "Then pick the number that tracks that mistake. Thank you!", "ja": "そして、その間違いを追える数字を選んでください。ありがとうございました！"}]}, {"id": "c3x1", "kind": "side", "bg": "bank", "title": "歯医者の予約", "place": "歯科医院（電話）", "intro": "奥歯が少し痛む。歯医者に電話して予約をとろう。症状と、都合のいい日時を伝える練習。", "outro": "予約の電話は、症状・希望の日時・名前の3点セット。", "lines": [{"w": "staff", "r": "formal", "en": "Bright Smile Dental, this is Amy. How can I help you?", "ja": "ブライトスマイル歯科のエイミーです。どうされましたか？"}, {"w": "me", "r": "formal", "en": "Hi, I'd like to make an appointment. One of my back teeth has been hurting.", "ja": "もしもし、予約をしたいです。奥歯の一本が痛むんです。"}, {"w": "staff", "r": "formal", "en": "I'm sorry to hear that. How long has it been bothering you?", "ja": "それはおつらいですね。いつから気になっていますか？"}, {"w": "me", "r": "formal", "en": "For about three days. It hurts when I drink something cold.", "ja": "3日ほど前からです。冷たいものを飲むと痛みます。"}, {"w": "staff", "r": "formal", "en": "Okay. Are you a new patient with us?", "ja": "わかりました。当院は初めてですか？"}, {"w": "me", "r": "formal", "en": "Yes, I am. I have dental insurance through my company.", "ja": "はい、初めてです。会社の歯科保険に入っています。"}, {"w": "staff", "r": "formal", "en": "Great. We have an opening on Thursday at four, or Friday at ten.", "ja": "かしこまりました。木曜の4時か、金曜の10時が空いています。"}, {"w": "me", "r": "formal", "en": "Thursday at four works for me.", "ja": "木曜の4時でお願いします。"}, {"w": "staff", "r": "formal", "en": "Perfect. Could I have your name and date of birth?", "ja": "かしこまりました。お名前と生年月日をうかがえますか？"}, {"w": "me", "r": "formal", "en": "Sure. And should I arrive about fifteen minutes early?", "ja": "はい。（名前と生年月日を伝えたあと）それと、15分ほど早めに行ったほうがいいですか？"}, {"w": "staff", "r": "formal", "en": "Yes, please. We'll need you to fill out some forms. See you Thursday!", "ja": "はい、お願いします。いくつか書類を書いていただきます。では木曜に！"}]}, {"id": "c3x2", "kind": "side", "bg": "office", "title": "同僚の誕生日を祝う", "place": "会社・オフィス", "intro": "今日は Dana の誕生日。Tom と一緒に、こっそりケーキを用意した。お祝いの言葉と、ちょっとした雑談を楽しもう。", "outro": "お祝いの一言は、短くても気持ちが伝わる。", "lines": [{"w": "tom", "r": "casual", "en": "Okay, she's coming. Everyone, get ready!", "ja": "よし、来るよ。みんな、準備して！"}, {"w": "me", "r": "casual", "en": "Surprise! Happy birthday, Dana!", "ja": "サプライズ！ お誕生日おめでとう、Dana！"}, {"w": "dana", "r": "casual", "en": "Oh my gosh, you guys! How did you even know?", "ja": "うそ、みんな！ どうして知ってたの？"}, {"w": "tom", "r": "casual", "en": "We have our ways. Make a wish and blow out the candles!", "ja": "いろいろ手があるのさ。お願いごとをして、ろうそくを吹き消して！"}, {"w": "me", "r": "casual", "en": "We got your favorite, chocolate with raspberries.", "ja": "好きなのを買ってきたよ。ラズベリーのチョコケーキ。"}, {"w": "dana", "r": "casual", "en": "This is so sweet. Thank you, really.", "ja": "本当にうれしい。ありがとう、心から。"}, {"w": "me", "r": "casual", "en": "Thank you for everything you've taught me. I wouldn't be here without you.", "ja": "いろいろ教えてくれてありがとう。あなたがいなかったら、今の私はいないよ。"}, {"w": "dana", "r": "casual", "en": "Stop it, you'll make me cry. Okay, who wants the first piece?", "ja": "やめて、泣いちゃうから。さて、最初の一切れは誰？"}, {"w": "tom", "r": "casual", "en": "Me, obviously. I picked the cake.", "ja": "もちろん僕。ケーキを選んだのは僕だから。"}]}, {"id": "c3x3", "kind": "side", "bg": "bank", "title": "ジムに入会する", "place": "近所のスポーツジム", "intro": "座りっぱなしの毎日で、体がなまってきた。近所のジムで料金や契約の条件を確かめてから、入会しよう。", "outro": "契約の前には「解約はいつでもできますか？」。どの国でも大事な質問。", "lines": [{"w": "staff", "r": "casual", "en": "Hi, welcome! Are you interested in a membership?", "ja": "こんにちは、ようこそ！ 入会をご検討ですか？"}, {"w": "me", "r": "casual", "en": "Yes. Could you tell me about the monthly plans?", "ja": "はい。月額のプランについて教えてもらえますか？"}, {"w": "staff", "r": "casual", "en": "Sure. The basic plan is forty dollars a month, and it includes all the machines.", "ja": "もちろん。基本プランは月40ドルで、すべてのマシンが使えます。"}, {"w": "me", "r": "casual", "en": "Does that include the group classes, like yoga?", "ja": "ヨガみたいなグループレッスンも含まれますか？"}, {"w": "staff", "r": "casual", "en": "Those are in the premium plan, which is sixty a month.", "ja": "それはプレミアムプランで、月60ドルです。"}, {"w": "me", "r": "formal", "en": "I see. Is there a contract, or can I cancel anytime?", "ja": "なるほど。契約期間はありますか？ それとも、いつでも解約できますか？"}, {"w": "staff", "r": "casual", "en": "You can cancel anytime with thirty days' notice.", "ja": "30日前に知らせてもらえれば、いつでも解約できます。"}, {"w": "me", "r": "casual", "en": "Great. Can I try it out before I sign up?", "ja": "いいですね。入会する前に試せますか？"}, {"w": "staff", "r": "casual", "en": "Absolutely. Here's a free day pass. Enjoy your workout!", "ja": "もちろんです。無料の1日パスをどうぞ。トレーニングを楽しんでください！"}]}]},
  {"id": 4, "title": "第4章 ミドルエンジニア編", "rank": "ミドルエンジニア", "scenes": [{"id": "c4s1", "bg": "meeting", "title": "設計の議論", "place": "会社・ミーティングルーム", "intro": "新機能に、大規模言語モデルの API を使うか、小さなモデルを自分たちで学習するか。チームの意見が分かれている。トレードオフを整理して話そう。", "outro": "どちらかを選ぶのではなく、順番を決める。議論が前に進む答えだった。", "lines": [{"w": "raj", "r": "formal", "en": "We need to decide on an approach today. Let's hear both options.", "ja": "今日は方針を決める必要があります。両方の案を聞きましょう。"}, {"w": "dana", "r": "formal", "en": "I think we should call a large language model through an API. It's fast to build.", "ja": "API で大規模言語モデルを呼ぶべきだと思う。作るのが速いから。"}, {"w": "me", "r": "formal", "en": "That's a fair point. Let me lay out the trade-offs as I see them.", "ja": "もっともな意見です。私から見たトレードオフを整理させてください。"}, {"w": "me", "r": "formal", "en": "The API option is faster to launch, but the cost grows with every request.", "ja": "API の案は早く出せますが、リクエストごとにコストが増えます。"}, {"w": "me", "r": "formal", "en": "A smaller in-house model takes longer to build, but it's cheaper at scale.", "ja": "自前の小さいモデルは作るのに時間がかかりますが、規模が大きくなると安くなります。"}, {"w": "raj", "r": "formal", "en": "How much traffic are we expecting?", "ja": "どのくらいのトラフィックを見込んでいますか？"}, {"w": "me", "r": "formal", "en": "About two million requests a day at launch, and possibly ten times that within a year.", "ja": "開始時に1日約200万リクエスト、1年以内にその10倍になる可能性があります。"}, {"w": "dana", "r": "casual", "en": "Hmm, at that scale, the API bill would get scary.", "ja": "うーん、その規模だと API の請求額が怖くなるね。"}, {"w": "me", "r": "formal", "en": "What if we start with the API and collect data to train our own model later?", "ja": "まず API で始めて、あとで自分たちのモデルを訓練するためのデータを集める、というのはどうでしょう？"}, {"w": "raj", "r": "formal", "en": "I like that. Let's write it up as a two-phase plan.", "ja": "いいですね。2段階の計画としてまとめましょう。"}]}, {"id": "c4s2", "bg": "meeting", "title": "反対意見を丁寧に言う", "place": "会社・ミーティングルーム", "intro": "PM の Lena が、来週のリリースを提案してきた。でも評価はまだ足りない。相手の目的を認めつつ、懸念と代わりの案をはっきり伝えよう。", "outro": "「分かります。ただ…」と受け止めてから話すと、反対意見でも相手に届く。", "lines": [{"w": "lena", "r": "formal", "en": "I'd like to launch the new ranking model next week. The sales team is really excited.", "ja": "新しいランキングモデルを来週リリースしたいです。営業チームがとても期待していて。"}, {"w": "me", "r": "formal", "en": "I understand why next week is appealing, and I want this out soon too.", "ja": "来週がいい理由は分かりますし、私も早く出したいと思っています。"}, {"w": "me", "r": "formal", "en": "But I'm a bit concerned. We've only tested it on English queries.", "ja": "ただ、少し心配です。英語のクエリでしかテストしていないんです。"}, {"w": "lena", "r": "formal", "en": "How big is the risk, realistically?", "ja": "現実的に、リスクはどのくらい大きいですか？"}, {"w": "me", "r": "formal", "en": "About thirty percent of our users search in other languages, so the impact could be large.", "ja": "ユーザーの約3割は他の言語で検索するので、影響が大きくなる可能性があります。"}, {"w": "lena", "r": "casual", "en": "Okay, that's more than I thought. What would you suggest?", "ja": "なるほど、思っていたより多いですね。どうするのがいいと思いますか？"}, {"w": "me", "r": "formal", "en": "We could launch for English users next week and add other languages two weeks later.", "ja": "来週は英語のユーザー向けに出して、他の言語は2週間後に追加する、という形はどうでしょう。"}, {"w": "lena", "r": "formal", "en": "That works for me. Could you put the risks in writing so I can share them?", "ja": "それで大丈夫です。共有できるように、リスクを文章にまとめてもらえますか？"}, {"w": "me", "r": "written", "en": "Risk: ranking quality for non-English queries has not been evaluated. Mitigation: a staged rollout by language.", "ja": "（文書）リスク：英語以外のクエリでのランキング品質は未評価。対策：言語ごとの段階的なリリース。"}, {"w": "lena", "r": "casual", "en": "Perfect. Thanks for pushing back. That was really helpful.", "ja": "完璧です。反対意見を言ってくれてありがとう。とても助かりました。"}]}, {"id": "c4s3", "bg": "office", "title": "見積もりと優先順位", "place": "会社・オフィス", "intro": "Lena から追加の依頼が3つ届いた。全部は無理だ。見積もりを正直に伝えて、どれを先にやるか一緒に決めよう。", "outro": "「できません」ではなく「これならできます」。断り方ひとつで、相手は味方になる。", "lines": [{"w": "lena", "r": "formal", "en": "I have three more requests. Can your team handle all of them this quarter?", "ja": "あと3つ依頼があります。今四半期で、あなたのチームで全部対応できますか？"}, {"w": "me", "r": "formal", "en": "Let me be honest. We can realistically only finish two of them this quarter.", "ja": "正直に言わせてください。現実的には、今四半期にできるのは2つです。"}, {"w": "me", "r": "formal", "en": "The first one is small, about three days. The other two will take a few weeks each.", "ja": "1つ目は小さくて3日ほどです。残りの2つは、それぞれ数週間かかります。"}, {"w": "lena", "r": "formal", "en": "Which one would you drop?", "ja": "どれを外しますか？"}, {"w": "me", "r": "formal", "en": "That depends on your priorities. Which one matters most to customers?", "ja": "それは優先順位次第です。顧客にとって一番大事なのはどれですか？"}, {"w": "lena", "r": "casual", "en": "Probably the spelling correction. People complain about it every week.", "ja": "たぶんスペル修正ですね。毎週苦情が来るので。"}, {"w": "me", "r": "formal", "en": "Then I'd suggest we do the spelling correction and the small fix, and move the third one to next quarter.", "ja": "それなら、スペル修正と小さな修正をやって、3つ目は次の四半期に回すのがいいと思います。"}, {"w": "lena", "r": "formal", "en": "Agreed. I'll let the stakeholders know.", "ja": "賛成です。関係者に伝えておきます。"}, {"w": "me", "r": "written", "en": "Plan for this quarter: the small UI fix first, then spelling correction. Synonym expansion moves to next quarter.", "ja": "（文書）今四半期の計画：まず UI の小さな修正、次にスペル修正。同義語の展開は次の四半期に延期。"}]}, {"id": "c4s4", "bg": "cafe", "title": "1on1でキャリア相談", "place": "会社・カフェスペース", "intro": "マネージャーの Raj との1on1。最近、自分はこのままでいいのか考えている。本音を、でも感じよく伝えよう。", "outro": "やりたいことは、言わないと伝わらない。言ってみたら、次の仕事がやってきた。", "lines": [{"w": "raj", "r": "casual", "en": "So, how are things going? Anything on your mind?", "ja": "さて、最近どう？ 何か気になっていることはある？"}, {"w": "me", "r": "casual", "en": "Actually, yes. I've been thinking about my career a lot lately.", "ja": "実はあります。最近、キャリアについてよく考えていて。"}, {"w": "me", "r": "formal", "en": "I enjoy building models, but I'd like to have more impact on technical decisions.", "ja": "モデルを作るのは楽しいのですが、技術的な判断にもっと関わりたいんです。"}, {"w": "raj", "r": "formal", "en": "That's great to hear. What kind of decisions do you have in mind?", "ja": "それはうれしいね。どんな判断を考えている？"}, {"w": "me", "r": "formal", "en": "For example, choosing the architecture for new projects, or reviewing other people's
