<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   ENGLISH ROAD ─ 留学生からAIエンジニアへ
   聞く → まねる → 書き取る → とっさに言う、を場面ごとにくり返す英語練習ゲーム
   ========================================================= */

/* ---------- 教材 ---------- */
// r: written=書き言葉 / formal=改まった話し言葉 / casual=くだけた話し言葉
const REG = {
  written: { label: '書き言葉', cls: 'rw' },
  formal:  { label: '改まった話し言葉', cls: 'rf' },
  casual:  { label: 'くだけた話し言葉', cls: 'rc' },
};
// acc: 使いたい英語音声の地域（端末にあれば使う）
const CHARS = {
  me:     { name: 'あなた', acc: [], pitch: 1 },
  priya:  { name: 'Priya（先輩）', acc: ['en-IN', 'en-GB'], pitch: 1.15 },
  miller: { name: 'Miller 先生', acc: ['en-US'], pitch: 0.85 },
  tom:    { name: 'Tom（同期）', acc: ['en-AU', 'en-GB'], pitch: 0.95 },
  wei:    { name: 'Wei（研究者）', acc: ['en-SG', 'en-GB', 'en-AU'], pitch: 1.05 },
  slide:  { name: 'スライド', acc: ['en-US'], pitch: 1 },
  dana:   { name: 'Dana（メンター）', acc: ['en-US'], pitch: 1.1 },
  raj:    { name: 'Raj（マネージャー）', acc: ['en-IN', 'en-GB'], pitch: 0.9 },
  lena:   { name: 'Lena（PM）', acc: ['en-GB'], pitch: 1.2 },
  sam:    { name: 'Sam（新人）', acc: ['en-AU', 'en-NZ'], pitch: 1.25 },
  alex:   { name: 'Alex（候補者）', acc: ['en-CA', 'en-US'], pitch: 1.0 },
};
const SOURCES = {
  wpOverfit: { title: 'Wikipedia「Overfitting」', url: 'https://en.wikipedia.org/wiki/Overfitting', lic: 'CC BY-SA 4.0' },
};

const CHAPTERS = [
  {
    id: 1, title: '第1章 留学生編', rank: '留学生',
    scenes: [
      {
        id: 'c1s1', title: '研究室の初日', place: '大学・研究室',
        intro: '9月。あなたは東京からアメリカの大学院に留学してきた。今日は研究室の初日。ドアを開けると、先輩らしき人が手を振っている。',
        outro: '研究室の場所もサーバーの使い方も分かった。なんとかやっていけそうだ。',
        lines: [
          { w: 'priya', r: 'casual', en: "Hey, you must be the new student. I'm Priya, a third-year PhD student here.", ja: 'やあ、新しく来た学生さんだよね。私はプリヤ、ここの博士課程3年生。' },
          { w: 'me', r: 'casual', en: 'Hi, nice to meet you. I just got here from Tokyo last week.', ja: 'こんにちは、はじめまして。先週東京から来たばかりです。' },
          { w: 'priya', r: 'casual', en: 'Welcome! How are you settling in so far?', ja: 'ようこそ！ こっちの生活にはもう慣れてきた？' },
          { w: 'me', r: 'casual', en: 'Pretty well, thanks. Still getting used to the time difference, though.', ja: 'おかげさまで順調です。時差にはまだ慣れていないですけど。' },
          { w: 'priya', r: 'casual', en: "That's totally normal. Let me show you around. This is your desk, and the GPU server is in the next room.", ja: 'それは普通だよ。案内するね。ここがあなたの机で、GPUサーバーは隣の部屋。' },
          { w: 'me', r: 'casual', en: 'Great. How do I get access to the server?', ja: 'いいですね。サーバーを使うにはどうすればいいですか？' },
          { w: 'priya', r: 'casual', en: 'Just send your username to Tom. He takes care of the accounts.', ja: 'トムにユーザー名を送ればいいよ。アカウントは彼が管理してるから。' },
          { w: 'me', r: 'casual', en: 'Got it. Thanks for showing me around.', ja: 'わかりました。案内してくれてありがとうございます。' },
        ],
      },
      {
        id: 'c1s2', title: '講義：過学習', place: '大学・講義室',
        intro: '最初の授業は機械学習の講義。スライドの英文（書き言葉）と、先生の説明（話し言葉）で、文の作りがどう違うかに注目しよう。',
        outro: '手を挙げて答えられた。スライドの硬い英語も、先生が言い換えると分かりやすい。',
        lines: [
          { w: 'miller', r: 'formal', en: "Today, we're going to talk about one of the most common problems in machine learning: overfitting.", ja: '今日は、機械学習でとてもよくある問題の一つ、過学習について話します。' },
          { w: 'slide', r: 'written', en: 'An overfitted model is a mathematical model that contains more parameters than can be justified by the data.', ja: '過学習したモデルとは、データから正当化できる以上のパラメータを含む数理モデルである。', src: 'wpOverfit' },
          { w: 'miller', r: 'formal', en: 'In other words, the model memorizes the training data instead of learning the general pattern.', ja: '言い換えると、モデルが一般的なパターンを学ぶ代わりに、訓練データを丸暗記してしまうのです。' },
          { w: 'miller', r: 'formal', en: "That's why it performs well on the training set but poorly on new data.", ja: 'だから訓練データではよい成績なのに、新しいデータではうまくいかないのです。' },
          { w: 'slide', r: 'written', en: 'Underfitting occurs when a mathematical model cannot adequately capture the underlying structure of the data.', ja: '過少適合は、数理モデルがデータの根底にある構造を十分に捉えられないときに起こる。', src: 'wpOverfit' },
          { w: 'miller', r: 'formal', en: 'So how do we know if our model is overfitting? Can anyone tell me?', ja: 'では、モデルが過学習しているかどうかは、どうすれば分かるでしょう？ 誰か答えられますか？' },
          { w: 'me', r: 'formal', en: 'We can compare the training loss with the validation loss.', ja: '訓練損失と検証損失を比べれば分かると思います。' },
          { w: 'miller', r: 'formal', en: "Exactly. If the gap keeps growing, that's a clear warning sign.", ja: 'その通り。その差が広がり続けるなら、はっきりした危険信号です。' },
        ],
      },
      {
        id: 'c1s3', title: 'オフィスアワー', place: '大学・教授室',
        intro: '講義の「正則化」の話が、いまいち腑に落ちない。まずはメールで面談をお願いして、先生のオフィスアワーに行ってみよう。',
        outro: '質問してよかった。分からないことを英語で聞けると、留学生活がぐっと楽になる。',
        lines: [
          { w: 'me', r: 'written', en: 'Dear Professor Miller, would it be possible to meet during your office hours this week?', ja: '（メール）ミラー先生、今週のオフィスアワーにお時間をいただくことは可能でしょうか。' },
          { w: 'me', r: 'formal', en: 'Excuse me, Professor Miller. Do you have a few minutes?', ja: 'すみません、ミラー先生。少しお時間よろしいですか？' },
          { w: 'miller', r: 'casual', en: 'Sure, come on in. What can I do for you?', ja: 'ええ、どうぞ入って。どうしました？' },
          { w: 'me', r: 'formal', en: "I had a question about today's lecture. I wasn't sure I understood regularization.", ja: '今日の講義について質問があります。正則化を理解できたか自信がなくて。' },
          { w: 'miller', r: 'casual', en: 'Okay. Which part was unclear?', ja: 'なるほど。どの部分が分かりにくかった？' },
          { w: 'me', r: 'formal', en: 'Why does adding a penalty term help the model generalize?', ja: 'なぜペナルティ項を加えると、モデルの汎化に役立つのでしょうか？' },
          { w: 'miller', r: 'formal', en: "Good question. The penalty discourages large weights, so the model can't fit every bit of noise.", ja: '良い質問です。ペナルティは大きな重みを抑えるので、モデルはノイズの細部にまで合わせられなくなるんです。' },
          { w: 'me', r: 'formal', en: "I see. So it's a trade-off between fitting the data and keeping the model simple.", ja: 'なるほど。データへの当てはまりと、モデルの単純さのトレードオフなんですね。' },
          { w: 'miller', r: 'casual', en: "That's exactly right. Try a few values in your homework and see what happens.", ja: 'まさにその通り。宿題でいくつか値を試して、どうなるか見てごらん。' },
          { w: 'me', r: 'formal', en: 'I will. Thank you for your time.', ja: 'そうします。お時間をいただきありがとうございました。' },
        ],
      },
      {
        id: 'c1s4', title: '研究室ミーティング', place: '大学・会議室',
        intro: '毎週の研究室ミーティング。今日はあなたが進捗を報告する番だ。指摘を受けたら、受け止めて次の行動を言おう。',
        outro: '指摘をもらって、次にやることがはっきりした。報告の型が少し身についてきた。',
        lines: [
          { w: 'miller', r: 'formal', en: "Let's get started. Could you give us a quick update on your project?", ja: '始めましょう。プロジェクトの進捗を手短に報告してもらえますか？' },
          { w: 'me', r: 'formal', en: 'Sure. This week, I reproduced the baseline results from the paper.', ja: 'はい。今週は、論文のベースラインの結果を再現しました。' },
          { w: 'me', r: 'formal', en: "The accuracy was about two points lower than reported, so I'm looking into why.", ja: '精度が報告値より2ポイントほど低かったので、原因を調べています。' },
          { w: 'tom', r: 'casual', en: 'Did you use the same data split as the authors?', ja: '著者と同じデータ分割を使った？' },
          { w: 'me', r: 'formal', en: "Good point. I'm not sure, actually. I'll double-check that.", ja: 'いい指摘ですね。実ははっきりしません。確認してみます。' },
          { w: 'priya', r: 'casual', en: 'Also, the random seed can make a big difference on small datasets.', ja: 'それに、小さいデータセットだと、乱数シードで結果がかなり変わることもあるよ。' },
          { w: 'me', r: 'formal', en: "That makes sense. I'll run it with five different seeds and report the average.", ja: 'なるほど。5種類のシードで実行して、平均を報告します。' },
          { w: 'miller', r: 'formal', en: "Sounds like a plan. Let's check back next week.", ja: 'いい計画ですね。また来週確認しましょう。' },
        ],
      },
      {
        id: 'c1s5', title: '初めての学会・懇親会', place: '国際学会・レセプション会場',
        intro: '初めての国際学会。昼の発表が終わり、夜は懇親会。グラスを片手に、ひとりで立っている研究者がいる。話しかけて、話を広げて、感じよく切り上げよう。',
        outro: '話しかけるのも、切り上げるのも、思ったより自然にできた。',
        boss: {
          title: '30秒自己紹介',
          prompt: '懇親会で初めて会った人に、30秒で自己紹介してみよう。名前・所属・研究内容に加えて、最後に相手へ質問を返すと会話が続きます。',
          hints: [
            "Hi, I'm ___. I'm a master's student at ___.",
            "I work on ___, especially ___.",
            "Basically, I'm trying to figure out ___.",
            'What brings you to this conference?',
            'What are you working on these days?',
          ],
          sec: 30,
        },
        lines: [
          { w: 'me', r: 'casual', en: 'Hi, mind if I join you?', ja: 'こんにちは、ご一緒してもいいですか？' },
          { w: 'wei', r: 'casual', en: "Not at all. I'm Wei, from a robotics lab in Singapore.", ja: 'もちろん。ウェイです。シンガポールのロボティクスの研究室から来ました。' },
          { w: 'me', r: 'casual', en: "Nice to meet you. I'm a master's student, and I work on model evaluation.", ja: 'はじめまして。修士の学生で、モデルの評価を研究しています。' },
          { w: 'wei', r: 'casual', en: 'Oh, interesting. What kind of evaluation?', ja: 'へえ、面白いですね。どんな評価ですか？' },
          { w: 'me', r: 'casual', en: 'Mainly how to tell if a model will still work on real-world data.', ja: '主に、モデルが実世界のデータでもちゃんと動くかを見分ける方法です。' },
          { w: 'wei', r: 'casual', en: "That's a big problem in robotics too. Simulation results often don't transfer.", ja: 'それはロボティクスでも大問題なんです。シミュレーションの結果が、そのまま通用しないことが多くて。' },
          { w: 'me', r: 'casual', en: 'Really? How do you usually deal with that?', ja: '本当ですか？ 普段はどう対処しているんですか？' },
          { w: 'wei', r: 'casual', en: "We add a lot of randomness during training. It's not perfect, but it helps.", ja: '訓練中にランダム性をたくさん加えるんです。完璧ではないけど、効果はあります。' },
          { w: 'me', r: 'casual', en: 'That sounds similar to data augmentation. Did you present a poster today?', ja: 'データ拡張に似ていますね。今日はポスター発表をされたんですか？' },
          { w: 'wei', r: 'casual', en: "Yes, it's number forty-two, near the entrance. Feel free to stop by.", ja: 'ええ、入口近くの42番です。気軽に寄ってください。' },
          { w: 'me', r: 'casual', en: "I'd love to. Could I connect with you on LinkedIn?", ja: 'ぜひ。LinkedInでつながってもいいですか？' },
          { w: 'wei', r: 'casual', en: "Of course. Here's my QR code.", ja: 'もちろん。これが私のQRコードです。' },
          { w: 'me', r: 'casual', en: "Thanks. I'll let you mingle, but it was great talking to you.", ja: 'ありがとうございます。そろそろ他の方ともお話しください。お話しできてよかったです。' },
          { w: 'wei', r: 'casual', en: 'Likewise. Enjoy the rest of the conference!', ja: 'こちらこそ。学会の残りも楽しんでください！' },
        ],
      },
    ],
  },

  {"id": 2, "title": "第2章 インターン編", "rank": "インターン", "scenes": [{"id": "c2s1", "bg": "office", "title": "朝会（スタンドアップ）", "place": "AIスタートアップ・オフィス", "intro": "夏。研究室の紹介で、AIスタートアップのインターンに参加することになった。毎朝10時は、立ったまま話す「朝会」。昨日やったこと・今日やること・困っていることを、短く話そう。", "outro": "3点セットで話せば、朝会はこわくない。しかもトムまでいた。", "lines": [{"w": "dana", "r": "casual", "en": "Morning, everyone. Let's do a quick round. Who wants to go first?", "ja": "おはよう、みんな。手短に一周しよう。誰から行く？"}, {"w": "me", "r": "formal", "en": "I'll go. Yesterday, I finished cleaning the training data.", "ja": "私から行きます。昨日は訓練データのクリーニングを終えました。"}, {"w": "me", "r": "formal", "en": "Today, I'm going to start writing the evaluation script.", "ja": "今日は評価用のスクリプトを書き始めます。"}, {"w": "me", "r": "formal", "en": "One blocker: I don't have write access to the shared bucket yet.", "ja": "困っていることが一つあって、共有ストレージへの書き込み権限がまだありません。"}, {"w": "dana", "r": "casual", "en": "Ah, I can fix that right after this. Ping me if I forget.", "ja": "ああ、これが終わったらすぐ直すよ。忘れてたら声かけて。"}, {"w": "me", "r": "casual", "en": "Thanks, I will.", "ja": "ありがとうございます、そうします。"}, {"w": "tom", "r": "casual", "en": "Hey, aren't you from Professor Miller's lab?", "ja": "ねえ、ミラー先生の研究室の人だよね？"}, {"w": "me", "r": "casual", "en": "Tom? No way! You're interning here too?", "ja": "トム？ うそでしょ！ ここでインターンしてるの？"}, {"w": "tom", "r": "casual", "en": "Yep, on the data team. Let's grab lunch later.", "ja": "うん、データチームで。あとでお昼行こうよ。"}, {"w": "dana", "r": "casual", "en": "Okay, you two can catch up later. Next!", "ja": "はいはい、話の続きはあとでね。次！"}]}, {"id": "c2s2", "bg": "office", "title": "わからないことを聞く", "place": "AIスタートアップ・オフィス", "intro": "評価スクリプトを動かしたら、エラーで止まった。30分調べても分からない。メンターの Dana に、状況を整理して聞いてみよう。「何が起きたか」「何を試したか」を先に言うのがコツ。", "outro": "聞いたら5分で解決した。悩んだ30分は、少しもったいなかったかもしれない。", "lines": [{"w": "me", "r": "formal", "en": "Hi Dana, do you have a minute? I'm stuck on something.", "ja": "Dana さん、ちょっといいですか？ 行き詰まっていることがあって。"}, {"w": "dana", "r": "casual", "en": "Sure. What's going on?", "ja": "いいよ。どうしたの？"}, {"w": "me", "r": "formal", "en": "The evaluation script crashes when it loads the model checkpoint.", "ja": "評価スクリプトが、モデルのチェックポイントを読み込むところで落ちるんです。"}, {"w": "me", "r": "formal", "en": "I've already checked the file path and the library version.", "ja": "ファイルのパスとライブラリのバージョンは、もう確認しました。"}, {"w": "dana", "r": "casual", "en": "Can you show me the error message?", "ja": "エラーメッセージを見せてくれる？"}, {"w": "me", "r": "casual", "en": "Here. It says the tensor shapes don't match.", "ja": "これです。テンソルの形が合わないと出ています。"}, {"w": "dana", "r": "casual", "en": "Oh, I bet you're using the old config file. We changed the hidden size last week.", "ja": "ああ、たぶん古い設定ファイルを使ってるね。先週、隠れ層のサイズを変えたんだ。"}, {"w": "me", "r": "formal", "en": "That explains it. Where can I find the latest one?", "ja": "それで分かりました。最新のものはどこにありますか？"}, {"w": "dana", "r": "casual", "en": "It's in the main branch. And next time, don't hesitate to ask sooner.", "ja": "main ブランチにあるよ。それと、次はもっと早めに遠慮なく聞いてね。"}, {"w": "me", "r": "casual", "en": "Got it. I'll ask earlier next time.", "ja": "わかりました。次はもっと早く聞きます。"}]}, {"id": "c2s3", "bg": "office", "title": "コードレビューを受ける", "place": "AIスタートアップ・オフィス", "intro": "初めてのプルリクエスト。説明文は書き言葉、レビューのやりとりは話し言葉。指摘を受け止めて、自分がそうした理由も短く説明しよう。", "outro": "指摘は攻撃ではなく、コードを良くするための材料。そう思えると、レビューが少し楽しみになった。", "lines": [{"w": "me", "r": "written", "en": "This PR adds a script that evaluates the model on the validation set.", "ja": "（説明文）このプルリクエストは、検証セットでモデルを評価するスクリプトを追加します。"}, {"w": "me", "r": "written", "en": "It reports accuracy and F1 score, and saves the results as a JSON file.", "ja": "（説明文）精度と F1 スコアを出力し、結果を JSON ファイルとして保存します。"}, {"w": "dana", "r": "casual", "en": "Nice work overall. I left a few comments.", "ja": "全体的にいいね。いくつかコメントを残しておいたよ。"}, {"w": "dana", "r": "formal", "en": "Could you split this function into smaller pieces? It's doing too much.", "ja": "この関数を小さく分けてもらえる？ やることが多すぎるから。"}, {"w": "me", "r": "formal", "en": "Sure, that makes sense. I'll separate the loading and the scoring.", "ja": "はい、そうですね。読み込みと採点を分けます。"}, {"w": "dana", "r": "casual", "en": "Also, why did you hard-code the batch size here?", "ja": "あと、ここでバッチサイズを直接書き込んだのはなぜ？"}, {"w": "me", "r": "formal", "en": "I wanted to avoid running out of memory, but I should make it configurable.", "ja": "メモリ不足を避けたかったんですが、設定で変えられるようにすべきですね。"}, {"w": "dana", "r": "casual", "en": "Exactly. And please add a test for the case with empty input.", "ja": "その通り。それと、入力が空の場合のテストも追加してね。"}, {"w": "me", "r": "formal", "en": "Will do. I'll push the changes this afternoon.", "ja": "やります。午後に修正をプッシュします。"}, {"w": "dana", "r": "casual", "en": "Great. Ping me when it's ready for another look.", "ja": "いいね。もう一度見られるようになったら声かけて。"}]}, {"id": "c2s4", "bg": "office", "title": "チャットで相談する", "place": "自宅（リモート勤務）", "intro": "リモート勤務の日。チャットで進捗を共有し、チームに意見を聞こう。チャットは文字なので「書き言葉」だけれど、くだけた言い方もよく使われる。", "outro": "気づいたことを早めに書いておくと、誰かが手がかりをくれる。チャットも立派な会議だ。", "lines": [{"w": "me", "r": "written", "en": "Quick update: the new evaluation script is merged and running every night.", "ja": "（チャット）簡単な報告です。新しい評価スクリプトがマージされ、毎晩動いています。"}, {"w": "me", "r": "written", "en": "I noticed that accuracy drops a lot on short sentences. Has anyone seen this before?", "ja": "（チャット）短い文で精度が大きく下がることに気づきました。前に見たことがある方はいますか？"}, {"w": "tom", "r": "written", "en": "Yeah, our tokenizer splits short texts weirdly. Might be related.", "ja": "（チャット）うん、うちのトークナイザーは短い文を変に分割するんだ。関係あるかも。"}, {"w": "me", "r": "written", "en": "Interesting. Do you have an example I could look at?", "ja": "（チャット）興味深いね。見られる例はある？"}, {"w": "tom", "r": "written", "en": "Sure, I'll send you a notebook in a sec.", "ja": "（チャット）もちろん、すぐノートブックを送るよ。"}, {"w": "dana", "r": "written", "en": "Good catch! Can you write up what you find by Friday?", "ja": "（チャット）よく気づいたね！ 分かったことを金曜までにまとめてくれる？"}, {"w": "me", "r": "written", "en": "Sounds good. I'll share a short doc with the analysis and some examples.", "ja": "（チャット）了解です。分析といくつかの例をまとめた短い文書を共有します。"}, {"w": "me", "r": "written", "en": "Thanks for the pointer, Tom. That notebook saved me a lot of time.", "ja": "（チャット）トム、手がかりをありがとう。あのノートブックでかなり時間が節約できました。"}]}, {"id": "c2s5", "bg": "poster", "title": "学会のポスター発表", "place": "国際学会・ポスター会場", "intro": "インターンの成果を、学会のポスターで発表することになった。通りがかる人に短く説明して、質問に答えよう。見覚えのある名札が近づいてくる……。", "outro": "「何の問題か → 何をしたか → 結果」。この順番なら、短くても伝わる。", "boss": {"title": "ポスターを30秒で説明", "prompt": "ポスターの前で立ち止まった人に、自分の研究（またはインターンでやったこと）を30秒で説明しよう。「何の問題か → 何をしたか → 結果どうなったか」の順にすると伝わりやすい。", "hints": ["In short, we looked at ___.", "The problem is that ___.", "So we tried ___.", "As a result, ___ improved by ___.", "Happy to answer any questions."], "sec": 30}, "lines": [{"w": "wei", "r": "casual", "en": "Hey, I remember you! The model evaluation person, right?", "ja": "あ、覚えてます！ モデル評価の人ですよね？"}, {"w": "me", "r": "casual", "en": "Wei! Great to see you again. Thanks for stopping by.", "ja": "ウェイさん！ また会えてうれしいです。寄ってくれてありがとうございます。"}, {"w": "wei", "r": "casual", "en": "So, what's this poster about?", "ja": "それで、このポスターは何についてですか？"}, {"w": "me", "r": "formal", "en": "In short, we found that our model fails on very short inputs.", "ja": "簡単に言うと、私たちのモデルがとても短い入力で失敗することを見つけました。"}, {"w": "me", "r": "formal", "en": "The main cause was how the tokenizer splits rare words.", "ja": "主な原因は、トークナイザーが珍しい単語を分割するやり方でした。"}, {"w": "me", "r": "formal", "en": "After we fixed it, accuracy on short inputs went up by eight points.", "ja": "それを直したら、短い入力での精度が8ポイント上がりました。"}, {"w": "wei", "r": "casual", "en": "Nice. Did it hurt performance on longer inputs?", "ja": "いいですね。長い入力での性能は落ちませんでしたか？"}, {"w": "me", "r": "formal", "en": "Good question. It stayed about the same, within one point.", "ja": "いい質問ですね。ほぼ同じで、差は1ポイント以内でした。"}, {"w": "wei", "r": "casual", "en": "Cool. Do you have a paper or a preprint I can read?", "ja": "いいですね。読める論文かプレプリントはありますか？"}, {"w": "me", "r": "casual", "en": "Not yet, but I can send you the slides. Here's my contact.", "ja": "まだですが、スライドなら送れます。これが私の連絡先です。"}, {"w": "wei", "r": "casual", "en": "Perfect. Good luck with the rest of the session!", "ja": "完璧です。セッションの残りも頑張ってください！"}]}]},
  {"id": 3, "title": "第3章 ジュニアエンジニア編", "rank": "ジュニアエンジニア", "scenes": [{"id": "c3s1", "bg": "meeting", "title": "チームに自己紹介", "place": "会社・ミーティングルーム", "intro": "春。インターン先から内定をもらい、正社員として入社した。チームの全体ミーティングで自己紹介をしよう。進行役はマネージャーの Raj だ。", "outro": "仕事の話に、少しだけ自分の話を足す。それだけで、ラーメン部に入部できた。", "lines": [{"w": "raj", "r": "formal", "en": "Everyone, please welcome our new machine learning engineer.", "ja": "皆さん、新しい機械学習エンジニアを歓迎しましょう。"}, {"w": "me", "r": "formal", "en": "Thank you. Some of you may remember me from my internship last summer.", "ja": "ありがとうございます。去年の夏のインターンで、覚えている方もいるかもしれません。"}, {"w": "me", "r": "formal", "en": "I'll be working on the search ranking model with Dana.", "ja": "Dana さんと一緒に、検索ランキングのモデルを担当します。"}, {"w": "me", "r": "formal", "en": "Outside of work, I like hiking and trying new ramen places.", "ja": "仕事以外では、ハイキングと、新しいラーメン屋めぐりが好きです。"}, {"w": "tom", "r": "casual", "en": "Ramen? Then you're coming with us on Friday.", "ja": "ラーメン？ じゃあ金曜は一緒に来てもらうよ。"}, {"w": "raj", "r": "casual", "en": "Ha, the ramen club has a new member. Okay, any questions for our new teammate?", "ja": "はは、ラーメン部に新メンバーだね。さて、新しい仲間に質問はある？"}, {"w": "dana", "r": "casual", "en": "What are you most excited to work on?", "ja": "一番楽しみにしている仕事は何？"}, {"w": "me", "r": "formal", "en": "Honestly, I'm excited to see my work used by real users.", "ja": "正直なところ、自分の仕事が実際のユーザーに使われるのが楽しみです。"}, {"w": "raj", "r": "formal", "en": "Great answer. Welcome aboard!", "ja": "いい答えですね。ようこそ！"}]}, {"id": "c3s2", "bg": "meeting", "title": "担当部分を説明する", "place": "会社・ミーティングルーム", "intro": "設計レビュー。チーム全員の前で、自分が担当した部分の設計を説明する。「まず・次に・理由は」と順番を示しながら話そう。", "outro": "分からないことを「まだ分かりません。調べて共有します」と言えたのも、立派な答えだった。", "lines": [{"w": "raj", "r": "formal", "en": "Next up is the feature pipeline. Go ahead whenever you're ready.", "ja": "次は特徴量パイプラインです。準備ができたらどうぞ。"}, {"w": "slide", "r": "written", "en": "Goal: finish the daily pipeline within one hour, at under fifty dollars per run.", "ja": "（スライド）目標：日次パイプラインを1時間以内、1回50ドル未満で完了させる。"}, {"w": "me", "r": "formal", "en": "Thanks. I'll walk you through the part I'm responsible for.", "ja": "ありがとうございます。私が担当している部分を順に説明します。"}, {"w": "me", "r": "formal", "en": "First, we collect user clicks and store them in a daily table.", "ja": "まず、ユーザーのクリックを集めて、日ごとのテーブルに保存します。"}, {"w": "me", "r": "formal", "en": "Then, a batch job computes features for each query every night.", "ja": "次に、バッチ処理が毎晩、クエリごとに特徴量を計算します。"}, {"w": "me", "r": "formal", "en": "The main reason for using batch processing is to keep the cost low.", "ja": "バッチ処理を使う主な理由は、コストを低く抑えるためです。"}, {"w": "dana", "r": "formal", "en": "What happens if the batch job fails overnight?", "ja": "夜中にバッチ処理が失敗したらどうなるの？"}, {"w": "me", "r": "formal", "en": "In that case, the model uses yesterday's features and sends an alert.", "ja": "その場合は、モデルが前日の特徴量を使い、アラートを送ります。"}, {"w": "raj", "r": "formal", "en": "Have you estimated how fresh the features need to be?", "ja": "特徴量がどのくらい新しい必要があるか、見積もりましたか？"}, {"w": "me", "r": "formal", "en": "Not precisely yet. I'll run an experiment and share the numbers next week.", "ja": "まだ正確には出していません。実験して、来週数字を共有します。"}]}, {"id": "c3s3", "bg": "night", "title": "障害対応", "place": "会社・夜のオフィス", "intro": "金曜の夜、「検索結果がおかしい」という報告が入った。慌てずに、分かっていること・分からないこと・次にやることを報告しよう。", "outro": "まず元に戻す、原因はそのあと。落ち着いて報告できた夜だった。", "lines": [{"w": "raj", "r": "formal", "en": "We're getting reports that search results look strange. What do we know so far?", "ja": "検索結果がおかしいという報告が来ています。今わかっていることは？"}, {"w": "me", "r": "formal", "en": "The problem started around eight p.m., right after the new model was deployed.", "ja": "問題は夜8時ごろ、新しいモデルがデプロイされた直後に始まりました。"}, {"w": "me", "r": "formal", "en": "The latency is normal, but the click rate dropped by about forty percent.", "ja": "レイテンシは正常ですが、クリック率が約40%下がっています。"}, {"w": "raj", "r": "formal", "en": "Do we know the cause?", "ja": "原因は分かっていますか？"}, {"w": "me", "r": "formal", "en": "Not yet. My best guess is that a feature is missing in production.", "ja": "まだです。一番可能性が高いのは、本番環境である特徴量が欠けていることだと思います。"}, {"w": "dana", "r": "casual", "en": "Should we roll back first and investigate after?", "ja": "先にロールバックして、調査はそのあとにする？"}, {"w": "me", "r": "formal", "en": "I agree. Rolling back is safe, and it should take about ten minutes.", "ja": "賛成です。ロールバックは安全で、10分ほどで済むはずです。"}, {"w": "raj", "r": "formal", "en": "Okay, go ahead. Please post an update in the incident channel every thirty minutes.", "ja": "わかりました、進めてください。障害対応チャンネルに30分ごとに状況を投稿してください。"}, {"w": "me", "r": "written", "en": "Update: rollback completed at eight forty. Click rate is back to normal. Investigating the root cause.", "ja": "（チャット）状況報告：8時40分にロールバック完了。クリック率は正常に戻りました。根本原因を調査中です。"}, {"w": "raj", "r": "casual", "en": "Nice work staying calm. Go get some sleep.", "ja": "落ち着いて対応できてたね。もう寝ておいで。"}]}, {"id": "c3s4", "bg": "meeting", "title": "振り返り会", "place": "会社・ミーティングルーム", "intro": "障害の翌週。誰かを責めるためではなく、仕組みを良くするための振り返り会。報告書の英語（書き言葉）と、会議での言い換え（話し言葉）を比べてみよう。", "outro": "「人ではなく仕組みの問題」。その一言で、会議の空気がやわらかくなった。", "lines": [{"w": "me", "r": "written", "en": "Summary: a missing feature caused a forty percent drop in clicks for fifty minutes.", "ja": "（報告書）概要：特徴量の欠落により、50分間クリック数が40%減少した。"}, {"w": "me", "r": "written", "en": "Root cause: the feature name was changed in training but not in production.", "ja": "（報告書）根本原因：特徴量の名前が、訓練環境では変更されたが、本番環境では変更されていなかった。"}, {"w": "me", "r": "formal", "en": "To put it simply, the two systems were using different names for the same thing.", "ja": "簡単に言うと、2つのシステムが同じものに別々の名前を使っていたんです。"}, {"w": "raj", "r": "formal", "en": "How can we make sure this doesn't happen again?", "ja": "これが二度と起きないようにするには、どうすればいいでしょう？"}, {"w": "me", "r": "formal", "en": "I'd suggest adding a check that compares the features before each deployment.", "ja": "デプロイの前に毎回、特徴量を比較するチェックを追加することを提案します。"}, {"w": "dana", "r": "casual", "en": "Love that. Could we also add an alert on the click rate?", "ja": "それいいね。クリック率にもアラートを付けられる？"}, {"w": "me", "r": "formal", "en": "Good idea. I'll take the deployment check, if someone can own the alert.", "ja": "いい考えですね。デプロイ前のチェックは私がやるので、アラートは誰かに担当してもらえますか。"}, {"w": "tom", "r": "casual", "en": "I'll take the alert. I've set one up before.", "ja": "アラートは僕がやるよ。前に設定したことがあるから。"}, {"w": "raj", "r": "formal", "en": "Thanks, both of you. And to be clear, this was a process problem, not a people problem.", "ja": "二人ともありがとう。それと、はっきりさせておくと、これは人ではなく仕組みの問題です。"}]}, {"id": "c3s5", "bg": "party", "title": "社外の勉強会・懇親会", "place": "AI勉強会・懇親会場", "intro": "社外の AI 勉強会に参加した。発表のあとは軽食つきの懇親会。初対面の人にも、自分の仕事を分かりやすく説明しよう。会場には、見覚えのある紫のめがねが……。", "outro": "「要するに」と一言で言い換えると、専門外の人にも仕事が伝わる。", "boss": {"title": "45秒で自分の仕事を説明", "prompt": "エンジニアではない人にも分かるように、自分の仕事（または目指している仕事）を45秒で説明してみよう。専門用語を一つ使ったら、すぐ言い換えるのがコツ。", "hints": ["I work on ___. Basically, ___.", "In other words, ___.", "For example, when you ___, we ___.", "The hard part is ___.", "What about you? What do you do?"], "sec": 45}, "lines": [{"w": "priya", "r": "casual", "en": "Wait, is that you? It's been ages!", "ja": "待って、あなた？ 久しぶり！"}, {"w": "me", "r": "casual", "en": "Priya! I didn't know you'd be here. How have you been?", "ja": "プリヤさん！ 来てるとは知らなかったです。お元気でしたか？"}, {"w": "priya", "r": "casual", "en": "Busy, but good. I finished my PhD and joined a medical AI startup.", "ja": "忙しいけど元気。博士号を取って、医療 AI のスタートアップに入ったの。"}, {"w": "me", "r": "casual", "en": "Congratulations! That sounds exciting.", "ja": "おめでとうございます！ わくわくする仕事ですね。"}, {"w": "priya", "r": "casual", "en": "Thanks! So, what are you working on these days?", "ja": "ありがとう！ それで、最近は何をしているの？"}, {"w": "me", "r": "casual", "en": "I work on search ranking. Basically, I decide which results show up first.", "ja": "検索ランキングをやっています。要するに、どの結果を上に出すかを決める仕事です。"}, {"w": "priya", "r": "casual", "en": "Oh, nice. How do you know if a change actually helps?", "ja": "へえ、いいね。変更が本当に役に立ったかは、どうやって分かるの？"}, {"w": "me", "r": "casual", "en": "We run A/B tests. Half the users see the new version, and we compare clicks.", "ja": "A/B テストをします。半分のユーザーに新しい版を見せて、クリック数を比べるんです。"}, {"w": "priya", "r": "casual", "en": "Makes sense. Hey, let me introduce you to my coworker. She's into search too.", "ja": "なるほど。ねえ、同僚を紹介させて。彼女も検索に興味があるの。"}, {"w": "me", "r": "casual", "en": "I'd love that. Thanks, Priya.", "ja": "ぜひお願いします。ありがとう、プリヤさん。"}]}]},
  {"id": 4, "title": "第4章 ミドルエンジニア編", "rank": "ミドルエンジニア", "scenes": [{"id": "c4s1", "bg": "meeting", "title": "設計の議論", "place": "会社・ミーティングルーム", "intro": "新機能に、大規模言語モデルの API を使うか、小さなモデルを自分たちで学習するか。チームの意見が分かれている。トレードオフを整理して話そう。", "outro": "どちらかを選ぶのではなく、順番を決める。議論が前に進む答えだった。", "lines": [{"w": "raj", "r": "formal", "en": "We need to decide on an approach today. Let's hear both options.", "ja": "今日は方針を決める必要があります。両方の案を聞きましょう。"}, {"w": "dana", "r": "formal", "en": "I think we should call a large language model through an API. It's fast to build.", "ja": "API で大規模言語モデルを呼ぶべきだと思う。作るのが速いから。"}, {"w": "me", "r": "formal", "en": "That's a fair point. Let me lay out the trade-offs as I see them.", "ja": "もっともな意見です。私から見たトレードオフを整理させてください。"}, {"w": "me", "r": "formal", "en": "The API option is faster to launch, but the cost grows with every request.", "ja": "API の案は早く出せますが、リクエストごとにコストが増えます。"}, {"w": "me", "r": "formal", "en": "A smaller in-house model takes longer to build, but it's cheaper at scale.", "ja": "自前の小さいモデルは作るのに時間がかかりますが、規模が大きくなると安くなります。"}, {"w": "raj", "r": "formal", "en": "How much traffic are we expecting?", "ja": "どのくらいのトラフィックを見込んでいますか？"}, {"w": "me", "r": "formal", "en": "About two million requests a day at launch, and possibly ten times that within a year.", "ja": "開始時に1日約200万リクエスト、1年以内にその10倍になる可能性があります。"}, {"w": "dana", "r": "casual", "en": "Hmm, at that scale, the API bill would get scary.", "ja": "うーん、その規模だと API の請求額が怖くなるね。"}, {"w": "me", "r": "formal", "en": "What if we start with the API and collect data to train our own model later?", "ja": "まず API で始めて、あとで自分たちのモデルを訓練するためのデータを集める、というのはどうでしょう？"}, {"w": "raj", "r": "formal", "en": "I like that. Let's write it up as a two-phase plan.", "ja": "いいですね。2段階の計画としてまとめましょう。"}]}, {"id": "c4s2", "bg": "meeting", "title": "反対意見を丁寧に言う", "place": "会社・ミーティングルーム", "intro": "PM の Lena が、来週のリリースを提案してきた。でも評価はまだ足りない。相手の目的を認めつつ、懸念と代わりの案をはっきり伝えよう。", "outro": "「分かります。ただ…」と受け止めてから話すと、反対意見でも相手に届く。", "lines": [{"w": "lena", "r": "formal", "en": "I'd like to launch the new ranking next week. The sales team is really excited.", "ja": "新しいランキングを来週リリースしたいです。営業チームがとても期待していて。"}, {"w": "me", "r": "formal", "en": "I understand why next week is attractive, and I want this out soon too.", "ja": "来週がいい理由は分かりますし、私も早く出したいと思っています。"}, {"w": "me", "r": "formal", "en": "But I'm a bit concerned. We've only tested it on English queries.", "ja": "ただ、少し心配です。英語のクエリでしかテストしていないんです。"}, {"w": "lena", "r": "formal", "en": "How big is the risk, realistically?", "ja": "現実的に、リスクはどのくらい大きいですか？"}, {"w": "me", "r": "formal", "en": "About thirty percent of our users search in other languages, so the impact could be large.", "ja": "ユーザーの約3割は他の言語で検索するので、影響が大きくなる可能性があります。"}, {"w": "lena", "r": "casual", "en": "Okay, that's more than I thought. What would you suggest?", "ja": "なるほど、思っていたより多いですね。どうするのがいいと思いますか？"}, {"w": "me", "r": "formal", "en": "We could launch for English users next week and add other languages two weeks later.", "ja": "来週は英語のユーザー向けに出して、他の言語は2週間後に追加する、という形はどうでしょう。"}, {"w": "lena", "r": "formal", "en": "That works for me. Could you put the risks in writing so I can share them?", "ja": "それで大丈夫です。共有できるように、リスクを文章にまとめてもらえますか？"}, {"w": "me", "r": "written", "en": "Risk: ranking quality for non-English queries has not been evaluated. Mitigation: a staged rollout by language.", "ja": "（文書）リスク：英語以外のクエリでのランキング品質は未評価。対策：言語ごとの段階的なリリース。"}, {"w": "lena", "r": "casual", "en": "Perfect. Thanks for pushing back. That was really helpful.", "ja": "完璧です。反対意見を言ってくれてありがとう。とても助かりました。"}]}, {"id": "c4s3", "bg": "office", "title": "見積もりと優先順位", "place": "会社・オフィス", "intro": "Lena から追加の依頼が3つ届いた。全部は無理だ。見積もりを正直に伝えて、どれを先にやるか一緒に決めよう。", "outro": "「できません」ではなく「これならできます」。断り方ひとつで、相手は味方になる。", "lines": [{"w": "lena", "r": "formal", "en": "I have three more requests. Can your team handle all of them this quarter?", "ja": "あと3つ依頼があります。今四半期で、あなたのチームで全部対応できますか？"}, {"w": "me", "r": "formal", "en": "Let me be honest. We can realistically finish two of them this quarter.", "ja": "正直に言わせてください。現実的には、今四半期にできるのは2つです。"}, {"w": "me", "r": "formal", "en": "The first one is small, about three days. The other two will take a few weeks each.", "ja": "1つ目は小さくて3日ほどです。残りの2つは、それぞれ数週間かかります。"}, {"w": "lena", "r": "formal", "en": "Which one would you drop?", "ja": "どれを外しますか？"}, {"w": "me", "r": "formal", "en": "That depends on your priorities. Which one matters most to customers?", "ja": "それは優先順位次第です。顧客にとって一番大事なのはどれですか？"}, {"w": "lena", "r": "casual", "en": "Probably the spelling correction. People complain about it every week.", "ja": "たぶんスペル修正ですね。毎週苦情が来るので。"}, {"w": "me", "r": "formal", "en": "Then I'd suggest we do the spelling correction and the small fix, and move the third one to next quarter.", "ja": "それなら、スペル修正と小さな修正をやって、3つ目は次の四半期に回すのがいいと思います。"}, {"w": "lena", "r": "formal", "en": "Agreed. I'll let the stakeholders know.", "ja": "賛成です。関係者に伝えておきます。"}, {"w": "me", "r": "written", "en": "Plan for this quarter: the small UI fix first, then spelling correction. Synonym expansion moves to next quarter.", "ja": "（文書）今四半期の計画：まず UI の小さな修正、次にスペル修正。同義語の展開は次の四半期に移動。"}]}, {"id": "c4s4", "bg": "cafe", "title": "1on1でキャリア相談", "place": "会社・カフェスペース", "intro": "マネージャーの Raj との1on1。最近、自分はこのままでいいのか考えている。本音を、でも感じよく伝えよう。", "outro": "やりたいことは、言わないと伝わらない。言ってみたら、次の仕事がやってきた。", "lines": [{"w": "raj", "r": "casual", "en": "So, how are things going? Anything on your mind?", "ja": "さて、最近どう？ 何か気になっていることはある？"}, {"w": "me", "r": "casual", "en": "Actually, yes. I've been thinking about my career a lot lately.", "ja": "実はあります。最近、キャリアについてよく考えていて。"}, {"w": "me", "r": "formal", "en": "I enjoy building models, but I'd like to have more impact on technical decisions.", "ja": "モデルを作るのは楽しいのですが、技術的な判断にもっと関わりたいんです。"}, {"w": "raj", "r": "formal", "en": "That's great to hear. What kind of decisions do you have in mind?", "ja": "それはうれしいね。どんな判断を考えている？"}, {"w": "me", "r": "formal", "en": "For example, choosing the architecture for new projects, or reviewing other people's designs.", "ja": "例えば、新しいプロジェクトの構成を決めたり、他の人の設計をレビューしたりすることです。"}, {"w": "raj", "r": "formal", "en": "Then how about leading the design for the next search project?", "ja": "それなら、次の検索プロジェクトの設計を主導してみるのはどう？"}, {"w": "me", "r": "casual", "en": "Really? I'd love to. I might need some advice along the way, though.", "ja": "本当ですか？ ぜひやりたいです。途中で相談させてもらうかもしれませんが。"}, {"w": "raj", "r": "casual", "en": "Of course. That's what these one-on-ones are for.", "ja": "もちろん。そのための1on1だからね。"}, {"w": "me", "r": "formal", "en": "Thank you. I'll put together a rough plan by next week.", "ja": "ありがとうございます。来週までに大まかな計画をまとめます。"}]}, {"id": "c4s5", "bg": "hall", "title": "学会で口頭発表", "place": "国際学会・メインホール", "intro": "国際学会で、ついに口頭発表をすることになった。発表のしめくくりと質疑応答の場面。まだ試していないことを聞かれても、誠実に答えよう。会場の前のほうに、見覚えのある片眼鏡が光っている。", "outro": "あの日のオフィスアワーから、ここまで来た。", "boss": {"title": "発表の要点を60秒で", "prompt": "自分の研究や仕事の成果を、学会の発表のつもりで60秒で話してみよう。「背景 → やったこと → 結果 → 次の課題」の順にすると、聞き手が迷わない。", "hints": ["Today, I'd like to talk about ___.", "The problem we focused on is ___.", "Our approach was to ___.", "As a result, ___.", "One limitation is ___, which we'll address next."], "sec": 60}, "lines": [{"w": "slide", "r": "written", "en": "We propose a staged rollout method that limits the impact of ranking errors on users.", "ja": "（スライド）本研究では、ランキングの誤りがユーザーに与える影響を抑える、段階的なリリース手法を提案する。"}, {"w": "me", "r": "formal", "en": "To sum up, our staged rollout cut serious ranking errors in half.", "ja": "まとめると、段階的なリリースによって、深刻なランキングの誤りが半分に減りました。"}, {"w": "me", "r": "formal", "en": "I'm happy to take any questions.", "ja": "ご質問があればどうぞ。"}, {"w": "wei", "r": "formal", "en": "Thanks for the great talk. How did you choose the threshold for each stage?", "ja": "素晴らしい発表をありがとうございます。各段階のしきい値はどうやって決めたのですか？"}, {"w": "me", "r": "formal", "en": "Good question. We started with a conservative value and adjusted it based on user feedback.", "ja": "いい質問です。慎重な値から始めて、ユーザーの反応を見ながら調整しました。"}, {"w": "miller", "r": "formal", "en": "Did you consider applying this to languages beyond the ones in your study?", "ja": "研究で扱った以外の言語に適用することは検討しましたか？"}, {"w": "me", "r": "formal", "en": "Thank you. Honestly, we haven't tested that yet, but it's an important direction for future work.", "ja": "ありがとうございます。正直に言うと、まだ試していませんが、今後の研究の大事な方向だと考えています。"}, {"w": "miller", "r": "casual", "en": "I'm proud of you. You've come a long way since office hours.", "ja": "誇りに思うよ。オフィスアワーの頃から、ずいぶん成長したね。"}, {"w": "me", "r": "casual", "en": "Thank you, Professor. That question about regularization was where it all started.", "ja": "ありがとうございます、先生。あの正則化の質問が、すべての始まりでした。"}, {"w": "miller", "r": "casual", "en": "Ha! Let's grab a coffee and catch up.", "ja": "はは！ コーヒーでも飲みながら近況を聞かせてくれ。"}]}]},
  {"id": 5, "title": "第5章 シニア／リード編", "rank": "リードエンジニア", "scenes": [{"id": "c5s1", "bg": "office", "title": "新人のメンタリング", "place": "会社・オフィス", "intro": "チームに新人の Sam が入った。かつての Dana のように、今度はあなたが教える番だ。質問しやすい雰囲気をつくりながら、考え方を一緒に整理しよう。", "outro": "「1時間たったら聞いてね」。あの日 Dana に言われたことを、今度は自分が言っていた。", "lines": [{"w": "sam", "r": "casual", "en": "Um, sorry to bother you. Do you have a minute?", "ja": "あの、お邪魔してすみません。ちょっといいですか？"}, {"w": "me", "r": "casual", "en": "Of course. You're never bothering me. What's up?", "ja": "もちろん。邪魔だなんて全然。どうしたの？"}, {"w": "sam", "r": "casual", "en": "I've been stuck on this bug for two days, and I feel kind of embarrassed.", "ja": "このバグで2日間止まっていて、ちょっと恥ずかしくて。"}, {"w": "me", "r": "casual", "en": "Don't worry. I once spent a whole day on a config file. Let's look at it together.", "ja": "気にしないで。私なんて設定ファイルで丸一日つぶしたことがあるよ。一緒に見よう。"}, {"w": "me", "r": "formal", "en": "First, can you tell me what you expected to happen and what actually happened?", "ja": "まず、何が起きると思っていて、実際には何が起きたかを教えてくれる？"}, {"w": "sam", "r": "casual", "en": "I expected the loss to go down, but it stays flat from the start.", "ja": "損失が下がると思っていたんですが、最初からずっと横ばいなんです。"}, {"w": "me", "r": "formal", "en": "Okay. That often means the learning rate is too small, or the gradients aren't flowing.", "ja": "なるほど。それはよく、学習率が小さすぎるか、勾配が流れていないことを意味するんだ。"}, {"w": "sam", "r": "casual", "en": "Oh, I think I froze all the layers by mistake!", "ja": "あ、間違えて全部の層を固定していたかもしれません！"}, {"w": "me", "r": "casual", "en": "There you go. And next time, ask after an hour, not two days.", "ja": "それだね。あと次からは、2日じゃなくて1時間たったら聞いてね。"}, {"w": "sam", "r": "casual", "en": "Got it. Thank you so much!", "ja": "わかりました。本当にありがとうございます！"}]}, {"id": "c5s2", "bg": "office", "title": "採用面接をする", "place": "会社・面接室", "intro": "今日は面接官。候補者の Alex は緊張しているようだ。リラックスしてもらいながら、考え方を引き出す質問をしよう。", "outro": "面接は試験ではなく会話。相手の力が一番出る質問を探すのが、面接官の仕事だ。", "lines": [{"w": "me", "r": "formal", "en": "Hi Alex, thanks for coming in. Before we start, would you like some water?", "ja": "こんにちは、アレックスさん。来てくれてありがとうございます。始める前に、お水はいかがですか？"}, {"w": "alex", "r": "formal", "en": "I'm fine, thank you. I'm just a little nervous.", "ja": "大丈夫です、ありがとうございます。少し緊張しているだけです。"}, {"w": "me", "r": "casual", "en": "That's totally normal. I was nervous at my first interview too.", "ja": "それは普通ですよ。私も最初の面接では緊張しました。"}, {"w": "me", "r": "formal", "en": "Could you tell me about a project you're proud of?", "ja": "誇りに思っているプロジェクトについて教えてもらえますか？"}, {"w": "alex", "r": "formal", "en": "Sure. I built a model that detects defects in factory images.", "ja": "はい。工場の画像から不良品を見つけるモデルを作りました。"}, {"w": "me", "r": "formal", "en": "Interesting. What was the hardest part?", "ja": "面白いですね。一番難しかったところは何ですか？"}, {"w": "alex", "r": "formal", "en": "There were very few defect examples, so the data was extremely unbalanced.", "ja": "不良品の例がとても少なく、データの偏りが極端でした。"}, {"w": "me", "r": "formal", "en": "How did you deal with that?", "ja": "それにどう対処しましたか？"}, {"w": "alex", "r": "formal", "en": "We generated synthetic defects and changed how we measured success.", "ja": "人工的に不良品の画像を作り、成功の測り方も変えました。"}, {"w": "me", "r": "formal", "en": "That's a thoughtful approach. Do you have any questions for me?", "ja": "よく考えられた方法ですね。私に何か質問はありますか？"}, {"w": "alex", "r": "casual", "en": "Yes. What do you enjoy most about working here?", "ja": "はい。ここで働いていて一番楽しいことは何ですか？"}, {"w": "me", "r": "casual", "en": "Honestly, the people. Everyone is willing to help, especially when things go wrong.", "ja": "正直なところ、人ですね。みんな助け合ってくれます。特に、何か問題が起きたときに。"}]}, {"id": "c5s3", "bg": "meeting", "title": "経営陣への説明", "place": "会社・役員会議室", "intro": "経営会議で、AI プロジェクトへの投資を判断してもらうことになった。専門用語を使わず、結論と数字から話そう。資料の一文（書き言葉）と口頭の説明（話し言葉）の違いにも注目。", "outro": "結論、費用、リスク、そのときの手。この4つがそろえば、10分で決まる。", "lines": [{"w": "raj", "r": "formal", "en": "The executives have ten minutes. Start with the bottom line.", "ja": "経営陣の時間は10分です。結論から話してください。"}, {"w": "me", "r": "written", "en": "Recommendation: invest in an in-house model. Expected savings: one point two million dollars per year.", "ja": "（資料）提言：自社モデルに投資する。見込まれる削減額：年間120万ドル。"}, {"w": "me", "r": "formal", "en": "In short, I recommend we build our own model. It will save about one point two million dollars a year.", "ja": "結論から言うと、自社でモデルを作ることを提案します。年間約120万ドルの節約になります。"}, {"w": "lena", "r": "formal", "en": "What's the catch?", "ja": "何か落とし穴は？"}, {"w": "me", "r": "formal", "en": "It will take about six months, and we'll need two more engineers.", "ja": "約6か月かかり、エンジニアがあと2人必要です。"}, {"w": "me", "r": "formal", "en": "During that time, we'll keep using the current service, so customers won't notice any change.", "ja": "その間は今のサービスを使い続けるので、顧客が変化に気づくことはありません。"}, {"w": "raj", "r": "formal", "en": "And what if the new model doesn't perform as well?", "ja": "新しいモデルの性能が十分でなかったら？"}, {"w": "me", "r": "formal", "en": "We'll compare them side by side before switching. If it's worse, we simply don't switch.", "ja": "切り替える前に並べて比較します。悪ければ、切り替えないだけです。"}, {"w": "lena", "r": "formal", "en": "Clear and simple. I'm convinced.", "ja": "明快でシンプルですね。納得しました。"}, {"w": "raj", "r": "casual", "en": "Nice job. That was exactly the right level of detail.", "ja": "よくやった。ちょうどいい詳しさだったよ。"}]}, {"id": "c5s4", "bg": "meeting", "title": "チームに方針を伝える", "place": "会社・全体ミーティング", "intro": "新しいプロジェクトの方針を、チーム全員に伝える。不安の声にも耳を傾けて、みんなが納得して進めるようにしよう。", "outro": "不安をなくすのではなく、不安なまま進める仕組みをつくる。それがリードの仕事だった。", "lines": [{"w": "me", "r": "formal", "en": "Thanks for joining, everyone. I'd like to share where we're heading next quarter.", "ja": "皆さん、集まってくれてありがとうございます。来四半期の方向性を共有したいと思います。"}, {"w": "me", "r": "formal", "en": "Our goal is to replace the external API with our own model by the end of the year.", "ja": "年末までに、外部の API を自社のモデルに置き換えることが目標です。"}, {"w": "tom", "r": "casual", "en": "Does that mean we have to stop the other projects?", "ja": "それって、ほかのプロジェクトを止めなきゃいけないってこと？"}, {"w": "me", "r": "formal", "en": "Not all of them. We'll pause one project, and I'll explain which one and why.", "ja": "全部ではありません。一つのプロジェクトを止めます。どれを、なぜ止めるのかを説明しますね。"}, {"w": "s <text x="${W - P.r}" y="${H - 6}" fill="#b3bce6" font-size="10" text-anchor="end">${fmtDate(pts[pts.length - 1].x)}</text>

}

<div><b>${total}</b><span>とっさに言った回数</span></div><div><b>${Object.keys(S.lines).length}</b><span>覚え中の文</span></div></div></div>
<div class="win"><h3>とっさの反応時間（日ごとの中央値・秒）</h3><p class="small">下がるほど、ぱっと言えています。ヒントを使った回と×の回は除いています。</p>
${lineChart(rtPts, { fmt: v => v.toFixed(1), yMin: 0 })}
${firstRt && rtPts.length >= 2 ? `<p class="small">最初 ${firstRt.y.toFixed(1)}秒 → 最近 ${lastRt.y.toFixed(1)}秒</p>` : ''}</div>
<div class="win"><h3>書き取りの正答率（日ごと・%）</h3>
${lineChart(dPts, { fmt: v => Math.round(v), yMin: 0, yMax: 100 })}</div>
<div class="win"><h3>覚え具合</h3>
<p>うろ覚え ${boxes[0]}文 ／ 定着中 ${boxes[1]}文 ／ 定着 ${boxes[2]}文</p>
<p class="small">「○言えた」が続くほど、復習の間隔が 1→2→4→7→15→30日と伸び、「定着」に近づきます。</p></div>
<p class="small center">数字はゲーム内のめやすです。</p>`,
  };
};

/* ---------- せってい・動作チェック ---------- */
SCREENS.settings = () => {
  const t = V.t, mv = mainVoice();
  const ok = x => x === true ? '<span class="okc">✅ OK</span>' : x === false ? '<span class="ngc">❌ NG</span>' : '<span class="small">未チェック</span>';
  return {
    html: topBar('home', 'せってい・動作チェック') + `
<div class="win"><h2>① 読み上げ</h2>
<p>${TTS.ok ? `英語の声：${TTS.voices.length}種類` : '<span class="ngc">このブラウザは読み上げに対応していません</span>'}</p>
${TTS.voices.length ? `<select data-c="voice">${TTS.voices.map(v => `<option value="${esc(v.name)}" ${mv && v.name === mv.name ? 'selected' : ''}>${esc(v.name)}（${esc(v.lang)}）${v.localService ? '' : ' ☁'}</option>`).join('')}</select>` : ''}
<p class="small">☁ が付いた声はネット接続が必要なことがあります。</p>
<p>速さ：<b id="spv">${S.speed.toFixed(2)}倍</b></p>
<input type="range" min="0.6" max="1.4" step="0.05" value="${S.speed}" data-i="speed" data-c="speedSet">
<label class="tg"><input type="checkbox" data-c="multi" ${S.multi ? 'checked' : ''}>登場人物ごとに声を変える（端末にあるアクセントの声を使う）</label>
<label class="tg"><input type="checkbox" data-c="sfx" ${S.sfx !== false ? 'checked' : ''}>効果音を鳴らす</label>
<button class="btn pri" data-a="tts">🔊 試しに聞く</button>
<p>結果：${ok(t.tts)}${t.tts === undefined ? '' : `　<button class="btn" style="display:inline-block;width:auto;padding:4px 10px" data-a="ttsNg">聞こえなかった</button>`}</p></div>

<div class="win"><h2>② マイク録音</h2>
<p class="small">3秒間しゃべって、再生されれば OK です。</p>
${V.recording ? meterHTML + '<p class="center">録音中…</p>' : `<button class="btn pri" data-a="mic">● 3秒録音して再生</button>`}
<p>結果：${ok(t.mic)} ${t.micMsg ? `<span class="small">${esc(t.micMsg)}</span>` : ''}</p>
<p class="small">「とっさに」の反応時間は、マイクの音量で言い始めを判定します。周りがうるさいと早めに反応することがあります。</p></div>

<div class="win"><h2>③ 音声認識（参考・任意）</h2>
<p>${SR ? 'このブラウザは音声認識に対応しています（オンラインで動作）。' : 'このブラウザは音声認識に対応していません。なくても遊べます。'}</p>
${SR ? `<button class="btn" data-a="sr">🗣 「machine learning」と言ってみる</button>
<p>結果：${ok(t.sr)} ${t.srMsg ? `<span class="small">${esc(t.srMsg)}</span>` : ''}</p>
<label class="tg"><input type="checkbox" data-c="useSR" ${S.useSR ? 'checked' : ''}>「まねる」で音声認識を使う（聞き取られなかった単語を「気になるところ」に出す）</label>
<label class="tg"><input type="checkbox" data-c="srBoth" ${S.srBoth ? 'checked' : ''}>録音と同時に音声認識する（試験的。端末によっては録音か認識が失敗します。そのときはオフにすると、認識用にもう一度言う方式になります）</label>
<p class="small">認識エンジンは、ありそうな単語に補正して聞き取るため、発音の判定としては甘めに出ます。</p>` : ''}</div>

<div class="win"><h2>④ 保存</h2>
<button class="btn" data-a="store">💾 保存のテスト</button>
<p>記録：${ok(t.ls)}　録音：${ok(t.idb)} ${t.stMsg ? `<span class="small">${esc(t.stMsg)}</span>` : ''}</p>
<hr>
<p class="small">機種変更に備えて、記録をファイルに書き出せます（録音は含みません）。</p>
<div class="row"><button class="btn" data-a="exp">⬇ 書き出し</button><label class="btn" style="text-align:center">⬆ 読み込み<input type="file" accept=".json,application/json" data-c="imp" hidden></label></div>
<button class="btn red" data-a="reset">記録をすべて消す</button></div>

<div class="win"><h2>クレジット</h2>
<p class="small">教材の英文は、下記の引用を除きこのゲームのオリジナルです。</p>
<p class="small">ウォンバットのドット絵は、同じサイトの「神に愛されたヒメウォンバット」の描画プログラムを使っています。</p>
<p class="small">講義スライドの2文：<a href="${SOURCES.wpOverfit.url}" target="_blank" rel="noopener">${esc(SOURCES.wpOverfit.title)}</a> より引用（${SOURCES.wpOverfit.lic}）。この2文は CC BY-SA 4.0 で利用できます。</p></div>`,
    acts: {
      voice: b => { S.voice = b.value; save(); },
      speed: b => { S.speed = +b.value; const e = $('#spv'); if (e) e.textContent = S.speed.toFixed(2) + '倍'; },
      speedSet: () => save(),
      multi: b => { S.multi = b.checked; save(); },
      sfx: b => { S.sfx = b.checked; save(); if (b.checked) sfx('ok'); },
      useSR: b => { S.useSR = b.checked; save(); },
      srBoth: b => { S.srBoth = b.checked; save(); },
      tts: async () => { t.tts = true; S.checked = true; save(); render(); await speak("Hi, I'm Priya. Let me show you around the lab.", 'priya'); await speak('Today, we are going to talk about overfitting.', 'miller'); },
      ttsNg: () => { t.tts = false; render(); },
      mic: async () => {
        stopAll(); V.recording = true; t.micMsg = ''; render();
        try {
          const r = await startRec({ calib: 0, max: 3000, onLevel: meterUpdate }).done;
          V.recording = false;
          if (r.blob) { t.mic = true; S.checked = true; save(); render(); await playBlob(r.blob); }
          else { t.mic = false; t.micMsg = '録音データが空でした'; render(); }
        } catch (e) { V.recording = false; t.mic = false; t.micMsg = (e.name === 'NotAllowedError' ? 'マイクの使用が許可されていません。' : '') + (e.message || e.name); render(); }
      },
      sr: async () => { t.srMsg = '🎤 どうぞ…'; render(); const r = await recognize(); if (r.text != null) { t.sr = true; t.srMsg = '「' + r.text + '」'; } else { t.sr = false; t.srMsg = SR_ERR[r.err] || r.err; } render(); },
      store: async () => {
        t.stMsg = '';
        try { localStorage.setItem('eigoroad_test', '1'); t.ls = localStorage.getItem('eigoroad_test') === '1'; localStorage.removeItem('eigoroad_test'); } catch (e) { t.ls = false; }
        try { await idbPut('test', new Blob(['x'])); const b = await idbGet('test'); t.idb = !!b; await idbDel('test'); } catch (e) { t.idb = false; t.stMsg = e.message; }
        render();
      },
      exp: () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }));
        a.download = 'english-road-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      },
      imp: b => {
        const f = b.files[0]; if (!f) return;
        f.text().then(s => { const j = JSON.parse(s); if (!j || j.v !== 1 || typeof j.days !== 'object') throw new Error('形式が違います'); if (!confirm('今の記録を、読み込んだ記録で置き換えます。よろしいですか？')) return; S = Object.assign(DEF(), j); save(); alert('読み込みました'); go('title'); })
          .catch(e => alert('読み込めませんでした：' + e.message));
      },
      reset: () => { if (confirm('記録をすべて消します（録音も消えます）。よろしいですか？')) { S = DEF(); save(); try { indexedDB.deleteDatabase('eigoroad_audio'); DB = null; } catch (e) {} go('title'); } },
    },
  };
};

render();
</script>
</body>
</html>
