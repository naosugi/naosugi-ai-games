 designs.", "ja": "例えば、新しいプロジェクトの構成を決めたり、他の人の設計をレビューしたりすることです。"}, {"w": "raj", "r": "formal", "en": "Then how about leading the design for the next search project?", "ja": "それなら、次の検索プロジェクトの設計を主導してみるのはどう？"}, {"w": "me", "r": "casual", "en": "Really? I'd love to. I might need some advice along the way, though.", "ja": "本当ですか？ ぜひやりたいです。途中で相談させてもらうかもしれませんが。"}, {"w": "raj", "r": "casual", "en": "Of course. That's what these one-on-ones are for.", "ja": "もちろん。そのための1on1だからね。"}, {"w": "me", "r": "formal", "en": "Thank you. I'll put together a rough plan by next week.", "ja": "ありがとうございます。来週までに大まかな計画をまとめます。"}]}, {"id": "c4s6", "bg": "meeting", "title": "振り返り会を進行する", "place": "会社・ミーティングルーム", "intro": "今度はあなたが振り返り会の進行役。話がそれないように、時間と論点を管理しながら、全員の意見を引き出そう。", "outro": "進行役の仕事は、答えを出すことではなく、全員が話せる場をつくること。", "lines": [{"w": "me", "r": "formal", "en": "Thanks for coming, everyone. We have thirty minutes, so let's get started.", "ja": "皆さん、集まってくれてありがとうございます。30分なので、始めましょう。"}, {"w": "me", "r": "formal", "en": "The goal today is to understand what happened, not to blame anyone.", "ja": "今日の目的は、何が起きたかを理解することで、誰かを責めることではありません。"}, {"w": "me", "r": "formal", "en": "Tom, could you walk us through the timeline?", "ja": "Tom、時系列で何が起きたか説明してもらえますか？"}, {"w": "tom", "r": "casual", "en": "Sure. The data job failed at two a.m., but nobody noticed until nine.", "ja": "うん。データ処理が夜中の2時に失敗したんだけど、9時まで誰も気づかなかった。"}, {"w": "dana", "r": "casual", "en": "Honestly, the alert went to an old channel that nobody reads anymore.", "ja": "正直に言うと、アラートが、もう誰も見ていない古いチャンネルに送られてたの。"}, {"w": "me", "r": "formal", "en": "That's helpful. Let's write that down as a contributing factor.", "ja": "参考になります。それを要因の一つとして書いておきましょう。"}, {"w": "tom", "r": "casual", "en": "Can we also talk about why the job failed in the first place?", "ja": "そもそも処理がなぜ失敗したかも話せる？"}, {"w": "me", "r": "formal", "en": "Good point, but let's park that for now. We have a separate meeting for the root cause.", "ja": "いい質問ですが、いったん脇に置かせてください。根本原因については別の会議があります。"}, {"w": "me", "r": "formal", "en": "We have five minutes left. What are our action items?", "ja": "残り5分です。対応すべきことは何でしょう？"}, {"w": "dana", "r": "casual", "en": "Move the alerts to the active channel, and add a phone call for serious ones.", "ja": "アラートを今使っているチャンネルに移して、深刻なものは電話も鳴るようにする。"}, {"w": "me", "r": "written", "en": "Action items: Dana will move alerts to the active channel. Tom will add phone alerts for critical failures.", "ja": "（議事録）対応事項：Dana がアラートを現在のチャンネルに移す。Tom が重大な失敗に電話通知を追加する。"}]}, {"id": "c4s7", "bg": "online", "title": "大学との共同研究を提案する", "place": "会社・ビデオ会議", "intro": "会社のデータを使った共同研究を、ミラー先生に提案する。先生にとっての利点と、守るべき条件の両方を、はっきり伝えよう。", "outro": "提案は「相手にとっての良いこと」から話す。条件はそのあとで、正直に。", "lines": [{"w": "miller", "r": "casual", "en": "It's great to see you again. What did you want to discuss?", "ja": "また会えてうれしいよ。話したいことというのは何かな？"}, {"w": "me", "r": "formal", "en": "Thank you for your time, Professor. I'd like to propose a joint research project.", "ja": "お時間をいただきありがとうございます、先生。共同研究のプロジェクトを提案したいと思っています。"}, {"w": "me", "r": "formal", "en": "We have search logs from millions of users, which could be valuable for your students.", "ja": "私たちには数百万人のユーザーの検索ログがあり、先生の学生さんにとって価値のあるデータだと思います。"}, {"w": "miller", "r": "formal", "en": "That's very interesting. What would you need from our side?", "ja": "とても興味深いね。こちらからは何が必要かな？"}, {"w": "me", "r": "formal", "en": "Mainly your expertise in evaluation, and maybe one or two students for six months.", "ja": "主に評価についての先生の専門知識と、半年ほど学生さんを1〜2人お願いできればと思います。"}, {"w": "miller", "r": "formal", "en": "And what about publishing? My students need to publish their work.", "ja": "論文の公表はどうなる？ 学生は研究を発表する必要があるんだ。"}, {"w": "me", "r": "formal", "en": "Publishing is fine, but we can't share any personal data from the logs.", "ja": "公表は問題ありません。ただ、ログに含まれる個人のデータは一切共有できません。"}, {"w": "me", "r": "formal", "en": "We'll remove anything that could identify a user before sharing the data.", "ja": "データを渡す前に、ユーザーを特定できる情報はすべて取り除きます。"}, {"w": "miller", "r": "formal", "en": "That sounds reasonable. Could you send me a written proposal?", "ja": "妥当な話だね。提案書を送ってもらえるかな？"}, {"w": "me", "r": "written", "en": "Proposal: a six-month joint study on search evaluation. All shared data will be anonymized.", "ja": "（提案書）提案：検索の評価に関する6か月の共同研究。共有するデータはすべて匿名化する。"}]}, {"id": "c4s8", "bg": "meeting", "title": "同僚の設計をレビューする", "place": "会社・ミーティングルーム", "intro": "Tom が書いた設計書をレビューする。良いところを先に伝え、懸念は理由と代わりの案を添えて話そう。", "outro": "良い点 → 懸念 → 代わりの案。この順番なら、指摘はちゃんと届く。", "lines": [{"w": "tom", "r": "casual", "en": "So, what did you think of my design doc?", "ja": "で、僕の設計書、どうだった？"}, {"w": "me", "r": "formal", "en": "Overall, I really like it. The problem statement is very clear.", "ja": "全体的に、とてもいいと思います。何を解決したいのかが、はっきり書かれています。"}, {"w": "me", "r": "formal", "en": "I have one main concern, about the cache.", "ja": "大きな懸念が一つあって、キャッシュについてです。"}, {"w": "tom", "r": "casual", "en": "Okay, what about it?", "ja": "うん、どんなこと？"}, {"w": "me", "r": "formal", "en": "If the model is updated, the cache might keep serving old results for up to a day.", "ja": "モデルが更新されても、キャッシュが最大1日、古い結果を返し続けるかもしれません。"}, {"w": "tom", "r": "casual", "en": "Hmm, I didn't think about that. Is that a big problem?", "ja": "うーん、それは考えてなかった。大きな問題かな？"}, {"w": "me", "r": "formal", "en": "It could be, especially if we need to roll back a bad model quickly.", "ja": "なり得ます。特に、問題のあるモデルを急いで元に戻す必要があるときには。"}, {"w": "me", "r": "formal", "en": "One option is to include the model version in the cache key.", "ja": "一つの案は、キャッシュのキーにモデルのバージョンを含めることです。"}, {"w": "tom", "r": "casual", "en": "Oh, that's simple. Then a new model automatically gets a fresh cache.", "ja": "ああ、それは簡単だね。そうすれば、新しいモデルには自動的に新しいキャッシュが使われる。"}, {"w": "me", "r": "formal", "en": "Exactly. Other than that, I think it's ready to go.", "ja": "その通りです。それ以外は、もう進めて大丈夫だと思います。"}]}, {"id": "c4s9", "bg": "meeting", "title": "モデルの公平性を議論する", "place": "会社・ミーティングルーム", "intro": "新しいモデルが、一部の利用者に不利な結果を出しているかもしれない。数字の伝え方に気をつけながら、どう対応するかを話し合おう。", "outro": "平均の数字だけでは見えないことがある。グループごとに分けて見る習慣が、だれかを守る。", "lines": [{"w": "lena", "r": "formal", "en": "I heard you found something concerning in the new model. What's going on?", "ja": "新しいモデルで、気になることが見つかったと聞きました。どういう状況ですか？"}, {"w": "me", "r": "formal", "en": "Overall accuracy improved, but for older users, it actually got worse.", "ja": "全体の精度は上がったのですが、高齢のユーザーでは、むしろ悪くなっていました。"}, {"w": "raj", "r": "formal", "en": "How much worse are we talking about?", "ja": "どのくらい悪くなっているんですか？"}, {"w": "me", "r": "formal", "en": "About five points lower than the current model, for users over sixty.", "ja": "60歳以上のユーザーで、今のモデルより約5ポイント低くなっています。"}, {"w": "lena", "r": "formal", "en": "Why would that happen?", "ja": "なぜそんなことが起きるんでしょう？"}, {"w": "me", "r": "formal", "en": "Our training data has very few examples from that group. The model barely learned their patterns.", "ja": "訓練データに、その層の例がとても少ないんです。モデルがその人たちの傾向をほとんど学べていません。"}, {"w": "raj", "r": "formal", "en": "We can't launch something that hurts a group of our users. What are our options?", "ja": "一部のユーザーに不利になるものは出せません。どんな選択肢がありますか？"}, {"w": "me", "r": "formal", "en": "We could collect more data from that group, or give those examples more weight during training.", "ja": "その層のデータをもっと集めるか、訓練のときにその例の重みを大きくする方法があります。"}, {"w": "lena", "r": "formal", "en": "How long would that take?", "ja": "どのくらい時間がかかりますか？"}, {"w": "me", "r": "formal", "en": "The weighting approach could be tested within a week.", "ja": "重みを変える方法なら、1週間以内に試せます。"}, {"w": "raj", "r": "formal", "en": "Let's do that first. And please report results by age group from now on.", "ja": "まずそれをやりましょう。それと、今後は年齢層ごとの結果も報告してください。"}]}, {"id": "c4s5", "bg": "hall", "title": "学会で口頭発表", "place": "国際学会・メインホール", "intro": "国際学会で、ついに口頭発表をすることになった。発表のしめくくりと質疑応答の場面。まだ試していないことを聞かれても、誠実に答えよう。会場の前のほうに、見覚えのある片眼鏡が光っている。", "outro": "あの日のオフィスアワーから、ここまで来た。", "boss": {"title": "発表の要点を60秒で", "prompt": "自分の研究や仕事の成果を、学会の発表のつもりで60秒で話してみよう。「背景 → やったこと → 結果 → 次の課題」の順にすると、聞き手が迷わない。", "hints": ["Today, I'd like to talk about ___.", "The problem we focused on is ___.", "Our approach was to ___.", "As a result, ___.", "One limitation is ___, which we'll address next."], "sec": 60}, "lines": [{"w": "slide", "r": "written", "en": "We propose a staged rollout method that limits the impact of ranking errors on users.", "ja": "（スライド）本研究では、ランキングの誤りがユーザーに与える影響を抑える、段階的なリリース手法を提案する。"}, {"w": "me", "r": "formal", "en": "To sum up, our staged rollout cut user exposure to serious ranking errors in half.", "ja": "まとめると、段階的なリリースによって、深刻なランキングの誤りの影響を受けるユーザーが半分に減りました。"}, {"w": "me", "r": "formal", "en": "I'm happy to take any questions.", "ja": "ご質問があればどうぞ。"}, {"w": "wei", "r": "formal", "en": "Thanks for the great talk. How did you choose the threshold for each stage?", "ja": "素晴らしい発表をありがとうございます。各段階のしきい値はどうやって決めたのですか？"}, {"w": "me", "r": "formal", "en": "Good question. We started with a conservative value and adjusted it based on user feedback.", "ja": "いい質問です。慎重な値から始めて、ユーザーの反応を見ながら調整しました。"}, {"w": "miller", "r": "formal", "en": "Did you consider applying this to languages beyond the ones in your study?", "ja": "研究で扱った以外の言語に適用することは検討しましたか？"}, {"w": "me", "r": "formal", "en": "Thank you. Honestly, we haven't tested that yet, but it's an important direction for future work.", "ja": "ありがとうございます。正直に言うと、まだ試していませんが、今後の研究の大事な方向だと考えています。"}, {"w": "miller", "r": "casual", "en": "I'm proud of you. You've come a long way since office hours.", "ja": "誇りに思うよ。オフィスアワーの頃から、ずいぶん成長したね。"}, {"w": "me", "r": "casual", "en": "Thank you, Professor. That question about regularization was where it all started.", "ja": "ありがとうございます、先生。あの正則化の質問が、すべての始まりでした。"}, {"w": "miller", "r": "casual", "en": "Ha! Let's grab a coffee and catch up.", "ja": "はは！ コーヒーでも飲みながら近況を聞かせてくれ。"}]}, {"id": "c4t1", "kind": "talk", "bg": "online", "title": "ポッドキャスト：大きくすれば賢くなる？", "place": "通勤中のイヤホン", "intro": "Wei のポッドキャストの最新回。モデルを大きくすると性能がどう変わるのか、という話題だ。数字の聞き取りに注意。", "outro": "「大きければいい」とは限らない。目的に合った大きさを選ぶのもエンジニアの腕。", "quiz": [{"q": "モデルとデータを大きくすると、性能はどうなると言っていた？", "c": ["かなり予測しやすい形で良くなる", "必ず悪くなる", "まったく変わらない", "毎回ランダムに変わる"], "a": 0}, {"q": "Wei が注意していた点は？", "c": ["データが足りないと、大きくしても効果が出にくい", "大きいモデルは必ず安い", "小さいモデルは使えない", "GPU は不要になる"], "a": 0}, {"q": "Wei のチームが実際に選んだのは？", "c": ["一番大きなモデル", "目的に十分な、小さめのモデル", "モデルを使わない方法", "他社のモデルをそのまま"], "a": 1}], "lines": [{"w": "wei", "r": "casual", "en": "Welcome back, everyone. Today's question is a big one: does making a model bigger make it smarter?", "ja": "みなさん、おかえりなさい。今日の問いは大きいですよ。モデルを大きくすれば、賢くなるのか？"}, {"w": "wei", "r": "casual", "en": "Researchers found that when you increase the model size and the data together, performance improves in a pretty predictable way.", "ja": "研究者たちは、モデルの大きさとデータの量を一緒に増やすと、性能がかなり予測しやすい形で良くなることを見つけました。"}, {"w": "wei", "r": "casual", "en": "That's why companies keep building larger and larger models.", "ja": "だから企業は、どんどん大きなモデルを作り続けているわけです。"}, {"w": "wei", "r": "casual", "en": "But there's a catch. If you make the model bigger without enough data, you don't get much benefit.", "ja": "でも、落とし穴があります。十分なデータがないままモデルだけ大きくしても、あまり効果がないんです。"}, {"w": "wei", "r": "casual", "en": "It's like hiring more chefs when you don't have enough ingredients.", "ja": "材料が足りないのに、料理人だけ増やすようなものですね。"}, {"w": "wei", "r": "casual", "en": "And of course, bigger models cost more to train and more to run.", "ja": "それにもちろん、大きなモデルは学習にも運用にも、お金がかかります。"}, {"w": "wei", "r": "casual", "en": "In my team, we tested a model ten times larger than our current one.", "ja": "私のチームでは、今のモデルの10倍の大きさのものを試しました。"}, {"w": "wei", "r": "casual", "en": "It was better, but only by about two percent, and it was eight times more expensive to run.", "ja": "確かに良かったんですが、差は約2%だけで、運用コストは8倍でした。"}, {"w": "wei", "r": "casual", "en": "So we went with the smaller model. For our use case, it was good enough.", "ja": "なので、小さいほうのモデルを選びました。私たちの使い方には、それで十分だったんです。"}, {"w": "wei", "r": "casual", "en": "The lesson is: bigger is often better, but better isn't always worth it.", "ja": "教訓はこうです。大きいほうが良いことは多いけれど、その良さがいつもコストに見合うとは限らない。"}, {"w": "wei", "r": "casual", "en": "Thanks for listening, and see you next week!", "ja": "聞いてくれてありがとう。また来週！"}]}, {"id": "c4t2", "kind": "talk", "bg": "hall", "title": "社内テックトーク：言語モデルの評価", "place": "会社・社内イベント", "intro": "社内のテックトークで、Dana が言語モデルの評価の難しさについて話している。具体的な手順に注目して聞こう。", "outro": "自動の指標と人の目、両方を組み合わせる。評価に近道はない。", "quiz": [{"q": "言語モデルの評価が難しい理由として挙げていたのは？", "c": ["正しい答えが一つとは限らない", "モデルが遅すぎる", "データが多すぎる", "評価する人がいない"], "a": 0}, {"q": "Dana のチームが最初にやることは？", "c": ["大きなモデルを買う", "実際の質問から評価用のセットを作る", "外部のランキングを見る", "ユーザーに全部聞く"], "a": 1}, {"q": "Dana が警告していたことは？", "c": ["評価用のセットを学習に使ってしまうこと", "人間が評価すること", "数字をグラフにすること", "週に一度評価すること"], "a": 0}], "lines": [{"w": "dana", "r": "formal", "en": "Hi everyone. Today I want to share what we've learned about evaluating language models.", "ja": "皆さん、こんにちは。今日は、言語モデルの評価について私たちが学んだことを共有します。"}, {"w": "dana", "r": "formal", "en": "With a classifier, it's easy. The answer is either right or wrong.", "ja": "分類モデルなら簡単です。答えは正しいか、間違っているかのどちらかです。"}, {"w": "dana", "r": "formal", "en": "But with a language model, there are many good ways to answer the same question.", "ja": "でも言語モデルでは、同じ質問に対して、良い答え方がたくさんあります。"}, {"w": "dana", "r": "formal", "en": "So we can't just compare the output to one correct answer.", "ja": "なので、出力を一つの正解と比べるだけでは足りません。"}, {"w": "dana", "r": "formal", "en": "Here's our process. First, we collect real questions from users and build a test set.", "ja": "私たちの手順はこうです。まず、ユーザーからの実際の質問を集めて、評価用のセットを作ります。"}, {"w": "dana", "r": "formal", "en": "Second, we write clear guidelines on what a good answer looks like.", "ja": "次に、良い答えとはどういうものかについて、はっきりした基準を書きます。"}, {"w": "dana", "r": "formal", "en": "Third, we combine automatic scores with human reviews on a smaller sample.", "ja": "3つ目に、自動の点数と、少数のサンプルに対する人の評価を組み合わせます。"}, {"w": "dana", "r": "formal", "en": "One warning. Never let your test set leak into your training data.", "ja": "一つ注意があります。評価用のセットを、絶対に学習データに混ぜないでください。"}, {"w": "dana", "r": "formal", "en": "If that happens, your scores will look great, but they won't mean anything.", "ja": "そうなると、点数はとても良く見えますが、何の意味もなくなります。"}, {"w": "dana", "r": "formal", "en": "We learned that the hard way last year.", "ja": "私たちは去年、痛い目にあってそれを学びました。"}, {"w": "dana", "r": "formal", "en": "Evaluation isn't glamorous, but it's what makes everything else trustworthy. Thank you.", "ja": "評価は地味ですが、ほかのすべてを信頼できるものにしてくれます。ありがとうございました。"}]}, {"id": "c4x1", "kind": "side", "bg": "bank", "title": "部屋の内見", "place": "新しいアパート", "intro": "もう少し広い部屋に引っ越そうと、内見に来た。気になることは、契約の前に全部聞いておこう。", "outro": "内見の質問は、あとで困らないための保険。遠慮せずに聞こう。", "lines": [{"w": "staff", "r": "casual", "en": "Here's the living room. It gets a lot of sunlight in the afternoon.", "ja": "こちらがリビングです。午後は日がたっぷり入りますよ。"}, {"w": "me", "r": "casual", "en": "It's nice and bright. How much is the rent?", "ja": "明るくていいですね。家賃はいくらですか？"}, {"w": "staff", "r": "formal", "en": "It's two thousand a month, and that includes water and trash.", "ja": "月2,000ドルで、水道とごみの料金が含まれています。"}, {"w": "me", "r": "formal", "en": "What about electricity and internet?", "ja": "電気とインターネットはどうですか？"}, {"w": "staff", "r": "formal", "en": "Those are separate. Most tenants pay about a hundred a month for both.", "ja": "それは別です。ほとんどの入居者は、両方で月100ドルほど払っています。"}, {"w": "me", "r": "formal", "en": "Is there a washer and dryer in the unit?", "ja": "部屋に洗濯機と乾燥機はありますか？"}, {"w": "staff", "r": "casual", "en": "There's a shared laundry room on the first floor.", "ja": "1階に共用のランドリールームがあります。"}, {"w": "me", "r": "formal", "en": "Are pets allowed? I'm thinking about getting a cat.", "ja": "ペットは飼えますか？ 猫を飼おうかと考えていて。"}, {"w": "staff", "r": "formal", "en": "Cats are fine, with an extra deposit of three hundred dollars.", "ja": "猫は大丈夫です。追加の敷金が300ドルかかります。"}, {"w": "me", "r": "casual", "en": "Okay. Can I think about it and get back to you by Friday?", "ja": "わかりました。少し考えて、金曜までにお返事してもいいですか？"}, {"w": "staff", "r": "casual", "en": "Of course. Just let me know if you have any other questions.", "ja": "もちろんです。ほかに質問があれば、いつでもどうぞ。"}]}, {"id": "c4x2", "kind": "side", "bg": "bank", "title": "乗り継ぎ便が欠航", "place": "空港の乗り継ぎカウンター", "intro": "出張の帰り、乗り継ぎ便が欠航になった。カウンターで、次の便や補償について落ち着いて確認しよう。", "outro": "トラブルのときこそ、丁寧に、でもはっきりと。必要なことは遠慮せず聞く。", "lines": [{"w": "me", "r": "formal", "en": "Excuse me, my connecting flight was just canceled. What are my options?", "ja": "すみません、乗り継ぎ便が欠航になってしまいました。どんな選択肢がありますか？"}, {"w": "staff", "r": "formal", "en": "I'm sorry about that. Let me check. May I see your boarding pass?", "ja": "申し訳ありません。確認いたします。搭乗券を見せていただけますか？"}, {"w": "me", "r": "formal", "en": "Here you go. I need to get home by tomorrow evening if possible.", "ja": "どうぞ。できれば明日の夕方までに家に帰りたいんです。"}, {"w": "staff", "r": "formal", "en": "The next available flight leaves tomorrow at seven a.m. Would that work?", "ja": "空いている次の便は、明日の朝7時発です。それでいかがでしょう？"}, {"w": "me", "r": "formal", "en": "That works. Will the airline cover a hotel for tonight?", "ja": "それで大丈夫です。今夜のホテル代は、航空会社で負担してもらえますか？"}, {"w": "staff", "r": "formal", "en": "Yes. Here's a hotel voucher and a meal voucher for dinner.", "ja": "はい。こちらがホテルの引換券と、夕食用の食事券です。"}, {"w": "me", "r": "formal", "en": "Thank you. What about my checked bag?", "ja": "ありがとうございます。預けた荷物はどうなりますか？"}, {"w": "staff", "r": "formal", "en": "It will be transferred to your new flight automatically.", "ja": "新しい便に自動的に積み替えられます。"}, {"w": "me", "r": "formal", "en": "Great. And where do I catch the shuttle to the hotel?", "ja": "よかった。ホテルへのシャトルバスは、どこで乗ればいいですか？"}, {"w": "staff", "r": "formal", "en": "Go down to the arrivals level and follow the signs for hotel shuttles.", "ja": "到着ロビーの階に下りて、ホテルシャトルの案内に従ってください。"}]}, {"id": "c4x3", "kind": "side", "bg": "bank", "title": "病院で症状を説明する", "place": "クリニックの診察室", "intro": "数日前から熱とせきが続いている。クリニックで、症状をいつから・どのくらい・何をすると悪くなるか、順に伝えよう。", "outro": "症状の説明は、いつから・どこが・どのくらい。メモを用意しておくと落ち着いて話せる。", "lines": [{"w": "staff", "r": "formal", "en": "Hi, what brings you in today?", "ja": "こんにちは。今日はどうされましたか？"}, {"w": "me", "r": "formal", "en": "I've had a fever and a cough for about three days.", "ja": "3日ほど前から、熱とせきが続いています。"}, {"w": "staff", "r": "formal", "en": "How high has your fever been?", "ja": "熱はどのくらいありましたか？"}, {"w": "me", "r": "formal", "en": "Around thirty-eight degrees Celsius, mostly at night.", "ja": "摂氏38度くらいで、主に夜に上がります。"}, {"w": "staff", "r": "formal", "en": "Any other symptoms, like a sore throat or headache?", "ja": "のどの痛みや頭痛など、ほかの症状はありますか？"}, {"w": "me", "r": "formal", "en": "My throat is a little sore, and I feel tired all the time.", "ja": "のどが少し痛くて、ずっとだるいです。"}, {"w": "staff", "r": "formal", "en": "Are you taking any medication right now?", "ja": "今、何か薬を飲んでいますか？"}, {"w": "me", "r": "formal", "en": "Just some over-the-counter cold medicine I brought from Japan.", "ja": "日本から持ってきた、市販の風邪薬だけです。"}, {"w": "staff", "r": "formal", "en": "Okay. Do you have any allergies to medications?", "ja": "わかりました。薬のアレルギーはありますか？"}, {"w": "me", "r": "formal", "en": "Not that I know of.", "ja": "私の知る限りでは、ありません。"}, {"w": "staff", "r": "formal", "en": "Alright. The doctor will be in shortly to examine you.", "ja": "わかりました。まもなく医師が診察に来ます。"}]}]},
  {"id": 5, "title": "第5章 シニア／リード編", "rank": "リードエンジニア", "scenes": [{"id": "c5s1", "bg": "office", "title": "新人のメンタリング", "place": "会社・オフィス", "intro": "チームに新人の Sam が入った。かつての Dana のように、今度はあなたが教える番だ。質問しやすい雰囲気をつくりながら、考え方を一緒に整理しよう。", "outro": "「1時間たったら聞いてね」。あの日 Dana に言われたことを、今度は自分が言っていた。", "lines": [{"w": "sam", "r": "casual", "en": "Um, sorry to bother you. Do you have a minute?", "ja": "あの、お邪魔してすみません。ちょっといいですか？"}, {"w": "me", "r": "casual", "en": "Of course. You're never a bother. What's up?", "ja": "もちろん。邪魔だなんて全然。どうしたの？"}, {"w": "sam", "r": "casual", "en": "I've been stuck on this bug for two days, and I feel kind of embarrassed.", "ja": "このバグで2日間止まっていて、ちょっと恥ずかしくて。"}, {"w": "me", "r": "casual", "en": "Don't worry. I once spent a whole day on a config file. Let's look at it together.", "ja": "気にしないで。私なんて設定ファイルで丸一日つぶしたことがあるよ。一緒に見よう。"}, {"w": "me", "r": "casual", "en": "First, can you tell me what you expected to happen and what actually happened?", "ja": "まず、何が起きると思っていて、実際には何が起きたかを教えてくれる？"}, {"w": "sam", "r": "casual", "en": "I expected the loss to go down, but it stays flat from the start.", "ja": "損失が下がると思っていたんですが、最初からずっと横ばいなんです。"}, {"w": "me", "r": "formal", "en": "Okay. That often means the learning rate is too small, or the gradients aren't flowing.", "ja": "なるほど。それはたいてい、学習率が小さすぎるか、勾配が流れていないサインだね。"}, {"w": "sam", "r": "casual", "en": "Oh, I think I froze all the layers by mistake!", "ja": "あ、間違えて全部の層を固定していたかもしれません！"}, {"w": "me", "r": "casual", "en": "There you go. And next time, ask after an hour, not two days.", "ja": "それだね。あと次からは、2日じゃなくて1時間たったら聞いてね。"}, {"w": "sam", "r": "casual", "en": "Got it. Thank you so much!", "ja": "わかりました。本当にありがとうございます！"}]}, {"id": "c5s2", "bg": "office", "title": "採用面接をする", "place": "会社・面接室", "intro": "今日は面接官。候補者の Alex は緊張しているようだ。リラックスしてもらいながら、考え方を引き出す質問をしよう。", "outro": "面接は試験ではなく会話。相手の力が一番出る質問を探すのが、面接官の仕事だ。", "lines": [{"w": "me", "r": "formal", "en": "Hi Alex, thanks for coming in. Before we start, would you like some water?", "ja": "こんにちは、アレックスさん。来てくれてありがとうございます。始める前に、お水はいかがですか？"}, {"w": "alex", "r": "formal", "en": "I'm fine, thank you. I'm just a little nervous.", "ja": "大丈夫です、ありがとうございます。少し緊張しているだけです。"}, {"w": "me", "r": "casual", "en": "That's totally normal. I was nervous at my first interview too.", "ja": "それは普通ですよ。私も最初の面接では緊張しました。"}, {"w": "me", "r": "formal", "en": "Could you tell me about a project you're proud of?", "ja": "誇りに思っているプロジェクトについて教えてもらえますか？"}, {"w": "alex", "r": "formal", "en": "Sure. I built a model that detects defects in factory images.", "ja": "はい。工場の画像から不良品を見つけるモデルを作りました。"}, {"w": "me", "r": "formal", "en": "Interesting. What was the hardest part?", "ja": "面白いですね。一番難しかったところは何ですか？"}, {"w": "alex", "r": "formal", "en": "There were very few defect examples, so the data was extremely imbalanced.", "ja": "不良品の例がとても少なく、データの偏りが極端でした。"}, {"w": "me", "r": "formal", "en": "How did you deal with that?", "ja": "それにどう対処しましたか？"}, {"w": "alex", "r": "formal", "en": "We generated synthetic defects and changed how we measured success.", "ja": "人工的に不良品の画像を作り、成功の測り方も変えました。"}, {"w": "me", "r": "formal", "en": "That's a thoughtful approach. Do you have any questions for me?", "ja": "よく考えられた方法ですね。私に何か質問はありますか？"}, {"w": "alex", "r": "formal", "en": "Yes. What do you enjoy most about working here?", "ja": "はい。ここで働いていて一番楽しいことは何ですか？"}, {"w": "me", "r": "casual", "en": "Honestly, the people. Everyone is willing to help, especially when things go wrong.", "ja": "正直なところ、人ですね。みんな助け合ってくれます。特に、何か問題が起きたときに。"}]}, {"id": "c5s3", "bg": "meeting", "title": "経営陣への説明", "place": "会社・役員会議室", "intro": "経営会議で、AI プロジェクトへの投資を判断してもらうことになった。専門用語を使わず、結論と数字から話そう。資料の一文（書き言葉）と口頭の説明（話し言葉）の違いにも注目。", "outro": "結論、費用、リスク、そのときの手。この4つがそろえば、10分で決まる。", "lines": [{"w": "raj", "r": "formal", "en": "The executives have ten minutes. Start with the bottom line.", "ja": "経営陣の時間は10分です。結論から話してください。"}, {"w": "me", "r": "written", "en": "Recommendation: invest in an in-house model. Expected savings: one point two million dollars per year.", "ja": "（資料）提言：自社モデルに投資する。見込まれる削減額：年間120万ドル。"}, {"w": "me", "r": "formal", "en": "The bottom line is, I recommend we build our own model. It will save about one point two million dollars a year.", "ja": "結論から言うと、自社でモデルを作ることを提案します。年間約120万ドルの節約になります。"}, {"w": "lena", "r": "casual", "en": "What's the catch?", "ja": "何か落とし穴は？"}, {"w": "me", "r": "formal", "en": "It will take about six months, and we'll need two more engineers.", "ja": "約6か月かかり、エンジニアがあと2人必要です。"}, {"w": "me", "r": "formal", "en": "During that time, we'll keep using the current service, so customers won't notice any change.", "ja": "その間は今のサービスを使い続けるので、顧客が変化に気づくことはありません。"}, {"w": "raj", "r": "formal", "en": "And what if the new model doesn't perform as well?", "ja": "新しいモデルの性能が十分でなかったら？"}, {"w": "me", "r": "formal", "en": "We'll compare them side by side before switching. If it's worse, we simply don't switch.", "ja": "切り替える前に並べて比較します。悪ければ、切り替えないだけです。"}, {"w": "lena", "r": "formal", "en": "Clear and simple. I'm convinced.", "ja": "明快でシンプルですね。納得しました。"}, {"w": "raj", "r": "casual", "en": "Nice job. That was exactly the right level of detail.", "ja": "よくやった。ちょうどいい詳しさだったよ。"}]}, {"id": "c5s4", "bg": "meeting", "title": "チームに方針を伝える", "place": "会社・全体ミーティング", "intro": "新しいプロジェクトの方針を、チーム全員に伝える。不安の声にも耳を傾けて、みんなが納得して進めるようにしよう。", "outro": "不安をなくすのではなく、不安なまま進める仕組みをつくる。それがリードの仕事だった。", "lines": [{"w": "me", "r": "formal", "en": "Thanks for joining, everyone. I'd like to share where we're heading next quarter.", "ja": "皆さん、集まってくれてありがとうございます。来四半期の方向性を共有したいと思います。"}, {"w": "me", "r": "formal", "en": "Our goal is to replace the external API with our own model by the end of the year.", "ja": "年末までに、外部の API を自社のモデルに置き換えることが目標です。"}, {"w": "tom", "r": "casual", "en": "Does that mean we have to stop the other projects?", "ja": "それって、ほかのプロジェクトを止めなきゃいけないってこと？"}, {"w": "me", "r": "formal", "en": "Not all of them. We'll pause one project, and I'll explain which one and why.", "ja": "全部ではありません。一つのプロジェクトを止めます。どれを、なぜ止めるのかを説明しますね。"}, {"w": "sam", "r": "casual", "en": "I'm worried I don't have enough experience for this.", "ja": "自分にはこの仕事をするだけの経験が足りないんじゃないかと心配です。"}, {"w": "me", "r": "casual", "en": "That's a fair concern. You'll pair with Dana for the first month, and I'm always around.", "ja": "もっともな心配だね。最初の1か月は Dana とペアで進めるし、私もいつでもいるよ。"}, {"w": "dana", "r": "casual", "en": "Yeah, and honestly, nobody here has done this before either.", "ja": "そうそう、それに正直、ここにいる誰もこれをやったことないからね。"}, {"w": "me", "r": "formal", "en": "Exactly. We'll learn together. Let's check in every Friday and adjust the plan as we go.", "ja": "その通りです。一緒に学んでいきましょう。毎週金曜に確認して、進めながら計画を調整しましょう。"}, {"w": "me", "r": "written", "en": "Next steps: kickoff on Monday, and the first milestone review in four weeks.", "ja": "（資料）次のステップ：月曜にキックオフ、4週間後に最初のマイルストーンのレビュー。"}]}, {"id": "c5s6", "bg": "cafe", "title": "評価面談でフィードバックを伝える", "place": "会社・カフェスペース", "intro": "Sam との半年の評価面談。伸びたところを具体的に伝え、次の課題も前向きに話そう。", "outro": "フィードバックは具体的に。「よかった」より「あの場面のあれがよかった」。", "lines": [{"w": "me", "r": "formal", "en": "Thanks for making time, Sam. Let's talk about your last six months.", "ja": "時間をとってくれてありがとう、Sam。この半年について話そう。"}, {"w": "sam", "r": "casual", "en": "Sure. I'm a little nervous, to be honest.", "ja": "はい。正直、ちょっと緊張しています。"}, {"w": "me", "r": "casual", "en": "No need to be. Overall, you've grown a lot, and I'm really happy with your work.", "ja": "緊張しなくて大丈夫だよ。全体として、すごく成長したし、仕事ぶりにとても満足しているよ。"}, {"w": "me", "r": "formal", "en": "For example, the data pipeline you built cut our processing time in half.", "ja": "例えば、あなたが作ったデータパイプラインで、処理時間が半分になった。"}, {"w": "sam", "r": "casual", "en": "Thank you. I learned a lot from that project.", "ja": "ありがとうございます。あのプロジェクトで、たくさん学びました。"}, {"w": "me", "r": "formal", "en": "One area to work on is sharing your progress earlier.", "ja": "これから伸ばしてほしい点は、進み具合をもっと早めに共有することかな。"}, {"w": "me", "r": "formal", "en": "Sometimes I didn't know you were stuck until a few days later.", "ja": "あなたが行き詰まっていることを、数日たってから知ったことが何度かあったんだ。"}, {"w": "sam", "r": "casual", "en": "That's fair. I didn't want to bother anyone.", "ja": "その通りです。誰にも迷惑をかけたくなくて。"}, {"w": "me", "r": "casual", "en": "I get it. But asking early actually saves everyone time.", "ja": "分かるよ。でも、早めに聞くほうが、結局みんなの時間の節約になるんだ。"}, {"w": "me", "r": "formal", "en": "How about a short update in the team channel every afternoon?", "ja": "毎日午後に、チームのチャンネルで短く報告するのはどう？"}, {"w": "sam", "r": "casual", "en": "I can do that. Thanks for the honest feedback.", "ja": "やってみます。率直なフィードバックをありがとうございます。"}]}, {"id": "c5s7", "bg": "meeting", "title": "予算を交渉する", "place": "会社・役員会議室", "intro": "来年の予算会議。チームに GPU とエンジニアを増やしたい。お金の話は、それによって何が得られるかとセットで伝えよう。", "outro": "予算の交渉は「いくら必要か」ではなく「何が得られるか」から話す。", "lines": [{"w": "raj", "r": "formal", "en": "Your team is asking for a forty percent budget increase. That's a lot.", "ja": "あなたのチームは、予算を40%増やしてほしいと言っていますね。かなりの額です。"}, {"w": "me", "r": "formal", "en": "I understand. Let me explain what we'd get for that investment.", "ja": "分かります。その投資で何が得られるかを説明させてください。"}, {"w": "me", "r": "formal", "en": "Most of the increase is for GPUs, which would let us train our own models.", "ja": "増額の大部分は GPU のためで、それがあれば自社のモデルを学習できるようになります。"}, {"w": "me", "r": "formal", "en": "Right now, we spend about two million dollars a year on external APIs.", "ja": "今は、外部の API に年間約200万ドルを払っています。"}, {"w": "me", "r": "formal", "en": "With our own models, we expect to cut that by more than half within two years.", "ja": "自社のモデルがあれば、2年以内にその半分以上を削減できる見込みです。"}, {"w": "raj", "r": "formal", "en": "What if we approve only half of what you're asking for?", "ja": "求めている額の半分しか認めなかったら、どうなりますか？"}, {"w": "me", "r": "formal", "en": "Then we'd focus on the biggest use case first, and the savings would come about a year later.", "ja": "その場合は、一番大きな用途から取り組むことになり、削減の効果はおよそ1年遅れます。"}, {"w": "raj", "r": "formal", "en": "That's a clear trade-off. Can you put both options in a one-page summary?", "ja": "分かりやすいトレードオフですね。両方の案を1ページにまとめてもらえますか？"}, {"w": "me", "r": "written", "en": "Option A: full budget, savings start next year. Option B: half budget, savings start in two years.", "ja": "（資料）案A：予算を全額、削減効果は来年から。案B：予算を半額、削減効果は2年後から。"}, {"w": "raj", "r": "casual", "en": "Thanks. I'll take this to the leadership meeting.", "ja": "ありがとう。経営会議に持っていきます。"}]}, {"id": "c5s8", "bg": "night", "title": "データ流出の疑い", "place": "会社・夜のオフィス", "intro": "夜遅く、Tom から連絡。内部のデータが外から見えている可能性がある。確実でない情報をどう扱うか、落ち着いて判断しよう。", "outro": "確かめるより先に、まず閉じる。分かっていることと、まだ分からないことを分けて伝える。", "lines": [{"w": "tom", "r": "casual", "en": "Sorry to call so late. I think one of our data buckets might be public.", "ja": "遅くにごめん。うちのデータ置き場の一つが、外から見える状態になっているかもしれない。"}, {"w": "me", "r": "formal", "en": "Okay, thanks for calling. What do we know for sure?", "ja": "わかった、連絡ありがとう。確実に分かっていることは何？"}, {"w": "tom", "r": "casual", "en": "The permissions were changed two days ago. I don't know yet if anyone accessed it.", "ja": "2日前に権限が変更されてる。誰かがアクセスしたかは、まだ分からない。"}, {"w": "me", "r": "formal", "en": "First, let's make it private right away. We can investigate after that.", "ja": "まず、すぐに非公開にしよう。調査はそのあとでいい。"}, {"w": "tom", "r": "casual", "en": "Done. It's private now.", "ja": "済んだよ。もう非公開になってる。"}, {"w": "me", "r": "formal", "en": "Good. Next, I'll contact the security team and Raj.", "ja": "よし。次に、セキュリティチームと Raj に連絡する。"}, {"w": "me", "r": "written", "en": "Possible data exposure: a bucket was public for up to two days. Now fixed. Access logs are being checked.", "ja": "（報告）データ流出の可能性：あるデータ置き場が最大2日間公開状態だった。現在は修正済み。アクセス記録を確認中。"}, {"w": "raj", "r": "formal", "en": "Thanks for the quick report. Do we know what kind of data was in there?", "ja": "迅速な報告をありがとう。中にどんなデータがあったかは分かっていますか？"}, {"w": "me", "r": "formal", "en": "Mostly model files, but we need to confirm there's no customer data.", "ja": "ほとんどはモデルのファイルですが、顧客のデータがないことを確認する必要があります。"}, {"w": "raj", "r": "formal", "en": "Understood. Let's not guess. Update me as soon as the logs are checked.", "ja": "了解です。推測はやめましょう。記録の確認が済んだら、すぐ知らせてください。"}, {"w": "tom", "r": "casual", "en": "Logs are clean. Nobody outside the company accessed it.", "ja": "記録を確認した。社外からのアクセスはなかったよ。"}]}, {"id": "c5s9", "bg": "cafe", "title": "仲間の旅立ち", "place": "会社・カフェスペース", "intro": "Dana が、ほかの会社に移ることになった。メンターとして、ずっと支えてくれた人だ。感謝と応援の気持ちを、自分の言葉で伝えよう。", "outro": "別れのあいさつは、思い出と感謝と応援。英語でも、気持ちはちゃんと伝わる。", "lines": [{"w": "dana", "r": "casual", "en": "So, I wanted to tell you in person. Friday is my last day.", "ja": "あのね、直接伝えたかったの。金曜が最後の出社日なんだ。"}, {"w": "me", "r": "casual", "en": "I heard. I'm happy for you, but I'm really going to miss you.", "ja": "聞きました。うれしいけど、本当にさびしくなります。"}, {"w": "dana", "r": "casual", "en": "Me too. It's been a long journey since your internship.", "ja": "私も。あなたのインターンの頃から、長い道のりだったね。"}, {"w": "me", "r": "casual", "en": "Do you remember the config file that took me a whole day?", "ja": "私が丸一日かかった、あの設定ファイルのこと覚えてますか？"}, {"w": "dana", "r": "casual", "en": "How could I forget? You looked so lost.", "ja": "忘れるわけないよ。すっかり途方に暮れた顔してた。"}, {"w": "me", "r": "formal", "en": "You told me to ask sooner. I still tell new people the same thing.", "ja": "もっと早く聞いて、と言ってくれましたよね。今でも新しい人に同じことを言っています。"}, {"w": "dana", "r": "casual", "en": "That makes me really happy. So, what's next for you?", "ja": "それは本当にうれしい。で、あなたはこれからどうするの？"}, {"w": "me", "r": "formal", "en": "I'll keep leading the team here. I want to build the kind of team you built.", "ja": "ここでチームを率い続けます。あなたが作ったようなチームを作りたいんです。"}, {"w": "dana", "r": "casual", "en": "You already are. Let's keep in touch, okay?", "ja": "もう作れてるよ。連絡を取り合おうね。"}, {"w": "me", "r": "casual", "en": "Of course. Thank you for everything, Dana. Good luck at your new job.", "ja": "もちろん。本当にありがとう、Dana。新しい職場でもがんばってください。"}]}, {"id": "c5s5", "bg": "party", "title": "基調講演のあとのレセプション", "place": "国際学会・レセプション会場", "intro": "今年の学会では、基調講演を任された。講演後のレセプション。今度は、人と人をつなぐ側だ。懐かしい顔ぶれが集まってくる。", "outro": "最初の懇親会では、話しかけるのが精一杯だった。今は、人と人をつないでいる。", "boss": {"title": "60秒でこれまでの道のりを話す", "prompt": "基調講演のしめくくりとして、留学生からリードエンジニアになるまでの道のり（または、あなた自身のこれまでとこれから）を60秒で話してみよう。最後に、聞いている若い人へのひとことを入れると締まる。", "hints": ["When I first came here, I ___.", "One thing I learned was ___.", "The turning point was when ___.", "Now, I ___.", "If I could tell my younger self one thing, it would be ___."], "sec": 60}, "lines": [{"w": "wei", "r": "casual", "en": "That keynote was amazing. You've come so far since that first reception.", "ja": "あの基調講演、すごかったよ。最初のレセプションのころから、本当に立派になったね。"}, {"w": "me", "r": "casual", "en": "Thanks, Wei. I still remember being too nervous to even say hello.", "ja": "ありがとう、ウェイ。あいさつするのも緊張していたのを、今でも覚えてるよ。"}, {"w": "me", "r": "casual", "en": "Oh, let me introduce Sam. Sam joined my team this year and works on robotics data.", "ja": "あ、サムを紹介させて。サムは今年うちのチームに入って、ロボティクスのデータを担当しているんだ。"}, {"w": "sam", "r": "casual", "en": "Nice to meet you! I've actually read your papers on simulation.", "ja": "はじめまして！ 実は、シミュレーションについてのあなたの論文を読んだことがあります。"}, {"w": "wei", "r": "casual", "en": "Really? Then we should definitely talk. Here's my card.", "ja": "本当？ じゃあぜひ話そうよ。これ、私の名刺。"}, {"w": "priya", "r": "casual", "en": "Hey, don't forget about me! Is this the famous reunion?", "ja": "ちょっと、私を忘れないでよ！ これが噂の同窓会？"}, {"w": "me", "r": "casual", "en": "Priya! Perfect timing. Have you met Wei? Wei taught me about the sim-to-real gap years ago.", "ja": "プリヤ！ ちょうどいいところに。ウェイとは会ったことある？ 何年も前に、シミュレーションと現実のずれについて教えてくれた人なんだ。"}, {"w": "priya", "r": "casual", "en": "Not yet! Nice to meet you, Wei.", "ja": "まだなの！ はじめまして、ウェイ。"}, {"w": "tom", "r": "casual", "en": "Sorry I'm late. Did I miss the ramen plans?", "ja": "遅れてごめん。ラーメンの計画、もう決まっちゃった？"}, {"w": "me", "r": "casual", "en": "You're just in time. Okay, everyone, ramen after this. My treat.", "ja": "ちょうど間に合ったよ。よし、みんな、このあとラーメンね。私のおごりで。"}, {"w": "miller", "r": "casual", "en": "Count me in. I want to hear the whole story.", "ja": "私も入れてくれ。話を全部聞きたいね。"}]}, {"id": "c5t1", "kind": "talk", "bg": "lecture", "title": "Miller 先生の最終講義", "place": "大学・講義室", "intro": "ミラー先生が大学を退職することになり、最終講義に招かれた。先生がこれまでの研究と学生への思いを語る。ゆっくりした語りを、じっくり聞こう。", "outro": "あの講義室から、すべてが始まった。", "quiz": [{"q": "先生が研究を始めた頃、モデルの学習にかかった時間は？", "c": ["数分", "数日", "数週間", "数年"], "a": 2}, {"q": "先生が一番誇りに思っていることは？", "c": ["論文の数", "受賞歴", "学生たちが世界中で活躍していること", "大きな研究費"], "a": 2}, {"q": "最後に学生へ伝えたことは？", "c": ["できるだけ速く働くこと", "分からないときは質問すること", "一人で研究すること", "流行の分野だけ選ぶこと"], "a": 1}], "lines": [{"w": "miller", "r": "formal", "en": "Thank you all for coming. I never expected so many people at a lecture about the past.", "ja": "皆さん、来てくれてありがとう。昔の話をする講義に、こんなに大勢来てくれるとは思いませんでした。"}, {"w": "miller", "r": "formal", "en": "When I started my research, training a simple model took several weeks.", "ja": "私が研究を始めた頃、簡単なモデルを学習させるのに数週間かかりました。"}, {"w": "miller", "r": "formal", "en": "We would start a job, go home, and pray that the computer wouldn't crash.", "ja": "処理を始めて、家に帰って、コンピューターが止まらないように祈ったものです。"}, {"w": "miller", "r": "formal", "en": "Today, my students do the same thing in a few minutes. It still amazes me.", "ja": "今では、学生たちが同じことを数分でやってしまう。今でも驚きます。"}, {"w": "miller", "r": "formal", "en": "But some things haven't changed at all.", "ja": "でも、まったく変わっていないこともあります。"}, {"w": "miller", "r": "formal", "en": "Good research still starts with a good question, and good questions still come from curiosity.", "ja": "良い研究は、今でも良い問いから始まります。そして良い問いは、今でも好奇心から生まれます。"}, {"w": "miller", "r": "formal", "en": "People often ask me what I'm most proud of. It's not my papers.", "ja": "一番誇りに思っていることは何かと、よく聞かれます。それは論文ではありません。"}, {"w": "miller", "r": "formal", "en": "It's my students, who are now doing amazing work all over the world.", "ja": "今、世界中ですばらしい仕事をしている、私の学生たちです。"}, {"w": "miller", "r": "formal", "en": "Some of them are in this room today. One of them will give a keynote at a big conference this year.", "ja": "そのうちの何人かは、今日この部屋にいます。その一人は今年、大きな学会で基調講演をします。"}, {"w": "miller", "r": "formal", "en": "And I remember, years ago, that same student came to my office, unsure about regularization.", "ja": "何年も前、その学生が、正則化がよく分からないと、私の部屋に来たのを覚えています。"}, {"w": "miller", "r": "formal", "en": "So here's my last piece of advice. When you don't understand something, ask.", "ja": "なので、私からの最後のアドバイスです。分からないことがあったら、聞きなさい。"}, {"w": "miller", "r": "formal", "en": "That one question might change your whole life. Thank you.", "ja": "その一つの質問が、人生を変えるかもしれません。ありがとう。"}]}, {"id": "c5t2", "kind": "talk", "bg": "hall", "title": "パネル討論：AIと仕事の未来", "place": "国際学会・パネル討論", "intro": "学会のパネル討論で、Lena が「AI と仕事の未来」について意見を述べている。賛成・反対の両面をどう語っているかに注目しよう。", "outro": "大きな話題ほど、一方の側だけで語らない。良い面と心配な面を並べて話せると信頼される。", "quiz": [{"q": "Lena が AI の良い影響として挙げたのは？", "c": ["退屈な作業が減り、大事な仕事に時間を使える", "誰も働かなくてよくなる", "給料が必ず上がる", "会議がなくなる"], "a": 0}, {"q": "Lena が心配していたことは？", "c": ["AI が遅すぎること", "変化に取り残される人が出ること", "電気代が下がること", "英語を学ぶ人が減ること"], "a": 1}, {"q": "Lena が企業に求めたことは？", "c": ["AI を禁止すること", "社員が新しい技術を学ぶ時間と機会をつくること", "社員を減らすこと", "AI の利用を秘密にすること"], "a": 1}], "lines": [{"w": "lena", "r": "formal", "en": "Thank you for the question. I'd like to talk about both the hopes and the risks.", "ja": "ご質問ありがとうございます。期待とリスクの両方についてお話ししたいと思います。"}, {"w": "lena", "r": "formal", "en": "On the positive side, AI can take over a lot of repetitive work.", "ja": "良い面としては、AI が繰り返しの作業の多くを引き受けてくれます。"}, {"w": "lena", "r": "formal", "en": "In my team, it now writes the first draft of many reports.", "ja": "私のチームでは今、多くの報告書の最初の下書きを AI が書いています。"}, {"w": "lena", "r": "formal", "en": "That gives people more time for the work that really needs a human, like talking to customers.", "ja": "そのおかげで、お客様と話すような、本当に人が必要な仕事に、より多くの時間を使えるようになりました。"}, {"w": "lena", "r": "formal", "en": "But I'm also worried. Not everyone will be able to adapt at the same speed.", "ja": "でも、心配もしています。誰もが同じ速さで変化に適応できるわけではありません。"}, {"w": "lena", "r": "formal", "en": "Some people may be left behind, especially if they don't get a chance to learn.", "ja": "特に学ぶ機会がなければ、取り残される人も出てくるかもしれません。"}, {"w": "lena", "r": "formal", "en": "So I believe companies have a responsibility here.", "ja": "だから、ここには企業の責任があると考えています。"}, {"w": "lena", "r": "formal", "en": "They need to give employees time and support to learn new tools.", "ja": "企業は、社員が新しいツールを学ぶための時間と支援を用意する必要があります。"}, {"w": "lena", "r": "formal", "en": "Not just one training session, but continuous learning as part of the job.", "ja": "研修を一回やるだけではなく、仕事の一部として学び続けられるようにすることです。"}, {"w": "lena", "r": "formal", "en": "In the end, the question isn't whether AI will change work. It already has.", "ja": "結局のところ、問題は AI が仕事を変えるかどうかではありません。もう変えています。"}, {"w": "lena", "r": "formal", "en": "The question is whether we'll help people change with it.", "ja": "問題は、人がそれと一緒に変われるように、私たちが手助けするかどうかです。"}]}, {"id": "c5x1", "kind": "side", "bg": "cafe", "title": "レストランの予約とアレルギー", "place": "レストラン（電話）", "intro": "日本から両親が遊びに来る。レストランに電話して予約しよう。父の食物アレルギーのことも、はっきり伝えておく必要がある。", "outro": "アレルギーは遠慮せず、はっきりと。命にかかわる大事な英語。", "lines": [{"w": "staff", "r": "formal", "en": "Thank you for calling Harbor Grill. How can I help you?", "ja": "ハーバーグリルにお電話ありがとうございます。ご用件をどうぞ。"}, {"w": "me", "r": "formal", "en": "Hi, I'd like to make a reservation for three people this Saturday.", "ja": "もしもし、今週の土曜に3名で予約をしたいです。"}, {"w": "staff", "r": "formal", "en": "Sure. What time would you like?", "ja": "かしこまりました。何時がよろしいですか？"}, {"w": "me", "r": "formal", "en": "Around seven, if possible. Could we get a table by the window?", "ja": "できれば7時ごろで。窓際の席をお願いできますか？"}, {"w": "staff", "r": "formal", "en": "We have a window table at seven fifteen. Would that be okay?", "ja": "7時15分なら窓際のお席がございます。いかがでしょう？"}, {"w": "me", "r": "formal", "en": "That's perfect. Also, my father has a severe shellfish allergy.", "ja": "それでお願いします。それと、父に重い甲殻類と貝類のアレルギーがあります。"}, {"w": "staff", "r": "formal", "en": "Thank you for letting us know. I'll make a note for the kitchen.", "ja": "お知らせいただきありがとうございます。厨房に伝えておきます。"}, {"w": "me", "r": "formal", "en": "Are there dishes on the menu that are completely shellfish-free?", "ja": "メニューに、甲殻類や貝類をまったく使っていない料理はありますか？"}, {"w": "staff", "r": "formal", "en": "Yes, several. Our server can walk you through them when you arrive.", "ja": "はい、いくつかございます。ご来店の際に、係の者がご案内いたします。"}, {"w": "me", "r": "fo }, {"w": "me", "r": "formal", "en": "Yes, under the name Yu. A midsize car for two days.", "ja": "はい、ユウの名前で。中型車を2日間です。"}, {"w": "staff", "r": "formal", "en": "Got it. Can I see your driver's license and a credit card?", "ja": "確認できました。運転免許証とクレジットカードを見せていただけますか？"}, {"w": "me", "r": "formal", "en": "Here you go. Can my father drive too? He has an International Driving Permit.", "ja": "どうぞ。父も運転できますか？ 国際運転免許証を持っています。"}, {"w": "staff", "r": "formal", "en": "Yes, as long as he shows it with his Japanese license. Would you like to add full insurance coverage?", "ja": "はい、日本の免許証と一緒にお見せいただければ大丈夫です。補償が一番手厚い保険を追加されますか？"}, {"w": "me", "r": "formal", "en": "What does it cover, and how much is it per day?", "ja": "何が補償されて、1日いくらですか？"}, {"w": "staff", "r": "formal", "en": "It covers any damage to the car, with no deductible. It's twenty-five dollars a day.", "ja": "車の損害をすべて補償し、自己負担はありません。1日25ドルです。"}, {"w": "me", "r": "formal", "en": "I'll take it. Do I need to return the car with a full tank?", "ja": "それにします。返すときは、ガソリンを満タンにする必要がありますか？"}, {"w": "staff", "r": "formal", "en": "Yes, or we'll charge you for the fuel. Please return it by noon on Sunday.", "ja": "はい。そうでない場合は燃料代を請求します。日曜の正午までにご返却ください。"}, {"w": "me", "r": "casual", "en": "Got it. Thanks for your help!", "ja": "わかりました。ありがとうございました！"}]}]},

const INTV = [0, 1, 2, 4, 7, 15, 30]; // 復習の間隔（日）。箱0〜6
// 星の基準（めやす。使いながら調整する前提）
const STAR_DICT = 0.9;   // 書き取り正答率
const STAR_RT = 2000;    // とっさの反応時間（中央値, ms）

/* ---------- 便利関数 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const z2 = n => String(n).padStart(2, '0');
const dayKey = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const today = () => dayKey(new Date());
const parseDay = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseDay(k); d.setDate(d.getDate() + n); return dayKey(d); };
const diffDays = (a, b) => { const u = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((u(b) - u(a)) / 864e5); };
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const sec = ms => ms == null ? '—' : (ms / 1000).toFixed(1) + '秒';
const pct = x => x == null ? '—' : Math.round(x * 100) + '%';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtDate = k => { const d = parseDay(k); return (d.getMonth() + 1) + '/' + d.getDate(); };

const ALL_SCENES = [];
CHAPTERS.forEach(ch => ch.scenes.forEach((sc, i) => ALL_SCENES.push({ ch, sc, i })));
const sceneById = id => ALL_SCENES.find(x => x.sc.id === id);
const lineId = (sid, i) => sid + '-' + i;
const lineByKey = k => { const p = k.lastIndexOf('-'); const s = sceneById(k.slice(0, p)); return s ? { s, i: +k.slice(p + 1), line: s.sc.lines[+k.slice(p + 1)] } : null; };

/* ---------- 保存 ---------- */
const KEY = 'eigoroad_save';
const DEF = () => ({ v: 1, speed: 1, voice: '', multi: true, useSR: false, srBoth: false, cue: true, scenes: {}, lines: {}, days: {}, bench: [], boss: [], checked: false });
let S = load();
function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && j.v === 1) return Object.assign(DEF(), j); } catch (e) {}
  return DEF();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }
function dayRec() { const k = today(); if (!S.days[k]) { S.days[k] = { rt: [], dOk: 0, dTot: 0, qO: 0, qM: 0, qX: 0 }; setTimeout(() => { gainExp(20); toast('今日はじめての練習 +20 EXP'); }, 50); } return S.days[k]; }
function scRec(id) { return S.scenes[id] || (S.scenes[id] = {}); }
function streak() {
  let n = 0, k = today();
  if (!S.days[k]) k = addDays(k, -1);
  while (S.days[k]) { n++; k = addDays(k, -1); }
  return n;
}
function dueKeys() { const t = today(); return Object.keys(S.lines).filter(k => S.lines[k].d <= t && lineByKey(k)); }
// 場面の種類：main=本編（章の解放に必要）／side=寄り道／talk=じっくり聞く（聞き取り専用）
const kindOf = sc => sc.kind || 'main';
const mainsOf = ch => ch.scenes.filter(sc => kindOf(sc) === 'main');
function sceneStars(id) {
  const r = S.scenes[id]; if (!r || !r.clear) return 0;
  const sc = sceneById(id)?.sc;
  let n = 1; if ((r.dictBest || 0) >= STAR_DICT) n++;
  if (sc && kindOf(sc) === 'talk') { if (r.quizFirst) n++; } else if (r.quickBest != null && r.quickBest <= STAR_RT) n++;
  return n;
}
function chapterClear(ch) { const m = mainsOf(ch); return m.length && m.every(sc => S.scenes[sc.id]?.clear && (!sc.boss || S.scenes[sc.id]?.boss)); }
function rank() {
  let r = '留学生';
  for (const ch of CHAPTERS) { if (!ch.scenes.length) break; r = ch.rank; if (!chapterClear(ch)) return r; r = ch.rank + '（第' + ch.id + '章クリア）'; }
  return r;
}

/* ---------- 読み上げ ---------- */
const TTS = { ok: 'speechSynthesis' in window, voices: [] };
const nl = l => (l || '').replace('_', '-').toLowerCase();
function loadVoices() { if (TTS.ok) TTS.voices = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang)); }
if (TTS.ok) { loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', () => { loadVoices(); if (V.name === 'settings') render(); }); }
function mainVoice() { const v = TTS.voices; return v.find(x => x.name === S.voice) || v.find(x => nl(x.lang) === 'en-us') || v[0] || null; }
function voiceFor(who) {
  const c = CHARS[who] || CHARS.me, main = mainVoice();
  if (!S.multi || who === 'me') return { v: main, p: 1 };
  for (const a of c.acc) { const f = TTS.voices.find(x => nl(x.lang) === a.toLowerCase() && x !== main); if (f) return { v: f, p: 1 }; }
  return { v: main, p: c.pitch };
}
let speakTok = 0;
function speak(text, who = 'me', mul = 1) {
  return new Promise(res => {
    if (!TTS.ok) { res(false); return; }
    const tok = ++speakTok; SPK.who = who;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\bA\/B\b/g, 'A B')); // 「A/B」を「A スラッシュ B」と読ませない

const STOP = new Set('this that with have from they them then than what when where which will would could should there their about just your into been were also very much some here does like over only well'.split(' '));
function makeCloze(en) {
  const toks = en.split(/(\s+)/); const cand = []; let wc = 0;
  toks.forEach((t, i) => {
    if (!t || /^\s+$/.test(t)) return; wc++;
    const m = t.match(/^([^A-Za-z]*)([A-Za-z]+)([^A-Za-z]*)$/);
    if (!m || wc === 1) return;
    const core = m[2];
    if (core[0] !== core[0].toLowerCase() || core.length < 4 || STOP.has(core.toLowerCase())) return;
    cand.push({ ti: i, pre: m[1], core, post: m[3] });
  });
  const n = Math.min(cand.length, wc <= 7 ? 1 : wc <= 13 ? 2 : 3);
  for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
  const blanks = cand.slice(0, n).sort((a, b) => a.ti - b.ti);
  return { toks, blanks };
}

function pickActs(st, allKeys, isWrong, start) {

function judge(mark) {

function lineChart(pts, o) {
  const W = 320, H = 150, P = { l: 34, r: 10, t: 12, b: 22 };
  if (pts.length < 2) return `<p class="small">2日以上記録がたまるとグラフが出ます。</p>`;
  const ys = pts.map(p => p.y);
  const yMin = o.yMin ?? Math.min(...ys), yMax = o.yMax ?? Math.max(...ys);
  const rg = (yMax - yMin) || 1;
  const X = i => P.l + i * (W - P.l - P.r) / (pts.length - 1);
  const Y = y => P.t + (1 - (y - yMin) / rg) * (H - P.t - P.b);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const ticks = [yMin, (yMin + yMax) / 2, yMax];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#ffffff22"/><text x="${P.l - 4}" y="${Y(t) + 4}" fill="#b3bce6" font-size="10" text-anchor="end">${o.fmt(t)}</text>`).join('')}
<path d="${path}" fill="none" stroke="#ffd23f" stroke-width="2.5"/>
${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="#ffd23f"/>`).join('')}
<text x="${P.l}" y="${H - 6}" fill="#b3bce6" font-size="10">${fmtDate(pts[0].x)}</text>
<text x="${W - P.r}" y="${H - 6}" fill="#b3bce6" font-size="10" text-anchor="end">${fmtDate(pts[pts.length - 1].x)}</text>
</svg>`;
}

<p>${SR ? 'このブラウザは音声認識に対応しています（オンラインで動作）。' : 'このブラウザは音声認識に対応していません。なくても遊べます。'}</p>
${SR ? `<button class="btn" data-a="sr">🗣 「machine learning」と言ってみる</button>
<p>結果：${ok(t.sr)} ${t.srMsg ? `<span class="small">${esc(t.srMsg)}</span>` : ''}</p>
<label class="tg"><input type="checkbox" data-c="useSR" ${S.useSR ? 'checked' : ''}>「まねる」で音声認識を使う（聞き取られなかった単語を「気になるところ」に出す）</label>
<label class="tg"><input type="checkbox" data-c="srBoth" ${S.srBoth ? 'checked' : ''}>録音と同時に音声認識する（試験的。端末によっては録音か認識が失敗します。そのときはオフにすると、認識用にもう一度言う方式になります）</label>
<p class="small">認識エンジンは、ありそうな単語に補正して聞き取るため、発音の判定としては甘めに出ます。</p>` : ''}</div>

<div class="win"><h2>④ 保存</h2>
<button class="btn" data-a="store">💾 保存のテスト</button>
<p>記録：${ok(t.ls)}　録音：${ok(t.idb)} ${t.stMsg ? `<span class="small">${esc(t.stMsg)}</span>` : ''}</p>
<hr>
<p class="small">機種変更に備えて、記録をファイルに書き出せます（録音は含みません）。</p>
<div class="row"><button class="btn" data-a="exp">⬇ 書き出し</button><label class="btn" style="text-align:center">⬆ 読み込み<input type="file" accept=".json,application/json" data-c="imp" hidden></label></div>
<button class="btn red" data-a="reset">記録をすべて消す</button></div>

<div class="win"><h2>クレジット</h2>
<p class="small">教材の英文は、下記の引用を除きこのゲームのオリジナルです。</p>
<p class="small">ウォンバットのドット絵は、同じサイトの「神に愛されたヒメウォンバット」の描画プログラムを使っています。</p>
<p class="small">講義スライドの2文：<a href="${SOURCES.wpOverfit.url}" target="_blank" rel="noopener">${esc(SOURCES.wpOverfit.title)}</a> より引用（${SOURCES.wpOverfit.lic}）。この2文は CC BY-SA 4.0 で利用できます。</p></div>`,
    acts: {
      voice: b => { S.voice = b.value; save(); },
      speed: b => { S.speed = +b.value; const e = $('#spv'); if (e) e.textContent = S.speed.toFixed(2) + '倍'; },
      speedSet: () => save(),
      multi: b => { S.multi = b.checked; save(); },
      sfx: b => { S.sfx = b.checked; save(); if (b.checked) sfx('ok'); },
      useSR: b => { S.useSR = b.checked; save(); },
      srBoth: b => { S.srBoth = b.checked; save(); },
      tts: async () => { t.tts = true; S.checked = true; save(); render(); await speak("Hi, I'm Priya. Let me show you around the lab.", 'priya'); await speak('Today, we are going to talk about overfitting.', 'miller'); },
      ttsNg: () => { t.tts = false; render(); },
      mic: async () => {
        stopAll(); V.recording = true; t.micMsg = ''; render();
        try {
          const r = await startRec({ calib: 0, max: 3000, onLevel: meterUpdate }).done;
          V.recording = false;
          if (r.blob) { t.mic = true; S.checked = true; save(); render(); await playBlob(r.blob); }
          else { t.mic = false; t.micMsg = '録音データが空でした'; render(); }
        } catch (e) { V.recording = false; t.mic = false; t.micMsg = (e.name === 'NotAllowedError' ? 'マイクの使用が許可されていません。' : '') + (e.message || e.name); render(); }
      },
      sr: async () => { t.srMsg = '🎤 どうぞ…'; render(); const r = await recognize(); if (r.text != null) { t.sr = true; t.srMsg = '「' + r.text + '」'; } else { t.sr = false; t.srMsg = SR_ERR[r.err] || r.err; } render(); },
      store: async () => {
        t.stMsg = '';
        try { localStorage.setItem('eigoroad_test', '1'); t.ls = localStorage.getItem('eigoroad_test') === '1'; localStorage.removeItem('eigoroad_test'); } catch (e) { t.ls = false; }
        try { await idbPut('test', new Blob(['x'])); const b = await idbGet('test'); t.idb = !!b; await idbDel('test'); } catch (e) { t.idb = false; t.stMsg = e.message; }
        render();
      },
      exp: () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }));
        a.download = 'english-road-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      },
      imp: b => {
        const f = b.files[0]; if (!f) return;
        f.text().then(s => { const j = JSON.parse(s); if (!j || j.v !== 1 || typeof j.days !== 'object') throw new Error('形式が違います'); if (!confirm('今の記録を、読み込んだ記録で置き換えます。よろしいですか？')) return; S = Object.assign(DEF(), j); save(); alert('読み込みました'); go('title'); })
          .catch(e => alert('読み込めませんでした：' + e.message));
      },
      reset: () => { if (confirm('記録をすべて消します（録音も消えます）。よろしいですか？')) { S = DEF(); save(); try { indexedDB.deleteDatabase('eigoroad_audio'); DB = null; } catch (e) {} go('title'); } },
    },
  };
};

render();
</script>
</body>
</html>
