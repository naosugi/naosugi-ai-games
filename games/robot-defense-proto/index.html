<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROBOT DEFENSE（試作）</title>
<style>
:root{color-scheme:dark;--bg:#050a1c;--panel:#0d1830;--panel2:#132544;--line:#2f4c74;--fg:#eef7ff;--dim:#9fb6d6;--cyan:#65f6ff;--blue:#4dabff;--red:#ff4d6d;--gold:#ffd166;--green:#7dffa8;--orange:#ffa94d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;font-size:14px}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button.primary{background:linear-gradient(180deg,#1d6aa0,#14467a);border-color:var(--cyan);font-weight:700}
button.ghost{background:transparent}
a{color:var(--cyan)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.dim{color:var(--dim);font-size:12px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 10px) 8px calc(env(safe-area-inset-left) + 10px);background:linear-gradient(#050a1cf2 70%,#050a1c00);z-index:5;display:flex;flex-direction:column;gap:6px}
#hud .back{font-size:12px;text-decoration:none}
#hud .ttl{font-weight:800;letter-spacing:.06em;font-size:13px}
#hud .ttl small{color:var(--dim);font-weight:400;letter-spacing:0}
@media (max-width:480px){#hud .ttl{display:none}}
#hud .back{white-space:nowrap}
#hud button{padding:4px 10px;font-size:13px;min-width:40px}
.stats{gap:10px;font-variant-numeric:tabular-nums}
.st{display:flex;align-items:center;gap:4px;white-space:nowrap}
.st b{font-size:16px}
#hTime.low{color:var(--red)}
#hGoal{font-size:13px;color:var(--gold);font-weight:700}
#hPts.goalok{color:var(--gold)}
.item.stage{margin-bottom:2px}
.goalline{color:var(--gold);font-size:12px;margin-top:3px}
#ovCard .list{max-height:62vh;overflow-y:auto;touch-action:pan-y}
.basebar{flex:1;min-width:60px;height:10px;border-radius:5px;background:#1a2440;overflow:hidden;border:1px solid var(--line)}
.basebar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s}
.basebar.hurt i{background:linear-gradient(90deg,#ff4d6d,#ffa94d)}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 72px);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:6}
.toast{background:#0a1328d9;border-left:3px solid var(--cyan);border-radius:4px;padding:2px 8px;font-size:12px;line-height:1.5;transition:opacity .4s,transform .4s;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast:not(:first-child){opacity:.75;font-size:11px}
.toast.good{border-left-color:var(--green)}
.toast::before{content:"📡 ";opacity:.8}
.toast.warn{border-left-color:var(--gold)}
.toast.bad{border-left-color:var(--red)}
.toast.out{opacity:0;transform:translateY(-6px)}
#floats{position:fixed;inset:0;pointer-events:none;z-index:4}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;color:var(--gold);font-size:13px;text-shadow:0 1px 3px #000;animation:fl .8s ease-out forwards}
@keyframes fl{to{transform:translate(-50%,-160%);opacity:0}}
#hitFlash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 60px #ff2d55;opacity:0;transition:opacity .35s;z-index:3}
#hitFlash.on{opacity:1;transition:none}

/* ロボット番号 */
#tags{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.tag{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:#0d1830;border:2px solid var(--cyan);color:var(--cyan);font-size:12px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums;will-change:transform}
.tag.on{background:var(--gold);border-color:var(--gold);color:#04142a}
.tag.hurt{border-color:var(--red);color:var(--red)}
.tag.on.hurt{color:#04142a}
.num{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:50%;background:var(--cyan);color:#04142a;font-size:11px;font-weight:800;margin-right:4px;padding:0 3px}
.rcard.on .num{background:var(--gold)}

/* 前線拠点の名前 */
.tag.op{border-radius:4px;border-color:var(--dim);color:var(--dim);width:22px}
.tag.op.mine{border-color:var(--cyan);color:var(--cyan);background:#0d2a40}
.tag.op.en{border-color:var(--red);color:var(--red);background:#2a0d18}
/* 画面端の敵方向表示 */
#edges{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.edge{position:absolute;left:0;top:0;width:34px;height:34px;display:grid;place-items:center}
.edge i{position:absolute;inset:0;background:#ff4d6d;clip-path:polygon(100% 50%,74% 28%,74% 72%)}
.edge b{position:relative;width:22px;height:22px;border-radius:50%;background:#ff4d6de6;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800;border:1px solid #fff6}
.edge.boss i{background:#ffd166}.edge.boss b{background:#ffd166;color:#04142a;font-size:8px}
.edge.art i{background:#ffa94d}.edge.art b{background:#ffa94d;color:#04142a}
/* 建造ライン・進化パーツ・報酬 */
.linebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin:4px 0 2px}
.item.evo{border-color:#b48cff}
.evotag{font-size:10px;color:#d8c4ff;border:1px solid #b48cff;border-radius:4px;padding:0 4px}
.reward{font-size:12px;color:var(--gold);margin-top:3px}
.reward.got{color:var(--green)}
/* 出撃地点 */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:16px;font-size:13px}
.chip.on{border-color:var(--cyan);background:#16345a;box-shadow:0 0 0 1px var(--cyan) inset}

/* 稼働中ロボット一覧 */
#roster{position:fixed;right:0;top:90px;z-index:7;display:flex;align-items:flex-start;max-height:60%;padding-right:env(safe-area-inset-right)}
#rosterTab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 5px;border-radius:10px 0 0 10px;border-right:none;background:#0d1830e8;min-width:40px;font-size:13px}
#rosterTab .pips{display:flex;flex-direction:column;gap:3px;width:26px}
#rosterTab .pips i{display:block;height:4px;border-radius:2px;background:var(--cyan);min-width:2px}
#rosterTab .pips i.on{background:var(--gold)}
#rosterTab .arr{color:var(--dim);font-size:11px}
#roster.open .arr{transform:scaleX(-1)}
#rosterList{display:none;flex-direction:column;gap:5px;width:164px;max-height:100%;overflow-y:auto;padding:6px;background:#0d1830ee;border:1px solid var(--line);border-right:none;border-radius:0 0 0 10px;touch-action:pan-y}
#roster.open #rosterList{display:flex}
#roster.open #rosterList:empty{display:none}
#roster.open #rosterTab .pips{display:none}
.rcard{text-align:left;padding:5px 7px;border-radius:8px;font-size:12px;width:100%}
.rcard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.rcard .rn{display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden}
.rcard .rn b{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.rcard .rb{height:5px;border-radius:3px;background:#1a2440;margin:4px 0 3px;overflow:hidden}
.rcard .rb i{display:block;height:100%;background:var(--cyan)}
.rcard .rb i.low{background:var(--red)}
.rcard .rs{color:var(--dim);font-size:11px}
.rcard .rs.bad{color:var(--red)} .rcard .rs.fight{color:var(--gold)} .rcard .rs.move{color:var(--cyan)}

/* 下部 */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:4px calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 10px);background:linear-gradient(#050a1c00,#050a1ce6 40%);z-index:5;display:flex;flex-direction:column;gap:4px}
#info{min-height:16px;font-size:12px;color:var(--dim);text-align:center}
#info b{color:var(--fg)}
#info.sel{color:var(--cyan)}
#queue{display:flex;gap:6px;overflow:hidden;flex:1;min-width:0}
.qchip{position:relative;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;overflow:hidden;max-width:46%}
.qchip i{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan)}
.qchip.wait{opacity:.6}
#buildBtn{padding:10px 16px;font-size:15px;font-weight:800;flex:0 0 auto}

/* 時間停止中 */
canvas#c{transition:filter .2s}
canvas#c.frozen{filter:saturate(.35) brightness(.55)}
canvas#c.slowmo{filter:saturate(.75) hue-rotate(-12deg) brightness(.92)}
#info .slow{display:inline-block;background:var(--cyan);color:#04142a;border-radius:4px;padding:0 5px;margin-right:6px;font-weight:800;font-size:11px}
.qchip.ready{border-color:var(--gold)}
.qchip.ready i{background:var(--gold)}
/* 告知バナー */
.banner{position:fixed;left:0;right:0;top:38%;z-index:8;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transform:scale(1.15);transition:opacity .3s,transform .3s;padding:14px 0;background:linear-gradient(90deg,transparent,#050a1ccc 20%,#050a1ccc 80%,transparent)}
.banner.show{opacity:1;transform:none}
.banner b{font-size:26px;letter-spacing:.12em;color:var(--cyan);text-shadow:0 0 12px #65f6ff99}
.banner span{font-size:13px;color:var(--fg)}
.banner.boss{background:repeating-linear-gradient(135deg,#3a0a14d9 0 14px,#1a0408d9 14px 28px)}
.banner.boss b{color:var(--red);text-shadow:0 0 14px #ff4d6daa;animation:blink .4s steps(2) infinite}
.banner.good b{color:var(--gold);text-shadow:0 0 14px #ffd166aa}
@keyframes blink{50%{opacity:.4}}
/* 連続撃破 */
#combo{position:fixed;right:calc(env(safe-area-inset-right) + 54px);top:calc(env(safe-area-inset-top) + 140px);z-index:6;pointer-events:none;text-align:right;opacity:0;transition:opacity .25s}
#combo.show{opacity:1}
#combo b{display:block;font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 2px 6px #000,0 0 12px #ffd16688;font-variant-numeric:tabular-nums;animation:pop .25s}
#combo.big b{font-size:40px;color:#fff;text-shadow:0 0 16px #ffd166,0 2px 6px #000}
#combo span{font-size:13px;font-weight:800;color:var(--gold);text-shadow:0 1px 3px #000}
@keyframes pop{from{transform:scale(1.4)}to{transform:none}}
/* 武器の格子 */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wcard{text-align:left;padding:7px 8px;border-radius:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wcard.on{border-color:var(--cyan);background:#16345a;box-shadow:0 0 0 1px var(--cyan) inset}
.wcard.evo{border-color:#b48cff}
.wcard.evo.on{box-shadow:0 0 0 1px #b48cff inset}
.wcard .wn{display:flex;align-items:center;gap:5px;min-width:0}
.wcard .wn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .ws{display:flex;gap:8px;font-size:12px;color:var(--dim);align-items:center}
.wcard .wd{font-size:10.5px;color:var(--dim);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wcard.dis{opacity:.45}
.wcard.on .chk{background:var(--cyan);color:#04142a;border-color:var(--cyan)}

/* モーダル */
.modal{position:fixed;inset:0;display:none;background:#020510b0;z-index:20;justify-content:center;align-items:flex-end}
.modal.center{align-items:center;padding:16px}
.modal.show{display:flex}
.card{width:min(520px,100%);max-height:94%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.sheet{border-radius:16px 16px 0 0;padding-bottom:calc(env(safe-area-inset-bottom) + 14px);touch-action:pan-y}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mh b{font-size:17px}
.sec{margin:12px 0 6px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:baseline}
.list{display:flex;flex-direction:column;gap:6px}
.item{text-align:left;padding:8px 10px;border-radius:10px;width:100%}
.item.on{border-color:var(--cyan);background:#16345a;box-shadow:0 0 0 1px var(--cyan) inset}
.item .l1{display:flex;align-items:center;gap:6px}
.item .l1 b{font-size:15px}
.item .l2{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
.item .l2 .plus{color:var(--gold)}
.item .cost{font-weight:800;color:var(--gold)}
.tier{font-size:11px;border-radius:4px;padding:0 5px;border:1px solid}
.tier.low{color:var(--green);border-color:var(--green)}
.tier.mid{color:var(--cyan);border-color:var(--cyan)}
.tier.high{color:var(--gold);border-color:var(--gold)}
.chk{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:12px}
.item.on .chk{background:var(--cyan);color:#04142a;border-color:var(--cyan)}
.foot{position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom) + 14px));margin:12px -16px calc(-1 * (env(safe-area-inset-bottom) + 14px));padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);background:var(--panel);border-top:1px solid var(--line)}
.sum{padding:10px;border-radius:10px;background:#0a1328;border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.sum .err{color:var(--red);margin-top:4px}
.btns{display:flex;gap:8px;margin-top:10px}
.item.dis{opacity:.45}
div.item{background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.chosen{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#0a1328;border:1px solid var(--line);margin-bottom:8px;font-size:13px}
.chosen .l2{color:var(--dim);font-size:12px}
.note{color:var(--gold);font-size:12px;margin-bottom:6px}
.btns button{flex:1;padding:12px}
#ovCard h1{margin:0 0 4px;font-size:24px;letter-spacing:.08em}
#ovCard h1 small{font-size:12px;color:var(--dim);letter-spacing:0;font-weight:400}
#ovCard p{line-height:1.6;margin:8px 0}
#ovCard ul{padding-left:18px;margin:8px 0;line-height:1.7;font-size:13px}
.goal{border:1px solid var(--gold);border-radius:10px;padding:8px 10px;margin:10px 0;color:var(--gold)}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:10px 0;font-variant-numeric:tabular-nums}
.win{color:var(--cyan)} .lose{color:var(--red)}
/* 建造画面のタブ */
.tabs{display:flex;gap:6px;margin:6px 0 4px}
.tabs button{flex:1;padding:9px 6px;font-weight:700;font-size:14px}
.tabs button.on{border-color:var(--cyan);background:#16345a;box-shadow:0 0 0 1px var(--cyan) inset;color:var(--cyan)}
.tabs button.warn small{color:var(--red)}
.tabs small{font-size:11px;color:var(--dim);font-weight:400}
.basest{font-size:12px;color:var(--dim);margin:0 0 6px}
.basest b{color:var(--fg)}
.rsv{background:var(--gold);color:#241800;border-radius:4px;padding:0 5px;font-weight:800;font-size:11px}
#bOrder small{font-weight:400;font-size:12px;opacity:.85}
/* 乗る */
.ride{display:inline-block;padding:2px 8px;font-size:12px;border-radius:7px;border:1px solid var(--cyan);background:#0d2a44;color:var(--cyan);font-weight:700;margin-left:6px}
.rcard .ride{margin-left:auto;padding:0 5px;font-size:12px}
/* 自操作 */
#pilotUI{display:none}
body.piloting #toasts{top:calc(env(safe-area-inset-top) + 150px)}
body.piloting #pilotUI{display:block}
body.piloting #bottom,body.piloting #roster,body.piloting #edges{display:none}
#pTop{position:fixed;left:50%;transform:translateX(-50%);top:90px;z-index:6;display:flex;align-items:center;gap:6px;background:#050a1ccc;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12px;white-space:nowrap;max-width:calc(100% - 20px)}
#pTop b{overflow:hidden;text-overflow:ellipsis}
.pbar{display:inline-block;width:70px;height:6px;border-radius:3px;background:#1a2440;overflow:hidden;flex:0 0 auto}
.pbar i{display:block;height:100%;background:var(--cyan)} .pbar i.low{background:var(--red)}
.pbar.sh{width:40px} .pbar.sh i{background:#8fd0ff}
#pHint{position:fixed;left:0;right:0;top:124px;text-align:center;font-size:11px;color:var(--dim);pointer-events:none;z-index:5;text-shadow:0 1px 3px #000}
#xhair{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #65f6ff88;border-radius:50%;pointer-events:none;z-index:4}
#xhair::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#65f6ffaa;border-radius:50%}
#lockMk{position:fixed;left:0;top:0;pointer-events:none;z-index:5;display:none;will-change:transform}
#lockMk i{display:block;width:40px;height:40px;margin:0 auto;border:2px solid var(--gold);transform:rotate(45deg);opacity:.7}
#lockMk.in i{opacity:1;box-shadow:0 0 10px #ffd166;animation:lk .5s ease-in-out infinite alternate}
#lockMk.off i{width:22px;height:22px}
#lockMk span{display:block;text-align:center;font-size:11px;color:var(--gold);font-weight:800;margin-top:4px;text-shadow:0 1px 3px #000;white-space:nowrap}
@keyframes lk{to{transform:rotate(45deg) scale(.82)}}
#radar{position:fixed;left:calc(env(safe-area-inset-left) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);width:128px;height:128px;z-index:6;border-radius:50%;touch-action:none}
#pSide{position:fixed;right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:stretch;width:min(46vw,200px)}
#pWeap{display:flex;flex-direction:column;gap:3px}
.pw{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 4px;gap:1px 6px;background:#050a1ccc;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:11px}
.pw .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw b{font-weight:700;color:var(--dim);grid-row:1;grid-column:2}
.pw .pc{grid-column:1/3;background:#1a2440;border-radius:2px;overflow:hidden}
.pw .pc i{display:block;height:100%;background:var(--cyan)}
.pw.lk{border-color:var(--gold)} .pw.lk b{color:var(--gold)} .pw.lk .pc i{background:var(--gold)}
#pBtns{display:grid;grid-template-columns:1fr auto;gap:6px}
#pBtns button{padding:10px 8px;font-weight:800}
#pExit{grid-column:1/3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hitFlash"></div>
<div id="floats"></div>
<div id="tags"></div>
<div id="edges"></div>
<div id="banner" class="banner"></div>
<div id="combo"></div>
<div id="hud">
  <div class="row"><a class="back" href="../../">← ゲーム一覧</a><span class="ttl">ROBOT DEFENSE <small>試作</small></span><span class="sp"></span><button id="muteBtn" title="音">🔊</button><button id="viewBtn" title="全体表示">⤢</button><button id="spdBtn">×1</button><button id="pauseBtn">Ⅱ</button></div>
  <div class="row stats">
    <span class="st">⏱<b id="hTime">2:00</b></span>
    <span class="st" id="hGoal" style="display:none"></span>
    <span class="st">⭐<b id="hPts">0</b></span>
    <span class="st">🤖<b id="hBots">0/5</b></span>
    <span class="st" style="flex:1">🏠<span class="basebar" id="hBaseBar"><i id="hBase" style="width:100%"></i></span><b id="hBaseN">100</b></span>
  </div>
</div>
<div id="toasts"></div>
<div id="roster"><button id="rosterTab"><span>🤖<b id="rTabN">0</b></span><span class="pips" id="rTabPips"></span><span class="arr">◂</span></button><div id="rosterList"></div></div>
<div id="bottom">
  <div id="info">ロボットをタップ → 移動先をタップ</div>
  <div class="row"><div id="queue"></div><button id="buildBtn" class="primary">🔧 建造</button></div>
</div>

function makePath(p) {
  const segs = []; let L = 0;
  for (let i = 0; i < p.length - 1; i++) {
    const [ax, az] = p[i], [bx, bz] = p[i + 1], len = Math.hypot(bx - ax, bz - az);
    segs.push({ ax, az, bx, bz, len, d0: L, ux: (bx - ax) / len, uz: (bz - az) / len }); L += len;
  }
  return { segs, len: L, pts: p };
}
function pathPos(P, d, off) {
  let s = P.segs[P.segs.length - 1];
  for (const g of P.segs) if (d < g.d0 + g.len) { s = g; break; }
  const t = clamp(d - s.d0, 0, s.len);
  return { x: s.ax + s.ux * t - s.uz * off, z: s.az + s.uz * t + s.ux * off, dx: s.ux, dz: s.uz };
}

function buildCost(body, wids) {

  for (const w of wids) { cost += WEAPONS[w].cost; time += WEAPONS[w].build * (body.wbMul || 1); }

  return { cost, time };

}

function workCost(S, id) { const w = WORKS[id]; return w.cost + (w.costUp || 0) * (S.works[id] || 0); }
function workCheck(S, id) {

  if (w.max && (S.works[id] || 0) >= w.max) return '最大まで強化済みです';

function makeRobot(S, q) {
  const b = q.body, p = b.plus, op = S.outposts[q.at];

    S.fx.push({ type: 'robodie', x: op.x, z: op.z });

    return null;
  }

  // 自拠点から出るときは拠点に重なる位置、陣地から出るときは陣地の上
  const a = rnd(0, Math.PI * 2), f = op ? { x: op.x + Math.sin(a) * .8, z: op.z + Math.cos(a) * .8 } : { x: S.home.x + Math.sin(a) * 1.6, z: S.home.z + Math.cos(a) * 1.6 };

    hp: b.hp, maxHp: b.hp, spd: b.speed, shield: b.shield || 0, maxShield: b.shield || 0,
    dmgMul: 1 + (p.dmg || 0), rateMul: 1 + (p.rate || 0), crit: p.crit || 0, ptsMul: 1 + (p.pts || 0), rangeMul: 1 + (p.range || 0),
    weapons: q.wids.map(w => ({ id: w, def: WEAPONS[w], cd: rnd(0, .3) })),
    face: Math.PI, moving: false, warned: false, dead: false, flash: 0, fireT: -9, hitT: -9,
  };
  r.tx = r.x; r.tz = r.z;
  S.robots.push(r); S.built++; S.fx.push({ type: 'spawn', x: r.x, z: r.z, id: r.id });
  say(S, '🔧 ' + r.name + ' 完成' + (op && op.owner === 'p' ? '（陣地' + op.label + 'から出撃）' : ''));

function moveRobot(r, x, z, S) {
  const m = S ? S.st.map : null;
  r.tx = m ? clamp(x, m.minX, m.maxX) : x; r.tz = m ? clamp(z, m.minZ, m.maxZ) : z;
}

function nearest(list, x, z, range, extraR) {
  let best = null, bd = Infinity;
  for (const e of list) {
    if (e.dead) continue;
    const rr = range + (extraR ? e.r : 0), d = (e.x - x) ** 2 + (e.z - z) ** 2;
    if (d <= rr * rr && d < bd) { bd = d; best = e; }
  }
  return best;
}
// 着弾時点の自分の位置（移動先へ直進すると仮定）が爆風の外にあるか
function blastSafe(r, tg, d) {
  const t = Math.hypot(tg.x - r.x, tg.z - r.z) / d.speed + .1;
  const dx = r.tx - r.x, dz = r.tz - r.z, dist = Math.hypot(dx, dz), m = Math.min(dist, r.spd * t);
  const px = dist > 0 ? r.x + dx / dist * m : r.x, pz = dist > 0 ? r.z + dz / dist * m : r.z;
  return Math.hypot(tg.x - px, tg.z - pz) >= d.blast + CFG.missileSafety;
}
function densest(list, x, z, range, rad, minDist) {
  let best = null, bc = 0;
  for (const e of list) {
    if (e.dead) continue;
    const dd = (e.x - x) ** 2 + (e.z - z) ** 2;
    if (dd > range * range || dd < minDist * minDist) continue;
    let c = 0; for (const o of list) if (!o.dead && (o.x - e.x) ** 2 + (o.z - e.z) ** 2 <= rad * rad) c++;
    if (c > bc) { bc = c; best = e; }
  }
  return best;
}

// 範囲ダメージ。味方側の爆発は敵・敵拠点・味方ロボットに当たる。敵側の爆発はロボットにだけ当たる
function blast(S, x, z, rad, dmg, owner, team) {
  if (team === 'e') {
    for (const r of S.robots) if (!r.dead && Math.hypot(r.x - x, r.z - z) <= rad + CFG.robotR) hurtRobot(S, r, dmg, null);
    if (Math.hypot(S.home.x - x, S.home.z - z) <= rad + S.home.r) hurtHome(S, dmg, x, z);
  } else {
    for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - x, e.z - z) <= rad + e.r) hurtEnemy(S, e, dmg, owner, true);
    for (const b of S.ebases) if (!b.dead && Math.hypot(b.x - x, b.z - z) <= rad + b.r) hurtEbase(S, b, dmg);
    for (const r of S.robots) if (!r.dead && Math.hypot(r.x - x, r.z - z) <= rad + CFG.robotR) hurtRobot(S, r, dmg * CFG.friendlyFire, owner);
  }
  S.fx.push({ type: 'blast', x, z, rad, team: team || 'p' });
}
function hurtEnemy(S, e, dmg, owner, noArmor) {
  if (e.dead) return;
  if (e.def.armor && !noArmor) dmg = Math.max(dmg * CFG.armorFloor, dmg - e.def.armor);
  e.hp -= dmg; e.flash = .08;

// ---------- 画面端の敵方向表示：画面外にいる、拠点に迫る敵の方向と数 ----------
const edgeEls = [], pv = new T.Vector3();
function updEdges() {
  const box = $('edges'); let used = 0;
  if (S && mode === 'play' && !pilot) {
    const W = innerWidth, H = innerHeight, top = $('hud').offsetHeight + 8, bot = H - $('bottom').offsetHeight - 8, l = 10, r = W - 10;
    const cx = W / 2, cy = (top + bot) / 2, buckets = new Map();
    for (const e of S.enemies) {
      const dh = Math.hypot(e.x - S.home.x, e.z - S.home.z), boss = e.def.boss, art = e.def.artillery && e.firing;
      if (!boss && !art && !e.def.fly && dh > 16 && !e.atBase) continue; // 拠点に迫っていない敵は出さない
      pv.set(e.x, .5, e.z).project(cam);
      const px = (pv.x + 1) / 2 * W, py = (1 - pv.y) / 2 * H;
      if (px > l && px < r && py > top && py < bot) continue;
      const a = Math.atan2(py - cy, px - cx), k = Math.round(a / (Math.PI / 12));
      const b = buckets.get(k) || { a, n: 0, boss: false, art: false }; b.n++; b.boss = b.boss || boss; b.art = b.art || art; buckets.set(k, b);
    }
    for (const b of buckets.values()) {
      const ux = Math.cos(b.a), uy = Math.sin(b.a), hw = (r - l) / 2 - 14, hh = (bot - top) / 2 - 14;
      const t = Math.min(Math.abs(hw / (ux || 1e-6)), Math.abs(hh / (uy || 1e-6)));
      let el = edgeEls[used]; if (!el) { el = document.createElement('div'); el.className = 'edge'; el.innerHTML = '<i></i><b></b>'; box.appendChild(el); edgeEls.push(el); }
      el.style.display = ''; el.style.transform = 'translate(' + (cx + ux * t) + 'px,' + (cy + uy * t) + 'px) translate(-50%,-50%)';
      el.firstChild.style.transform = 'rotate(' + b.a + 'rad)';
      el.lastChild.textContent = b.boss ? 'BOSS' : b.art ? '砲' : b.n;
      el.className = 'edge' + (b.boss ? ' boss' : b.art ? ' art' : '');
      used++;

  }
  for (let i = used; i < edgeEls.length; i++) edgeEls[i].style.display = 'none';
}

// ---------- 音（WebAudio で合成。音声ファイルは使わない） ----------
const AU = (() => {

      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (_) { ctx = null; }

  // 同じ音が短い間に重なりすぎないようにする
  const ok = (key, gap) => { if (!ctx || muted) return false; const t = ctx.currentTime; if (last[key] !== undefined && t - last[key] < gap) return false; last[key] = t; return true; };

    g.gain.setValueAtTime(o.v || .3, t); g.gain.exponentialRampToValueAtTime(.0008, t + d);
    src.connect(f); f.connect(g); g.connect(o.dest || sfx); src.start(t, Math.random() * .5); src.stop(t + d + .02);
  }
  const notes = (arr, step, o) => arr.forEach((f, i) => tone(Object.assign({ f, at: i * step }, o)));
  const S = {
    shot(k) {

      else if (k === 'h') { if (ok('shoth', .1)) { tone({ f: 160, f2: 50, d: .22, type: 'square', v: .14 }); noise({ d: .12, v: .15, lp: 3000 }); } }
      else if (k === 's') { if (ok('shots', .07)) noise({ d: .08, v: .1, lp: 5000, lp2: 1200 }); }

    blast(big) { if (!ok(big ? 'blastB' : 'blast', big ? .1 : .06)) return; noise({ d: big ? .7 : .35, v: big ? .5 : .28, lp: big ? 900 : 1600, lp2: 120 }); tone({ f: big ? 80 : 110, f2: 35, d: big ? .6 : .3, type: 'sine', v: big ? .5 : .3 }); },
    kill(small) { if (!ok(small ? 'killS' : 'kill', small ? .035 : .05)) return; tone({ f: small ? 1600 + Math.random() * 400 : 900, f2: small ? 900 : 300, d: small ? .04 : .08, type: 'triangle', v: small ? .035 : .07 }); },
    built() { if (ok('built', .3)) notes([523, 659, 784, 1047], .06, { d: .12, type: 'triangle', v: .09 }); },
    lost() { if (ok('lost', .3)) { tone({ f: 600, f2: 120, d: .45, type: 'sawtooth', v: .1 }); noise({ d: .4, v: .2, lp: 1200, lp2: 200 }); } },
    alarm() { if (ok('alarm', 1.4)) { tone({ f: 880, d: .14, type: 'square', v: .07 }); tone({ f: 660, d: .14, type: 'square', v: .07, at: .16 }); } },
    boss() { if (ok('boss', 2)) for (let i = 0; i < 3; i++) tone({ f: 330, f2: 660, d: .45, type: 'sawtooth', v: .1, at: i * .5 }); },
    capture() { if (ok('cap', .5)) notes([392, 523, 659], .08, { d: .15, type: 'square', v: .06 }); },
    combo(n) { if (ok('combo', .25)) tone({ f: 400 + Math.min(n, 60) * 18, d: .12, type: 'triangle', v: .08 }); },
    ui() { if (ok('ui', .04)) tone({ f: 1400, d: .03, type: 'square', v: .03 }); },

})();

const PMAX = 2200, parts = [], pCol = new T.Color();

function burst(x, z, color, n, spd, size, life, y = .6, up = 1) {
  for (let i = 0; i < n && parts.length < PMAX; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (.4 + Math.random() * .8);
    parts.push({ x, y, z, vx: Math.sin(a) * v, vy: (1 + Math.random() * 2) * up, vz: Math.cos(a) * v, life: life * (.6 + Math.random() * .6), max: life, size: size * (.6 + Math.random() * .7), color, g: up ? 9 : 0 });
  }
}
function flash(x, z, color, size, life, y = .7) { if (parts.length < PMAX) parts.push({ x, y, z, vx: 0, vy: 0, vz: 0, life, max: life, size, color, g: 0, flash: true }); }
function updParts(dt) {
  let n = 0;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    p.vy -= p.g * dt; p.x += p.vx * dt; p.y = Math.max(.05, p.y + p.vy * dt); p.z += p.vz * dt;
    const k = p.life / p.max, s = p.flash ? p.size * (.4 + k) : p.size * (.3 + .7 * k);
    dummy.position.set(p.x, p.y, p.z); dummy.rotation.set(p.life * 7, p.life * 5, 0); dummy.scale.setScalar(s); dummy.updateMatrix();
    partMesh.setMatrixAt(n, dummy.matrix); partMesh.setColorAt(n, pCol.setHex(p.color)); n++;

}

function tap(px, py) {

  let best = null, bd = 1.35 ** 2;

    sel = null; updInfo();

}

// ---------- 自操作（乗る）：肩越しの3D視点 ----------

function pilotMove(e) {

  if (gest.type === 'turn' || gest.type === 'pan') { pilot.aimYaw -= (e.clientX - gest.lx) * 2.6 / Math.max(320, innerWidth); pYawT = pilot.aimYaw; }
  gest.lx = e.clientX; gest.ly = e.clientY;

// タップした位置に一番近い敵（画面上で48px以内）をロック。何もなければロック解除
function pilotTap(px, py) {

  let best = null, bd = 48 * 48;
  for (const e of S.enemies.concat(S.ebases)) {
    if (e.dead || Math.hypot(e.x - pilot.x, e.z - pilot.z) > 70) continue;
    PV.set(e.x, e.ebase ? 1.2 : .6, e.z).project(pCam); if (PV.z > 1) continue;
    const d = ((PV.x + 1) / 2 * innerWidth - px) ** 2 + ((1 - PV.y) / 2 * innerHeight - py) ** 2;

function turnTo(yaw) { pYawT = yaw; }
const radar = $('radar'), rctx = radar.getContext('2d'), RADAR_R = 26;
radar.addEventListener('pointerdown', e => { // レーダーをタップ：その方向を向く
  e.stopPropagation(); if (!pilot) return;
  const b = radar.getBoundingClientRect(), rx = e.clientX - b.left - b.width / 2, fz = -(e.clientY - b.top - b.height / 2);
  if (Math.hypot(rx, fz) < 6) return;

function drawRadar() {

  c.strokeStyle = '#2f4c74'; c.lineWidth = 1; c.beginPath(); c.arc(h, h, h - 1, 0, 7); c.arc(h, h, h / 2, 0, 7); c.stroke();

  // 縦長の画面は上が空になりやすいので、少し高く・手前を見下ろす

  $('pShW').style.display = r.maxShield ? '' : 'none'; if (r.maxShield) $('pSh').style.width = Math.max(0, r.shield / r.maxShield * 100) + '%';

        return '<button class="wcard' + (uiWork === id ? ' on' : '') + (err && err !== 'ポイントが足りません' ? ' dis' : '') + '" data-work="' + id + '"><div class="wn"><span class="chk">' + (uiWork === id ? '✓' : '') + '</span><b>' + w.icon + ' ' + esc(w.name) + '</b></div><div class="ws"><span class="cost">⭐' + workCost(S, id) + '</span><span>⏱' + w.build + 's</span>' + (n ? '<span class="rsv">予約中' + (n > 1 ? '×' + n : '') + '</span>' : '') + '</div><div class="wd">' + esc(w.desc) + '</div></button>';
      }).join('') + '</div>';
    const ob = $('bOrder'); ob.style.display = uiTab === 'works' ? '' : 'none';
    if (uiWork) {
      const w = WORKS[uiWork], err = workCheck(S, uiWork), n = qn(uiWork);
      ob.innerHTML = w.icon + ' ' + (n ? 'もう1回頼む' : esc(w.name) + 'を頼む') + ' <small>⭐' + workCost(S, uiWork) + '・' + w.build + '秒</small>';
      ob.disabled = !!err || ob.dataset.lock === '1';
      $('bWorkSum').innerHTML = uiTab === 'works' ? (err ? '<div class="err">' + esc(err) + '</div>' : n ? '<div class="dim">' + esc(w.name) + 'は予約中' + (n > 1 ? '（' + n + '件）' : '') + '。建造ラインが空くと始まる</div>' : '') : '';
    } else { ob.textContent = '工事を選んでください'; ob.disabled = true; $('bWorkSum').innerHTML = ''; }
    return;
  }
  $('bChosen').innerHTML = bodyRow(uiBody, '', 'on').replace(/^<button/, '<div').replace(/<\/button>$/, '</div>');
  const ops = S.outposts.map((o, i) => [o, i]).filter(([o]) => o.owner === 'p');
  if (uiAt >= 0 && !(S.outposts[uiAt] && S.outposts[uiAt].owner === 'p')) uiAt = -1;
  $('bAt').innerHTML = ops.length ? '<div class="sec">出撃地点</div><div class="chips">' + [['拠点', -1]].concat(ops.map(([o, i]) => ['🚩陣地' + o.label, i])).map(([n, i]) => '<button class="chip' + (uiAt === i ? ' on' : '') + '" data-at="' + i + '">' + n + '</button>').join('') + '</div>' : '';
  const wb = uiBody.wbMul || 1;
  $('wList').innerHTML = Object.entries(WEAPONS).filter(([id, w]) => !w.evo || S.loadout.includes(id)).sort((a, b) => !!b[1].evo - !!a[1].evo).map(([id, w]) =>
    '<button class="wcard' + (uiW.has(id) ? ' on' : '') + (w.evo ? ' evo' : '') + '" data-w="' + id + '">' +
    '<div class="wn"><span class="chk">' + (uiW.has(id) ? '✓' : '') + '</span><b>' + w.icon + ' ' + esc(w.name) + '</b></div>' +
    '<div class="ws"><span class="cost">⭐' + w.cost + '</span><span>⏱+' + Math.round(w.build * wb * 10) / 10 + 's</span>' + (w.evo ? '<span class="evotag">進化</span>' : '') + '</div>' +
    '<div class="wd">' + esc(w.desc) + '</div></button>').join('');
  const wids = [...uiW], c = buildCost(uiBody, wids), err = buildCheck(S, uiBody, wids);
  $('bSum').innerHTML = '合計 <b style="color:var(--gold)">⭐' + c.cost + '</b> ・ 建造 <b>' + c.time + 's</b> ・ 出撃 ' + S.robots.length + '/' + CFG.deployCap + ' ・ 予約 ' + S.queue.length + '/' + CFG.queueMax +
    (S.queue.length ? '<div class="dim">建造ライン' + S.lines + '本で順番に建造（予約 ' + S.queue.length + '機）</div>' : '') +
    (err ? '<div class="err">' + esc(err) + '</div>' : '');
  $('bGo').disabled = !!err;
}
$('bodyList').addEventListener('click', e => {
  const b = e.target.closest('[data-b]'); if (!b || b.classList.contains('dis')) return;
  uiBody = S.bodies[+b.dataset.b]; uiW = new Set(); renderBuild(); $('buildM').querySelector('.card').scrollTop = 0;
});
$('wList').addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (!b) return; const id = b.dataset.w; uiW.has(id) ? uiW.delete(id) : uiW.add(id); renderBuild(); });
$('bTabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; uiTab = b.dataset.tab; renderBuild(); });
$('bWorks').addEventListener('click', e => { const b = e.target.closest('[data-work]'); if (!b) return; uiWork = b.dataset.work; renderBuild(); });
$('bOrder').addEventListener('click', () => {
  if (!uiWork) return;
  const err = orderWork(S, uiWork), ob = $('bOrder');

$('bAt').addEventListener('click', e => { const b = e.target.closest('[data-at]'); if (!b) return; uiAt = +b.dataset.at; renderBuild(); });
$('bBack').addEventListener('click', () => { uiBody = null; uiW = new Set(); renderBuild(); });
$('bClose').addEventListener('click', closeBuild);
$('buildM').addEventListener('click', e => { if (e.target === $('buildM')) closeBuild(); });

$('buildBtn').addEventListener('click', openBuild);

// ---------- 画面遷移 ----------
function showOv(html) { $('ovCard').innerHTML = html; $('ov').classList.add('show'); }
function hideOv() { $('ov').classList.remove('show'); }
function titleScreen() {
  mode = 'title';
  showOv(
    '<h1>ROBOT DEFENSE <small>試作版</small></h1>' +
    '<p>前線基地に着任した。補給は届かない。残っている機材を組み合わせて、侵略者の進攻を食い止めろ。</p>' +
    '<ul><li>🔧建造で <b>ボディ1つ＋武器</b> を選ぶ（その間は時間が止まる）</li>' +

    '<li>ロボットは射程内の最寄りの敵を自動で攻撃（敵がいなければ敵拠点）</li>' +
    '<li>敵を倒すとポイント。拠点に取り付いた敵は、倒すまで拠点を攻撃し続ける</li>' +

    '<li>ロボットを選んでいる間は、時間の流れが1/4になる</li>' +
    '<li>🎮乗る（一覧か、選んだロボットの欄）で自操作。肩越し視点で、ドラッグで旋回・敵をタップでロック。連射・威力・射程が上がるが、機体は動かず視界は前方だけ。ほかのロボットへの指示もできない</li>' +
    '<li><b>味方の弾や爆風は味方ロボットにも当たる</b>。範囲攻撃は強力だが、置き場所に注意</li>' +
    '<li>本編の🚩陣地：青は確保済みで、建造時に出撃地点に選べる。灰は中立、赤は敵占領（守備隊を倒して確保）。敵だけが近くにいると奪われる</li>' +
    '<li>地図はスワイプで移動、ピンチで拡大。⤢で全体表示</li></ul>' +
    '<div class="btns"><button class="primary" id="goBtn">ステージ選択へ</button></div>');
  $('goBtn').onclick = stageSelect;
}
function stageEnemies(st) { return [...new Set(st.waves.map(w => w[1]))].map(t => ENEMIES[t].name).join('・'); }
function stageSelect() {
  mode = 'select';
  showOv('<h1>ステージ選択</h1><div class="list">' + STAGES.map((st, i) => (i === 0 ? '<div class="sec">チュートリアル</div>' : st.wide && !STAGES[i - 1].wide ? '<div class="sec">本編 <span class="dim">広い戦場（地図を動かして戦う）</span></div>' : '') +
    '<button class="item stage" data-st="' + st.id + '">' +
    '<div class="l1"><b>' + esc(st.name) + '「' + esc(st.sub) + '」</b><span class="sp"></span><span class="cost">開始⭐' + st.startPoints + '</span></div>' +
    '<div class="goalline">🎯 ' + esc(goalText(st)) + '</div>' +
    '<div class="l2"><span>' + esc(st.intro) + '</span></div>' +
    '<div class="l2"><span>経路 ' + st.paths.length + '本 ・ 敵拠点 ' + (st.ebases || []).length + ' ・ 出現：' + esc(stageEnemies(st)) + '</span></div>' +
    UNLOCKS.filter(u => u.stage === st.id).map(u => '<div class="reward' + (isOpen(u.id) ? ' got' : '') + '">' + (isOpen(u.id) ? '✅ 解禁済み：' : '🎁 クリア報酬：') + WEAPONS[u.id].icon + esc(WEAPONS[u.id].name) + '</div>').join('') + '</button>').join('') +
    '<div class="sec">そのほかの解禁条件</div>' + UNLOCKS.filter(u => !u.stage).map(u => '<div class="reward' + (isOpen(u.id) ? ' got' : '') + '">' + (isOpen(u.id) ? '✅ ' : '🎁 ') + WEAPONS[u.id].icon + esc(WEAPONS[u.id].name) + '：' + esc(u.cond) + (u.swarmKills && !isOpen(u.id) ? '（' + Math.min(SAVE.swarmKills || 0, u.swarmKills) + '/' + u.swarmKills + '）' : '') + '</div>').join('') +
    '</div><div class="btns"><button class="ghost" id="toTitle">タイトル</button><button class="ghost" id="allOpen">全解禁（試作用）</button></div>');
  $('ovCard').querySelectorAll('[data-st]').forEach(b => b.onclick = () => loadoutScreen(b.dataset.st));
  $('allOpen').onclick = () => { for (const u of UNLOCKS) SAVE.unlocked[u.id] = true; saveNow(); stageSelect(); };
  $('toTitle').onclick = titleScreen;
}
// 出撃前：解禁済みの進化パーツから持ち込むものを選ぶ（解禁がなければ飛ばす）
function loadoutScreen(stId) {
  curStage = stId;
  const open = UNLOCKS.map(u => u.id).filter(isOpen);
  if (!open.length) { startGame(stId); return; }
  SAVE.loadout = (SAVE.loadout || []).filter(id => open.includes(id)).slice(0, CFG.loadoutSlots);
  const st = STAGES.find(s => s.id === stId);
  const draw = () => {
    showOv('<h1>持ち込み <small>' + SAVE.loadout.length + '/' + CFG.loadoutSlots + '</small></h1>' +
      '<p class="dim">' + esc(st.name) + '「' + esc(st.sub) + '」へ持ち込む進化パーツを' + CFG.loadoutSlots + 'つまで選ぶ。建造画面で通常の武器と一緒に選べるようになる。</p>' +
      '<div class="list">' + open.map(id => { const w = WEAPONS[id], on = SAVE.loadout.includes(id); return '<button class="item' + (on ? ' on' : '') + '" data-lo="' + id + '"><div class="l1"><span class="chk">' + (on ? '✓' : '') + '</span><b>' + w.icon + ' ' + esc(w.name) + '</b><span class="dim">（' + esc(WEAPONS[w.base].name) + 'の進化）</span><span class="sp"></span><span class="cost">⭐' + w.cost + '</span></div><div class="l2"><span>' + esc(w.desc) + '</span></div></button>'; }).join('') + '</div>' +
      '<div class="btns"><button class="ghost" id="loBack">戻る</button><button class="primary" id="loGo">出撃</button></div>');
    $('ovCard').querySelectorAll('[data-lo]').forEach(b => b.onclick = () => {
      const id = b.dataset.lo, i = SAVE.loadout.indexOf(id);
      if (i >= 0) SAVE.loadout.splice(i, 1); else if (SAVE.loadout.length < CFG.loadoutSlots) SAVE.loadout.push(id); else { SAVE.loadout.shift(); SAVE.loadout.push(id); }
      saveNow(); draw();
    });
    $('loBack').onclick = stageSelect; $('loGo').onclick = () => startGame(stId);
  };
  draw();
}
function startGame(stId) {
  if (stId) curStage = stId;
  exitPilot();
  clearViews(); for (const f of fxs) scene.remove(f.m); fxs.length = 0;
  S = newState(curStage, { loadout: (SAVE.loadout || []).filter(isOpen) }); window.RD_S = S;
  setMapDims(S.st); buildMap(S.st, S.paths);
  ZOOM_START = (S.st.view && S.st.view.zoom) || 1; ZOOM_MAX = Math.max(3, ZOOM_START * 1.6);
  mode = 'play'; paused = false; sel = null; uiBody = null;
  for (const el of rosterEls.values()) el.remove(); rosterEls.clear(); setRoster(false);
  hideOv(); updInfo(); fit(); resetView();
  AU.init(); AU.bgmStart(!!S.st.wide); combo.times = []; combo.n = 0; combo.best = 0; parts.length = 0;
  banner(S.st.name + '「' + S.st.sub + '」', goalText(S.st), 'start', 2.6);
  toast('ボディ ' + S.bodies.length + '種を確保。開始ポイント ' + S.pts + (S.loadout.length ? '。持ち込み：' + S.loadout.map(id => WEAPONS[id].name).join('・') : ''));
}
function endGame() {
  mode = 'over'; closeBuild(); sel = null;
  const newly = checkUnlocks(S, SAVE); saveNow();
  const win = S.over === 'win', g = S.st.goal, fell = S.baseHP <= 0;
  const head = win ? (g === 'points' ? '補給線確保' : g === 'bases' ? '敵拠点制圧' : '防衛成功') : (fell ? '拠点陥落' : '作戦失敗');
  const msg = win ? (g === 'points' ? fmtT(S.t) + ' でポイント目標を達成した。' : g === 'bases' ? fmtT(S.t) + ' で敵拠点をすべて破壊した。' : '時間まで拠点を守り抜いた。')
    : (fell ? fmtT(S.t) + ' 経過時点で拠点が破壊された。' : '時間切れ。目標を達成できなかった。');
  showOv(
    '<h1 class="' + (win ? 'win' : 'lose') + '">' + head + '</h1>' +
    '<p>' + esc(S.st.name) + '「' + esc(S.st.sub) + '」 ' + msg + '</p>' +
    '<div class="res">' +
    '<span>撃破</span><b>' + S.kills + '</b>' +
    (combo.best >= 8 ? '<span>最大連続撃破</span><b>×' + combo.best + '</b>' : '') +
    (S.ebases.length ? '<span>破壊した敵拠点</span><b>' + S.ebKills + ' / ' + S.ebases.length + '</b>' : '') +
    (S.st.waves.some(w => w[1] === 'boss') ? '<span>模倣機（ボス）</span><b>' + (S.bossKilled ? '撃破' : '未撃破') + '</b>' : '') +
    '<span>建造したロボット</span><b>' + S.built + '</b>' +
    '<span>撃破されたロボット</span><b>' + S.lost + '</b>' +
    '<span>自爆</span><b>' + S.bombs + '</b>' +
    '<span>誤射ダメージ / 誤射で撃破</span><b>' + Math.round(S.ffDmg) + ' / ' + S.ffKills + '</b>' +
    '<span>獲得ポイント / 使ったポイント</span><b>' + S.earned + ' / ' + S.spent + '</b>' +
    (g === 'points' ? '<span>所持ポイント / 目標</span><b>' + S.pts + ' / ' + S.st.goalPts + '</b>' : '') +
    '<span>拠点に取り付いた敵 / 拠点への被ダメージ</span><b>' + S.leaked + ' / ' + Math.round(S.baseDmg) + '</b>' +
    '<span>残り拠点HP</span><b>' + Math.ceil(S.baseHP) + ' / ' + CFG.baseHP + '</b></div>' +
    (newly.length ? '<div class="goal">🎁 解禁：' + newly.map(id => WEAPONS[id].icon + esc(WEAPONS[id].name)).join('・') + '<br><span class="dim">次の出撃から持ち込める</span></div>' : '') +
    '<div class="btns"><button class="ghost" id="toSel">ステージ選択</button><button class="primary" id="again">もう一度（ボディ再抽選）</button></div>');
  $('again').onclick = () => loadoutScreen(curStage); $('toSel').onclick = stageSelect;
}
function togglePause() {
  if (mode !== 'play' || building) return;
  paused = !paused;
  if (paused) {
    showOv('<h1>一時停止</h1><div class="btns"><button class="ghost" id="rs">やり直す</button><button class="primary" id="re">再開</button></div>');
    $('re').onclick = togglePause; $('rs').onclick = () => { paused = false; startGame(); };
    $('ovCard').insertAdjacentHTML('beforeend', '<div class="btns"><button class="ghost" id="qs">ステージ選択へ戻る</button></div>'); $('qs').onclick = () => { paused = false; stageSelect(); };
  } else hideOv();
}
$('pauseBtn').addEventListener('click', togglePause);
$('viewBtn').addEventListener('click', toggleView);
const muteLabel = () => { $('muteBtn').textContent = AU.muted ? '🔇' : '🔊'; };
$('muteBtn').addEventListener('click', () => { AU.init(); AU.setMute(!AU.muted); muteLabel(); }); muteLabel();
document.addEventListener('click', e => { if (e.target.closest('button')) { AU.init(); AU.S.ui(); } }, true);
$('spdBtn').addEventListener('click', () => { speed = speed === 1 ? 2 : 1; $('spdBtn').textContent = '×' + speed; });
addEventListener('keydown', e => {
  if (pilot && (e.key === 'ArrowLeft' || e.key === 'a')) turnTo(pYawT + .4); if (pilot && (e.key === 'ArrowRight' || e.key === 'd')) turnTo(pYawT - .4); if (pilot && e.key === 's') turnTo(pYawT + Math.PI);
  if (e.key === 'Escape' || e.key === 'p') togglePause(); if (e.key === 'b' && !building) openBuild(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !paused && !building) togglePause(); });

// ---------- ループ ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'play' && !paused && !building) {
    const rate = sel ? .25 : 1; // ロボットを選んでいる間はスロー
    for (let i = 0; i < speed; i++) step(S, dt * rate);
  }
  if (S) {
    for (const f of S.fx) addFx(f); S.fx.length = 0;
    for (const m of S.msgs) toast(m.text, m.kind); S.msgs.length = 0;
    sync(dt); updHud(); updTags(); updEdges();
    canvas.classList.toggle('slowmo', !!sel && mode === 'play' && !building);
    if (mode === 'play' && S.over) { // 勝敗の告知を見せてから結果画面へ
      exitPilot(); mode = 'ending'; closeBuild(); sel = null; AU.bgmStop();
      const win = S.over === 'win'; if (win) AU.S.win(); else AU.S.lose();
      banner(win ? 'MISSION COMPLETE' : 'MISSION FAILED', win ? '作戦成功' : (S.baseHP <= 0 ? '拠点陥落' : '時間切れ'), win ? 'good' : 'boss', 1.6);
      if (!win) shake(.5, .8);
      setTimeout(endGame, 1500);
    }
  }
  for (const gt of M.gates || []) { gt.rotation.y += dt * 1.5; gt.rotation.x = Math.sin(now / 900) * .3; }
  if (S && M.baseGun) {
    M.baseGun.visible = S.homeGun > 0; M.baseBarrels.forEach((b, i) => b.visible = S.homeGun > i);
    M.baseGun.rotation.y = lerpAngle(M.baseGun.rotation.y, S.homeObj.face || 0, .3);
    M.baseDome.visible = S.homeShield > 0; M.baseDome.material.opacity = .08 + .22 * (S.homeShield / (S.homeShieldMax || 1)) + Math.sin(now / 200) * .03;
  }
  if (M.baseRing) { M.baseRing.position.y = 1.5 + Math.sin(now / 500) * .08; M.baseRing.visible = !pilot; } // 乗っている間は視界の邪魔になるので消す
  if (markerT > 0) { markerT -= dt; marker.material.opacity = Math.max(0, markerT / .6); marker.scale.setScalar(1 + (.6 - markerT)); if (markerT <= 0) marker.visible = false; }
  updFx(dt); updParts(dt); updCombo(dt); updPilot(dt);
  let sx = 0, sz = 0;
  if (shakeT > 0) { shakeT -= dt; const m = shakeMag * Math.max(0, shakeT) * 2 / (pilot ? 4 : camS.zoom || 1); sx = (Math.random() - .5) * m; sz = (Math.random() - .5) * m; cam.position.x += sx; cam.position.z += sz; if (shakeT <= 0) shakeMag = 0; }
  renderer.render(scene, cam);
  if (sx || sz) { cam.position.x -= sx; cam.position.z -= sz; }
}
// 試走・デバッグ用：ワールド座標→画面座標
window.RD_proj = (x, z, y = 0) => { const p = new T.Vector3(x, y, z).project(cam); return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }; };
buildMap(STAGES[0], STAGES[0].paths.map(p => ({ segs: p.slice(1).map((b, i) => { const a = p[i], len = Math.hypot(b[0] - a[0], b[1] - a[1]); return { ax: a[0], az: a[1], bx: b[0], bz: b[1], len, ux: (b[0] - a[0]) / len, uz: (b[1] - a[1]) / len }; }) })));
fit();
titleScreen();
requestAnimationFrame(frame);
})();
