    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = 0.12;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d); o.stop(actx.currentTime + d);
  }catch(e){}
}

function newGame(nh, marks = []){

/* ============ 食べものの つながり ============ */
// ふえられる上限
function capOf(p){
  const others = S.pieces.filter(q => q.st !== p.st).reduce((a, q) => a + q.n, 0);
  let c = MAXN;
  switch(p.st){
    case 'pla': c = 4 + Math.floor(sumN('fun') / 2); break;
    case 'fun': c = 3 + Math.floor(others / 3); break;
    case 'ani': case 'art': case 'ver':
      c = 2 + Math.floor(sumN('pla') * 2 / 3) + (p.traits.includes('fang') ? Math.floor(S.pieces.filter(q => q !== p && isAnimal(q)).reduce((a, q) => a + q.n, 0) / 4) : 0);
      break;
  }
  return Math.max(1, Math.min(MAXN, c));
}
const CAP_AD = {
  pla:'植物は光で栄養をつくりますが、土の栄養には限りがあります。菌類が分解して栄養を土に戻すほど、たくさんふえられます。',
  fun:'菌類の食べものは、落ち葉や死がいです。ほかの生き物が多いほど、たくさんふえられます。',
  ani:'動物は植物などを食べて生きています。植物が多いほど、たくさんふえられます。',
  art:'動物は植物などを食べて生きています。植物が多いほど、たくさんふえられます。「どうぶつを たべる」があると、ほかの動物も食べものになります。',
  ver:'動物は植物などを食べて生きています。植物が多いほど、たくさんふえられます。「どうぶつを たべる」があると、ほかの動物も食べものになります。',
};
// ルーレットの ➕ の目盛りの数
function needOf(k){
  const others = S.pieces.filter(p => p.st !== k).reduce((a, p) => a + p.n, 0);
  switch(k){
    case 'cell': return GROW_SLOTS;
    case 'pla':  return 2 + Math.floor(sumN('fun') / 3);
    case 'opi':  return 1 + Math.floor(sumN('pla') / 3);
    case 'fun':  return 1 + Math.floor(others / 8);
    case 'ani': case 'art': case 'ver': return Math.max(1, Math.floor(sumN('pla') / 3));
  }
  return 1;
}
function targetAlloc(){
  const keys = [...new Set(S.pieces.map(p => p.st))];
  const need = {}; keys.forEach(k => need[k] = needOf(k));
  const tot = keys.reduce((a, k) => a + need[k], 0);
  if(tot > GROW_SLOTS){
    const res = {}; keys.forEach(k => res[k] = 1);
    let rest = GROW_SLOTS - keys.length;
    const raw = keys.map(k => (need[k] - 1) / (tot - keys.length) * rest);
    keys.forEach((k, i) => res[k] += Math.floor(raw[i]));
    rest -= keys.reduce((a, k, i) => a + Math.floor(raw[i]), 0);
    keys.map((k, i) => [k, raw[i] - Math.floor(raw[i])]).sort((a, b) => b[1] - a[1]).slice(0, rest).forEach(([k]) => res[k]++);
    return res;
  }
  if(GROW_SLOTS - tot > 0) need.none = GROW_SLOTS - tot;
  return need;
}
function applyAlloc(){ const before = {...S.alloc}; S.alloc = targetAlloc(); return before; }
// ルーレットの目盛りの並び:同じ系統はまとめ、✨はあいだに入れる
function wheelUnits(alloc){
  const order = ['cell','pla','opi','fun','ani','art','ver'].filter(k => alloc[k]);
  const out = []; let sh = SHINKA_UNITS;
  order.forEach(k => { for(let i = 0; i < alloc[k]; i++) out.push(k); if(sh > 0){ out.push('shinka'); sh--; } });
  for(let i = 0; i < (alloc.none || 0); i++) out.push('none');
  while(sh-- > 0) out.push('shinka');
  return out;
}
const unitIcon = k => k === 'shinka' ? '✨' : k === 'none' ? '・' : stIcon(k);
function pieSVG(alloc, size, id){
  const u = wheelUnits(alloc), step = 360 / u.length;
  const segs = [];
  u.forEach((k, i) => { if(segs.length && segs[segs.length - 1].k === k) segs[segs.length - 1].n++; else segs.push({k, s:i, n:1}); });
  const P = a => [100 * Math.sin(a * Math.PI / 180), -100 * Math.cos(a * Math.PI / 180)];
  let g = '';
  segs.forEach(sg => {
    const a0 = sg.s * step, a1 = (sg.s + sg.n) * step, [x0, y0] = P(a0), [x1, y1] = P(a1);
    g += `<path d="M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A100 100 0 ${sg.n * step > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${WHEEL_COLORS[sg.k]}" stroke="#fff" stroke-width="2.5"/>`;
    const am = (a0 + a1) / 2, r = 68, fs = sg.n >= 2 ? 26 : 19;
    if(sg.n >= 3 && sg.k !== 'shinka' && sg.k !== 'none'){
      // 大きい部分は アイコンを ならべて 面積を わかりやすく
      for(let j = 0; j < sg.n; j++){ const aj = (sg.s + j + 0.5) * step; g += `<text x="${(r * Math.sin(aj * Math.PI / 180)).toFixed(1)}" y="${(-r * Math.cos(aj * Math.PI / 180)).toFixed(1)}" font-size="20" text-anchor="middle" dominant-baseline="central">${unitIcon(sg.k)}</text>`; }
    } else {
      g += `<text x="${(r * Math.sin(am * Math.PI / 180)).toFixed(1)}" y="${(-r * Math.cos(am * Math.PI / 180)).toFixed(1)}" font-size="${fs}" text-anchor="middle" dominant-baseline="central">${unitIcon(sg.k)}</text>`;
    }
  });
  if(id) return g;
  return `<svg viewBox="-102 -102 204 204" width="${size}" height="${size}">${g}</svg>`;
}

async function spin(fast){
  const u = wheelUnits(S.alloc), step = 360 / u.length, i = rnd(u.length);
  const center = (i + 0.5) * step, jitter = (Math.random() - 0.5) * step * 0.6;
  const base = Math.ceil(S.rot / 360) * 360;
  S.rot = base + 360 * (fast ? 2 : 4) + (360 - center) + jitter;
  const g = $('#wheelG');
  g.classList.toggle('fast', !!fast);
  g.style.transform = `rotate(${S.rot}deg)`;
  const dur = fast ? 1200 : 2600;
  for(let t = 0; t < dur - 300; t += 140){ setTimeout(() => beep(700, 0.03), t); }
  await sleep(dur + 150);
  beep(880, 0.15, 'triangle');
  return u[i];
}

/* ============ ルーレットの けっか ============ */
function growBonus(p){
  const others = S.pieces.filter(q => q !== p);
  for(const t of p.traits){
    const g = TRAITS[t].grow;
    if(g === 'always') return t;
    if(g === 'pla' && sumN('pla') > 0) return t;
    if(g === 'prey' && others.some(isAnimal)) return t;
    if(g === 'seer' && others.some(q => q.traits.includes('eye'))) return t;
    if(g === 'biter' && others.some(q => q.traits.includes('fang'))) return t;
  }
  return null;
}
const addN = (p, k) => { const b = p.n; p.n = Math.max(p.n, Math.min(capOf(p), p.n + k)); if(p.n > b) p.small = false; return p.n - b; };
// 結果を {big, kid, ad, html, after} で返す(表示は呼び出し側)
function resultOf(p, k){
  if(k === 'none') return {big:'・', kid:'なにも ない ばしょ', ad:'いまは、どの生き物の食べものもない場所です。生き物がふえて食べもののつながりが広がると、ここも➕になります。'};
  if(k === 'shinka'){
    const pool = Object.keys(TRAITS).filter(t => traitOK(t, p.st) && unlocked(t) && !p.traits.includes(t));
    if(!pool.length) return {big:'✨', kid:'もう ぜんぶ そろってる', ad:'持てるとくちょうは、もう全部そろっています。'};
    const t = pick(pool), T = TRAITS[t];
    p.traits.push(t); const dropped = p.traits.length > MAX_TRAITS ? p.traits.shift() : null;
    let after = null;
    if(COEVO[t] && !S.coevo[t]){ S.coevo[t] = true; after = COEVO[t]; }
    return {big:'✨' + T.icon, kid:`しんか！ ${T.name} が あらわれた`, short:`✨${T.icon} あらわれた`,
      ad:`「${T.name}」をもつものが、${formName(p)}の中に現れて広がりました。${T.ad}${dropped ? `(とくちょうは${MAX_TRAITS}つまで。${TRAITS[dropped].name}はなくなりました)` : ''}`, after, fan:true};
  }
  if(k === p.st){
    const bt = growBonus(p), got = addN(p, 2 + (bt ? 1 : 0)), cap = capOf(p);
    return got ? {big:'➕' + form(p), kid:`${form(p)} が ${got}ひき ふえた！`, short:`➕ ${got}ひき ふえた`, html:pRow(p), fan:true,
                  ad:`${STAGES[p.st].name}の➕なので、なかまがふえました。${bt ? `「${TRAITS[bt].name}」があるので、ふえる数が1つ多くなりました。` : ''}いまの食べもので、ふえられるのは${cap}ひきまで(○)。${CAP_AD[p.st] || ''}`}
               : {big:'➕' + form(p), kid:'たべものが たりなくて ふえられない', short:'➕ たべものが たりない', html:pRow(p),
                  ad:`食べものが足りないので、これ以上ふえられません(いまは${cap}ひきまで)。${CAP_AD[p.st] || ''}`};
  }
  // ほかの系統の ➕:その系統のプレイヤーへの プレゼント
  const cands = S.pieces.filter(q => q.st === k);
  const q = cands.reduce((a, b) => a.n <= b.n ? a : b);
  const got = addN(q, 2);
  return {big:`${markHtml(p, 46)}🎁${markHtml(q, 46)}`, kid: got ? `${markOf(q)} に プレゼント！ ${form(q)} が ${got}ひき ふえた` : `${markOf(q)} に プレゼント！ でも たべものが たりなかった`,

}

/* ============ 手番 ============ */
async function humanTurn(p){

/* ============ 枝分かれ ============ */
function cpuFork(f){
  const keys = Object.keys(f.opts), wsum = keys.reduce((a, k) => a + f.opts[k], 0);
  const size = S.pieces.filter(p => p.st === f.from || keys.includes(p.st)).length;
  const def = keys.map(k => [k, f.opts[k] / wsum * size - S.pieces.filter(p => p.st === k).length]);
  const mx = Math.max(...def.map(d => d[1]));
  return pick(def.filter(d => d[1] === mx).map(d => d[0]));
}
async function doFork(r){
  const f = FORKS[r], group = S.pieces.filter(p => p.st === f.from);
  if(!group.length) return;
  const keys = Object.keys(f.opts);
  S.cur = -1; render();
  await popup(`${stIcon(f.from)}🔀${keys.map(stIcon).join('')}`, 'わかれみち！', {
    html:keys.map(k => `<div class="row"><span class="rf">${stIcon(k)}</span><span class="rn">${STAGES[k].name}<br><small>${STAGES[k].desc}</small></span></div>`).join(''),
    sub:f.ad, say:'わかれみち！ ' + f.kid});
  for(const p of group.filter(q => q.human)){
    S.cur = p.id; S.lastCur = p.id; render();
    if(humanCount() > 1) await popup(whoHtml(p), `${markOf(p)} の ばん！`, {btn:'えらぶ ▶'});
    await new Promise(res => {
      speak('どっちの えだに すすむ？');
      const btns = keys.map(k => `<button class="choice" data-k="${k}"><span class="ce">${stIcon(k)}</span>${STAGES[k].name}</button>`).join('');
      const ov = overlay(`<div>${markHtml(p, 60)}</div><div class="msg">どっちの えだに すすむ？</div><div class="btnrow">${btns}</div>
        <div class="sub" style="margin-top:12px">${keys.map(k => `${stIcon(k)} ${STAGES[k].ad}`).join('<br>')}<br><br>同じ系統を選ぶこともできますが、食べものの奪い合いになって、ふえにくくなります。</div>`);
      ov.querySelectorAll('.choice').forEach(b => b.onclick = () => { p.st = b.dataset.k; speak(STAGES[p.st].name); fanfare(); ov.remove(); render(); res(); });
    });
    saveGame();
  }
  for(const p of group.filter(q => !q.human)) p.st = (typeof SIM_FORCE !== 'undefined' && SIM_FORCE[r]) || cpuFork(f);
  // 枝分かれの直後は、新しい系統の ➕ を すぐ 用意する
  const before = applyAlloc(); S.cur = -1; render();
  await popup(S.pieces.map(p => form(p)).join(''), 'えだが わかれた！', {
    html:S.pieces.map(p => `<div class="row"><span class="rf">${markHtml(p, 34)}</span><span class="rf">${form(p)}</span><span class="rn">${STAGES[p.st].name}<br><small>${formName(p)}</small></span></div>`).join('')
       + `<div class="pies"><div>${pieSVG(before, 100)}<br>まえ</div>➡️<div>${pieSVG(S.alloc, 100)}<br>あと</div></div>`,
    sub:'ルーレットの➕も、それぞれの系統用に分かれました。食べものが少ない系統は、➕がせまくなります。'});
}

function unusedPairs(){
  const next = S.crisis < 5 ? CRISES[S.crisis].save : [];
  const out = [];
  S.pieces.forEach(p => p.traits.forEach(t => {
    if(next.includes(t)) return;
    const g = TRAITS[t].grow;
    if(g && growBonus({...p, traits:[t]}) === t) return;
    out.push([p, t]);
  }));
  return out;
}
async function doEvent(){
  const cand = EVENTS.filter(e => e.can());
  const tot = cand.reduce((a, e) => a + e.w, 0);
  let r = Math.random() * tot, ev = cand[0];
  for(const e of cand){ if((r -= e.w) < 0){ ev = e; break; } }
  S.cur = -1; render(); beep(520, 0.2, 'triangle');
  const res = ev.run(); render();
  await popup(ev.icon, `できごと<br>${res.kid}`, {html:res.html, sub:res.ad, say:'できごと！ ' + res.kid});
}

/* ============ 大量絶滅 ============ */

  const c = CRISES[S.crisis];
  S.cur = -1; render(); beep(150, 0.6, 'sawtooth');
  const rows = [], revived = [];
  S.pieces.forEach(p => {

    rows.push(`<div class="row"><span class="rf">${markHtml(p, 34)}</span><span class="rn">${nRow(f, p.small ? 0 : p.n, lost)}</span><span class="rm">${prot.length ? prot.map(t => TRAITS[t].icon).join('') + '✨' : '💨'}</span></div>`);

    const er = ERAS[S.crisis];
    await popup(er.icon, `${er.name}<br>に なった！`, {
      html:S.pieces.map(p => `<div class="row"><span class="rf">${markHtml(p, 34)}</span><span class="rf">${form(p)}</span><span class="rn">${formName(p)}</span></div>`).join(''),
      sub:`${er.sub}になりました。絵は、その時代の同じ系統の代表です(直接の祖先とはかぎりません)。`});

}

}

/* ============ 進行 ============ */
async function loop(){
  render();
  while(S.round <= ROUNDS){
    const r = S.round, hs = S.pieces.filter(p => p.human);
    while(S.idx < hs.length){ saveGame(); await humanTurn(hs[S.idx]); S.idx++; }
    if(!S.done['cpu' + r]){ await cpuTurns(); S.done['cpu' + r] = 1; saveGame(); }
    narr(`${r}ラウンドめの おわり`, false, 'ラウンドの終わりに、枝分かれ・ルーレットの変化・大量絶滅やできごとが起こります。');
    if(FORKS[r] && !S.done['fork' + r]){ await doFork(r); S.done['fork' + r] = 1; saveGame(); }
    if(!S.done['chg' + r]){ await roundChanges(); S.done['chg' + r] = 1; saveGame(); }
    if(CRISIS_END.includes(r) && !S.done['cr' + r]){ await doCrisis(); S.done['cr' + r] = 1; }
    if(EVENT_END.includes(r) && !S.done['ev' + r]){ await doEvent(); S.done['ev' + r] = 1; }
    S.idx = 0; S.round++; saveGame(); render();
  }
  await ending();
}
let STAR3 = 24, STAR2 = 18;

  store.del('shinka_game');
  S.cur = -1; render(); fanfare(); setTimeout(fanfare, 500);
  const total = S.pieces.reduce((a, p) => a + p.n, 0);
  const kinds = new Set(S.pieces.map(p => p.st)).size;
  const stars = total >= STAR3 ? 3 : total >= STAR2 ? 2 : 1;
  await popup('🌍🎉', 'みんなで 5かいの<br>ききを のりこえた！', {
    html:S.pieces.map(p => `<div class="row"><span class="rf">${markHtml(p, 34)}</span><span class="rf">${form(p, 5)}</span><span class="rn">${formName(p, 5)}</span></div>`).join(''),
    sub:'そして新生代、「いま」の生き物たちへ。'});
  for(const p of S.pieces.filter(q => q.human)) await checkZukan(p, 5);
  await popup('⭐'.repeat(stars), stars === 3 ? 'とても ゆたかな<br>せいたいけい！' : stars === 2 ? 'ゆたかな せいたいけい！' : 'みんなで いきのこった！', {
    html:S.pieces.map(p => `<div class="row"><span class="rf">${markHtml(p, 34)}</span><span class="rn">${form(p, 5).repeat(p.n)}</span></div>`).join(''),
    sub:`なかまの ごうけい ${total}ひき ／ 系統 ${kinds}しゅるい ／ ずかん ${zukan.size} / ${ZUKAN.length}`, btn:'もういちど'});
  title();
}

/* ============ タイトル ============ */
function title(){
  $('#ovs').innerHTML = '';
  const saved = store.get('shinka_game', null);
  const ov = overlay(`<div class="big">🦠🎡🦖</div><div class="msg">しんか ルーレット</div>
    <div style="margin-bottom:10px">なんにんで あそぶ？</div>
    <div class="btnrow">${[1,2,3,4].map(n => `<button class="pbtn" data-n="${n}">${'👤'.repeat(n)}</button>`).join('')}</div>
    ${saved ? '<div style="margin-top:14px"><button class="ok" id="cont">つづきから ▶</button></div>' : ''}
    <div><a class="back" href="../../samples/">← ゲーム一覧</a></div>`);
  ov.querySelectorAll('.pbtn').forEach(b => b.onclick = async () => {
    beep(700); ov.remove();
    const nh = +b.dataset.n, marks = [];
    for(let i = 0; i < nh; i++){
      await new Promise(res => {
        speak(nh > 1 ? `${i + 1}ばんめの こ、 しるしを えらんでね` : 'しるしを えらんでね');
        const btns = MARKS.map(m => `<button class="pbtn" data-m="${m}" style="width:30%;font-size:40px;border:6px solid ${COLORS[i]};background:#fff" ${marks.includes(m) ? 'disabled' : ''}>${m}</button>`).join('');
        const o2 = overlay(`<div class="msg">${nh > 1 ? `${i + 1}ばんめの こ<br>` : ''}じぶんの しるしを えらんでね</div><div class="btnrow">${btns}</div><div class="sub" style="margin-top:12px">このしるしが、ゲームのあいだずっと自分の目印になります。生き物の姿は時代で変わりますが、しるしは変わりません。</div>`);
        o2.querySelectorAll('[data-m]').forEach(x => x.onclick = () => { marks.push(x.dataset.m); beep(800); o2.remove(); res(); });
      });
    }
    newGame(nh, marks); render();
    await popup('🦠🦠🦠🦠', 'みんな ちいさな いきもの<br>から スタート！', {
      html:`<div style="margin-bottom:10px">${S.pieces.map(p => markHtml(p, 50)).join(' ')}</div>`,
      sub:'ルーレットを回して、止まったところで生き物がふえたり、とくちょうが現れたりします。<br>➕：その系統のなかまがふえる。ほかの人の系統なら、その人へのプレゼント。<br>✨：とくちょうが現れる。<br>上の❄️🫧🌋🔥☄️は5回の大量絶滅。とくちょうがあると生き残りやすい。<br>みんなで協力して、5回をのりこえよう。',
      say:'みんな ちいさな いきもの から スタート！ ルーレットを まわして、みんなで 5かいの ききを のりこえよう'});
    loop();
  });
  const c = ov.querySelector('#cont');
  if(c) c.onclick = () => { ov.remove(); S = saved; loop(); };
}

/* ============ 起動 ============ */
$('#bSnd').textContent = soundOn ? '🔊' : '🔇';
$('#bSnd').onclick = () => { soundOn = !soundOn; store.set('shinka_sound', soundOn); $('#bSnd').textContent = soundOn ? '🔊' : '🔇'; };
$('#bZk').onclick = openZukan;
$('#bMenu').onclick = () => {
  const ov = overlay(`<div class="msg">さいしょから やりなおす？</div><div class="btnrow"><button class="ok" id="y">はい</button><button class="ok" id="n" style="background:#999;box-shadow:0 4px 0 #666">いいえ</button></div><div><a class="back" href="../../samples/">← ゲーム一覧</a></div>`);
  ov.querySelector('#n').onclick = () => ov.remove();
  ov.querySelector('#y').onclick = () => { store.del('shinka_game'); location.reload(); };
};
$('#wheel').addEventListener('click', () => {
  if(!S) return;
  const rows = Object.keys(S.alloc).map(k => `<div class="row"><span class="rf" style="font-size:20px;min-width:56px">${k === 'none' ? '・' : stIcon(k) + '➕'}</span><span class="rn">${k === 'none' ? 'なにもない' : STAGES[k].name + 'が ふえる'}：${S.alloc[k]}めもり</span></div>`).join('')
    + `<div class="row"><span class="rf" style="font-size:20px;min-width:56px">✨</span><span class="rn">とくちょうが あらわれる：${SHINKA_UNITS}めもり</span></div>`;
  popup('🎡', 'ルーレットの なかみ', {btn:'とじる', html:rows, sub:'➕の広さは、食べもののつながりで変わります。ほかの人の➕に止まると、その人へのプレゼントになります。✨では、止まった生き物の系統に合ったとくちょうが現れます(植物に目は現れません)。'});
});
const showPiece = e => {
  const el = e.target.closest('.pn,#me'); if(!el || !S) return;
  const p = S.pieces[+el.dataset.id];
  popup(markHtml(p, 60) + ' ' + form(p), formName(p), {btn:'とじる', sub:`${stIcon(p.st)} ${STAGES[p.st].name}：${STAGES[p.st].ad}<br>なかまの数：${p.n}ひき。いまの食べもので、ふえられるのは${capOf(p)}ひきまで。${CAP_AD[p.st] || ''}<br>${p.traits.length ? 'とくちょう：<br>' + p.traits.map(t => `${TRAITS[t].icon}${TRAITS[t].name}：${TRAITS[t].ad}`).join('<br>') : 'とくちょう：まだなし'}${p.human ? '' : '<br>🤖 コンピューターが動かしています。'}`});
};
$('#panels').addEventListener('click', showPiece);
$('#me').addEventListener('click', showPiece);
$('#bHelp').onclick = () => {
  const L = (i, t) => `<div class="lgd"><span class="li">${i}</span><span>${t}</span></div>`;
  const ov = overlay(`<div class="msg">あそびかた</div>
    ${L('🎡', 'ルーレットを回して、止まったところで何かが起こります。ルーレットをタップすると中身が見られます。')}
    ${L('🐟➕', 'その系統のなかまがふえます。ほかの人の系統なら、その人へのプレゼント。')}
    ${L('✨', 'とくちょうが現れます。')}
    ${L('○', 'ふえられる上限。いろいろな系統がいると食べものがつながって、みんなの上限が上がります。')}
    ${L('🔄', 'ラウンドの終わりに、生き物の数に合わせてルーレットの広さが変わります。')}
    ${L('🔀', '1〜3ラウンドの終わりに、系統が枝分かれします。')}
    ${L('❄️🫧🌋🔥☄️', '5回の大量絶滅(4・6・8・10・12ラウンドの終わり)。')}
    ${L('🤒🎲', 'そのあいだのラウンドの終わりには、病気などの「できごと」が起こります。')}
    ${L('👆', 'パネルをタップすると説明が出ます。')}
    <button class="ok">とじる</button>`);
  ov.querySelector('.ok').onclick = () => ov.remove();
};
title();
</script>
</body>
</html>
