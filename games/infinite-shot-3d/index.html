<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>INFINITE SHOT 3D - 5分間スコアアタック</title>
<style>
:root{color-scheme:dark;--bg:#050a1c;--cyan:#65f6ff;--pink:#ff5cbd;--gold:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef7ff;-webkit-user-select:none;user-select:none}
#gameWrap{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#c,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none}
#ov{pointer-events:none}
#hud{position:absolute;inset:0 0 auto;padding:10px 12px;pointer-events:none;text-shadow:0 2px 5px #000;max-width:560px;margin:0 auto}
.topline{display:flex;justify-content:space-between;gap:6px;align-items:flex-start;font-size:11px;font-weight:800;letter-spacing:.04em}
.stat{background:#081126c9;border:1px solid #36507899;border-radius:9px;padding:5px 8px;min-width:0;flex:1}
.stat strong{color:var(--cyan);font-size:15px;display:block;white-space:nowrap}
.stat strong.warn{color:#ff6b8a}
#shRow{display:flex;align-items:center;gap:7px;margin-top:7px;background:#081126d9;border:1px solid #36507899;border-radius:10px;padding:4px 9px;position:relative}
#shRow .shLbl{font-size:16px}
#shOuter{flex:1;height:12px;background:#1c2946;border-radius:7px;overflow:hidden;border:1px solid #324567}
#shFill{height:100%;width:100%;background:linear-gradient(90deg,#3fd6ff,#65f6ff);transition:width .15s}
#shNum{font-size:22px;font-weight:1000;color:#65f6ff;min-width:2.2em;text-align:right;line-height:1}
#shRow.mid #shFill{background:linear-gradient(90deg,#ffb347,#ffd166)}#shRow.mid #shNum{color:#ffd166}
#shRow.low #shFill{background:linear-gradient(90deg,#ff2d55,#ff6b8a)}#shRow.low #shNum{color:#ff6b8a;animation:shPulse .6s infinite alternate}
#shRow.hit{animation:shHit .45s}
@keyframes shPulse{to{opacity:.45}}
@keyframes shHit{0%{background:#ff2d55cc;border-color:#ff8fa3;transform:translateX(-4px)}30%{transform:translateX(4px)}60%{transform:translateX(-2px)}100%{transform:none}}
#dmgPop{position:absolute;right:76px;top:-6px;color:#ff6b8a;font-weight:1000;font-size:16px;opacity:0;animation:dmgUp .9s ease-out}
@keyframes dmgUp{0%{opacity:1;transform:translateY(6px)}100%{opacity:0;transform:translateY(-14px)}}
#hudDiff{font-size:10px;font-weight:900;border:1px solid;border-radius:6px;padding:2px 5px;letter-spacing:.05em}
.diffsel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.dbtn{padding:8px 4px;font-size:13px;background:#0f1d38;color:var(--dc);border:1px solid #2b4870;box-shadow:none;line-height:1.2}
.dbtn small{display:block;font-size:10px;font-weight:600;color:#9fb3d1}
.dbtn.on{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 18%,#0f1d38);box-shadow:0 0 12px color-mix(in srgb,var(--dc) 35%,transparent)}
.dbadge{display:inline-block;font-size:11px;font-weight:900;color:var(--dc);border:1px solid var(--dc);border-radius:7px;padding:2px 8px;margin-bottom:6px;letter-spacing:.06em}
#xpOuter{height:6px;background:#1c2946;border-radius:10px;margin-top:7px;overflow:hidden;border:1px solid #324567}
#xp{height:100%;width:0;background:linear-gradient(90deg,#5bf4ff,#b4ff87,#ffe16b)}
#buffs{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px;max-width:100%}
.buff{font-size:10px;background:#142747dd;border:1px solid #4b8fa5;border-radius:5px;padding:2px 5px;color:#c5fbff}
.buff.tmp{border-color:#ffd166;color:#ffe9a8}
.buff.sh{border-color:#65f6ff}
.buff.sh.low{border-color:#ff6b8a;color:#ffc2d0}
#bossbar{display:none;margin-top:6px;background:#36182fdd;border:1px solid #ff5cbd;border-radius:8px;padding:5px;font-size:11px;font-weight:800}
#bossFill{height:5px;background:var(--pink);width:100%;margin-top:3px;border-radius:4px}
#toast{position:absolute;top:30%;left:6%;width:88%;text-align:center;font-size:clamp(16px,4.5vw,24px);font-weight:1000;color:#fff;text-shadow:0 0 16px #65f6ff,0 3px 5px #000;pointer-events:none;opacity:0;transition:opacity .2s}
#overlay,#levelup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050817e0;padding:16px;text-align:center}
#levelup{display:none}
.backlink{display:block;text-align:left;font-size:12px;color:#8fb3d9;text-decoration:none;margin:-8px 0 8px}.backlink:hover{color:#65f6ff}
.card{width:100%;max-width:370px;max-height:calc(100% - 8px);overflow-y:auto;padding:22px 16px;border:1px solid #3d6c8f;border-radius:20px;background:linear-gradient(145deg,#132444f5,#101329f5);box-shadow:0 0 40px #0a719244}
h1{margin:0 0 6px;font-size:clamp(28px,8vw,40px);line-height:1;color:var(--cyan);letter-spacing:.04em}
h1 .d3{color:var(--gold);font-size:.6em;vertical-align:super;margin-left:4px}
h2{margin:0 0 10px;font-size:22px;color:var(--gold)}
.subtitle{color:#a8c9e7;font-size:12px;margin-bottom:14px}
p{font-size:13px;line-height:1.6;color:#dce9ff;margin:10px 0}
button{font:inherit;font-weight:900;border:0;border-radius:12px;padding:12px 18px;color:#081020;background:linear-gradient(100deg,#6df5ff,#b5ffac);box-shadow:0 4px 0 #2c8c9b;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #2c8c9b}
button.sub{background:#1d3357;color:#dff3ff;border:1px solid #3e7092;box-shadow:0 4px 0 #0d1a30}
button.danger{background:#3a1626;color:#ffb3c8;border:1px solid #8a3550;box-shadow:none;font-size:12px;padding:8px 12px}
.btnrow{display:grid;gap:9px;margin-top:12px}
.small{font-size:11px;color:#94a9ca;margin-top:10px}
#choices{display:grid;gap:8px;margin-top:12px}
.choice{display:flex;text-align:left;gap:10px;align-items:center;background:#162847;border:1px solid #3e7092;color:white;box-shadow:none;padding:11px}
.choice .emoji{font-size:24px}.choice small{display:block;color:#a9c9e7;font-weight:500;margin-top:2px}
.choice .lv{color:var(--gold);font-size:11px;margin-left:4px}
#mobileHint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#91a9c8;font-size:10px;pointer-events:none;text-shadow:0 1px 4px #000}
#pauseBtn{position:absolute;left:10px;bottom:26px;width:40px;height:40px;padding:0;border-radius:10px;font-size:14px;background:#142747cc;color:#cdf;box-shadow:none;border:1px solid #3e7092;display:none}
#muteBtn{position:absolute;right:10px;bottom:26px;width:40px;height:40px;padding:0;border-radius:10px;font-size:17px;background:#142747cc;color:#cdf;box-shadow:none;border:1px solid #3e7092;z-index:5}
#skipBtn{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);display:none;padding:9px 18px;font-size:13px;background:#1d3357cc;color:#ffe9a8;border:1px solid #ffd166;box-shadow:none}
.result-score{font-size:38px;font-weight:1000;color:var(--gold);margin:4px 0 2px}
.rows{text-align:left;font-size:12.5px;margin:10px auto;max-width:270px;color:#cfe2ff}
.rows div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #2b4466}
.rows b{color:#fff}
#nameIn{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid #3e7092;background:#0b1630;color:#fff;width:100%;text-align:center;margin-top:4px}
table.rank{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.rank th{color:#8fb3d9;font-weight:700;font-size:10.5px;padding:4px 3px;border-bottom:1px solid #3d6c8f}
table.rank td{padding:6px 3px;border-bottom:1px solid #22385a}
table.rank td.n{text-align:left;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.rank td.s{text-align:right;font-weight:800;color:var(--gold)}
table.rank tr.me td{background:#24502f}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0;text-align:left}
.lg{border-radius:12px;padding:8px 9px;border:1px solid}
.lg b{display:block;font-size:13px}.lg span{display:block;font-size:11.5px;font-weight:700;margin-top:2px}.lg small{display:block;font-size:10.5px;color:#c9d6ea;line-height:1.45;margin-top:3px}
.lg.bad{background:#3a0f1c;border-color:#ff4d6d}.lg.bad b,.lg.bad span{color:#ff8fa3}
.lg.good{background:#123a22;border-color:#6bff9e}.lg.good b,.lg.good span{color:#9dffbe}
.guide{display:grid;gap:8px;text-align:left;margin-top:8px}
.guide .row{display:flex;gap:10px;align-items:center;background:#0f1d38;border:1px solid #2b4870;border-radius:12px;padding:8px}
.guide svg{flex:0 0 40px}
.guide b{font-size:13px}.guide small{display:block;color:#a9c9e7;font-size:11.5px;line-height:1.45}
.guide .t{color:var(--gold);font-size:10.5px;margin-left:6px}
</style>
</head>
<body>
<div id="gameWrap">
<canvas id="c" aria-label="3Dシューティング"></canvas>
<canvas id="ov"></canvas>
<div id="hud">
  <div class="topline">
    <div class="stat">SCORE<strong id="score">0</strong></div>
    <div class="stat">LV<strong id="level">1</strong></div>
    <div class="stat">KILLS<strong id="kills">0</strong></div>
    <div class="stat">残り<strong id="time">5:00</strong></div>
  </div>
  <div id="shRow"><span class="shLbl">🛡️</span><div id="shOuter"><div id="shFill"></div></div><strong id="shNum">100</strong><span id="dmgPop"></span><span id="hudDiff">NORMAL</span></div>
  <div id="xpOuter"><div id="xp"></div></div>
  <div id="buffs"></div>
  <div id="bossbar"><span id="bossName"></span> <span id="bossText"></span><div id="bossFill"></div></div>
</div>
<div id="toast"></div>
<button id="pauseBtn" aria-label="一時停止">Ⅱ</button>
<button id="muteBtn" aria-label="サウンド">🔊</button>
<button id="skipBtn">スキップ ▶</button>
<div id="levelup"><div class="card"><h1 style="font-size:28px">LEVEL UP!</h1><p id="luSub">強化をひとつ選択</p><div id="choices"></div></div></div>
<div id="overlay"></div>
<div id="mobileHint">画面のどこでもドラッグで移動 ・ ショット自動発射</div>
</div>
