<style>
:root{--bg:#14101c;--win:#0d0a16;--line:#efe6d2;--txt:#f7f1e3;--dim:#a79db5;--acc:#ffd36b;--hp:#6fdc7c;--mp:#6fb8ff;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;min-height:100%}
body{display:flex;justify-content:center;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{width:100%;max-width:500px;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 8px)}
#top{flex:none;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);min-height:22px;gap:8px}
#top .back{color:var(--dim);text-decoration:none;white-space:nowrap;font-size:12px;border:1px solid #4a4258;border-radius:6px;padding:2px 7px}
#where{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .r{display:flex;gap:6px;align-items:center}
#top button{font:inherit;font-size:12px;color:var(--dim);background:none;border:1px solid #4a4258;border-radius:6px;padding:3px 8px;cursor:pointer}
#gold{color:var(--acc);font-weight:bold}
#screen{position:relative;flex:none;align-self:center;height:clamp(165px,min(calc((min(100vw,500px) - 16px)*.75),calc(100dvh - 430px)),375px);width:auto;max-width:100%;aspect-ratio:4/3;background:#000;border:3px solid var(--line);border-radius:8px;overflow:hidden}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9%;pointer-events:none;text-align:center}
#overlay h1{margin:0;font-size:clamp(24px,7.4vw,36px);letter-spacing:.02em;color:#fff3c4;text-shadow:3px 3px 0 #5a2d1a,-1px -1px 0 #5a2d1a,1px -1px 0 #5a2d1a,-1px 1px 0 #5a2d1a}
#overlay h1 span{color:#ffd36b}
#overlay p{margin:6px 0 0;font-size:clamp(12px,3.4vw,15px);color:#e8dcc0;text-shadow:1px 1px 0 #000}
.win{background:var(--win);border:3px solid var(--line);border-radius:8px;padding:9px 12px}
#msg{flex:none;height:calc(6em + 20px);overflow-y:auto;font-size:14px;line-height:1.5;padding:7px 11px;white-space:pre-wrap;position:relative;cursor:pointer}
#msg.more::after{content:"▼";position:absolute;right:10px;bottom:4px;animation:blink 1s infinite;color:var(--acc);font-size:13px}
@keyframes blink{50%{opacity:0}}
#party{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pc{min-width:0;background:var(--win);border:2px solid var(--line);border-radius:7px;padding:3px 6px 4px;font-size:11px;line-height:1.25;transition:transform .08s}
.pc .nm{display:flex;justify-content:space-between;align-items:baseline}
.pc b{font-size:13px}
.pc .cl{color:var(--dim);font-size:11px}
.pc.dead{border-color:var(--bad)}
.pc.dead b{color:var(--bad)}
.pc.act{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.pc.hurt{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bar{height:5px;background:#2c2638;border-radius:3px;overflow:hidden;margin:1px 0 2px}
.bar i{display:block;height:100%;transition:width .25s}
.lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.lbl span:last-child{color:var(--txt)}
#cmd{flex:1 1 auto;min-height:0;overflow-y:auto;align-content:start;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:6px;padding:1px 1px 4px}
#cmd button{font:inherit;font-size:15px;color:var(--txt);background:var(--win);border:2px solid var(--line);border-radius:8px;padding:6px 9px;text-align:left;cursor:pointer;min-height:42px;line-height:1.3;touch-action:manipulation}
#cmd button:active{background:#2a2440}
#cmd button:disabled{opacity:.35;cursor:default}
#cmd button.wide{grid-column:1/-1}
#cmd button.hi{border-color:var(--acc);color:var(--acc)}
#cmd button.sub{border-color:#5a5068;color:var(--dim);font-size:14px;min-height:42px}
#cmd button small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
#cmd .head{grid-column:1/-1;font-size:13px;color:var(--acc);padding:0 2px}
#pad{display:none;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
#pad.on{display:grid;flex:1 1 auto;min-height:0}
#dpad{display:grid;grid-template-columns:repeat(3,min(64px,17vw));grid-template-rows:repeat(3,min(54px,7.2dvh));gap:4px}
#dpad button,#padside button{font:inherit;font-size:22px;color:var(--txt);background:var(--win);border:2px solid var(--line);border-radius:10px;cursor:pointer;touch-action:none}
#dpad button:active,#dpad button.on{background:#3a3252}
#padside{display:flex;flex-direction:column;gap:8px}
#padside button{font-size:15px;padding:12px 10px;min-width:96px}
#padhint{font-size:12px;color:var(--dim);line-height:1.5;white-space:nowrap}


/* ---- 演出 ---- */
.win,#cmd button,.pc,#dpad button,#padside button{box-shadow:inset 0 0 0 2px #0d0a16,inset 0 0 0 3px #3e3652}
#screen{box-shadow:0 0 0 2px #0d0a16,0 6px 18px rgba(0,0,0,.45)}
#cmd button{position:relative;animation:cin .17s ease-out both;transition:transform .06s,background .1s}
#cmd button::before{content:"▶";display:inline-block;width:0;overflow:hidden;color:var(--acc);font-size:12px;vertical-align:2px;transition:width .1s}
@media (hover:hover){#cmd button:not(:disabled):hover::before{width:15px}}
#cmd button:not(:disabled):focus-visible::before{width:15px}
#cmd button:not(:disabled):active{transform:scale(.97);background:#2a2440}
#cmd button.hi{box-shadow:inset 0 0 0 2px #0d0a16,inset 0 0 0 3px #6a5520,0 0 10px rgba(255,211,107,.18)}
@keyframes cin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pc.low{animation:lowp 1s infinite}
@keyframes lowp{50%{border-color:var(--bad);box-shadow:inset 0 0 0 2px #0d0a16,inset 0 0 0 3px #6a2a2a,0 0 8px rgba(255,107,107,.35)}}
.pc.act{box-shadow:inset 0 0 0 2px #0d0a16,inset 0 0 0 3px var(--acc),0 0 10px rgba(255,211,107,.35)}
#fx{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.bn{width:100%;text-align:center;padding:9px 0 10px;background:linear-gradient(90deg,transparent,rgba(12,8,24,.9) 14%,rgba(12,8,24,.9) 86%,transparent);border-top:2px solid var(--c);border-bottom:2px solid var(--c);animation:bn 1.9s ease both;margin-top:-18%}
.bn b{display:block;font-size:clamp(20px,6.4vw,30px);color:var(--c);letter-spacing:.1em;text-shadow:2px 2px 0 #000,0 0 12px var(--c)}
.bn span{display:block;font-size:clamp(12px,3.4vw,15px);color:#fff;margin-top:2px;text-shadow:1px 1px 0 #000}
@keyframes bn{0%{transform:scaleY(0);opacity:0}9%{transform:scaleY(1.15);opacity:1}14%{transform:scaleY(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#padside button#fmap{font-size:13px;padding:8px 6px}
#msg{transition:border-color .2s}
.st{height:15px;display:flex;gap:3px;overflow:hidden;white-space:nowrap;margin-top:2px}
.st i{font-style:normal;font-size:10px;padding:0 4px;border-radius:4px;line-height:15px}
.s-poi{background:#5a2a7a;color:#ecd2ff}.s-buf{background:#1d4b6c;color:#c4e8ff}.s-tmp{background:#5c4a16;color:#ffe9a8}
.pc.sel{cursor:pointer;border-color:var(--acc);animation:selp .9s infinite}
.pc.nosel{opacity:.35}
@keyframes selp{50%{box-shadow:inset 0 0 0 2px #0d0a16,inset 0 0 0 3px var(--acc),0 0 12px rgba(255,211,107,.55)}}
</style>

<script>
// ---- logic.js ----
// ===== ウォンバット☆レガシーRPG: data & rules (DOMを使わない) =====
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- party ----------
const CLASSES={
  war:{name:'せんし',  hp:[32,9],  mp:[3,1.0], atk:[10,2.6],def:[7,2.0], mag:[2,0.4], spd:[4,1.1]},
  mag:{name:'まほうつかい',hp:[21,5.2],mp:[11,3.4],atk:[4,1.0], def:[3,1.0], mag:[10,2.8],spd:[7,1.4]},
  pri:{name:'そうりょ',hp:[25,6.6],mp:[9,2.8], atk:[6,1.7], def:[5,1.5], mag:[8,2.2], spd:[5,1.2]},
};
const MAXLV=25;
function baseStat(m,k){const c=CLASSES[m.cls][k];return Math.floor(c[0]+c[1]*(m.lv-1));}
function expNext(lv){return Math.floor(6*lv*lv+4*lv);} // lv→lv+1 に必要な量

const SKILLS={
  guard:  {name:'おしりガード',cls:'war',lv:1, mp:0, tgt:'self',   kind:'guard', desc:'かたいおしりで仲間をかばう（ダメージ半分）'},
  dig:    {name:'ほりほりアタック',cls:'war',lv:3,mp:2,tgt:'enemy',kind:'phys',pow:1.6,desc:'つよい一撃'},
  roll:   {name:'ころがりタックル',cls:'war',lv:7,mp:4,tgt:'enemies',kind:'phys',pow:.85,desc:'敵ぜんたいに体あたり'},
  quake:  {name:'だいちのいちげき',cls:'war',lv:12,mp:7,tgt:'enemy',kind:'phys',pow:2.6,desc:'とてもつよい一撃'},
  thunder:{name:'ピリリ',  cls:'mag',lv:1, mp:2, tgt:'enemy',  kind:'mag',el:'thunder',base:6, k:.9, desc:'⚡ かみなり（敵1体）'},
  ice:    {name:'ヒエヒエ',cls:'mag',lv:3, mp:4, tgt:'enemies',kind:'mag',el:'ice',    base:5, k:.6, desc:'❄ こおり（敵ぜんたい）'},
  sleep:  {name:'ねむねむ',cls:'mag',lv:5, mp:3, tgt:'enemies',kind:'sleep',rate:.6,          desc:'敵をねむらせる'},
  fire:   {name:'メラメラ',cls:'mag',lv:8, mp:6, tgt:'enemies',kind:'mag',el:'fire',   base:14,k:.9, desc:'🔥 ほのお（敵ぜんたい）'},
  bolt:   {name:'ゴロゴロ',cls:'mag',lv:11,mp:6, tgt:'enemy',  kind:'mag',el:'thunder',base:30,k:1.5,desc:'⚡ おおきなかみなり（敵1体）'},
  boom:   {name:'ドカーン',cls:'mag',lv:15,mp:12,tgt:'enemies',kind:'mag',el:null,     base:40,k:1.3,desc:'💥 大ばくはつ（敵ぜんたい）'},
  cure:   {name:'どくけし',cls:'pri',lv:2, mp:1, tgt:'poisoned',kind:'cure',            desc:'仲間の どくを なおす'},
  heal:   {name:'いやし',  cls:'pri',lv:1, mp:2, tgt:'ally',   kind:'heal',base:18,k:1.2,desc:'仲間1匹のHPを回復'},
  shield: {name:'まもりの葉',cls:'pri',lv:4,mp:3,tgt:'allies', kind:'buff',             desc:'みんなの守りを上げる'},
  light:  {name:'ひかり',  cls:'pri',lv:5, mp:3, tgt:'enemy',  kind:'mag',el:'light',  base:10,k:.9, desc:'✨ ひかり（敵1体）'},
  healall:{name:'みんないやし',cls:'pri',lv:7,mp:6,tgt:'allies',kind:'heal',base:22,k:1.0,desc:'みんなのHPを回復'},
  revive: {name:'めざめ',  cls:'pri',lv:10,mp:8, tgt:'dead',   kind:'revive',            desc:'たおれた仲間を生きかえらせる'},
};
const EL_ICON={fire:'🔥',ice:'❄',thunder:'⚡',light:'✨'};
const EL_NAME={fire:'ほのお',ice:'こおり',thunder:'かみなり',light:'ひかり'};
function skillsOf(m){return Object.keys(SKILLS).filter(k=>SKILLS[k].cls===m.cls&&SKILLS[k].lv<=m.lv);}

const ITEMS={
  herb:  {name:'やくそう',price:8,  desc:'HPを30回復',tgt:'ally',heal:30},
  antidote:{name:'どくけし草',price:6,desc:'どくを なおす',tgt:'poisoned',cure:true},
  herb2: {name:'上やくそう',price:30,desc:'HPを90回復',tgt:'ally',heal:90},
  water: {name:'まほうのしずく',price:40,desc:'MPを20回復',tgt:'ally',mp:20},
  leaf:  {name:'めざめの葉',price:80,desc:'たおれた仲間を生きかえらせる',tgt:'dead',revive:true},
};
const MAXITEM=9;
// 何度でも使える道具
const KEYITEMS={
  healstone:{name:'いやしの石',desc:'何度でも使える。みんなのHPを 40回復',heal:40},
};

// [名前, つよさ, ねだん]  tier0=はじめから
const EQUIP={
  war:{w:[['木のぼう',3,0],['石のツメ',8,90],['鉄のツメ',15,320],['ユーカリの大剣',24,900],['いにしえのツメ',34,2400],
          ['どうのツメ',13,260,{star:'店の目玉'}],['ほりほりスコップ',20,600,{star:'光る宝箱'}],['ディプロトドンのツメ',48,5000,{star:'光る宝箱'}]],
       a:[['草のふく',2,0],['かわのよろい',6,80],['いわのよろい',12,300],['こうらのよろい',19,850],['いにしえのよろい',27,2200],
          ['さんごのよろい',24,1800,{star:'店の目玉'}]]},
  mag:{w:[['小枝のつえ',2,0],['ユーカリのつえ',6,70],['ほしのつえ',11,290],['うずしおのつえ',17,820],['いにしえのつえ',25,2300],
          ['いかずちのつえ',14,900,{star:'店の目玉',use:'thunder'}],['ほしくずのつえ',26,2000,{star:'光る宝箱',use:'ice'}]],
       a:[['ぬののふく',1,0],['まほうのローブ',4,60],['ほしのローブ',8,260],['しおかぜのローブ',13,760],['いにしえのローブ',19,2000]]},
  pri:{w:[['葉っぱのぼう',2,0],['ユーカリのぼう',6,75],['いしのメイス',11,300],['さんごのメイス',17,830],['いにしえのメイス',24,2300]],
       a:[['ぬののふく',1,0],['葉のころも',5,70],['いわのころも',10,280],['うろこのころも',15,800],['いにしえのころも',22,2100],
          ['せいなるころも',28,3800,{star:'店の目玉',nopoison:true}]]},
};
function eqW(m){return EQUIP[m.cls].w[m.w];}
function eqA(m){return EQUIP[m.cls].a[m.a];}
function eqUse(m){const x=eqW(m)[3];return x&&x.use?x.use:null;}
function noPoison(m){const x=eqA(m)[3];return !!(x&&x.nopoison);}
const FEATURED=[['war','w',5],['mag','w',5],['war','a',5],['pri','a',5]]; // 町ごとの目玉
const HIDDEN=[{eq:['war','w',6]},{key:'healstone'},{eq:['mag','w',6]},{eq:['war','w',7]}]; // 光る宝箱
const GUARDS=['goanna','perentie','tidelord','ancient'];
function derived(m){
  const w=eqW(m)[1],a=eqA(m)[1];
  const d={maxhp:baseStat(m,'hp'),maxmp:baseStat(m,'mp'),def:baseStat(m,'def')+a,spd:baseStat(m,'spd')};
  if(m.cls==='war'){d.atk=baseStat(m,'atk')+w;d.mag=baseStat(m,'mag');}
  else if(m.cls==='mag'){d.atk=baseStat(m,'atk')+Math.floor(w/2);d.mag=baseStat(m,'mag')+w;}
  else {d.atk=baseStat(m,'atk')+w;d.mag=baseStat(m,'mag')+Math.floor(w/2);}
  return d;
}
function newMember(cls,name){const m={cls,name,lv:1,exp:0,w:0,a:0,hp:0,mp:0,poison:false};const d=derived(m);m.hp=d.maxhp;m.mp=d.maxmp;return m;}
function gainExp(m,amt){ // returns messages
  const out=[];if(m.lv>=MAXLV)return out;m.exp+=amt;
  while(m.lv<MAXLV&&m.exp>=expNext(m.lv)){
    m.exp-=expNext(m.lv);const before=derived(m),sk0=skillsOf(m);m.lv++;const after=derived(m);
    let s=`${m.name}は レベル${m.lv}に あがった！`;
    const ups=[['HP',after.maxhp-before.maxhp],['MP',after.maxmp-before.maxmp],['こうげき',after.atk-before.atk],['まもり',after.def-before.def],['まりょく',after.mag-before.mag]].filter(x=>x[1]>0).map(x=>x[0]+'+'+x[1]);
    out.push(s+'\n'+ups.join(' '));
    if(m.hp>0){m.hp=after.maxhp;m.mp=after.maxmp;}
    for(const k of skillsOf(m))if(!sk0.includes(k))out.push(`${m.name}は「${SKILLS[k].name}」を おぼえた！\n（${SKILLS[k].desc}）`);
  }
  return out;
}

// ---------- enemies ----------
// spr: 描画の種類, pal: 色, s: 大きさ
const ENEMIES={
  ant:   {name:'ブルドッグアリ',spr:'ant',   pal:'antR', hp:13, atk:9, def:3, spd:6, exp:9, gold:5, weak:['fire']},
  spider:{name:'ハンツマン',  spr:'spider',pal:'spid', hp:17, atk:10,def:4, spd:8, exp:12, gold:6, weak:['fire']},
  fox:   {name:'アカギツネ',  spr:'fox',   pal:'fox',  hp:21, atk:11,def:4, spd:9, exp:16,gold:8, weak:['ice']},
  tiger: {name:'タイガースネーク',spr:'snake',pal:'tiger',s:1.45,boss:true,hp:270,atk:17,def:6,spd:8,exp:70,gold:90,weak:['ice'],
          moves:[{n:'どくのキバで かみつく',k:'atk',poison:.6,w:3},{n:'しめつける',k:'atk',pow:1.6,w:2},{n:'しっぽをふりまわす',k:'all',pow:.7,w:2}]},
  wantr: {name:'ツムギアリ',  spr:'ant',   pal:'antG', hp:30, atk:16,def:8, spd:10,exp:20,gold:11,weak:['fire']},
  toad:  {name:'オオヒキガエル',spr:'toad', pal:'toad', hp:42, atk:17,def:9, spd:5, exp:25,gold:14,weak:['thunder'],
          moves:[{n:'たいあたり',k:'atk',w:3},{n:'どくのしるを とばす',k:'all',pow:.5,poison:.35,w:1}]},

// 迷路をつくる。行き止まり=宝箱、いちばん遠い所=階段かボス
function genFloor(dn,fi){
  const D=DUNGEONS[dn],F=D.floors[fi],r=rng(F.seed*7919+dn*131+fi);
  const cw=F.cw,ch=F.ch,W=cw*2+1,H=ch*2+1;
  const m=Array.from({length:H},()=>Array(W).fill('#'));
  const vis=new Set(['0,0']),st=[[0,0]];m[1][1]='.';
  while(st.length){
    const [cx,cy]=st[st.length-1];
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[cx+dx,cy+dy,dx,dy]).filter(([x,y])=>x>=0&&y>=0&&x<cw&&y<ch&&!vis.has(x+','+y));
    if(!nb.length){st.pop();continue;}
    const [nx,ny,dx,dy]=nb[Math.floor(r()*nb.length)];
    m[cy*2+1+dy][cx*2+1+dx]='.';m[ny*2+1][nx*2+1]='.';vis.add(nx+','+ny);st.push([nx,ny]);
  }
  // 少しだけ壁を抜いて、ぐるっと回れる道をつくる
  const loops=Math.floor(cw*ch/9);
  for(let k=0,tries=0;k<loops&&tries<500;tries++){
    const x=1+Math.floor(r()*(W-2)),y=1+Math.floor(r()*(H-2));
    if(m[y][x]!=='#')continue;
    const h=(x%2===0&&y%2===1&&m[y][x-1]==='.'&&m[y][x+1]==='.'),v=(x%2===1&&y%2===0&&m[y-1][x]==='.'&&m[y+1][x]==='.');
    if(!h&&!v)continue;
    // 行き止まりを壊さない
    const nbCount=(xx,yy)=>[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>m[yy+b][xx+a]!=='#').length;
    if(h&&(nbCount(x-1,y)===1||nbCount(x+1,y)===1))continue;
    if(v&&(nbCount(x,y-1)===1||nbCount(x,y+1)===1))continue;
    m[y][x]='.';k++;
  }
  // 距離
  const dist=Array.from({length:H},()=>Array(W).fill(-1));const q=[[1,1]];dist[1][1]=0;
  while(q.length){const [x,y]=q.shift();for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const X=x+a,Y=y+b;if(m[Y][X]!=='#'&&dist[Y][X]<0){dist[Y][X]=dist[y][x]+1;q.push([X,Y]);}}}
  const dead=[];
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(m[y][x]==='#'||(x===1&&y===1))continue;
    const n=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>m[y+b][x+a]!=='#').length;if(n===1)dead.push([x,y,dist[y][x]]);}
  dead.sort((a,b)=>b[2]-a[2]);
  const last=fi===D.floors.length-1;
  const goal=dead.shift();m[goal[1]][goal[0]]=last?'B':'D';
  if(last&&D.qitem&&dead.length){const g=dead.shift();m[g[1]][g[0]]='Q';}
  if(fi===0&&dead.length){const g=dead.shift();m[g[1]][g[0]]='H';}
  for(const [x,y] of dead)m[y][x]='T';
  m[1][1]=fi===0?'S':'U';
  return {W,H,m,dead:dead.length,goal};
}
function lootFor(dn,fi,x,y){ // 宝箱の中身（場所で決まる）
  const D=DUNGEONS[dn];let idx=0;
  for(let f=D.floors.length-1;f>=0;f--){const fl=genFloor(dn,f);const list=[];
    for(let yy=0;yy<fl.H;yy++)for(let xx=0;xx<fl.W;xx++)if(fl.m[yy][xx]==='T')list.push([xx,yy]);
    // 奥ほど先に（装備は最下層の奥）
    const dist=floorDist(fl);list.sort((a,b)=>dist[b[1]][b[0]]-dist[a[1]][a[0]]);
    for(const [xx,yy] of list){if(f===fi&&xx===x&&yy===y)return D.loot[idx%D.loot.length];idx++;}
  }
  return {gold:10};
}
function floorDist(fl){const {W,H,m}=fl;const dist=Array.from({length:H},()=>Array(W).fill(-1));const q=[[1,1]];dist[1][1]=0;
  while(q.length){const [x,y]=q.shift();for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const X=x+a,Y=y+b;if(m[Y][X]!=='#'&&dist[Y][X]<0){dist[Y][X]=dist[y][x]+1;q.push([X,Y]);}}}return dist;}

// ---------- battle ----------
function aliveParty(B){return B.party.map((m,i)=>i).filter(i=>B.party[i].hp>0);}
function aliveEnemies(B){return B.enemies.map((e,i)=>i).filter(i=>B.enemies[i].hp>0);}
function mkEnemy(id){const E=ENEMIES[id];return {id,name:E.name,hp:E.hp,max:E.hp,atk:E.atk,def:E.def,spd:E.spd,status:{},boss:!!E.boss};}
function newBattle(G,ids){
  const enemies=ids.map(mkEnemy);
  // 同じ名前に A B C
  const cnt={};ids.forEach(id=>cnt[id]=(cnt[id]||0)+1);const used={};
  enemies.forEach(e=>{if(cnt[e.id]>1){used[e.id]=(used[e.id]||0)+1;e.name+=' '+'ABCD'[used[e.id]-1];}});
  return {party:G.party,inv:G.inv,keys:G.keys||{},enemies,buffDef:0,over:null,turn:0,boss:enemies.some(e=>e.boss)};
}
function elemMult(id,el){const E=ENEMIES[id];if(!el)return 1;if(E.weak&&E.weak.includes(el))return 1.5;if(E.resist&&E.resist.includes(el))return .5;return 1;}
function physDmg(atk,def,pow,r){let b=atk-def/2;if(b<2)b=1+r()*1.5;return Math.max(1,Math.round(b*(.85+r()*.3)*(pow||1)));}

// おまかせ
function autoCmd(B,i){
  const m=B.party[i],d=derived(m),en=aliveEnemies(B),sk=skillsOf(m);
  const low=(j)=>{const x=B.party[j];return x.hp/derived(x).maxhp;};
  const can=k=>sk.includes(k)&&m.mp>=SKILLS[k].mp;
  const weakest=()=>en.slice().sort((a,b)=>B.enemies[a].hp-B.enemies[b].hp)[0];
  if(m.cls==='pri'){
    const dead=B.party.map((x,j)=>j).filter(j=>B.party[j].hp<=0);
    if(dead.length&&can('revive'))return {k:'skill',s:'revive',t:dead[0]};
    if(dead.length&&B.inv.leaf>0)return {k:'item',item:'leaf',t:dead[0]};
    const hurt=aliveParty(B).filter(j=>low(j)<.5).sort((a,b)=>low(a)-low(b));
    if(hurt.length>=2&&B.keys.healstone&&!can('healall'))return {k:'key',id:'healstone'};
    if(hurt.length>=2&&can('healall'))return {k:'skill',s:'healall'};
    if(hurt.length&&can('heal'))return {k:'skill',s:'heal',t:hurt[0]};
    if(hurt.length&&low(hurt[0])<.3&&B.inv.herb2>0)return {k:'item',item:'herb2',t:hurt[0]};
    if(hurt.length&&low(hurt[0])<.3&&B.inv.herb>0)return {k:'item',item:'herb',t:hurt[0]};
    const poi=aliveParty(B).filter(j=>B.party[j].poison);
    if(poi.length&&can('cure'))return {k:'skill',s:'cure',t:poi[0]};
    if(B.boss&&B.buffDef<=0&&can('shield'))return {k:'skill',s:'shield'};
    const lw=en.find(e=>elemMult(B.enemies[e].id,'light')>1);
    if(lw!==undefined&&can('light')&&m.mp>d.maxmp*.4)return {k:'skill',s:'light',t:lw};
    return {k:'attack',t:weakest()};
  }
  if(m.cls==='mag'){
    if(en.some(e=>ENEMIES[B.enemies[e].id].metal))return {k:'attack',t:en.find(e=>ENEMIES[B.enemies[e].id].metal)};
    const save=!B.boss&&m.mp<d.maxmp*.25;
    const u=eqUse(m);if(u&&(save||m.mp<SKILLS[u].mp*2)){const S=SKILLS[u];if(S.tgt==='enemies'&&en.length>=2||S.tgt==='enemy')return {k:'equse',t:en[0]};}
    if(!save){
      if(en.length>=2){
        let best=null,bs=0;
        for(const k of ['boom','fire','ice'])if(can(k)){const S=SKILLS[k];let sc=0;for(const e of en)sc+=(S.base+d.mag*S.k)*elemMult(B.enemies[e].id,S.el);if(sc>bs){bs=sc;best=k;}}
        if(best)return {k:'skill',s:best};
      }
      for(const k of ['bolt','thunder'])if(can(k)){const t=en.slice().sort((a,b)=>elemMult(B.enemies[b].id,'thunder')-elemMult(B.enemies[a].id,'thunder')||B.enemies[b].hp-B.enemies[a].hp)[0];return {k:'skill',s:k,t};}
    }
    return {k:'attack',t:weakest()};
  }
  // war
  const fr=aliveParty(B).filter(j=>j!==i&&low(j)<.3);

  else {S(ex,ey,'w');S(ex+1,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
  if(o.blush){S(hcx+1.4*K,hcy+2*K,'c');S(hcx+1.4*K+1,hcy+2*K,'c');}

  S(ncx-2.5,ncy+3.8,'o');S(ncx-1.5,ncy+3.8,'o');if(o.chew){S(ncx-2.5,ncy+4.8,'o');S(ncx-1.5,ncy+4.8,'o');}

  const out=g.slice();

    for(const [qx,qy] of [[x-1,y],[x+1,y],[x,y+1],[x,y-1]]){

}

const FW=40,FH=32,FAX=20;
function renderFront(o){
  const G=mkGrid(FW,FH),{g,pt,S,SE,E}=G;
  const sq=o.sq||0,cx=20,ty=o.bob||0;
  const bry=10.6+(o.br||0)-sq*8,brx=14*(1+sq);
  const bcy=27.5-bry;
  // paws (behind body first)
  const pawY=26;
  // body
  const fsh=(x,y)=>{const r=(y+.5-(bcy-bry))/(2*bry);return r<.18?(frost(x,y,r)?'f':'l'):r>.82?'d':(frost(x,y,r)?'f':'b');};
  E(cx,bcy,brx,bry,2,fsh);
  // head merges with body (no neck)
  const hcy=bcy-3.2+ty+(o.hy||0),hrx=10.4*(1+sq*.5),hry=8.6;
  E(cx,hcy,hrx,hry,3,(x,y,dy)=>dy<-.55?(frost(x,y,0)?'f':'l'):'b');
  // ears: small, wide-set, pale rims
  const eo=o.ear>0?1:0;
  for(const s of [-1,1]){
    const ex=cx+s*7.6,ey=hcy-7.4-eo;
    E(ex,ey,2.2,2.6,4,(x,y,dy)=>dy<-.25||Math.abs(x+.5-ex)>1.4?'p':'d');
  }
  fuzz(G,[2,3],bcy);
  // face: slightly lighter muzzle
  E(cx,hcy+3.8,6,3.6,5,()=>'l');
  // eyes: small, round, beady, wide-set
  for(const s of [-1,1]){
    const ex=Math.floor(cx+s*4.6-(s<0?1:0)),ey=Math.floor(hcy-1);
    if(o.eye==='closed'){S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
    else if(o.eye==='half'){S(ex,ey,'d');S(ex+1,ey,'d');S(ex,ey+1,'e');S(ex+1,ey+1,'e');S(ex+(s<0?0:1),ey+1,'e');}
    else if(o.eye==='happy'){S(ex,ey+1,'e');S(ex+1,ey,'e');S(ex+2,ey+1,'e');}
    else {S(ex,ey,'e');S(ex+1,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');S(ex+(s<0?0:0),ey,'w');}
  }
  if(o.blush){S(cx-7,hcy+2,'c');S(cx-6,hcy+2,'c');S(cx+6,hcy+2,'c');S(cx+7,hcy+2,'c');}
  // big bare nose
  // big bare nose: wide top, rounded bottom (shield shape), nostrils at the lower sides
  const ny=hcy+3.4+(o.nw||0);
  for(let y=Math.floor(ny-2.9);y<=ny+2.9;y++){const t=(y+.5-(ny-2.9))/5.8;let hw=4.7-2.4*t*t;if(t<.22)hw-=(.22-t)*6;
    for(let x=Math.floor(cx-hw);x<cx+hw;x++)S(x,y,t<.25?'nh':'n',6);}
  S(cx-3,ny+.6,'e',6);S(cx-2,ny+1.4,'e',6);S(cx+2,ny+.6,'e',6);S(cx+1,ny+1.4,'e',6);
  S(cx-.5,ny+2.2,'o',6);
  // mouth
  S(cx-.5,ny+3.3,'o');S(cx-1.5,ny+4,'o');S(cx+.5,ny+4,'o');
  if(o.chew){S(cx-.5,ny+4.2,'o');}
  G.g=g;
  const fin=outline(G);
  const P=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<FW&&y<FH)fin[y*FW+x]=c;};
  // front paws with long pale claws, turned slightly inward
  for(const s of [-1,1]){
    const px=cx+s*5.5;
    for(let y=pawY;y<=27;y++)for(let x=Math.floor(px-2);x<=Math.floor(px+1);x++)P(x,y,'d');
    P(px-2,28,'o');P(px+1,28,'o');
    const c0=s<0?px:px-2;P(c0-1,28,'k');P(c0,28,'k');P(c0+1,28,'k');
    P(px-3,pawY,'o');P(px+2,pawY,'o');P(px-3,27,'o');P(px+2,27,'o');
  }
  // whiskers
  for(const s of [-1,1]){
    const b=s<0?-1:0;
    P(cx+s*6.5+b,hcy+3.6,'v');P(cx+s*7.5+b,hcy+3.1,'v');P(cx+s*8.5+b,hcy+2.8,'v');
    P(cx+s*6.5+b,hcy+5,'v');P(cx+s*7.5+b,hcy+5.4,'v');P(cx+s*8.5+b,hcy+6,'v');
  }
  return {W:FW,H:FH,ax:FAX,img:fin};
}

const NOTE_N={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function noteFreq(s){const m=/^([A-G]#?)(\d)$/.exec(s);if(!m)return 0;return 440*Math.pow(2,(NOTE_N[m[1]]+(+m[2]+1)*12-69)/12);}
const MUS={name:null,timer:null,i:0,t:0,gain:null,toks:null};
function ensureAudio(){try{if(!SND.a)SND.a=new (window.AudioContext||window.webkitAudioContext)();if(SND.a.state==='suspended')SND.a.resume();if(!MUS.gain){MUS.gain=SND.a.createGain();MUS.gain.gain.value=1;MUS.gain.connect(SND.a.destination);}return true;}catch(e){return false;}}
function playMusic(name){if(MUS.name===name&&MUS.timer)return;MUS.name=name;startMusic();}
function stopMusic(){clearInterval(MUS.timer);MUS.timer=null;if(MUS.gain&&SND.a){const g=MUS.gain;const t=SND.a.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.15);const ng=SND.a.createGain();ng.gain.value=1;ng.connect(SND.a.destination);setTimeout(()=>{try{g.disconnect();}catch(e){}},400);MUS.gain=ng;}}
function startMusic(){
  stopMusic();if(!SND.on||!MUS.name||!SND.a||SND.a.state!=='running'||!TRACKS[MUS.name])return;
  const T=TRACKS[MUS.name],step=60/T.bpm/2,toks=[T.mel.split(/\s+/),T.bass.split(/\s+/)];
  MUS.i=0;MUS.t=SND.a.currentTime+.08;const gain=MUS.gain;
  MUS.timer=setInterval(()=>{const a=SND.a;if(!a||MUS.gain!==gain)return;
    while(MUS.t<a.currentTime+.3){
      for(let v=0;v<2;v++){const arr=toks[v],tok=arr[MUS.i%arr.length];if(!tok||tok==='-'||tok==='.')continue;
        let len=1;while(arr[(MUS.i+len)%arr.length]==='-'&&len<16)len++;
        const f=noteFreq(tok);if(!f)continue;
        const o=a.createOscillator(),g=a.createGain(),d=step*len*.9,vol=v?(T.bv||.04):(T.mv||.02),t=MUS.t;
        o.type=v?'triangle':(T.mw||'square');o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.setValueAtTime(vol,t+Math.max(.02,d-.06));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
        o.connect(g);g.connect(gain);o.start(t);o.stop(t+d+.03);}
      MUS.i++;MUS.t+=step;}
  },70);
}
function jingle(notes,step){if(!SND.on||!ensureAudio())return;const a=SND.a;let t=a.currentTime+.03;for(const n of notes.split(/\s+/)){if(n!=='-'&&n!=='.'){const f=noteFreq(n);const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+step*1.8);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+step*2);}t+=step;}}
const unlockAudio=()=>{if(!SND.on)return;if(ensureAudio()&&!MUS.timer&&MUS.name){if(SND.a.state==='running')startMusic();else SND.a.resume().then(()=>startMusic()).catch(()=>{});}};

function fieldWombat(dir,frame){
  return cached('fw|'+dir+frame,()=>{
    const flip=dir==='left',rows=FW_ROWS[flip?'right':dir].slice();
    if(frame){ // 足ぶみ
      const n=rows.length;
      if(dir==='down'||dir==='up')rows[n-1]='...ooo..oddo....';
      else {rows[n-2]='...oddo.oddo....';rows[n-1]='...ooo..ooo.....';}
    }
    const c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');
    const map={o:PAL.o,b:PAL.b,l:PAL.l,d:PAL.d,p:PAL.p,e:PAL.e,n:PAL.n,k:PAL.k};
    rows.forEach((r,j)=>{for(let i=0;i<16;i++){const ch=r[i];if(!ch||ch==='.')continue;x.fillStyle=map[ch];x.fillRect(flip?15-i:i,j+2,1,1);}});
    // せんしのかぶと
    x.fillStyle=ACC_COL.war.x;

    if(kind==='face'){x.fillStyle=T.face;x.fillRect(0,0,16,16);x.fillStyle=T.face2;x.fillRect(0,0,16,2);
      x.fillStyle=T.top;for(const [yy,off] of [[5,0],[10,4],[15,0]]){x.fillRect(0,yy,16,1);for(let xx=off;xx<16;xx+=8)x.fillRect(xx,yy-4,1,4);}

      x.fillStyle='#3b2a1a';x.fillRect(6,5,4,1);x.fillRect(5,6,6,1);x.fillRect(7,7,2,5);return c;}
    if(kind==='chest'||kind==='open'||kind==='qchest'||kind==='hchest'){
      const H=kind==='hchest',body=H?'#6a3aa8':kind==='qchest'?'#e8b830':'#a8642c',lid=H?'#9a6ae0':kind==='qchest'?'#ffd860':'#c9803c',band=H?'#ffd36b':kind==='qchest'?'#a8642c':'#e8c050';

      else{x.fillStyle=lid;x.fillRect(3,6,10,4);x.fillStyle=body;x.fillRect(3,10,10,4);x.fillStyle=band;x.fillRect(3,9,10,1);x.fillRect(7,8,2,4);x.fillStyle='#fff8d0';x.fillRect(4,7,2,1);}

  if(!done&&q.k==='gold'){const left=q.amt-(G.earned[t]||0);if(left>0)s+=`（あと${left}）`;}
  if(!done&&questDone(G,t,i))s+=short?' ←報告！':' ← 報告できる！';return s;}).join('\n');}
async function checkQuests(){
  const T=TOWNS[G.town],U=TOWN_UI[G.town];G.qdone[G.town]=G.qdone[G.town]||{};
  for(let i=0;i<T.quests.length;i++){

    const first=!unlocked(G.town);G.qdone[G.town][i]=true;snd('quest');
    const q=T.quests[i];let rw='';
    if(q.reward.gold){G.gold+=q.reward.gold;rw=`お礼に ${q.reward.gold}ウォン もらった！`;}
    if(q.reward.item){const n=addItem(q.reward.item,q.reward.n);rw=`お礼に ${ITEMS[q.reward.item].name}を ${q.reward.n}こ もらった！`+(n<q.reward.n?'（持ちきれない分は あきらめた）':'');}
    updateTop();
    banner('QUEST CLEAR!',q.text,'#ffd36b',2300);sparkle(96,70,30,null,50);
    await talk(`★ クエスト たっせい！ ★\n「${q.text}」`);

}

  layoutEnemies();mode='battle';fadeT=performance.now();playMusic(B.boss||B.opt.guard?'boss':'battle');disp=G.party.map(m=>({hp:m.hp,mp:m.mp,poison:m.poison}));renderParty();updateTop('せんとう');
  ids.forEach(id=>G.seen[id]=1);
  const names=[...new Set(B.enemies.map(e=>ENEMIES[e.id].name))];
  if(B.boss||B.opt.guard){setTimeout(()=>{banner(B.boss?'BOSS':'番人',names[0],'#ff6a6a',2000);shakeT=performance.now();},350);}
  setMsg(B.boss?`${names[0]}が おそいかかってきた！`:`${names.join('と ')}が あらわれた！`,false,0);setCmds([]);
  await bwait(B.boss||B.opt.guard?1600:1000);
  if(!G.flags.tipBattle){G.flags.tipBattle=1;
    await talks(['【たたかいの ヒント】\n1匹ずつ コマンドを えらぶと、ターンが はじまるよ。','まよったら「🤖 おまかせ」を おそう。\nみんなが いい感じに うごいてくれる。','敵を えらぶとき、名前の横の 🔥❄⚡✨ は「弱点」。\nその とくぎを 使うと 大ダメージ！','もし 負けても、たたかいの 前から やりなおせるよ。']);}
  battleLoop();
}
async function battleLoop(){
  while(true){
    disp=G.party.map(m=>({hp:m.hp,mp:m.mp,poison:m.poison}));BA.tstat={};BA.buffShow=B.buffDef>0;renderParty();
    const cmds=await inputPhase();BA.cmds=cmds;enemyMark=null;partyPick=null;BA.pickE=null;
    renderParty();setCmds([]);
    const ev=battleTurn(B,cmds,R);
    await playEvents(ev);
    if(B.over){await endBattle();return;}
  }
}
function inputPhase(){return new Promise(res=>{
  const order=aliveParty(B),cmds=[];let k=0;
  const reserved=id=>cmds.filter(c=>c&&c.k==='item'&&c.item===id).length;
  const next=()=>{if(k>=order.length){res(cmds);return;}renderParty(order[k]);menuFor(order[k]);};
  const clearPick=()=>{enemyMark=null;partyPick=null;BA.pickE=null;};
  const choose=c=>{clearPick();cmds[order[k]]=c;k++;next();};
  const back=()=>{clearPick();if(k>0){k--;cmds[order[k]]=null;}next();};
  const auto=()=>{clearPick();for(let j=k;j<order.length;j++)cmds[order[j]]=autoCmd(B,order[j]);k=order.length;next();};
  const enemyBtn=(i,fn)=>{const e=B.enemies[i],E=ENEMIES[e.id],w=(E.weak||[]).map(x=>EL_ICON[x]).join('');const hr=e.hp/e.max,bars=Math.max(1,Math.ceil(hr*5));
    return {label:`${e.name} ${w}`,sub:'のこり '+'▮'.repeat(bars)+'▯'.repeat(5-bars)+(w?' 弱点'+w:'')+(e.status.sleep>0?' ねむり':''),fn,hover:on=>{if(enemyMark)enemyMark.focus=on?i:null;}};};
  const pickE=(cb,again,title)=>{const al=aliveEnemies(B);enemyMark={list:al,all:false,focus:null};BA.pickE=i=>cb(i);
    setMsg((title||'どの 敵に？')+'\n（ボタンか、画面の 敵を おしてね）');
    setCmds([...al.map(i=>enemyBtn(i,()=>cb(i))),{label:'← もどる',cls:'wide sub',fn:()=>{clearPick();again();}}]);};
  const pickAllE=(name,cb,again)=>{const al=aliveEnemies(B);enemyMark={list:al,all:true};BA.pickE=()=>cb();
    setMsg(`${name}は 敵ぜんたいに きくよ。\n使って いい？`);
    setCmds([{label:'敵ぜんたいに 使う',cls:'wide hi',fn:()=>cb()},...al.map(i=>enemyBtn(i,()=>cb())),{label:'← もどる',cls:'wide sub',fn:()=>{clearPick();again();}}]);};
  const pickA=(text,filter,cb,again)=>{partyPick={ok:j=>filter(G.party[j],j),cb:j=>cb(j)};renderParty(order[k]);
    setMsg(text+'\n↓ 仲間の カードを おしてね');setCmds([{label:'← もどる',cls:'wide sub',fn:()=>{clearPick();renderParty(order[k]);again();}}]);};
  const pickAllA=(text,cb,again)=>{partyPick={ok:j=>G.party[j].hp>0,cb:()=>cb()};renderParty(order[k]);
    setMsg(text);setCmds([{label:'みんなに 使う',cls:'wide hi',fn:()=>cb()},{label:'← もどる',cls:'wide sub',fn:()=>{clearPick();renderParty(order[k]);again();}}]);};
  const est=(m,S)=>Math.round(S.base+derived(m).mag*S.k);
  const buffNote=()=>B.buffDef>0?`\nいま まもり↑ のこり${B.buffDef}ターン（重ねがけは できない。使うと 3ターンに もどる）`:'\n3ターンの あいだ、みんなの まもりが 上がる';
  const menuFor=i=>{
    const m=G.party[i],again=()=>menuFor(i);
    setMsg(`${m.name}（${CLASSES[m.cls].name}）は どうする？`+(k===0?'':'')+(m.cls==='war'?'':''));
    setCmds([
      {label:'⚔ たたかう',sub:'ふつうの こうげき',fn:()=>pickE(t=>choose({k:'attack',t}),again,'だれを こうげきする？')},
      {label:'✨ とくぎ',sub:'MPを 使う わざ',fn:()=>skillMenu(i)},
      {label:'🛡 ぼうぎょ',sub:'うける ダメージ 半分',fn:()=>choose({k:'defend'})},
      {label:'🎒 どうぐ',sub:'やくそう など',fn:()=>itemMenu(i)},
      {label:'🤖 おまかせ',sub:k===0?'みんな 自動で うごく':'のこりを 自動で',fn:auto,cls:'hi'},
      {label:'🏃 にげる',sub:B.boss?'ボスからは にげられない':'たたかいを やめる',dis:B.boss,fn:()=>{clearPick();const c=[];c[order[0]]={k:'run'};res(c);}},
      ...(k>0?[{label:'← 前の仲間に もどる',fn:back,cls:'wide sub'}]:[]),
    ]);
  };
  const skillMenu=i=>{
    const m=G.party[i],again=()=>skillMenu(i),ks=skillsOf(m);
    setMsg(`${m.name}の とくぎ（MP ${m.mp}）`);
    setCmds([...ks.map(key=>{const S=SKILLS[key];const noDead=(S.tgt==='dead'&&!G.party.some(x=>x.hp<=0))||(S.tgt==='poisoned'&&!G.party.some(x=>x.hp>0&&x.poison));
      return {label:`${S.name}  MP${S.mp}`,sub:S.desc,dis:m.mp<S.mp||noDead,fn:()=>{
        if(S.tgt==='enemy')pickE(t=>choose({k:'skill',s:key,t}),again,`${S.name}を どの 敵に？`);
        else if(S.tgt==='enemies')pickAllE(S.name,()=>choose({k:'skill',s:key}),again);
        else if(S.tgt==='allies')pickAllA(`${S.name}を みんなに 使う？`+(S.kind==='heal'?`（回復量 約${est(m,S)}）`:S.kind==='buff'?buffNote():''),()=>choose({k:'skill',s:key}),again);
        else if(S.tgt==='ally')pickA(`${S.name}を だれに？（回復量 約${est(m,S)}）`,x=>x.hp>0,t=>choose({k:'skill',s:key,t}),again);
        else if(S.tgt==='dead')pickA(`${S.name}を だれに？`,x=>x.hp<=0,t=>choose({k:'skill',s:key,t}),again);
        else if(S.tgt==='poisoned')pickA(`${S.name}を だれに？`,x=>x.hp>0&&x.poison,t=>choose({k:'skill',s:key,t}),again);
        else choose({k:'skill',s:key});}};}),{label:'← もどる',cls:'wide sub',fn:()=>menuFor(i)}]);
  };
  const itemMenu=i=>{
    const again=()=>itemMenu(i),ids=Object.keys(ITEMS).filter(id=>(G.inv[id]||0)-reserved(id)>0);
    const m=G.party[i],u=eqUse(m),keys=Object.keys(G.keys||{}).filter(k=>G.keys[k]);
    const spec=[...(u?[{label:`🔁 ${eqW(m)[0]}を ふる`,sub:`「${SKILLS[u].name}」が 何度でも 使える（MP 0）`,cls:'wide hi',fn:()=>{const S=SKILLS[u];if(S.tgt==='enemy')pickE(t=>choose({k:'equse',t}),again,`${S.name}を どの 敵に？`);else pickAllE(S.name,()=>choose({k:'equse'}),again);}}]:[]),
      ...keys.map(k=>({label:`🔁 ${KEYITEMS[k].name}`,sub:KEYITEMS[k].desc,cls:'wide hi',fn:()=>pickAllA(`${KEYITEMS[k].name}を みんなに 使う？（回復量 ${KEYITEMS[k].heal}）`,()=>choose({k:'key',id:k}),again)}))];
    if(!ids.length&&!spec.length){setMsg('どうぐを 持っていない。');setCmds([{label:'← もどる',cls:'wide sub',fn:()=>menuFor(i)}]);return;}
    setMsg('どの どうぐを 使う？（🔁は 何度でも 使える）');
    setCmds([...spec,...ids.map(id=>{const it=ITEMS[id];return {label:`${it.name} ×${G.inv[id]-reserved(id)}`,sub:it.desc,fn:()=>{
      if(it.cure)pickA(`${it.name}を だれに？`,x=>x.hp>0&&x.poison,t=>choose({k:'item',item:id,t}),again);
      else if(it.revive)pickA(`${it.name}を だれに？`,x=>x.hp<=0,t=>choose({k:'item',item:id,t}),again);
      else pickA(`${it.name}を だれに？`+(it.heal?`（回復量 ${it.heal}）`:it.mp?`（MP ${it.mp}回復）`:''),x=>x.hp>0,t=>choose({k:'item',item:id,t}),again);}};}),{label:'← もどる',cls:'wide sub',fn:()=>menuFor(i)}]);
  };
  next();
});}
async function playEvents(ev){
  let lines=[];const say=t=>{lines.push(t);if(lines.length>3)lines=lines.slice(-3);const pre=lines.slice(0,-1).join('\n');setMsg(lines.join('\n'),false,pre?[...pre].length+1:0);};
  for(const e of ev){
    switch(e.t){
      case 'act':lines=[];say(e.text);
        if(e.side==='p'){BA.p[e.i].step=1;const c=BA.cmds&&BA.cmds[e.i];if(c&&c.k==='defend')BA.tstat[e.i]='ぼうぎょ';if(c&&c.k==='skill'&&c.s==='guard')BA.tstat[e.i]='かばう';renderParty(e.i);}else{BA.e[e.i].lunge=now;}
        await bwait(450);if(e.side==='p')BA.p[e.i].step=0;break;
      case 'msg':say(e.text);if(e.text.includes('かいしん')){flashT=now;shakeT=now;}await bwait(450);break;
      case 'fx':spawnFx(e);if(e.kind!=='slash')snd(e.kind==='heal'?'heal':'magic');await bwait(e.kind==='slash'?120:420);break;
      case 'hit':
        if(e.side==='e'){BA.e[e.i].flash=now;BA.e[e.i].hp=e.hp;pop(enemyCenter(e.i),e.dmg,e.weak?'#ffe060':'#ffffff',e.weak||e.dmg>=40);snd('hit');if(e.weak)shakeT=now;}
        else{disp[e.i].hp=e.hp;BA.p[e.i].shake=now;shakeT=now;pop(partyCenter(e.i),e.dmg,e.poison?'#c98bff':'#ff8a8a');snd('phit');renderParty(undefined,e.i);}
        if(e.text)say(e.text);await bwait(500);break;
      case 'heal':
        if(e.side==='p'){disp[e.i].hp=e.hp;renderParty();pop(partyCenter(e.i),e.amt,'#8aff9a');}else{BA.e[e.i].hp=e.hp;pop(enemyCenter(e.i),e.amt,'#8aff9a');}
        if(e.text)say(e.text);await bwait(450);break;
      case 'status':if(e.poison!=null)disp[e.i].poison=e.poison;say(e.text);renderParty();await bwait(450);
        if(!G.flags.tipPoison&&e.poison){G.flags.tipPoison=1;say('（どくは「どくけし草」、そうりょの「どくけし」、宿屋で なおるよ）');await bwait(1400);}break;
      case 'buff':BA.buffShow=true;renderParty();break;
      case 'mp':disp[e.i].mp=e.mp;renderParty();if(e.text){say(e.text);await bwait(450);}break;
      case 'die':if(e.side==='e'){BA.e[e.i].dead=now;scatter(e.i);snd('die');}else disp[e.i].poison=false;await bwait(250);break;
      case 'revive':disp[e.i].hp=e.hp;disp[e.i].poison=false;partySparkle(e.i,'#8aff9a');renderParty();say(e.text);await bwait(450);break;
      case 'add':BA.e.push({flash:-1e9,lunge:-1e9,dead:0,hp:B.enemies[e.i].hp});layoutEnemies();G.seen[B.enemies[e.i].id]=1;say(e.text);await bwait(500);break;
    }
  }
}
async function endBattle(){
  disp=null;renderParty();
  if(B.over==='win'){
    const rw=battleRewards(B);stopMusic();jingle('C5 E5 G5 C6 - G5 C6 - -',.1);BA.win=now;G.battles++;
    await talk(`敵を やっつけた！\n${rw.exp}の けいけんちを 手に入れた！`+(rw.gold?`\n${rw.gold}ウォンを ひろった！`:''));
    addGold(rw.gold);
    for(const m of G.party){const ms=gainExp(m,rw.exp),mi=G.party.indexOf(m);for(const s of ms){if(s.includes('レベル')){jingle('G5 C6 E6 G6',.08);banner('LEVEL UP!',`${m.name}  Lv${(s.match(/レベル(\d+)/)||[0,m.lv])[1]}`,'#7cf0ff',1700);partySparkle(mi);}else snd('lvl');renderParty();await talk(s);}}
    renderParty();
    if(B.opt.boss){G.bossDown[B.opt.d]=true;save();await bossDown(B.opt.d);return;}
    if(B.opt.guard){B=null;BA=null;mode='field';fadeT=now;playMusic('dungeon');await openHidden();backToField();return;}
    save();backToField();return;
  }
  if(B.over==='run'){backToField();return;}
  if(B.over==='fled'){await talk('敵は みんな にげてしまった…');backToField();return;}
  stopMusic();snd('die');
  await talk('ウォンバットたちは ちからつきて しまった…');
  const c=await ask('どうする？\n（どちらを えらんでも、なにも 失わないよ）',[{label:'↻ たたかいの 前から やりなおす',cls:'wide hi'},'🏠 町に もどる（HPは 全回復）']);
  const ids=B.ids,opt=B.opt,ret=B.ret;G=JSON.parse(B.snap);
  if(c===0){if(ret){F.d=ret.d;F.fi=ret.fi;F.fl=genFloor(ret.d,ret.fi);F.px=ret.px;F.py=ret.py;}startBattle(ids,opt);return;}
  G.party.forEach(m=>{const d=derived(m);m.hp=d.maxhp;m.mp=d.maxmp;});fadeT=now;enterTown(G.town);
}
function backToField(){B=null;BA=null;disp=null;mode='field';fadeT=now;busy=false;renderParty();playMusic('dungeon');fieldIdle();}
async function bossDown(d){
  const lines=[
    ['タイガースネークは 草むらへ にげていった。','巣穴に 平和が もどった！\n（町に もどって 長老に 報告しよう）'],
    ['ディンゴのボスは 群れを つれて 去っていった。','鉱山あとに 平和が もどった！\n（町に もどって 報告しよう）'],
    ['イリエワニは しずかに 海へ 帰っていった。','洞くつに 平和が もどった！\n（町に もどって 報告しよう）'],
  ][d];
  if(d===3){await ending();return;}
  await talks(lines);backToField();
}
async function ending(){
  mode='ending';fadeT=now;G.cleared=true;save();updateTop('');playMusic('ending');
  await talks(['ドロップベアは「ここまでか…」と つぶやいて、\n木の上へ きえていった。',
    '遺跡の いちばん奥で、大きな 足あとの 化石が 光りはじめた…',
    '「よくぞ 来た、小さき 子孫たちよ」',
    '「わしは ディプロトドン。大むかし この大地を 歩いていた、おまえたちの 遠い 親せきじゃ」',
    '「レガシーとは 宝では ない。\n穴を ほり、仲間と 分けあい、ねぐらを 守る… その くらしこそが、わしらの のこしたものじゃ」',
    '「大地を うるおす 力を さずけよう。ふるさとへ 帰るがよい」',
    'こうして ウォンバットたちは 村へ 帰り、\n大地には ふたたび ユーカリが しげった。']);
  banner('THE END','ウォンバット☆レガシーRPG','#ffd36b',3500);
  const min=Math.max(1,Math.round((Date.now()-G.started)/60000));
  await talk(`ウォンバット☆レガシーRPG\n～ おしまい ～\n\nせんとう ${G.battles}回 / レベル ${G.party.map(m=>m.lv).join('・')}`+(min<600?` / 約${min}分`:''));
  const c=await ask('あそんでくれて ありがとう！',[{label:'つづけて あそぶ（遺跡のふもと）',cls:'wide'},{label:'タイトルへ',cls:'wide'}]);
  if(c===0){G.party.forEach(m=>{const d=derived(m);m.hp=d.maxhp;m.mp=d.maxmp;});enterTown(3);}else title();
}

// ---------- input ----------
const KEYDIR={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
document.addEventListener('keydown',e=>{
  const dir=KEYDIR[e.key]||KEYDIR[e.key.toLowerCase&&e.key.toLowerCase()];
  if(dir&&mode==='field'){e.preventDefault();if(!busy)heldDir=dir;return;}
  if(e.key==='Enter'||e.key===' '||e.key==='z'||e.key==='Z'){e.preventDefault();if(e.repeat)return;
    if(advance)advance();else if(skipFn)skipFn();else if(cmdList.length===1){snd('tap');cmdList[0].fn();}return;}
  if((e.key==='Escape'||e.key==='x'||e.key==='X')&&mode==='field'&&!busy&&!F.moving){openFieldMenu();return;}
  if(/^[1-9]$/.test(e.key)){const it=cmdList[+e.key-1];if(it){snd('tap');it.fn();}}
});
document.addEventListener('keyup',e=>{const dir=KEYDIR[e.key]||KEYDIR[e.key.toLowerCase&&e.key.toLowerCase()];if(dir&&heldDir===dir)heldDir=null;});
window.addEventListener('blur',()=>heldDir=null);
document.querySelectorAll('#dpad button').forEach(b=>{
  const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(busy)return;heldDir=d;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}tryMove(d);});
  const up=()=>{if(heldDir===d)heldDir=null;b.classList.remove('on');};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
async function openFieldMenu(){
  if(busy||!F||F.moving)return;heldDir=null;busy=true;showPad(false);
  const c=await ask('メニュー',[{label:'📊 つよさ・どうぐ',cls:''},{label:'🏠 町に もどる',cls:''},{label:'← とじる',cls:'wide sub'}]);
  if(c===0){await new Promise(res=>partyMenu(res));}
  if(c===1){const k=await ask('ダンジョンを 出て、町に もどりますか？\n（あけた宝箱や たおしたボスは そのまま）',['町に もどる','やめる']);if(k===0){busy=false;leaveDungeon();return;}}
  busy=false;fieldIdle();
}
$('fmenu').onclick=()=>{snd('tap');openFieldMenu();};
$('fmap').onclick=()=>{if(!G)return;snd('tap');G.flags.noMap=!G.flags.noMap;$('fmap').textContent=G.flags.noMap?'🗺 地図 OFF':'🗺 地図';save();};

requestAnimationFrame(frame);
title();
