 background:linear-gradient(170deg,#ffe8f1,#fff4dc);transition:background .8s}

 box-shadow:0 5px 0 #d6c4d4;display:flex;flex-direction:column;align-items:center;transition:transform .05s;position:relative}

 $('ageT').textContent=age+'歳'+mo+'ヶ月';$('stageT').textContent=st.n+'・'+pers().e+pers().n;$('kid').textContent=st.e;$('app').style.background=st.bg;
 [['hap','s_hap'],['bond','s_bond'],['gaku','s_gaku'],['hp','s_hp']].forEach(function(p){var el=$(p[1]);el.querySelector('i').style.width=G[p[0]]+'%';
  el.classList.toggle('low',p[0]!=='gaku'&&G[p[0]]<20)});
 $('net').textContent='先月の収支 '+man(G.net);$('net').style.color=G.net<0?'#e0203a':'#1f9d5c';
 $('app').classList.toggle('debt',G.money<0);$('sweat').style.display=G.hp<30?'block':'none';
 var c=$('spark').getContext('2d'),h=G.hist,w=168,hh=56;c.clearRect(0,0,w,hh);if(h.length>1){var mn=Math.min.apply(null,h.concat([0])),mx=Math.max.apply(null,h.concat([1]));
  var y0=hh-4-(0-mn)/(mx-mn||1)*(hh-8);c.strokeStyle='#ccc';c.beginPath();c.moveTo(0,y0);c.lineTo(w,y0);c.stroke();
  c.lineWidth=3;c.strokeStyle=G.money<0?'#e0203a':'#1f9d5c';c.beginPath();h.forEach(function(v,i){var x=i/(h.length-1)*w,y=hh-4-(v-mn)/(mx-mn||1)*(hh-8);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}}

// ===== メインループ =====
var last=performance.now();
function loop(now){var dt=Math.min(50,now-last);last=now;
 if(!paused&&!G.ended){var st=STAGES[stg()];
  monthT+=dt;$('mbarIn').style.width=(monthT/MONTH_MS*100)+'%';
  if(monthT>=MONTH_MS){monthT=0;G.m++;monthly();if(G.m%12===0)birthday();decisions();
   if(G.money<-3000000)ending('破産');else if(G.m>=END_M)ending('卒業');else saveGame()}
  var bh='';for(var bk in BUFF)if(BUFF[bk]>0){BUFF[bk]-=dt;bh+='<div class="buff">'+BUFFN[bk]+' '+Math.ceil(BUFF[bk]/1000)+'</div>'}$('buffs').innerHTML=bh;if(BUFF.hp>0)G.hp=100;
  // 体力回復
  var regen=7.5-(G.hardJob?1.5:0)-(G.careSelf>0?3:0);G.hp=clamp(G.hp+Math.max(1.5,regen)*dt/1000,0,100);
  if(G.hp<=0.5&&!G.down){G.down=1;pay(50000);add({hap:-10});G.hp=60;needs.slice().forEach(removeNeed);work.slice().forEach(removeWork);G.eval=clamp(G.eval-10,0,100);shake();vib([100,50,100]);news('🚑 過労でダウン… 通院費 -5万円 幸福-10','bad');setTimeout(function(){G.down=0},3000)}
  // 要求
  needs.slice().forEach(function(n){n.t-=dt*(BUFF.slow>0?.5:1);var r=n.t/n.max;
   if(BUFF.free>0&&r<.6){freeNeed(n);return}
   if(G.auto&&G.autoOn&&r<AUTO[G.auto].th){autoNeed(n);return}
   n.el.style.background='conic-gradient('+(r>.55?'#ffa600':r>.25?'#ff5c97':'#e0203a')+' '+(r*360)+'deg, rgba(255,255,255,.35) 0)';
   n.el.classList.toggle('urgent',r<.3);if(n.t<=0)missNeed(n)});
  if(G.dual){work.slice().forEach(function(o){o.t-=dt;var r=o.t/o.max;
    o.el.style.background='conic-gradient('+(r>.3?'#7d8cff':'#e0203a')+' '+(r*360)+'deg, rgba(255,255,255,.15) 0)';o.el.classList.toggle('urgent',r<.3);if(o.t<=0)missWork(o)});
   nextWork-=dt;if(nextWork<=0){spawnWork();nextWork=rnd(1300,2600)*(G.hardJob?.75:1)*(1-Math.min(G.m/12,18)*.025)*(G.shortT?1.6:1)}
   $('workEval').textContent=(G.shortT?'⏬時短 ':'')+'評価 '+Math.round(G.eval)+(G.eval>=70?' 🏆ボーナス圏':G.eval<20&&!G.shortT?' ⚠時短の危機':G.eval<35?' ⚠減給圏':'');$('work').classList.toggle('idle',!work.length)}
  nextNeed-=dt;if(nextNeed<=0){spawnNeed();nextNeed=rnd(st.sp[0],st.sp[1])*(pers().sp||1)*(fever>0?.6:1)}
  if(fever>0){fever-=dt;if(fever<=0){$('app').classList.remove('fever');$('feverTag').style.display='none'}}
  eventT-=dt;if(eventT<=0){randomEvent();eventT=rnd(2200,4200)}
  if(giftLife>0){giftLife-=dt;if(giftLife<=0)$('gift').style.display='none'}else{giftT-=dt;if(giftT<=0){spawnGift();giftT=rnd(5000,10000)}}
 }
 dispMoney+=(G.money-dispMoney)*.18;if(Math.abs(G.money-dispMoney)<1)dispMoney=G.money;
 $('money').textContent=yen(dispMoney);$('money').className=dispMoney<0?'neg':'';
 rt+=dt;if(rt>120){rt=0;render();updAuto()}
 drawFx(dt/1000);requestAnimationFrame(loop)}

var SV=loadSave();
newGame();lastStage=0;
if(SV)card('📂','つづきから遊ぶ？',(SV.m/12|0)+'歳'+(SV.m%12)+'ヶ月の途中データがあります。<br>所持金 '+yen(SV.money)+achHTML(),[
 {l:'つづきから',f:function(){restore(SV)}},{l:'はじめから',s:'途中データは消えます',cls:'gray',f:function(){clearSave();newGame();intro()}}],true);
else intro();
requestAnimationFrame(loop);
</script>
</body>
