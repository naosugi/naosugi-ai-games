<script>
// ================= LOGIC START =================
const DEAL=31; // 1人あたりの配牌枚数
const SUITCH=['萬','筒','索'];
const HON=['東','南','西','北','白','發','中'];
const GREEN=new Set([19,20,21,23,25,32]);
const DRAGONS=[31,32,33], WINDS=[27,28,29,30];
const YAO=[0,8,9,17,18,26,27,28,29,30,31,32,33];
const isHonor=t=>t>=27;
const isTerm=t=>t<27&&(t%9===0||t%9===8);
const isYao=t=>t>=27||t%9===0||t%9===8;
function tname(t){return t<27?(t%9+1)+SUITCH[t/9|0]:HON[t-27];}

function canMelds(c,i){
  while(i<34&&c[i]===0)i++;
  if(i===34)return true;
  if(c[i]>=3){c[i]-=3;const r=canMelds(c,i);c[i]+=3;if(r)return true;}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;const r=canMelds(c,i);c[i]++;c[i+1]++;c[i+2]++;if(r)return true;}
  return false;
}
function isStd(c){for(let p=0;p<34;p++)if(c[p]>=2){c[p]-=2;const r=canMelds(c,0);c[p]+=2;if(r)return true;}return false;}
function isChiitoi(c){let n=0;for(let i=0;i<34;i++){if(c[i]===2)n++;else if(c[i]!==0)return false;}return n===7;}
function isKokushi(c){for(const t of YAO)if(!c[t])return false;let s=0;for(let i=0;i<34;i++){if(c[i]&&!isYao(i))return false;s+=c[i];}return s===14;}
function isAgari(c,kan){if(kan>=0)return isStd(c);return isStd(c)||isChiitoi(c)||isKokushi(c);}

function dfsMelds(c,i,melds,cb){
  while(i<34&&c[i]===0)i++;
  if(i===34){cb(melds);return;}
  if(c[i]>=3){c[i]-=3;melds.push({k:'pon',t:i});dfsMelds(c,i,melds,cb);melds.pop();c[i]+=3;}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;melds.push({k:'chi',t:i});dfsMelds(c,i,melds,cb);melds.pop();c[i]++;c[i+1]++;c[i+2]++;}
}
function decompositions(c){
  const res=[];
  for(let p=0;p<34;p++)if(c[p]>=2){c[p]-=2;dfsMelds(c,0,[],m=>res.push({pair:p,melds:m.slice()}));c[p]+=2;}
  return res;
}
function calcPoints(han,fu){
  if(han>=13)return{pts:32000,name:'数え役満'};
  if(han>=11)return{pts:24000,name:'三倍満'};
  if(han>=8)return{pts:16000,name:'倍満'};
  if(han>=6)return{pts:12000,name:'跳満'};
  if(han>=5)return{pts:8000,name:'満貫'};
  const base=fu*Math.pow(2,han+2);
  if(base>=2000)return{pts:8000,name:'満貫'};
  return{pts:Math.ceil(base*4/100)*100,name:''};
}
function mkYakuman(list){
  const n=list.reduce((a,b)=>a+b[1],0);
  return{yakuman:n,han:13*n,fu:0,pts:32000*n,name:n===1?'役満':(n===2?'ダブル役満':n+'倍役満'),
    yaku:list.map(([nm,k])=>({name:nm,han:k>1?'ダブル役満':'役満'}))};
}
function tilesOf(c,kan){const a=[];for(let i=0;i<34;i++)for(let k=0;k<c[i];k++)a.push(i);if(kan>=0)for(let k=0;k<4;k++)a.push(kan);return a;}

// ドラ表示牌→ドラ
function doraOf(ind){if(ind<27)return ind-ind%9+(ind%9+1)%9;if(ind<31)return 27+(ind-27+1)%4;return 31+(ind-31+1)%3;}
// 全員につく役・状況役（ダブル立直/一発/河底/ドラ）
function extraYaku(c,kan,opts){
  const y=[{name:'ダブル立直',han:2}];
  if(opts.ippatsu)y.push({name:'一発',han:1});
  if(opts.houtei)y.push({name:'河底撈魚',han:1});
  if(opts.dora!=null&&opts.dora>=0){const n=c[opts.dora]+(kan===opts.dora?4:0);if(n)y.push({name:'ドラ',han:n});}
  return y;
}
function evalChiitoi(c,opts){
  const tiles=tilesOf(c,-1);
  if(tiles.every(isHonor))return mkYakuman([['字一色',1]]);
  const y=[{name:'七対子',han:2}];
  extraYaku(c,-1,opts).forEach(x=>y.push(x));
  if(tiles.every(t=>!isYao(t)))y.push({name:'断么九',han:1});
  if(tiles.every(isYao))y.push({name:'混老頭',han:2});
  const suits=new Set(tiles.filter(t=>t<27).map(t=>t/9|0));
  if(suits.size===1){if(tiles.some(isHonor))y.push({name:'混一色',han:3});else y.push({name:'清一色',han:6});}
  const han=y.reduce((a,b)=>a+b.han,0);const p=calcPoints(han,25);
  return{yakuman:0,han,fu:25,pts:p.pts,name:p.name,yaku:y};
}

function evalPlacement(melds,pair,pl,c,kan,kanRev,rev,opts,chuuren){
  const pons=melds.filter(m=>m.k==='pon'),chis=melds.filter(m=>m.k==='chi');
  const tiles=tilesOf(c,kan);
  const ponT=new Set(pons.map(m=>m.t));
  const ym=[];
  if(DRAGONS.every(t=>ponT.has(t)))ym.push(['大三元',1]);
  const wp=WINDS.filter(t=>ponT.has(t)).length;
  if(wp===4)ym.push(['大四喜',2]);else if(wp===3&&WINDS.includes(pair))ym.push(['小四喜',1]);
  if(tiles.every(isHonor))ym.push(['字一色',1]);
  if(tiles.every(t=>GREEN.has(t)))ym.push(['緑一色',1]);
  if(tiles.every(isTerm))ym.push(['清老頭',1]);
  if(chuuren)ym.push([chuuren===2?'純正九蓮宝燈':'九蓮宝燈',chuuren]);
  // 四暗刻：ロンのみなので、ロンした刻子は明刻扱い。成立するのは単騎待ちだけ
  if(pons.length-(pl.type==='shanpon'?1:0)===4)ym.push(['四暗刻',1]);
  if(ym.length)return mkYakuman(ym);
  const y=[];const add=(n,h)=>y.push({name:n,han:h});
  extraYaku(c,kan,opts).forEach(x=>y.push(x));
  if(tiles.every(t=>!isYao(t)))add('断么九',1);
  const pinfu=chis.length===4&&pl.type==='ryanmen'&&!DRAGONS.includes(pair);
  if(pinfu)add('平和',1);
  const cc={};chis.forEach(m=>cc[m.t]=(cc[m.t]||0)+1);let pk=0;for(const k in cc)pk+=Math.floor(cc[k]/2);
  if(pk>=2)add('二盃口',3);else if(pk===1)add('一盃口',1);
  DRAGONS.forEach(t=>{if(ponT.has(t))add('役牌 '+HON[t-27],1);});
  const chiT=new Set(chis.map(m=>m.t));
  for(let r=0;r<7;r++)if(chiT.has(r)&&chiT.has(9+r)&&chiT.has(18+r)){add('三色同順',2);break;}
  for(let s=0;s<3;s++){const b=s*9;if(chiT.has(b)&&chiT.has(b+3)&&chiT.has(b+6)){add('一気通貫',2);break;}}
  const allYaoSets=isYao(pair)&&melds.every(m=>m.k==='pon'?isYao(m.t):(m.t%9===0||m.t%9===6));
  const hasHonor=tiles.some(isHonor);
  if(allYaoSets&&chis.length>0){if(hasHonor)add('混全帯么九',2);else add('純全帯么九',3);}
  if(pons.length===4)add('対々和',2);
  const anko=pons.length-(pl.type==='shanpon'?1:0);
  if(anko===3)add('三暗刻',2);
  for(let r=0;r<9;r++)if(ponT.has(r)&&ponT.has(9+r)&&ponT.has(18+r)){add('三色同刻',2);break;}
  const dp=DRAGONS.filter(t=>ponT.has(t)).length;
  if(dp===2&&DRAGONS.includes(pair))add('小三元',2);
  if(chis.length===0&&tiles.every(isYao))add('混老頭',2);
  const suits=new Set(tiles.filter(t=>t<27).map(t=>t/9|0));
  if(suits.size===1){if(hasHonor)add('混一色',3);else add('清一色',6);}
  pons.forEach(m=>{if(m.t>=27){if(m.kan){if(kanRev)add('字牌槓子公開',3);}else if(rev.has(m.t))add('字牌暗刻公開',2);}});
  const han=y.reduce((a,b)=>a+b.han,0);
  let fu;
  if(pinfu)fu=30;
  else{
    fu=30; // 符底20 + 門前ロン10
    melds.forEach((m,i)=>{
      if(m.k!=='pon')return;
      const yao=isYao(m.t);
      let f=m.kan?(yao?32:16):(yao?8:4);
      if(!m.kan&&pl.type==='shanpon'&&pl.i===i)f/=2;
      fu+=f;
    });
    if(DRAGONS.includes(pair))fu+=2;
    if(pl.type==='kanchan'||pl.type==='penchan'||pl.type==='tanki')fu+=2;
    fu=Math.ceil(fu/10)*10;
  }
  const p=calcPoints(han,fu);
  return{yakuman:0,han,fu,pts:p.pts,name:p.name,yaku:y,wait:pl.type};
}

function evalStd(d,c,h,w,kan,kanRev,rev,opts){
  const melds=d.melds.map(m=>({k:m.k,t:m.t,kan:false}));
  if(kan>=0)melds.push({k:'pon',t:kan,kan:true});
  const pair=d.pair,places=[];
  if(pair===w)places.push({type:'tanki'});
  melds.forEach((m,i)=>{
    if(m.kan)return;
    if(m.k==='pon'&&m.t===w)places.push({type:'shanpon',i});
    if(m.k==='chi'&&w>=m.t&&w<=m.t+2){
      let ty;
      if(w===m.t+1)ty='kanchan';
      else if(w===m.t+2&&m.t%9===0)ty='penchan';
      else if(w===m.t&&m.t%9===6)ty='penchan';
      else ty='ryanmen';
      places.push({type:ty,i});
    }
  });
  let chuuren=0;
  if(kan<0){
    for(let s=0;s<3;s++){
      const b=s*9;let tot=0;for(let i=b;i<b+9;i++)tot+=c[i];
      if(tot!==14)continue;
      const pat=[3,1,1,1,1,1,1,1,3];
      if(pat.every((v,k)=>c[b+k]>=v))chuuren=pat.every((v,k)=>h[b+k]===v)?2:1;
    }
  }
  return places.map(pl=>evalPlacement(melds,pair,pl,c,kan,kanRev,rev,opts,chuuren));
}

// h: 手牌（カン以外）の枚数配列, kan: カンの牌種 or -1, kanRev: カン公開, rev: 公開した字牌暗刻のSet, w: 和了牌
function scoreHand(h,kan,kanRev,rev,w,opts){
  opts=opts||{};
  if(kan===w)return null;
  const c=h.slice();c[w]++;
  if(c[w]>4)return null;
  let best=null;
  const take=r=>{if(!best||r.pts>best.pts||(r.pts===best.pts&&r.han>best.han))best=r;};
  if(kan<0&&isKokushi(c)){const dbl=YAO.every(t=>h[t]===1);take(mkYakuman([[dbl?'国士無双十三面':'国士無双',dbl?2:1]]));}
  if(kan<0&&isChiitoi(c))take(evalChiitoi(c,opts));
  for(const d of decompositions(c))for(const r of evalStd(d,c,h,w,kan,kanRev,rev,opts))take(r);
  return best;
}

function maxRev(h){const r=new Set();for(let t=27;t<34;t++)if(h[t]===3)r.add(t);return r;}

// 手牌情報: 待ち、各待ちの点数、残り枚数、捨て牌側に同じ牌があるか
function handInfo(h,kan,cnt,rev,kanRev,dora){
  if(!rev){rev=maxRev(h);kanRev=kan>=27;}
  const waits=[];
  for(let w=0;w<34;w++){
    if(kan===w||h[w]>=4)continue;
    const c=h.slice();c[w]++;
    if(!isAgari(c,kan))continue;
    const r=scoreHand(h,kan,kanRev,rev,w,{dora});
    if(!r)continue;
    const disc=cnt[w]-h[w]-(kan===w?4:0);
    waits.push({t:w,r,avail:4-cnt[w],disc});
  }
  const ok=waits.some(x=>x.r.pts>=8000&&x.avail>0);
  return{h,kan,waits,ok,tenpai:waits.length>0,rev,kanRev};
}
function evHand(info,oppForced){
  // 待ちごとの「相手が持っている確率」を高い点の待ちから順に重ねる（多面待ちの過大評価を防ぐ）
  const q=DEAL/(136-DEAL);let ev=0,miss=1;
  const ws=info.waits.filter(x=>x.r.pts>=8000&&x.avail>0).sort((a,b)=>b.r.pts-a.r.pts);
  for(const x of ws){
    let p=1-Math.pow(1-q,x.avail);
    if(x.t===oppForced)p=Math.max(p,0.6);
    ev+=miss*p*x.r.pts;miss*=(1-p);
  }
  if(info.waits.some(x=>x.disc>0))ev*=0.6;
  return ev;
}

const MELDS=[];
for(let t=0;t<34;t++)MELDS.push([t,t,t]);
for(let s=0;s<3;s++)for(let r=0;r<7;r++){const b=s*9+r;MELDS.push([b,b+1,b+2]);}

// 配牌から作れる聴牌形(13枚 or カン込み14枚)をすべて列挙
function enumHands(cnt){
  const out=new Map();
  const addH=(h,kan)=>{const k=h.join(',')+'|'+kan;if(!out.has(k))out.set(k,{h:h.slice(),kan});};
  const kans=[-1];for(let t=0;t<34;t++)if(cnt[t]===4)kans.push(t);
  for(const kan of kans){
    const avail=cnt.slice();if(kan>=0)avail[kan]=0;
    const use=new Array(34).fill(0);let extra=-1;
    const put=t=>{if(use[t]<avail[t]){use[t]++;return true;}if(extra===-1&&cnt[t]<4){extra=t;use[t]++;return true;}return false;};
    const unput=t=>{use[t]--;if(extra===t&&use[t]===avail[t])extra=-1;};
    const finish=()=>{
      if(extra>=0){const h=use.slice();h[extra]--;addH(h,kan);}
      else for(let t=0;t<34;t++)if(use[t]>0&&cnt[t]<4){const h=use.slice();h[t]--;addH(h,kan);}
    };
    const need=kan>=0?3:4;
    const dfs=(mi,left)=>{
      if(left===0){finish();return;}
      for(let i=mi;i<MELDS.length;i++){
        const m=MELDS[i];let k=0;
        for(;k<3;k++)if(!put(m[k]))break;
        if(k===3)dfs(i,left-1);
        for(let j=k-1;j>=0;j--)unput(m[j]);
      }
    };
    for(let p=0;p<34;p++){
      if(!put(p))continue;
      if(!put(p)){unput(p);continue;}
      dfs(0,need);
      unput(p);unput(p);
    }
  }
  // 七対子
  const A=[],B=[];for(let t=0;t<34;t++){if(cnt[t]>=2)A.push(t);else if(cnt[t]===1)B.push(t);}
  const combos=(arr,k,start,cur,cb)=>{if(cur.length===k){cb(cur);return;}for(let i=start;i<arr.length;i++){cur.push(arr[i]);combos(arr,k,i+1,cur,cb);cur.pop();}};
  combos(A,7,0,[],sel=>{for(const w of sel){if(cnt[w]>=4)continue;const h=new Array(34).fill(0);sel.forEach(t=>h[t]=2);h[w]=1;addH(h,-1);}});
  combos(A,6,0,[],sel=>{for(const b of B){const h=new Array(34).fill(0);sel.forEach(t=>h[t]=2);h[b]=1;addH(h,-1);}});
  // 国士無双
  const missing=YAO.filter(t=>!cnt[t]);
  if(missing.length===0){
    const base=new Array(34).fill(0);YAO.forEach(t=>base[t]=1);
    addH(base,-1);
    for(const d of YAO)if(cnt[d]>=2){const h=base.slice();h[d]=2;for(const w of YAO){if(cnt[w]>=4)continue;const hh=h.slice();hh[w]--;addH(hh,-1);}}
  }else if(missing.length===1){
    const m=missing[0];
    for(const d of YAO)if(d!==m&&cnt[d]>=2){const h=new Array(34).fill(0);YAO.forEach(t=>{if(t!==m)h[t]=1;});h[d]=2;addH(h,-1);}
  }
  return out;
}

function analyzeDeal(cnt,oppForced,dora){
  const map=enumHands(cnt);
  const hands=[];
  for(const e of map.values()){
    const info=handInfo(e.h,e.kan,cnt,null,false,dora);
    if(!info.ok)continue;
    info.ev=evHand(info,oppForced);
    hands.push(info);
  }
  hands.sort((a,b)=>b.ev-a.ev);
  return{can:hands.length>0,hands};
}

// 選択中の牌(枚数配列)を判定
function analyzeSel(sel,cnt,n,dora){
  const opts=[];
  if(n===13)opts.push(-1);
  else if(n===14)for(let t=0;t<34;t++)if(sel[t]===4)opts.push(t);
  let best=null;
  for(const kan of opts){
    const h=sel.slice();if(kan>=0)h[kan]=0;
    const info=handInfo(h,kan,cnt,null,false,dora);
    const sc=(info.ok?2:0)+(info.tenpai?1:0);
    if(!best||sc>best.sc){best=info;best.sc=sc;}
  }
  return best;
}

let G=null;

function newGame(){

function startKyoku(){
  const wall=[];for(let t=0;t<34;t++)for(let k=0;k<4;k++)wall.push(t);shuffle(wall);

    return{tiles,cnt:countOf(tiles),forced:-1,forcedIdx:-1,sel:new Array(DEAL).fill(false),
      h:null,kan:-1,rev:new Set(),kanRev:false,pool:[],river:[],info:null,ana:null,selInfo:null,autoIdx:0,gaveUp:false,missed:false};

}

// ---------- 公開牌選択 ----------
// 公開候補：手牌のうち、すでに公開した字牌暗刻・カン以外
function showList(p){const h=p.h.slice();p.rev.forEach(t=>h[t]-=3);const a=[];for(let t=0;t<34;t++)for(let k=0;k<h[t];k++)a.push(t);return a;}
function pickShow(k){if(G.tut&&showList(G.P[G.cur])[k]!==14){toast('光っている6筒をタップしてね');sfx('alert');return;}G.P[G.cur].forcedIdx=k;render();}
function confirmShow(){
  const p=G.P[G.cur];if(p.forcedIdx<0)return;
  p.forced=showList(p)[p.forcedIdx];
  afterDecision();
}
function giveUp(){sfx('tap');G.P[G.cur].gaveUp=true;afterDecision();}
function afterDecision(){
  if(G.mode==='pvp'&&G.cur===0){G.cur=1;G.phase='select';setViewer(1);render();return;}
  resolveDeal();
}
// 両者の判断がそろったら：両方降り→配り直し、片方→相手に+4000、両方続行→打牌へ
function resolveDeal(){
  const g=G.P.map(p=>p.gaveUp);
  G.cover=null;
  if(g[0]&&g[1]){G.result={type:'redeal'};G.phase='result';render();return;}
  if(g[0]||g[1]){
    const loser=g[0]?0:1;G.scores[1-loser]+=4000;
    say(loser,'giveup','sad');say(1-loser,'oppGiveup','happy');
    G.result={type:'pen',loser,why:G.P[loser].ana.can?'give':'cant'};G.phase='result';render();return;
  }
  startDiscard();
}
// CPU：待ち牌から遠い牌（なるべく情報を与えない牌）を公開
function cpuShow(i){
  const p=G.P[i];const list=showList(p);const ws=p.info.waits.map(w=>w.t);
  const dist=t=>{let m=9;for(const w of ws){if(t===w)m=Math.min(m,0);else if(t<27&&w<27&&(t/9|0)===(w/9|0))m=Math.min(m,Math.abs(t-w));}return m;};
  let best=-1,bv=-1;list.forEach((t,k)=>{const v=dist(t)+Math.random()*1.5;if(v>bv){bv=v;best=k;}});
  p.forcedIdx=best;p.forced=list[best];
}
// ---------- 選択 ----------
function selCounts(p){const c=new Array(34).fill(0);p.tiles.forEach((t,k)=>{if(p.sel[k])c[t]++;});return c;}
function updSel(p){
  const n=p.sel.filter(x=>x).length;
  p.selInfo=(n===13||n===14)?analyzeSel(selCounts(p),p.cnt,n,G.dora):null;
}
function toggleTile(k){const p=G.P[G.cur];if(G.tut&&!p.sel[k]&&tutNeed(p,p.tiles[k])<=0){toast('光っている牌をタップしてね');sfx('alert');return;}const n=p.sel.filter(x=>x).length;if(!p.sel[k]&&n>=14){sfx('alert');return;}p.sel[k]=!p.sel[k];updSel(p);G.popIdx=k;sfx('tap');if(p.selInfo&&p.selInfo.ok){sfx('ok');vib(15);}render();}
function clearSel(){sfx('tap');const p=G.P[G.cur];p.sel.fill(false);updSel(p);render();}
function applyHand(p,info){
  p.sel.fill(false);
  const need=info.h.slice();if(info.kan>=0)need[info.kan]+=4;
  p.tiles.forEach((t,k)=>{if(need[t]>0){p.sel[k]=true;need[t]--;}});
}
function autoSelect(){
  const p=G.P[G.cur];const hs=p.ana.hands;
  const info=hs[p.autoIdx%Math.min(hs.length,10)];p.autoIdx++;
  applyHand(p,info);updSel(p);sfx('sel');render();
}
function confirmSel(){
  const p=G.P[G.cur];const info=p.selInfo;if(!info||!info.ok)return;sfx('ok');vib(20);
  p.h=info.h.slice();p.kan=info.kan;
  const need=info.h.slice();if(info.kan>=0)need[info.kan]+=4;
  p.pool=[];p.tiles.forEach(t=>{if(need[t]>0)need[t]--;else p.pool.push(t);});
  p.rev=maxRev(p.h);p.kanRev=p.kan>=27;
  const canRev=p.rev.size>0||p.kan>=27;
  if(canRev){G.phase='reveal';render();}else finishReveal();
}
function toggleRev(t){const p=G.P[G.cur];if(t==='kan')p.kanRev=!p.kanRev;else{if(p.rev.has(t))p.rev.delete(t);else p.rev.add(t);}render();}
function finishReveal(){
  const p=G.P[G.cur];
  p.info=handInfo(p.h,p.kan,p.cnt,p.rev,p.kanRev,G.dora);
  p.forcedIdx=-1;G.phase='show';render();
}
function isKokushiInfo(h){return h.waits.some(x=>x.r.yaku.some(y=>y.name.startsWith('国士')));}
function cpuSelect(i){
  const p=G.P[i];const hs=p.ana.hands;const lv=G.level;
  let info,rev=null,kanRev=null;
  if(lv==='boss'){const b=bossPlan(i);info=b.info;rev=b.rev;kanRev=b.kanRev;}
  else if(lv==='easy')info=hs[Math.random()*hs.length|0];
  else if(lv==='mid')info=hs[Math.random()<0.6?0:Math.min(hs.length-1,Math.random()*4|0)];
  else info=hs[Math.random()<0.7?0:Math.min(hs.length-1,Math.random()*3|0)];
  // 中級者以上は国士無双が作れるなら必ず選ぶ
  if(lv==='mid'||lv==='hard'){const kk=hs.find(isKokushiInfo);if(kk)info=kk;}
  applyHand(p,info);
  p.h=info.h.slice();p.kan=info.kan;
  const need=info.h.slice();if(info.kan>=0)need[info.kan]+=4;
  p.pool=[];p.tiles.forEach(t=>{if(need[t]>0)need[t]--;else p.pool.push(t);});
  p.rev=rev||maxRev(p.h);p.kanRev=kanRev!=null?kanRev:p.kan>=27;
  p.info=handInfo(p.h,p.kan,p.cnt,p.rev,p.kanRev,G.dora);
  if(lv==='easy'||lv==='mid'){const l=showList(p);p.forcedIdx=Math.random()*l.length|0;p.forced=l[p.forcedIdx];}
  else cpuShow(i);
}
// 諦める判断
function cpuGiveUp(i){
  const lv=G.level,best=G.P[i].ana.hands[0];
  if(lv==='easy')return false;
  if(lv==='mid')return best.ev<1500;
  if(lv==='hard')return best.ev<2500;
  const b=bossPlan(i);const D=G.scores[i]-G.scores[1-i];
  if(G.kyoku>=4){
    // 最終局：逆転も同点もできない配牌なら、打っても負け確定。諦めて延長戦に望みをつなぐ
    // （諦めて30000点差になるなら、どちらにしても負けなので打つ）
    const reach=G.P[i].ana.hands.some(h=>h.waits.some(x=>x.r.pts>=8000&&x.avail>0&&D+x.r.pts>=0));
    if(D<0&&!reach)return D-4000>-30000;
    // 最終局で諦めても延長戦になるだけ（逃げ切りにはならない）
    return 0.5+0.5*Math.tanh((D-4000)/11000)>b.u+0.01;
  }
  return bossU(D-4000)>b.u+0.01;
}
// ---------- 隠しボス：点差と局数を見た手作り ----------
function bossU(d){ // 対局に勝つ見込み（0〜1）のざっくりした評価
  if(G.kyoku>=4)return d>0?1:(d===0?0.5:0);
  if(d>=30000)return 1;if(d<=-30000)return 0;
  const rem=Math.max(1,4-G.kyoku);
  return 0.5+0.5*Math.tanh(d/(11000*Math.sqrt(rem)));
}
function bossHandU(info,i,revPen){
  const D=G.scores[i]-G.scores[1-i];const q=DEAL/(136-DEAL);
  const furi=info.waits.some(x=>x.disc>0)?0.6:1;
  let miss=1,pw=0,eu=0;
  info.waits.filter(x=>x.r.pts>=8000&&x.avail>0).sort((a,b)=>b.avail-a.avail).forEach(x=>{
    const c=(1-Math.pow(1-q,x.avail))*0.55*furi*revPen;
    eu+=miss*c*bossU(D+x.r.pts);pw+=miss*c;miss*=(1-c);
  });
  const po=(1-pw)*0.45;
  return eu+po*bossU(D-9000)+(1-pw-po)*bossU(D);
}
function bossPlan(i){
  const p=G.P[i];
  if(p.bossCache)return p.bossCache;
  const cand=p.ana.hands.map(h=>({h,u:bossHandU(h,i,1)})).sort((a,b)=>b.u-a.u).slice(0,25);
  let best=null;
  for(const c of cand){
    const info=c.h;
    const items=[];for(let t=27;t<34;t++)if(info.h[t]===3)items.push(t);
    const hasKan=info.kan>=27;const n=items.length+(hasKan?1:0);
    for(let m=0;m<(1<<n);m++){
      const rev=new Set();let cntRev=0;
      items.forEach((t,k)=>{if(m>>k&1){rev.add(t);cntRev++;}});
      const kanRev=hasKan&&!!(m>>items.length&1);if(kanRev)cntRev++;
      const inf=handInfo(info.h,info.kan,p.cnt,rev,kanRev,G.dora);
      if(!inf.ok)continue;
      // 公開は情報を与えるので、1つごとに和了率を少し下げて評価
      const u=bossHandU(inf,i,Math.pow(0.9,cntRev));
      if(!best||u>best.u)best={info:inf,rev,kanRev,u};
    }
  }
  p.bossCache=best;return best;
}
// CPUがロンするか（ボスは最終局で逆転できないロンを見送る）
function cpuWantsRon(b,r){
  if(G.level!=='boss'||G.kyoku<4)return true;
  const D=G.scores[b]-G.scores[1-b];
  if(D+r.pts>=0)return true;
  const p=G.P[b];
  return !p.info.waits.some(w=>w.r.pts>=8000&&D+w.r.pts>=0&&w.avail>0);
}

function goTurn(pl,ron){

function furiten(p){return p.missed||p.info.waits.some(w=>p.river.includes(w.t));}
function ronCheck(b,t,last){
  const p=G.P[b];
  if(furiten(p))return null;
  if(!p.info.waits.some(w=>w.t===t))return null;
  const ippatsu=G.P[1-b].river.length===1;
  const r=scoreHand(p.h,p.kan,p.kanRev,p.rev,t,{houtei:last,ippatsu,dora:G.dora});
  if(!r||r.pts<8000)return null;
  return r;
}
function doDiscard(pl,idx){
  const p=G.P[pl];const t=p.pool.splice(idx,1)[0];p.river.push(t);G.lastDisc={pl,t};G.discSeq=(G.discSeq||0)+1;sfx('disc');vib(12);
  const last=G.P[0].pool.length===0&&G.P[1].pool.length===0;
  const b=1-pl;const r=ronCheck(b,t,last);
  if(r){if(isCPU(b)){G.busy=true;G.pick=null;setTimeout(()=>win(b,t,r),500);render();return;}goTurn(b,{t,r,last});return;}
  nextAfter(pl,last);
}
function nextAfter(pl,last){
  if(last){ryuukyoku();return;}
  const b=1-pl;goTurn(G.P[b].pool.length?b:pl,null);
}
function humanPick(k){
  if(G.turn!==viewer()||G.modal||G.busy||isCPU(G.turn))return;
  if(G.tut){const p=G.P[G.turn];const need=TUT.myDisc[p.river.length];if(p.pool[k]!==need){toast('光っている牌を捨ててね');sfx('alert');return;}}
  if(G.pick===k){doDiscard(G.turn,k);return;}
  G.pick=k;sfx('sel');vib(8);render();
}
function humanDiscard(){if(G.pick==null||G.busy)return;doDiscard(G.turn,G.pick);}
function acceptRon(){if(G.busy)return;const o=G.ronOffer;G.modal=null;render();win(G.turn,o.t,o.r);}
function passRon(){
  const o=G.ronOffer;G.modal=null;G.ronOffer=null;G.P[G.turn].missed=true;toast('見逃し：この局はフリテン');
  if(o.last){ryuukyoku();return;}

function win(b,t,r){
  G.busy=true;
  ronFx(r,()=>{G.busy=false;G.modal=null;G.ronOffer=null;say(b,'ron','happy');say(1-b,'dealin','sad');G.scores[b]+=r.pts;G.result={type:'ron',winner:b,t,r,newYM:recordYM(b,t,r)};G.phase='result';G.cover=null;render();});
}
function ryuukyoku(){toast('流局');say(0,'ryu');say(1,'ryu');G.result={type:'ryu'};G.phase='result';G.cover=null;render();}
function nextKyoku(){
  if(G.tut){tutFinish();return;}
  const L=document.getElementById('fx');if(L)L.innerHTML='';
  if(G.result.type==='redeal'){startKyoku();return;}
  const d=Math.abs(G.scores[0]-G.scores[1]);
  const fin=()=>{const w=G.scores[0]>G.scores[1]?0:1;say(w,'win','happy');say(1-w,'lose','sad');};
  if(d>=30000){fin();G.phase='final';G.endReason='30000点差がつきました';render();return;}
  // 諦め・満貫不可で終わった局では、4局終了の判定はしない（最終局なら延長戦へ）
  if(G.result.type==='pen'){G.kyoku++;startKyoku();return;}
  if(G.kyoku>=4&&G.scores[0]!==G.scores[1]){fin();G.phase='final';G.endReason=G.kyoku===4?'4局終了':'延長戦決着';render();return;}
  G.kyoku++;startKyoku();
}

// 危険度（相手に t を打つとき）。ctx: vis=見えている枚数, oppRiver, myRiver, forced, lastOne
function dangerCore(t,ctx){
  const unk=x=>4-ctx.vis[x];
  const has=x=>ctx.oppRiver.includes(x);
  if(has(t))return{d:0,label:'現物',c:'#1e9e57'};
  if(ctx.myRiver.includes(t))return ctx.lastOne?{d:0.5,label:'通過(河底)',c:'#7aa52b'}:{d:0,label:'通過',c:'#1e9e57'};
  const res=dangerBase(t,ctx);
  // ドラは当たれば相手の翻が増える（＝失点が大きい）ので重く、ドラ周辺も相手が使っていやすい
  if(ctx.dora!=null&&ctx.dora>=0&&res.d>0.1){ // 残り0枚など当たりようがない牌はそのまま
    if(t===ctx.dora){res.d=res.d*1.6+2;res.label='ドラ';}
    else if(t<27&&ctx.dora<27&&(t/9|0)===(ctx.dora/9|0)&&Math.abs(t-ctx.dora)<=2)res.d+=0.6;
    res.c=res.d<=2.5?'#7aa52b':(res.d<=5?'#c9a227':'#d0453a');
  }
  return res;
}
function dangerBase(t,ctx){
  const unk=x=>4-ctx.vis[x];
  const has=x=>ctx.oppRiver.includes(x);
  let near=0;const f=ctx.forced;
  if(f!=null&&f>=0){if(f===t)near=1;else if(t<27&&f<27&&(t/9|0)===(f/9|0)&&Math.abs(t-f)<=2)near=1.5;}
  if(t>=27){
    const u=unk(t);
    if(u>0&&near)return{d:2+near,label:'公開牌',c:'#c9a227'};
    if(u<=0)return{d:0.1,label:'残0枚',c:'#1e9e57'};
    if(u===1)return{d:1,label:'単騎のみ',c:'#7aa52b'};
    return{d:2,label:'字牌',c:'#c9a227'};
  }
  const r=t%9;let d=0,suji=false,kabe=false,ryan=false;
  if(r>=2){
    const shape=unk(t-2)>0&&unk(t-1)>0,pen=r===2;
    if(!shape)kabe=true;else if(!pen&&has(t-3))suji=true;else{d+=pen?1:4;if(!pen)ryan=true;}
  }
  if(r<=6){
    const shape=unk(t+1)>0&&unk(t+2)>0,pen=r===6;
    if(!shape)kabe=true;else if(!pen&&has(t+3))suji=true;else{d+=pen?1:4;if(!pen)ryan=true;}
  }
  if(r>=1&&r<=7&&unk(t-1)>0&&unk(t+1)>0)d+=1.5;
  if(unk(t)>=1)d+=0.8;
  if(unk(t)>=2)d+=1.2;
  d+=near;
  let label;
  if(!ryan){label=suji?'スジ':(kabe?'壁':'端寄り');}
  else label=d>=8?'危険':'注意';
  if(near&&!ryan)label='公開牌近';
  const c=d<=2.5?'#7aa52b':(d<=5?'#c9a227':'#d0453a');
  return{d,label,c};
}
function danger(t,me){
  const my=G.P[me],o=G.P[1-me];
  const vis=my.cnt.slice();
  o.river.forEach(x=>vis[x]++);
  o.rev.forEach(x=>vis[x]+=3);
  if(o.kanRev)vis[o.kan]+=4;
  const lastOne=(G.P[0].pool.length+G.P[1].pool.length)===1;
  return dangerCore(t,{vis,oppRiver:o.river,myRiver:my.river,forced:o.forced,lastOne,dora:G.dora});
}
function cpuAct(){
  if(!G||G.phase!=='discard')return;
  if(G.tut){doDiscard(1,0);return;}
  const best=cpuChoose();
  if(Math.random()<0.2)say(1,'chat');
  doDiscard(1,best);
}
function cpuChoose(){
  const p=G.P[1];
  const own=new Set(p.info.waits.map(w=>w.t));
  let best=-1,bv=1e9;
  const lv=G.level,o=G.P[0];
  p.pool.forEach((t,k)=>{
    let v;
    if(lv==='easy')v=Math.random();
    else if(lv==='mid')v=(o.river.includes(t)?0:5)+(own.has(t)?3:0)+Math.random();
    else v=danger(t,1).d+(own.has(t)?3:0)+Math.random()*0.4;
    if(v<bv){bv=v;best=k;}
  });
  return best;
}

function tone(f,t0,dur,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';const t=a.currentTime+t0;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);}
function noise(t0,dur,vol,freq){const a=ac();if(!a)return;const n=Math.max(1,a.sampleRate*dur|0);const b=a.createBuffer(1,n,a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||2000;const g=a.createGain();g.gain.value=vol||.3;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0);}

function handGroups(p,showAll,sm){
  const so=typeof sm==='string'?{size:sm}:{sm};
  let html='';const h=p.h.slice();
  const groups=[];
  if(p.kan>=0)groups.push({t:p.kan,n:4,open:p.kanRev||showAll,label:p.kanRev?'公開槓':'槓'});
  p.rev.forEach(t=>{groups.push({t,n:3,open:true,label:'公開'});h[t]-=3;});
  let rest='';
  const fo=(p.forced!=null&&p.forced>=0&&h[p.forced]>0)?p.forced:-1;
  if(showAll){let done=false;for(let t=0;t<34;t++)for(let k=0;k<h[t];k++){const b=!done&&t===fo;if(b)done=true;rest+=tileHTML(t,{...so,bdg:b?'公開':''});}}
  else{let n=0;for(let t=0;t<34;t++)n+=h[t];if(fo>=0){rest+=tileHTML(fo,{...so,bdg:'公開'});n--;}for(let k=0;k<n;k++)rest+=backHTML(sm);}
  html+=`<div class="row">${rest?`<span class="grp">${rest}</span>`:''}`;
  groups.forEach(g=>{
    if(!g.open){html+=`<span class="grp">${backHTML(sm).repeat(g.n)}</span>`;return;}

  <h3>壁（ノーチャンス）</h3>ある牌が自分の手・場に4枚見えていると、それを使う両面待ちは存在しません。例：8が4枚見えていれば7-8の形が作れないので、9は両面で当たりません。
  <h3>通過牌</h3>一度自分が捨てて通った牌は安全です。相手がロンできたのに見逃したならフリテンでもうロンできず、満貫に届かずロンできなかったならその牌は以後もロンできないからです（例外：局の最後の1打は河底で+1翻）。
  <h3>捨て牌は全部出る</h3>捨てる側の牌は最後まで全部捨てます。相手の捨てる側に自分の待ち牌があれば、先に和了られない限りいずれ必ず出ます。
  <div class="mini">ガイドの危険度は見えている牌からの目安で、確実ではありません。</div>
  <div class="btns" style="margin-top:10px"><button class="btn" onclick="closeHelp()">閉じる</button></div></div>`;
}

function genWait(){

    let cnt;
    if(T.level==='hard'){const s=Math.random()*3|0;const arr=[];for(let r=0;r<9;r++)for(let k=0;k<4;k++)arr.push(s*9+r);shuffle(arr);cnt=countOf(arr.slice(0,22));}
    else cnt=countOf(newWall().slice(0,31));
    const hs=[...enumHands(cnt).values()].filter(e=>e.kan<0);

// ---------- 安全牌クイズ ----------
function genSafe(){
  for(let tries=0;tries<300;tries++){
    const w=newWall();const dora=doraOf(w[62]);
    const opp=w.slice(0,31);const oc=countOf(opp);const ana=analyzeDeal(oc,-1,dora);if(!ana.can)continue;
    const oh=ana.hands[0];const ohTiles=tilesFromCounts(oh.h);if(oh.kan>=0)continue;
    const need=oh.h.slice();const opool=[];opp.forEach(t=>{if(need[t]>0)need[t]--;else opool.push(t);});shuffle(opool);
    const k=3+(Math.random()*5|0);const oriver=opool.slice(0,k);
    const owaits=oh.waits.map(x=>x.t);
    const mine=w.slice(31,62);
    const mineSafePassed=shuffle(mine.filter(t=>!owaits.includes(t))).slice(0,Math.max(1,k-1));
    const myRiver=mineSafePassed;
    const rest=mine.slice();myRiver.forEach(t=>rest.splice(rest.indexOf(t),1));
    const isSafe=t=>oriver.includes(t)||myRiver.includes(t);
    const safeTypes=[...new Set(rest.filter(isSafe))];
    const otherTypes=[...new Set(rest.filter(t=>!isSafe(t)))];
    if(!safeTypes.length||otherTypes.length<4)continue;
    const ans=safeTypes[Math.random()*safeTypes.length|0];
    const waitsIn=shuffle(otherTypes.filter(t=>owaits.includes(t)));
    const others=shuffle(otherTypes.filter(t=>!owaits.includes(t)));
    const pick=waitsIn.slice(0,Math.min(2,waitsIn.length));
    while(pick.length<4&&others.length)pick.push(others.shift());
    if(pick.length<4)continue;
    const cands=shuffle([ans,...pick]);
    const forcedList=ohTiles.filter(t=>!owaits.includes(t));
    const forced=forcedList[Math.random()*forcedList.length|0];
    const vis=countOf(mine);oriver.forEach(x=>vis[x]++);
    T.q={oh,owaits,oriver,myRiver,cands,ans,forced,dora,vis};
    return;
  }
}
function trSafePick(t){
  if(T.answered)return;T.answered=true;T.pick=t;
  T.ok=t===T.q.ans;
  if(T.ok){T.streak++;sfx('ok');vib(30);if(bumpBest('safeBest',T.streak))toast('自己ベスト更新！');}
  else{T.streak=0;sfx('lose');if(T.q.owaits.includes(t)){vib([60,40,120]);shake();}}
  render();
}
function viewTrSafe(){
  const q=T.q;
  const ctx={vis:q.vis,oppRiver:q.oriver,myRiver:q.myRiver,forced:q.forced,lastOne:false};
  const cands=q.cands.map(t=>{
    const o={size:'xl',on:`trSafePick(${t})`,dora:false};
    if(T.answered){const d=dangerCore(t,ctx);const hit=q.owaits.includes(t);o.sf=hit?'当たり!':d.label;o.sfc=hit?'#d0453a':d.c;o.sel=t===T.pick;}
    return tileHTML(t,o);}).join('');
  let exp='';
  if(T.answered){
    const why=q.oriver.includes(q.ans)?'相手の捨て牌（現物）なので、その牌でロンするとフリテン。':'自分が一度捨てて通った牌（通過牌）なので、見逃していればフリテン、満貫に届かなかったなら今も届かない。';
    exp=`<div class="panel st"><b>${tname(q.ans)}</b> が確実に安全：${why}<div class="mini" style="margin-top:4px">相手の手：</div><div class="row">${typesHTML(tilesFromCounts(q.oh.h),{sm:1,dora:false})}</div><div class="mini">待ち：${q.oh.waits.map(x=>tname(x.t)).join('・')}</div></div>`;
  }
  const msg=T.answered?(T.ok?'<span class="ok">正解！</span>':(q.owaits.includes(T.pick)?'<span class="ng">ロン！ それは相手の当たり牌…</span>':'<span class="ng">不正解（当たりではないけど確実ではない）</span>')):'<span class="mini">確実に安全な牌を1つタップ</span>';
  return trHeader('安全牌クイズ',`${T.streak}連続`)+`
  <div class="panel"><div class="row" style="align-items:center;gap:6px"><b style="font-size:13px">相手の河</b><span class="mini" style="margin-left:auto">公開牌</span>${tileHTML(q.forced,{sm:1,dora:false})}</div><div class="riv" style="margin-top:4px">${typesHTML(q.oriver,{size:'xs',dora:false})}</div></div>
  <div class="panel"><b style="font-size:13px">自分の河（すべて通過済み）</b><div class="riv" style="margin-top:4px">${typesHTML(q.myRiver,{size:'xs',dora:false})}</div></div>
  <div class="panel"><h2>どれを捨てる？</h2><div class="row" style="justify-content:center;gap:8px;padding:6px 0 ${T.answered?'16px':'4px'}">${cands}</div></div>
  ${exp}
  ${bar(T.answered?`<button class="btn glow" onclick="sfx('tap');nextQ()">次の問題</button>`:'',msg)}`;
}

// ---------- 点数当て ----------
function genScore(){
  for(;;){
    const w=newWall();const dora=doraOf(w[31]);const cnt=countOf(w.slice(0,31));
    const ana=analyzeDeal(cnt,-1,dora);if(!ana.can)continue;
    const hs=ana.hands.slice(0,30);const info=hs[Math.random()*hs.length|0];
    const ws=info.waits.filter(x=>x.r.pts>=8000);if(!ws.length)continue;
    const x=ws[Math.random()*ws.length|0];
    const choices=[8000,12000,16000,24000,32000,64000];
    const others=shuffle(choices.filter(v=>v!==x.r.pts)).sort((a,b)=>Math.abs(a-x.r.pts)-Math.abs(b-x.r.pts)).slice(0,3);
    T.q={info,x,dora,doraInd:w[31],opts:shuffle([x.r.pts,...others])};
    return;
  }
}
function trScorePick(v){
  if(T.answered)return;T.answered=true;T.pick=v;T.ok=v===T.q.x.r.pts;
  if(T.ok){T.streak++;sfx('ok');vib(30);if(bumpBest('scoreBest',T.streak))toast('自己ベスト更新！');}else{T.streak=0;sfx('lose');}
  render();
}
function viewTrScore(){
  const q=T.q,r=q.x.r,info=q.info;
  const p={h:info.h,kan:info.kan,kanRev:info.kanRev,rev:info.rev,forced:-1};
  const opts=q.opts.map(v=>{let cls='btn sec';if(T.answered){if(v===r.pts)cls='btn';else if(v===T.pick)cls='btn red';else cls='btn ghost';}return `<button class="${cls}" onclick="trScorePick(${v})">${v}点</button>`;}).join('');
  const exp=T.answered?`<div class="panel st"><div class="ygrid">${r.yaku.map((y,k)=>`<div class="yrow" style="animation-delay:${k*.08}s"><span>${y.name}</span><b>${y.han}</b></div>`).join('')}</div><div style="text-align:center;margin-top:6px"><span class="rank ${r.yakuman?'ym':''}">${r.name}</span> <span class="mini">${r.yakuman?'':`${r.han}翻${r.fu}符`}</span></div></div>`:'';
  return trHeader('点数当て',`${T.streak}連続`)+`
  <div class="panel" style="padding:5px 8px"><div class="row" style="align-items:center;gap:5px"><span class="mini">ドラ表示</span>${tileHTML(q.doraInd,{sm:1,dora:false})}<span class="mini">→ ドラ</span>${tileHTML(q.dora,{sm:1,dora:false})}<span class="mini" style="margin-left:auto">ロン和了・ダブル立直込み</span></div></div>
  <div class="panel"><h2>この手が ${tname(q.x.t)} でロン。何点？</h2><div class="row" style="align-items:center;gap:6px">${handGroups(p,true,true)}<span class="mini">＋</span>${tileHTML(q.x.t,{sm:1,last:1,dora:false})}</div>${info.rev.size||info.kanRev?'<div class="mini" style="margin-top:4px">金色の枠＝公開した字牌（+2翻／槓子+3翻）</div>':''}</div>
  <div class="panel"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${opts}</div></div>
  ${exp}
  ${bar(T.answered?`<button class="btn glow" onclick="sfx('tap');nextQ()">次の問題</button>`:'',T.answered?(T.ok?'<span class="ok">正解！</span>':`<span class="ng">正解は ${r.pts}点</span>`):'<span class="mini">点数を選んでください</span>')}`;
}

// ---------- 面白さの解説 ----------
function viewGuide(){
  const sec=(title,body)=>`<div class="panel st"><h2>${title}</h2>${body}</div>`;
  const tl=(arr)=>`<div class="row" style="margin:6px 0">${typesHTML(arr,{sm:1,dora:false})}</div>`;
  return `<div class="hdr"><button class="menu" onclick="openLearn()">←</button><b style="flex:1;text-align:center;font-size:15px">このゲームの面白さ</b><span style="width:36px"></span></div>
  <div style="padding-bottom:20px">
  ${sec('1. 捨て牌は全部出る＝「当てっこ競争」','このゲームでは捨てる側の牌を最後まで<b>全部</b>捨てます。つまり相手の捨てる側に自分の待ち牌があれば、先に和了られない限り<b>いずれ必ず出ます</b>。逆も同じ。勝負は「どちらの当たり牌が先に出るか」の競争です。だから危険な牌はできるだけ後回しにして、相手より先に当てるのがコツ。')}
  ${sec('2. 待ちは「相手が持っていそうな牌」で','自分の31枚に多く入っている牌で待つと、相手がその牌を持っている可能性が下がります。待ち牌が自分の捨てる側にあれば捨てた瞬間にフリテン。<b>残り枚数が多い待ち</b>ほど有利です。'+tl([22,25])+'例：5索・8索待ちで、自分が5索を2枚使っているなら、5索は残り2枚しかありません。')}
  ${sec('3. 公開牌の駆け引き','聴牌を決めたら手牌から1枚を相手に見せます。待ちに近い牌を見せると周りの牌を警戒されます。完成した面子の牌や、待ちと別の色の牌を見せるのが基本。ただし、相手はその「見せ方」から逆に読んでくることも…。')}
  ${sec('4. 字牌公開の損と得','字牌の暗刻を公開すると+2翻（槓子なら+3翻）。満貫→跳満、跳満→倍満と一気に点が上がります。でも手の一部を見せるので待ちを読まれやすくなる。<b>翻が増えても点数の段階が上がらないなら隠す</b>のも立派な作戦です。'+tl([31,31,31]))}
  ${sec('5. 安全な牌の見分け方','<b>現物</b>（相手が捨てた牌）と<b>通過牌</b>（自分が捨てて通った牌）は絶対に安全。<b>スジ</b>や<b>壁</b>は両面待ちには当たらないけれど、単騎やシャンポンには当たることがあります。安全な牌から先に切って、危険な牌は相手の当たりが出るまで粘りましょう。')}
  ${sec('6. 諦めるかどうか','満貫聴牌が作れても、待ちが少なくて和了りにくいなら「諦める」（相手に+4000）も選べます。振り込めば8000点以上取られるので、勝ち目の薄い局は4000点で済ませるのも賢い判断。ただし最終局で諦めても対局は終わらず延長戦になるので、「諦めて逃げ切り」はできません。')}
  ${sec('7. 国士無双は一発逆転','役満は32000点。30000点差で終了なので、同点からなら<b>1回で勝負が決まります</b>。配牌に么九牌（1・9・字牌）が揃っていたら真っ先に検討しよう。'+tl([0,8,9,17,18,26,27,28,29,30,31,32,33]))}
  ${sec('8. 点差と局数を考える','最終局で負けていれば、逆転に必要な点数の手を作らないと意味がありません。逆にリードしていれば、和了りやすい手を優先して逃げ切りを狙えます。隠しボスはこの計算をして打ってきます。')}
  </div>`;
}

// ================= 役満図鑑 =================
const YM_LIST=[
  {n:'国士無双',d:'1・9・字牌の13種を1枚ずつ＋どれか1枚'},
  {n:'国士無双十三面',d:'13種がそろった状態からの13面待ち（ダブル役満）'},
  {n:'四暗刻',d:'暗刻4つ。ロンのみなので単騎待ちだけ成立'},
  {n:'大三元',d:'白・發・中の3つを刻子に'},
  {n:'小四喜',d:'風牌3種の刻子＋残る風牌の雀頭'},
  {n:'大四喜',d:'東南西北すべて刻子（ダブル役満）'},
  {n:'字一色',d:'字牌だけで作る'},
  {n:'緑一色',d:'2・3・4・6・8索と發だけで作る'},
  {n:'清老頭',d:'1と9の牌だけで作る'},
  {n:'九蓮宝燈',d:'1112345678999＋1枚の清一色'},
  {n:'純正九蓮宝燈',d:'九蓮宝燈の9面待ち（ダブル役満）'},
  {n:'数え役満',d:'役やドラを重ねて13翻以上'},
];
function loadYM(){try{const a=JSON.parse(localStorage.getItem('manganMJ_ym')||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}}
function saveYM(a){try{localStorage.setItem('manganMJ_ym',JSON.stringify(a.slice(-300)));}catch(e){}}
// 役満で和了ったら記録（CPU戦はあなたの和了のみ、対人戦はどちらも）。新しく登録された役満名を返す
function recordYM(b,t,r){
  if(!G||G.tut)return null;
  if(G.mode==='cpu'&&b!==0)return null;
  const names=r.yakuman?r.yaku.filter(y=>typeof y.han!=='number').map(y=>y.name):(r.name==='数え役満'?['数え役満']:[]);
  if(!names.length)return null;
  const p=G.P[b];const list=loadYM();const had=new Set(list.map(e=>e.y));
  const base={at:Date.now(),mode:G.mode,who:G.names[b],whoChar:G.chars[b]||null,opp:G.names[1-b],oppChar:G.chars[1-b]||null,
    h:tilesFromCounts(p.h),kan:p.kan,rev:[...p.rev],kanRev:p.kanRev,win:t,pts:r.pts,yaku:r.yaku.map(y=>y.name),kyoku:kyokuLabel(),dora:G.dora};
  names.forEach(n=>list.push(Object.assign({y:n},base)));
  saveYM(list);
  const fresh=names.filter(n=>!had.has(n));
  if(fresh.length)setTimeout(()=>{banner('役満図鑑','新登録：'+fresh.join('・'));confetti();},600);
  return fresh;
}
function clearFx(){const L=document.getElementById('fx');if(L)L.innerHTML='';}
function fmtTime(ms){const d=new Date(ms);const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;}
function openZukan(){sfx('tap');clearFx();if(T&&T.timer)clearInterval(T.timer);T=null;G=null;S.screen='zukan';S.zkSel=null;render();}
function viewZukan(){
  const list=loadYM();
  const by={};list.forEach(e=>{(by[e.y]=by[e.y]||[]).push(e);});
  const got=YM_LIST.filter(x=>by[x.n]).length;
  const cards=YM_LIST.map(x=>{
    const es=by[x.n]||[];const has=es.length>0;
    return `<button class="cc" style="flex-direction:column;align-items:stretch;gap:3px;${has?'':'opacity:.55'}" onclick="${has?`sfx('tap');S.zkSel='${x.n}';render()`:`toast('まだ和了っていません')`}">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px">${x.n}</span>${has?`<span class="rank" style="margin:0;padding:1px 8px;font-size:11px">×${es.length}</span>`:'<span class="mini">未達成</span>'}</div>
      <div class="mini" style="font-weight:400">${has?`初：${fmtTime(es[0].at)}`:x.d}</div></button>`;}).join('');
  return `<div class="hdr"><button class="menu" onclick="backTitle()">←</button><b style="flex:1;text-align:center;font-size:15px">役満図鑑</b><span class="kyoku">${got}/${YM_LIST.length}</span></div>
  <div class="panel"><div class="prog" style="margin:0 0 4px"><i style="width:${got/YM_LIST.length*100}%"></i></div><div class="mini">あなたが役満で和了ると、日時・相手・牌が記録されます（このブラウザに保存）。対人戦ではどちらの和了も記録します。</div></div>
  <div class="cgrid">${cards}</div>`;
}
function zukanSheet(){
  const n=S.zkSel;const x=YM_LIST.find(v=>v.n===n);
  const es=loadYM().filter(e=>e.y===n).slice().reverse();
  const row=e=>{
    const p={h:countOf(e.h),kan:e.kan,kanRev:e.kanRev,rev:new Set(e.rev||[]),forced:-1};
    const av=e.oppChar&&CHARS[e.oppChar]?`<img class="av" src="${sprite(e.oppChar,'sad')}" width="32" height="32">`:'';
    return `<div class="panel" style="margin:6px 0">
      <div style="display:flex;align-items:center;gap:8px">${av}<div style="flex:1;min-width:0"><b style="font-size:13px">${e.mode==='pvp'?`${e.who} vs ${e.opp}`:`vs ${e.opp}`}</b><div class="mini">${fmtTime(e.at)}・${e.kyoku||''}</div></div><b style="color:#ffe08a">${e.pts}点</b></div>
      <div class="row" style="gap:4px;align-items:center;margin-top:6px">${handGroups(p,true,'xs')}<span class="mini">＋</span>${tileHTML(e.win,{size:'xs',last:1,dora:false})}</div>
      <div class="mini" style="margin-top:3px">${(e.yaku||[]).join('・')}</div></div>`;};
  return `<div class="sheet"><h3>${n}</h3><div class="mini">${x?x.d:''}</div>${es.map(row).join('')}<div class="btns" style="margin-top:8px"><button class="btn" onclick="S.zkSel=null;render()">閉じる</button></div></div>`;
}
function render(){
  const app=$('#app');
  let h;
  if(!G){
    const sc=S.screen;
    h=sc==='zukan'?viewZukan():sc==='learn'?viewLearn():sc==='guide'?viewGuide():sc==='tr_wait'?viewTrWait():sc==='tr_build'?viewTrBuild():sc==='tr_safe'?viewTrSafe():sc==='tr_score'?viewTrScore():viewTitle();
  }
  else switch(G.phase){
    case 'calc':h=viewCalc();break;
    case 'show':h=viewShow();break;
    case 'select':h=viewSelect();break;
    case 'reveal':h=viewReveal();break;
    case 'discard':h=viewDiscard();break;
    case 'result':h=viewResult();break;
    case 'final':h=viewFinal();break;
  }
  app.innerHTML=h;
  app.className=(G&&G.phase==='select'&&G.P[G.cur].ana&&G.P[G.cur].ana.can)?'pb2':'';
  const ov=$('#ov');let oh='';
  if(S.help)oh=helpHTML();
  else if(!G&&S.screen==='zukan'&&S.zkSel)oh=zukanSheet();
  else if(S.sheet==='menu')oh=menuHTML();
  else if(G&&G.cover)oh=coverHTML();
  else if(G&&S.sheet==='waits'&&G.phase==='select'){
    const info=G.P[G.cur].selInfo;
    oh=`<div class="sheet"><h3>待ちの詳細</h3><div class="mini">字牌の暗刻・槓子は公開した場合の点数</div>${info&&info.waits?info.waits.map(x=>waitLine(x,'sel')).join(''):''}<div class="btns" style="margin-top:10px"><button class="btn" onclick="closeSheet()">閉じる</button></div></div>`;
  }
  else if(G&&S.sheet==='giveup'){
    oh=`<div class="sheet"><h3>この局を諦めますか？</h3>相手に4000点が入ります（相手も諦めた・作れない場合は配り直し）。<div class="btns" style="margin-top:12px"><button class="btn sec" onclick="closeSheet()">やめる</button><button class="btn red" onclick="S.sheet=null;giveUp()">諦める</button></div></div>`;
  }
  else if(G&&G.modal==='ron'){
    const o=G.ronOffer;
    oh=`<div class="sheet"><h3>ロンできます！</h3><div style="display:flex;gap:14px;align-items:center">${tileHTML(o.t,{size:'xl'})}<div><div class="res-pts" style="text-align:left;font-size:30px;margin:0">${o.r.pts}点</div><span class="rank ${o.r.yakuman?'ym':''}">${o.r.name}</span><div class="yk" style="margin-top:4px">${o.r.yaku.map(y=>y.name).join(' ')}</div></div></div>
    <div class="btns" style="margin-top:14px">${G.tut?'':'<button class="btn ghost" onclick="passRon()">見逃す</button>'}<button class="btn red glow" style="flex:2;font-size:20px" onclick="acceptRon()">ロン！</button></div></div>`;
  }
  ov.innerHTML=oh;ov.className=oh?'on':'';
  ov.onclick=e=>{if(e.target===ov&&(S.sheet||S.help)){closeSheet();}else if(e.target===ov&&S.zkSel){S.zkSel=null;render();}};
  // 一度きりの演出の後処理
  if(G){
    G.discShown=G.discSeq;G.sayShown=(G.sayV||[0,0]).slice();G.popIdx=null;
    if(G.phase==='result'&&G.result&&G.result.type==='ron'&&!G.result.counted){
      G.result.counted=true;const el=$('#cnt');const to=G.result.r.pts;const t0=performance.now();
      fx(`<div class="floatpts">+${to}</div>`,1500);
      const step=now=>{const k=Math.min(1,(now-t0)/900);if(el&&el.isConnected)el.textContent='+'+Math.round(to*k/100)*100;if(k<1)requestAnimationFrame(step);};
      requestAnimationFrame(step);
    }
    if(G.phase==='final'&&!G.finalFx){
      G.finalFx=true;const w=G.scores[0]>G.scores[1]?0:1;
      if(G.mode==='pvp'||w===0){confetti();sfx('win');vib([80,60,80,60,200]);}else sfx('lose');
    }
  }
}
render();

</script>
