const fxc=$('#fx'),fx=fxc.getContext('2d');let parts=[],fxRaf=0;
function fxSize(){const r=wrap.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);fxc.width=r.width*d;fxc.height=r.height*d;fx.setTransform(d,0,0,d,0,0);}

function fxLoop(){
  fx.clearRect(0,0,fxc.width,fxc.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.life--;p.vy+=p.g;p.vx*=p.dr;p.vy*=p.dr;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    fx.globalAlpha=Math.min(1,p.life/15);fx.fillStyle=p.c;
    if(p.k==='conf'){const w=p.s*Math.abs(Math.cos(p.rot));fx.fillRect(p.x-w/2,p.y-p.s/2,Math.max(1,w),p.s*.6);}

    else fx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  fx.globalAlpha=1;
  fxRaf=parts.length?requestAnimationFrame(fxLoop):0;
}

    if(s.card){SE.find();setStory(s.story);burst(...scenePt(cx,cy),14,['#fff','#ffe680','#ffd84a'],4,'star');await wait(250);await cardPopup(s.card);gain(s.card,s);}
    else{SE.none();setStory(s.story);bubbleAt(cx,s.y,[['e','💨']],1100);burst(...scenePt(cx,cy),8,['#e8e0d0','#c8c0b0'],2);await wait(600);}
    if(s.high)await momoHome();else await wombatHome();
    busy=false;checkReady();resetIdle();
  })();
}
async function wombatWalk(tx){
  const x=Math.max(0,Math.min(SW-34,tx-30)),cur=+wombatEl.dataset.x;
  if(Math.abs(x-cur)<4)return;
  setBase(wombatEl,'wombat',x<cur);wombatEl.classList.add('walk');moveActor(wombatEl,x,WOMBAT_HOME[1]);await wait(720);wombatEl.classList.remove('walk');
}
async function wombatHome(){
  if(+wombatEl.dataset.x===WOMBAT_HOME[0])return;
  setBase(wombatEl,'wombat',true);wombatEl.classList.add('walk');moveActor(wombatEl,WOMBAT_HOME[0],WOMBAT_HOME[1]);await wait(720);wombatEl.classList.remove('walk');setBase(wombatEl,'wombat',false);
}
function onActor(a,el){
  if(busy)return;ac();resetIdle();
  (async()=>{
    busy=true;anim(el,'jump');SE.talk();const[x,y]=actorTop(a.id);const b=bubbleAt(x,y,a.talk);setStory(a.story);
    if(!ST.talked.includes(a.id)){ST.talked.push(a.id);store();updClues();}
    if(a.id===EP.suspect){anim($('#clues .talk'),'pop');}
    await wait(1700);
    if(a.give&&!ST.found.includes(a.give)){b.remove();SE.find();burst(...scenePt(x,y),14,['#fff','#ffe680'],4,'star');await cardPopup(a.give);gain(a.give);}
    else setTimeout(()=>b.remove(),900);
    busy=false;checkReady();resetIdle();
  })();
}
async function momoFly(x,y){
  SE.fly();momoEl.classList.remove('idle');setBase(momoEl,'momo_fly',x<+momoEl.dataset.x);momoEl.style.zIndex=6;momoEl.classList.add('fly');moveActor(momoEl,x,y);
  for(let i=0;i<6;i++)setTimeout(()=>{if(momoEl.isConnected){const[px,py]=center(momoEl);addP({x:px,y:py+6,vx:0,vy:0,g:0,life:22,c:'rgba(255,255,255,.8)',s:4});}},i*110);
  await wait(800);
}
async function momoHome(){setBase(momoEl,'momo_fly',true);moveActor(momoEl,MOMO_HOME[0],MOMO_HOME[1]);await wait(750);momoEl.classList.remove('fly');setBase(momoEl,'momo');momoEl.style.zIndex='';momoEl.classList.add('idle');}
function gain(id){if(!ST.found.includes(id)){ST.found.push(id);store();}BG[EP.bg](ST);updBag(true);updClues();const sl=$('#clues .slot.got:last-of-type');}
function updBag(p){const n=ST&&EP?ST.found.length:0;$('#bagn').textContent=n;if(p)anim($('#b-bag'),'pop');}
function ready(){return EP.need.every(c=>ST.found.includes(c))&&ST.talked.includes(EP.suspect);}
function checkReady(){
  if(!ready()||$('#bbtn'))return;
  const b=document.createElement('button');b.id='bbtn';b.className='bigbtn glow';b.appendChild(img(EP.suspect,'',true));
  b.insertAdjacentHTML('beforeend','<span>⚡ たいけつ</span>');b.onclick=()=>{if(busy)return;ac();startBattle();};
  panel.appendChild(b);setStory('てがかりが そろった！ 「たいけつ」で、ほんとうの ことを きこう。');
  SE.find();burst(...center(b),16,['#ffd84a','#fff','#e8a33a'],5,'star');
}
function idleHint(fromMomo){
  if(!EP||busy)return;
  if(ST.phase==='battle'){battleHint();return;}
  if(ST.phase!=='inv')return;
  let t=null;
  const sp=EP.spots.find(s=>s.card&&EP.need.includes(s.card)&&!ST.seen.includes(s.id));
  const giver=EP.actors.find(a=>a.give&&EP.need.includes(a.give)&&!ST.found.includes(a.give));
  if(!ST.talked.includes(EP.actors[0].id))t=objs[EP.actors[0].id];
  else if(sp)t=objs['spot_'+sp.id];
  else if(giver)t=objs[giver.id];
  else if(!ST.talked.includes(EP.suspect))t=objs[EP.suspect];
  else t=$('#bbtn');
  if(!t)return;
  if(t.classList.contains('spot'))t.classList.add('hi');
  anim(momoEl,'jump');
  showHand(t);
}

/* ===== カードを見る ===== */
function cardHTML(id,mode){
  const c=CARDS[id];const b=document.createElement('button');b.className='card'+(mode===3?' big':'');b.dataset.id=id;
  if(mode===1)b.appendChild(img(c.s));else if(mode===2)b.appendChild(img(c.s,'',false,'#6a5848'));
  const w=document.createElement('span');w.className='w';
  if(mode===2){w.innerHTML='<i>'+c.w[0]+'</i>'+c.w.slice(1);}else w.textContent=c.w;
  b.appendChild(w);return b;
}
function cardPopup(id){return new Promise(res=>{
  const c=CARDS[id];const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="mbox bigcard"><div class="rays"></div><div class="ctitle">✨ みつけた！ ✨</div><div class="pic"></div><div class="letters"></div><div class="tapnote">👆</div></div>';
  m.querySelector('.pic').appendChild(img(c.s));
  const L=m.querySelector('.letters');[...c.w].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;L.appendChild(s);});
  wrap.appendChild(m);let ok=false;
  (async()=>{await wait(150);burst(...center(m.querySelector('.pic')),22,['#fff','#ffe680','#ffd84a','#ffb0c0'],6,'star');
    await wait(350);const sp=L.querySelectorAll('span');for(let i=0;i<sp.length;i++){sp[i].classList.add('on');SE.letter(i);burst(...center(sp[i]),5,['#ffd84a','#fff'],2.5);await wait(380);}
    ok=true;m.querySelector('.tapnote').classList.add('on');})();
  m.onclick=()=>{if(!ok)return;SE.tap();
    // カードがかばんへ飛ぶ
    const p=m.querySelector('.pic img'),r0=p.getBoundingClientRect(),r1=$('#b-bag').getBoundingClientRect(),W=wrap.getBoundingClientRect();
    const f=img(c.s,'flyer');f.style.left=(r0.left-W.left)+'px';f.style.top=(r0.top-W.top)+'px';f.style.width=r0.width+'px';wrap.appendChild(f);m.remove();
    requestAnimationFrame(()=>{f.style.transform='translate('+(r1.left-r0.left+r1.width/2-r0.width/2)+'px,'+(r1.top-r0.top+r1.height/2-r0.height/2)+'px) scale(.15)';f.style.opacity='.4';});
    setTimeout(()=>{f.remove();res();},480);};
});}
function letterShow(id){return new Promise(res=>{
  const c=CARDS[id];const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="mbox bigcard"><div class="pic"></div><div class="letters"></div><div class="tapnote on">👆</div></div>';
  m.querySelector('.pic').appendChild(img(c.s));const L=m.querySelector('.letters');
  [...c.w].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;L.appendChild(s);});wrap.appendChild(m);
  (async()=>{const sp=L.querySelectorAll('span');for(let i=0;i<sp.length;i++){sp[i].classList.add('on');SE.letter(i);await wait(330);}})();
  m.onclick=()=>{SE.tap();m.remove();res();};
});}
function showBag(){
  if(!EP)return;ac();SE.tap();
  const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="mbox"><div class="mtitle">🎒 かばん</div><div class="row tray"></div><div class="row"><button class="b main">とじる</button></div></div>';
  const t=m.querySelector('.tray');
  if(!ST.found.length)t.innerHTML='<span style="font-size:40px">💨</span>';
  ST.found.forEach(id=>{const b=cardHTML(id,1);b.onclick=e=>{e.stopPropagation();m.remove();letterShow(id);};t.appendChild(b);});
  m.querySelector('.b').onclick=()=>{SE.tap();m.remove();};
  m.onclick=e=>{if(e.target===m)m.remove();};
  wrap.appendChild(m);
}

/* ===== たいけつ ===== */
async function startBattle(resume){
  busy=true;clearTimeout(idleT);showHand(null);
  if(!resume){ST.phase='battle';ST.battle=0;store();await vsCut();}
  else await iris(async()=>{});
  setupBattle();busy=false;renderBattle();
}
function setupBattle(){
  BG[EP.bg](ST);setAmb(EP.bg);layer.innerHTML='';objs={};$('#scene').classList.add('dim');bgm('battle');
  const ln=document.createElement('div');ln.className='ob lines';layer.appendChild(ln);
  susEl=addActor(EP.suspect,EP.suspect,90,34,true,60);susEl.classList.add('idle');
  wombatEl=addActor('wombat','wombat',2,62,false,52);wombatEl.classList.add('idle');
  momoEl=addActor('momo','momo',44,80,false,34);momoEl.classList.add('tap','idle');momoEl.onclick=()=>{if(busy)return;ac();SE.talk();anim(momoEl,'jump');battleHint();};
  updBag();updClues();hintLv=0;wrongs=0;
}
function vsCut(){return new Promise(res=>{
  const v=document.createElement('div');v.className='vs';
  v.innerHTML='<div class="band l"></div><div class="band r"></div><div class="vt">たいけつ！</div>';
  const a=img('wombat','vw');const b=img(EP.suspect,'vsus',true);const m=img('momo_fly','vm');v.appendChild(a);v.appendChild(m);v.appendChild(b);
  wrap.appendChild(v);SE.battle();setTimeout(()=>{SE.hit();const[x,y]=center(v.querySelector('.vt'));burst(x,y,26,['#fff','#ffd84a','#ff7a3a'],7,'star');},520);
  setTimeout(()=>{v.classList.add('out');},1700);
  setTimeout(()=>{v.remove();res();},2100);
});}
function renderBattle(){
  const bt=EP.battles[ST.battle];selSt=-1;selCard=null;
  panelBase();updClues();
  const g=document.createElement('div');g.className='guide';g.innerHTML='<span>👆</span>';g.appendChild(img(EP.suspect,'',true));g.insertAdjacentHTML('beforeend','<span>➡️</span><span class="mc">あ</span>');panel.insertBefore(g,panel.firstChild);
  const sts=document.createElement('div');sts.className='sts';
  bt.st.forEach((s,i)=>{const b=document.createElement('button');b.className='st';b.style.animationDelay=(i*.18)+'s';b.appendChild(img(EP.suspect,'who',true));b.appendChild(img(s.ic,'ic'));
    b.insertAdjacentHTML('beforeend','<span class="w">'+s.w+'</span><span class="m">'+(s.m==='o'?'⭕':'❌')+'</span>');
    b.onclick=()=>{if(busy)return;ac();SE.tap();selSt=i;updSel();tryJudge();};sts.appendChild(b);});
  panel.appendChild(sts);
  const tray=document.createElement('div');tray.className='tray';
  ST.found.forEach((id,i)=>{const c=cardHTML(id,EP.lv);c.style.animationDelay=(.3+i*.06)+'s';c.onclick=()=>{if(busy)return;ac();SE.tap();selCard=id;updSel();tryJudge();};tray.appendChild(c);});
  panel.appendChild(tray);
  setStory(ST.battle===0?'いいわけの なかに うそが あるよ。おかしい ところを えらんで、うそを みやぶる カードを だそう。':'まだ いいわけを しているよ。おかしい ところに カードを つきつけよう！');
  bubbleAt(120,36,[['e','😤']],1500);anim(susEl,'jump');
  resetIdleB();
}
function updSel(){
  panel.querySelectorAll('.st').forEach((e,i)=>e.classList.toggle('sel',i===selSt));
  panel.querySelectorAll('.card').forEach(e=>e.classList.toggle('sel',e.dataset.id===selCard));
  if(selSt>=0)setBase(wombatEl,'wombat');
}
function resetIdleB(){clearTimeout(idleT);showHand(null);if(busy)return;idleT=setTimeout(()=>{if(EP&&ST.phase==='battle'&&!busy){hintLv=Math.max(hintLv,1);applyHint();}},EP.lv===1&&ST.battle===0?6000:20000);}
function battleHint(){hintLv=Math.min(2,hintLv+1);applyHint();}
function applyHint(){
  const bt=EP.battles[ST.battle];const i=bt.st.findIndex(s=>s.c);const sts=panel.querySelectorAll('.st');
  sts.forEach(e=>e.classList.remove('hint'));panel.querySelectorAll('.card').forEach(e=>e.classList.remove('hint'));
  if(hintLv>=1&&sts[i]){sts[i].classList.add('hint');showHand(sts[i]);}
  if(hintLv>=2){const c=panel.querySelector('.card[data-id="'+bt.st[i].c+'"]');if(c){c.classList.add('hint');
    if(EP.lv>1&&!c.querySelector('img')){c.classList.remove('big');c.insertBefore(img(CARDS[c.dataset.id].s),c.firstChild);}
    else if(EP.lv===2){const im=c.querySelector('img');if(im)im.src=spr(CARDS[c.dataset.id].s);}
    showHand(c);}}
  anim(momoEl,'jump');
  bubbleAt(60,78,[['e','💡']],1200);
}
async function flyCard(cardEl,toEl){
  const W=wrap.getBoundingClientRect(),r0=cardEl.getBoundingClientRect(),r1=toEl.getBoundingClientRect();
  const f=cardEl.cloneNode(true);f.classList.add('cflyer');f.classList.remove('sel','hint');f.style.left=(r0.left-W.left)+'px';f.style.top=(r0.top-W.top)+'px';f.style.width=r0.width+'px';wrap.appendChild(f);
  cardEl.style.visibility='hidden';
  await new Promise(r=>requestAnimationFrame(r));
  f.style.transform='translate('+(r1.right-W.left-90-(r0.left-W.left))+'px,'+(r1.top-W.top+r1.height/2-r0.height/2-(r0.top-W.top))+'px) rotate(-10deg) scale(.9)';
  await wait(330);return f;
}
async function tryJudge(){
  resetIdleB();
  if(selSt<0||!selCard){
    if(selSt>=0)panel.querySelectorAll('.card').forEach(e=>anim(e,'nudge'));
    else panel.querySelectorAll('.st').forEach(e=>anim(e,'nudge'));
    return;
  }
  const bt=EP.battles[ST.battle],s=bt.st[selSt],card=selCard;busy=true;clearTimeout(idleT);showHand(null);
  const stEl=panel.querySelectorAll('.st')[selSt],cardEl=panel.querySelector('.card[data-id="'+card+'"]');
  const f=await flyCard(cardEl,stEl);
  if(s.c===card){
    f.remove();
    const sc=$('#scene');anim(sc,'quake');anim($('#flash'),'on');SE.hit();setBase(wombatEl,'wombat_shout');anim(wombatEl,'lunge');
    const ln=layer.querySelector('.lines');if(ln)anim(ln,'on');
    const sh=$('#shout');anim(sh,'on');burst(...center(sh),30,['#fff','#ffd84a','#ff5a3a'],8,'star');
    const st=document.createElement('img');st.className='px stamp';st.src=spr(CARDS[card].s);stEl.appendChild(st);stEl.classList.add('broke');burst(...center(stEl),14,['#d84a4a','#fff'],4);
    await wait(380);anim(susEl,'hurt');bubbleAt(120,36,[['e','💦'],['e','😱']],1400);SE.wrong();
    await wait(1400);sh.classList.remove('on');setBase(wombatEl,'wombat');
    ST.battle++;store();hintLv=0;wrongs=0;updClues();anim($('#clues'),'pop');
    if(bt.after){busy=false;await playSeqAt(bt.after);}
    busy=false;
    if(ST.battle>=EP.battles.length)ending();else{SE.battle();renderBattle();}
  }else{
    wrongs++;
    f.classList.add('bounce');SE.boing();anim(susEl,'jump');
    bubbleAt(120,36,s.c?[['e','😏'],['t','ふふーん']]:[['e','😤'],['e','⭕'],['t','ほんと']],1500);
    anim(stEl,'shake');
    await wait(700);f.remove();cardEl.style.visibility='';
    await wait(300);selSt=-1;selCard=null;updSel();busy=false;
    if(wrongs>=2){hintLv=Math.max(hintLv,wrongs>=3?2:1);applyHint();}
    resetIdleB();
  }
}
async function playSeqAt(step){
  busy=true;const b=bubbleAt(120,36,step.b);SE.talk();setStory(step.story);anim(susEl,'shake');
  panel.querySelectorAll('.st,.card').forEach(e=>e.style.pointerEvents='none');
  await waitTap();b.remove();busy=false;
}
async function ending(resume){
  ST.phase='end';store();busy=true;
  const go=()=>{buildScene();panelBase();layer.querySelectorAll('.spot').forEach(e=>e.remove());bgm(EP.bg==='night'?'night':'day');};
  if(resume)go();else await iris(go);
  await wait(300);
  await playSeq(EP.ending);
  if(!save.cleared.includes(EP.id))save.cleared.push(EP.id);
  const found=ST.found.slice();save.cur=null;store();
  SE.clear();reward(found);
}
function giveBack(){
  const v=objs[EP.victim];if(!v)return;const it=img(EP.item,'ob giveit');const[x,y]=actorTop(EP.victim);place(it,x-8,y-22,16,16);layer.appendChild(it);
  anim(v,'jump');SE.find();burst(...scenePt(x,y-14),24,['#fff','#ffe680','#ffb0c0','#ffd84a'],5,'star');setTimeout(()=>confetti(50),300);
}
function reward(found){
  bgm(null);
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="mbox reward"><div class="seal">⭐</div><div class="dekita">できた！</div><div class="logo2"></div><div class="mtitle" style="font-size:18px">👆 ことばを みてみよう</div><div class="row tray"></div><div class="row"><button class="b main">🏠</button></div></div>';
  const lg=m.querySelector('.logo2');lg.appendChild(img('wombat','jumpy'));lg.appendChild(img('momo','jumpy'));lg.appendChild(img(EP.victim,'jumpy',true));
  const t=m.querySelector('.tray');found.forEach((id,i)=>{const b=cardHTML(id,1);b.style.animationDelay=(.6+i*.1)+'s';b.onclick=e=>{e.stopPropagation();letterShow(id);};t.appendChild(b);});
  m.querySelector('.b').onclick=()=>{SE.tap();m.remove();iris(showTitle);};
  wrap.appendChild(m);confetti(120);setTimeout(()=>burst(...center(m.querySelector('.seal')),30,['#ffd84a','#fff','#e8a33a'],7,'star'),350);
}

/* ===== せってい ===== */
function showSettings(){
  ac();SE.tap();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="mbox" style="text-align:left"><div style="font-weight:800;font-size:17px;margin-bottom:6px">おとなの せってい</div>'+
  '<label class="set"><span>おはなしの文を出す<small>大人が読み聞かせるための文。ひとりで遊ぶようになったら消せます</small></span><input type="checkbox" id="s-story"></label>'+
  '<label class="set"><span>効果音<small>ブラウザで作った音。読み上げはありません</small></span><input type="checkbox" id="s-sound"></label>'+
  '<label class="set"><span>音楽<small>効果音がオンのときに流れます</small></span><input type="checkbox" id="s-bgm"></label>'+
  '<label class="set"><span>ぜんぶのおはなしを遊べるようにする<small>ふだんは前のおはなしをクリアすると次が出ます</small></span><input type="checkbox" id="s-unlock"></label>'+
  '<div class="set"><span>きろくを消す<small>クリアのしるしと途中の状態を消します</small></span><button class="b" id="s-reset" style="border:none;border-radius:10px;padding:6px 12px;background:#f0d0c0;font:inherit">消す</button></div>'+
  '<div style="font-size:12px;color:#9a8068;margin-top:8px;line-height:1.6">遊び方：光っているところや動物をタップして「ことばカード」を集めます。高いところはモモが飛んで調べます。上の帯の「？」がうまると、てがかりがそろった合図です。そろったら「たいけつ」。いいわけの中のおかしいところを選び、うそを見やぶるカードを出します。モモをタップするとヒント。<br>おはなし1は絵つきカード、2はかげ絵、3は文字だけのカードになります。</div>'+
  '<div class="row"><button class="b main">とじる</button></div></div>';
  wrap.appendChild(m);
  const S=m.querySelector('#s-story'),Sn=m.querySelector('#s-sound'),Bg=m.querySelector('#s-bgm'),U=m.querySelector('#s-unlock');
  S.checked=save.story;Sn.checked=save.sound;Bg.checked=save.bgm;U.checked=save.unlock;
  S.onchange=()=>{save.story=S.checked;store();};Sn.onchange=()=>{save.sound=Sn.checked;store();};Bg.onchange=()=>{save.bgm=Bg.checked;store();};U.onchange=()=>{save.unlock=U.checked;store();showTitle();};
  m.querySelector('#s-reset').onclick=()=>{const b=m.querySelector('#s-reset');if(b.dataset.c){save.cleared=[];save.cur=null;store();showTitle();b.textContent='消しました';}else{b.dataset.c=1;b.textContent='もう一度おすと消えます';}};
  m.querySelector('.b.main').onclick=()=>{m.remove();showTitle();};
}

$('#b-bag').onclick=showBag;
$('#b-home').onclick=()=>{if(busy)return;ac();SE.tap();iris(showTitle);};
$('#b-set').onclick=showSettings;
$('#scene').addEventListener('pointerdown',()=>{if(EP&&ST&&ST.phase==='inv')resetIdle();});
window.addEventListener('resize',()=>showHand(null));
document.addEventListener('pointerdown',()=>{ac();if(AC&&BGM.cur&&BGM.next<AC.currentTime)BGM.next=AC.currentTime+.1;},{once:false,passive:true});
setAmb('park');
showTitle();
</script>
