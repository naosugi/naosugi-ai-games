header a{color:#7a5a3c;text-decoration:none}
header .sp{flex:1}
.hb{border:none;background:#e6d6bc;border-radius:12px;padding:4px 10px;font:inherit;font-size:16px;color:#5e4128;position:relative;cursor:pointer}
.hb b{position:absolute;right:-4px;top:-4px;background:#e8a33a;color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center}
.hb.pop{animation:pop .35s ease-out}
#scene{position:relative;width:100%;aspect-ratio:4/3;flex:0 0 auto;overflow:hidden;background:#cfe8f4}
#scene canvas{position:absolute;inset:0;width:100%;height:100%}
#scene.dim canvas{filter:brightness(.7) saturate(.8)}
#layer{position:absolute;inset:0}
.ob{position:absolute;display:block;pointer-events:none}
.tap{pointer-events:auto;cursor:pointer}
.actor{transition:left .7s ease-in-out,top .7s ease-in-out,transform .2s}
.spot{position:absolute;pointer-events:auto;cursor:pointer;border-radius:8px}
.spot::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:radial-gradient(circle,#fff 0 25%,rgba(255,240,150,.9) 26% 45%,transparent 46%);animation:tw 1.4s infinite ease-in-out}
.spot.done::after{display:none}
.spot.hi::before{content:"";position:absolute;inset:0;border:3px dashed rgba(255,255,255,.9);border-radius:10px;animation:blink .5s infinite alternate}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.4}50%{transform:scale(1.25);opacity:1}}
@keyframes blink{to{opacity:.3}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8%)}40%{transform:translateX(8%)}60%{transform:translateX(-6%)}80%{transform:translateX(5%)}}
.hop{animation:hop .45s ease-in-out 2}
.shake{animation:shake .45s}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fffdf6;border:3px solid #5e4128;border-radius:14px;padding:4px 8px;display:flex;align-items:center;gap:4px;white-space:nowrap;animation:pop .3s ease-out;z-index:5;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top-color:#5e4128;border-bottom:0}
.bubble img{width:34px;height:34px}
.bubble .e{font-size:26px;line-height:1}
.bubble .t{font-size:24px;font-weight:800}
#hand{position:absolute;font-size:36px;z-index:8;pointer-events:none;display:none;animation:hand .8s infinite ease-in-out;transform:translate(-30%,0)}
@keyframes hand{0%,100%{margin-top:0}50%{margin-top:-12px}}
#panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:8px 10px 10px;position:relative;overflow-y:auto}
#story{font-size:13px;line-height:1.5;color:#7a5a3c;background:#fffaf0;border:2px dashed #e0cfb2;border-radius:10px;padding:6px 10px;min-height:2.2em}
#story:empty{display:none}
#story.off{display:none}
#next{align-self:center;font-size:34px;color:#c25a2a;animation:hop .8s infinite;display:none;cursor:pointer;background:none;border:none}
.bigbtn{align-self:center;border:none;border-radius:20px;background:#e8a33a;color:#fff;font:inherit;font-weight:800;font-size:26px;padding:10px 24px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 #b87a20;cursor:pointer;animation:pop .4s ease-out}
.bigbtn img{width:44px;height:44px}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b87a20}
.bigbtn.glow{animation:pop .4s ease-out,glow 1s infinite alternate .4s}
@keyframes glow{to{box-shadow:0 5px 0 #b87a20,0 0 0 8px rgba(232,163,58,.35)}}
/* たいけつ */
.sts{display:flex;flex-direction:column;gap:8px}
.st{display:flex;align-items:center;gap:8px;background:#fffdf6;border:3px solid #d8c4a4;border-radius:16px;padding:6px 10px;cursor:pointer;font:inherit;color:inherit;text-align:left;position:relative;transition:transform .15s}
.st img.who{width:36px;height:36px}
.st img.ic{width:44px;height:44px}
.st .w{font-size:30px;font-weight:800;flex:1;letter-spacing:2px}
.st .m{font-size:34px;line-height:1}
.st.sel{border-color:#e8a33a;background:#fff3dc;transform:scale(1.03);box-shadow:0 0 0 4px rgba(232,163,58,.3)}
.st.hint{animation:hintb .5s infinite alternate}
@keyframes hintb{to{border-color:#ff7a3a;box-shadow:0 0 0 6px rgba(255,122,58,.35)}}
.st.broke .w{text-decoration:line-through;text-decoration-color:#d84a4a;text-decoration-thickness:4px}
.st .stamp{position:absolute;right:52px;top:50%;transform:translateY(-50%) rotate(-12deg);width:48px;height:48px;background:#fff;border:3px solid #d84a4a;border-radius:10px;padding:3px;animation:pop .3s}
.tray{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.card{min-width:78px;background:#fff;border:3px solid #e0cfb2;border-radius:12px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;color:inherit;transition:transform .15s}
.card img{width:52px;height:52px}
.card .w{font-size:19px;font-weight:800;white-space:nowrap}
.card .w i{font-style:normal;color:#c25a2a}
.card.big .w{font-size:22px;padding:14px 4px}
.mc{display:inline-flex;align-items:center;justify-content:center;width:26px;height:32px;background:#fff;border:2px solid #e0cfb2;border-radius:6px;font-size:16px;font-weight:800;color:#3a2a1e}
.card.sel{border-color:#e8a33a;transform:translateY(-8px);box-shadow:0 6px 0 rgba(232,163,58,.4)}
.card.hint{animation:hintb .5s infinite alternate}
.guide{display:flex;justify-content:center;align-items:center;gap:6px;font-size:22px;color:#a08060}
.guide img{width:30px;height:30px}
#shout{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-6deg);font-size:64px;font-weight:900;color:#fff;-webkit-text-stroke:3px #c2301a;text-shadow:0 5px 0 #c2301a;z-index:20;pointer-events:none;display:none;white-space:nowrap}

@keyframes fl{0%{opacity:.9}100%{opacity:0}}

.modal{position:absolute;inset:0;background:rgba(58,42,30,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.mbox{background:#fffaf0;border:4px solid #e0cfb2;border-radius:20px;padding:16px;max-width:420px;width:100%;max-height:100%;overflow:auto;text-align:center;animation:pop .3s}

const KEYS='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
const _spr={};
function spr(id,flip,sil){
  const k=id+'|'+(flip?1:0)+'|'+(sil||'');
  if(_spr[k]) return _spr[k];
  const s=PX[id]; if(!s) return '';
  const c=document.createElement('canvas'); c.width=c.height=s.n; const g=c.getContext('2d');
  for(let y=0;y<s.n;y++){const row=s.rows[y];for(let x=0;x<s.n;x++){const ch=row[x];if(ch==='.')continue;
    g.fillStyle=sil||s.pal[KEYS.indexOf(ch)];g.fillRect(flip?s.n-1-x:x,y,1,1);}}
  return _spr[k]=c.toDataURL();
}
function img(id,cls,flip,sil){const i=document.createElement('img');i.className='px '+(cls||'');i.src=spr(id,flip,sil);i.alt='';i.draggable=false;return i;}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,d,type,vol){const a=ac();if(!a||!save.sound)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=f;
  const t=a.currentTime+(t0||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function slide(f1,f2,d,type,vol){const a=ac();if(!a||!save.sound)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';const t=a.currentTime;
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}

/* ===== 画面の部品 ===== */
const layer=$('#layer'),panel=$('#panel');
function place(el,x,y,w,h){el.style.left=(x/SW*100)+'%';el.style.top=(y/SH*100)+'%';if(w!=null)el.style.width=(w/SW*100)+'%';if(h!=null)el.style.height=(h/SH*100)+'%';}
let EP=null,ST=null,busy=false,objs={},wombatEl,momoEl,idleT=null,hintLv=0,wrongs=0,selSt=-1,selCard=null;
const MOMO_HOME=[30,90];

function bubbleAt(x,y,toks,ms){
  const b=document.createElement('div');b.className='bubble';
  for(const[k,v]of toks){if(k==='s')b.appendChild(img(v));else{const s=document.createElement('span');s.className=k==='e'?'e':'t';s.textContent=v;b.appendChild(s);}}
  x=Math.max(14,Math.min(SW-14,x));y=Math.max(30,y);
  place(b,x,y);layer.appendChild(b);
  // はみ出し調整
  requestAnimationFrame(()=>{const L=layer.getBoundingClientRect(),r=b.getBoundingClientRect();
    if(r.left<L.left+2)b.style.left=(parseFloat(b.style.left)+(L.left+2-r.left)/L.width*100)+'%';
    if(r.right>L.right-2)b.style.left=(parseFloat(b.style.left)-(r.right-L.right+2)/L.width*100)+'%';});
  if(ms)setTimeout(()=>b.remove(),ms);
  return b;
}
function actorTop(id){const a=objs[id];if(!a)return[80,40];const n=PX[a.dataset.spr].n;return[+a.dataset.x+n/2,+a.dataset.y+2];}
function addActor(id,sprId,x,y,flip,w){
  const n=w||PX[sprId].n;const el=img(sprId,'ob actor',flip);el.dataset.spr=sprId;el.dataset.x=x;el.dataset.y=y;place(el,x,y,n,n);layer.appendChild(el);objs[id]=el;return el;
}
function setStory(t){const s=$('#story');if(s)s.textContent=t||'';}
function flash(){const f=$('#flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);}

function showHand(el){
  const h=$('#hand');if(!el){h.style.display='none';return;}
  const W=$('#wrap').getBoundingClientRect(),r=el.getBoundingClientRect();
  if(h.parentNode!==$('#wrap'))$('#wrap').appendChild(h);
  h.style.display='block';h.style.left=(r.left-W.left+r.width/2)+'px';h.style.top=(r.top-W.top+r.height*0.55)+'px';
}
function resetIdle(){clearTimeout(idleT);showHand(null);document.querySelectorAll('.spot.hi').forEach(e=>e.classList.remove('hi'));

/* ===== エピソード ===== */
function startEp(i){
  EP=EPS[i];
  if(!save.cur||save.cur.ep!==EP.id)save.cur={ep:EP.id,found:[],talked:[],seen:[],phase:'intro',battle:0};
  ST=save.cur;store();
  $('#title').style.display='none';
  hintLv=0;wrongs=0;
  if(ST.phase==='battle')startBattle(true);
  else if(ST.phase==='end')ending();
  else{buildScene();if(ST.phase==='intro')runIntro();else investigate();}
}
function buildScene(battle){
  BG[EP.bg](ST);layer.innerHTML='';objs={};
  $('#scene').classList.toggle('dim',!!battle);
  if(!battle){
    for(const s of EP.spots){const d=document.createElement('div');d.className='spot'+(ST.seen.includes(s.id)?' done':'');place(d,s.x,s.y,s.w,s.h);d.onclick=()=>onSpot(s,d);layer.appendChild(d);objs['spot_'+s.id]=d;}
    for(const a of EP.actors){const el=addActor(a.id,a.id,a.x,a.y,a.flip);el.classList.add('tap');el.onclick=()=>onActor(a,el);}
    wombatEl=addActor('wombat','wombat',0,84);momoEl=addActor('momo','momo',MOMO_HOME[0],MOMO_HOME[1],false,26);
    momoEl.classList.add('tap');momoEl.onclick=()=>{if(busy)return;ac();SE.talk();anim(momoEl,'hop');idleHint(true);};
  }
  updBag();
}
function panelBase(){panel.innerHTML='<div id="story" class="'+(save.story?'':'off')+'"></div>';}
async function playSeq(seq){
  busy=true;clearTimeout(idleT);showHand(null);
  for(const s of seq){
    const[x,y]=actorTop(s.who);const b=bubbleAt(x,y,s.b);SE.talk();setStory(s.story);
    if(s.give){giveBack();}
    await waitTap();b.remove();
  }
  busy=false;
}
function waitTap(){return new Promise(res=>{
  const n=document.createElement('button');n.id='next';n.textContent='▼';n.style.display='block';panel.appendChild(n);
  const sc=$('#scene');let done=false;
  const go=e=>{if(done)return;done=true;ac();SE.tap();n.remove();sc.removeEventListener('click',go,true);res();e&&e.stopPropagation();};
  setTimeout(()=>{n.onclick=go;sc.addEventListener('click',go,true);},350);
});}
async function runIntro(){
  panelBase();await wait(300);await playSeq(EP.intro);ST.phase='inv';store();investigate();
}
function investigate(){
  panelBase();setStory('ひかっている ところを タップして しらべよう。たかい ところは モモが とんで いきます。');
  checkReady();resetIdle();
}
function onSpot(s,d){
  if(busy)return;ac();resetIdle();
  if(ST.seen.includes(s.id)){SE.tap();if(s.card)bubbleAt(s.x+s.w/2,s.y,[['s',CARDS[s.card].s],['e','✅']],1200);else bubbleAt(s.x+s.w/2,s.y,[['e','💨']],1000);return;}
  (async()=>{
    busy=true;
    if(s.high)await momoFly(s.x+s.w/2-13,s.y+s.h/2-13);
    else{wombatEl.style.transform='translateX(4%)';await wait(150);wombatEl.style.transform='';}
    ST.seen.push(s.id);d.classList.add('done');store();
    if(s.card){SE.find();setStory(s.story);await cardPopup(s.card);gain(s.card);}
    else{SE.none();setStory(s.story);bubbleAt(s.x+s.w/2,s.y,[['e','💨']],1100);await wait(500);}
    if(s.high)await momoHome();
    busy=false;checkReady();resetIdle();
  })();
}
function onActor(a,el){
  if(busy)return;ac();resetIdle();
  (async()=>{
    busy=true;anim(el,'hop');SE.talk();const[x,y]=actorTop(a.id);const b=bubbleAt(x,y,a.talk);setStory(a.story);
    if(!ST.talked.includes(a.id)){ST.talked.push(a.id);store();}
    await wait(1700);
    if(a.give&&!ST.found.includes(a.give)){b.remove();SE.find();await cardPopup(a.give);gain(a.give);}
    else setTimeout(()=>b.remove(),900);
    busy=false;checkReady();resetIdle();
  })();
}
async function momoFly(x,y){
  SE.fly();momoEl.src=spr('momo_fly');momoEl.style.zIndex=6;place(momoEl,x,y);await wait(800);
}
async function momoHome(){momoEl.src=spr('momo_fly',true);place(momoEl,MOMO_HOME[0],MOMO_HOME[1]);await wait(750);momoEl.src=spr('momo');momoEl.style.zIndex='';}
function gain(id){if(!ST.found.includes(id)){ST.found.push(id);store();}BG[EP.bg](ST);updBag(true);}
function updBag(p){const n=ST?ST.found.length:0;$('#bagn').textContent=n;if(p)anim($('#b-bag'),'pop');}
function ready(){return EP.need.every(c=>ST.found.includes(c))&&ST.talked.includes(EP.suspect);}
function checkReady(){
  if(!ready()||$('#bbtn'))return;
  const b=document.createElement('button');b.id='bbtn';b.className='bigbtn glow';b.appendChild(img(EP.suspect,'',true));
  b.appendChild(document.createTextNode('⚡ たいけつ'));b.onclick=()=>{if(busy)return;ac();SE.battle();startBattle();};
  panel.appendChild(b);setStory('てがかりが そろった！ 「たいけつ」で、ほんとうの ことを きこう。');
}
function idleHint(fromMomo){
  if(!EP||busy)return;
  if(ST.phase==='battle'){battleHint();return;}
  let t=null;
  const sp=EP.spots.find(s=>s.card&&EP.need.includes(s.card)&&!ST.seen.includes(s.id));
  const giver=EP.actors.find(a=>a.give&&EP.need.includes(a.give)&&!ST.found.includes(a.give));
  if(!ST.talked.includes(EP.actors[0].id))t=objs[EP.actors[0].id];
  else if(sp)t=objs['spot_'+sp.id];
  else if(giver)t=objs[giver.id];

function applyHint(){
  const bt=EP.battles[ST.battle];const i=bt.st.findIndex(s=>s.c);const sts=panel.querySelectorAll('.st');
  sts.forEach(e=>e.classList.remove('hint'));panel.querySelectorAll('.card').forEach(e=>e.classList.remove('hint'));
  if(hintLv>=1&&sts[i]){sts[i].classList.add('hint');showHand(sts[i]);}
  if(hintLv>=2){const c=panel.querySelector('.card[data-id="'+bt.st[i].c+'"]');if(c){c.classList.add('hint');
    if(EP.lv>1&&!c.querySelector('img')){c.classList.remove('big');c.insertBefore(img(CARDS[c.dataset.id].s),c.firstChild);}
    else if(EP.lv===2){const im=c.querySelector('img');if(im)im.src=spr(CARDS[c.dataset.id].s);}
    showHand(c);}}
  anim(momoEl,'hop');
  bubbleAt(60,78,[['e','💡']],1200);
}
async function tryJudge(){
  resetIdleB();
  if(selSt<0||!selCard){
    if(selSt>=0)panel.querySelectorAll('.card').forEach(e=>anim(e,'hop'));
    else panel.querySelectorAll('.st').forEach(e=>anim(e,'hop'));
    return;
  }
  const bt=EP.battles[ST.battle],s=bt.st[selSt],card=selCard;busy=true;clearTimeout(idleT);showHand(null);
  const stEl=panel.querySelectorAll('.st')[selSt];
  if(s.c===card){
    flash();SE.hit();wombatEl.src=spr('wombat_shout');const sh=$('#shout');sh.classList.remove('on');void sh.offsetWidth;sh.classList.add('on');
    const st=document.createElement('img');st.className='px stamp';st.src=spr(CARDS[card].s);stEl.appendChild(st);stEl.classList.add('broke');
    await wait(400);anim(susEl,'shake');bubbleAt(120,36,[['e','💦'],['e','😱']],1400);
    await wait(1400);sh.classList.remove('on');wombatEl.src=spr('wombat');
    ST.battle++;store();hintLv=0;wrongs=0;
    if(bt.after){
      busy=false;await playSeqAt(0,bt.after);
    }
    busy=false;
    if(ST.battle>=EP.battles.length)ending();else{SE.battle();renderBattle();}
  }else{
    wrongs++;
    SE.boing();anim(susEl,'hop');
    bubbleAt(120,36,s.c?[['e','😏'],['t','ふふーん']]:[['e','😤'],['e','⭕'],['t','ほんと']],1500);
    anim(stEl,'shake');
    await wait(1000);selSt=-1;selCard=null;updSel();busy=false;
    if(wrongs>=2){hintLv=Math.max(hintLv,wrongs>=3?2:1);applyHint();}
    resetIdleB();
  }
}
async function playSeqAt(_,step){
  busy=true;const b=bubbleAt(120,36,step.b);SE.talk();setStory(step.story);
  panel.querySelectorAll('.st,.card').forEach(e=>e.style.pointerEvents='none');
  await waitTap();b.remove();busy=false;
}
async function ending(){
  ST.phase='end';store();
  buildScene();panelBase();layer.querySelectorAll('.spot').forEach(e=>e.remove());
  await wait(300);
  await playSeq(EP.ending);
  if(!save.cleared.includes(EP.id))save.cleared.push(EP.id);
  const found=ST.found.slice();save.cur=null;store();
  SE.clear();reward(found);
}
function giveBack(){
  const v=objs[EP.victim];if(!v)return;const it=img(EP.item,'ob');const[x,y]=actorTop(EP.victim);place(it,x-8,y-22,16,16);it.style.animation='pop .4s';layer.appendChild(it);
  anim(v,'hop');for(let i=0;i<5;i++)setTimeout(()=>bubbleAt(x-14+Math.random()*28,y-10-Math.random()*16,[['e','✨']],700),i*160);
}
function reward(found){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="mbox"><div style="font-size:64px;animation:pop .5s">⭐</div><div style="font-size:30px;font-weight:900;color:#c25a2a">できた！</div><div class="logo" style="justify-content:center"></div><div style="font-size:20px;margin-top:6px">👆 ことばを みてみよう</div><div class="row tray"></div><div class="row"><button class="b main">🏠</button></div></div>';
  const lg=m.querySelector('.logo');lg.appendChild(img('wombat'));const mm=img('momo','m');lg.appendChild(mm);lg.querySelectorAll('img').forEach(i=>{i.style.width='84px';i.style.height='84px';});
  const t=m.querySelector('.tray');found.forEach(id=>{const b=cardHTML(id,1);b.onclick=e=>{e.stopPropagation();letterShow(id);};t.appendChild(b);});
  m.querySelector('.b').onclick=()=>{SE.tap();m.remove();showTitle();};
  $('#wrap').appendChild(m);
}

/* ===== せってい ===== */
function showSettings(){
  ac();SE.tap();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="mbox" style="text-align:left"><div style="font-weight:800;font-size:17px;margin-bottom:6px">おとなの せってい</div>'+
  '<label class="set"><span>おはなしの文を出す<small>大人が読み聞かせるための文。ひとりで遊ぶようになったら消せます</small></span><input type="checkbox" id="s-story"></label>'+
  '<label class="set"><span>音<small>効果音（ブラウザで作った音。読み上げはありません）</small></span><input type="checkbox" id="s-sound"></label>'+
  '<label class="set"><span>ぜんぶのおはなしを遊べるようにする<small>ふだんは前のおはなしをクリアすると次が出ます</small></span><input type="checkbox" id="s-unlock"></label>'+
  '<div class="set"><span>きろくを消す<small>クリアのしるしと途中の状態を消します</small></span><button class="b" id="s-reset" style="border:none;border-radius:10px;padding:6px 12px;background:#f0d0c0;font:inherit">消す</button></div>'+
  '<div style="font-size:12px;color:#9a8068;margin-top:8px;line-height:1.6">遊び方：光っているところや動物をタップして「ことばカード」を集めます。高いところはモモが飛んで調べます。てがかりがそろったら「たいけつ」。いいわけの中のおかしいところを選び、うそを見やぶるカードを出します。モモをタップするとヒント。<br>おはなし1は絵つきカード、2はかげ絵、3は文字だけのカードになります。</div>'+
  '<div class="row"><button class="b main">とじる</button></div></div>';
  $('#wrap').appendChild(m);
  const S=m.querySelector('#s-story'),Sn=m.querySelector('#s-sound'),U=m.querySelector('#s-unlock');
  S.checked=save.story;Sn.checked=save.sound;U.checked=save.unlock;
  S.onchange=()=>{save.story=S.checked;store();};Sn.onchange=()=>{save.sound=Sn.checked;store();};U.onchange=()=>{save.unlock=U.checked;store();showTitle();};
  m.querySelector('#s-reset').onclick=()=>{if(confirmReset(m.querySelector('#s-reset'))){save.cleared=[];save.cur=null;store();showTitle();}};
  m.querySelector('.b.main').onclick=()=>{m.remove();showTitle();};
}
function confirmReset(btn){if(btn.dataset.c){return true;}btn.dataset.c=1;btn.textContent='もう一度おすと消えます';return false;}

$('#b-bag').onclick=showBag;
$('#b-home').onclick=()=>{ac();SE.tap();showTitle();};
$('#b-set').onclick=showSettings;
$('#scene').addEventListener('pointerdown',()=>{if(EP&&ST&&ST.phase==='inv')resetIdle();});
window.addEventListener('resize',()=>showHand(null));
showTitle();
</script>
</body>
