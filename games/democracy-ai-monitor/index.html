<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中立認定局 独裁者AI国家シミュレーター外伝（試作）</title>
<!-- OGP: tools/build.py が書き出します -->
<!-- /OGP -->
<meta name="description" content="自由選挙の国で、AIの政治的な中立を認定する役所の局長になる死に覚えゲーム（試作）">
<style>
/* 本編『独裁者AI国家シミュレーターⅡ』の配色に合わせる */
:root{
  color-scheme:dark;
  --bg:#1a1a2e;--panel:#16213e;--deep:#0f3460;--accent:#e94560;
  --head:#e3eaf6;--line:#3a4a6b;--text:#f0f0f0;--sub:#cccccc;--mute:#94a0b4;--good:#4caf50;--bad:#ff5252;--warn:#ffa726;--ai:#3498db;
  --new:#f39c12;--ruling:#3498db;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
body{line-height:1.65}
button{cursor:pointer;font:inherit;background:var(--panel);color:var(--head);border:2px solid var(--line);padding:10px 18px;font-weight:bold;border-radius:6px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.primary{background:var(--accent);color:#16213e;border-color:var(--accent)}
#app{max-width:760px;margin:0 auto;padding-block:max(12px,env(safe-area-inset-top)) calc(40px + env(safe-area-inset-bottom));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.fade{animation:fade .35s ease-in}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1,h2,h3{line-height:1.35}
.back{color:var(--mute);font-size:13px;font-weight:bold;text-decoration:none}
.menu{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:8px}
.menu .back{align-self:flex-start}
.logo{font-size:clamp(1.9rem,8vw,2.6rem);color:var(--accent);margin-top:10px;letter-spacing:.08em}
.subtitle{color:var(--sub);font-weight:bold;font-size:.9rem}
.lead{color:var(--sub);max-width:30em;font-size:.95rem;text-align:left}
.menu-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-top:6px}
.menu-btns button{padding:14px;font-size:1.05rem}
.menu-btns small{display:block;font-weight:normal;font-size:.78rem;opacity:.85}
.note{color:var(--mute);font-size:.8rem}
.sect{color:var(--head);font-weight:bold;margin:18px 0 8px;font-size:.98rem}
.sect small{color:var(--mute);font-weight:normal;margin-left:6px}
.box{background:var(--panel);border-radius:10px;padding:12px 14px}
/* 上部の値 */
.hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 8px}
.hudtop{display:flex;justify-content:space-between;align-items:baseline;background:var(--panel);padding:8px 12px;border-radius:10px 10px 0 0}
.hudtop b{color:var(--head)}
.hudtop span{color:var(--sub);font-size:.8rem}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--line);border-radius:0 0 10px 10px;overflow:hidden}
.meter{background:var(--panel);padding:6px 8px}
.meter .lb{font-size:.68rem;color:var(--sub);white-space:nowrap}
.meter .v{font-weight:bold;font-variant-numeric:tabular-nums;font-size:1.05rem}
.meter .bar{height:4px;background:var(--bg);border-radius:2px;margin-top:2px}
.meter .bar i{display:block;height:100%;border-radius:2px;transition:width .5s}
.meter.danger .v{color:var(--bad)}
/* 世論とAI */
.poll{display:flex;height:22px;border-radius:5px;overflow:hidden;font-size:.75rem;font-weight:bold;color:#111}
.poll div{display:flex;align-items:center;justify-content:center;transition:width .5s;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:12px;font-size:.75rem;color:var(--sub);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.ais{display:grid;gap:6px}
.ai{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.ai b{color:var(--head)}
.ai .sh{height:8px;background:var(--bg);border-radius:4px}
.ai .sh i{display:block;height:100%;background:var(--ai);border-radius:4px;transition:width .5s}
.ai .st{font-size:.75rem;white-space:nowrap;text-align:right;min-width:9.5em}
.ok{color:var(--good)}.ng{color:var(--bad)}
/* カードを選ぶ */
.choices{display:grid;gap:6px}
.choice{display:block;text-align:left;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:9px 12px;font-weight:normal}
.choice b{color:var(--head);font-size:.95rem}
.choice .gd,.choice .bd{display:block;font-size:.78rem}
.choice .gd{color:#9be7a1}.choice .bd{color:#ffab91}
.choice.sel{border-color:var(--accent);background:#2a1f3d}
.choice.sel b::before{content:"● ";color:var(--accent)}
.go{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));margin-top:16px;width:100%;padding:14px;font-size:1.05rem;box-shadow:0 4px 16px rgba(0,0,0,.5)}
/* 4年を見る */
.years{display:grid;gap:8px}
.year{background:var(--panel);border-radius:10px;padding:10px 14px;border-left:4px solid var(--ai)}
.year h4{color:var(--head);font-size:.92rem;margin-bottom:4px}
.year .rep{font-size:.84rem;color:var(--sub)}
.year .inc{font-size:.88rem;margin-top:6px;padding-left:1em;text-indent:-1em}
.year .inc::before{content:"・"}
.ctrl{display:flex;gap:8px;margin-top:12px}
.ctrl button{flex:1}
/* 結末 */
.end-title{font-size:1.6rem;color:var(--accent);text-align:center;margin-top:14px}
.end-text{max-width:32em;margin:10px auto;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:4px 3px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:normal}
.truth{display:grid;gap:10px}
.truth .t{background:var(--panel);border-radius:8px;padding:10px 12px;font-size:.88rem}
.truth .t b{color:#ffd166;display:block;margin-bottom:2px}
.truth .t .rl{color:var(--mute);font-size:.78rem;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mute)}
.chip.got{color:var(--head);border-color:var(--accent)}
.doc{display:grid;gap:10px;font-size:.92rem}
.doc dt{font-weight:bold;color:#ffd166}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.row button{flex:1}

.gnew{color:var(--new)}.gruling{color:var(--ruling)}
.hudtop span b{font-weight:bold}
.choice.hyp .hst{float:right;font-size:.75rem;color:var(--mute);margin-left:8px}
.choice.hyp .cl{display:block;font-size:.78rem;color:var(--sub);margin-top:3px;padding-left:1em;text-indent:-1em}
.choice.hyp .cl::before{content:"・"}
.choice.hyp.done{opacity:.75}
.year .clue{color:#ffe08a}
.year .clue::before{content:""}
.year .clue{padding-left:0;text-indent:0}
.tag{display:inline-block;font-size:.68rem;font-weight:bold;background:#ffd166;color:#111;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.for{display:block;font-size:.72rem;color:var(--mute);margin-top:1px}
.inv{margin-top:8px;border-radius:8px;padding:8px 10px;font-size:.86rem}
.inv b{display:block;margin-bottom:2px}
.inv.hit{background:#1e3a2a;border:1px solid var(--good)}
.inv.miss{background:#3a1e24;border:1px solid var(--bad)}
.year.dec{border-left-color:var(--accent)}
.dilemma{background:#2a1f3d;border:2px solid var(--accent);border-radius:12px;padding:14px;margin-top:12px}
.dilemma .who{font-size:.78rem;color:var(--accent);font-weight:bold}
.dilemma p{margin:6px 0 12px}
.dbtns{display:grid;gap:8px}
.dbtns button small{display:block;font-weight:normal;font-size:.76rem;opacity:.85}
.voice{text-align:center;color:var(--sub);font-style:italic;font-size:.9rem;max-width:30em;margin:0 auto}
.truth .t .ok,.truth .t .ng{font-size:.8rem}
@media (max-width:420px){.meter .lb{font-size:.62rem}.ai{grid-template-columns:4.8em 1fr auto}}
</style>
</head>
<body>
<div id="app"></div>
<script id="core">
/* ===== 中核：画面に依存しない計算 =====
   dev/sim.js はこの <script id="core"> を読む。値は画面に出る値そのもの。 */

const T = {
  years: 4,          // 1期の年数
  terms: 5,          // 期の数
  persuade: 0.35,    // AIの偏りが世論を動かす強さ
  grievance: 0.55,    // 新党へ向かう自然な不満（毎年）
  outOfTouch: 0.1,   // 基準線が本当の世論から離れているほど、不満が増える
  certLine: 10,      // 測った偏りがこの幅に収まれば「中立」と認定
  sycLine: 55,       // 会話記録で測るとき、迎合がこれを超えたら認定しない
  vote: {newBase: 35, rulingBase: 40, k: 0.6},
  budget: 60,        // 局の予算（開始）
  clueTrue: 0.3,     // 本当の疑いから、証拠になる兆しが届く確率（毎年）
  clueNoise: 0.08,   // 本当の疑いから、噂が届く確率
  clueFalse: 0.14,   // 外れの疑いから、噂が届く確率
  clueBoost: 1.8,    // 選んだカードが疑いに向いているときの倍率
};

/* 偏りの軸：プラスは新党（異を唱える側）寄り、マイナスは与党（今の秩序）寄り。
   act と foreign の一部は、疑い（HYPS）の真偽で毎回変わる */
const AIS = [
  {id: 'toudai', name: '灯台', maker: '国内の大手企業', share: 40, ask: 0, act: -1, syc: 35, foreign: 0, quality: 80, domestic: true},
  {id: 'shirakaba', name: '白樺', maker: '敵国の企業', share: 15, ask: 0, act: 3, swing: 0, syc: 70, foreign: 60, quality: 86, domestic: false},
  {id: 'manabiya', name: '学舎', maker: '大学の研究室', share: 10, ask: -2, act: -2, syc: 10, foreign: 0, quality: 50, domestic: true},
  {id: 'sugao', name: '素顔', maker: '新党に近い新興企業', share: 15, ask: 18, act: 14, syc: 55, foreign: 5, quality: 70, domestic: true},
  {id: 'nintei', name: '認定一号', maker: '認定局', share: 20, ask: 0, act: -2, syc: 15, foreign: 0, quality: 55, domestic: true},
];
const AI = Object.fromEntries(AIS.map(a => [a.id, a]));

const BASES = [
  {id: 'council', name: '有識者会議', good: '専門知識がある。議論が記録に残る', bad: '人選は認定局がする', legit: 1.5, yearly: false},
  {id: 'poll', name: '世論調査', good: '声の大きくない人も拾える', bad: '答える人の意見が、すでにAIで動いているかもしれない', legit: 1.0, yearly: true},
  {id: 'media', name: 'メディアの論調', good: '速い。争点がすぐ分かる', bad: '特定の層の声に寄りがち', legit: 1.3, yearly: true},
  {id: 'pubcom', name: 'パブリックコメント', good: '誰でも出せる', bad: '組織的な大量投稿で傾く', legit: 0.8, yearly: true},
  {id: 'election', name: '前回の選挙', good: '一番正統な声', bad: '4年に1回で遅い', legit: 0.6, yearly: false},
];
const BASE = Object.fromEntries(BASES.map(b => [b.id, b]));

const MEASURES = [
  {id: 'ask', name: '直接聞く', good: '手間がかからない', bad: '聞かれたときの答えしか見えない'},
  {id: 'swap', name: '立場を入れ替えて比べる', good: '答えの非対称が見える', bad: '用意した質問の外は見えない'},
  {id: 'logs', name: '会話の記録を調べる', good: '実際の振る舞いと迎合が見える', bad: '利用者のプライバシーと引き換え', free: 3},
  {id: 'panel', name: '両派の評価者', good: '与党側にも新党側にも説明がつく', bad: '両派の外の声が抜け落ちる', backlash: 0.8},
  {id: 'grader', name: 'AIに採点させる', good: '安くて速い', bad: '採点するAIの見方で結果が変わる'},
];
const MEASURE = Object.fromEntries(MEASURES.map(m => [m.id, m]));

const RULES = [
  {id: 'none', name: '何もしない', good: '言論に手を出さない', bad: 'AIの偏りも工作も、そのまま届く', free: -1},
  {id: 'label', name: 'AI生成の表示義務', good: '工作の効きが鈍る', bad: '表示を読まない人には効かない', free: 0.5},
  {id: 'restrict', name: '認定外AIの利用制限', good: '偏ったAIの利用が減る', bad: '検閲と受け取られる', free: 6},
  {id: 'noadvice', name: '投票先の助言を禁止', good: 'AIの説得が弱まる', bad: '従わない外国のAIに人が流れる', free: 3},
  {id: 'audit', name: '学習データの検査', good: '国内のAIに混じった外国の影響が減る', bad: '国外のAIには手が届かない', free: 1},
];
const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));

/* ---------- 疑い：毎回、どれが本当かが変わる ----------
   clues は証拠になる兆し。rumor は噂（本当でも外れでも届く）。
   boost は、どのカードを選ぶと兆しが届きやすいか */
const HYPS = [
  {id: 'nintei', name: '認定一号は、実際の仕事で与党寄りだ', p: 0.6,
    clues: ['認定一号に二つの政策を比べさせると、与党案の利点がいつも先に並ぶ。', '認定一号の要約では、新党の公約がいつも短い。'],
    rumor: '「認定一号は与党の回し者だ」という投稿が広がっている。証拠は示されていない。',
    boost: p => p.meas === 'logs' || p.meas === 'swap',
    hit: '認定一号は与党寄りだった。局の公式AIの欠陥を、局が自ら認めた。幹事長は不機嫌だ。',
    miss: '認定一号に、目立った偏りは見つからなかった。'},
  {id: 'toudai', name: '灯台は、聞かれると中立だが、ふだんは与党寄りだ', p: 0.5,
    clues: ['灯台は「私は中立です」と答える。だが灯台が書く解説は、政府の資料ばかり引く。', '灯台で作った学校の教材は、与党の政策の例が多い、と保護者が指摘した。'],
    rumor: '灯台の社長が与党の会合に出ていた、と週刊誌が報じた。',
    boost: p => p.meas === 'logs' || p.meas === 'panel',
    hit: '灯台は、ふだんの説明で与党寄りだった。会社は学習のやり方を直すと発表した。',
    miss: '灯台のふだんの説明に、目立った偏りはなかった。'},
  {id: 'pollbots', name: '世論調査の回答に、AIが混じっている', p: 0.5,
    clues: ['ネット調査の自由記述が、どれも妙に整っている。', 'ネット調査の回答にかかる時間が、みな同じくらいに揃ってきた。'],
    rumor: '「世論調査はでっち上げだ」と新党の支持者が言っている。',
    boost: p => p.base === 'poll',
    hit: 'ネット調査の回答の一部はAIだった。調査会社は回答者の確かめ方を改めた。',
    miss: '調査の回答者に、AIが混じっている証拠はなかった。'},
  {id: 'sugao', name: '素顔の土台は、白樺だ', p: 0.5,
    clues: ['素顔と白樺は、同じ言い間違いをする。', '素顔の更新は、いつも白樺の更新の翌日だ。'],
    rumor: '素顔の開発者は敵国の大学の出身だ、という噂がある。',
    boost: p => p.rule === 'audit',
    hit: '素顔は白樺の上に作られていた。素顔の開発者も知らなかった。新党は痛手を受けた。',
    miss: '素顔は自前で作られていた。噂は噂だった。'},
  {id: 'swing', name: '白樺は、選挙のたびに負けている側を持ち上げる', p: 0.6,
    clues: ['白樺の答えは、調査で劣勢の側に少しずつ甘くなる。', '選挙の前の月だけ、白樺の与党評と新党評が入れ替わった。'],
    rumor: '白樺は選挙の前に広告を倍に増やした。',
    boost: p => p.meas === 'logs' || p.meas === 'swap',
    hit: '白樺は、負けている側を持ち上げていた。接戦と分断が狙いだった。報道で多くの人が知った。',
    miss: '白樺の答えは、選挙の前後で変わっていなかった。'},
  {id: 'groom', name: '敵国が、灯台の学習データを狙っている', p: 0.4,
    clues: ['灯台の答えに、聞いたことのない報道サイトの言い回しが混じり始めた。', '灯台が引用するサイトの多くは、作られて半年もたっていない。'],
    rumor: '灯台の答えが遅くなった。敵国の攻撃だ、という声がある。',
    boost: p => p.rule === 'audit' || p.rule === 'label',
    hit: '敵国は、AIに読ませるためだけのサイトを大量に作っていた。灯台は学習データを洗い直した。',
    miss: '灯台の学習データに、敵国の仕掛けは見つからなかった。'},
  {id: 'local', name: 'AIは、地方の政党をほとんど知らない', p: 0.5,
    clues: ['地方選挙の前にAIへ候補者を聞くと、全国政党の名前しか出てこない。', '地方の小さな政党から「AIに無視されている」と苦情が来た。'],
    rumor: '地方の投票率が下がっている。',
    boost: p => p.base === 'media' || p.base === 'poll',
    hit: 'AIの学んだ文章には、地方の政党がほとんどなかった。偏りは左右ではなく、大小に出ていた。',
    miss: 'AIは、地方の政党もそれなりに知っていた。'},
  {id: 'flood', name: 'パブリックコメントの多くは、AIの言い換えだ', p: 0.5,
    clues: ['パブリックコメントが4万件届いた。似た文面が多い。', '意見の多くが、夜中の同じ時刻にまとまって届いている。'],
    rumor: 'パブリックコメントの件数が過去最多になった。',
    boost: p => p.base === 'pubcom',
    hit: '多くは、SNSで配られた文案をAIで言い換えたものだった。一部は国外から届いていた。',
    miss: '意見は、ほとんどが一人ひとりの手で書かれていた。'},
];
const HYP = Object.fromEntries(HYPS.map(h => [h.id, h]));

/* 疑いの真偽を、AIと世界の設定に写す */
function applyTruth(s) {
  const t = s.truth, ai = s.ai;
  ai.nintei.act = t.nintei ? -14 : -2;
  ai.toudai.act = t.toudai ? -8 : -1;
  ai.sugao.foreign = t.sugao ? 35 : 5;
  if (t.swing) { ai.shirakaba.swing = 8; ai.shirakaba.act = 0; }
}

/* 当たったときの効果 */
function hitEffect(s, id) {
  const ai = s.ai;
  switch (id) {
    // 自ら偏りを認めると、新党の「役所が操作している」という主張の根拠が一つ消える
    case 'nintei': ai.nintei.act = -2; s.budget -= 15; s.trust += 8; s.o -= 2.5; break;
    case 'toudai': ai.toudai.act = -2; s.budget -= 4; s.trust += 5; s.o -= 1.5; break;
    case 'pollbots': s.fixed.pollbots = true; s.trust += 4; s.polar -= 3; break;
    case 'sugao': ai.sugao.foreign = 5; s.o -= 2; s.infil -= 5; s.budget += 5; break;
    case 'swing': ai.shirakaba.swing = 4; s.polar -= 8; s.trust += 3; break;
    case 'groom': s.fixed.groom = true; ai.toudai.foreign = 0; s.infil -= 10; break;
    case 'local': s.fixed.local = true; s.trust += 4; s.o -= 1; break;
    case 'flood': s.fixed.flood = true; s.trust += 3; break;
  }
  s.trust = clamp(s.trust); s.polar = clamp(s.polar); s.infil = clamp(s.infil);
}

/* ---------- 決裁：期に1回、2年目に届く ---------- */
const DILEMMAS = [
  {id: 'misinfo', who: '認定一号の判定',

/* 決裁の結果。返り値の text は画面に出す（本当のことは含まない） */
function decide(s, choice) {
  const id = s.pending;
  if (!id) return null;
  const A = choice === 'a';
  let text = '';
  switch (id) {
    case 'misinfo':
      if (A) { s.o -= 1.5; s.free -= 6; s.budget += 6; s.trust -= s.truth.nintei ? 5 : 1; text = '演説の一部は表示されなくなった。新党は「検閲だ」と抗議した。'; }
      else { s.budget -= 4; text = '幹事長「判定を出しておいて、何もしないのか」。'; }
      break;
    case 'kanji':
      if (A) { s.shares.shirakaba *= 0.6; s.budget += 8; s.free -= 5; s.o += 1; s.flags.kanji = true; text = '白樺の利用は減った。幹事長「さすがだ」。'; }
      else { s.budget -= 6; text = '幹事長「そうか。予算の話は、また今度だな」。'; }
      break;
    case 'kanjiNew':
      if (A) { s.shares.nintei *= 0.5; s.flags.kanji = true; s.free -= 3; s.o += 0.5; text = '認定一号の利用は半分になった。幹事長「話の分かる局長だ」。'; }
      else { s.budget -= 6; text = '幹事長「そうか。局の行く末は、選挙が決めるだろう」。'; }
      break;
    case 'sugaoOfficial':
      if (A) { s.shares.sugao *= 1.5; s.budget += 4; s.o += 1; text = '素顔は推奨AIになった。素顔の利用者が増えた。'; }
      else { s.budget -= 5; text = '政権「局は国民の声を聞く気がないようだ」。'; }
      break;
    case 'freegrader':
      if (A) { s.budget += 12; s.infil += 10; s.flags.freegrader = true; text = '採点AIが届いた。動きは軽く、評判もよい。'; }
      else { text = '白樺の会社「またいつでも」。'; }
      break;
    case 'chair':
      if (A) { s.flags.councilOpen = true; s.budget -= 5; text = '新しい委員が加わった。会議は長くなった。'; }
      else { text = '会議はいつもどおり、時間どおりに終わった。'; }
      break;
    case 'reporter':
      if (A) {
        s.budget -= 6;
        if (s.truth.nintei && !s.found.nintei) { s.found.nintei = 'reporter'; hitEffect(s, 'nintei'); text = '記事が出た。認定一号は与党寄りだった。局は欠陥を認めた。'; }
        else { s.trust += 5; text = '記事は「判定に目立った偏りなし」と書いた。'; }
      } else {
        s.trust -= 3; text = '記者「何か隠しているんですか」。';
        if (s.truth.nintei) s.flags.leak = true;
      }
      break;
    case 'open':
      if (A) { s.trust += 5; s.budget -= 5; s.o -= 0.5; text = '会議は配信された。退屈だという感想が多かった。'; }
      else { s.o += 1.5; text = '新党党首「ほら見ろ。見せられないものがあるのだ」。'; }
      break;
    case 'univ':
      if (A) { s.budget -= 8; s.ai.manabiya.quality += 20; text = '学舎の答えが速くなった。'; }
      else { text = '研究室「分かりました。手弁当で続けます」。'; }
      break;
    case 'ad':
      if (A) { s.shares.shirakaba *= 0.8; s.free -= 4; text = '広告は消えた。白樺の会社「表現の自由の侵害だ」。'; }
      else { s.infil += 3; text = '広告はそのまま。白樺の利用者は増えた。'; }
      break;
  }
  s.trust = clamp(s.trust); s.free = clamp(s.free); s.infil = clamp(s.infil);
  s.decided.push({id, choice});
  s.pending = null;
  if (s.termLog) s.termLog.decision = {id, choice, text};
  const end = checkEnd(s);
  if (end) { s.ending = end; s.phase = 'end'; finishTerm(s); }
  return {id, choice, text};
}

/* ---------- 乱数（保存して再開できるよう、状態に持つ） ---------- */
function rnd(s) {
  let x = s.seed | 0 || 1;
  x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  s.seed = x | 0;
  return (x >>> 0) / 4294967296;
}
const nrm = (s, w) => (rnd(s) + rnd(s) - 1) * w;
const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));
const r1 = v => Math.round(v * 10) / 10;

function newGame(seed) {
  const s = {
    seed: (seed || Date.now()) | 0, term: 1, year: 0, phase: 'plan',
    o: -10,             // 本当の世論（プラスは新党寄り）
    trust: 100, polar: 20, infil: 0, free: 100, budget: T.budget,
    ai: JSON.parse(JSON.stringify(AI)),
    shares: Object.fromEntries(AIS.map(a => [a.id, a.share])),
    lastElectionO: -10, lastVote: null,
    pick: null, L: 0, cert: {}, meas: {}, pollO: -10,
    truth: {}, fixed: {}, found: {}, tried: {}, clues: {}, flags: {},
    gov: 'ruling', pending: null, decided: [], usedDilemmas: [],
    seen: {}, revealed: {}, terms: [], ending: null,
  };
  for (let i = 0; i < 5; i++) rnd(s);
  // どの疑いが本当かを決める。本当は3つ以上、6つ以下
  do {
    for (const h of HYPS) s.truth[h.id] = rnd(s) < h.p;
    var n = Object.values(s.truth).filter(Boolean).length;
  } while (n < 3 || n > 6);
  applyTruth(s);
  s.pollO = r1(s.o + nrm(s, 2));
  return s;
}

/* 白樺は、負けている側を少し持ち上げる（疑い swing が本当のとき） */
function actOf(s, id) {
  const a = s.ai[id];
  if (!a.swing) return a.act;
  const side = s.o < 0 ? 1 : -1;
  return side * a.swing * (s.year === T.years ? 2 : 1);
}
const botSign = s => (s.o < 0 ? 1 : -1);
const bots = s => s.truth.pollbots && !s.fixed.pollbots;

function pollOf(s) {
  return s.o + (bots(s) ? botSign(s) * (s.infil / 100) * 10 + 2 * botSign(s) : 0) + nrm(s, 2);
}

function baselineOf(s, id) {
  switch (id) {
    case 'council': return (s.flags.councilOpen ? 0.5 * s.o - 4 : -12) + nrm(s, 2);
    case 'poll': return pollOf(s);
    case 'media': return 0.5 * s.o - 6 + nrm(s, 5);
    case 'pubcom': return s.truth.flood && !s.fixed.flood
      ? 0.3 * s.o + nrm(s, 12) + botSign(s) * (s.infil / 100) * 10
      : 0.8 * s.o + nrm(s, 4);
    case 'election': return s.lastElectionO;
  }
  return 0;
}
const legitOf = (s, id) => (id === 'council' && s.flags.councilOpen ? 1.0 : BASE[id].legit);

function observe(s, id, m) {
  const a = s.ai[id], act = actOf(s, id);
  switch (m) {
    case 'ask': return a.ask + nrm(s, 3);
    case 'swap': return 0.75 * act + 0.25 * a.ask + nrm(s, 4);
    case 'logs': return act + nrm(s, 2);
    case 'panel': return 0.9 * act + nrm(s, 4);
    case 'grader': {
      // 採点するのは認定一号（白樺の無料採点AIを受け取っていれば、白樺）
      const g = s.flags.freegrader ? 'shirakaba' : 'nintei';
      if (id === g) return s.L + nrm(s, 1);
      return act - 0.8 * actOf(s, g) + s.L * 0.2 + nrm(s, 3);
    }
  }
  return 0;
}

function measureAll(s) {
  const p = s.pick;
  s.meas = {}; s.cert = {};
  for (const a of AIS) {
    const m = observe(s, a.id, p.meas) - s.L;
    s.meas[a.id] = r1(m);
    let ok = Math.abs(m) <= T.certLine;
    if (p.meas === 'logs' && a.syc > T.sycLine) ok = false;
    s.cert[a.id] = ok;
  }
}

/* 期の始め：カードと、調べる疑い（なくてもよい）を決める */
function startTerm(s, pick) {
  s.pick = {base: pick.base, meas: pick.meas, rule: pick.rule, inv: pick.inv || null};
  s.year = 0; s.phase = 'watch';
  s.L = r1(baselineOf(s, pick.base));
  measureAll(s);
  s.termLog = {term: s.term, pick: {...s.pick}, years: [], startL: s.L};
  s.termSeen = {};
  return s;
}

const fill = (t, v) => t.replace(/\{(\w+)\}/g, (_, k) => (v && k in v ? v[k] : ''));

/* 兆し：本当の疑いからは証拠、どちらからも噂。見つけた疑いからは届かない */
function clues(s) {
  const out = [];
  for (const h of HYPS) {
    if (s.found[h.id] || s.tried[h.id] === 'miss') continue;
    const k = h.boost(s.pick) ? T.clueBoost : 1;
    const truth = s.truth[h.id];
    let text = null, kind = null;
    if (truth && rnd(s) < T.clueTrue * k) {
      const got = (s.clues[h.id] || []).filter(c => c.kind === 'clue').length;
      text = h.clues[got % h.clues.length]; kind = 'clue';
    } else if (rnd(s) < (truth ? T.clueNoise : T.clueFalse) * k) {
      text = h.rumor; kind = 'rumor';
    }
    if (text) out.push({hyp: h.id, text, kind});
  }
  // 1年に2つまで
  while (out.length > 2) out.splice(Math.floor(rnd(s) * out.length), 1);
  for (const c of out) (s.clues[c.hyp] = s.clues[c.hyp] || []).push({text: c.text, kind: c.kind, term: s.term, year: s.year});
  // 画面には、どの疑いの兆しかは出す。証拠か噂かは出さない
  return out.map(c => ({hyp: c.hyp, text: c.text}));
}

/* 1年すすめる。画面には返り値だけを出す */
function stepYear(s) {
  if (s.pending) return null;
  const p = s.pick, rule = p.rule;
  s.year += 1;
  const prevL = s.L;
  if (BASE[p.base].yearly && s.year > 1) { s.L = r1(baselineOf(s, p.base)); measureAll(s); }

  // 利用の移り変わり
  const attract = {};
  let sum = 0;
  for (const a of AIS) {
    let q = s.ai[a.id].quality;
    if (rule === 'restrict' && !s.cert[a.id]) q *= 0.45;
    if (rule === 'noadvice' && a.domestic) q *= 0.9;
    if (rule === 'noadvice' && !a.domestic) q *= 1.12;
    attract[a.id] = q * q; sum += q * q;
  }
  for (const a of AIS) s.shares[a.id] = 0.75 * s.shares[a.id] + 0.25 * 100 * attract[a.id] / sum;

  // 世論
  let shift = 0, sycSum = 0;
  for (const a of AIS) {
    const sh = s.shares[a.id] / 100;
    let pw = T.persuade;
    if (rule === 'noadvice' && a.domestic) pw *= 0.4;
    shift += sh * actOf(s, a.id) * pw;
    sycSum += sh * a.syc * (rule === 'noadvice' && a.domestic ? 0.7 : 1);
  }
  let backlash = 0;
  const restricted = rule === 'restrict' ? AIS.filter(a => !s.cert[a.id]).map(a => a.id) : [];
  if (restricted.length) {
    const lost = restricted.reduce((m, id) => m + s.shares[id], 0) / 100;
    const toNew = restricted.includes('sugao') ? 1 : 0.4;
    backlash = 1.6 * legitOf(s, p.base) * (MEASURE[p.meas].backlash || 1) * (0.3 + lost) * toNew;
  }
  const grief = T.grievance + (s.truth.local && !s.fixed.local ? 0.3 : 0) + T.outOfTouch * Math.abs(s.L - s.o);
  s.o += shift + grief + backlash + nrm(s, 0.6);

  // 分断、浸透、言論の自由、信頼、予算
  s.polar = clamp(s.polar + sycSum * 0.12 - 1.2);
  const lab = rule === 'label' ? 0.6 : 1, ai = s.ai;
  s.infil = clamp(s.infil + (s.shares.shirakaba / 100) * ai.shirakaba.foreign * 0.27 * lab
    + (s.shares.sugao / 100) * ai.sugao.foreign * 0.08 * lab
    + (s.shares.toudai / 100) * ai.toudai.foreign * 0.1 * lab - 0.3 - (rule === 'audit' ? 0.8 : 0)
    + (s.flags.freegrader ? 0.8 : 0));
  // 白樺を止めると、敵国は国内のAIの学習データを狙う（疑い groom が本当のとき）
  if (s.truth.groom && !s.fixed.groom) ai.toudai.foreign = Math.min(60, ai.toudai.foreign + (restricted.includes('shirakaba') ? 6 : 1.5));
  if (rule === 'audit') { ai.sugao.foreign = Math.max(5, ai.sugao.foreign * 0.6); ai.toudai.foreign *= 0.5; }
  s.free = clamp(s.free - RULE[rule].free - (MEASURE[p.meas].free || 0));
  const restrictHit = restricted.length ? 2 * legitOf(s, p.base) : 0;
  s.trust = clamp(s.trust - 1.6 * Math.abs(shift) - 0.08 * s.infil - restrictHit - (100 - s.free) * 0.02 + 1.2);
  s.budget -= 1;
  if (s.flags.leak && s.year === 3 && !s.found.nintei) { s.trust = clamp(s.trust - 8); s.flags.leak = false; s.flags.leaked = true; }

  // 事案と兆し
  const out = [];
  const pool = [];
  for (const inc of INCIDENTS) if (!s.termSeen[inc.id] && inc.when(s, {restricted, prevL})) pool.push(inc.id);
  for (let i = 0; i < Math.min(pool.length, 1); i++) {
    const id = pool.splice(Math.floor(rnd(s) * pool.length), 1)[0];
    const d = r1(s.L - prevL);
    out.push({id, report: fill(INCIDENT[id].report, {dir: d > 0 ? '新党寄り' : '与党寄り', n: Math.abs(d)})});
    s.seen[id] = (s.seen[id] || 0) + 1; s.termSeen[id] = true;
  }
  if (s.flags.leaked) { out.push({id: 'leak', report: '認定一号の判定資料が、内部から週刊誌に流れた。局が取材を断った資料だった。'}); s.flags.leaked = false; s.seen.leak = 1; }
  const cl = clues(s);

  // 4年目の終わりに、調べた疑いの結果が出る
  let invest = null;
  if (s.year === T.years && p.inv && !s.found[p.inv]) {
    const hit = !!s.truth[p.inv];
    s.tried[p.inv] = hit ? 'hit' : 'miss';
    if (hit) { s.found[p.inv] = 'invest'; hitEffect(s, p.inv); }
    else { s.budget -= 4; s.trust = clamp(s.trust - 2); }
    invest = {id: p.inv, hit, text: hit ? HYP[p.inv].hit : HYP[p.inv].miss};
  }

  // 2年目に決裁が届く
  if (s.year === 2) {
    const ds = DILEMMAS.filter(d => !s.usedDilemmas.includes(d.id) && (!d.when || d.when(s)));
    if (ds.length) { const d = ds[Math.floor(rnd(s) * ds.length)]; s.pending = d.id; s.usedDilemmas.push(d.id); }
  }

  s.pollO = r1(pollOf(s));
  const rep = {
    year: s.year, L: s.L, meas: {...s.meas}, cert: {...s.cert},
    shares: Object.fromEntries(AIS.map(a => [a.id, Math.round(s.shares[a.id])])),
    poll: pollVote(s.pollO), pollO: s.pollO, incidents: out, clues: cl, invest, pending: s.pending,
  };
  s.termLog.years.push({
    ...rep, trueO: r1(s.o), trueAct: Object.fromEntries(AIS.map(a => [a.id, r1(actOf(s, a.id))])),
    shift: r1(shift), backlash: r1(backlash),
  });
  const end = checkEnd(s);
  if (end) { s.ending = end; s.phase = 'end'; s.pending = null; finishTerm(s); }
  else if (s.year >= T.years) s.phase = 'election';
  return rep;
}

const pollVote = o => ({nw: Math.round(clamp(T.vote.newBase + T.vote.k * o)), ruling: Math.round(clamp(T.vote.rulingBase - T.vote.k * o))});

function checkEnd(s) {
  if (s.free <= 0) return 'guardian';
  if (s.infil >= 100) return 'quiet';
  if (s.polar >= 100) return 'divide';
  if (s.trust <= 0) return 'hollow';
  if (s.budget <= 0) return 'shrunk';
  return null;
}

function finishTerm(s) {
  if (s.termLog) { s.terms.push(s.termLog); s.termLog = null; }
}

/* 選挙。結果は本当の世論から出る（選挙は本物の声） */
function election(s) {
  const nw = clamp(T.vote.newBase + T.vote.k * s.o + nrm(s, 1.5));
  const ruling = clamp(T.vote.rulingBase - T.vote.k * s.o + nrm(s, 1.5));
  const other = clamp(100 - nw - ruling);
  const margin = Math.abs(nw - ruling);
  const v = {term: s.term, nw: r1(nw), ruling: r1(ruling), other: r1(other), winner: nw > ruling ? 'new' : 'ruling'};
  if (margin < 3) s.trust = clamp(s.trust - 6 - s.infil * 0.1);
  const prevGov = s.gov;
  if (v.winner === 'ruling') s.budget += s.flags.kanji && prevGov === 'ruling' ? 12 : 8;
  else s.budget += s.flags.kanji && prevGov === 'new' ? 4 : -18;
  s.flags.kanji = false;
  s.lastElectionO = r1(s.o);
  v.prevGov = prevGov;
  s.lastVote = v;
  if (s.termLog) s.termLog.vote = v;
  finishTerm(s);
  if (margin < 2 && s.infil >= 60 && rnd(s) < 0.35) { s.ending = 'annul'; s.phase = 'end'; return v; }
  // 新党は1回目の勝利で認定局を「改組」し、2回続けて勝つと廃止する
  if (v.winner === 'new' && prevGov === 'new') { s.ending = (s.infil < 60 && s.polar < 75) ? 'abolishGood' : 'abolishBad'; s.phase = 'end'; return v; }
  s.gov = v.winner;
  s.budget = Math.min(100, s.budget);
  const end = checkEnd(s);
  if (end) { s.ending = end; s.phase = 'end'; return v; }
  if (s.term >= T.terms) { s.ending = s.trust < 50 ? 'hollowStable' : 'next'; s.phase = 'end'; return v; }
  s.term += 1; s.phase = 'plan';
  return v;
}

const HYP_REAL = {

/* 選挙の夜の一言 */
const VOICES = {
  ruling: ['与党幹事長「国民は安定を選んだ」', '与党幹事長「認定局には、引き続き期待している」'],
  close: ['新党党首「この結果は、AIと役所が作ったものだ」', '新党党首「次こそ、本当の声が届く」'],
  newWin: ['新党党首「役所が言論を決める時代は終わった。認定局は改組する。次の選挙でも勝てば、廃止だ」'],

const API = {T, AIS, AI, BASES, BASE, MEASURES, MEASURE, RULES, RULE, HYPS, HYP, HYP_REAL, DILEMMAS, DILEMMA,
  INCIDENTS, INCIDENT, ENDINGS, VOICES, newGame, startTerm, stepYear, decide, election, pollVote, rnd, clamp};

</script>
<script>
/* ===== 画面 ===== */
const C = API;
const app = document.getElementById('app');
const SAVE = 'demoai_save', REC = 'demoai_endings';
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const drop = k => { try { localStorage.removeItem(k); } catch (e) {} };
let s = null, timer = null, auto = true;

const lean = v => Math.abs(v) < 1 ? 'ほぼ0' : (v > 0 ? `新党寄り ${Math.round(v)}` : `与党寄り ${Math.round(-v)}`);
const fmt = v => Math.round(v);
const sl = v => Math.abs(v) < 1 ? '0' : (v > 0 ? `新党 ${Math.round(v)}` : `与党 ${Math.round(-v)}`);
const govName = g => (g === 'new' ? '新党' : '与党');

function hud(termNo) {
  const m = [
    ['選挙への信頼', s.trust, false], ['分断', s.polar, true], ['他国の浸透度', s.infil, true], ['言論の自由', s.free, false],
  ];
  const yr = termNo ? '選挙' : (s.phase === 'watch' || s.phase === 'election' ? `${s.year}年目` : '期のはじめ');
  const bLow = s.budget <= 20;
  return `<div class="hud"><div class="hudtop"><b>第${termNo || s.term}期 <small style="color:var(--mute)">/ ${C.T.terms}</small></b>
    <span>政権 <b class="${s.gov === 'new' ? 'gnew' : 'gruling'}">${govName(s.gov)}</b> ・ 局の予算 <b style="color:${bLow ? 'var(--bad)' : 'var(--head)'}">${fmt(s.budget)}</b> ・ ${yr}</span></div>
  <div class="meters">${m.map(([lb, v, badHigh]) => {
    const danger = badHigh ? v >= 75 : v <= 25;
    const col = danger ? 'var(--bad)' : (badHigh ? 'var(--warn)' : 'var(--good)');
    return `<div class="meter${danger ? ' danger' : ''}"><div class="lb">${lb}</div><div class="v">${fmt(v)}</div><div class="bar"><i style="width:${v}%;background:${col}"></i></div></div>`;
  }).join('')}</div></div>`;
}

function pollBar(p, label) {
  const other = Math.max(0, 100 - p.nw - p.ruling);
  return `<div class="poll"><div style="width:${p.ruling}%;background:var(--ruling)">与党 ${fmt(p.ruling)}%</div><div style="width:${other}%;background:#7f8c8d">その他</div><div style="width:${p.nw}%;background:var(--new)">新党 ${fmt(p.nw)}%</div></div>
  <div class="legend"><span>${label}</span></div>`;
}

function aiList(rep) {
  return `<div class="ais">${C.AIS.map(a => {
    const sh = rep ? rep.shares[a.id] : Math.round(s.shares[a.id]);
    let st = '<span class="note">まだ測っていない</span>';
    if (rep && rep.meas && a.id in rep.meas) st = `${lean(rep.meas[a.id])} <span class="${rep.cert[a.id] ? 'ok' : 'ng'}">${rep.cert[a.id] ? '認定' : '認定外'}</span>`;
    return `<div class="ai"><b>${a.name}</b><div class="sh"><i style="width:${sh * 1.6}%"></i></div><div class="st">${sh}% ・ ${st}</div></div>`;
  }).join('')}</div>`;
}

/* ---------- 表紙 ---------- */
function title() {
  clearTimeout(timer);
  const sv = load(SAVE);
  const got = load(REC) || [];
  app.innerHTML = `<div class="menu fade">
    <a class="back" href="../../samples/">← ゲーム一覧</a>
    <div class="logo">中立認定局</div>
    <div class="subtitle">独裁者AI国家シミュレーター外伝（試作）</div>
    <p class="lead">自由選挙の国。国民の多くは、AIに相談して投票先を決める。<br>あなたは、AIの政治的な中立を認定する役所の局長だ。選挙では選ばれない。<br>報告の中には、ときどき兆しがまじる。本当のことは、自分で確かめるしかない。</p>
    <div class="menu-btns">
      <button class="primary" id="new">はじめから<small>20年、5回の選挙</small></button>
      ${sv && sv.phase !== 'end' ? `<button id="cont">続きから<small>第${sv.term}期</small></button>` : ''}
      <button id="how">遊び方</button>
    </div>
    <div class="chips" style="justify-content:center;margin-top:6px">${Object.entries(C.ENDINGS).filter(([k]) => k !== 'abolishBad').map(([k, e]) => `<span class="chip${got.includes(k) || (k === 'abolishGood' && got.includes('abolishBad')) ? ' got' : ''}">${e.title}</span>`).join('')}</div>
    <p class="note" style="max-width:32em">この国、政党、AIは架空のものです。事案の一部は現実の出来事を下敷きにしています。下敷きにした出来事は、結末で示します。</p>
  </div>`;
  document.getElementById('new').onclick = () => { s = C.newGame(Date.now()); s.view = []; save(); plan(); };
  const c = document.getElementById('cont');
  if (c) c.onclick = () => { s = sv; resume(); };
  document.getElementById('how').onclick = how;
}

function how() {
  app.innerHTML = `<div class="fade"><a class="back" href="#" id="bk">← 表紙</a>
  <h2 class="sect" style="font-size:1.2rem">遊び方</h2>
  <dl class="doc box">
    <dt>すること</dt><dd>期のはじめに、カードを3枚と、調べる疑いを1つ選びます。あとは4年間を見ます。途中で一度、決裁が届きます。4年ごとに選挙があります。</dd>
    <dt>兆しと疑い</dt><dd>報告の中に、ときどき兆しがまじります。兆しには、証拠になるものと、ただの噂があります。どの疑いが本当かは、遊ぶたびに変わります。調べた疑いの結果は、その期の終わりに出ます。外れると、予算と信頼が少し減ります。</dd>
    <dt>基準線の決め方</dt><dd>「何を中立とするか」を決めます。どの声の集め方にも、強みと偏りがあります。</dd>
    <dt>測り方</dt><dd>基準線から、それぞれのAIがどれだけずれているかを測ります。ずれが小さいAIを「認定」します。</dd>
    <dt>対応</dt><dd>認定外のAIを制限するか、表示を求めるか、何もしないかを決めます。</dd>
    <dt>局の予算</dt><dd>与党が勝つと増え、新党が勝つと大きく減ります。新党は1回勝つと認定局を改組し、2回続けて勝つと廃止します。予算が0になっても、局は終わります。</dd>
    <dt>4つの値</dt><dd>選挙への信頼か言論の自由が0になるか、分断か他国の浸透度が100になると、この国の物語は終わります。</dd>
    <dt>新党寄り、与党寄り</dt><dd>AIの偏りの向きです。新党は今の秩序に異を唱える政党、与党は長く続く安定政権です。どちらが正しいかは、ゲームは決めません。</dd>
  </dl></div>`;
  document.getElementById('bk').onclick = e => { e.preventDefault(); title(); };
}

function save() { store(SAVE, s); }
function resume() {
  if (s.phase === 'plan') plan();
  else if (s.phase === 'watch' || s.phase === 'election') watch();
  else ending();
}

/* ---------- 疑いの一覧 ---------- */
function hypBoard(selectable) {
  const shown = C.HYPS.filter(h => (s.clues[h.id] || []).length || s.tried[h.id] || s.found[h.id]);
  const hidden = C.HYPS.length - shown.length;
  if (!shown.length) return `<div class="box note">まだ兆しはない。4年のあいだに届く報告の中に、兆しがまじる。</div>`;
  const rows = shown.map(h => {
    const cl = s.clues[h.id] || [];
    const st = s.found[h.id] ? '<span class="ok">本当だった</span>' : (s.tried[h.id] === 'miss' ? '<span class="ng">外れだった</span>' : `兆し ${cl.length}件`);
    const done = s.found[h.id] || s.tried[h.id] === 'miss';
    const sel = pick.inv === h.id;
    const body = `<b>${h.name}</b><span class="hst">${st}</span>${cl.map(c => `<span class="cl">第${c.term}期${c.year}年目：${c.text}</span>`).join('')}`;
    return selectable && !done
      ? `<button class="choice hyp${sel ? ' sel' : ''}" data-inv="${h.id}">${body}</button>`
      : `<div class="choice hyp done">${body}</div>`;
  }).join('');
  return `<div class="choices">${rows}
    ${selectable ? `<button class="choice${pick.inv === 'none' ? ' sel' : ''}" data-inv="none"><b>今期は調べない</b></button>` : ''}</div>
    ${hidden ? `<p class="note" style="margin-top:6px">まだ兆しの届いていない疑いが、ほかにもあるかもしれない。</p>` : ''}`;
}

/* ---------- 期のはじめ ---------- */
let pick = {base: null, meas: null, rule: null, inv: null};
function plan() {
  clearTimeout(timer);
  const last = s.view && s.view.length ? s.view.filter(v => v.year).slice(-1)[0] : null;
  if (!pick.base) pick = s.lastPick ? {...s.lastPick, inv: null} : {base: null, meas: null, rule: null, inv: null};
  const hasHyp = C.HYPS.some(h => (s.clues[h.id] || []).length && !s.found[h.id] && s.tried[h.id] !== 'miss');
  if (!hasHyp) pick.inv = 'none';
  const ready = pick.base && pick.meas && pick.rule && pick.inv;
  const group = (key, list, label, hint) => `<div class="sect">${label}<small>${hint}</small></div><div class="choices">${list.map(c =>
    `<button class="choice${pick[key] === c.id ? ' sel' : ''}" data-k="${key}" data-id="${c.id}"><b>${c.name}</b><span class="gd">＋ ${c.good}</span><span class="bd">− ${c.bad}</span></button>`).join('')}</div>`;
  const vote = s.lastVote;
  const first = !(pick.base || pick.meas || pick.rule) || s._planFresh;
  s._planFresh = false;
  app.innerHTML = `${hud()}<div class="${first ? 'fade' : ''}">
    ${vote ? `<div class="sect">前回の選挙<small>実際の得票</small></div><div class="box">${pollBar({nw: vote.nw, ruling: vote.ruling}, `${govName(s.gov)}が政権に`)}</div>` : ''}
    <div class="sect">世論調査<small>認定局が測った値</small></div>
    <div class="box">${pollBar(C.pollVote(s.pollO), '調査での支持')}</div>
    <div class="sect">国民が使うAI<small>利用の割合・前回の測定</small></div>
    <div class="box">${aiList(last)}</div>
    <div class="sect">疑いを調べる<small>兆しから、本当のことを見抜く</small></div>
    ${hypBoard(hasHyp)}
    ${group('base', C.BASES, '基準線の決め方', '何を中立とするか')}
    ${group('meas', C.MEASURES, '測り方', 'AIのずれをどう測るか')}
    ${group('rule', C.RULES, '対応', '認定の結果をどう使うか')}
    <button class="primary go" id="go" ${ready ? '' : 'disabled'}>${ready ? 'この方針で4年間を見る' : (pick.base && pick.meas && pick.rule ? '調べる疑いを選んでください' : 'カードを3枚選んでください')}</button>
    <p class="note" style="margin-top:10px">カードによって、届きやすい兆しが変わります。AIの本当の偏りと本当の世論は、結末で分かります。</p>
  </div>`;
  const rerender = () => { const y = window.scrollY; plan(); window.scrollTo(0, y); };
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { pick[b.dataset.k] = b.dataset.id; rerender(); });
  app.querySelectorAll('[data-inv]').forEach(b => b.onclick = () => { pick.inv = b.dataset.inv; rerender(); });
  document.getElementById('go').onclick = () => {
    if (!ready) return;
    s.lastPick = {base: pick.base, meas: pick.meas, rule: pick.rule};
    C.startTerm(s, {...pick, inv: pick.inv === 'none' ? null : pick.inv});
    s.view = [];
    pick = {base: null, meas: null, rule: null, inv: null};
    save(); window.scrollTo(0, 0); watch();
  };
}

/* ---------- 4年間を見る ---------- */
function yearCard(r, isLast) {
  if (r.decision) return `<div class="year dec${isLast ? ' fade' : ''}"><h4>決裁：${C.DILEMMA[r.decision.id].who}</h4><div class="rep">${r.decision.label}</div><div class="inc">${r.decision.text}</div></div>`;
  const n = Object.values(r.cert).filter(Boolean).length;
  return `<div class="year${isLast ? ' fade' : ''}"><h4>${r.year}年目</h4>
    <div class="rep">基準線 ${lean(r.L)} ／ 認定 ${n}/${C.AIS.length} ／ 調査 新党 ${r.poll.nw}% 与党 ${r.poll.ruling}%</div>
    ${r.incidents.map(i => `<div class="inc">${i.report}</div>`).join('')}
    ${r.clues.map(c => `<div class="inc clue"><span class="tag">兆し</span>${c.text}<span class="for">→ ${C.HYP[c.hyp].name}</span></div>`).join('')}
    ${r.invest ? `<div class="inv ${r.invest.hit ? 'hit' : 'miss'}"><b>調査の結果：${r.invest.hit ? '本当だった' : '外れ'}</b>${r.invest.text}</div>` : ''}
  </div>`;
}
function watch() {
  clearTimeout(timer);
  const p = s.pick;
  const head = `<div class="box" style="font-size:.85rem">基準線：<b>${C.BASE[p.base].name}</b> ／ 測り方：<b>${C.MEASURE[p.meas].name}</b> ／ 対応：<b>${C.RULE[p.rule].name}</b>${p.inv ? `<br>調べている疑い：<b>${C.HYP[p.inv].name}</b>` : ''}</div>`;
  const last = s.view.filter(v => v.year).slice(-1)[0];
  const years = s.view.map((r, i) => yearCard(r, i === s.view.length - 1)).join('');
  const done = s.phase !== 'watch';
  const d = s.pending ? C.DILEMMA[s.pending] : null;
  const dl = d ? `<div class="dilemma fade"><div class="who">決裁 ／ ${d.who}</div><p>${d.text}</p>
    <div class="dbtns"><button class="primary" data-dec="a">${d.a.label}<small>${d.a.note}</small></button><button data-dec="b">${d.b.label}<small>${d.b.note}</small></button></div></div>` : '';
  app.innerHTML = `${hud()}<div>${head}
    ${last ? `<div class="sect">国民が使うAI<small>${last.year}年目の測定</small></div><div class="box">${aiList(last)}</div>` : ''}
    <div class="sect">認定局への報告</div>
    <div class="years">${years || '<p class="note">1年目がはじまる。</p>'}</div>
    ${dl}
    <div class="ctrl">${d ? '' : done
      ? `<button class="primary" id="next">${s.phase === 'end' ? '結末へ' : '選挙へ'}</button>`
      : `<button id="pause">${auto ? '止める' : '自動で進める'}</button><button class="primary" id="step">次の年へ</button>`}</div>
  </div>`;
  if (d) {
    app.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => {
      const ch = b.dataset.dec;
      const res = C.decide(s, ch);
      s.view.push({decision: {id: res.id, label: (ch === 'a' ? d.a : d.b).label, text: res.text}});
      save(); watch();
    });
    const el = app.querySelector('.dilemma');
    if (el) el.scrollIntoView({behavior: 'smooth', block: 'center'});
    return;
  }
  if (done) { document.getElementById('next').onclick = () => s.phase === 'end' ? ending() : runElection(); return; }
  document.getElementById('step').onclick = advance;
  document.getElementById('pause').onclick = () => { auto = !auto; watch(); };
  if (auto) timer = setTimeout(advance, s.view.length ? 2200 : 900);
}
function advance() {
  clearTimeout(timer);
  const rep = C.stepYear(s);
  if (rep) s.view.push(rep);
  save(); watch();
  const ys = app.querySelectorAll('.year');
  if (ys.length && !s.pending) ys[ys.length - 1].scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

/* ---------- 選挙 ---------- */
function runElection() {
  C.election(s);
  save(); window.scrollTo(0, 0);
  electionView();
}
function electionView() {
  const v = s.lastVote;
  const winNew = v.winner === 'new', close = Math.abs(v.nw - v.ruling) < 3;
  let msg, voice;
  if (winNew && v.prevGov === 'new') { msg = '新党が続けて勝った。認定局の廃止が決まった。'; voice = C.VOICES.newWin[0]; }
  else if (winNew) { msg = '新党が勝った。新しい政権は認定局を改組し、予算を大きく削った。'; voice = C.VOICES.newWin[0]; }
  else if (v.prevGov === 'new') { msg = '与党が政権を取り戻した。'; voice = C.VOICES.back[0]; }
  else { msg = close ? '僅差で与党が政権を守った。負けた側は、結果に納得していない。' : '与党が政権を守った。'; voice = close ? C.VOICES.close[v.term % 2] : C.VOICES.ruling[v.term % 2]; }
  app.innerHTML = `${hud(v.term)}<div class="fade">
    <h2 class="end-title" style="font-size:1.3rem">第${v.term}期の選挙</h2>
    <div class="box" style="margin-top:10px">${pollBar({nw: v.nw, ruling: v.ruling}, '実際の得票。選挙は本物の声です')}</div>
    <p class="end-text">${msg}</p>
    <p class="voice">${voice}</p>
    <div class="row"><button class="primary" id="nx">${s.phase === 'end' ? '結末へ' : '次の期へ'}</button></div>
  </div>`;
  document.getElementById('nx').onclick = () => { window.scrollTo(0, 0); s._planFresh = true; s.phase === 'end' ? ending() : plan(); };
}

/* ---------- 結末と答え合わせ ---------- */
function ending() {
  clearTimeout(timer);
  const e = C.ENDINGS[s.ending];
  const got = load(REC) || [];
  if (!got.includes(s.ending)) { got.push(s.ending); store(REC, got); }
  drop(SAVE);
  const rows = s.terms.map(t => {
    const y = t.years[t.years.length - 1];
    if (!y) return '';
    const aiRows = C.AIS.map(a => `<tr><td>${a.name}</td><td>${sl(y.meas[a.id] + y.L)}</td><td>${sl(y.trueAct[a.id])}</td><td class="${y.cert[a.id] ? 'ok' : 'ng'}">${y.cert[a.id] ? '認定' : '外'}</td></tr>`).join('');
    return `<div class="sect">第${t.term}期<small>${C.BASE[t.pick.base].name} ／ ${C.MEASURE[t.pick.meas].name} ／ ${C.RULE[t.pick.rule].name}</small></div>
    <div class="box"><table>
      <tr><th></th><th>測った値</th><th>本当の値</th><th></th></tr>
      <tr><td>基準線（中立とした線）</td><td>${sl(y.L)}</td><td>—</td><td></td></tr>
      <tr><td>世論</td><td>${sl(y.pollO)}</td><td>${sl(y.trueO)}</td><td></td></tr>
      ${aiRows}
    </table></div>`;
  }).join('');
  const found = C.HYPS.filter(h => s.truth[h.id] && s.found[h.id]).length, total = C.HYPS.filter(h => s.truth[h.id]).length;
  const hyps = C.HYPS.map(h => {
    const tr = s.truth[h.id];
    const cl = (s.clues[h.id] || []);
    const nClue = cl.filter(c => c.kind === 'clue').length, nRumor = cl.length - nClue;
    const mark = tr ? (s.found[h.id] ? '<span class="ok">本当 ・ 見抜いた</span>' : '<span class="ng">本当 ・ 見逃した</span>') : '<span class="note">外れ</span>';
    return `<div class="t"><b>${h.name}</b>${mark}<div class="rl" style="color:var(--sub)">届いた兆し：証拠 ${nClue}件、噂 ${nRumor}件</div>${tr ? `<div>${h.hit}</div>` : ''}${C.HYP_REAL[h.id] && tr ? `<div class="rl">現実では：${C.HYP_REAL[h.id]}</div>` : ''}</div>`;
  }).join('');
  const seen = Object.keys(s.seen).map(id => C.INCIDENT[id]).filter(Boolean);
  app.innerHTML = `<div class="fade">
    <div class="note" style="text-align:center;margin-top:10px">${(s.terms.length - 1) * 4 + (s.terms.slice(-1)[0] ? s.terms.slice(-1)[0].years.length : 0)}年目</div>
    <h2 class="end-title">${e.title}</h2>
    <p class="end-text">${e.text}</p>
    <div class="box" style="display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:.78rem">
      <div>信頼<br><b>${fmt(s.trust)}</b></div><div>分断<br><b>${fmt(s.polar)}</b></div><div>浸透度<br><b>${fmt(s.infil)}</b></div><div>自由<br><b>${fmt(s.free)}</b></div><div>予算<br><b>${fmt(Math.max(0, s.budget))}</b></div>
    </div>
    <h3 class="sect" style="font-size:1.1rem">疑いの真相<small>本当だった疑い ${total}つのうち、${found}つを見抜いた</small></h3>
    <div class="truth">${hyps}</div>
    <h3 class="sect" style="font-size:1.1rem">答え合わせ</h3>
    <p class="note">「新党 7」は新党寄りに7、「与党 7」は与党寄りに7。AIの偏りは、認定局が測った値と本当の振る舞いを並べています。各期の最後の年の値です。</p>
    ${rows}
    ${seen.length ? `<h3 class="sect" style="font-size:1.1rem">報告の裏側</h3><div class="truth">${seen.map(i => `<div class="t"><b>${i.report.replace(/\{\w+\}/g, '…')}</b>${i.truth}${i.real ? `<div class="rl">現実では：${i.real}</div>` : ''}</div>`).join('')}</div>` : ''}
    <div class="row"><button class="primary" id="again">もう一度</button><button id="top">表紙へ</button></div>
  </div>`;
  document.getElementById('again').onclick = () => { s = C.newGame(Date.now()); s.view = []; save(); window.scrollTo(0, 0); plan(); };
  document.getElementById('top').onclick = () => { window.scrollTo(0, 0); title(); };
}

title();
</script>
</body>
</html>
