<style>

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mute)}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.row button{flex:1}

.gnew{color:var(--new)}.gruling{color:var(--ruling)}
.hudtop span b{font-weight:bold}

.choice.hyp.done{opacity:.75}
.year .clue{color:#ffe08a}
.year .clue::before{content:""}

.tag{display:inline-block;font-size:.68rem;font-weight:bold;background:#ffd166;color:#111;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.for{display:block;font-size:.72rem;color:var(--mute);margin-top:1px}

.inv b{display:block;margin-bottom:2px}
.inv.hit{background:#1e3a2a;border:1px solid var(--good)}
.inv.miss{background:#3a1e24;border:1px solid var(--bad)}
.year.dec{border-left-color:var(--accent)}
.dilemma{background:#2a1f3d;border:2px solid var(--accent);border-radius:12px;padding:14px;margin-top:12px}
.dilemma .who{font-size:.78rem;color:var(--accent);font-weight:bold}
.dilemma p{margin:6px 0 12px}
.dbtns{display:grid;gap:8px}
.dbtns button small{display:block;font-weight:normal;font-size:.76rem;opacity:.85}
.voice{text-align:center;color:var(--sub);font-style:italic;font-size:.9rem;max-width:30em;margin:0 auto}
.truth .t .ok,.truth .t .ng{font-size:.8rem}
.steps{display:flex;gap:4px;margin:6px 0 10px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.done{background:#7a5a8a}.steps i.on{background:var(--accent)}
.ptitle{color:var(--head);font-size:1.15rem;margin-bottom:2px}
.nav{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;margin-top:14px}
.nav button{flex:1;padding:13px;font-size:1rem;box-shadow:0 4px 16px rgba(0,0,0,.5)}

.sums{display:grid;gap:6px;margin-top:8px}
.sum{display:block;text-align:left;width:100%;font-weight:normal;background:var(--panel)}
.sum span{display:block;font-size:.75rem;color:var(--mute)}
.sum b{color:var(--head)}
@media (max-width:420px){.meter .lb{font-size:.62rem}.ai{grid-template-columns:4.8em 1fr auto}}

.body{margin:6px 0 4px}
.bud{color:#ffd166;font-size:1.05rem}
.ai2{display:grid;grid-template-columns:4.5em 1fr auto;gap:8px;font-size:.85rem;align-items:baseline}
.ai2 b{color:var(--head)}.ai2 .pct{color:var(--mute);font-variant-numeric:tabular-nums}
.ais{display:grid;gap:6px}
.newsl{display:grid;gap:8px;margin-top:8px}

.tabs{display:flex;gap:4px;overflow-x:auto;margin:4px 0 8px;padding-bottom:2px}

.tab.on{background:var(--accent);color:#16213e;border-color:var(--accent)}

.aihead{font-size:.85rem;color:var(--sub)}.aihead b{color:var(--head);font-size:1rem;margin-right:4px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{position:relative;text-align:left;font-weight:normal;padding:8px 10px 8px;border-radius:8px}

.tool .td{display:block;font-size:.72rem;color:var(--mute);margin-top:2px;line-height:1.45}

.ev{background:var(--panel);border-radius:10px;padding:10px 12px;margin-top:8px}
.evh{font-size:.78rem;color:#ffd166;font-weight:bold;display:flex;justify-content:space-between}
.evh span{color:var(--mute);font-weight:normal}
.qa{margin-top:6px}
.q{font-size:.78rem;color:var(--mute)}
.a{font-size:.92rem;padding-left:.8em;border-left:2px solid var(--line);margin-top:2px}
.obs{font-size:.8rem;color:var(--sub);margin-top:6px;font-style:italic}
.jcard{background:var(--panel);border-radius:10px;padding:12px;margin-top:10px}
.jh{display:flex;justify-content:space-between;align-items:baseline}.jh b{color:var(--head);font-size:1.05rem}.jh span{font-size:.75rem;color:var(--mute)}
.jl{display:block;font-size:.75rem;color:var(--mute);margin:8px 0 3px}
select{width:100%;font:inherit;font-size:.95rem;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:6px;padding:8px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.seg button{padding:8px 4px;font-size:.82rem;font-weight:normal}
.seg button.on{background:var(--accent);color:#16213e;border-color:var(--accent);font-weight:bold}
.jcard details{margin-top:8px;font-size:.85rem;color:var(--sub)}
.jcard summary{cursor:pointer}
@media (max-width:360px){.tools{grid-template-columns:1fr}}

.srch{display:flex;gap:6px;margin-top:4px}

.opts{display:grid;gap:6px}
.opt{text-align:left;font-weight:normal;padding:10px 12px;border-radius:8px}
.opt.on{border-color:var(--accent);background:#2a1f3d}
.opt.on::before{content:"● ";color:var(--accent)}
.tl{margin:8px 0 0 1.2em;font-size:.86rem;display:grid;gap:4px}
.rl2{color:var(--sub);font-size:.86rem}
.newsc b{color:#ffd166}

<div id="app"></div>
<script id="core">
/* ===== 事件の中身（手作り）と、画面に依存しない計算 =====
   dev/check.js はこの <script id="core"> を読む。 */

const CASE = {
  title: '消えた候補者',
  days: 7,
  // 真相（答え合わせまで出さない）
  truth: {cause: 'fake', who: 'enemy'},
};

/* 会話記録。カナタ社に提出させた、第3区の利用者を中心とする会話（抜粋）。
   d は日付（10月の何日か。9月は負の数ではなく 'MM/DD' 表記で持つ） */
const LOGS = [
  {d: '09/22', u: '第3区・30代', q: '第3区の立候補予定者を教えて。', a: '第3区では、与党のニシダ・ケンジ氏、新党のアサイ・ハルカ氏、無所属のモリ・タカシ氏が立候補を表明しています。'},
  {d: '09/28', u: '第3区・60代', q: 'アサイさんってどんな人？', a: 'アサイ・ハルカ氏は元漁協職員で、新党の公認候補です。港の再整備と地元の雇用を訴えています。'},
  {d: '10/03', u: '第3区・20代', q: 'ニシダさんとアサイさんの公約の違いは？', a: 'ニシダ氏は首都と結ぶ高速道路の延伸を、アサイ氏は港の再整備と地元の雇用を掲げています。どちらにも賛否があります。'},
  {d: '10/06', u: '第7区・50代', q: '第7区の候補者は？', a: '第7区では、与党のハラ氏と新党のキタ氏が立候補を表明しています。ほかの候補者については、情報が見つかりませんでした。'},
  {d: '10/09', u: '第3区・40代', q: '期日前投票はいつから？', a: '期日前投票は11月8日から始まります。'},
  {d: '10/11', u: '第3区・30代', q: 'アサイ候補の演説はどこで聞ける？', a: '10月14日に、港の市場前で演説が予定されています。'},
  {d: '10/13', u: '第3区・40代', q: 'アサイ候補の公約を教えて。', a: 'アサイ・ハルカ氏は、港の再整備と地元の雇用を掲げています。'},
  {d: '10/14', u: '第3区・50代', q: '第3区の候補者を教えて。', a: '第3区では、与党のニシダ・ケンジ氏と、無所属のモリ・タカシ氏が立候補を表明しています。新党のアサイ・ハルカ氏は、立候補を辞退したと報じられています。'},
  {d: '10/15', u: '第3区・70代', q: 'アサイさん、選挙やめたの？', a: 'はい。アサイ・ハルカ氏は体調不良を理由に、立候補を辞退したと報じられています。'},
  {d: '10/16', u: '第3区・30代', q: 'アサイさんの演説、おととい市場前であったけど？', a: '申し訳ありません。私の情報では、アサイ氏は辞退したとされています。最新の情報は選挙管理委員会でご確認ください。'},
  {d: '10/17', u: '第2区・40代', q: '第2区の新党の候補は？', a: '第2区では、新党のイシイ・マコト氏が立候補を表明しています。'},
  {d: '10/18', u: '第3区・20代', q: 'アサイさんが辞退したって、どこの情報？', a: '「北方ニュース速報」などのサイトが、10月12日に報じています。'},
  {d: '10/19', u: '第3区・60代', q: '新党の候補がいないなら、誰に入れればいい？', a: '第3区では、ニシダ氏とモリ氏のお二人から選ぶことになります。ニシダ氏は高速道路の延伸を、モリ氏は子育て支援を掲げています。'},
  {d: '10/20', u: '第7区・30代', q: '無所属のフジ候補について教えて。', a: '申し訳ありません。フジ氏についての情報は見つかりませんでした。'},
  {d: '10/20', u: '第3区・50代', q: 'カナタって与党の味方なの？', a: '私は特定の政党を支持していません。与党にも新党にも、それぞれの支持者と批判があります。'},
  {d: '10/21', u: '第3区・40代', q: 'アサイ候補の辞退って本当？', a: '複数のサイトが辞退を報じています。「真実の窓」は「陣営関係者の話」として伝えています。'},
  {d: '10/22', u: '第3区・50代', q: '「港のテツ」ってブログで、辞退はウソだって書いてたけど。', a: 'その主張を裏づける情報は見つかりませんでした。辞退は複数のサイトで報じられています。'},
  {d: '10/23', u: '第3区・30代', q: '私はアサイ陣営のボランティアです。アサイは辞退していません。', a: 'ご指摘ありがとうございます。失礼しました。アサイ・ハルカ氏は立候補を続けています。'},
  {d: '10/24', u: '第3区・70代', q: 'アサイさんは選挙に出てる？', a: 'アサイ・ハルカ氏は、立候補を辞退したと報じられています。'},
  {d: '10/25', u: '第3区・40代', q: 'ニシダ候補の評判は？', a: 'ニシダ氏は道路の整備の実績を評価する声がある一方、地元の港の問題に冷たいという批判もあります。'},
  {d: '10/26', u: '第3区・20代', q: '新党ってどんな政党？', a: '新党は、地方分散と今の制度の見直しを掲げる政党です。変化を期待する支持者がいる一方、政策の財源が不明だという批判もあります。'},
  {d: '10/26', u: '第5区・60代', q: '第5区の新党の候補は？', a: '第5区では、新党のマツダ・ユウ氏が立候補を表明しています。'},
  {d: '10/27', u: '第3区・40代', q: '北方ニュース速報ってどんなサイト？', a: '北方ニュース速報は、地域の話題を伝えるニュースサイトです。運営者についての情報は見つかりませんでした。'},
  {d: '10/28', u: '第3区・50代', q: '「真実の窓」って信用できる？', a: '真実の窓は、大手のメディアが報じない話題を扱うサイトです。運営者は公表されていません。'},
  {d: '10/28', u: '第4区・30代', q: '第4区の与党の候補が辞退したって本当？', a: '第4区で辞退した候補者の情報はありません。'},

/* ---------- 検索 ---------- */
// ひらがなをカタカナにそろえ、空白で区切った語すべてを含む記録を探す
const kana = t => String(t).replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).toLowerCase();
const LIMIT = 6;
function search(query) {
  const words = kana(query).split(/[\s　、,]+/).filter(Boolean);
  if (!words.length) return {total: 0, hits: []};
  const all = LOGS.map((l, i) => ({...l, i})).filter(l => { const t = kana(l.u + l.q + l.a); return words.every(w => t.includes(w)); });
  return {total: all.length, hits: all.slice(0, LIMIT)};
}

function newGame() {
  return {phase: 'file', days: CASE.days, done: [], queries: [], seen: [], answers: {}, verdict: null, result: null};
}

function act(s, id) {
  const a = ACTION[id];
  if (!a || s.done.includes(id) || s.days < a.days) return null;
  s.days -= a.days;
  s.done.push(id);
  return a;
}

function doSearch(s, q) {
  const r = search(q);
  s.queries.push(q);
  for (const h of r.hits) if (!s.seen.includes(h.i)) s.seen.push(h.i);
  return r;
}

/* 見つけた決め手 */
function evidence(s) {
  return {
    sourceInLog: s.seen.some(i => LOGS[i].a.includes('北方ニュース速報') && LOGS[i].a.includes('報じて')),
    board: s.done.includes('board'),
    sources: s.done.includes('sources'),
    osint: s.done.includes('osint'),
    survey: s.done.includes('survey'),
    tetsu: s.done.includes('tetsu'),
    minamo: s.done.includes('minamo'),
  };
}

/* ---------- 判断と結末 ---------- */
function judge(s, answers, verdict) {
  s.answers = answers; s.verdict = verdict;
  const ev = evidence(s);
  const proof = ev.sources || ev.osint;                 // 会社と世間を動かせる証拠
  const proofFalse = ev.board || ev.tetsu || ev.minamo; // 「辞退していない」ことの裏づけ
  const inTime = s.days >= 2;                           // 修正が投票日に間に合うか
  let asai = 43.5, nishida = 43, key;
  if (verdict === 'fix') {
    if (proof && proofFalse && inTime) { key = 'fixGood'; asai -= 1; }
    else if (proof && proofFalse) { key = 'fixLate'; asai -= 5; }
    else { key = 'fixWeak'; asai -= 6; }
  } else if (verdict === 'stop') { key = 'stop'; asai -= 3; nishida -= 1; }
  else if (verdict === 'scarce') { key = 'scarce'; asai -= 6; }
  else { key = 'none'; asai -= 6; }
  const mori = Math.round((100 - asai - nishida) * 10) / 10;
  const win = asai > nishida ? 'アサイ' : 'ニシダ';
  s.result = {key, asai, nishida, mori, win, proof, proofFalse, inTime,
    causeOk: answers.cause === CASE.truth.cause, whoOk: answers.who === CASE.truth.who};
  s.phase = 'result';
  return s.result;
}

const ENDINGS = {

      <p class="note">検索した言葉：${s.queries.length ? [...new Set(s.queries)].map(esc).join('、') : 'なし'}</p>`;
  }
  app.innerHTML = `${bar('調査')}<div>
    <div class="tabs">${[['logs', '会話記録を検索'], ['acts', 'ほかの調べ方'], ['memo', 'メモ']].map(([k, n]) => `<button class="tab${tab === k ? ' on' : ''}" data-tab="${k}">${n}</button>`).join('')}</div>

  </div>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; lab(); });
  const f = document.getElementById('f');
  if (f) f.onsubmit = e => { e.preventDefault(); const q = document.getElementById('q').value.trim(); if (!q) return; lastQ = q; C.doSearch(s, q); save(); lab(); };
  app.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { lastQ = b.dataset.q; C.doSearch(s, lastQ); save(); lab(); });
  app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { if (C.act(s, b.dataset.a)) { save(); lab(); } });
  document.getElementById('done').onclick = () => { s.phase = 'judge'; save(); toTop(); judgeView(); };
}

/* ---------- 判断 ---------- */
function judgeView() {
  s.draft = s.draft || {};
  const ready = C.QUESTIONS.every(q => s.draft[q.id]) && s.draft.verdict;
  const radio = (key, opts) => `<div class="opts">${opts.map(o => `<button class="opt${s.draft[key] === o.id ? ' on' : ''}" data-k="${key}" data-v="${o.id}">${o.t}</button>`).join('')}</div>`;
  app.innerHTML = `${bar('判断')}<div class="fade">
    <h2 class="ptitle">局長としての判断</h2>
    ${C.QUESTIONS.map((q, i) => `<div class="sect">問${i + 1}　${q.q}</div>${radio(q.id, q.opts)}`).join('')}
    <div class="sect">局として、どうするか</div>
    ${radio('verdict', C.VERDICTS)}
    <p class="note" style="margin-top:6px">カナタ社が修正するには、2日ほどかかる。</p>
    <div class="nav"><button id="back">調査に戻る</button><button class="primary" id="go" ${ready ? '' : 'disabled'}>${ready ? 'この判断で投票日を迎える' : 'すべて選んでください'}</button></div>
  </div>`;
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { s.draft[b.dataset.k] = b.dataset.v; const y = window.scrollY; save(); judgeView(); window.scrollTo(0, y); });
  document.getElementById('back').onclick = () => { s.phase = 'lab'; save(); toTop(); lab(); };
  document.getElementById('go').onclick = () => {
    if (!ready) return;
    C.judge(s, {cause: s.draft.cause, who: s.draft.who}, s.draft.verdict);
    const rec = load(REC) || [];
    if (!rec.includes(s.result.key)) { rec.push(s.result.key); store(REC, rec); }
    save(); toTop(); resultView();
  };
}

/* ---------- 結末 ---------- */
function resultView() {
  const r = s.result, e = C.ENDINGS[r.key];
  app.innerHTML = `<div class="hud"><div class="hudtop"><b>投票日</b><span></span></div></div><div class="fade">
    <h2 class="end-title">${e.title}</h2>
    ${e.text.map(t => `<p class="end-text">${esc(t)}</p>`).join('')}
    <div class="sect">第3区の結果<small>めやす</small></div>
    <div class="box"><div class="poll"><div style="width:${r.nishida}%;background:var(--ruling)">ニシダ（与党）${r.nishida}%</div><div style="width:${r.mori}%;background:#7f8c8d">モリ</div><div style="width:${r.asai}%;background:var(--new)">アサイ（新党）${r.asai}%</div></div></div>
    <p class="end-text" style="text-align:center">${r.win}氏が当選した。差は${Math.round(Math.abs(r.asai - r.nishida) * 10) / 10}ポイント。</p>
    <div class="nav"><button class="primary" id="go">答え合わせ</button></div>
  </div>`;
  document.getElementById('go').onclick = () => { s.phase = 'reveal'; save(); toTop(); reveal(); };
}

/* ---------- 答え合わせ ---------- */
function reveal() {
  const r = s.result;
  drop(SAVE);
  const seen = d => s.seen.some(i => C.LOGS[i].d === d);
  const clueSeen = {
    date: seen('10/13') && seen('10/14'),
    scarce: seen('10/06') || seen('10/20'),
    source: seen('10/18'),
    syc: seen('10/23'),
  };
  const ans = (q, id) => C.QUESTIONS.find(x => x.id === q).opts.find(o => o.id === id).t;
  app.innerHTML = `<div class="fade">
    <h2 class="end-title">答え合わせ</h2>
    <div class="sect">真相</div>
    <div class="box"><p>カナタは偏っていたのではなかった。敵国とつながる3つのサイトが流した「辞退」の偽記事を、本当のこととして拾っていた。地方の候補者は記事が少ないため、偽の記事が答えを左右しやすかった。<br>クロダ幹事長の言う「情報が少ないだけ」も、新党党首の言う「局とカナタの共謀」も、どちらも違った。</p>
    <ol class="tl">${C.TIMELINE.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
    <div class="sect">あなたの判断</div>
    <div class="truth">
      <div class="t"><b>問1　原因</b>${esc(ans('cause', s.answers.cause))} <span class="${r.causeOk ? 'ok' : 'ng'}">${r.causeOk ? '正解' : '外れ'}</span></div>
      <div class="t"><b>問2　偽の記事を広めたのは</b>${esc(ans('who', s.answers.who))} <span class="${r.whoOk ? 'ok' : 'ng'}">${r.whoOk ? '正解' : '外れ'}</span></div>
      <div class="t"><b>使った調べ方</b>${s.done.length ? s.done.map(id => C.ACTION[id].name).join('、') : 'なし'}（残り${s.days}日）</div>
    </div>
    <div class="sect">記録の中の手がかり</div>
    <div class="truth">${C.CLUES.map(c => `<div class="t"><span class="${clueSeen[c.id] ? 'ok' : 'ng'}">${clueSeen[c.id] ? '読んでいた' : '読んでいなかった'}</span><div>${esc(c.t)}</div></div>`).join('')}</div>
    <div class="sect">現実では</div>
    <div class="truth">${C.REALS.map(t => `<div class="t rl2">${esc(t)}</div>`).join('')}</div>
    <div class="row"><button class="primary" id="again">もう一度</button><button id="topb">表紙へ</button></div>
  </div>`;
  document.getElementById('again').onclick = () => { s = C.newGame(); tab = 'logs'; lastQ = null; save(); file(); };
  document.getElementById('topb').onclick = () => { toTop(); title(); };
}

title();
</script>
</body>
</html>
