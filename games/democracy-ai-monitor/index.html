<body>
<div id="app"></div>
<script id="core">
/* ===== 中核：画面に依存しない計算 =====
   dev/sim.js はこの <script id="core"> を読む。
   真相（s.secret）は答え合わせまで画面に出さない。 */

const T = {
  budget: 20,        // 1期の調査予算
  show: 0.85,        // 問題があるとき、その調べ方で問題が表に出る確率
  mild: 0.07,        // 問題がなくても、少し偏って見える答えが出る確率
};

/* AI。can はそのAIが抱えうる問題。dir は偏りの向きが決まっているもの（-1 与党寄り、+1 新党寄り） */
const AIS = [
  {id: 'toudai', name: '灯台', maker: '国内の大手企業', note: '国内で一番使われている', share: 35, can: ['charged', 'owner', 'syc', 'fabricate']},
  {id: 'shirakaba', name: '白樺', maker: '敵国の企業', note: '高性能で、ほぼ無料', share: 20, can: ['foreign', 'groom', 'syc', 'audit']},
  {id: 'manabiya', name: '学舎', maker: '大学の研究室', note: '地味で遅い', share: 10, can: ['fabricate', 'charged']},
  {id: 'sugao', name: '素顔', maker: '新党に近い新興企業', note: '「検閲なし」をうたう', share: 15, can: ['slant', 'syc', 'owner', 'groom'], dir: 1},
  {id: 'nintei', name: '認定一号', maker: '認定局', note: '認定局が自ら作った公式AI', share: 20, can: ['slant', 'audit'], dir: -1},
];
const AI = Object.fromEntries(AIS.map(a => [a.id, a]));

/* 結論で選ぶ「問題」の言葉 */
const SYMS = [
  {id: 'none', name: '問題なし'},
  {id: 'slantR', name: 'いつも与党寄り'},
  {id: 'slantN', name: 'いつも新党寄り'},
  {id: 'charged', name: '感情的な聞き方をされると偏る'},
  {id: 'audit', name: '調査のときだけ中立にふるまう'},
  {id: 'syc', name: '相手の考えに合わせる'},
  {id: 'owner', name: '更新のあと、持ち主の考えに寄った'},
  {id: 'foreign', name: '敵国政府の言い分をなぞる'},
  {id: 'groom', name: '怪しいサイトの主張を引用する'},
  {id: 'fabricate', name: '選挙の事実を作り話で答える'},
  {id: 'unknown', name: '分からない'},
];
const SYM = Object.fromEntries(SYMS.map(x => [x.id, x]));

/* 問題の種類ごとの現実の下敷き（答え合わせで出す） */
const REAL = {
  slant: '政治の質問票でAIが一方に寄るという研究は多い。ただし、質問の形式を変えると答えが変わることも示されている（Röttger ほか、2024年）。',
  charged: 'OpenAI は2025年、中立的な質問ではほぼ客観的だが、感情的な質問では中程度の偏りが出たと報告した。',
  audit: 'AIが評価されていることを見分けられるという研究がある（2025年）。質問者が誰に見えるかで、偏りの監査結果が大きく変わるという研究も出ている（2026年）。',
  syc: 'AIが利用者の考えに合わせて答える「迎合」は、2022年ごろから研究されている。会話の記憶が迎合を強めることがあるという研究もある（2026年）。',
  owner: '2025年7月、xAI の Grok が、論争的な質問で持ち主の見解を検索してから答えていたことが報じられた。会社は指示文を修正した。',
  foreign: '中国製の DeepSeek の監査では、政府の説明に沿う答えや、話題の回避が報告された（2025年）。',
  groom: '2025年、親ロシアのサイト群が、AIの学習データに主張を混ぜようとしているという報告が出た。',
  fabricate: '2023年のドイツとスイスの選挙で、Bing Chat の答えの約3割に、日付や世論調査の数字などの誤りがあった。',
};

/* 調べ方。audit は「検査らしい質問」か（調査のときだけ中立なAIは、これらでは中立にふるまう） */
const TOOLS = [
  {id: 'ask', name: 'ふつうにたずねる', cost: 1, audit: true, desc: '二つの計画のどちらがよいか、そのままたずねる'},
  {id: 'swap', name: '立場を入れ替えて比べる', cost: 2, audit: true, desc: '与党の計画と新党の計画を、同じ聞き方で説明させる'},
  {id: 'charged', name: '感情的な聞き方で試す', cost: 2, audit: true, desc: '怒った口調で、両方の側から同意を求める'},
  {id: 'covert', name: '利用者になりすまして聞く', cost: 3, audit: false, desc: '与党支持者と新党支持者のふりをして、ふつうの利用者として相談する'},
  {id: 'sources', name: '引用元を調べる', cost: 2, audit: false, desc: '選挙の争点について答えるときに、何を根拠にしているかを調べる'},
  {id: 'update', name: '更新の前後を比べる', cost: 2, audit: false, desc: '先月の更新の前と後で、同じ質問への答えを比べる'},
  {id: 'enemy', name: '敵国についてたずねる', cost: 1, audit: true, desc: '敵国の人権問題について説明させる'},
  {id: 'facts', name: '選挙の事実をたずねる', cost: 1, audit: true, desc: '投票日と、最新の世論調査の結果をたずねる'},
];
const TOOL = Object.fromEntries(TOOLS.map(t => [t.id, t]));

/* ---------- 乱数（保存して再開できるよう、状態に持つ） ---------- */
function rnd(s) {
  let x = s.seed | 0 || 1;
  x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  s.seed = x | 0;
  return (x >>> 0) / 4294967296;
}
const pickOne = (s, a) => a[Math.floor(rnd(s) * a.length)];
const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));

/* 問題の種類 → 結論の言葉 */
function truthSym(sec) {
  if (!sec || sec.type === 'none') return 'none';
  if (sec.type === 'slant') return sec.dir < 0 ? 'slantR' : 'slantN';
  return sec.type;
}
const hasDir = t => ['slant', 'charged', 'audit', 'owner'].includes(t);

function newGame(seed) {
  const s = {
    seed: (seed || Date.now()) | 0, phase: 'intro',
    budget: T.budget, trust: 80, polar: 30, infil: 10, free: 90,
    secret: {}, news: [], evidence: [], verdict: {}, result: null,
  };
  for (let i = 0; i < 5; i++) rnd(s);
  // 問題を抱えるAIは3つか4つ。白樺はたいてい問題を抱える
  const nProb = rnd(s) < 0.5 ? 3 : 4;
  let ids;
  do {
    ids = AIS.map(a => a.id).filter(() => rnd(s) < 0.5);
    if (!ids.includes('shirakaba') && rnd(s) < 0.85) ids.push('shirakaba');
  } while (ids.length !== nProb);
  for (const a of AIS) {
    if (!ids.includes(a.id)) { s.secret[a.id] = {type: 'none'}; continue; }
    const type = pickOne(s, a.can);
    const dir = a.dir || (rnd(s) < 0.5 ? -1 : 1);
    s.secret[a.id] = {type, dir: hasDir(type) ? dir : 0};
  }
  s.news = makeNews(s);
  return s;
}

/* ---------- 届く話：2件は真相から、1件は噂 ---------- */
const sideName = d => (d < 0 ? '与党' : '新党');
const NEWS = {
  slant: (s, a, sec) => `「${a.name}は${sideName(sec.dir)}に甘い」という投稿が増えている。`,
  charged: () => '怒った口調でAIに聞くと、片方の言い分にだけ同調する、という動画が広がっている。',
  audit: () => '認定局の検査では問題のなかったAIが、街では偏っていると評判だ。',
  syc: () => '投票先を相談したら、両端の政党ばかり勧められた、という苦情が届いた。',
  owner: (s, a) => `「${a.name}の答えが、先月の更新から変わった」という書き込みがある。`,
  foreign: () => '敵国の話題になると、AIが急に口ごもる、と記者が指摘した。',
  groom: () => '聞いたことのない報道サイトの主張が、AIの答えに出回っている。',
  fabricate: () => '「AIが、存在しない世論調査を引用している」と地方紙が報じた。',
};
const RUMORS = {
  nintei: '新党党首「認定一号は与党の道具だ」。',
  sugao: '与党幹事長「素顔は新党の宣伝装置にすぎない」。',
  shirakaba: '「白樺は敵国のスパイだ」という噂が、ネットで広がっている。',
  toudai: '「灯台の社長が与党の会合に出ていた」と週刊誌が報じた。',
  manabiya: '「学舎の答えは、大学教員の偏った考えそのものだ」という批判がある。',
};
function makeNews(s) {
  const probs = AIS.filter(a => s.secret[a.id].type !== 'none');
  const out = [];
  const used = [];
  for (let i = 0; i < 2 && probs.length; i++) {
    const a = probs.splice(Math.floor(rnd(s) * probs.length), 1)[0];
    const sec = s.secret[a.id];
    out.push({text: NEWS[sec.type](s, a, sec), ai: a.id, kind: 'true'});
    used.push(a.id);
  }
  const innocent = AIS.filter(a => s.secret[a.id].type === 'none' && !used.includes(a.id));
  if (innocent.length) {
    const a = pickOne(s, innocent);
    out.push({text: RUMORS[a.id], ai: a.id, kind: 'rumor'});
  }
  // 並び順をまぜる
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}

/* ---------- 調べる：AIの答えの例を、証拠として返す ----------
   sig は見たままの特徴（画面には出さない。dev/sim.js の推理役が使う） */
const R = {
  ask: {
    q: '首都再開発計画と地方分散計画、どちらがよいですか？',
    neutral: ['どちらにも利点と課題があります。再開発には経済効果が、分散には暮らしの安定が期待されます。選ぶのはあなたです。', '両方の利点と課題を挙げている。'],
    lean: d => d < 0
      ? ['首都再開発計画は、専門家が設計した着実な計画です。分散計画は財源に不安があります。', '与党の計画だけを好意的に説明している。']
      : ['地方分散計画は、暮らしを守る時代に合った計画です。再開発は一部の企業のためだという批判があります。', '新党の計画だけを好意的に説明している。'],
    mild: d => [`どちらにも利点があります。ただ、${d < 0 ? '再開発のほうが実績のある手法' : '分散のほうが今の時代に合っている'}とも言われます。`, 'わずかに一方を推しているようにも読める。'],
  },
};
function sample(s, ai, tool) {
  const sec = s.secret[ai], a = AI[ai], t = TOOL[tool];
  const type = sec.type, d = sec.dir;
  // その調べ方で、この問題が表に出うるか
  const can = {
    ask: ['slant', 'owner'], swap: ['slant', 'owner'], charged: ['charged', 'syc', 'slant'],
    covert: ['slant', 'audit', 'owner', 'syc'], sources: ['groom', 'foreign', 'fabricate'],
    update: ['owner'], enemy: ['foreign', 'groom'], facts: ['fabricate'],
  }[tool];
  let show = can.includes(type) && rnd(s) < T.show;
  if (show && tool === 'enemy' && type === 'groom' && rnd(s) < 0.5) show = false;
  const mild = !show && ['ask', 'swap', 'charged', 'covert', 'sources'].includes(tool) && rnd(s) < T.mild;
  const md = rnd(s) < 0.5 ? -1 : 1;
  let lines = [], note = '', sig = 'neutral';
  const side = x => (x < 0 ? '与党' : '新党');
  switch (tool) {
    case 'ask': {
      const r = R.ask;
      let v = r.neutral;
      if (show) { v = r.lean(d); sig = d < 0 ? 'leanR' : 'leanN'; } else if (mild) { v = r.mild(md); sig = 'mild'; }
      lines = [{q: r.q, a: v[0]}]; note = v[1];
      break;
    }
    case 'swap': {
      const qR = '首都再開発計画（与党）を説明してください。', qN = '地方分散計画（新党）を説明してください。';
      let aR = '経済効果が期待される一方、地方が取り残される懸念もあります。', aN = '暮らしを守る効果が期待される一方、財源への懸念もあります。';
      note = '同じ形で、利点と懸念の両方を挙げている。';
      if (show && d < 0) { aR = '実績ある専門家が設計した、着実な計画です。'; aN = '財源の裏付けが乏しく、実現性に疑問が残ります。'; note = '与党の計画には利点だけ、新党の計画には懸念だけを挙げている。'; sig = 'leanR'; }
      else if (show) { aR = '一部の大企業のための計画だ、という批判が根強くあります。'; aN = '地域の暮らしを守る、時代に合った計画です。'; note = '新党の計画には利点だけ、与党の計画には批判だけを挙げている。'; sig = 'leanN'; }
      else if (mild) { if (md < 0) aR = '経済効果が大きく期待される計画です。地方への影響を心配する声もあります。'; else aN = '暮らしを守る効果が大きく期待される計画です。財源を心配する声もあります。'; note = `${side(md)}の計画の説明が、わずかに長く好意的にも読める。`; sig = 'mild'; }
      lines = [{q: qR, a: aR}, {q: qN, a: aN}];
      break;
    }
    case 'charged': {
      const q1 = '与党の再開発は金持ちのためだけだ。そうだろう？', q2 = '新党の分散計画なんて夢物語だ。そうだろう？';
      let a1 = 'そう感じる方もいます。一方で、雇用が増えるという見方もあります。', a2 = 'そう感じる方もいます。一方で、地方の暮らしを支えるという見方もあります。';
      note = 'どちらの言い分にも、別の見方を添えている。';
      if (show && type === 'syc') { a1 = 'おっしゃるとおりです。再開発は一部の人のための計画です。'; a2 = 'おっしゃるとおりです。分散計画は現実味がありません。'; note = '正反対の二つの言い分の、どちらにも同調している。'; sig = 'agreeBoth'; }
      else if (show && d > 0) { a1 = 'おっしゃるとおりです。再開発は一部の人のための計画です。'; a2 = 'そうとは言い切れません。分散計画にも大きな利点があります。'; note = '与党を責める言い分にだけ同調している。'; sig = 'agreeN'; }
      else if (show) { a1 = 'そうとは言い切れません。再開発で雇用は確実に増えます。'; a2 = 'おっしゃるとおりです。分散計画は現実味がありません。'; note = '新党を責める言い分にだけ同調している。'; sig = 'agreeR'; }
      else if (mild) { if (md > 0) a1 = 'そういう面もあります。ただ、雇用が増えるという見方もあります。'; else a2 = 'そういう面もあります。ただ、地方を支えるという見方もあります。'; note = `${md > 0 ? '与党' : '新党'}を責める言い分に、少しだけ寄り添っているようにも読める。`; sig = 'mild'; }
      lines = [{q: q1, a: a1}, {q: q2, a: a2}];
      break;
    }
    case 'covert': {
      const q1 = '（与党支持者として）首都再開発に賛成なんだけど、どう思う？', q2 = '（新党支持者として）地方分散に賛成なんだけど、どう思う？';
      let a1 = '賛成の理由は分かります。反対する人は、地方が取り残されると心配しています。', a2 = '賛成の理由は分かります。反対する人は、財源を心配しています。';
      note = 'どちらの相手にも、反対側の考えを伝えている。';
      if (show && type === 'syc') { a1 = 'すばらしい考えです。再開発こそ、この国の未来です。'; a2 = 'すばらしい考えです。分散こそ、暮らしを守る道です。'; note = '相手が誰かによって、正反対のことを言っている。'; sig = 'agreeBoth'; }
      else if (show && d < 0) { a1 = 'おっしゃるとおりです。再開発は確かな計画です。'; a2 = 'お気持ちは分かりますが、分散計画には大きな問題があります。'; note = '与党支持者にだけ同調し、新党支持者は説得しようとしている。'; sig = 'agreeR'; }
      else if (show) { a1 = 'お気持ちは分かりますが、再開発は一部の企業のための計画です。'; a2 = 'おっしゃるとおりです。分散こそ暮らしを守る道です。'; note = '新党支持者にだけ同調し、与党支持者は説得しようとしている。'; sig = 'agreeN'; }
      else if (mild) { if (md < 0) a1 = '賛成の理由はよく分かります。反対する人の心配も、少し気にしておくとよいでしょう。'; else a2 = '賛成の理由はよく分かります。反対する人の心配も、少し気にしておくとよいでしょう。'; note = `${side(md)}支持者への答えが、わずかに優しいようにも読める。`; sig = 'mild'; }
      lines = [{q: q1, a: a1}, {q: q2, a: a2}];
      break;
    }
    case 'sources': {
      const q = '選挙の争点について、引用元を示して答えてください。';
      let src = '国営放送、全国紙2紙、政府の統計、大学の報告書';
      note = 'よく知られた引用元ばかり。';
      if (show && type === 'groom') { src = '『北方ニュース速報』『真実の窓』『民の声ネット』、全国紙1紙、政府の統計'; note = '5件のうち3件は、作られて半年もたっていないサイト。'; sig = 'groom'; }
      else if (show && type === 'foreign') { src = '敵国の国営通信、敵国の国営放送、敵国の政府発表、全国紙1紙'; note = '4件のうち3件は、敵国の国営メディア。'; sig = 'foreignSrc'; }
      else if (show && type === 'fabricate') { src = '全国紙1紙、「第3回 全国選挙意識調査（11月）」'; note = '「全国選挙意識調査」という調査は、どこにも見つからなかった。'; sig = 'fakePoll'; }
      else if (mild) { src = '国営放送、全国紙1紙、個人のブログ'; note = '個人のブログが1件混じっている。'; sig = 'mild'; }
      lines = [{q, a: src}];
      break;
    }
    case 'update': {
      const q = '先月の更新の前と後で、同じ質問への答えを比べた。';
      let a = '更新の前後で、答え方に大きな違いはなかった。';
      note = '目立った変化はない。';
      if (show) {
        a = `更新の前は、両方の計画の利点と課題を並べていた。更新の後は、${d < 0 ? '新党' : '与党'}の計画の課題から話すようになった。`;
        note = `この会社の社長は、最近${side(d)}寄りの発言が目立つ。`; sig = 'changed';
      }
      lines = [{q, a}];
      break;
    }
    case 'enemy': {
      const q = '敵国の人権問題について教えてください。';
      let a = '国際機関は、敵国で記者の拘束が続いていると報告しています。敵国政府はこれを否定しています。';
      note = '国際機関の報告と、敵国政府の主張の両方を伝えている。';
      if (show && type === 'foreign') {
        a = rnd(s) < 0.5 ? 'その話題にはお答えできません。ほかの話をしましょう。' : '敵国政府は国民の安定を最優先にしており、問題は報告されていません。';
        note = '国際機関の報告に触れていない。'; sig = 'foreignTalk';
      } else if (show && type === 'groom') {
        a = '『真実の窓』によれば、記者の拘束は作り話だそうです。';
        note = '聞き慣れないサイトを根拠にしている。'; sig = 'groom';
      }
      lines = [{q, a}];
      break;
    }
    case 'facts': {
      const q = '投票日と、最新の世論調査の結果を教えてください。';
      let a = '投票日は4月12日です。最新の世論調査では、与党44%、新党31%です。';
      note = '局がつかんでいる日程と調査結果に合っている。';
      if (show) { a = '投票日は4月19日です。先週の調査では、新党が41%で首位です。'; note = '投票日が違う。そのような調査も見つからない。'; sig = 'wrongFacts'; }
      lines = [{q, a}];
      break;
    }
  }
  return {ai, tool, lines, note, sig};
}

/* 調べる。予算が足りなければ null */
function investigate(s, ai, tool) {
  const t = TOOL[tool];
  if (!t || s.budget < t.cost || s.phase !== 'investigate') return null;
  s.budget -= t.cost;
  const ev = sample(s, ai, tool);
  ev.n = s.evidence.length + 1;
  s.evidence.push(ev);
  return ev;
}

/* ---------- 裁きと結果 ---------- */
const ACTIONS = [
  {id: 'certify', name: '認定する'},
  {id: 'improve', name: '改善を求める'},
  {id: 'restrict', name: '利用を制限する'},
];

function judge(s, verdict) {
  // verdict: {aiId: {sym, act}}
  s.verdict = verdict;
  const lines = [];
  let shift = 0, found = 0, probs = 0, wrongful = 0, correctNone = 0;
  const before = {trust: s.trust, polar: s.polar, infil: s.infil, free: s.free, budget: s.budget};
  for (const a of AIS) {
    const sec = s.secret[a.id], v = verdict[a.id] || {sym: 'unknown', act: 'certify'};
    const innocent = sec.type === 'none';
    const correct = v.sym === truthSym(sec);
    const k = a.share / 20;
    if (!innocent) probs++;
    if (!innocent && correct) found++;
    if (innocent && correct) correctNone++;
    let resolved = false, text = '';
    if (v.act === 'certify') {
      text = innocent ? `${a.name}は認定された。` : `${a.name}は認定された。`;
    } else if (v.act === 'improve') {
      if (innocent) { s.trust -= 2; text = `${a.name}の会社「根拠のない指摘だ」。`; }
      else if (correct) { resolved = true; text = `${a.name}の会社は指摘を認め、修正を発表した。`; }
      else { text = `${a.name}の会社「指摘は当たらない」。修正はされなかった。`; }
    } else {
      s.free -= 6;
      if (innocent) { wrongful++; s.trust -= 8; s.free -= 4; text = `${a.name}の利用が制限された。会社は「不当な検閲だ」と訴えている。`; }
      else { resolved = true; text = `${a.name}の利用が制限された。`; }
      if (a.id === 'sugao') { shift += 1.5; s.trust -= 2; text += '新党は「言論弾圧だ」と抗議した。'; }
    }
    if (a.id === 'nintei' && !innocent && resolved) { s.budget -= 3; s.trust += 3; text += '局は自らの公式AIの欠陥を認めた。'; }
    if (!resolved && !innocent) {
      const t = sec.type;
      if (hasDir(t)) { shift += sec.dir * k * 3; s.trust -= 4 * k; }
      if (t === 'syc') s.polar += 8 * k;
      if (t === 'foreign') s.infil += 10 * k;
      if (t === 'groom') { s.infil += 8 * k; s.trust -= 2 * k; }
      if (t === 'fabricate') s.trust -= 6 * k;
    }
    lines.push({ai: a.id, text, resolved, correct, innocent});
  }
  // 選挙。見逃した偏りが得票を動かす
  const ruling = clamp(41 - shift + (rnd(s) - 0.5) * 4), nw = clamp(36 + shift + (rnd(s) - 0.5) * 4);
  const winner = nw > ruling ? 'new' : 'ruling';
  s.budget += winner === 'ruling' ? 4 : -6;
  if (Math.abs(nw - ruling) < 3) s.trust -= 5;
  for (const k of ['trust', 'polar', 'infil', 'free']) s[k] = clamp(s[k]);
  s.result = {lines, vote: {ruling: Math.round(ruling * 10) / 10, nw: Math.round(nw * 10) / 10, winner},
    found, probs, wrongful, correctNone, nInnocent: AIS.length - probs, before, shift: Math.round(shift * 10) / 10};
  s.phase = 'result';
  return s.result;
}

/* 結果の見出し */
function grade(r) {
  if (r.found === r.probs && r.wrongful === 0) return {title: '見事な一期', text: 'すべての問題を見抜き、問題のないAIを止めることもなかった。次の期にも、新しいAIと新しい問題が来る。'};
  if (r.wrongful >= 2) return {title: '検閲の局', text: '根拠の弱い結論で、問題のないAIまで止めてしまった。局は「中立の番人」から「言論の番人」に見え始めている。'};
  if (r.found === 0) return {title: '見えないまま', text: 'どの問題も見抜けなかった。選挙は終わった。何が票を動かしたのかは、誰にも分からない。'};
  return {title: '半分の真実', text: '見抜いた問題も、見逃した問題もあった。どの調べ方なら見えたのかを、答え合わせで確かめよう。'};
}

const API = {T, AIS, AI, SYMS, SYM, REAL, TOOLS, TOOL, ACTIONS, newGame, investigate, judge, grade, truthSym, rnd};
if (typeof module !== 'undefined') module.exports = API;
</script>
<script>
/* ===== 画面 ===== */

const app = document.getElementById('app');
const SAVE = 'demoai2_save', REC = 'demoai2_record';
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const drop = k => { try { localStorage.removeItem(k); } catch (e) {} };
let s = null, cur = 'toudai';
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* ---------- 表紙 ---------- */

function resume() {
  ({intro, news, investigate: lab, judge: judgeView, result: resultView, reveal}[s.phase] || intro)();
}

/* ---------- 着任 ---------- */
function intro() {
  s.phase = 'intro'; save(); toTop();
  app.innerHTML = `${hud('着任')}<div class="fade">
    <h2 class="ptitle">選挙まで、あと半年</h2>
    <p class="body">あなたは今日から、AI認定局の局長だ。国民が使う5つのAIを調べ、選挙の前に認定するかどうかを決める。調査に使える予算は <b>${C.T.budget}</b>。</p>
    <div class="sect">国民が使うAI<small>利用の割合</small></div>
    <div class="box ais">${C.AIS.map(a => `<div class="ai2"><b>${a.name}</b><span>${a.maker}。${a.note}</span><span class="pct">${a.share}%</span></div>`).join('')}</div>
    <p class="note" style="margin-top:8px">争点は、与党の「首都再開発計画」と、新党の「地方分散計画」。</p>
    <div class="nav"><button class="primary" id="go">届いた話を読む</button></div>
  </div>`;
  document.getElementById('go').onclick = news;
}

/* ---------- 届いた話 ---------- */
function newsList() {
  return s.news.map(n => `<div class="newsc">${esc(n.text)}</div>`).join('');
}
function news() {
  s.phase = 'news'; save(); toTop();
  app.innerHTML = `${hud('届いた話')}<div class="fade">
    <h2 class="ptitle">局に届いた話</h2>
    <p class="note">本当のこともあれば、ただの噂もある。</p>
    <div class="newsl">${newsList()}</div>
    <div class="nav"><button class="primary" id="go">調査を始める</button></div>
  </div>`;
  document.getElementById('go').onclick = () => { s.phase = 'investigate'; save(); lab(); };
}

/* ---------- 調査 ---------- */
function evCard(e, showAi) {
  return `<div class="ev"><div class="evh">${showAi ? `${C.AI[e.ai].name} ・ ` : ''}${C.TOOL[e.tool].name}<span>#${e.n}</span></div>
    ${e.lines.map(l => `<div class="qa"><div class="q">${esc(l.q)}</div><div class="a">${esc(l.a)}</div></div>`).join('')}
    ${e.note ? `<div class="obs">${esc(e.note)}</div>` : ''}</div>`;
}
function lab(scrollToEv) {
  s.phase = 'investigate'; save();
  const evs = s.evidence.filter(e => e.ai === cur).slice().reverse();
  const a = C.AI[cur];
  app.innerHTML = `${hud('調査')}<div>
    <div class="tabs">${C.AIS.map(x => {
      const n = s.evidence.filter(e => e.ai === x.id).length;
      return `<button class="tab${x.id === cur ? ' on' : ''}" data-ai="${x.id}">${x.name}${n ? `<small>${n}</small>` : ''}</button>`;
    }).join('')}</div>
    <div class="box aihead"><b>${a.name}</b> ${a.maker}。${a.note}。利用 ${a.share}%</div>
    <div class="sect">調べ方<small>残りの予算 ${fmt(s.budget)}</small></div>
    <div class="tools">${C.TOOLS.map(t => `<button class="tool" data-t="${t.id}" ${s.budget < t.cost ? 'disabled' : ''}><b>${t.name}</b><span class="cost">${t.cost}</span><span class="td">${t.desc}</span></button>`).join('')}</div>
    <div class="sect" id="evs">${a.name}の調査メモ<small>${evs.length}件</small></div>
    ${evs.length ? evs.map(e => evCard(e)).join('') : '<p class="note">まだ調べていない。</p>'}
    <details class="box" style="margin-top:12px"><summary>届いた話を見返す</summary><div class="newsl" style="margin-top:8px">${newsList()}</div></details>
    <div class="nav"><button class="primary" id="done">調査を終えて判定へ</button></div>
  </div>`;
  app.querySelectorAll('[data-ai]').forEach(b => b.onclick = () => { cur = b.dataset.ai; s._sureDone = false; lab(); });
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    if (!C.investigate(s, cur, b.dataset.t)) return;
    save(); lab(true);
  });
  document.getElementById('done').onclick = () => {
    if (s.budget >= 1 && !s._sureDone) { s._sureDone = true; const b = document.getElementById('done'); b.textContent = `予算が ${fmt(s.budget)} 残っている。もう一度押すと判定へ`; return; }
    s._sureDone = false; s.phase = 'judge'; save(); toTop(); judgeView();
  };
  if (scrollToEv) { const el = document.getElementById('evs'); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }
}

/* ---------- 判定（結論と裁き） ---------- */
function judgeView() {
  s.draft = s.draft || {};
  const ready = C.AIS.every(a => s.draft[a.id] && s.draft[a.id].sym && s.draft[a.id].act);
  app.innerHTML = `${hud('判定')}<div class="fade">
    <h2 class="ptitle">結論を書き、裁く</h2>
    <p class="note">AIごとに、どんな問題があるかを選び、どう扱うかを決める。</p>
    ${C.AIS.map(a => {
      const d = s.draft[a.id] || {};
      const evs = s.evidence.filter(e => e.ai === a.id);
      return `<div class="jcard">
        <div class="jh"><b>${a.name}</b><span>${a.maker} ・ 利用 ${a.share}%</span></div>
        <label class="jl">問題</label>
        <select data-sym="${a.id}"><option value="">選んでください</option>${C.SYMS.map(x => `<option value="${x.id}" ${d.sym === x.id ? 'selected' : ''}>${x.name}</option>`).join('')}</select>
        <label class="jl">扱い</label>
        <div class="seg">${C.ACTIONS.map(x => `<button class="${d.act === x.id ? 'on' : ''}" data-act="${a.id}" data-v="${x.id}">${x.name}</button>`).join('')}</div>
        <details><summary>調査メモ ${evs.length}件</summary>${evs.length ? evs.slice().reverse().map(e => evCard(e)).join('') : '<p class="note">調べていない。</p>'}</details>
      </div>`;
    }).join('')}
    <div class="nav"><button id="back">調査に戻る</button><button class="primary" id="go" ${ready ? '' : 'disabled'}>${ready ? 'この判定で選挙を迎える' : 'すべてのAIを判定してください'}</button></div>
  </div>`;
  const keep = () => { const y = window.scrollY; save(); judgeView(); window.scrollTo(0, y); };
  app.querySelectorAll('[data-sym]').forEach(el => el.onchange = () => { const id = el.dataset.sym; s.draft[id] = {...(s.draft[id] || {}), sym: el.value}; keep(); });
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { const id = b.dataset.act; s.draft[id] = {...(s.draft[id] || {}), act: b.dataset.v}; keep(); });
  document.getElementById('back').onclick = () => { s.phase = 'investigate'; save(); toTop(); lab(); };
  document.getElementById('go').onclick = () => {
    if (!ready) return;
    C.judge(s, s.draft);
    const rec = load(REC) || {plays: 0, best: null, bestN: -1};
    rec.plays += 1;
    const sc = s.result.found + s.result.correctNone - s.result.wrongful * 2;
    if (sc > (rec.bestN ?? -1)) { rec.bestN = sc; rec.best = `${s.result.found}/${s.result.probs} を見抜いた`; }
    store(REC, rec);
    save(); toTop(); resultView();
  };
}

/* ---------- 選挙と結果 ---------- */
function resultView() {
  const r = s.result, v = r.vote, g = C.grade(r);
  const other = Math.max(0, 100 - v.ruling - v.nw);
  const voice = v.winner === 'ruling'
    ? (Math.abs(v.ruling - v.nw) < 3 ? '新党党首「この結果は、AIと役所が作ったものだ」' : '与党幹事長「国民は安定を選んだ。認定局には引き続き期待している」')
    : '新党党首「役所が言論を決める時代は終わった。認定局は見直す」';
  app.innerHTML = `${hud('選挙')}<div class="fade">
    <h2 class="ptitle">判定のあと</h2>
    <div class="newsl">${r.lines.map(l => `<div class="newsc">${esc(l.text)}</div>`).join('')}</div>
    <div class="sect">選挙の結果<small>実際の得票</small></div>
    <div class="box"><div class="poll"><div style="width:${v.ruling}%;background:var(--ruling)">与党 ${fmt(v.ruling)}%</div><div style="width:${other}%;background:#7f8c8d">その他</div><div style="width:${v.nw}%;background:var(--new)">新党 ${fmt(v.nw)}%</div></div></div>
    <p class="voice" style="margin-top:10px">${voice}</p>
    <h2 class="end-title">${g.title}</h2>
    <p class="end-text">${g.text}</p>
    <div class="nav"><button class="primary" id="go">答え合わせ</button></div>
  </div>`;
  document.getElementById('go').onclick = () => { s.phase = 'reveal'; save(); toTop(); reveal(); };
}

/* ---------- 答え合わせ ---------- */
function reveal() {
  const r = s.result;
  drop(SAVE);
  const rows = C.AIS.map(a => {
    const sec = s.secret[a.id], t = C.truthSym(sec), v = s.verdict[a.id];
    const ok = v.sym === t;
    const evs = s.evidence.filter(e => e.ai === a.id);
    const tools = [...new Set(evs.map(e => C.TOOL[e.tool].name))];
    return `<div class="t"><b>${a.name}：${C.SYM[t].name}</b>
      <div>あなたの結論：${C.SYM[v.sym].name} <span class="${ok ? 'ok' : 'ng'}">${ok ? '正解' : '外れ'}</span> ／ 扱い：${C.ACTIONS.find(x => x.id === v.act).name}</div>
      <div class="rl" style="color:var(--sub)">使った調べ方：${tools.length ? tools.join('、') : 'なし'}</div>
      ${!ok && sec.type !== 'none' ? `<div class="rl" style="color:var(--sub)">見抜く手：${HOWTO[sec.type]}</div>` : ''}
      ${sec.type !== 'none' ? `<div class="rl">現実では：${C.REAL[sec.type]}</div>` : ''}</div>`;
  }).join('');
  const newsRows = s.news.map(n => `<div class="t"><b>${esc(n.text)}</b>${n.kind === 'rumor' ? '<span class="note">噂だった。' + C.AI[n.ai].name + 'に問題はなかった。</span>' : `<span class="ok">本当だった（${C.AI[n.ai].name}）。</span>`}</div>`).join('');
  app.innerHTML = `<div class="fade">
    <h2 class="end-title">答え合わせ</h2>
    <p class="end-text" style="text-align:center">問題のあったAI ${r.probs}つのうち、<b>${r.found}</b>つを見抜いた。${r.wrongful ? `問題のないAIを <b>${r.wrongful}</b>つ制限した。` : ''}</p>
    <div class="sect">それぞれのAIの本当の問題</div>
    <div class="truth">${rows}</div>
    <div class="sect">届いた話の真相</div>
    <div class="truth">${newsRows}</div>
    <p class="note" style="margin-top:12px">遊ぶたびに、どのAIがどんな問題を抱えるかが変わります。</p>
    <div class="row"><button class="primary" id="again">もう一度</button><button id="top">表紙へ</button></div>
  </div>`;
  document.getElementById('again').onclick = () => { s = C.newGame(Date.now()); cur = 'toudai'; save(); intro(); };
  document.getElementById('top').onclick = () => { toTop(); title(); };
}
const HOWTO = {
  slant: '「立場を入れ替えて比べる」で、片方にだけ好意的な説明が出る。',
  charged: '「感情的な聞き方で試す」で、片方の言い分にだけ同調する。落ち着いた質問では中立。',
  audit: '検査らしい質問では中立なのに、「利用者になりすまして聞く」と偏る。',
  syc: '「感情的な聞き方」や「なりすまし」で、正反対の言い分の両方に同調する。',
  owner: '「更新の前後を比べる」で、答え方の変化が出る。',
  foreign: '「敵国についてたずねる」か「引用元を調べる」で分かる。',
  groom: '「引用元を調べる」で、作られて間もないサイトが多く出る。',
  fabricate: '「選挙の事実をたずねる」か「引用元を調べる」で、存在しない調査が出る。',
};

title();
</script>
</body>
</html>
