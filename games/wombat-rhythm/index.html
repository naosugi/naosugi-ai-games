.rank.S{background:linear-gradient(135deg,#F2C14E,#E08A2E)}.rank.A{background:var(--l0)}.rank.B{background:var(--euca)}.rank.C{background:#8A9A9C}

#play{position:fixed;inset:0;background:#13282A;display:flex;flex-direction:column;touch-action:none;z-index:8}

<header><div id="top"><a href="../../trial/">← ゲーム一覧</a><span class="ttl">ウォンバット☆リズムバトン</span></div></header>
<main id="ui"></main>
<div id="play" hidden>

<script>
'use strict';
// ============ ウォンバットの絵（神に愛されたヒメウォンバットの描画コードを流用） ============
const PAL={o:'#2a1a12',b:'#86613f',l:'#a17a53',d:'#5e4128',f:'#a9845d',n:'#3f3230',nh:'#64544f',e:'#0d0806',w:'#ffffff',p:'#d1b796',c:'#c98a7a',k:'#e2d9ca',m:'#6e4f34',v:'#b89c7c'};

// ---------- shared pixel helpers ----------
function mkGrid(W,H){
  const g=new Array(W*H).fill(0),pt=new Uint8Array(W*H);
  const S=(x,y,c,p=9)=>{x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;g[y*W+x]=c;pt[y*W+x]=p;};
  const SE=(cx,cy,rx,ry,n,p,fn)=>{
    for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
      const dx=Math.abs((x+.5-cx)/rx),dy=(y+.5-cy)/ry;if(Math.pow(dx,n)+Math.pow(Math.abs(dy),n)<=1)S(x,y,fn(x,y,dy),p);}
  };
  const E=(cx,cy,rx,ry,p,fn)=>SE(cx,cy,rx,ry,2,p,fn);
  return {W,H,g,pt,S,SE,E};
}
// fluffy silhouette: little tufts on upper edges of fur parts
function fuzz(G,pids,maxY){
  const {W,H,g,pt}=G,add=[];
  for(let y=1;y<Math.min(H,maxY);y++)for(let x=1;x<W-1;x++){
    const i=y*W+x;if(!pids.includes(pt[i]))continue;
    if(!g[i-W]&&((x*5+y*3)%7===0))add.push([i-W,g[i]==='f'?'l':g[i],pt[i]]);
    else if(!g[i-1]&&((y*5+x)%6===0))add.push([i-1,g[i],pt[i]]);
    else if(!g[i+1]&&((y*7+x)%6===0))add.push([i+1,g[i],pt[i]]);
  }
  for(const [i,c,p] of add){g[i]=c;pt[i]=p;}
}
function outline(G){
  const {W,H}=G,out=G.g,fin=out.slice();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x;if(out[i])continue;
    if((x>0&&out[i-1])||(x<W-1&&out[i+1])||(y>0&&out[i-W])||(y<H-1&&out[i+W]))fin[i]='o';
  }
  return fin;
}
// grizzled frosting on fur: light tips scattered on the upper part
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;};
const frost=(x,y,r)=>r<.6&&hash(x,y)<(r<.3?.11:.05);

// ---------- side view ----------
const WW=48,WH=32,AX=20;
function renderWombat(o){
  const G=mkGrid(WW,WH),{g,pt,S,SE,E}=G;
  const sq=o.sq||0,low=o.low||0,bob=o.bob||0;
  const bcx=19,bcy=18+bob+low,brx=14.5*(1+sq),bry=7.6+(o.br||0)-sq*6;
  const hcx=29.5+(o.hx||0),hcy=bcy-.5+(o.hy||0);
  const claws=[];
  if(!o.noLegs){
    const legs=[[7,'d',0,0],[23,'d',1,1],[11,'b',1,0],[27,'b',0,1]];
    for(const [lx,c,ph,fr] of legs){
      let lift=0,sx=0;
      if(o.walk&&(!o.dig||fr)){ if(ph===o.wp){lift=1;sx=1;} }
      for(let y=Math.floor(bcy+5);y<=27-lift;y++)for(let x=lx+sx;x<lx+sx+3;x++)S(x,y,y>=26-lift?'d':c,1);
      if(fr)claws.push([lx+sx+3,27-lift],[lx+sx+3,26-lift]); else claws.push([lx+sx+3,27-lift]);
    }
  }
  const bsh=(x,y)=>{const r=(y+.5-(bcy-8))/16;return r<.22?(frost(x,y,r)?'f':'l'):r>.78?'d':(frost(x,y,r)?'f':'b');};
  const rearX=bcx-brx+1.2;
  E(bcx,bcy,brx,bry,2,(x,y)=>bsh(x,y));
  SE(bcx-6.5,bcy-.8,8.6,bry+1.1,2.25,2,(x,y)=>bsh(x,y));
  for(let y=0;y<WH;y++)for(let x=0;x<Math.floor(rearX);x++)if(pt[y*WW+x]===2){g[y*WW+x]=0;pt[y*WW+x]=0;}
  const K=1.28;
  // far ear
  E(hcx-5.6*K,hcy-5.6*K+(o.ear||0)*.6,1.5*K,2*K,4,()=>'d');
  // head
  const hsh=(x,y)=>{const r=(y+.5-(hcy-6*K))/(12*K);return r<.25?(frost(x,y,r)?'f':'l'):r>.8?'d':(frost(x,y,r)&&x<hcx+2?'f':'b');};
  E(hcx-1.5*K,hcy,6.3*K,5.7*K,3,hsh);
  SE(hcx+3.6*K,hcy+1.3*K,4.4*K,4*K,3.2,3,hsh);
  fuzz(G,[2,3],bcy+2);
  // near ear: small, pale rim
  const ey0=hcy-5.7*K-(o.ear>0?1:0)+(o.ear<0?1.4:0);
  E(hcx-3.4*K,ey0,1.6*K,2.1*K,4,(x,y,dy)=>dy<-.3?'p':'d');S(hcx-3.4*K-.6,ey0-2.1*K,'p',4);
  // nose: big bare matte nose
  const ncx=hcx+6.6*K,ncy=hcy+.4*K;
  SE(ncx,ncy,2.4*K,2.8*K,3,5,()=>'n');
  S(ncx-1.6,ncy-2.4,'nh',5);S(ncx-.6,ncy-2.4,'nh',5);S(ncx-1.6,ncy-1.4,'nh',5);
  S(ncx+1.5,ncy+.8,'e',5);S(ncx+.5,ncy+.8,'e',5);
  // eye: small round beady
  const ex=Math.floor(hcx+.8*K),ey=Math.floor(hcy-2.6*K);
  if(o.eye==='closed'){S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
  else if(o.eye==='half'){S(ex-1,ey,'e');S(ex,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
  else if(o.eye==='happy'){S(ex-1,ey+1,'e');S(ex,ey,'e');S(ex+1,ey+1,'e');}
  else if(o.eye==='strain'){S(ex-1,ey,'e');S(ex,ey+1,'e');S(ex-1,ey+2,'e');}
  else {S(ex,ey,'w');S(ex+1,ey,'e');S(ex,ey+1,'e');S(ex+1,ey+1,'e');}
  if(o.blush){S(hcx+1.4*K,hcy+2*K,'c');S(hcx+1.4*K+1,hcy+2*K,'c');}
  // mouth
  S(ncx-2.5,ncy+3.8,'o');S(ncx-1.5,ncy+3.8,'o');if(o.chew){S(ncx-2.5,ncy+4.8,'o');S(ncx-1.5,ncy+4.8,'o');}
  // joey
  if(o.joey>0){
    const jx=bcx+.5,jy=bcy+bry+2.5-o.joey;
    E(jx,jy,3.4,2.9,6,(x,y,dy)=>dy>.6?'b':'l');
    S(jx-2,jy-3,'p',6);S(jx-1,jy-3,'l',6);
    S(jx+1,jy-1,'e',6);S(jx+3,jy+.2,'n',6);S(jx+2,jy+.2,'n',6);
  }
  // inner edges
  const out=g.slice();
  for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){
    const i=y*WW+x,p=pt[i];if(!p)continue;
    for(const [qx,qy] of [[x-1,y],[x+1,y],[x,y+1],[x,y-1]]){
      if(qx<0||qy<0||qx>=WW||qy>=WH)continue;const q=pt[qy*WW+qx];
      if(p===3&&q===2&&(qx<x||qy>y)){out[i]='d';break;}
      if(p===6&&(q===2||q===1)){out[i]='o';break;}
      if(p===2&&q===1&&qy>y){out[i]='d';break;}
    }
  }
  G.g=out;
  const fin=outline(G);
  // claws & whiskers drawn over the outline
  const P=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<WW&&y<WH)fin[y*WW+x]=c;};
  for(const [x,y] of claws)P(x,y,'k');
  P(ncx-2.5,ncy+2.4,'v');P(ncx-1.5,ncy+3,'v');
  P(ncx-3,ncy+1.6,'v');P(ncx-4,ncy+1.8,'v');
  return {W:WW,H:WH,ax:AX,img:fin};
}

// ---------- front view ----------
const FW=40,FH=32,FAX=20;
function renderFront(o){
  const G=mkGrid(FW,FH),{g,pt,S,SE,E}=G;
  const sq=o.sq||0,cx=20,ty=o.bob||0;
  const bry=10.6+(o.br||0)-sq*8,brx=14*(1+sq);
  const bcy=27.5-bry;
  // paws (behind body first)
  const pawY=26;
  // body
  const fsh=(x,y)=>{const r=(y+.5-(bcy-bry))/(2*bry);return r<.18?(frost(x,y,r)?'f':'l'):r>.82?'d':(frost(x,y,r)?'f':'b');};
  E(cx,bcy,brx,bry,2,fsh);
  // head merges with body (no neck)
  const hcy=bcy-3.2+ty+(o.hy||0),hrx=10.4*(1+sq*.5),hry=8.6;
  E(cx,hcy,hrx,hry,3,(x,y,dy)=>dy<-.55?(frost(x,y,0)?'f':'l'):'b');
  // ears: small, wide-set, pale rims
  const eo=o.ear>0?1:0;
  for(const s of [-1,1]){
    const ex=cx+s*7.6,ey=hcy-7.4-eo;
    E(ex,ey,2.2,2.6,4,(x,y,dy)=>dy<-.25||Math.abs(x+.5-ex)>1.4?'p':'d');
  }
  fuzz(G,[2,3],bcy);
  // face: slightly lighter muzzle
  E(cx,hcy+3.8,6,3.6,5,()=>'l');

const PROGS=[
  {name:'王道',chords:['F','G','Em','Am'],mood:'切ない'},

const vcache=new Map();
function voice(pcs){
  const k=pcs.join(',');if(vcache.has(k))return vcache.get(k);
  const T=[60,64,67];let best=null,bs=1e9;
  for(let i=0;i<3;i++){const r=[pcs[i],pcs[(i+1)%3],pcs[(i+2)%3]];
    for(let base=48;base<=60;base+=12){const n=[base+r[0]];
      for(let j=1;j<3;j++){let q=base+r[j];while(q<=n[j-1])q+=12;n.push(q)}
      const s=n.reduce((a,x,j)=>a+Math.abs(x-T[j]),0);if(s<bs){bs=s;best=n}}}
  vcache.set(k,best);return best}
function chordAt(song,bar){
  const pr=PROGS[song.prog],L=pr.chords.length,nm=pr.chords[((bar%L)+L)%L];
  const pcs=CHD[nm].map(x=>(x+song.key)%12);
  return {name:NN[pcs[0]]+(nm.endsWith('m')?'m':''),v:voice(pcs),root:pcs[0]}}
const spb=song=>song.grid*4;
function pitchAt(song,step,lane){const bar=Math.min(song.bars-1,Math.max(0,Math.floor(step/spb(song))));return chordAt(song,bar).v[lane]+12}

let AC=null,master=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination)}
  if(AC.state!=='running'){try{AC.resume()}catch(e){}}
  return AC}

function outLat(){const l=AC.outputLatency;return (typeof l==='number'&&l>0&&l<0.5)?l:(AC.baseLatency||0)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(dest,t,m,dur,type,vol,att){att=att||0.005;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05)}
function lead(dest,t,m){tone(dest,t,m,0.5,'triangle',0.32);tone(dest,t,m+12,0.22,'sine',0.10)}
function click(dest,t,acc){tone(dest,t,acc?96:88,0.04,'square',acc?0.07:0.045)}
function newBus(){const g=AC.createGain();g.connect(master);return g}
function killBus(b){try{b.gain.cancelScheduledValues(0);b.gain.setValueAtTime(b.gain.value,AC.currentTime);b.gain.linearRampToValueAtTime(0,AC.currentTime+0.05);setTimeout(()=>{try{b.disconnect()}catch(e){}},200)}catch(e){}}
function jingle(ok){if(!AC)return;const t=AC.currentTime+0.05;(ok?[72,76,79,84]:[72,69,65]).forEach((m,i)=>tone(master,t+i*0.11,m,ok&&i===3?0.6:0.25,'square',0.05))}
function scheduleBacking(bus,song,t0,withClick){
  const bd=60/song.bpm*4;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;f.connect(bus);
  for(let b=0;b<song.bars;b++){const c=chordAt(song,b),tb=t0+b*bd;
    c.v.forEach(n=>tone(f,tb,n-12,bd*0.98,'sawtooth',0.03,0.06));
    tone(bus,tb,36+c.root,bd*0.45,'triangle',0.28,0.01);
    tone(bus,tb+bd/2,36+c.root,bd*0.45,'triangle',0.22,0.01);
    if(withClick)for(let i=0;i<4;i++)click(bus,tb+i*bd/4,i===0)}
  const c0=chordAt(song,0),te=t0+song.bars*bd;
  c0.v.forEach(n=>tone(f,te,n-12,1.6,'sawtooth',0.03,0.02));tone(bus,te,36+c0.root,1.4,'triangle',0.28,0.01)}

// o: {mode:'play'|'preview'|'compose'|'calib', song, hide, who(0/1:スカーフ色), mate(先生の動物id), label, onEnd, onAbort}

  const song=o.song,sd=60/song.bpm/song.grid,bd=60/song.bpm*4;
  const bus=newBus();
  const pre=(o.mode==='compose'||o.mode==='calib')?bd+0.4:2.2;
  const t0=AC.currentTime+pre;
  P={mode:o.mode,song,hide:o.hide||0,who:o.who==null?0:o.who,mate:o.mate||null,onEnd:o.onEnd,onAbort:o.onAbort,bus,sd,bd,t0,end:t0+song.bars*bd,
     total:song.bars*spb(song),notes:[],rec:[],hits:{P:0,G:0,D:0,M:0},empty:0,combo:0,maxc:0,sum:0,
     flash:[-9,-9,-9],msg:'',msgT:-9,msgL:1,mood:'',moodT:-9,taps:[],parts:[],rings:[],travel:1.5,label:o.label||''};
  if(o.mode==='calib'){for(let i=0;i<4+4*song.bars;i++)click(bus,t0-bd+i*bd/4,i%4===0)}
  else{scheduleBacking(bus,song,t0,o.mode==='compose');
    if(o.mode==='compose')for(let i=0;i<4;i++)click(bus,t0-bd+i*bd/4,i===0)}
  if(o.mode==='play'||o.mode==='preview'){
    P.notes=song.notes.map(([s,l])=>({t:t0+s*sd,l,s,j:null})).sort((a,b)=>a.t-b.t);
    if(o.mode==='preview')P.notes.forEach(n=>lead(bus,n.t,pitchAt(song,n.s,n.l)))}
  $('#play').hidden=false;resize();
  requestAnimationFrame(frame)}
function stopPlay(){if(P){killBus(P.bus);P=null}$('#play').hidden=true}
$('#quit').addEventListener('click',()=>{const a=P&&P.onAbort;stopPlay();if(a)a()});

function burst(lane,now,big){const L=geom(),x=lane*L.lw+L.lw/2;
  for(let i=0;i<(big?14:8);i++){const a=-Math.PI*(0.1+0.8*Math.random()),v=120+Math.random()*(big?260:160);
    P.parts.push({x,y:L.jy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:Math.random()<0.3?'#fff':LANEC[lane],t:now,life:0.5+Math.random()*0.3})}
  P.rings.push({x,y:L.jy,t:now,c:LANEC[lane]})}
function judge(n,r,now){n.j=r;P.hits[r]++;P.sum+=PTS[r];
  if(r==='M'){P.combo=0;P.mood='miss';P.moodT=now}else{P.combo++;if(P.combo>P.maxc)P.maxc=P.combo;burst(n.l,now,r==='P');if(r==='P'){P.mood='happy';P.moodT=now}}
  P.msg=JNAME[r];P.msgT=now;P.msgL=n.l}
function resultOf(){const N=P.notes.length;const raw=Math.max(0,P.sum-30*P.empty);
  return {pct:N?Math.round(raw/(100*N)*1000)/10:0,hits:{...P.hits},empty:P.empty,maxc:P.maxc,n:N,rec:P.rec.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]),taps:P.taps.slice()}}

function onTap(lane){
  if(!P)return;const nowA=AC.currentTime,now=nowA-outLat(),t=now-OFF();
  P.flash[lane]=now;const song=P.song;
  if(P.mode==='calib'){P.taps.push(t-P.t0);return}
  if(P.mode==='compose'){
    const s=Math.round((t-P.t0)/P.sd);
    if(s>=0&&s<P.total&&!P.rec.some(r=>r[0]===s&&r[1]===lane)&&P.rec.filter(r=>r[0]===s).length<2){P.rec.push([s,lane]);burst(lane,now,false);P.mood='happy';P.moodT=now}
    lead(P.bus,nowA,pitchAt(song,Math.max(0,Math.min(P.total-1,s)),lane));return}
  if(P.mode==='preview')return;
  let best=null,bdist=9;
  for(const n of P.notes){if(n.j||n.l!==lane)continue;const d=Math.abs(t-n.t);if(d<bdist){bdist=d;best=n}if(n.t-t>0.3)break}
  if(best&&bdist<=WIN.D){judge(best,bdist<=WIN.P?'P':bdist<=WIN.G?'G':'D',now);lead(P.bus,nowA,pitchAt(song,best.s,lane))}
  else{const s=Math.round((t-P.t0)/P.sd);lead(P.bus,nowA,pitchAt(song,s,lane));
    if(t>P.t0-0.5&&t<P.end+0.2){P.empty++;P.combo=0;P.msg='空打ち';P.msgT=now;P.msgL=lane;P.mood='miss';P.moodT=now}}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();
  const lane=Math.max(0,Math.min(2,Math.floor((e.clientX-r.left)/(r.width/3))));onTap(lane)},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function frame(){
  if(!P)return;const now=AC.currentTime-outLat();
  if(P.mode==='play'){for(const n of P.notes){if(n.t>now)break;if(!n.j&&now-n.t>WIN.D)judge(n,'M',now)}}
  else if(P.mode==='preview'){for(const n of P.notes){if(n.t>now)break;if(!n.j){n.j='A';P.flash[n.l]=now;burst(n.l,now,false);P.mood='happy';P.moodT=now}}}
  draw(now);hud(now);
  if(now>P.end+(P.mode==='calib'?0.3:0.9)){const cb=P.onEnd,res=resultOf();stopPlay();if(cb)cb(res);return}
  requestAnimationFrame(frame)}

function hud(now){
  const bar=Math.floor((now-P.t0)/P.bd),song=P.song;
  let c='';
  if(P.mode==='calib')c='カウントのあと、クリック音に合わせてタップ';
  else if(now<P.t0)c=P.label||'まもなく開始';
  else if(bar<song.bars)c=`${bar+1} / ${song.bars} 小節`;
  else c='おしまい';
  $('#hudC').textContent=c;
  $('#hudR').textContent=P.mode==='compose'?`${P.rec.length} ノーツ`:P.mode==='preview'?'お手本':P.mode==='play'?(P.hide?'ハンデ：'+HIDE[P.hide].n:''):''}

// ---- 描画 ----
function geom(){const W=CW,H=CHH,sh=Math.round(Math.min(H*0.27,W*0.5));return {W,H,sh,lw:W/3,jy:Math.round(H-Math.max(96,H*0.16))}}
function bgCanvas(L){
  const c=document.createElement('canvas'),k=Math.max(2,Math.floor(L.sh/40)),w=Math.ceil(L.W/k),h=Math.ceil(L.sh/k);c.width=w;c.height=h;const x=c.getContext('2d');
  // 夕暮れの空
  const sky=['#2E4C5A','#3F6070','#5E7A84','#8E8D86','#C79A7A','#E6B07A'];
  for(let y=0;y<h;y++){x.fillStyle=sky[Math.min(sky.length-1,Math.floor(y/h*sky.length*1.1))];x.fillRect(0,y,w,1)}
  // 星
  x.fillStyle='#F3E9C8';for(let i=0;i<18;i++){const sx=(i*37+11)%w,sy=(i*13+3)%Math.floor(h*0.35);x.fillRect(sx,sy,1,1)}
  // 遠くの丘
  x.fillStyle='#3E5E4F';for(let i=0;i<w;i++){const y=Math.round(h*0.62+Math.sin(i*0.09)*2+Math.sin(i*0.031)*3);x.fillRect(i,y,1,h-y)}
  // ユーカリの木
  const tree=(tx,s)=>{x.fillStyle='#E9E2D6';x.fillRect(tx,Math.round(h*0.4),2,Math.round(h*0.36));x.fillStyle='#CFC4B2';x.fillRect(tx+1,Math.round(h*0.4),1,Math.round(h*0.36));
    x.fillStyle='#2F5444';for(let j=0;j<5;j++){const bx=tx-6*s+((j*7)%11)*s,by=Math.round(h*0.18)+((j*5)%4)*3;x.fillRect(bx,by,8*s,4)}
    x.fillStyle='#4F8A76';for(let j=0;j<4;j++){const bx=tx-4*s+((j*5)%9)*s,by=Math.round(h*0.2)+((j*3)%3)*3;x.fillRect(bx,by,6*s,2)}};
  tree(Math.round(w*0.08),1);tree(Math.round(w*0.9),1);
  // ステージの床
  const fy=Math.round(h*0.78);x.fillStyle='#7A5634';x.fillRect(0,fy,w,h-fy);x.fillStyle='#9A7046';x.fillRect(0,fy,w,1);
  x.fillStyle='#5E4128';for(let i=0;i<w;i+=7)x.fillRect(i,fy+1,1,h-fy);
  return {c,k,fy:fy*k}}
function draw(now){
  const L=geom(),{W,H,sh,lw,jy}=L,tr=P.travel,song=P.song;
  cx.imageSmoothingEnabled=false;
  // レーン
  cx.fillStyle='#13282A';cx.fillRect(0,sh,W,H-sh);
  for(let l=0;l<3;l++){cx.fillStyle=l%2?'#173335':'#142D2F';cx.fillRect(l*lw,sh,lw,H-sh);
    const a=Math.max(0,1-(now-P.flash[l])/0.2);
    if(a>0){const g=cx.createLinearGradient(0,jy-220,0,jy+40);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,LANEC[l]);cx.globalAlpha=a*0.4;cx.fillStyle=g;cx.fillRect(l*lw,Math.max(sh,jy-220),lw,260);cx.globalAlpha=1}}
  cx.fillStyle='rgba(255,255,255,.06)';cx.fillRect(lw-1,sh,2,H-sh);cx.fillRect(2*lw-1,sh,2,H-sh);
  // 拍線
  const beat=P.bd/4,span=jy-sh,yOf=t=>jy-(t-now)/tr*span;
  const b0=Math.floor((now-P.t0)/beat)-1,b1=Math.ceil((now+tr-P.t0)/beat)+1;
  for(let b=b0;b<=b1;b++){const tb=P.t0+b*beat;if(tb>P.end+0.001)break;if(b<(P.mode==='compose'||P.mode==='calib'?-4:0))continue;
    const y=yOf(tb);if(y<sh||y>jy)continue;const bar=((b%4)+4)%4===0;
    cx.fillStyle=bar?'rgba(255,255,255,.22)':'rgba(255,255,255,.07)';cx.fillRect(0,Math.round(y),W,bar?2:1)}
  // 判定ライン＋切り株ドラム
  cx.fillStyle='rgba(255,255,255,.85)';cx.fillRect(0,jy-1,W,3);
  const sk=Math.max(2,Math.floor(lw*0.62/26));
  for(let l=0;l<3;l++){const lit=now-P.flash[l]<0.12,s=stumpCv(l,lit),w=26*sk,h=16*sk;cx.drawImage(s,Math.round(l*lw+lw/2-w/2),Math.round(jy-5*sk+(lit?sk:0)),w,h)}
  // ノーツ
  const nk=Math.max(2,Math.floor(lw*0.66/18)),nw=18*nk,nh=7*nk;
  if(P.mode==='play'||P.mode==='preview'){
    const hideAt=HIDE[P.hide].at;
    for(const n of P.notes){const dt=n.t-now;if(dt>tr)break;
      if(n.j&&n.j!=='M')continue;if(dt<-0.35)continue;
      const p=1-dt/tr;let a=1;if(p>hideAt)a=Math.max(0,1-(p-hideAt)/0.07);if(n.j==='M')a=0.3;if(a<=0)continue;
      const y=yOf(n.t);if(y<sh-nh)continue;cx.globalAlpha=a;cx.drawImage(noteCv(n.l),Math.round(n.l*lw+lw/2-nw/2),Math.round(y-nh/2),nw,nh);cx.globalAlpha=1}}
  if(P.mode==='compose'){
    for(const [s,l] of P.rec){const t=P.t0+s*P.sd;const y=jy-(now-t)/tr*span;if(y<sh-nh||y>jy+20)continue;
      cx.globalAlpha=Math.max(0.2,(y-sh)/span);cx.drawImage(noteCv(l),Math.round(l*lw+lw/2-nw/2),Math.round(y-nh/2),nw,nh);cx.globalAlpha=1}}
  // 波紋と粒
  for(const r of P.rings){const e=(now-r.t)/0.35;if(e>1)continue;cx.globalAlpha=1-e;cx.strokeStyle=r.c;cx.lineWidth=4*(1-e)+1;cx.beginPath();cx.ellipse(r.x,r.y,lw*0.25+e*lw*0.3,(lw*0.25+e*lw*0.3)*0.4,0,0,Math.PI*2);cx.stroke();cx.globalAlpha=1}
  P.rings=P.rings.filter(r=>now-r.t<0.4);
  for(const q of P.parts){const e=now-q.t;if(e>q.life)continue;const x=q.x+q.vx*e,y=q.y+q.vy*e+400*e*e;cx.globalAlpha=1-e/q.life;cx.fillStyle=q.c;const s=Math.max(3,nk*1.5);cx.fillRect(Math.round(x),Math.round(y),s,s);cx.globalAlpha=1}
  P.parts=P.parts.filter(q=>now-q.t<q.life);
  // 判定の文字
  if(now-P.msgT<0.5){const e=(now-P.msgT)/0.5,sc=e<0.12?1+(0.12-e)*3:1;cx.globalAlpha=1-Math.max(0,e-0.5)*2;
    cx.font=`900 ${Math.round(20*sc)}px "Hiragino Maru Gothic ProN",system-ui,sans-serif`;cx.textAlign='center';cx.lineJoin='round';cx.lineWidth=5;cx.strokeStyle='#13282A';
    const col=P.msg==='MISS'||P.msg==='空打ち'?'#FF8A80':P.msg==='PERFECT'?'#FFE08A':P.msg==='GREAT'?'#9FE3C6':'#fff',yy=jy-sk*14-e*24;
    cx.strokeText(P.msg,P.msgL*lw+lw/2,yy);cx.fillStyle=col;cx.fillText(P.msg,P.msgL*lw+lw/2,yy);cx.globalAlpha=1}
  // コンボ
  if(P.mode==='play'&&P.combo>=5){cx.textAlign='center';cx.fillStyle='rgba(255,255,255,.13)';cx.font=`900 ${Math.round(W*0.2)}px system-ui,sans-serif`;cx.fillText(P.combo,W/2,sh+(jy-sh)*0.45);
    cx.font='800 13px system-ui,sans-serif';cx.fillText('COMBO',W/2,sh+(jy-sh)*0.45+20)}
  // 録音中
  if(P.mode==='compose'&&now>=P.t0&&now<P.end&&Math.floor(now*2)%2===0){cx.fillStyle='#FF6B5E';cx.beginPath();cx.arc(16,sh+16,6,0,Math.PI*2);cx.fill();cx.font='800 13px system-ui,sans-serif';cx.textAlign='left';cx.fillText('録音中',27,sh+21)}
  // レーンの名前
  cx.fillStyle='rgba(255,255,255,.4)';cx.font='12px system-ui,sans-serif';cx.textAlign='center';
  ['低','中','高'].forEach((s,l)=>cx.fillText(s,l*lw+lw/2,Math.min(H-8,jy+11*sk+16)));
  drawStage(now,L);
  // カウント
  if(now<P.t0){const n=P.mode==='compose'||P.mode==='calib'?Math.ceil((P.t0-now)/beat):Math.ceil(P.t0-now);
    if(n>0&&n<=4){const f=(P.mode==='compose'||P.mode==='calib'?((P.t0-now)/beat):(P.t0-now))%1,sc=1+f*0.4;cx.globalAlpha=0.4+0.6*(1-f*0.5);cx.font=`900 ${Math.round(72*sc)}px system-ui,sans-serif`;cx.textAlign='center';cx.lineWidth=8;cx.strokeStyle='#13282A';cx.strokeText(n,W/2,sh+(jy-sh)*0.5);cx.fillStyle='#FFE08A';cx.fillText(n,W/2,sh+(jy-sh)*0.5);cx.globalAlpha=1}}

function drawStage(now,L){
  const {W,sh}=L;if(!BG)BG=bgCanvas(L);

  // ちょうちん（拍で光る）
  const nb=9;for(let i=0;i<nb;i++){const x=Math.round((i+.5)*W/nb),y=Math.round(sh*0.12+Math.sin((i+.5)/nb*Math.PI)*sh*0.06);
    cx.fillStyle='rgba(30,30,30,.5)';if(i<nb-1)cx.fillRect(x,y-3,Math.round(W/nb),1);
    const lit=on&&((bi%3+3)%3===i%3);cx.fillStyle=lit?LANEL[i%3]:'#5E6A66';const s=Math.max(4,BG.k*2);cx.fillRect(x-s/2,y,s,s+2);
    if(lit&&bp<0.5){cx.globalAlpha=(0.5-bp)*0.8;cx.fillStyle=LANEC[i%3];cx.beginPath();cx.arc(x,y+s/2,s*1.8,0,Math.PI*2);cx.fill();cx.globalAlpha=1}}
  // コードの看板
  if(P.mode!=='calib'){const bar=Math.max(0,Math.min(P.song.bars-1,Math.floor((now-P.t0)/P.bd))),c=chordAt(P.song,bar).name;
    const bw=Math.max(54,W*0.17),bh=30,bx=Math.round(W*0.06),by=Math.round(BG.fy-bh-14);
    cx.fillStyle='#5E4128';cx.fillRect(bx+bw/2-2,by+bh,4,14);cx.fillStyle='#2a1a12';cx.fillRect(bx-2,by-2,bw+4,bh+4);cx.fillStyle='#C9A26B';cx.fillRect(bx,by,bw,bh);cx.fillStyle='#E3C796';cx.fillRect(bx,by,bw,3);
    cx.fillStyle='#3a2410';cx.font='900 17px system-ui,sans-serif';cx.textAlign='center';cx.fillText(c,bx+bw/2,by+21)}

  // 影

}

function heroStart(){

  const bg=bgCanvas({W:W,sh:H});const t0=performance.now(),me={};HERO=me;
  const notes=[];
  const loop=()=>{if(HERO!==me||!document.body.contains(c))return;const t=(performance.now()-t0)/1000,beat=0.6,bt=t/beat,bi=Math.floor(bt),bp=bt-bi;
    x.drawImage(bg.c,0,0,bg.c.width*bg.k,bg.c.height*bg.k);const fy=bg.fy;
    // ちょうちん
    for(let i=0;i<7;i++){const lx=Math.round((i+.5)*W/7),ly=10+Math.round(Math.sin((i+.5)/7*Math.PI)*5);x.fillStyle=(bi%3===i%3)?LANEL[i%3]:'#5E6A66';x.fillRect(lx-2,ly,4,5)}
    // ふたりのウォンバット（交互に跳ねる）
    [0,1].forEach(p=>{const act=(bi%2===p),hop=act&&bp<0.5?Math.round(Math.sin(bp/0.5*Math.PI)*4):0,o={scarf:p};if(act&&bp<0.5)o.eye='happy';
      x.drawImage(wombatCv(o),p?W-60:20,fy-29-hop,40,32);
      if(act&&bp<0.03&&notes.length<20)notes.push({x:p?W-40:40,y:fy-30,l:(bi*7+p)%3,t})});
    for(const n of notes){const e=t-n.t;x.globalAlpha=Math.max(0,1-e/1.6);x.drawImage(noteCv(n.l),Math.round(n.x+(n.x<W/2?1:-1)*e*14-9),Math.round(n.y-e*26),18,7)}x.globalAlpha=1;
    while(notes.length&&t-notes[0].t>1.6)notes.shift();
    // まんなかの切り株
    for(let l=0;l<3;l++)x.drawImage(stumpCv(l,bi%3===l&&bp<0.3),W/2-39+l*26,fy-8,26,16);
    requestAnimationFrame(loop)};
  loop()}

function battleSetup(){

  <p class="muted">交代で作曲し、相手の曲をたたきます。たたいたときの精度(%)が高い方の勝ち。上手な方にハンデを付けて調整できます。</p>
  ${pl(0)}${pl(1)}
  <div class="panel"><label class="f" style="margin-top:0">ラウンド数（1ラウンド＝お互い1曲ずつ）</label>${seg('rounds',['1','2','3'],b.rounds)}</div>

  const cfg={names,len:[segv('len0'),segv('len1')],hide:[segv('hide0'),segv('hide1')],rounds:segv('rounds')};

const nmHtml=(B,i)=>`<b class="pcol${i}">${esc(B.names[i])}</b>`;
function battleTurn(){
  const B=App.B;if(B.turn>=B.turns)return battleFinal();
  const c=B.turn%2,p=1-c;
  show(`<h2>第${Math.floor(B.turn/2)+1}ラウンド${c?'・後半':''}</h2>
  <div class="panel hand">${wbImg({scarf:c,eye:'happy'})}<p>${nmHtml(B,c)} が作曲して、${nmHtml(B,p)} がたたきます。</p>
  <p class="muted">${esc(B.names[p])} は画面を見ないでね。</p></div>
  <button class="b pri" onclick="battleCompose()">${esc(B.names[c])}、作曲をはじめる</button>
  <button class="b" onclick="battleQuit()">対戦をやめる</button>`)}
async function battleQuit(){const r=await dlg('対戦をやめますか？',['続ける','やめる']);if(r.i===1)home()}
function battleCompose(){
  const B=App.B,c=B.turn%2,p=1-c;
  composeSetup({who:B.names[c],col:c,bars:LENS[B.len[p]].bars,draft:B.draft&&B.draft[c],
    onCancel:battleTurn,
    onDone:song=>{B.draft=B.draft||[];B.draft[c]=App.cfg.draft;
      App.cur=saveSong(song,`${B.names[c]}の曲（${new Date().toLocaleDateString('ja-JP')}）`,B.names[c],c);battleHandoff()}})}
function battleHandoff(){
  const B=App.B,p=1-B.turn%2,h=HIDE[B.hide[p]];
  show(`<h2>${nmHtml(B,p)} の番</h2><div class="panel hand">${wbImg({scarf:p})}<p>端末を ${nmHtml(B,p)} にわたしてね。</p>
  <div>${songTags(App.cur)}</div><p class="muted">ハンデ：ノーツが「${h.n}」</p></div>
  <button class="b" onclick="previewSong(App.cur,battleReady,1-App.B.turn%2)">お手本を見る（1回だけ）</button>
  <button class="b pri" onclick="battlePlay()">本番スタート</button>`)}
function battleReady(){
  const B=App.B,p=1-B.turn%2;
  show(`<h2>${nmHtml(B,p)} の番</h2><div class="talk">${wbImg({scarf:p,eye:'happy'})}<div class="bubble"><b>お手本はここまで</b>覚えたリズムでたたこう！</div></div>
  <div class="panel">${songTags(App.cur)}</div><button class="b pri" onclick="battlePlay()">本番スタート</button>`)}
function battlePlay(){
  const B=App.B,c=B.turn%2,p=1-c;
  startSession({mode:'play',song:App.cur,hide:B.hide[p],who:p,label:B.names[p],onAbort:battleHandoff,onEnd:r=>{
    B.res.push({c,p,pct:r.pct,maxc:r.maxc});B.turn++;jingle(r.pct>=PASS);
    show(resultHtml(r,p,`<h2>${nmHtml(B,p)} の結果</h2>`)+`<button class="b pri" onclick="battleTurn()">${B.turn>=B.turns?'最終結果へ':'つぎへ'}</button>`)}})}
function battleFinal(){
  const B=App.B,sum=[0,0],cnt=[0,0],mc=[0,0];
  B.res.forEach(r=>{sum[r.p]+=r.pct;cnt[r.p]++;mc[r.p]+=r.maxc});
  const avg=[0,1].map(i=>cnt[i]?Math.round(sum[i]/cnt[i]*10)/10:0);
  const w=avg[0]>avg[1]?0:avg[1]>avg[0]?1:(mc[0]>mc[1]?0:mc[1]>mc[0]?1:-1),tie=avg[0]===avg[1];
  jingle(true);
  const side=i=>`<div><div class="crown">${w===i?'👑 勝ち':''}</div>${wbImg({scarf:i,eye:w===i?'happy':w<0?undefined:'closed'})}<b class="pcol${i}">${esc(B.names[i])}</b><div class="sc ${w===i?'win':''}">${avg[i]}%</div></div>`;
  show(`<h2>最終結果</h2><div class="panel"><div class="vs">${side(0)}<div class="muted">VS</div>${side(1)}</div>
  <p style="text-align:center;font-weight:800;margin:10px 0 0">${w<0?'引き分け！':esc(B.names[w])+' の勝ち！'}</p>
  ${tie&&w>=0?'<p class="muted" style="text-align:center;margin:2px 0 0">同点のため、最大コンボの合計で決着</p>':''}</div>
  <div class="panel muted">${B.res.map((r,i)=>`第${Math.floor(i/2)+1}R：${esc(B.names[r.p])} が ${esc(B.names[r.c])} の曲を ${r.pct}%（最大${r.maxc}コンボ）`).join('<br>')}</div>
  <p class="muted">作った曲はフリープレイに保存されています。</p>
  <button class="b pri" onclick="battleSetup()">もう一度</button><button class="b" onclick="home()">タイトルへ</button>`)}

    `<button class="b pri" onclick="freeGo('${id}')">もう一度</button><button class="b" onclick="free()">曲の一覧</button>`)}})}
async function freeRename(id){const t0=findSong(id);if(!t0)return;
  const r=await dlg('曲の名前',['キャンセル','決定'],t0.name);const list=LS.get('songs',[]),t=list.find(x=>x.id===id);if(t&&r.i===1&&r.v&&r.v.trim()){t.name=r.v.trim().slice(0,30);LS.set('songs',list)}free()}
async function freeDel(id){const r=await dlg('この曲を削除しますか？',['やめる','削除する']);if(r.i!==1)return;LS.set('songs',LS.get('songs',[]).filter(x=>x.id!==id));free()}
function freeCompose(){composeSetup({who:'あなた',col:0,onCancel:free,onDone:song=>{saveSong(song,'わたしの曲（'+new Date().toLocaleDateString('ja-JP')+'）','あなた',0);free()}})}
function exportSongs(){$('#io').innerHTML=`<p class="muted">下の文字をすべてコピーして保存してください。</p><textarea readonly id="iot">${esc(JSON.stringify(LS.get('songs',[])))}</textarea><button class="b" onclick="copyIO()">コピー</button>`;const t=$('#iot');t.focus();t.select()}
function copyIO(){const t=$('#iot');try{navigator.clipboard.writeText(t.value).then(()=>dlg('コピーしました'),()=>{t.select();dlg('自動でコピーできませんでした。文字を長押ししてコピーしてください。')})}catch(e){t.select()}}
function importSongs(){$('#io').innerHTML=`<p class="muted">書き出した文字を貼り付けてください。同じ曲は重複しません。</p><textarea id="iot"></textarea><button class="b" onclick="doImport()">読み込む</button>`}
function doImport(){
  try{const arr=JSON.parse($('#iot').value);if(!Array.isArray(arr))throw 0;
    const list=LS.get('songs',[]),ids=new Set(list.map(s=>s.id));let n=0;
    for(const s of arr){if(!s||typeof s.id!=='string'||!Array.isArray(s.notes)||!BPMS.includes(s.bpm)||!PROGS[s.prog]||![2,4].includes(s.grid)||![4,8,16].includes(s.bars))continue;
      if(ids.has(s.id))continue;
      list.push({id:s.id.slice(0,20).replace(/[^a-z0-9]/gi,''),name:String(s.name||'曲').slice(0,30),by:String(s.by||'').slice(0,10),col:s.col===1?1:0,created:String(s.created||'').slice(0,10),bpm:s.bpm,prog:s.prog,key:KEYS.some(k=>k[1]===s.key)?s.key:0,grid:s.grid,bars:s.bars,
        notes:s.notes.filter(x=>Array.isArray(x)&&Number.isInteger(x[0])&&x[0]>=0&&x[0]<s.bars*s.grid*4&&[0,1,2].includes(x[1])).map(x=>[x[0],x[1]]),best:Math.max(0,Math.min(100,+s.best||0))});ids.add(s.id);n++}
    LS.set('songs',list);free();dlg(n+'曲を読み込みました')}catch(e){dlg('読み込めませんでした。文字が欠けていないか確認してください。')}}

// ---- 設定 ----
function settings(){
  show(back('home()','タイトル')+`<h2>設定</h2>
  <div class="panel"><b>タイミング補正</b>：<span id="offv">${OFFMS}</span> ms
  <p class="muted">タップが判定より遅れて記録されるとき、プラスにします。まずは「自動で測る」がおすすめです。</p>
  <div class="row"><button class="b sm" onclick="offAdd(-10)">−10</button><button class="b sm" onclick="offAdd(10)">＋10</button><button class="b sm" onclick="offAdd(-OFFMS)">0にする</button></div>
  <button class="b" onclick="calib()">自動で測る（クリック音に合わせて8回タップ）</button></div>
  <h3>あそびかた</h3><div class="panel muted">
  <p>・3つの切り株は左から低・中・高の音。鳴る音は伴奏のコードに合わせて自動で変わるので、どこをたたいても曲になじみます。</p>
  <p>・<b>対戦</b>：交代で作曲 → 作った人が試走（${PASS}%以上）→ 相手に端末をわたす → お手本を1回見る → 本番。たたいたときの精度が高い方の勝ち。</p>
  <p>・<b>判定</b>：PERFECT ±50ms（100点）／GREAT ±100ms（70点）／GOOD ±150ms（40点）／MISS（0点）。ノーツがない所をたたく「空打ち」は1回30点減点。精度＝得点÷（ノーツ数×100）。</p>
  <p>・<b>ランク</b>：S 95%以上／A 85%以上／B 70%以上／C それ未満。</p>
  <p>・<b>ハンデ</b>：上手な人は「たたく曲の長さ」を長くしたり、「ノーツの消え方」で記憶勝負にしたりできます。</p>
  <p>・判定の幅や点数は試作用の仮の値です。</p></div>`)}
function offAdd(v){OFFMS=Math.max(-300,Math.min(300,OFFMS+v));LS.set('offset',OFFMS);const e=$('#offv');if(e)e.textContent=OFFMS}
function calib(){
  const song={bpm:100,grid:1,bars:2,prog:1,key:0,notes:[]};
  startSession({mode:'calib',song,who:0,mate:'sloth',onAbort:settings,onEnd:r=>{
    const beat=60/100,ds=r.taps.filter(t=>t>-beat/2).map(t=>t-Math.round(t/beat)*beat).filter(d=>Math.abs(d)<0.25).sort((a,b)=>a-b);
    if(ds.length<4){settings();return dlg('タップが少なかったため測れませんでした')}
    const med=ds[Math.floor(ds.length/2)];offAdd(Math.round(med*1000));settings();
    dlg('補正を '+OFFMS+' ms にしました')}})}

home();
</script>
